name: gates

# The fast gates: no emulator, no boot. These should stay under a couple of
# minutes so they can run on every push to every branch.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lang:
    name: language (interp vs C backend vs native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang nasm llvm

      - name: build the zl toolchain
        run: ./build.sh

      - name: run_tests.sh
        run: |
          set -o pipefail
          ./run_tests.sh 2>&1 | tee gate.log

      # run_tests.sh prints "skip" and still exits 0 when a dependency is
      # missing. A skipped check that reports green is the exact failure mode
      # this repo has been bitten by before, so it must not pass silently.
      #
      # But not every skip is a dependency problem: calc_repl is an interactive
      # REPL and can never run non-interactively. That one is structural and
      # permanent. Anything else means a tool we believe we installed is absent,
      # and on a runner that is a real failure.
      - name: a skipped check is not a passing check
        run: |
          unexpected=$(grep -iE '^[[:space:]]*skip' gate.log | grep -v 'calc_repl' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::a check skipped instead of running:"
            echo "$unexpected"
            exit 1
          fi
          echo "only the known-structural skip (calc_repl) was reported"

  selfhost:
    name: the compiler still reproduces itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang nasm llvm
      - run: ./build.sh
      # The fixpoint check lived in verify.ps1 and did not survive the port from
      # Windows, so from the port until 2026-08-19 nothing checked the language's
      # central property. f(f(x)) == f(x): the interpreter compiles compiler.zl,
      # that output is built, and it must compile the same source byte for byte.
      - run: ./verify_selfhost.sh

  parity:
    name: the engines implement the same language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang nasm llvm
      - run: ./build.sh
      # run_tests.sh cross-checks the C backend on every tests/*.zl, but only
      # smoke-tests compilel with a list-and-string program - which never
      # assigns to a global from inside a function, the one place the engines
      # actually disagree. This runs the corner cases through all four.
      - run: tools/engine-parity.sh

  fmt:
    name: formatter is byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build.sh builds the whole toolchain, not just zlfmt, so it needs the
      # same packages as the lang job - a short list here left zlfmt unbuilt
      # and verify_fmt.sh exited 2.
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang nasm llvm
      - run: ./build.sh
      - run: ./verify_fmt.sh

  hazards:
    name: recorded hazard classes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang nasm llvm

      # check 5 cross-checks interp against the C backend, so it needs them built
      - run: ./build.sh

      - name: hazard scan
        run: tools/hazard-scan.sh

      # The truncation count is clang-version dependent - the runner and Roy's
      # Kali box disagree (37 vs 34) purely on compiler version, so a fixed
      # baseline number cannot be the gate. Comparing base against HEAD inside
      # ONE container removes the compiler from the question entirely, and asks
      # the only thing that matters: did this change add any?
      - name: did this change add truncation sites?
        if: github.event_name == 'pull_request'
        run: |
          head_n=$(tools/hazard-scan.sh --count)
          git worktree add -q /tmp/base "${{ github.event.pull_request.base.sha }}"
          if [ -x /tmp/base/tools/hazard-scan.sh ]; then
            base_n=$(cd /tmp/base && tools/hazard-scan.sh --count)
          else
            base_n="$head_n"   # gate did not exist on base; nothing to compare
          fi
          echo "base=$base_n head=$head_n (same container, same clang)"
          if [ "$head_n" -gt "$base_n" ]; then
            echo "::error::this PR adds $((head_n - base_n)) pointer-truncation site(s) to the EFI build"
            exit 1
          fi
          [ "$head_n" -lt "$base_n" ] && echo "::notice::this PR removes $((base_n - head_n)) truncation site(s)"
          echo "no new truncation sites"
