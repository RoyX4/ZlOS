name: gates

# The fast gates: no emulator, no boot. These should stay under a couple of
# minutes so they can run on every push to every branch.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lang:
    name: language (interp vs C backend vs native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang nasm llvm

      - name: build the zl toolchain
        run: ./build.sh

      - name: run_tests.sh
        run: |
          set -o pipefail
          ./run_tests.sh 2>&1 | tee gate.log

      # run_tests.sh prints "skip" and still exits 0 when a dependency is
      # missing. A skipped check that reports green is the exact failure mode
      # this repo has been bitten by before, so it must not pass silently.
      #
      # But not every skip is a dependency problem: calc_repl is an interactive
      # REPL and can never run non-interactively. That one is structural and
      # permanent. Anything else means a tool we believe we installed is absent,
      # and on a runner that is a real failure.
      - name: a skipped check is not a passing check
        run: |
          unexpected=$(grep -iE '^[[:space:]]*skip' gate.log | grep -v 'calc_repl' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::a check skipped instead of running:"
            echo "$unexpected"
            exit 1
          fi
          echo "only the known-structural skip (calc_repl) was reported"

  fmt:
    name: formatter is byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang
      - run: ./build.sh
      - run: ./verify_fmt.sh

  hazards:
    name: recorded hazard classes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hazard scan
        run: tools/hazard-scan.sh
