name: docs

# Keep the derived docs true, automatically.
#
# TODO.md and docs/JOURNAL.md are generated from measurement, so they are only
# useful if they are current. The local post-commit hook refreshes them on this
# machine; this does it for main, so the repository is right even when a commit
# lands from somewhere the hook is not installed.
#
# On a pull request it only CHECKS, and never writes - pushing commits onto
# someone's PR branch while they are working on it is a good way to lose work.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  docs:
    name: docs match the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang nasm llvm

      # doc-check runs registered claims, several of which execute zl through
      # the interpreter and the LLVM backend, so the toolchain has to exist.
      - run: ./build.sh

      - name: are the docs still true?
        run: tools/doc-check.sh

      - name: regenerate the derived docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/todo.sh
          tools/journal.sh HEAD || true

      # On a PR: report drift, change nothing.
      - name: report drift
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain TODO.md docs/JOURNAL.md)" ]; then
            echo "::notice::TODO.md or docs/JOURNAL.md are out of date - run tools/todo.sh"
            git --no-pager diff --stat TODO.md docs/JOURNAL.md
          else
            echo "derived docs are current"
          fi

      # On main: commit the refresh back, so the repo is right by default.
      - name: commit the refresh
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain TODO.md docs/JOURNAL.md)" ]; then
            echo "nothing to update"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md docs/JOURNAL.md
          # [skip ci] matters: without it this push retriggers every workflow,
          # including this one, which would then push again.
          git commit -m "docs: refresh TODO.md and JOURNAL.md [skip ci]"
          git push
