name: boot

# The four boot paths, in parallel, on runners that are not Roy's laptop.
#
# This exists because of a specific, recorded failure: three gates were green
# while the 64-bit build was dead, since nothing exercised kernel/efi.c or the
# path a real laptop takes. Running all four by hand costs ~5 minutes of a
# 4-core box, so in practice they did not all get run. CI does not get bored.
#
# Wall clock here is roughly the slowest single gate, not their sum.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  boot:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one dead boot path must not hide the other three
      matrix:
        include:
          - name: "bios32 — 32-bit multiboot vs golden transcript"
            script: kernel/verify.sh
          - name: "raw — our own bootloader"
            script: kernel/tools/checks/verify-raw.sh
          - name: "iso — GRUB, BIOS and UEFI"
            script: kernel/tools/checks/verify-iso.sh
          - name: "efi — zlOS as its OWN UEFI app (the ThinkPad path)"
            script: kernel/tools/checks/verify-efi.sh

    steps:
      - uses: actions/checkout@v4

      - name: install toolchain and emulators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl gcc gcc-multilib clang nasm llvm lld \
            qemu-system-x86 ovmf \
            mtools dosfstools gdisk parted \
            xorriso grub-pc-bin grub-efi-amd64-bin
          # buildefi.sh links BOOTX64.EFI with lld-link (PE32+), and mkusb.sh
          # builds the ESP with mkfs.vfat + mcopy + sgdisk + parted. Missing any
          # of them fails as "the UEFI image did not build", which says nothing
          # about which - so assert them by name before spending a boot on it.
          for t in lld-link mkfs.vfat mcopy mmd sgdisk parted; do
            command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }
          done

      - name: confirm the firmware the EFI gates need is actually present
        run: |
          ls -la /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_VARS_4M.fd

      - name: build the zl toolchain
        run: ./build.sh

      # The EFI receipts join live QEMU markers to process-memory, PMM and
      # page-table host evidence.  build-identity.json deliberately includes
      # the exact compiler/toolchain, so a receipt produced on Kali is foreign
      # to an Ubuntu runner even when the source tree is byte-identical.  Build
      # and execute the host inventory on this runner before attempting that
      # join; copying the checked-in receipt would turn a different toolchain
      # into false "current build" evidence.
      - name: build current-runner host evidence required by EFI receipts
        if: matrix.script == 'kernel/tools/checks/verify-efi.sh'
        run: |
          ax201_fixture="$RUNNER_TEMP/iwlwifi-QuZ-a0-hr-b0-77.ucode"
          curl -fsSL \
            'https://gitlab.com/kernel-firmware/linux-firmware/-/raw/20260519/intel/iwlwifi/iwlwifi-QuZ-a0-hr-b0-77.ucode' \
            -o "$ax201_fixture"
          echo '69ca0913ccca609dedff5e30b1d478482487fa14ad6b7be079f8cc856ac26cac  '"$ax201_fixture" \
            | sha256sum -c -
          sudo install -Dm0644 "$ax201_fixture" \
            /lib/firmware/intel/iwlwifi/iwlwifi-QuZ-a0-hr-b0-77.ucode
          python3 kernel/tools/generators/gen-build-identity.py --write --selftest
          kernel/tests/host/build.sh
          python3 kernel/tools/generators/gen-test-inventory.py --write --selftest
          python3 kernel/tools/run/run-host-tests.py --run --selftest

      - name: ${{ matrix.script }}
        run: |
          set -o pipefail
          ${{ matrix.script }} 2>&1 | tee boot.log

      # verify-efi proves the boot-integrated scheduler selftest. This second
      # route drives the real desktop commands against an external zlfs image,
      # so a host-only service or a hard-coded boot marker cannot satisfy it.
      - name: persistent user-process command route
        if: matrix.script == 'kernel/tools/checks/verify-efi.sh'
        run: |
          set -o pipefail
          python3 kernel/tools/probes/probe-user-process.py \
            --no-build \
            --receipt kernel/docs/receipts/user-process-command-native-uefi64-qemu-2026-09-03.json \
            2>&1 | tee -a boot.log

      # Every verify-*.sh degrades to `echo "skip: ..."; exit 0` when qemu, nasm
      # or OVMF is missing. That produces a green check for a boot that never
      # happened — which is precisely the bug class this workflow exists to kill.
      - name: a skipped boot is not a passing boot
        run: |
          if grep -qiE '^\s*skip:' boot.log; then
            echo "::error::this gate skipped instead of booting:"
            grep -iE '^\s*skip:' boot.log
            exit 1
          fi
          echo "gate actually ran"

      - name: retain the remote user-process receipt
        if: always() && matrix.script == 'kernel/tools/checks/verify-efi.sh'
        uses: actions/upload-artifact@v4
        with:
          name: user-process-command-receipt
          path: kernel/docs/receipts/user-process-command-native-uefi64-qemu-2026-09-03.json
          if-no-files-found: ignore

      - name: keep the transcript on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ strategy.job-index }}
          path: |
            boot.log
            kernel/*.out
            kernel/*.log
            kernel/docs/receipts/user-process-command-native-uefi64-qemu-2026-09-03.json
          if-no-files-found: ignore
