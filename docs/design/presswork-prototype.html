<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRESSWORK / zlOS living prototype</title>
<style>
/* ======================================================================
   PRESSWORK - design.h
   ----------------------------------------------------------------------
   GRAPHITE IS THE BASE AND THE STRUCTURE. PAPER IS THE CHARACTER.
   Dark is PRIMARY and dark is :root. The light ladder is derived and
   lives in :root[data-theme="light"], with every token name identical.
   A name in one mode only is a defect; the settings pane checks for it
   at runtime and prints the count.

   THE ONE STRUCTURAL DECISION - resolution 1, WIDEN THE LADDER.

   Graphite's own settings pane admits its four surface steps sit at
   1.073 / 1.126 / 1.089 / 1.077 : 1, every one below perceptual
   threshold, and that the entire separation budget is spent on 1px runs.
   That is why its focus signal is weak and why its implementer flagged
   ZD_EDGE_OVER as clearing the 3:1 floor by only 4%.

   PRESSWORK keeps the ground (ZD_BASE is #322B27 unchanged, L* 18.15),
   keeps the one raking light from off-screen upper left, keeps the
   lit/cut grammar and keeps "the occluder draws the border". It rejects
   the sub-threshold ladder and widens the steps until a knockout has a
   rung to live on. Then it takes PLATE's knockout across intact.

   THE WIDENING IS ASYMMETRIC BECAUSE THE ARITHMETIC IS ASYMMETRIC.
   ZD_BASE has Y = 0.02552. Below it the total room to pure black is
   (0.02552 + 0.05) / 0.05 = 1.5105:1 - three rungs must share that.
   Above it the room is 1.05 / 0.07552 = 13.903:1. So PRESSWORK spends
   downward the little that exists (CUT lands at 1.4723:1 on BASE, which
   is 97.5% of everything there is) and takes the rest upward.

   THE FINDING THAT MADE THE KNOCKOUT SAFE.
   Pick ZD_KNOCK so that ZD_LIT computes the SAME ratio against the
   knockout as it does against the ground, and the sign-inversion problem
   stops being a problem:

     ZD_LIT on ZD_BASE    2.5423:1   the struck run, lighter term
     ZD_LIT on ZD_KNOCK   2.5487:1   the cut groove, darker term
     difference           0.25%

   One value, two roles, identical loudness. On graphite's own ladder the
   same experiment gives 1.9931:1 as a lit run and 5.9822:1 as a groove
   against PLATE's #F2EDE4 header - a 3.00x loudness inversion, which is
   exactly the failure deciding.md C2 names. Here the light does not
   invert its loudness because the ladder was widened until it could not.

   ZD_KNOCK lands at 6.4796:1 on ZD_BASE, which is 46.6% of the upward
   ceiling. Graphite's loudest element of any kind was ZD_STEEL at
   6.1881:1, so the knockout is 4.7% louder than something graphite
   already drew. PLATE's knockout on graphite's ladder would have been
   11.9231:1 - 92% louder. That difference is the whole design.

   WHAT THE WIDENING COSTS, measured and not waved at:
     1  Graphite's premise is deleted. "The surfaces do not separate
        themselves and that is the premise" is no longer true: the
        smallest surface step goes 1.0728 -> 1.1682, and the 1px runs
        stop being load-bearing. They confirm the plate; they no longer
        constitute it. Subtlety was the charm and it is gone.
     2  The ink ramp compresses. The lightest text-bearing surface moves
        from L* 23.21 to L* 29.41, the 4.5:1 floor moves with it, and the
        four text rungs go from spanning 30.1 L* points to 19.1 - a 37%
        loss of range.
     3  There is no room left below the ground, ever. 1.4723 of 1.5105.
   ====================================================================== */
:root {
  /* ------------------------------------------------ surfaces, graphite
     Six surface rungs and two edge values. ZD_BASE is graphite's own
     ground, unchanged, because it is the thing that was working. */
  --zd-cut:        #0A0300;  /* L*  1.17  the groove, and the strip ground */
  --zd-well:       #17100C;  /* L*  5.23  sunken                            */
  --zd-void:       #241D19;  /* L* 11.44  the field / the desk              */
  --zd-base:       #322B27;  /* L* 18.15  the plate. UNCHANGED from graphite*/
  --zd-raise:      #413A36;  /* L* 25.00  on a plate, and the rail          */
  --zd-float:      #4B4440;  /* L* 29.41  off the plane: menus, toasts      */
  --zd-litsoft:    #5C5551;  /* L* 36.68  the grazed left run               */
  --zd-lit:        #6F6864;  /* L* 44.52  the struck top run, 2.5423:1      */

  /* ZD_EDGE_OVER - graphite's one invented token, kept, and re-solved on
     the wider ladder. The occluder draws the border, never the occluded.
     Worst case is a plate lying on ZD_FLOAT: 3.4322:1, clearing the 3:1
     floor by 14.4% where graphite cleared it by 4%. */
  --zd-edge-over:  #A09A95;

  /* ZD_KNOCK - the focused window's header, solid, title reversed out.
     PLATE's move, imported whole. 6.4796:1 on ZD_BASE. */
  --zd-knock:      #B6B0AB;
  /* ZD_KO_EDGE - the knockout's own edge run. In dark it resolves to
     exactly ZD_LIT's value and lies on the BOTTOM of the header, because
     on the knockout the downward direction has the headroom (9.79:1
     available down, 2.15:1 up). Same lamp, same rule, other side. */
  --zd-ko-edge:    #6F6864;
  --zd-knock-ink:  #181411;  /* title reversed out,  8.53:1 on the knockout */
  --zd-knock-ink2: #46413D;  /* secondary on it,     4.70:1                 */

  /* ------------------------------------------------------------- ink
     FOUR rungs, not five. The widened ladder ate the fifth: at ZD_FLOAT
     L* 29.41 the 4.5:1 floor sits at L* 72.4, so the old ZD_TEXT_3 no
     longer clears it. ZD_TEXT_INERT survives as a token but is
     STRUCTURE ONLY - rules, gutters, disabled marks, never running text. */
  --zd-text-0:     #ECE6DD;  /* emphasis    11.21:1 on BASE */
  --zd-text-1:     #DAD4CB;  /* body         9.44:1 / 6.48:1 on FLOAT */
  --zd-text-2:     #C8C2B9;  /* secondary    7.86:1 / 5.40:1 on FLOAT */
  --zd-text-3:     #B9B3AA;  /* label        6.68:1 / 4.59:1 on FLOAT */
  --zd-text-inert: #6E685F;  /* structure only. never text. */

  /* the printed module grid, ruled onto the desk. 1.65:1 on ZD_VOID -
     loud enough to explain where a window sits, quiet enough that it is
     furniture and not decoration. */
  --zd-grid:       #474139;

  /* --------------------------------------------------- the two inks
     PRESSWORK carries two chromatic inks and that is more than either
     parent allowed. The cost is real and so is the contract:

     ZD_STEEL  is THE MACHINE'S OWN READING. It appears inside an
               instrument and nowhere else: raster columns, meter fills,
               spark bars, plot lines, ruler regions. Never a control,
               never focus, never a border. Saturation is LOCKED at 43%.
     ZD_VERM   is THE OVERPRINT. An ink laid on top of the surface, never
               the surface itself. Exactly four jobs, PLATE's four: the
               focus bar and register mark, the one primary action per
               view, the crop marks, the datum mark on the memory ruler.
               Never status, never text, never an icon.
     The risk is that two inks on warm graphite starts to look
     decorative. The mitigation is the width rule: vermilion never fills
     an area wider than the focus bar except one button per view. */
  --zd-steel:      #7FB2E0;
  --zd-steel-br:   #A9CFF2;
  --zd-verm:       #E8734F;  /* 4.6319:1 on BASE */
  --zd-verm-br:    #F5A184;  /* the overprint at full strength */

  --zd-ok:         #7FBF63;
  --zd-warn:       #E3A63F;
  --zd-bad:        #E8664B;
  --zd-bad-ink:    #EF9077;
  --zd-ink-on:     #181310;  /* 6.14:1 on ZD_VERM */
  /* ZD_LIFT - the ONLY shadow in the system, and it never appears at rest.
     It is drawn on a dragged plate and under the three objects that are
     genuinely off the plane (menu, palette sheet, toast). Every plate
     sitting still is separated by the ladder and the two 1px runs alone.
     8 digit hex so it stays a token: 55% on graphite, 35% warm on paper -
     Folio measured a dark ground costing a shadow 54% of its recession, so
     the dark value is stronger and buys back roughly the same lift. */
  --zd-lift:       #0000008C;

  /* ------------------------------------------------- ZD_REF_*, measured
     Measurement constants. These are NEVER DRAWN. They exist so the
     settings pane can compute the comparison against the two parents at
     run time instead of quoting a number out of prose, and they carry
     the same value in both ladders because they cite another design's
     figures rather than this one's. */
  --zd-ref-lit-raking:   #5F5854;
  --zd-ref-base-raking:  #322B27;
  --zd-ref-knock-plate:  #F2EDE4;
  --zd-ref-wash-raking:  #404348;

  /* -------------------------------------------------------- metrics */
  --ui: 1;
  --zd-rail-w:    calc(170px * var(--ui));
  --zd-strip-h:   calc(30px  * var(--ui));
  --zd-foot-h:    calc(46px  * var(--ui));
  --zd-title-h:   calc(28px  * var(--ui));
  --zd-band-h:    calc(20px  * var(--ui));
  --zd-row-h:     calc(26px  * var(--ui));
  --zd-pad:       calc(10px  * var(--ui));
  --zd-gap:       calc(8px   * var(--ui));

  /* RADIUS. Graphite's rule kept: radius encodes how much the object can
     move, and nesting halves it. PAPER wanted 0 everywhere; that is the
     one paper move refused, because it is the single strongest carrier
     of "modern" in the base and Zac asked for the base to survive. */
  --zd-r-bolt:    0px;
  --zd-r-plate:   calc(9px * var(--ui));
  --zd-r-inset:   calc(4px * var(--ui));
  --zd-r-chip:    calc(2px * var(--ui));

  /* the vermilion focus bar. 3dp is the shipped value; it is a slider. */
  --zd-focus-bar: calc(3px * var(--ui));

  /* TYPE. Three baked atlases, no runtime rasteriser, so three sizes.
     SM 11 / MD 13 / LG 21, graphite's, unchanged. What PAPER adds is a
     LABEL STYLE, not a fourth size: SM, uppercase, bold, tracked. The
     tracking is the one unpriced item in this file and it is priced in
     the settings pane - fb_text_role cannot track without UI_F_TRACK on
     the existing flag word, and measure and draw must share the helper
     or a label clips. */
  --fs-sm:  calc(11px * var(--ui));
  --fs-md:  calc(13px * var(--ui));
  --fs-lg:  calc(21px * var(--ui));
  --lh-sm:  calc(15px * var(--ui));
  --lh-md:  calc(18px * var(--ui));
  --lh-lg:  calc(24px * var(--ui));
  --tr-lab: calc(1.4px * var(--ui));
  --tr-big: calc(2.6px * var(--ui));

  /* MOTION. Graphite's three durations, one curve. PAPER's CUT 0ms is
     not taken: the knockout is a full value flip and cutting it makes
     the screen twitch. It arrives at RISE 90 - the load-bearing half of
     the focus signal is there in 90 ms. */
  --ms-rise:   90ms;
  --ms-travel: 160ms;
  --ms-settle: 240ms;
  --ease: cubic-bezier(0.200, 0.850, 0.300, 1.000);

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ======================================================================
   design.h - THE DERIVED LADDER. Work light.

   HOW IT WAS DERIVED, and it is a derivation rather than an inversion.
   Three rules, applied in order, each of them arithmetic:

   1  THE LAMP DOES NOT MOVE. One raking light, off-screen upper left, in
      both modes. What changes is which direction has headroom. On
      graphite the upward ceiling is 13.903:1 and the downward is
      1.5105:1, so the STRUCK edge carries depth. On paper the ceiling
      runs the other way - 16.885:1 down, 1.2437:1 up - so the CUT edge
      carries it. Same tokens, same call sites.

   2  THE WIDENING FOLLOWS THE HEADROOM. Dark widened upward; light
      widens downward. ZD_CUT on ZD_BASE lands at 2.5538:1 in light
      against 2.5423:1 in dark: the ground's edge carries the same
      loudness in both modes, drawn on the other side.

   3  THE KNOCKOUT KEEPS ITS FRACTION, NOT ITS VALUE. ZD_KNOCK is set at
      46.6% of whichever ceiling exists. Dark: 6.4796 of 13.903. Light:
      7.8968 of 16.885, which is 46.8%. So on paper the knockout is an
      INK PLATE with the title cleared out of it, and ZD_KO_EDGE moves to
      the TOP of the header because on an ink plate under a raking light
      the top is the side that catches. 2.5666:1 there against 2.5487:1
      in dark. Both physically right; neither is the other reversed.

   WHAT THE LIGHT MODE LOSES, said plainly:
     - The widened ladder above the sheet. Paper has 1.2437:1 of total
       room upward and four rungs wanted it. ZD_RAISE and ZD_FLOAT get
       1.0853 and 1.0826, which is exactly the sub-threshold whisper this
       whole direction was built to reject - so on paper the resolution
       does not apply and the cut rules do all the separating. Light is
       PLATE with graphite's radius, and it is honest to say so.
     - ZD_LITSOFT and ZD_LIT stop being edges and become near-white
       surfaces at 1.2117 and 1.2280 on the sheet. The tokens exist; the
       recipe still draws them; they are almost invisible. That is the
       ceiling, not a choice.
     - Dark-native. The ground stops being load-bearing for the depth
       model and starts being tolerated by it.
   ====================================================================== */
:root[data-theme="light"] {
  --zd-cut:        #959086;  /* L* 59.94  2.5538:1 - the ground's edge */
  --zd-well:       #C2BDB3;  /* L* 76.75 */
  --zd-void:       #D8D3C9;  /* L* 84.69 */
  --zd-base:       #EBE6DC;  /* L* 91.43  the sheet */
  --zd-raise:      #F4EFE5;  /* L* 94.58  1.0853 - a whisper, stated */
  --zd-float:      #FDF8EE;  /* L* 97.71  1.0826 - a whisper, stated */
  --zd-litsoft:    #FFFCF2;
  --zd-lit:        #FFFEF4;
  --zd-edge-over:  #625E56;  /* 3.4484:1 worst case, on ZD_WELL */
  --zd-knock:      #47433D;  /* 7.8968:1, 46.8% of the downward ceiling */
  --zd-ko-edge:    #86827A;  /* 2.5666:1 above the knockout, on its TOP */
  --zd-knock-ink:  #F4F1E9;  /* 8.70:1 cleared out of the plate */
  --zd-knock-ink2: #B6B1A7;  /* 4.60:1 */
  --zd-text-0:     #1C1815;
  --zd-text-1:     #2C2825;
  --zd-text-2:     #47423E;
  --zd-text-3:     #56514D;
  --zd-text-inert: #88837B;
  --zd-grid:       #AAA59C;
  --zd-steel:      #0E5C8A;
  --zd-steel-br:   #08456B;
  --zd-verm:       #B7311A;
  --zd-verm-br:    #8E2412;
  --zd-ok:         #155327;  /* was #17592A: 4.492:1 on light ZD_WELL, 0.2% short */
  --zd-warn:       #7A4E00;
  --zd-bad:        #C0362A;
  --zd-bad-ink:    #A32418;
  --zd-ink-on:     #F4F1E9;
  --zd-lift:       #4A423659;
  --zd-ref-lit-raking:   #5F5854;
  --zd-ref-base-raking:  #322B27;
  --zd-ref-knock-plate:  #F2EDE4;
  --zd-ref-wash-raking:  #404348;
}

/* ======================================================================
   THE COMPARISON LADDER, and it is a control rather than a footnote.
   data-ladder="raking" rebinds the six surface rungs and the two edge
   values to graphite's originals and leaves everything else alone, so
   the knockout, the boundary and the ink stay exactly where they are and
   only the ladder underneath them moves. The settings pane recomputes
   every number from the resolved tokens, so switching this control is
   the argument for the widening, made by looking rather than by reading.
   Both modes are covered; the tokens are named identically in each.
   ====================================================================== */
:root[data-ladder="raking"] {
  --zd-cut:        #19120E;
  --zd-well:       #231C18;
  --zd-void:       #29221E;
  --zd-base:       #322B27;
  --zd-raise:      #38312D;
  --zd-float:      #3D3632;
  --zd-litsoft:    #4A433F;
  --zd-lit:        #5F5854;
  --zd-edge-over:  #8A8279;
}
:root[data-theme="light"][data-ladder="raking"] {
  --zd-cut:        #B3AB9C;
  --zd-well:       #D6CFC1;
  --zd-void:       #DED8CC;
  --zd-base:       #EBE6DC;
  --zd-raise:      #F2EEE6;
  --zd-float:      #F8F5EF;
  --zd-litsoft:    #FCFAF5;
  --zd-lit:        #FFFFFC;
  --zd-edge-over:  #6A6256;
}

/* ============================================================ reset == */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--zd-void); color: var(--zd-text-1);
  font-family: var(--sans); font-size: var(--fs-md); line-height: var(--lh-md);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--zd-verm); color: var(--zd-ink-on); }
::-webkit-scrollbar { width: calc(9px * var(--ui)); height: calc(9px * var(--ui)); }
::-webkit-scrollbar-track { background: var(--zd-well); }
::-webkit-scrollbar-thumb { background: var(--zd-text-inert); border-radius: var(--zd-r-chip); }

/* ============================================================= type ==
   Three atlas sizes and four styles. LABEL is where PAPER lands: SM,
   uppercase, bold, tracked, doing structural work rather than captioning.
   DATA is mono at one size forever - every figure the machine measured.
   Nothing is tracked except LABEL and PLATE, and both are priced. */
.t-sm  { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.t-md  { font-size: var(--fs-md); line-height: var(--lh-md); }
.t-lg  { font-size: var(--fs-lg); line-height: var(--lh-lg); font-variant-numeric: tabular-nums; }
.t-lab { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
         font-weight: 700; letter-spacing: var(--tr-lab);
         margin-right: calc(-1 * var(--tr-lab));
         color: var(--zd-text-3); white-space: nowrap; }
.t-big { font-size: var(--fs-lg); line-height: var(--lh-lg); text-transform: uppercase;
         font-weight: 700; letter-spacing: var(--tr-big);
         margin-right: calc(-1 * var(--tr-big)); color: var(--zd-text-0); }
.t-num { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
         font-variant-numeric: tabular-nums; }
body.notrack .t-lab { letter-spacing: 0; margin-right: 0; }
body.notrack .t-big { letter-spacing: 0; margin-right: 0; }
.ink0 { color: var(--zd-text-0); } .ink1 { color: var(--zd-text-1); }
.ink2 { color: var(--zd-text-2); } .ink3 { color: var(--zd-text-3); }
/* THERE IS NO FIFTH TEXT RUNG. ZD_TEXT_INERT is 2.02:1 on ZD_RAISE and
   1.73:1 on ZD_FLOAT - it cannot carry running text anywhere on this
   widened ladder, so it has no text class at all. Everything that used
   to be .inert is .ink3, and ZD_TEXT_INERT is left to the four things
   that are genuinely structure: the scrollbar thumb, the resize grip,
   the chart mark, and a disabled menu row. */
.steel { color: var(--zd-steel); } .verm { color: var(--zd-verm); }
.k-ok { color: var(--zd-ok); } .k-warn { color: var(--zd-warn); } .k-bad { color: var(--zd-bad-ink); }
.bold { font-weight: 700; }
.spread { margin-left: auto; }

/* ==================================================== the strip bar ==
   Prototype furniture, not part of the design: it is how you navigate
   the eleven scenes. It sits on the instrument ground so it reads as
   apparatus rather than as chrome the OS owns. */
#strip {
  position: fixed; left: 0; right: 0; top: 0; height: calc(30px * var(--ui));
  background: var(--zd-cut); color: var(--zd-text-3); z-index: 400;
  display: flex; align-items: stretch; padding-left: calc(12px * var(--ui));
  border-bottom: calc(2px * var(--ui)) solid var(--zd-verm);
}
#strip .nm { display: flex; align-items: center; color: var(--zd-text-0); }
#strip .pitch { display: block; align-self: center; padding: 0 calc(14px * var(--ui));
                color: var(--zd-text-2); font-family: var(--mono); font-size: var(--fs-sm);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#strip .links { display: flex; margin-left: auto; flex: none; }
#strip .links a { display: flex; align-items: center; padding: 0 calc(7px * var(--ui));
                  text-decoration: none; color: var(--zd-text-2); flex: none;
                  border-left: 1px solid var(--zd-raise); white-space: nowrap;
                  font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase; }
#strip .links a.on { background: var(--zd-knock); color: var(--zd-knock-ink); }
#strip .links a:hover { color: var(--zd-text-0); }
#strip .thm { display: flex; align-items: stretch; }
#strip .tk { display: flex; align-items: center; padding: 0 calc(7px * var(--ui));
             cursor: pointer; color: var(--zd-text-2); border-left: 1px solid var(--zd-raise);
             font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase;
             white-space: nowrap; flex: none; }
#strip .tk.on { background: var(--zd-knock); color: var(--zd-knock-ink); }
#strip .hint { display: flex; align-items: center; padding: 0 calc(7px * var(--ui)); flex: none;
               white-space: nowrap;
               border-left: 1px solid var(--zd-raise); color: var(--zd-text-2);
               font-family: var(--mono); font-size: var(--fs-sm); }

/* =============================================================== os == */
#os { position: fixed; left: 0; right: 0; top: calc(30px * var(--ui)); bottom: 0;
      display: flex; overflow: hidden; background: var(--zd-void); }

/* ============================================================= rail ==
   PLATE's numbered REGISTER on graphite's single rail. 170dp, because
   "01 SYSTEM MONITOR" has to fit and because the per-window microsecond
   readout rides in the same row. Graphite needed 132dp for the register
   alone; Datum's per-window figure is what costs the other 38.

   THE TWO-MATERIAL LAW IS NOT IMPORTED, and the reason is arithmetic
   rather than taste. Datum's law needs a ground at L* >= 89.6 to hold at
   14.26:1 (deciding.md C3). On this ground an ink rail would compute
   1.35:1 against the plate - its meaning evaporates while its screen
   area does not. So the rail is ZD_RAISE: chrome standing one rung proud
   of the plate, lit by the same lamp, with its far edge cut away. */
#rail {
  width: var(--zd-rail-w); flex: 0 0 var(--zd-rail-w); background: var(--zd-raise);
  display: flex; flex-direction: column; position: relative; z-index: 60;
  border-right: 1px solid var(--zd-cut);
}
#rail::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0;
                width: 1px; background: var(--zd-lit); }
#rail .ident { padding: calc(11px * var(--ui)) var(--zd-pad) calc(7px * var(--ui)); }
#rail .ident .w { display: block; color: var(--zd-text-0); }
#rail .ident .b { display: block; color: var(--zd-text-3); }
/* the two rule weights, PLATE's depth rank, on tokens that already
   exist. RULE 1 is 1px ZD_CUT (1.84:1 on the rail). RULE 2 is 2px
   ZD_LIT (1.56:1 on the rail, twice the width). Nesting a surface never
   changes its value; only the rule weight says which rank you are in. */
#rail .r1 { height: 1px; background: var(--zd-cut); flex: 0 0 1px; }
#rail .r2 { height: calc(2px * var(--ui)); background: var(--zd-lit); flex: none; }
#rail .sect { display: flex; align-items: center; gap: calc(6px * var(--ui));
              padding: calc(7px * var(--ui)) var(--zd-pad) calc(4px * var(--ui)); }
#reg { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; min-height: 0; }
.slot { display: flex; align-items: center; gap: calc(7px * var(--ui));
        height: var(--zd-row-h); padding: 0 calc(6px * var(--ui)) 0 calc(13px * var(--ui));
        cursor: pointer; position: relative; color: var(--zd-text-3);
        border-bottom: 1px solid var(--zd-cut); }
.slot .n { font-family: var(--mono); font-size: var(--fs-sm);
           font-variant-numeric: tabular-nums; color: var(--zd-text-3); flex: none; }
.slot .nm { font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
.slot .us { margin-left: auto; font-family: var(--mono); font-size: var(--fs-sm);
            color: var(--zd-text-3); flex: none; }
body.nous .slot .us { display: none; }
.slot:hover:not(.act) { background: var(--zd-float); }
.slot.run .n  { color: var(--zd-text-2); }
.slot.run .nm { color: var(--zd-text-1); }
/* THE REGISTER MARK. Vermilion, 3dp, on the rail's inner edge. A running
   app gets a short mark; the app owning the focused window gets the full
   row. It is job 1 of the overprint's four and it is the only part of
   the focus signal legible from the rail. */
.slot .mk { position: absolute; left: 0; top: 35%; bottom: 35%;
            width: var(--zd-focus-bar); background: var(--zd-verm);
            transition: top var(--ms-rise) var(--ease), bottom var(--ms-rise) var(--ease); }
.slot.act .mk { top: 0; bottom: 0; background: var(--zd-verm-br); }
.slot.act { background: var(--zd-base); }
.slot.act .n  { color: var(--zd-text-2); }
.slot.act .nm { color: var(--zd-text-0); font-weight: 700; }
#rail .wsrow { display: flex; flex: none; }
.wsb { flex: 1; height: var(--zd-row-h); display: flex; align-items: center;
       justify-content: center; cursor: pointer; border-right: 1px solid var(--zd-cut); }
.wsb:last-child { border-right: 0; }
.wsb .t-lab { color: var(--zd-text-3); }
.wsb.on { background: var(--zd-knock); }
.wsb.on .t-lab { color: var(--zd-knock-ink); }
#rail .stat { padding: calc(3px * var(--ui)) var(--zd-pad); }
.strow { display: flex; align-items: center; gap: calc(6px * var(--ui));
         height: calc(19px * var(--ui)); }
.strow svg { flex: 0 0 auto; }
.strow .w { margin-left: auto; font-family: var(--mono); font-size: var(--fs-sm); }
#rail .clock { padding: calc(5px * var(--ui)) var(--zd-pad) calc(10px * var(--ui)); }
#rail .clock .hm { display: block; font-family: var(--mono); font-size: var(--fs-lg);
                   line-height: var(--lh-lg); color: var(--zd-text-0);
                   font-variant-numeric: tabular-nums; }

/* ============================================================ field == */
#fieldwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

/* THE RASTER STRIP - Datum's, with graphite's re-clocking kept. One
   column PER COMPOSITE, never per vblank: on an idle machine the strip
   stands still, and a still strip is information. It sits on ZD_CUT,
   which is the one place a near-Dmax band is correct - it is an
   instrument, not a surface. */
#raster { height: var(--zd-strip-h); flex: 0 0 var(--zd-strip-h); background: var(--zd-cut);
          border-bottom: calc(2px * var(--ui)) solid var(--zd-lit);
          display: flex; align-items: stretch; position: relative; overflow: hidden; }
#raster .lbl { position: absolute; left: calc(10px * var(--ui)); top: 50%;
               transform: translateY(-50%); z-index: 2; pointer-events: none; }
#raster .rd { position: absolute; right: calc(10px * var(--ui)); top: 50%;
              transform: translateY(-50%); z-index: 2; pointer-events: none;
              display: flex; gap: calc(11px * var(--ui)); align-items: baseline; }
#rcanvas { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }

/* THE INSTRUMENT BANDS MOVE GROUND IN LIGHT, and the reason is the same
   arithmetic that moved everything else. On graphite ZD_CUT is L* 1.17 and
   is a genuine ink ground for an instrument. On paper ZD_CUT had to climb
   to L* 59.94 to carry the ground's edge at 2.5538:1, so it stops being an
   ink and becomes a mid grey that no small text clears 4.5:1 on. The two
   instrument bands take ZD_WELL there instead. Same tokens, no new name. */
:root[data-theme="light"] #strip,
:root[data-theme="light"] #raster { background: var(--zd-well); }
:root[data-theme="light"] #strip .links a { border-left-color: var(--zd-text-inert); }
/* ...and moving to ZD_WELL is not enough on its own. Measured on every
   rendered text pair in all seven scenes: ZD_TEXT_3 on light ZD_WELL is
   4.19:1, so LABEL takes the ZD_TEXT_2 rung throughout light, and the two
   instrument bands and the editor gutter take it for their quiet figures
   as well. Nothing moves in dark, where ZD_WELL is L* 5.23 and every rung
   clears with room. This is the light ladder's real cost: it has four
   text rungs on paper and three that can sit on a sunken surface. The
   rule is scoped to the ZD_WELL grounds on purpose - a blanket light
   .t-lab overrode .wsb.on .t-lab and put ZD_TEXT_2 on the knockout at
   1.01:1, which the same sweep caught. */
:root[data-theme="light"] #strip .t-lab,
:root[data-theme="light"] #raster .t-lab,
:root[data-theme="light"] .well .t-lab,
:root[data-theme="light"] #palette .pin .t-lab,
:root[data-theme="light"] #strip .ink3,
:root[data-theme="light"] #raster .ink3,
:root[data-theme="light"] .well .ink3,
:root[data-theme="light"] .gut { color: var(--zd-text-2); }
:root[data-theme="light"] #strip .tk,
:root[data-theme="light"] #strip .hint { border-left-color: var(--zd-text-inert); }

#field { flex: 1; position: relative; overflow: hidden; background: var(--zd-void); }
/* THE WALLPAPER IS ONE CALL, graphite's, unchanged:
   fb_glow(-w/8, -h/6, w*11/8, h*11/8, ZD_LITSOFT, 26, 0, 100) - a single
   raking light entering from off screen upper left and falling to
   ZD_VOID at the lower right. */
#field::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(118% 128% at -8% -12%,
              color-mix(in srgb, var(--zd-litsoft) 46%, transparent) 0%,
              color-mix(in srgb, var(--zd-litsoft) 16%, transparent) 34%,
              transparent 72%); }
/* THE RULED MODULE GRID - PAPER's, and its job here is different from
   PAPER's. PLATE tiles onto the grid, so the grid is the arrangement.
   PRESSWORK floats (graphite's wm.c is unchanged), so the grid EXPLAINS
   where a window sits rather than deciding it: 12 x 8 modules ruled onto
   the desk, visible only in the parts of the field no plate covers. */
#gridsvg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
/* A CAPTION PRINTED ON A RULED SHEET CLEARS ITS OWN SPACE. Measured on
   the rendered pixels: where the legend crossed a grid rule, ZD_TEXT_3
   fell to 3.20:1 on ZD_GRID in light (4.84:1 in dark) - below the 4.5
   floor on the light ladder. It now carries the desk with it, so every
   glyph sits on ZD_VOID: 5.25:1 light, 7.98:1 dark. */
#gridleg { position: absolute; left: calc(14px * var(--ui)); bottom: calc(4px * var(--ui));
           z-index: 1; pointer-events: none; color: var(--zd-text-3);
           background: var(--zd-void); padding: 0 calc(5px * var(--ui));
           margin-left: calc(-5px * var(--ui));
           font-family: var(--mono); font-size: var(--fs-sm); }
#wins { position: absolute; inset: 0; z-index: 2; }

/* ============================================================= foot ==
   Two instruments in one band, which is the only reason both fit.
   Top row: Datum's memory-map ruler, the whole address space to scale.
   Bottom row: PLATE's printer's slug, one mono line that states the
   machine and the grid AS MEASURED, which doubles as a live check on
   where the integer division remainder went. */
#foot { height: var(--zd-foot-h); flex: 0 0 var(--zd-foot-h); background: var(--zd-raise);
        border-top: calc(2px * var(--ui)) solid var(--zd-lit);
        display: flex; flex-direction: column; padding: calc(3px * var(--ui)) var(--zd-pad) 0; }
#rulerrow { display: flex; align-items: center; gap: calc(9px * var(--ui)); flex: none;
            height: calc(17px * var(--ui)); }
#rulerbar { flex: 1; height: calc(11px * var(--ui)); display: flex; background: var(--zd-well);
            border: 1px solid var(--zd-cut); position: relative; overflow: visible; }
#rulerbar span { display: block; height: 100%; border-right: 1px solid var(--zd-cut); }
#rulerbar span:last-child { border-right: 0; }
/* the datum mark. Overprint job 4: one vermilion hairline at the
   framebuffer's base address, because that is the address this whole
   project is about. */
#rulerbar u { position: absolute; top: calc(-3px * var(--ui)); bottom: calc(-3px * var(--ui));
              width: 1px; background: var(--zd-verm); }
#slugrow { display: flex; align-items: center; gap: calc(10px * var(--ui)); flex: none;
           height: calc(20px * var(--ui)); overflow: hidden;
           border-top: 1px solid var(--zd-cut); margin-top: calc(2px * var(--ui)); }
#slugrow .line { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-3);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.noruler #rulerrow { display: none; }
body.noslug  #slugrow  { display: none; }
body.noruler.noslug #foot { display: none; }

/* =========================================================== window ==
   THE SEAT RECIPE. Graphite's four calls, unchanged in structure:
     1  fb_rrect(x, y, w, h, r, ring)                   the ring
     2  fb_rrect(x+1, y+1, w-2, h-2, r-1, ZD_BASE)      the object
     3  fb_fill_px(x+r, y, w-2r, 1, top)                the struck top
     4  fb_fill_px(x, y+r, 1, h-2r, left)               the grazed left
   ring is ZD_EDGE_OVER when this plate lies over another and ZD_CUT
   otherwise. Steps 3 and 4 run only between the corner arcs, which is
   why they are drawn here as elements rather than as an inset shadow -
   an inset shadow cannot stop at the arc and cannot start below the
   header, and both of those matter on the focused plate.

   FOCUS DOES NOT TOUCH THE RING. The ring says which plate is on top;
   the header says which plate has the keyboard. Conflating them is how
   graphite ended up spending its whole focus budget on 1px runs. */
#wins .win {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  background: var(--zd-base); border-radius: var(--zd-r-plate);
  border: 1px solid var(--zd-cut);
  transition: border-color var(--ms-rise) var(--ease);
}
.win.over { border-color: var(--zd-edge-over); }
.win.mini { display: none !important; }
.win.max  { border-radius: var(--zd-r-bolt); }
.trun { position: absolute; left: var(--zd-r-plate); right: var(--zd-r-plate); top: 0;
        height: 1px; background: var(--zd-lit); z-index: 6; pointer-events: none;
        transition: background var(--ms-rise) var(--ease); }
.lrun { position: absolute; left: 0; top: var(--zd-r-plate); bottom: var(--zd-r-plate);
        width: 1px; background: var(--zd-litsoft); z-index: 6; pointer-events: none;
        transition: top var(--ms-rise) var(--ease); }
.win.max .trun { left: 0; right: 0; } .win.max .lrun { top: 0; bottom: 0; }
/* ON THE FOCUSED PLATE the struck top run is drawn ZD_KNOCK and the
   grazed left run starts below the header. Same two calls, same call
   site, one ternary each:
     top  = focused ? ZD_KNOCK   : ZD_LIT
     left = focused ? ZD_LITSOFT : ZD_LITSOFT   (y0 moves, not the value)
   The top run does not vanish, it merges - it is the same value as the
   surface it lies on, which is what "the light cannot lighten this
   further" looks like when you draw it honestly. */
.win.focus .trun { background: var(--zd-knock); }
.win.focus .lrun { top: var(--zd-title-h); }
/* IN LIGHT THE TWO RUNS SWAP SIDES, because the headroom did. On paper the
   knockout is an ink plate, so the direction with room is UP: ZD_KO_EDGE
   goes on the TOP of the header at 2.5666:1 and the foot merges. Same
   token, same loudness, mirrored geometry - and both are physically right,
   because the lamp never moved. */
:root[data-theme="light"] .win.focus .trun { background: var(--zd-ko-edge); }
:root[data-theme="light"] .win.focus .hdr { border-bottom-color: var(--zd-knock); }
/* AND ON AN UNFOCUSED PLATE IN LIGHT THERE IS NO STRUCK RUN AT ALL.
   Measured against the light ladder: ZD_LIT on ZD_BASE is 1.244:1 and
   ZD_LITSOFT is 1.085:1 - both below the threshold this whole direction
   exists to clear, and the ceiling table two panes over says the base's
   edge goes DOWN, bottom and right. Drawing a lit run there anyway is the
   sub threshold whisper graphite was criticised for, in the other mode.
   So it is not drawn: the 1px ZD_CUT ring carries the boundary on all four
   sides at 2.5538:1, which is what a plate on paper actually looks like.
   The focused plate keeps its run because the knockout is an ink plate and
   the room above it is real. */
:root[data-theme="light"] .lrun { display: none; }
:root[data-theme="light"] .win:not(.focus) .trun { display: none; }
.win.drag { box-shadow: 0 calc(5px * var(--ui)) calc(13px * var(--ui)) var(--zd-lift); }

/* THE KNOCKOUT. PLATE's move, imported whole and unmodified in kind: the
   focused window's header inverts to a solid plate and the title is
   reversed out of it. On the reference 600 x 420 dp plate it changes
   16,800 px; the vermilion focus bar adds 1,176; 17,976 total, 7.133% of
   the plate. Graphite's bezel plus wash changed 17,976 px on the same
   plate - THE IDENTICAL AREA. What moved is the ratio inside it:
   1.3999:1 (the wash) becomes 6.4796:1 (the knockout), 4.63x, and the
   loudest element on screen goes from 6.1881:1 to 6.4796:1, up 4.7%. */
.hdr { height: var(--zd-title-h); flex: 0 0 var(--zd-title-h); display: flex;
       align-items: center; gap: calc(8px * var(--ui));
       padding: 0 calc(6px * var(--ui)) 0 calc(11px * var(--ui));
       cursor: default; position: relative; user-select: none; z-index: 4;
       background: var(--zd-base); border-bottom: 1px solid var(--zd-cut);
       transition: background var(--ms-rise) var(--ease); }
.hdr .reg { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-3); flex: none; }
.hdr .ttl { font-size: var(--fs-md); font-weight: 700; color: var(--zd-text-2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-transform: uppercase; letter-spacing: var(--tr-lab); flex: none;
            transition: color var(--ms-rise) var(--ease); }
.hdr .sub { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-3);
            white-space: nowrap; overflow: hidden; min-width: 0; }
.hdr .crd { margin-left: auto; font-family: var(--mono); font-size: var(--fs-sm);
            color: var(--zd-text-3); flex: none; white-space: nowrap; }
.win.focus .hdr { background: var(--zd-knock); border-bottom-color: var(--zd-ko-edge); }
.win.focus .hdr .reg { color: var(--zd-knock-ink2); }
.win.focus .hdr .ttl { color: var(--zd-knock-ink); }
.win.focus .hdr .sub { color: var(--zd-knock-ink2); }
.win.focus .hdr .crd { color: var(--zd-knock-ink2); }
.win.focus .hdr .cbtn { color: var(--zd-knock-ink2); border-left-color: var(--zd-knock-ink2); }
.win.focus .hdr .cbtn:hover { background: var(--zd-knock-ink); color: var(--zd-knock); }
/* THE FALLBACK, and it is a live control rather than a paragraph. Turn
   the knockout off and the header returns to graphite's ZD_FOCUS_WASH
   ramp: same band, same area, 1.3999:1 instead of 6.4796:1. */
body.nokock .win.focus .hdr { background: var(--zd-base); border-bottom-color: var(--zd-cut); }
body.nokock .win.focus .hdr::before { content: ''; position: absolute; inset: 0;
  pointer-events: none; background: linear-gradient(90deg,
    color-mix(in srgb, var(--zd-lit) 34%, transparent) 0%,
    color-mix(in srgb, var(--zd-lit) 15%, transparent) 38%, transparent 78%); }
body.nokock .win.focus .hdr > * { position: relative; z-index: 1; }
body.nokock .win.focus .hdr .reg { color: var(--zd-verm); }
body.nokock .win.focus .hdr .ttl { color: var(--zd-text-0); }
body.nokock .win.focus .hdr .sub { color: var(--zd-text-3); }
body.nokock .win.focus .hdr .crd { color: var(--zd-text-3); }
body.nokock .win.focus .hdr .cbtn { color: var(--zd-text-3); border-left-color: var(--zd-cut); }
body.nokock .win.focus .trun { background: var(--zd-lit); }
body.nokock .win.focus .lrun { top: var(--zd-r-plate); }

/* NO FACE AT REST. Three bare glyphs behind 1px hard rules, PAPER's
   control cluster rather than graphite's floating chips. */
.ctl { display: flex; margin-left: auto; align-self: stretch; flex: none; }
.cbtn { width: calc(22px * var(--ui)); display: flex; align-items: center;
        justify-content: center; cursor: pointer; color: var(--zd-text-3);
        border-left: 1px solid var(--zd-cut); }
.cbtn:hover { background: var(--zd-raise); color: var(--zd-text-0); }
.cbtn.x:hover { background: var(--zd-verm); color: var(--zd-ink-on); }

/* THE VERMILION FOCUS BAR. Overprint job 1. It runs from below the
   knockout to the foot of the plate, on ZD_BASE at 4.6319:1, and never
   crosses the knockout - vermilion on the knockout computes 1.4014:1 and
   would disappear. That constraint is why the bar starts where it does. */
.fbar { position: absolute; left: 0; top: var(--zd-title-h); bottom: 0;
        width: var(--zd-focus-bar); background: var(--zd-verm); z-index: 5;
        pointer-events: none; display: none; }
.win.focus .fbar { display: block; }

.wbody { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding: calc(6px * var(--ui)) calc(9px * var(--ui)) calc(6px * var(--ui));
         gap: calc(5px * var(--ui)); overflow: hidden; }
.win.focus .wbody { padding-left: calc(9px * var(--ui) + var(--zd-focus-bar)); }
/* THE STATUS BAND, with Datum's per-window app_us in it. Free rider:
   mono ink in a band every direction already draws. It costs exactly one
   real thing and it is not visual - wm.c measures app_us in AGGREGATE
   only, so per-window attribution is new work. The fallback is the
   window's repaint_pixels in the same slot, same face, no layout change,
   and the settings pane switches between them. */
.sband { height: var(--zd-band-h); flex: 0 0 var(--zd-band-h); display: flex;
         align-items: center; gap: calc(10px * var(--ui));
         border-top: 1px solid var(--zd-cut); }
.win.focus .sband { padding-left: var(--zd-focus-bar); }
body.nous .sband .us { display: none; }
.grip { position: absolute; right: 0; bottom: 0; width: calc(15px * var(--ui));
        height: calc(15px * var(--ui)); cursor: nwse-resize; z-index: 7; }

/* ======================================================= primitives ==
   HARD RULES, NOT SOFT EDGES. Two weights and no third: 1px ZD_CUT
   between rows and cells, 2px ZD_LIT between regions. Nesting a surface
   does not change its value - that is PLATE's depth rank, and it is what
   keeps the widened ladder from being spent twice. */
.r1   { height: 1px; background: var(--zd-cut); flex: 0 0 1px; }
.r2   { height: calc(2px * var(--ui)); background: var(--zd-lit); flex: none; }
.row  { display: flex; align-items: center; gap: calc(8px * var(--ui)); flex: none; }
.stack{ display: flex; flex-direction: column; min-height: 0; }
.cols { display: flex; gap: calc(10px * var(--ui)); flex: 1; min-height: 0; }
.cols > * { flex: 1; min-width: 0; }
/* SUNKEN: the seat recipe with the sign flipped, on the widened ladder. */
.well { background: var(--zd-well); border-radius: var(--zd-r-inset);
        border: 1px solid var(--zd-cut);
        box-shadow: inset 0 1px 0 0 var(--zd-cut), inset 0 -1px 0 0 var(--zd-litsoft);
        padding: calc(6px * var(--ui)) calc(8px * var(--ui)); flex: none; }
/* RAISED, one nesting level in. Radius halves; value moves one rung. */
.card { background: var(--zd-raise); border-radius: var(--zd-r-inset);
        border: 1px solid var(--zd-cut);
        box-shadow: inset 0 1px 0 0 var(--zd-lit);
        padding: calc(6px * var(--ui)) calc(8px * var(--ui)); flex: none; }
/* THE TRIM. A pane that scrolls cuts its last row wherever the pane
   ends, and against the window's own footer band that chop read as a
   rendering fault rather than as more-below. The cut now lands on a
   2dp ZD_LIT rule - the same rule weight used for every other rank
   break in the system - so the half row above it reads as a column
   continuing past the trim, which is what it is. */
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.scroll::after { content: ''; display: block; position: sticky; bottom: 0;
                 height: calc(2px * var(--ui)); background: var(--zd-lit); }
.btn { display: inline-flex; align-items: center; gap: calc(6px * var(--ui));
       height: calc(22px * var(--ui)); padding: 0 calc(10px * var(--ui));
       background: var(--zd-raise); border: 1px solid var(--zd-cut);
       box-shadow: inset 0 1px 0 0 var(--zd-lit); border-radius: var(--zd-r-chip);
       cursor: pointer; color: var(--zd-text-2); white-space: nowrap; flex: none; }
.btn .t-lab { color: var(--zd-text-2); }
.btn:hover { color: var(--zd-text-0); border-color: var(--zd-edge-over); }
.btn:hover .t-lab { color: var(--zd-text-0); }
.btn:active { background: var(--zd-well); box-shadow: inset 0 1px 0 0 var(--zd-cut); }
/* THE ONE PRIMARY ACTION PER VIEW. Overprint job 2. Vermilion fill,
   ZD_INK_ON text at 6.14:1. There is exactly one of these per pane and
   the rule is enforced by hand, which is a real weakness of a prototype
   and would be a lint in the kernel. */
.btn.prim { background: var(--zd-verm); border-color: var(--zd-verm);
            box-shadow: inset 0 1px 0 0 var(--zd-verm-br); color: var(--zd-ink-on); }
.btn.prim .t-lab { color: var(--zd-ink-on); }
.btn.prim:hover { background: var(--zd-verm-br); border-color: var(--zd-verm-br); }
.btn.prim:hover .t-lab { color: var(--zd-ink-on); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
     letter-spacing: var(--tr-lab); color: var(--zd-text-3); font-weight: 700;
     text-align: left; padding: calc(2px * var(--ui)) calc(6px * var(--ui));
     border-bottom: calc(2px * var(--ui)) solid var(--zd-lit);
     position: sticky; top: 0; background: var(--zd-base); white-space: nowrap;
     overflow: hidden; text-overflow: ellipsis; }
body.notrack th { letter-spacing: 0; }
td { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
     color: var(--zd-text-2); padding: calc(2px * var(--ui)) calc(6px * var(--ui));
     white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
     border-bottom: 1px solid var(--zd-cut); }

tr.sel td span { color: var(--zd-knock-ink) !important; }

/* ========================================================== palette == */
#palette { position: absolute; inset: 0; z-index: 260; display: none; }
#palette.on { display: block; }
/* THE SCRIM IS A SHADE, NOT A FOG. On graphite ZD_CUT is L* 1.17 and
   78 percent of it is a shade: the desk goes to near Dmax and keeps its
   warmth. On paper ZD_CUT had to climb to L* 59.94, and 78 percent of a
   mid grey laid over cream is a fog - measured, it took the ground to
   #A8A399 and left the sheet only 2.32:1 clear of its own backdrop, a
   dead olive with none of the paper left in it. Light takes the ink
   plate as its shade term instead: the ground darkens rather than
   greys, keeps the warm hue, and the sheet stands 3.6:1 off it. */
#palette .scrim { position: absolute; inset: 0;
                  background: color-mix(in srgb, var(--zd-cut) 78%, transparent); }

                  top: calc(var(--zd-strip-h) + 52px * var(--ui));

               padding: 0 calc(11px * var(--ui)); height: var(--zd-title-h);
               background: var(--zd-knock); }
#palette .ph span { color: var(--zd-knock-ink); }
#palette .ph .t-num { color: var(--zd-knock-ink2); }
#palette .pin { display: flex; align-items: center; gap: calc(8px * var(--ui));
                background: var(--zd-well); padding: calc(6px * var(--ui)) calc(11px * var(--ui));
                border-bottom: 1px solid var(--zd-cut); }
#presults { max-height: calc(300px * var(--ui)); overflow-y: auto; }
.prow { display: flex; align-items: center; gap: calc(10px * var(--ui)); position: relative;
        padding: calc(4px * var(--ui)) calc(11px * var(--ui)); cursor: pointer;
        border-bottom: 1px solid var(--zd-cut); }
.prow .mk { position: absolute; left: 0; top: 0; bottom: 0; width: var(--zd-focus-bar);
            background: transparent; }
.prow:hover:not(.on) { background: var(--zd-raise); }
.prow.on { background: var(--zd-knock); }
/* THE SELECTED ROW IS A KNOCKOUT, SO ITS MARK CANNOT BE VERMILION. The
   plate's own focus bar already refuses to cross the knockout for this
   reason - measured, the overprint computes 1.40:1 on it and vanishes,
   which is the stated constraint on .fbar's geometry above. This row had
   the bar painted straight onto the knockout anyway: 3 dp of an accent
   that carries no information, the exact failure the overprint budget
   exists to prevent. It takes ZD_KO_EDGE now - the same edge term, at
   the same 2.55:1, that every other knockout in the system uses. */
.prow.on .mk { background: var(--zd-ko-edge); }
.prow.on * { color: var(--zd-knock-ink) !important; }
#palette .pf { display: flex; gap: calc(10px * var(--ui)); align-items: center;
               padding: calc(6px * var(--ui)) calc(11px * var(--ui));
               border-top: calc(2px * var(--ui)) solid var(--zd-lit); }

/* ============================================================= lock == */

#lock.on { display: flex; align-items: center; justify-content: center; }

/* ============================================================= menu == */
.menu { position: absolute; z-index: 300; display: none; min-width: calc(214px * var(--ui));
        background: var(--zd-float); border: 1px solid var(--zd-edge-over);

.msep { height: calc(2px * var(--ui)); background: var(--zd-lit); }

/* =========================================================== toasts == */
#toasts { position: absolute; right: calc(14px * var(--ui)); bottom: calc(14px * var(--ui));
          z-index: 280; display: flex; flex-direction: column; gap: var(--zd-gap);
          align-items: flex-end; }
.toast { width: calc(340px * var(--ui)); background: var(--zd-float);

         padding: calc(6px * var(--ui)) calc(11px * var(--ui)) calc(7px * var(--ui));

              width: var(--zd-focus-bar); background: var(--zd-verm); }

<script>
'use strict';
/* ======================================================================
 * PRESSWORK - a living prototype of the zlOS desktop.
 *
 *   ground      graphite's warm ladder, WIDENED. ZD_BASE unchanged.
 *   depth       graphite's 1px struck edge and cut groove, plus PLATE's
 *               two rule weights for rank inside a plate
 *   boundary    graphite's ZD_EDGE_OVER, re-solved with 14.4% margin
 *   focus       PLATE's knockout, taken whole, on a ladder widened until
 *               the light stops inverting. 7.133% of a plate.
 *   rail        PLATE's numbered register, with Datum's per-window us
 *   desk        PLATE's ruled module grid, explaining rather than tiling
 *   instrument  Datum's raster strip, memory ruler and per-window timing
 *   ink         one instrument accent (steel) and one overprint (verm)
 *
 * Every colour is a custom property. There is no hex literal below.
 * ====================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const cs = getComputedStyle(document.documentElement);

/* --------------------------------------------------- contrast, computed
 * Not estimated. Every number printed in the settings pane, the system
 * pane and the toasts comes out of these functions at run time, against
 * the tokens as the browser resolved them - so switching the comparison
 * ladder moves every number on the page.
 */
function tokHex(n) {
  let v = cs.getPropertyValue(n).trim();
  for (let i = 0; i < 4 && /^var\(/.test(v); i++)
    v = cs.getPropertyValue(v.slice(4, -1).trim()).trim();
  return v.toUpperCase();
}
function rgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function relY(h) { const c = rgb(h); return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
function ratio(a, b) {
  const x = relY(tokHex(a)), y = relY(tokHex(b));
  return ((Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05));
}
function r2(a, b) { return ratio(a, b).toFixed(2); }
function r3(a, b) { return ratio(a, b).toFixed(3); }
function r4(a, b) { return ratio(a, b).toFixed(4); }
function lstar(n) {
  const y = relY(tokHex(n));
  return (y > 216 / 24389 ? 116 * Math.pow(y, 1 / 3) - 16 : y * 24389 / 27).toFixed(2);
}
/* the two ceilings. On any ground, the largest ratio a DARKER value can
 * reach, and the largest a LIGHTER one can. These are what decide which
 * side of an object the edge run goes on, and they are asked rather than
 * asserted because they swap between the two ladders. */
function darkCeil(n) { return ((relY(tokHex(n)) + 0.05) / 0.05); }
function liteCeil(n) { return (1.05 / (relY(tokHex(n)) + 0.05)); }
function isLighter(a, b) { return relY(tokHex(a)) > relY(tokHex(b)); }
/* the widening's central claim, computed rather than quoted: how far
 * apart the lit run's two readings are. */
function groundEdge() {
  return ratio('--zd-lit', '--zd-base') >= ratio('--zd-cut', '--zd-base') ? '--zd-lit' : '--zd-cut';
}
function edgeName() { return groundEdge() === '--zd-lit' ? 'ZD_LIT' : 'ZD_CUT'; }
function edgeSkew() {
  const a = ratio(groundEdge(), '--zd-base'), b = ratio('--zd-ko-edge', '--zd-knock');
  return 100 * Math.abs(b - a) / a;
}
function refSkew() {
  const a = ratio('--zd-ref-lit-raking', '--zd-ref-base-raking');
  const b = ratio('--zd-ref-lit-raking', '--zd-ref-knock-plate');
  return { lit: a, ko: b, x: b / a };
}

/* ============================================================ icons ==
 * MACHINED FROM THE SAME PLATE, graphite's rule kept unchanged. 45/90
 * armature only: every straight segment is horizontal, vertical or
 * exactly 45 degrees. Two stroke weights - 2.0 silhouette, 1.5 interior.
 * EXACTLY ONE SOLID MASS PER ICON and it is the icon's subject. Curves
 * appear only where the object is physically round.
 */

  files: '<path d="M3 7 L3 19 L21 19 L21 9 L11.5 9 L9.5 7 Z"/><rect x="5" y="9.5" width="7" height="4" class="sol"/>',
  mon:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 16 L6 13 M10 16 L10 10" class="w1"/><rect x="13" y="7" width="2.6" height="9" class="sol"/><path d="M18 16 L18 12" class="w1"/>',
  edit:  '<path d="M5 3 L5 21 L19 21 L19 8 L14 3 Z"/><path d="M8 12 H16 M8 15 H16 M8 18 H13" class="w1"/><rect x="8" y="6" width="4" height="3" class="sol"/>',
  log:   '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 9 H12 M6 12 H15 M6 15 H10" class="w1"/><rect x="16" y="8" width="2.6" height="2.6" class="sol"/>',
  hex:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9 H21 M9 4 V20 M15 4 V20" class="w1"/><rect x="9.6" y="9.6" width="4.8" height="4.8" class="sol"/>',
  calc:  '<rect x="4" y="3" width="16" height="18" rx="2"/><rect x="7" y="6" width="10" height="3.4" class="sol"/><path d="M8 13 H10 M14 13 H16 M8 17 H10 M14 17 H16" class="w1"/>',
  net:   '<path d="M4 10 A11 11 0 0 1 20 10" class="w1"/><path d="M7 13.5 A7 7 0 0 1 17 13.5" class="w1"/><rect x="10.4" y="16.4" width="3.2" height="3.2" class="sol"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7 L12 12 L15.5 14" class="w1"/><rect x="11.2" y="2.6" width="1.6" height="2.2" class="sol"/>',
  chip:  '<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 3 V6 M12 3 V6 M15 3 V6 M9 18 V21 M12 18 V21 M15 18 V21 M3 9 H6 M3 12 H6 M3 15 H6 M18 9 H21 M18 12 H21 M18 15 H21" class="w1"/><rect x="9.2" y="9.2" width="5.6" height="5.6" class="sol"/>',

/* ================================================= render primitives == */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function hx(v, n) { let s = (v >>> 0).toString(16).toUpperCase(); while (s.length < n) s = '0' + s; return s; }
function TBL(cols, rows) {
  return '<table><thead><tr>' + cols.map(c =>
    '<th' + (c.r ? ' class="r"' : '') + (c.w ? ' style="width:' + c.w + '"' : '') + '>' + c.h + '</th>').join('') +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => {
    if (typeof c === 'object') return '<td class="' + (c.c || '') + '">' + c.t + '</td>';
    return '<td>' + esc(c) + '</td>';
  }).join('') + '</tr>';
}
function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function meter(lb, val, unit, kind) {
  return '<div class="meter"><span class="lb">' + lb + '</span><div class="mtrack">' +
    '<div class="mfill ' + (kind || '') + '" style="width:' + Math.max(0, Math.min(100, val)) + '%"></div>' +
    '</div><span class="vv">' + val.toFixed(1) + unit + '</span></div>';
}
/* THE STATE WORD BESIDE THE STATE COLOUR. Free rider, all four parents
   do it, and it is why colour never carries a state alone here. */
function sw(w) {
  const m = { OK: 'ok', PASS: 'ok', UP: 'ok', RUN: 'ok', LISTEN: 'ok', ESTABLISHED: 'ok',
              WARN: 'warn', BOUND: 'warn', DRIFT: 'warn', RO: 'warn',
              FAIL: 'bad', DOWN: 'bad', Z: 'bad' };
  const k = m[w] || 'ok';
  const c = k === 'ok' ? 'var(--zd-ok)' : k === 'warn' ? 'var(--zd-warn)' : 'var(--zd-bad)';
  const ink = k === 'ok' ? 'k-ok' : k === 'warn' ? 'k-warn' : 'k-bad';
  return '<span class="sw"><span class="dot" style="background:' + c + '"></span>' +
    '<span class="t-num ' + ink + '">' + w + '</span></span>';
}
function spark(series, w, h, max, col) {
  const n = series.length, sw2 = w / n;
  let d = '';
  series.forEach((v, i) => {
    const bh = Math.max(1, Math.round((v / max) * (h - 1)));
    d += '<rect x="' + (i * sw2).toFixed(2) + '" y="' + (h - bh) + '" width="' +
      Math.max(1, sw2 - 0.6).toFixed(2) + '" height="' + bh + '" fill="' + col + '"/>';
  });
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" ' +
    'shape-rendering="crispEdges" aria-hidden="true">' + d + '</svg>';
}
function usOf(id) {
  const w = S.wins[id]; if (!w) return '';
  if (S.cfg.us === 'off') return '';
  return S.cfg.us === 'measured' ? w.us + ' us' : (w.px / 1000).toFixed(0) + ' kpx';
}
function usBand(id) {
  const v = usOf(id); if (!v) return '';
  return '<span class="us row" style="gap:calc(6px * var(--ui))">' +
    '<span class="t-lab">' + (S.cfg.us === 'measured' ? 'app us' : 'repaint') + '</span>' +
    '<span class="t-num ink0">' + v + '</span></span>';
}
function band(id, left) {
  return '<div class="sband"><span class="t-lab">' + APP[id].n + '</span>' +
    '<span class="t-num ink3">' + left + '</span>' + usBand(id) +
    '<span class="spread t-num ink3">ws ' + (S.wins[id] ? ('0' + S.wins[id].ws) : '01') + '</span></div>';
}
function head(cells) { return '<div class="row" style="height:calc(21px * var(--ui))">' + cells + '</div>'; }

/* ========================================================= settings ===

 * recomputing rather than by asserting. Every figure below comes out of
 * the resolved tokens at render time. The two controls that matter are
 * SURFACE LADDER and THE KNOCKOUT: the first rebinds the six surface
 * rungs to graphite's originals and leaves the knockout in place, so the
 * sign inversion appears on screen and in the numbers together; the
 * second removes the knockout and puts graphite's wash back in the same
 * band, so the 1.3999 against 6.4796 comparison is a thing you look at.

function tog(label, key, note) {
  const on = S.cfg[key] === true;
  return '<div class="row" style="height:calc(26px * var(--ui))" data-act="tog" data-arg="' + key + '">' +
    '<span class="sw2' + (on ? ' on' : '') + '"><i></i></span>' +
    '<span class="t-md ink1">' + label + '</span>' +
    '<span class="spread t-num ink3">' + note + '</span></div>';
}
function seg(label, key, opts) {
  return '<div class="row" style="height:calc(26px * var(--ui))">' +
    '<span class="t-md ink1" style="width:calc(146px * var(--ui));flex:none">' + label + '</span>' +
    '<span class="seg">' + opts.map(o =>
      '<span class="' + (S.cfg[key] === o ? 'on' : '') + '" data-act="seg" data-arg="' + key + ':' + o + '">' +
      '<span class="t-lab">' + o + '</span></span>').join('') + '</span></div>';
}
function slider(label, key, lo, hi, unit) {
  const pct = ((S.cfg[key] - lo) / (hi - lo)) * 100;
  return '<div class="row" style="height:calc(26px * var(--ui))">' +
    '<span class="t-md ink1" style="width:calc(146px * var(--ui));flex:none">' + label + '</span>' +
    '<div class="mtrack" style="height:calc(11px * var(--ui));cursor:pointer" data-slider="' + key +

    '<div class="mfill" style="width:' + pct + '%"></div></div>' +
    '<span class="t-num ink0" style="width:calc(62px * var(--ui));text-align:right">' +
    S.cfg[key] + unit + '</span></div>';
}

/* ====================================================== window mgmt ===
 * wm.c is mechanically unchanged from graphite: floating, draggable,
 * resizable, z ordered, per window surface cache. Two rules are added
 * and both are risks a parent named and did not fix.
 *   1  THE RAIL MUST NEVER BE COVERED. wm.c has no reserved strut, so
 *      wm_open and drag clamp to rail_w. With no top bar and no dock the
 *      rail is the only route to every system function.
 *   2  OVERLAP IS COMPUTED, because the occluder draws the border.
 * PLATE's tiling is NOT taken: it has no reflow story at all, and four
 * separate prototype defects in that direction were that one failure
 * wearing different hats. The module grid stays as a ruled explanation.
 */
function openWin(id, rect, ws) {
  const a = APP[id];
  if (S.wins[id]) { focusWin(id); return; }
  const r = rect || a.p;
  S.wins[id] = { id: id, x: r[0], y: r[1], w: r[2], h: r[3], ws: ws || S.ws,
                 min: false, max: false, z: ++ZT,
                 us: 340 + ((id.charCodeAt(0) * 37) % 900),
                 px: 40000 + ((id.charCodeAt(0) * 5417) % 260000) };
  buildWin(id); focusWin(id); layout();
}
function closeWin(id) {
  const e = $('.win[data-id="' + id + '"]'); if (e) e.remove();
  delete S.wins[id];
  if (S.focus === id) {
    const rest = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min);
    S.focus = rest.length ? rest.sort((a, b) => S.wins[b].z - S.wins[a].z)[0] : null;
  }
  renderRail(); layout(); damage();
}
function focusWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].z = ++ZT; S.wins[id].min = false; S.focus = id;
  layout(); renderRail(); damage(2);
}
function minWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].min = true;
  if (S.focus === id) S.focus = null;
  layout(); renderRail(); damage();
  toast('minimised', APP[id].n + ' ' + APP[id].name.toUpperCase() + ' travels to its register slot in ' +
    'TRAVEL 160 ms, then the register mark drops back to the short form');
}
function maxWin(id) {
  const w = S.wins[id]; if (!w) return;
  if (w.max) { w.max = false; } else { w.pre = [w.x, w.y, w.w, w.h]; w.max = true; }
  focusWin(id);
}
function buildWin(id) {
  const a = APP[id];
  const e = document.createElement('div');
  e.className = 'win'; e.setAttribute('data-id', id);
  e.innerHTML =
    '<div class="hdr" data-drag="1">' +
    '<span class="reg">' + a.n + '</span>' +
    '<span class="ttl">' + a.name + '</span>' +
    '<span class="sub">' + a.sub + '</span>' +
    '<span class="crd" data-crd="1"></span>' +
    '<span class="ctl">' +
    '<span class="cbtn" data-wa="min" title="minimise"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9 H10"/></svg></span>' +
    '<span class="cbtn" data-wa="max" title="maximise"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="8" height="8"/></svg></span>' +
    '<span class="cbtn x" data-wa="close" title="close"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5"/></svg></span>' +
    '</span></div><div class="wbody"></div>' +
    '<span class="trun"></span><span class="lrun"></span><span class="fbar"></span>' +
    '<svg class="grip" viewBox="0 0 15 15" fill="none" stroke="var(--zd-text-inert)" stroke-width="1.2">' +
    '<path d="M14 5 L5 14 M14 9 L9 14 M14 1 L1 14"/></svg>';
  $('#wins').appendChild(e);
  redraw(id);
}
function redraw(id) {
  const e = $('.win[data-id="' + id + '"]'); if (!e) return;
  const f = R[id] || (() => '<div class="well"><span class="pre ink2">no renderer</span></div>');
  $('.wbody', e).innerHTML = f();
}
function redrawAll() { Object.keys(S.wins).forEach(redraw); }
function overlaps(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
}
/* the module coordinate a plate happens to be sitting on. It is a
   READOUT and never a constraint - the grid explains, it does not tile. */
function moduleOf(x, y, w, h) {
  const g = GRID; if (!g.colX.length) return '';
  let c0 = 0, r0 = 0, c1 = 0, r1 = 0;
  for (let i = 0; i < g.colX.length; i++) if (x >= g.colX[i] - g.gut) c0 = i;
  for (let i = 0; i < g.rowY.length; i++) if (y >= g.rowY[i] - g.gut) r0 = i;
  for (let i = 0; i < g.colX.length; i++) if (x + w >= g.colX[i] + g.colW[i] * 0.5) c1 = i;
  for (let i = 0; i < g.rowY.length; i++) if (y + h >= g.rowY[i] + g.rowH[i] * 0.5) r1 = i;
  return 'M' + ('0' + (c0 + 1)).slice(-2) + ('0' + (r0 + 1)).slice(-2) +
         ' ' + Math.max(1, c1 - c0 + 1) + 'x' + Math.max(1, r1 - r0 + 1);
}
function layout() {
  const field = $('#field'), fw = field.clientWidth, fh = field.clientHeight;
  const list = Object.keys(S.wins).map(k => S.wins[k])
    .filter(w => w.ws === S.ws).sort((a, b) => a.z - b.z);
  Object.keys(S.wins).forEach(id => {
    const w = S.wins[id], e = $('.win[data-id="' + id + '"]');
    if (!e) return;
    if (w.ws !== S.ws || w.min) { e.style.display = 'none'; return; }
    e.style.display = '';
    let x = w.x, y = w.y, ww = w.w, hh = w.h;
    if (w.max) { x = 0; y = 0; ww = fw; hh = fh; }
    x = Math.max(0, Math.min(x, Math.max(0, fw - 120)));
    y = Math.max(0, Math.min(y, Math.max(0, fh - 60)));
    ww = Math.min(ww, fw); hh = Math.min(hh, fh);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.width = ww + 'px'; e.style.height = hh + 'px';
    e.style.zIndex = w.z;
    e.classList.toggle('focus', S.focus === id);
    e.classList.toggle('max', !!w.max);
    const crd = $('[data-crd]', e); if (crd) crd.textContent = moduleOf(x, y, ww, hh);
    const me = { x: x, y: y, w: ww, h: hh };
    let over = false;
    if (S.cfg.over) {
      for (let i = 0; i < list.length; i++) {
        const o = list[i]; if (o.id === id || o.z >= w.z) continue;
        const oe = $('.win[data-id="' + o.id + '"]'); if (!oe || oe.style.display === 'none') continue;
        if (overlaps(me, { x: oe.offsetLeft, y: oe.offsetTop,
                           w: oe.offsetWidth, h: oe.offsetHeight })) { over = true; break; }
      }
    }
    e.classList.toggle('over', over);
  });
}

/* ============================================================= rail == */
function renderRail() {
  $('#reg').innerHTML = APPS.map(a => {
    const w = S.wins[a.id];
    const run = !!w, act = S.focus === a.id;
    return '<div class="slot' + (run ? ' run' : '') + (act ? ' act' : '') +
      '" data-act="open" data-arg="' + a.id + '" title="alt+' + a.n + '">' +
      (run ? '<span class="mk"></span>' : '') +
      '<span class="n">' + a.n + '</span>' +
      icon(a.ico, 14) +
      '<span class="nm">' + a.name + '</span>' +
      (run ? '<span class="us">' + (usOf(a.id) || '').replace(' us', '') + '</span>' : '') + '</div>';
  }).join('');
  const runc = Object.keys(S.wins).length;
  $('#regcount').textContent = runc + '/' + APPS.length;
  $('#wsrow').innerHTML = [1, 2].map(n =>
    '<span class="wsb' + (S.ws === n ? ' on' : '') + '" data-act="ws" data-arg="' + n + '">' +
    '<span class="t-lab">ws 0' + n + '</span></span>').join('');
  const nets = [['net', 'net', 'UP'], ['vol', 'vol', 'OK'], ['power', 'pwr', 'WARN']];
  $('#railstat').innerHTML = nets.map(s =>
    '<div class="strow">' + icon(s[0], 13) + '<span class="t-lab">' + s[1] + '</span>' +
    '<span class="w">' + sw(s[2]) + '</span></div>').join('');
  const on = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min).length;
  $('#ovsub').textContent = on + ' plates on workspace 0' + S.ws +
    ' - the focused one is the knocked out header, not a coloured edge';
}

/* ===================================================== the desk grid ==
 * PLATE's ruled module grid, with its job changed. PLATE tiles onto it,
 * so there the grid IS the arrangement and an app authored to fill 7x8
 * overflows at 7x4. Here the windows float, so the grid explains where a
 * plate happens to sit - the header's coordinate readout is computed
 * from it - and nothing depends on it being obeyed. The legend states
 * the module AS COMPUTED at this resolution, which doubles as a live
 * check on where the integer division remainder went.
 */
function computeGrid() {
  const f = $('#field');
  const W = f.clientWidth || 1200, H = f.clientHeight || 700;
  const u = S.cfg.ui / 100;
  const mar = Math.round(16 * u), gut = Math.round(12 * u);
  const inW = W - 2 * mar, inH = H - 2 * mar;
  const cwBase = Math.floor((inW - gut * (S.cols - 1)) / S.cols);
  const cwRem = (inW - gut * (S.cols - 1)) - cwBase * S.cols;
  const rhBase = Math.floor((inH - gut * (S.rows - 1)) / S.rows);
  const rhRem = (inH - gut * (S.rows - 1)) - rhBase * S.rows;
  const colX = [], colW = [], rowY = [], rowH = [];
  let x = mar;
  for (let i = 0; i < S.cols; i++) {
    const w = cwBase + (i < cwRem ? 1 : 0);
    colW.push(w); colX.push(x); x += w + gut;
  }
  let y = mar;
  for (let i = 0; i < S.rows; i++) {
    const h = rhBase + (i < rhRem ? 1 : 0);
    rowH.push(h); rowY.push(y); y += h + gut;
  }
  GRID = { W: W, H: H, mar: mar, gut: gut, colX: colX, colW: colW, rowY: rowY, rowH: rowH,
           cwBase: cwBase, cwRem: cwRem, rhBase: rhBase, rhRem: rhRem };
}
function drawGrid() {
  computeGrid();
  const svg = $('#gridsvg'), g = GRID;
  svg.setAttribute('width', g.W); svg.setAttribute('height', g.H);
  if (!S.cfg.grid && !S.cfg.crop) { svg.innerHTML = ''; $('#gridleg').textContent = ''; return; }
  let s = '';
  if (S.cfg.grid) {
    g.colX.forEach((x, i) => {
      s += '<rect x="' + x + '" y="' + g.mar + '" width="1" height="' + (g.H - 2 * g.mar) +
           '" fill="var(--zd-grid)"/>';
      s += '<rect x="' + (x + g.colW[i] - 1) + '" y="' + g.mar + '" width="1" height="' +
           (g.H - 2 * g.mar) + '" fill="var(--zd-grid)"/>';
    });
    g.rowY.forEach((y, i) => {
      s += '<rect x="' + g.mar + '" y="' + y + '" width="' + (g.W - 2 * g.mar) +
           '" height="1" fill="var(--zd-grid)"/>';
      s += '<rect x="' + g.mar + '" y="' + (y + g.rowH[i] - 1) + '" width="' + (g.W - 2 * g.mar) +
           '" height="1" fill="var(--zd-grid)"/>';
    });
  }
  /* overprint job 3. crop marks, vermilion, at the four margin corners. */
  if (S.cfg.crop) {
    const L = 18, o = 7, m = g.mar, Rr = g.W - g.mar, B = g.H - g.mar;
    const hz = (x, y) => '<rect x="' + x + '" y="' + y + '" width="' + L + '" height="1" fill="var(--zd-verm)"/>';
    const vt = (x, y) => '<rect x="' + x + '" y="' + y + '" width="1" height="' + L + '" fill="var(--zd-verm)"/>';
    s += hz(m, m - o) + vt(m - o, m);
    s += hz(Rr - L, m - o) + vt(Rr + o, m);
    s += hz(m, B + o) + vt(m - o, B - L);
    s += hz(Rr - L, B + o) + vt(Rr + o, B - L);
  }
  svg.innerHTML = s;
  const cwTxt = g.cwRem ? (g.cwBase + 1) + '/' + g.cwBase : String(g.cwBase);
  const rhTxt = g.rhRem ? (g.rhBase + 1) + '/' + g.rhBase : String(g.rhBase);
  $('#gridleg').textContent = S.cfg.grid
    ? 'MODULE ' + S.cols + ' x ' + S.rows + '  ' + cwTxt + ' x ' + rhTxt + ' px  GUTTER ' + g.gut
    : '';
}

/* ====================================================== raster strip ==
 * Datum's instrument, graphite's re-clocking. One column per COMPOSITE.
 */
function damage(n) {
  const k = n || 1;
  for (let i = 0; i < k; i++) {
    S.composites++;
    S.raster.push({ us: 5200 + Math.round(Math.random() * 7000) });
  }
  if (S.raster.length > 900) S.raster.splice(0, S.raster.length - 900);
  drawRaster();
}
function drawRaster() {
  const c = $('#rcanvas'), p = c.parentElement;
  const w = p.clientWidth, h = p.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const budget = 16667;
  const steel = tokHex('--zd-steel'), warn = tokHex('--zd-warn'), inert = tokHex('--zd-text-inert');
  /* one column per composite, 3 device px apart so the strip reads as a
     histogram rather than as a texture. an over budget composite is the
     only one that changes colour, and the word BUDGET is beside it. */
  const x0 = 92, x1 = w - 480, span = Math.max(10, x1 - x0);
  const n = Math.min(S.raster.length, Math.floor(span / 3));
  const start = S.raster.length - n;
  for (let i = 0; i < n; i++) {
    const s = S.raster[start + i];
    const bh = Math.max(1, Math.round((s.us / budget) * (h - 10)));
    g.fillStyle = s.us > budget * 0.85 ? warn : steel;
    g.fillRect(x0 + i * 3, h - 5 - bh, 1, bh);
  }
  g.fillStyle = inert;
  g.fillRect(x0, h - 5, span, 1);
  const rd = $('#rasterrd');
  const idleH = S.cfg.rasterClock === 'frame' ? '215,993' : '0';
  rd.innerHTML = '<span class="t-lab">advance</span>' +
    '<span class="t-num ink1">' + S.cfg.rasterClock + '</span>' +
    '<span class="t-lab">idle wakeups/h</span>' +
    '<span class="t-num ' + (S.cfg.rasterClock === 'frame' ? 'k-warn' : 'ink1') + '">' + idleH + '</span>' +
    '<span class="t-lab">budget</span><span class="t-num ink3">16 667 us</span>';
}

/* ========================================================= overview == */
function ovOn() { return $('#overview').classList.contains('on'); }
function showOverview(on) {
  $('#overview').classList.toggle('on', on);
  if (!on) return;
  const g = $('#ogrid'), gw = g.clientWidth || 1200, gh = g.clientHeight || 600;
  const list = Object.keys(S.wins).map(k => S.wins[k])
    .filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
  const cols = Math.min(3, Math.max(1, list.length));
  const rows = Math.ceil(list.length / cols) || 1;
  const cw = (gw - (cols - 1) * 14) / cols, ch = (gh - (rows - 1) * 14) / rows;
  /* A TILE IS THE PLATE AT SCALE, NOT A BOX THE PLATE SITS IN. The tiles
     used to take the whole grid cell while the scaled window filled only
     the top of it, so every tile carried 130-160 px of blank ZD_BASE
     under its content and the overview read as five half printed sheets.
     One scale factor serves the whole workspace - so the tiles also
     state the windows' real sizes relative to each other - and each tile
     takes the window's own aspect. What is left over is desk, which is
     what an emptier workspace should look like. */
  const TH = 20 * (S.cfg.ui / 100);
  const maxW = Math.max.apply(null, list.map(w => w.w));
  const maxH = Math.max.apply(null, list.map(w => w.h - 28));
  const sc0 = Math.min(cw / maxW, Math.max(1, ch - TH) / maxH);
  const tileH = w => TH + (w.h - 28) * sc0;
  const rowH = [];
  for (let r = 0; r < rows; r++)
    rowH[r] = Math.max.apply(null, list.slice(r * cols, (r + 1) * cols).map(tileH));
  /* The slack goes UNDER the plates, not around them. Centring the block
     opened a 157 px gap directly below the ACTIVITIES rule, which reads
     as a layout fault; hanging the plates from the rule and leaving the
     remainder as desk reads as an emptier workspace, which it is. */
  const rowTop = r => rowH.slice(0, r).reduce((a, b) => a + b, 0) + r * 14;
  g.innerHTML = list.map((w, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const tw = w.w * sc0, th = tileH(w);
    return '<div class="thumb' + (S.focus === w.id ? ' on' : '') + '" data-act="ovpick" data-arg="' + w.id +
      '" style="left:' + (c * (cw + 14) + (cw - tw) / 2) + 'px;top:' + rowTop(r) +
      'px;width:' + tw + 'px;height:' + th + 'px">' +
      '<div class="th"><span class="t-num ink3">' + APP[w.id].n + '</span>' +
      '<span class="t-lab" style="color:var(--zd-text-2)">' + APP[w.id].name + '</span>' +
      '<span class="spread t-num ink3">' + w.w + ' x ' + w.h + '</span></div>' +
      '<div class="tc" data-src="' + w.id + '"></div></div>';
  }).join('');
  list.forEach(w => {
    const holder = $('.tc[data-src="' + w.id + '"]', g);
    const src = $('.win[data-id="' + w.id + '"] .wbody');
    if (!holder || !src) return;
    /* THE SCALE GOES ON THE CLONE, NOT ON THE CLIPPING WINDOW. Scaling
       .tc shrank the clip box along with its contents, so the preview
       was clipped at sc x sc of the tile - which is why every tile used
       to need to be half again taller than its content. .tc is now a
       full size window onto a scaled plate, and the preview fills it. */
    const sc = holder.clientWidth / w.w;
    const clone = src.cloneNode(true);
    clone.style.width = w.w + 'px'; clone.style.height = (w.h - 28) + 'px';
    clone.style.transformOrigin = '0 0';
    clone.style.transform = 'scale(' + sc.toFixed(4) + ')';
    holder.appendChild(clone);
  });
}
