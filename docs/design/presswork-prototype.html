/* ============================================================= tick == */
function walk(v, lo, hi, amp) {
  v += (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, v));
}
function clockStr() {
  const d = new Date(2026, 7, 26, 14, 32, 7 + S.t);
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function tick() {
  S.t++;
  S.cpu = S.cpu.map(v => walk(v, 2, 96, 14));
  S.mem = walk(S.mem, 30, 72, 3);
  Object.keys(S.wins).forEach(id => { S.wins[id].us = Math.round(walk(S.wins[id].us, 180, 1400, 90)); });
  $('#clockhm').textContent = clockStr();
  $('#clockd').textContent = '26 aug 2026';
  /* THE STRIP ADVANCES ON DAMAGE. A 1 Hz sampler redraw is one damage
     flush, so it gets one column. Under the frame clock it would get
     sixty, which is the whole argument. */
  if (S.cfg.rasterClock === 'frame') damage(6);
  else if (S.wins.mon || S.wins.net || S.wins.clock) damage(1);
  else drawRaster();
  ['mon', 'net', 'clock', 'sys'].forEach(id => { if (S.wins[id]) redraw(id); });
  if (S.wins.set && S.setTab === 3) redraw('set');
  if (S.cfg.us !== 'off') renderRail();
  renderFoot();
  if ($('#lock').classList.contains('on')) renderLock();
}

/* ========================================================== config === */
function applyCfg() {
  const d = document.documentElement;
  d.style.setProperty('--zd-focus-bar', 'calc(' + S.cfg.fbar + 'px * var(--ui))');
  d.style.setProperty('--ui', (S.cfg.ui / 100).toFixed(2));
  if (S.cfg.ladder === 'raking') d.setAttribute('data-ladder', 'raking');
  else d.removeAttribute('data-ladder');
  document.body.classList.toggle('nokock', !S.cfg.knockout);
  document.body.classList.toggle('nous', S.cfg.us === 'off');
  document.body.classList.toggle('nomo', !S.cfg.motion);
  document.body.classList.toggle('blink', S.cfg.motion);
  document.body.classList.toggle('notrack', !S.cfg.track);
  document.body.classList.toggle('noruler', !S.cfg.ruler);
  document.body.classList.toggle('noslug', !S.cfg.slug);
  layout(); drawGrid(); drawRaster(); renderFoot();
}
function setWs(n) {
  S.ws = n;
  const cur = Object.keys(S.wins).filter(k => S.wins[k].ws === n && !S.wins[k].min);
  S.focus = cur.length ? cur.sort((a, b) => S.wins[b].z - S.wins[a].z)[0] : null;
  layout(); renderRail(); damage();
  toast('workspace 0' + n, cur.length + ' plates. the register keeps its numbering across ' +
    'workspaces, so alt+NN means the same app on both');
}
/* TILE ONTO THE MODULE. PLATE tiles by law and has no reflow story;
   here it is one command and the grid it snaps to is the one already
   ruled on the desk, so the result is checkable by eye. */
function tileAll() {
  const list = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min);
  computeGrid();
  const g = GRID;
  const cols = Math.min(3, Math.max(1, Math.ceil(Math.sqrt(list.length))));
  const rows = Math.ceil(list.length / cols) || 1;
  const cSpan = Math.floor(S.cols / cols), rSpan = Math.floor(S.rows / rows);
  list.forEach((id, i) => {
    const w = S.wins[id];
    const c = (i % cols) * cSpan, r = Math.floor(i / cols) * rSpan;
    w.max = false;
    w.x = g.colX[c];
    w.y = g.rowY[r];
    let ww = 0; for (let k = 0; k < cSpan; k++) ww += g.colW[c + k]; ww += g.gut * (cSpan - 1);
    let hh = 0; for (let k = 0; k < rSpan; k++) hh += g.rowH[r + k]; hh += g.gut * (rSpan - 1);
    w.w = ww; w.h = hh;
  });
  layout(); damage(4);
  toast('tiled onto the module', list.length + ' plates on ' + cSpan + 'x' + rSpan +
    ' modules, no overlap. every occlusion edge falls back to ZD_CUT at ' +
    r2('--zd-cut', '--zd-base') + ':1, which is exactly when that rule is inert');
}
function calcKey(k) {
  if (k === '=') return;
  if ('0123456789'.indexOf(k) >= 0) { S.calcVal = (S.calcVal * 10 + parseInt(k, 10)) % 1000000000; return; }
  if (k === '+') S.calcVal += 1000;
  else if (k === '-') S.calcVal = Math.max(0, S.calcVal - 1000);
  else if (k === '*') S.calcVal = Math.min(999999999, S.calcVal * 2);
  else if (k === '/') S.calcVal = Math.floor(S.calcVal / 2);
}

/* =========================================================== events == */
function winOf(el) { const w = el.closest('.win'); return w ? w.getAttribute('data-id') : null; }
function act(t, arg, ev) {
  switch (t) {
    case 'open': openWin(arg); break;
    case 'file': S.fileSel = +arg; redraw('files'); if (S.wins.edit) redraw('edit'); damage(); break;
    case 'proc': S.procSel = +arg; redraw('mon'); damage(); break;
    case 'log':  S.logSel = +arg; redraw('log'); damage(); break;
    case 'hexp': S.hexPage = Math.max(0, S.hexPage + (+arg)); redraw('hex'); damage(); break;
    case 'calc': calcKey(arg); redraw('calc'); damage(); break;
    case 'settab': S.setTab = +arg; redraw('set'); damage(); break;
    case 'tog':
      S.cfg[arg] = !S.cfg[arg]; applyCfg(); redrawAll(); damage();
      if (arg === 'knockout') toast(S.cfg.knockout ? 'knockout on' : 'knockout off',
        S.cfg.knockout
          ? 'the focused header inverts to ZD_KNOCK at ' + r4('--zd-knock', '--zd-base') +
            ':1 on the plate. same band graphite washed, ' +
            (ratio('--zd-knock', '--zd-base') / 1.3999).toFixed(2) + 'x the ratio'
          : 'fallback is graphite\'s ZD_FOCUS_WASH ramp across the same band at 1.400:1. ' +
            'sit back to normal viewing distance and find the focused plate');
      if (arg === 'over') toast(S.cfg.over ? 'occlusion edge on' : 'occlusion edge off',
        S.cfg.over
          ? 'a plate over a plate draws ZD_EDGE_OVER, ' + r2('--zd-edge-over', '--zd-base') +
            ':1 on the body underneath, ' + (100 * (ratio('--zd-edge-over', '--zd-float') / 3 - 1)).toFixed(1) +
            '% clear of the floor at worst'
          : 'fallback is ZD_CUT at ' + r2('--zd-cut', '--zd-base') +
            ':1. drag two plates over each other and read the stack order');
      if (arg === 'track') toast(S.cfg.track ? 'tracking on' : 'tracking off',
        S.cfg.track ? 'LABEL +1.4 dp, PLATE +2.6 dp. free in CSS, UI_F_TRACK in fb.c'
                    : 'this is what the direction looks like if UI_F_TRACK is never written. ' +
                      'it survives; it reads flatter, and that is the honest price');
      break;
    case 'seg': {
      const p = arg.split(':'); S.cfg[p[0]] = p[1]; applyCfg(); redrawAll(); damage();
      if (p[0] === 'ladder') toast('ladder: ' + p[1],
        p[1] === 'raking'
          ? 'graphite\'s six rungs, presswork\'s knockout on top. smallest step ' +
            r4('--zd-raise', '--zd-float') + ':1, and the edge skew jumps to ' +
            edgeSkew().toFixed(2) + '% - the lit run stops reading at one loudness'
          : 'widened. smallest step ' + r4('--zd-raise', '--zd-float') + ':1, edge skew ' +
            edgeSkew().toFixed(2) + '%, ZD_KO_EDGE resolves to ZD_LIT\'s own value');
      break;
    }
    case 'ws': setWs(+arg); break;
    case 'ovpick': showOverview(false); focusWin(arg); break;
    case 'prun': S.psel = +arg; runPalette(); break;
    case 'unlock': showLock(false); toast('unlocked', 'session resumed on tty1, seat0'); break;
    case 'detoast': { const e = ev.target.closest('.toast'); if (e) e.remove(); break; }
    case 'tile': tileAll(); break;
    case 'palette': S.pq = ''; S.psel = 0; showPalette(true); break;
    case 'overview': showOverview(!ovOn()); break;
    case 'lock': showLock(true); break;
    case 'closew': closeWin(arg); break;
    case 'minw': minWin(arg); break;
    case 'maxw': maxWin(arg); break;
    case 'toast': toast(arg === 'build' ? 'rebuilt' : arg === 'stat' ? 'stat' : 'block re-read',
      arg === 'build' ? 'zlos.elf 249.8 KiB, text 218432 data 30720 bss 1441792, 1.42 s'
      : arg === 'stat' ? FILES[S.fileSel][0] + ', generation 3, 1 extent, contiguous, crc verified'
      : 'pipe A read back, PSR idle, 241690 kHz unchanged'); break;
  }
}
document.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (!t.closest('.menu')) hideMenus();
  const sl = t.closest('[data-slider]');
  if (sl) { ev.preventDefault(); startSlider(ev, sl); return; }
  const wa = t.closest('[data-wa]');
  if (wa) {
    ev.preventDefault(); ev.stopPropagation();
    const id = winOf(wa), a = wa.getAttribute('data-wa');
    if (a === 'close') closeWin(id); else if (a === 'min') minWin(id); else maxWin(id);
    return;
  }
  const a = t.closest('[data-act]');
  if (a) {
    ev.preventDefault();
    const id = winOf(a); if (id) focusWin(id);
    act(a.getAttribute('data-act'), a.getAttribute('data-arg'), ev);
    return;
  }
  const drag = t.closest('[data-drag]');
  if (drag) { const id = winOf(drag); focusWin(id); startDrag(ev, id); return; }
  const grip = t.closest('.grip');
  if (grip) { const id = winOf(grip); focusWin(id); startResize(ev, id); return; }
  const w = t.closest('.win');
  if (w) { focusWin(w.getAttribute('data-id')); return; }
  if (t.closest('#palette .scrim')) showPalette(false);
});
document.addEventListener('dblclick', ev => {
  const d = ev.target.closest('[data-drag]');
  if (d) maxWin(winOf(d));
});
document.addEventListener('contextmenu', ev => {
  const d = ev.target.closest('[data-drag]');
  if (d) {
    ev.preventDefault();
    const id = winOf(d);
    const el = $('.win[data-id="' + id + '"]');
    const isOver = el.classList.contains('over');
    showMenu($('#winmenu'), ev.clientX, ev.clientY, [
      ['bring to front', 'open', id, false, 'click'],
      ['minimise', 'minw', id, false, 'travel 160'],
      ['maximise', 'maxw', id, false, 'double click'],
      '-',
      ['tile onto the module', 'tile', '', false, ''],
      ['this plate is ' + (isOver ? 'over another' : 'on the field'), 'noop', '', true,
        isOver ? r2('--zd-edge-over', '--zd-base') : r2('--zd-cut', '--zd-void')],
      ['header is ' + (S.focus === id ? 'knocked out' : 'at rest'), 'noop', '', true,
        S.focus === id ? r2('--zd-knock', '--zd-base') : '1.00'],
      '-',
      ['close', 'closew', id, false, '']
    ], APP[id].n + ' ' + APP[id].name);
    return;
  }
  if (ev.target.closest('#field')) {
    ev.preventDefault();
    showMenu($('#ctxmenu'), ev.clientX, ev.clientY, [
      ['activities', 'overview', '', false, 'f1'],
      ['command palette', 'palette', '', false, 'ctrl k'],
      '-',
      ['tile onto the module', 'tile', '', false, ''],
      ['toggle desk grid', 'tog', 'grid', false, 'ctrl g'],
      ['toggle the knockout', 'tog', 'knockout', false, ''],
      '-',
      ['workspace 01', 'ws', '1', false, 'alt 1'],
      ['workspace 02', 'ws', '2', false, 'alt 2'],
      '-',
      ['open 11 settings', 'open', 'set', false, 'alt 11'],
      ['lock session', 'lock', '', false, 'ctrl l']
    ], 'field');
  }
});
function startDrag(ev, id) {
  const w = S.wins[id]; if (!w || w.max) return;
  const e = $('.win[data-id="' + id + '"]');
  const ox = ev.clientX - e.offsetLeft, oy = ev.clientY - e.offsetTop;
  e.classList.add('drag');
  function mv(m) { w.x = m.clientX - ox; w.y = m.clientY - oy; layout(); }
  function up() {
    e.classList.remove('drag');
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(4);
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startResize(ev, id) {
  const w = S.wins[id]; if (!w) return;
  w.max = false;
  const sx = ev.clientX, sy = ev.clientY, sw2 = w.w, sh = w.h;
  function mv(m) {
    w.w = Math.max(280, sw2 + m.clientX - sx);
    w.h = Math.max(160, sh + m.clientY - sy);
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(2);
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startSlider(ev, el) {
  const key = el.getAttribute('data-slider');
  const lo = +el.getAttribute('data-lo'), hi = +el.getAttribute('data-hi');
  function set(e) {
    const r = el.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    S.cfg[key] = Math.round(lo + p * (hi - lo));
    applyCfg(); redraw('set');
  }
  set(ev);
  function up() {
    document.removeEventListener('mousemove', set);
    document.removeEventListener('mouseup', up); damage();
  }
  document.addEventListener('mousemove', set);
  document.addEventListener('mouseup', up);
}
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if (ev.shiftKey && (k === 'D' || k === 'd')) {
    setTheme(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return;
  }
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); return; }
    if (k === 'Enter') { runPalette(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(pmatch().length - 1, S.psel + 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); return; }
    if (k.length === 1) { S.pq += k; S.psel = 0; renderPalette(); return; }
    return;
  }
  if ($('#lock').classList.contains('on')) {
    if (k === 'Escape' || k === 'Enter') { showLock(false); toast('unlocked', 'session resumed on tty1, seat0'); }
    return;
  }
  if (k === 'Escape') { if (ovOn()) showOverview(false); hideMenus(); return; }
  if (k === 'F1') { showOverview(!ovOn()); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'l' || k === 'L')) { showLock(true); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'g' || k === 'G')) { act('tog', 'grid'); ev.preventDefault(); return; }
  if (ev.altKey && (k === '1' || k === '2')) { setWs(+k); ev.preventDefault(); return; }
});

/* ============================================================ theme ==
 * The hash is authoritative for BOTH scene and ladder. Dark is the
 * default and carries no suffix, because dark is primary here; #files
 * is graphite and #files-light is work light.
 */
const LADDER = {
  dark: { name: 'graphite, widened',
    pitch: 'graphite widened until a knockout fits. same 7.133% of a plate, ' +
           '4.63x the ratio.' },
  light: { name: 'work light',
    pitch: 'derived, not inverted. the lamp holds still and the headroom moves.' }
};
function applyTheme() {
  if (S.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = LADDER[S.theme].pitch;
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-ladder="dark">graphite</span>' +
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-ladder="light">worklight</span>';
}
function hashName() { return S.scene + (S.theme === 'light' ? '-light' : ''); }
function setTheme(t, announce) {
  S.theme = t === 'light' ? 'light' : 'dark';
  applyTheme(); renderLinks(); drawRaster(); renderFoot(); redrawAll();
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    toast(LADDER[S.theme].name, S.theme === 'dark'
      ? 'ground L* ' + lstar('--zd-base') + '. the struck edge carries depth at ' +
        r4('--zd-lit', '--zd-base') + ':1 and the knockout is a light plate at ' +
        r4('--zd-knock', '--zd-base') + ':1'
      : 'ground L* ' + lstar('--zd-base') + '. no headroom above it, so the cut edge carries at ' +
        r4('--zd-cut', '--zd-base') + ':1 and the knockout is an ink plate at ' +
        r4('--zd-knock', '--zd-base') + ':1. the widening does not apply upward here');
  }
}
const SCENES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function renderLinks() {
  const sfx = S.theme === 'light' ? '-light' : '';
  $('#links').innerHTML = SCENES.map(n => '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-light$/, '') === S.scene));
}
$('#themetog').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-ladder]');
  if (t) { ev.preventDefault(); ev.stopPropagation(); setTheme(t.getAttribute('data-ladder'), true); }
});

/* =========================================================== scenes == */
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.win[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZT = 10;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#toasts').innerHTML = '';
}
function put(id, x, y, w, h, ws) { openWin(id, [x, y, w, h], ws || S.ws); }
function baseDesktop() {
  clearAll();
  S.ws = 1;
  const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 800;
  const cw = Math.floor((fw - 34) / 2), ch = Math.floor((fh - 34) / 2);
  put('shell', 12, 12, cw, ch);
  put('files', cw + 22, 12, cw, ch);
  put('mon', 12, ch + 22, cw, ch);
  put('log', cw + 22, ch + 22, cw, ch);
  /* one plate deliberately laid ACROSS two others, front most and
     focused, so the knockout and the occlusion edge are both visible
     without touching anything. */
  put('regs', Math.floor(fw * 0.29), Math.floor(fh * 0.24), Math.floor(fw * 0.45), Math.floor(fh * 0.52));
  put('hex', 40, 40, Math.floor(fw * 0.5), Math.floor(fh * 0.55), 2);
  put('net', Math.floor(fw * 0.4), Math.floor(fh * 0.3), Math.floor(fw * 0.52), Math.floor(fh * 0.6), 2);
  focusWin('regs');
  layout(); damage(40);
}
function setScene(name, push) {
  let light = false;
  if (/-light$/.test(name)) { light = true; name = name.slice(0, -6); }
  if (SCENES.indexOf(name) < 0) { name = 'desktop'; light = false; }
  S.scene = name; S.theme = light ? 'light' : 'dark';
  applyTheme(); renderLinks();
  if (push !== false) history.replaceState(null, '', '#' + hashName());

  if (name === 'desktop') {
    baseDesktop();
    toast('five plates, one focused and over two',
      '13 REGISTERS is focused, so its header is knocked out at ' +
      r4('--zd-knock', '--zd-base') + ':1 - the same 7.133% of the plate graphite washed at ' +
      '1.400:1. its edges are ZD_EDGE_OVER at ' + r2('--zd-edge-over', '--zd-base') +
      ':1 on the bodies underneath, because a groove on this ground tops out at ' +
      darkCeil('--zd-base').toFixed(3) + ':1 and the floor is 3.00');
  } else if (name === 'overview') {
    baseDesktop(); layout(); showOverview(true);
  } else if (name === 'palette') {
    baseDesktop(); S.pq = 'toggle'; S.psel = 0; showPalette(true);
  } else if (name === 'files') {
    clearAll(); S.ws = 1;
    const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 800;
    put('files', 12, 12, Math.floor(fw * 0.44), fh - 24);
    put('edit', Math.floor(fw * 0.44) + 22, 12, fw - Math.floor(fw * 0.44) - 34, fh - 24);
    S.fileSel = 1; redraw('files'); redraw('edit');
    focusWin('files'); layout(); damage(20);
    toast('selected', 'fb.c 68.4 KiB, opened in 04 EDITOR. the two plates abut and do not ' +
      'overlap, so both draw ZD_CUT and the occlusion rule is inert. only one header is ' +
      'knocked out, which is the point');
  } else if (name === 'monitor') {
    clearAll(); S.ws = 1;
    const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 800;
    put('mon', 12, 12, Math.floor(fw * 0.56), Math.floor(fh * 0.68));
    put('net', Math.floor(fw * 0.50), 44, fw - Math.floor(fw * 0.50) - 24, Math.floor(fh * 0.72));
    focusWin('mon'); layout(); damage(60);
    toast('sampling at 1 Hz', '03 MONITOR is focused and lies under 08 NETWORK in area but ' +
      'over it in z, so MONITOR draws the boundary and NETWORK draws none. the raster strip ' +
      'advances one column per composite, so a 1 Hz sampler produces one column a second');
  } else if (name === 'settings') {
    clearAll(); S.ws = 1;
    const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 800;
    put('sys', Math.floor(fw * 0.52), 12, fw - Math.floor(fw * 0.52) - 24, Math.floor(fh * 0.58));
    put('type', Math.floor(fw * 0.52), Math.floor(fh * 0.60), fw - Math.floor(fw * 0.52) - 24, Math.floor(fh * 0.38));
    put('set', 12, 12, Math.floor(fw * 0.50), fh - 24);
    S.setTab = 1; redraw('set'); focusWin('set'); layout(); damage(12);
  } else if (name === 'lock') {
    baseDesktop(); showLock(true);
  }
  renderRail(); drawGrid(); renderFoot(); applyCfg();
}
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
window.addEventListener('resize', () => {
  layout(); drawGrid(); drawRaster(); renderFoot();
  if (ovOn()) showOverview(true);
});

/* ======================================================= token parity =
 * A token that exists in one mode only is a defect. This walks both
 * blocks and reports, rather than claiming.
 */
function parityCheck() {
  const names = [];
  for (let i = 0; i < document.styleSheets.length; i++) {
    let rules; try { rules = document.styleSheets[i].cssRules; } catch (e) { continue; }
    for (let j = 0; j < rules.length; j++) {
      const r = rules[j]; if (!r.style) continue;
      for (let k = 0; k < r.style.length; k++) {
        const p = r.style[k];
        if (p.indexOf('--zd-') === 0 && names.indexOf(p) < 0) names.push(p);
      }
    }
  }
  const missing = [];
  const root = document.documentElement;
  const was = root.getAttribute('data-theme');   /* restore, do not assume */
  names.forEach(n => {
    root.setAttribute('data-theme', 'light');
    const a = getComputedStyle(root).getPropertyValue(n).trim();
    root.removeAttribute('data-theme');
    const b = getComputedStyle(root).getPropertyValue(n).trim();
    if (!a || !b) missing.push(n);
  });
  if (was) root.setAttribute('data-theme', was); else root.removeAttribute('data-theme');
  return { total: names.length, missing: missing };
}

/* ============================================================ start == */
applyCfg();
for (let i = 0; i < 720; i++) S.raster.push({ us: 5200 + Math.round(Math.random() * 7000) });
setScene(location.hash.slice(1) || 'desktop', false);
drawGrid();
drawRaster();
renderFoot();
setInterval(tick, 1000);
(function () {
  const p = parityCheck();
  if (p.missing.length) console.warn('TOKEN PARITY DEFECT', p.missing);
  else console.log('token parity ok, ' + p.total + ' tokens in both ladders');
  console.log('lit on base ' + r4('--zd-lit', '--zd-base') +
              '  ko edge on knock ' + r4('--zd-ko-edge', '--zd-knock') +
              '  skew ' + edgeSkew().toFixed(2) + '%');
})();
</script>
