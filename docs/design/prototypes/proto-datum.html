<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum - zlOS desktop prototype</title>
<style>
/* =====================================================================
   DATUM. THE LAW: paper is the user's material, ink is the machine's.
   Every surface on screen is one or the other and nothing is in between.

   Four things are the direction's identity and are present in BOTH ladders:
     1. the full-height ink RAIL, whose right edge is THE DATUM
     2. the full-width ink RASTER STRIP carrying the machine's numbers
     3. a per-window microsecond timing in every plate's status band
     4. the memory-map RULER along the very bottom edge of the field

   Every colour below is a design.h primitive. No hex appears as a CSS value
   anywhere outside the two :root blocks.
   ===================================================================== */
:root{
  /* ---------- PAPER: the user's material ---------- */
  --zd-paper-0:#E4E1DA;   /* desktop ground / wallpaper base, and the 1dp gutter */
  --zd-paper-1:#F5F3EE;   /* plate body - the content ground */
  --zd-paper-2:#ECE9E3;   /* raised on paper: title band, toolbar, status band, card */
  --zd-paper-3:#DBD7CF;   /* sunken on paper: input wells, meter and segmented tracks */

  /* ---------- RULES ---------- */
  --zd-rule:#C3BEB4;      /* the hairline. every adjacency inside a plate. 1.67:1 */
  --zd-rule-hi:#847E73;   /* THE DATUM and every plate outline. 3.63:1 / 3.08:1 */

  /* ---------- INK: the machine's material ---------- */
  --zd-ink-0:#101317;     /* rail, raster strip, drawer, menu, modal, toast */
  --zd-ink-1:#191D22;     /* raised on ink: rail cell hover, menu item hover */
  --zd-ink-2:#2A2F36;     /* hairline on ink */
  --zd-ink-track:#383E47; /* empty gauge track, the strip's budget line */

  /* ---------- TEXT ON PAPER ---------- */
  --zd-t-0:#14130F;       /* emphasis: focused plate title, stat values.  16.76:1 */
  --zd-t-1:#232019;       /* BODY, the root ink of the desktop.           14.66:1 */
  --zd-t-2:#4E4A41;       /* secondary: unfocused titles, column heads.    7.96:1 */
  --zd-t-3:#635E54;       /* tertiary: mono measured values, units, hints. 5.81:1 */

  /* ---------- TEXT ON INK ---------- */
  --zd-it-0:#F0EEE8;      /* emphasis: clock, menu labels, focused rail label */
  --zd-it-1:#B9B4AA;      /* body: rail icons, menu body */
  --zd-it-2:#8E8980;      /* tertiary: strip readouts, below-budget columns */

  /* ---------- THE ACCENT. One hue, two materials. ---------- */
  --zd-mark:#0B5E78;      /* on paper: focused head rule, selection, active segment */
  --zd-mark-hi:#5CD2F2;   /* on ink: rail focus tick, gauge fill, launcher key */
  /* Text laid ON an accent fill. Light could nearly have skipped this role,
     the dark ladder cannot, so it is named in BOTH and resolved per material.
     ZD_ON_MARK_2 is not ZD_IT_1 reused: ZD_IT_1 measures 3.52:1 on ZD_MARK,
     which fails 4.5 for the 9.5px mono it carries in a selected row. */
  --zd-on-mark:#F0EEE8;   /* 6.27:1 on ZD_MARK */
  --zd-on-mark-2:#D5CFC3; /* 4.69:1 on ZD_MARK */

  /* ---------- STATE. Wired to state, never to the accent setting. ---------- */
  --zd-ok:#1E6B34;   --zd-warn:#7A4E04;   --zd-bad:#A32112;    /* on paper */
  --zd-ok-i:#56C97C; --zd-warn-i:#E6A83A; --zd-bad-i:#FF7B62;  /* on ink */

  /* accent alternates: still primitives, one hue pair each */
  --zd-mark-instrument:#0B5E78;  --zd-mark-hi-instrument:#5CD2F2;
  --zd-mark-graphite:#3B4048;    --zd-mark-hi-graphite:#C8CDD5;
  --zd-mark-oxide:#8C3A12;       --zd-mark-hi-oxide:#F0A277;
  --zd-mark-moss:#2C5A2A;        --zd-mark-hi-moss:#8FD684;

  /* the focus head rule's WEIGHT is a token, because optical weight is not
     symmetric across materials: 2dp of ink laid on paper and 2dp of light
     emitted off a dark plate are not the same mark. */
  --zd-w-head:2px;
  /* the one shadow in the system, under the drag ghost only */
  --zd-shadow-drag:0 6px 18px rgb(0 0 0 / 22%);

  /* harness furniture. NOT design.h tokens - the strip carrying scene links */
  --hz-bg:#DCD8D0;
  --hz-fg:#3A362E;
  --hz-dim:#635E54;   /* 4.55:1 on --hz-bg */

  /* ---------- scale ---------- */
  --dp:1;
  --rail:calc(56px * var(--dp));
  --strip:calc(20px * var(--dp));
  --title:calc(26px * var(--dp));
  --status:calc(20px * var(--dp));
  --pad:calc(12px * var(--dp));
  --gap:calc(8px * var(--dp));
  --row:calc(28px * var(--dp));

  /* ---------- type: ratio 1.2 from a 12.5px root, six sizes and only six ---------- */
  --t9:calc(9px * var(--dp));
  --t105:calc(10.5px * var(--dp));
  --t125:calc(12.5px * var(--dp));
  --t15:calc(15px * var(--dp));
  --t18:calc(18px * var(--dp));
  --t215:calc(21.5px * var(--dp));
  /* the MONO ladder, the only survivors of the retired eight */
  --m95:calc(9.5px * var(--dp));
  --m115:calc(11.5px * var(--dp));

  /* ---------- radius: three values, and only three ---------- */
  --r-flush:0px;                        /* the machine's frame, or flush to an edge */
  --r-plate:calc(3px * var(--dp));      /* every rectangular container */
  /* r = h/2 is resolved per widget from its own height; there is no token */

  /* ---------- motion: three durations ---------- */
  --ms-appear:90ms;   /* 5.4 frames at the measured 59.998 Hz */
  --ms-win:160ms;     /* 9.6 frames */
  /* focus change, press and every hover on paper are 0 */

  --sans:ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono:ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* =====================================================================
   THE SECOND LADDER - ui_theme_init_q8()'s dark primitive set.
   Same role names, different primitives. Nothing here is an inversion and
   nothing here is a stock near-black.

   THE CHOICE: both materials go dark and stay two materials. The law is
   "paper is the user's, ink is the machine's", not "the machine is dark",
   so SWAPPING them would make the rail and the strip the brightest objects
   on screen and turn the machine's chrome into a lit bezel framing the
   user's work - the machine would outrank the document. Instead the lamp
   goes out over the drawing board: the paper is the same warm sheet seen
   unlit, the ink is the same cool ink, and the machine stays the darker,
   denser substance it is on paper.

   WHAT THAT COSTS, stated up front: the two materials separated by 14.26:1
   of luminance on paper and separate by 1.18:1 here, because there is no
   room below a dark ground. So the separation moves onto the two axes that
   still have room - HUE (paper holds r > g > b, ink goes further cool at
   b - r = 14, was 7) and THE DATUM RULE at 3.55:1, which is depth device 1
   in this design's own ladder. Material inversion demotes from device 4 to
   last; the hairline promotes. That is the ladder being used as written,
   not a workaround - but it is a real loss, and it is the reason the datum
   rule and the strip's closing rule are non-negotiable in this mode.
   ===================================================================== */
:root[data-theme="dark"]{
  /* PAPER, unlit. Same ORDER as the light ladder (body lightest, then the
     raised band, then the ground, then the sunken well) because the raise
     ladder is a TINT ladder: a tinted sheet is darker whether or not the
     lamp is on. Hue held at r > g > b so it is never neutral grey. */
  --zd-paper-0:#241D14;
  --zd-paper-1:#302921;
  --zd-paper-2:#2A231A;
  --zd-paper-3:#1E1811;

  /* RULES. The direction reverses: on paper the hairline is graphite laid
     down, unlit it is the lit edge of the sheet. Its value DROPS with it,
     1.67:1 -> 1.37:1, because light on dark blooms and a hairline that
     holds its ratio gains weight. Still exactly 1 device pixel. */
  --zd-rule:#463F30;
  /* the datum and every plate outline. Its two ratios swap places: quieter
     against the plate it outlines (3.63 -> 3.06) and LOUDER against the
     ground and the ink it separates (3.08 -> 3.55, 4.62 -> 4.20). Both
     sides still clear WCAG 1.4.11's 3:1 for non-text boundaries. */
  --zd-rule-hi:#7C7360;

  /* INK. Moves least: it is a substance, it does not know the lamp went
     out. Slightly darker and materially COOLER, because hue is now
     carrying the material law that luminance used to carry. */
  --zd-ink-0:#060B14;
  --zd-ink-1:#101623;
  --zd-ink-2:#1F2735;
  --zd-ink-track:#323B4C;

  /* TEXT ON PAPER. Never #FFF: the sheet is warm, so its ink is warm too.
     ZD_T_0 tops out at 13.28:1 rather than 16.76:1 - full-white emphasis
     on a dark plate is a flare, not emphasis. */
  --zd-t-0:#FAF6EC;
  --zd-t-1:#E8E2D3;
  --zd-t-2:#B4AB98;
  --zd-t-3:#98907E;

  /* TEXT ON INK - cool, and essentially unchanged, because its ground is. */
  --zd-it-0:#EDF1F7;
  --zd-it-1:#B2BAC7;
  --zd-it-2:#868F9D;

  /* THE ACCENT, re-picked rather than re-used. Same hue family (instrument
     blue, about 197 degrees), lifted off the floor because a 6.56:1 deep
     blue on paper is a 2.36:1 smudge on a dark plate. The machine's form is
     unchanged - its ground did not move. So the pair is now distinguished
     by CHROMA where on paper it was distinguished by LUMINANCE. */
  --zd-mark:#3E9FC6;      /* 4.76:1 on the dark plate, was 6.56:1 on paper */
  --zd-mark-hi:#5CD2F2;   /* 11.22:1 on dark ink, was 10.60:1 on light ink */
  /* THE KNOCKOUT FIX. On paper an accent fill was the DARK thing and carried
     near-white text. Here the fill is the LIGHTER thing, so the text on it
     goes to ink. Without this the selection bar would be the brightest
     object on screen and would outrank the focused plate title, which is a
     hierarchy inversion, not a colour problem. */
  --zd-on-mark:#06131A;   /* 6.26:1 on ZD_MARK */
  --zd-on-mark-2:#0D2C3A; /* 4.85:1 on ZD_MARK */

  /* STATE on paper: the light forms of the same three hues, warmer than the
     ink forms below because they sit on a warm ground. */
  --zd-ok:#5BC47F;   --zd-warn:#D9A03C;   --zd-bad:#F0806B;
  /* STATE on ink: unchanged, same reason as ZD_IT_*. */
  --zd-ok-i:#56C97C; --zd-warn-i:#E6A83A; --zd-bad-i:#FF7B62;

  --zd-mark-instrument:#3E9FC6;  --zd-mark-hi-instrument:#5CD2F2;
  --zd-mark-graphite:#9EA5B0;    --zd-mark-hi-graphite:#C8CDD5;
  --zd-mark-oxide:#DE8A57;       --zd-mark-hi-oxide:#F0A277;
  --zd-mark-moss:#7BC271;        --zd-mark-hi-moss:#8FD684;

  /* THE ONE GEOMETRY CHANGE IN THE WHOLE DARK LADDER. 2dp of ink on paper
     and 2dp of emitted light on a dark plate are not the same mark; the
     second is roughly half again as heavy. The focus head rule HALVES to
     1dp. It can afford to: focus is stated in three places at once (head
     rule, rail tick, strip title), so it was never carrying it alone. */
  --zd-w-head:1px;
  /* the drag ghost has to bite into a dark ground, so its shadow deepens */
  --zd-shadow-drag:0 6px 18px rgb(0 0 0 / 62%);

  --hz-bg:#14110C;
  --hz-fg:#DED8CA;
  --hz-dim:#9A9182;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--zd-paper-0)}
body{
  font-family:var(--sans);
  font-size:var(--t125);
  color:var(--zd-t-1);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
body.motion-off *,body.motion-off *::before,body.motion-off *::after{transition:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
/* THE FACE RULE: every number the machine measured is mono, every word the
   user reads or wrote is proportional. No colour is spent on the distinction. */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
body.noface .mono{font-family:var(--sans)}
svg{display:block}
::-webkit-scrollbar{width:calc(6px * var(--dp));height:calc(6px * var(--dp))}
::-webkit-scrollbar-track{background:var(--zd-paper-3)}
::-webkit-scrollbar-thumb{background:var(--zd-rule-hi)}
.ink ::-webkit-scrollbar-track{background:var(--zd-ink-1)}
.ink ::-webkit-scrollbar-thumb{background:var(--zd-ink-track)}

/* ================= harness (not part of the design) ================= */
#harness{
  position:fixed;left:0;right:0;top:0;height:24px;z-index:400;
  background:var(--hz-bg);border-bottom:1px solid var(--zd-rule-hi);
  display:flex;align-items:center;gap:13px;padding:0 12px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--hz-dim);
}
#harness b{font-weight:400;letter-spacing:.24em;color:var(--hz-fg)}
#harness a{color:var(--hz-dim);text-decoration:none;letter-spacing:.12em}
#harness a:hover{color:var(--hz-fg)}
#harness a.on{color:var(--hz-fg);box-shadow:inset 0 -1px 0 0 var(--zd-mark)}
#hzspace{flex:1}
/* the ladder switch. It is pressed, so it is a pill: r = h/2, the rule every
   other pressable thing in this design obeys. */
#themetgl{
  display:flex;align-items:center;gap:6px;height:16px;padding:0 8px 0 5px;
  border:1px solid var(--zd-rule-hi);border-radius:8px;background:transparent;
  color:var(--hz-fg);letter-spacing:.12em;cursor:pointer;font:inherit;
  font-size:9.5px;text-transform:uppercase;
}
#themetgl .sw{width:8px;height:8px;border-radius:4px;display:block;border:1px solid var(--zd-rule-hi)}
#themetgl .sw.p{background:var(--zd-paper-1)}
#themetgl .sw.i{background:var(--zd-ink-0);margin-left:-4px}
/* Unlit, the two swatches are 1.18:1 apart and the control stops showing WHICH
   ladder is on - the honest fix is to mark the live one, not to lie about the
   material's real value. */
#themetgl .sw.on{border-color:var(--zd-mark);box-shadow:0 0 0 1px var(--zd-mark)}
#themetgl .kk{color:var(--hz-dim);letter-spacing:.08em}

/* ================= desktop ================= */
#desk{position:fixed;left:0;right:0;top:24px;bottom:0;overflow:hidden}

/* ---- 1. THE RAIL. Full height, flush, radius 0, no shadow. ---- */
#rail{
  position:absolute;left:0;top:0;bottom:0;width:var(--rail);
  background:var(--zd-ink-0);border-radius:var(--r-flush);
  border-right:1px solid var(--zd-rule-hi);            /* THE DATUM */
  display:flex;flex-direction:column;z-index:40;
}
.rrule{height:1px;background:var(--zd-ink-2);flex:none}
#railkey{
  height:var(--rail);flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--zd-mark-hi);cursor:pointer;
}
#railkey:hover{background:var(--zd-ink-1)}
#railws{flex:none;display:flex}
.wsc{
  flex:1;height:calc(22px * var(--dp));display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:var(--m95);color:var(--zd-it-2);cursor:pointer;
}
.wsc.on{color:var(--zd-mark-hi)}
.wsc:hover{background:var(--zd-ink-1)}
#railov{
  height:calc(30px * var(--dp));flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--zd-it-1);cursor:pointer;
}
#railov:hover{background:var(--zd-ink-1)}
#railwins{flex:1;min-height:0;overflow:hidden auto}
.cell{
  position:relative;height:calc(40px * var(--dp));flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--zd-ink-0);color:var(--zd-it-1);cursor:pointer;
  transition:background var(--ms-appear) ease-out;
}
.cell:hover{background:var(--zd-ink-1)}
.cell .tick{position:absolute;left:0;top:calc(12px * var(--dp));width:calc(2px * var(--dp));height:calc(16px * var(--dp))}
.cell.open .tick{background:var(--zd-ink-track)}
.cell.foc .tick{background:var(--zd-mark-hi)}
.cell.foc{color:var(--zd-it-0)}
.cell.mini{color:var(--zd-it-2)}
#railgauge{
  height:calc(96px * var(--dp));flex:none;
  display:flex;flex-direction:column;justify-content:center;gap:calc(9px * var(--dp));
  padding:0 calc(8px * var(--dp));
}
.gauge{display:flex;flex-direction:column;gap:calc(3px * var(--dp))}
.gauge .hd{display:flex;align-items:baseline;justify-content:space-between}
.gauge .lb{font-size:var(--t9);letter-spacing:.08em;text-transform:uppercase;color:var(--zd-it-2)}
.gauge .vv{font-family:var(--mono);font-size:var(--m95);color:var(--zd-it-1)}
.gauge .trk{position:relative;height:calc(4px * var(--dp));border-radius:calc(2px * var(--dp));background:var(--zd-ink-track);overflow:hidden}
.gauge .fil{position:absolute;left:0;top:0;bottom:0;background:var(--zd-mark-hi);border-radius:calc(2px * var(--dp))}
.gauge .fil.warn{background:var(--zd-warn-i)}
.gauge .fil.bad{background:var(--zd-bad-i)}

/* ---- 2. THE RASTER STRIP. Not a menu bar. It holds no menus. ---- */
#strip{
  position:absolute;left:var(--rail);right:0;top:0;height:var(--strip);
  background:var(--zd-ink-0);border-radius:var(--r-flush);
  border-bottom:1px solid var(--zd-rule-hi);
  display:flex;align-items:center;z-index:30;overflow:hidden;
}
body.nostrip #strip{display:none}
#hist{flex:0 0 60%;height:100%;width:60%}
#striprule{width:1px;align-self:stretch;background:var(--zd-ink-2);flex:none}
#striptitle{padding-left:var(--pad);font-size:var(--t125);color:var(--zd-it-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stripspace{flex:1;min-width:calc(8px * var(--dp))}
#readouts{display:flex;gap:calc(14px * var(--dp));font-family:var(--mono);font-size:var(--m95);color:var(--zd-it-2);white-space:nowrap}
#stripclock{margin:0 calc(16px * var(--dp));font-size:var(--t125);color:var(--zd-it-0);white-space:nowrap}

/* ---- 3. THE CONTENT FIELD ---- */
#field{
  position:absolute;left:var(--rail);right:0;top:var(--strip);bottom:0;
  background:linear-gradient(180deg,var(--zd-paper-2) 0%,var(--zd-paper-0) 58%);
  overflow:hidden;
}
body.nostrip #field{top:0}
/* 4. THE MEMORY-MAP RULER, along the very bottom edge. Decoration that
   happens to be true: these are memmap.h's real region bases. */
#memruler{position:absolute;left:0;right:0;bottom:0;width:100%;height:calc(26px * var(--dp));pointer-events:none}
body.noruler #memruler,body.noruler #lockruler{display:none}
#wins{position:absolute;inset:0}

/* ---- THE PLATE ---- */
.plate{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--zd-paper-1);
  border:1px solid var(--zd-rule-hi);
  border-radius:var(--r-plate);
}
.plate.mini{display:none}
.headrule{
  position:absolute;left:0;right:0;top:0;height:calc(var(--zd-w-head) * var(--dp));
  background:var(--zd-mark);display:none;z-index:3;
  border-radius:var(--r-plate) var(--r-plate) 0 0;
}
.plate.foc .headrule{display:block}
body.nohead .headrule{display:none}
.titleband{
  height:var(--title);flex:none;display:flex;align-items:center;
  background:var(--zd-paper-2);border-bottom:1px solid var(--zd-rule);
  padding-left:var(--pad);border-radius:var(--r-flush);cursor:default;
}
.wtitle{font-size:var(--t125);color:var(--zd-t-2);white-space:nowrap}
.plate.foc .wtitle{color:var(--zd-t-0)}
.wsub{margin-left:var(--pad);font-family:var(--mono);font-size:var(--m95);color:var(--zd-t-3);white-space:nowrap;overflow:hidden}
.wctl{margin-left:auto;display:flex;flex:none}
.wctl i{
  width:calc(22px * var(--dp));height:var(--title);display:flex;align-items:center;justify-content:center;
  color:var(--zd-t-2);cursor:pointer;
}
.wctl i:hover{color:var(--zd-t-0)}
.wctl i.x:hover{color:var(--zd-bad)}
.wctl svg{width:calc(10px * var(--dp));height:calc(10px * var(--dp))}
.wbody{flex:1;min-height:0;background:var(--zd-paper-1);position:relative;overflow:hidden}
.statusband{
  height:var(--status);flex:none;display:flex;align-items:center;
  background:var(--zd-paper-2);border-top:1px solid var(--zd-rule);
  border-radius:var(--r-flush);font-family:var(--mono);font-size:var(--m95);color:var(--zd-t-3);
}
/* leftmost 44dp: THIS window's own app_us for this frame */
.statusband .appus{width:calc(44px * var(--dp));padding-left:calc(9px * var(--dp));white-space:nowrap;color:var(--zd-t-2)}
.statusband .vr{width:1px;align-self:stretch;background:var(--zd-rule);flex:none}
.statusband .sb{padding:0 calc(9px * var(--dp));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusband .rt{margin-left:auto}
.plate.dragging{box-shadow:var(--zd-shadow-drag)}

/* ================= shared paper controls =================
   Containers are near-square (3dp) and controls are fully round (h/2).
   Shape alone tells you what you can touch. That contrast IS the shape system. */
.btn{
  height:calc(20px * var(--dp));display:inline-flex;align-items:center;padding:0 calc(10px * var(--dp));
  border-radius:calc(10px * var(--dp));background:var(--zd-paper-2);
  border:1px solid var(--zd-rule-hi);font-size:var(--t105);color:var(--zd-t-1);cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--zd-paper-3)}
.btn.pri{background:var(--zd-mark);border-color:var(--zd-mark);color:var(--zd-on-mark)}
.btn.lg{height:calc(26px * var(--dp));border-radius:calc(13px * var(--dp));padding:0 calc(16px * var(--dp));font-size:var(--t125)}
.lbl{font-size:var(--t9);letter-spacing:.08em;text-transform:uppercase;color:var(--zd-t-2);white-space:nowrap}
.lbl3{font-size:var(--t9);letter-spacing:.08em;text-transform:uppercase;color:var(--zd-t-3);white-space:nowrap}
.seg{display:inline-flex;padding:calc(2px * var(--dp));height:calc(22px * var(--dp));border-radius:calc(11px * var(--dp));background:var(--zd-paper-3);flex:none}
.seg span{
  height:calc(18px * var(--dp));display:inline-flex;align-items:center;padding:0 calc(11px * var(--dp));
  border-radius:calc(9px * var(--dp));font-size:var(--t105);color:var(--zd-t-2);cursor:pointer;white-space:nowrap;
}
.seg span.on{background:var(--zd-mark);color:var(--zd-on-mark)}

'void fb_blend_sub(u32 *dst, u32 src, const u8 cov[3])\n' +
'{\n' +
'    /* the 5 tap (1,2,3,2,1)/9 FIR runs in font_sub.c; by the time\n' +

'    }\n' +

   ========================================================================== */
const S = {
  theme:'light',              /* PAPER IS THE DEFAULT. Ink is opt in. */
  scene:'desktop',
  scale:1, accent:'instrument',
  snap:true, strip:true, ruler:true, head:true, motion:true, sub:true, face:true,
  gutter:8,
  ws:1, wins:[], zc:10, focus:null, seq:1,
  drawer:false, pal:false, ov:false, locked:false, modal:null,
  q:'', qi:0,
  sel:'fb.c', toasts:[], tick:0,
  calcAcc:'9216000', calcTape:['1600 * 1000 = 1600000','1600000 * 4 = 6400000','6400000 / 1024 = 6250'],
  hist:[], lastW:0, lastH:0
};
const ACCENTS = ['instrument','graphite','oxide','moss'];

/* the raster strip's ring buffer. One entry per advanced column, forever. */
const HIST_MAX = 900;
(function seedHist(){
  for (let i = 0; i < HIST_MAX; i++){
    /* frame totals in us against a 16667 us budget */
    let v = 8200 + Math.round(Math.sin(i / 23) * 1400 + Math.sin(i / 6.3) * 700);
    if (i % 97 === 0) v = 19400;      /* a damage storm */
    if (i % 211 === 0) v = 34800;     /* a genuine miss */
    S.hist.push(v);
  }
})();

/* ==========================================================================
   6. GEOMETRY. Plates snap to an 8dp grid whose ORIGIN IS THE DATUM,
      not the screen edge. Everything below measures x from there.
   ========================================================================== */
function F(){
  const r = $('#field').getBoundingClientRect();
  const G = Math.round(8 * S.scale);
  const gut = Math.round(S.gutter * S.scale);
  const ruler = S.ruler ? Math.round(26 * S.scale) : 0;
  return {w:r.width, h:r.height, G, gut, ruler, usable:Math.max(120, r.height - ruler)};
}
function snap(v, G){ return S.snap ? Math.round(v / G) * G : Math.round(v); }
function place(w){
  const f = F();
  if (w.max) return {x:f.gut, y:f.gut, w:f.w - 2 * f.gut, h:f.usable - 2 * f.gut};
  const W = clamp(Math.round(w.fw * f.w), 160, f.w - 2 * f.gut);
  const H = clamp(Math.round(w.fh * f.usable), 120, f.usable - 2 * f.gut);
  let x = w.px != null ? w.px : Math.round(w.fx * (f.w - W - 2 * f.gut)) + f.gut;
  let y = w.py != null ? w.py : Math.round(w.fy * (f.usable - H - 2 * f.gut)) + f.gut;
  x = clamp(snap(x, f.G), f.gut, Math.max(f.gut, f.w - W - f.gut));
  y = clamp(snap(y, f.G), f.gut, Math.max(f.gut, f.usable - H - f.gut));
  return {x, y, w:W, h:H};
}

/* ==========================================================================
   7. WINDOW MODEL
   ========================================================================== */
function mk(app, fx, fy, o){
  const a = APPS[app];
  return Object.assign({
    id:'w' + (S.seq++), app, name:a.name, sub:a.sub, ico:a.ico,
    fx, fy, fw:a.w, fh:a.h, px:null, py:null,
    ws:S.ws, min:false, max:false, z:++S.zc
  }, o || {});
}
function openApp(app, o){
  if (!APPS[app]){ toast('Drawer','warn','No such entry in this build.'); return null; }
  let w = S.wins.find(x => x.app === app);
  if (w){ w.ws = S.ws; w.min = false; raise(w); return w; }
  w = mk(app, .32, .26, o);
  S.wins.push(w); S.focus = w.id; render(); return w;
}
function raise(w){ w.z = ++S.zc; S.focus = w.id; render(); }
function closeWin(w){
  S.wins = S.wins.filter(x => x !== w);
  const rest = S.wins.filter(x => x.ws === S.ws && !x.min).sort((a,b) => b.z - a.z);
  S.focus = rest.length ? rest[0].id : null;
  toast('Closed', 'ok', esc(w.name) + ' released its plate. ' + S.wins.length + ' windows remain.',
        'freed ' + (140 + S.wins.length * 37) + ' KiB');
  render();
}
function focused(){ return S.wins.find(w => w.id === S.focus) || null; }
function visible(){ return S.wins.filter(w => w.ws === S.ws && !w.min).sort((a,b) => a.z - b.z); }

/* ==========================================================================
   8. THE RAIL
   ========================================================================== */
function renderRail(){
  $('#railws').innerHTML = [1,2].map(n =>
    '<div class="wsc mono ' + (S.ws === n ? 'on' : '') + '" data-ws="' + n + '" title="Workspace ' + n + '">' + n + '</div>').join('');
  $('#railov').classList.toggle('on', S.ov);

  const running = S.wins.filter(w => w.ws === S.ws);
  const runApps = running.map(w => w.app);
  const pins = PINNED.filter(a => runApps.indexOf(a) < 0);
  let h = running.sort((a,b) => a.id.localeCompare(b.id)).map(w =>
    '<div class="cell ' + (w.id === S.focus && !w.min ? 'foc' : 'open') + (w.min ? ' mini' : '') +
    '" data-cell="' + w.id + '" title="' + esc(w.name) + '">' +
    '<i class="tick"></i><svg width="24" height="24" viewBox="0 0 96 96"><use href="#' + w.ico + '"/></svg></div>').join('');
  /* the ONE grouping device: a 1px rule between running and pinned */
  if (running.length && pins.length) h += '<div class="rrule"></div>';
  h += pins.map(a =>
    '<div class="cell" data-launch="' + a + '" title="' + esc(APPS[a].name) + '">' +
    '<i class="tick"></i><svg width="24" height="24" viewBox="0 0 96 96"><use href="#' + APPS[a].ico + '"/></svg></div>').join('');
  $('#railwins').innerHTML = h;

  const g = [
    ['cpu', clamp(31 + wob(0, 9, 11) + S.wins.length * 4, 4, 100)],
    ['mem', clamp(46 + wob(1, 5, 19) + S.wins.length * 3, 4, 100)],
    ['io',  clamp(12 + wob(2, 11, 7), 2, 100)]
  ];
  $('#railgauge').innerHTML = g.map(([k, v]) =>
    '<div class="gauge" title="' + k + ' ' + v + '%">' +
    '<div class="hd"><span class="lb">' + k + '</span><span class="vv">' + v + '</span></div>' +
    '<div class="trk"><i class="fil ' + (v > 85 ? 'bad' : v > 70 ? 'warn' : '') +
    '" style="width:' + v + '%"></i></div></div>').join('');
}

/* ==========================================================================
   9. THE RASTER STRIP. The only self moving thing on this desktop: one
      1 pixel column per frame, forever. Everything else is still while the
      user is still. Three colour classes, one path each, one DOM write.
   ========================================================================== */
function histPath(el, w, h){
  if (!w || !h) return;
  const cw = 2;                                   /* 2 device px per column */
  const n = Math.max(1, Math.floor(w / cw));
  const start = Math.max(0, S.hist.length - n);
  const budget = 16667;                            /* one frame at 59.998 Hz */
  const p = {below:'', at:'', over:''};
  for (let i = 0; i < n; i++){
    const v = S.hist[start + i]; if (v == null) continue;
    const cls = v > budget * 2 ? 'over' : v > budget ? 'at' : 'below';
    const bh = Math.max(1, Math.min(h, Math.round(v * h / (budget * 1.4))));
    p[cls] += 'M' + (i * cw) + ' ' + (h - bh) + 'h' + (cw - 1) + 'v' + bh + 'h' + -(cw - 1) + 'z';
  }
  /* the budget line: non information bearing, so it sits on the track token */
  const by = h - Math.round(budget * h / (budget * 1.4));
  el.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  el.setAttribute('width', w); el.setAttribute('height', h);
  el.innerHTML =
    '<path d="' + p.below + '" fill="var(--zd-it-2)"/>' +
    '<path d="' + p.at + '" fill="var(--zd-mark-hi)"/>' +
    '<path d="' + p.over + '" fill="var(--zd-bad-i)"/>' +
    '<rect x="0" y="' + by + '" width="' + w + '" height="1" fill="var(--zd-ink-track)"/>';
}
function renderHist(){
  const sr = $('#strip').getBoundingClientRect();
  if (sr.width > 0) histPath($('#hist'), Math.round(sr.width * 0.6), Math.round(sr.height));
  if (S.locked){
    const lr = $('#lockstrip').getBoundingClientRect();
    if (lr.width > 0) histPath($('#lockhist'), Math.round(lr.width), Math.round(lr.height));
  }
}
function renderStrip(){
  const f = focused();
  $('#striptitle').textContent = f ? f.name + '  ' + f.sub : 'no window focused';
  const total = S.hist[S.hist.length - 1] || 0;
  const app = f ? +APPS[f.app].us : 0;
  $('#readouts').innerHTML =
    '<span>frame ' + pad5(total) + ' us</span>' +
    '<span>damage ' + pad2(clamp(3 + S.wins.filter(w => !w.min && w.ws === S.ws).length + wob(3, 2, 5), 1, 32)) + ' rects</span>' +
    '<span>blend ' + (1.42 + (app / 4000)).toFixed(2) + ' Mpx</span>';
  const d = new Date();
  $('#stripclock').textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function pad5(n){ return ('00000' + n).slice(-5); }

/* ==========================================================================
   10. THE MEMORY MAP RULER, along the very bottom edge.
   ========================================================================== */
/* One geometry, two materials. The ruler is drawn on paper in the field and on
   ink under the lock, so the three roles it spends - baseline+base tick, the
   midpoint half tick, and the label - are passed in rather than hard bound. */
function rulerPath(el, w, h, tick, half, txt){
  if (!el || !w || !h) return;
  const total = MEMMAP.reduce((a, m) => a + m[2], 0);
  let x = 0, g = '';
  /* the baseline is the very bottom device pixel of the surface */
  g += '<rect x="0" y="' + (h - 1) + '" width="' + w + '" height="1" fill="' + tick + '"/>';
  MEMMAP.forEach(m => {
    const seg = m[2] / total * w;
    const x0 = Math.round(x);
    /* a full height tick at every region base, a half tick at its midpoint */
    g += '<rect x="' + x0 + '" y="' + (h - 13) + '" width="1" height="13" fill="' + tick + '"/>';
    g += '<rect x="' + Math.round(x + seg / 2) + '" y="' + (h - 6) + '" width="1" height="6" fill="' + half + '"/>';
    if (seg > 46)
      g += '<text x="' + (x0 + 4) + '" y="' + (h - 15) + '" fill="' + txt + '" ' +
           'font-family="var(--mono)" font-size="' + (8 * S.scale) + '" letter-spacing="0.06em">' + m[1] + '</text>';
    if (seg > 86)
      g += '<text x="' + (x0 + 4) + '" y="' + (h - 4) + '" fill="' + txt + '" ' +
           'font-family="var(--mono)" font-size="' + (8 * S.scale) + '" opacity="0.72">' + m[0] + '</text>';
    x += seg;
  });
  el.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  el.setAttribute('width', w); el.setAttribute('height', h);
  el.innerHTML = g;
}
function renderRuler(){
  const r = $('#field').getBoundingClientRect();
  rulerPath($('#memruler'), Math.round(r.width), Math.round(26 * S.scale),
            'var(--zd-rule-hi)', 'var(--zd-rule)', 'var(--zd-t-3)');
  if (S.locked){
    const lr = $('#lockruler').getBoundingClientRect();
    rulerPath($('#lockruler'), Math.round(lr.width), Math.round(26 * S.scale),
              'var(--zd-rule-hi)', 'var(--zd-ink-track)', 'var(--zd-it-2)');
  }
}

  $('#lockstats').innerHTML =
    '<span>uptime <b>4h 12m</b></span><span>frame <b>' + pad5(S.hist[S.hist.length - 1] || 0) + ' us</b></span>' +

function toast(head, kind, body, m){
  const t = {id:'t' + (S.seq++), head, kind, body, m};
  S.toasts.push(t); if (S.toasts.length > 3) S.toasts.shift();
  renderToasts();
  setTimeout(() => { S.toasts = S.toasts.filter(x => x !== t); renderToasts(); }, 5200);
}
function renderToasts(){
  $('#toasts').innerHTML = S.toasts.map(t =>
    '<div class="toast"><i class="bar ' + (t.kind || '') + '"></i><div>' +
    '<div class="ti">' + esc(t.head) + '</div><div class="tx">' + t.body + '</div>' +
    (t.m ? '<div class="tm">' + esc(t.m) + '</div>' : '') + '</div></div>').join('');
}
let menuItems = [];
function closeMenu(){ $('#ctxmenu').classList.remove('on'); menuItems = []; }
function showMenu(x, y, items){
  menuItems = items;
  const el = $('#ctxmenu');
  el.innerHTML = items.map((it, i) => it === '-' ? '<div class="msep"></div>' :
    '<div class="mrow' + (it[3] === false ? ' dis' : '') + '" data-mi="' + i + '">' +
    esc(it[0]) + '<span class="kk">' + esc(it[1] || '') + '</span></div>').join('');
  el.classList.add('on');
  const r = el.getBoundingClientRect();
  el.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  el.style.top  = Math.min(y - 24, innerHeight - r.height - 32) + 'px';
}

/* ==========================================================================
   17. RENDER
   ========================================================================== */
function render(){
  const root = document.documentElement;
  root.style.setProperty('--dp', S.scale);
  root.style.setProperty('--zd-mark', 'var(--zd-mark-' + S.accent + ')');
  root.style.setProperty('--zd-mark-hi', 'var(--zd-mark-hi-' + S.accent + ')');
  document.body.classList.toggle('nostrip', !S.strip);
  document.body.classList.toggle('noruler', !S.ruler);
  document.body.classList.toggle('nohead', !S.head);
  document.body.classList.toggle('motion-off', !S.motion);
  document.body.classList.toggle('noface', !S.face);
  document.body.style.webkitFontSmoothing = S.sub ? 'antialiased' : 'none';

  $('#drawer').classList.toggle('on', S.drawer);
  $('#palette').classList.toggle('on', S.pal);
  $('#overview').classList.toggle('on', S.ov);
  $('#lock').classList.toggle('on', S.locked);
  $('#modal').classList.toggle('on', !!S.modal);
  if (S.modal) renderModal();
  if (S.drawer) renderDrawer();
  if (S.pal) renderPalette();
  if (S.ov) renderOv();
  if (S.locked) renderLock();

  renderWins(); renderRail(); renderStrip(); renderRuler(); renderHist(); renderScenes();
}

}

/* ==========================================================================
   18. SCENES. Reading the hash sets the state, on load AND on hashchange,
       with zero clicks. "#files" is the scene on paper, "#files-dark" is
       the same scene on ink. The suffix is stripped BEFORE the lookup.
   ========================================================================== */
const SCENES = ['desktop','overview','palette','files','monitor','settings','lock'];
function renderScenes(){
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#scenes').innerHTML = SCENES.map(n =>
    '<a href="#' + n + sfx + '" class="' + (n === S.scene ? 'on' : '') + '">' + n + '</a>').join(' ');
  $('#themelbl').textContent = S.theme === 'dark' ? 'ink' : 'paper';
  /* unlit, the two swatches are 1.18:1 apart; the live one is marked */
  $('#themetgl .sw.p').classList.toggle('on', S.theme !== 'dark');
  $('#themetgl .sw.i').classList.toggle('on', S.theme === 'dark');
}
function applyTheme(t){
  S.theme = t === 'dark' ? 'dark' : 'light';
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
/* The switch rewrites the hash rather than flipping the attribute, so the
   address bar is always a truthful deep link to what is on screen. */
function setTheme(t){
  if (t === S.theme) return;
  location.hash = '#' + S.scene + (t === 'dark' ? '-dark' : '');
}
function reset(){
  S.wins = []; S.zc = 10; S.seq = 1; S.ws = 1; S.focus = null;
  S.drawer = S.pal = S.ov = S.locked = false; S.modal = null;
  S.q = ''; S.qi = 0; S.toasts = []; closeMenu();
}
function baseDesktop(){
  S.wins = [
    mk('log',   1, 1, {fw:.44, fh:.40}),
    mk('mon',   0, 0, {fw:.28, fh:.60}),
    mk('files', 1, 0, {fw:.42, fh:.50}),
    mk('term',  0, 1, {fw:.40, fh:.34})
  ];
  S.focus = S.wins[S.wins.length - 1].id;
}
function twoUp(a, b){
  a.fx = 0; a.fw = .495; a.fy = 0; a.fh = .97;
  b.fx = 1; b.fw = .495; b.fy = 0; b.fh = .97;
  a.px = a.py = b.px = b.py = null;
}
function applyScene(name){
  S.scene = name;
  reset();
  const f = F(); S.lastW = f.w; S.lastH = f.h;
  if (name === 'desktop'){
    baseDesktop();
    setTimeout(() => toast('wmshot', 'ok', 'Wrote <span class="mono">/tmp/wmshot.ppm</span>, 6400000 bytes.', '11.2 ms'), 60);
  } else if (name === 'overview'){
    baseDesktop();
    S.wins.push(mk('net', .1, .1, {ws:2}), mk('clock', .6, .3, {ws:2}), mk('regs', .3, .6, {ws:1, fw:.42, fh:.34}));
    S.ov = true;
  } else if (name === 'palette'){
    baseDesktop();
    S.pal = true; S.q = 'work'; S.qi = 0;
  } else if (name === 'files'){
    S.wins = [mk('edit', 0, 0), mk('files', 0, 0)];
    twoUp(S.wins[1], S.wins[0]);
    S.focus = S.wins[1].id; S.sel = 'fb.c';
  } else if (name === 'monitor'){
    S.wins = [mk('net', 0, 0), mk('mon', 0, 0)];
    twoUp(S.wins[1], S.wins[0]);
    S.focus = S.wins[1].id;
  } else if (name === 'settings'){
    S.wins = [
      mk('term',  0, 0,  {fw:.40, fh:.46}),
      mk('files', 0, 1,  {fw:.40, fh:.48}),
      mk('set',   1, 0,  {fw:.54, fh:.97})
    ];
    S.focus = S.wins[2].id;
  } else if (name === 'lock'){
    baseDesktop();
    S.locked = true;
  }
  render();
}
function readHash(){
  let h = (location.hash || '#desktop').slice(1);
  let theme = 'light';
  if (h.slice(-5) === '-dark'){ theme = 'dark'; h = h.slice(0, -5); }
  if (SCENES.indexOf(h) < 0) h = 'desktop';
  const sameScene = (h === S.scene && S.wins.length > 0);
  applyTheme(theme);
  /* flipping material must not rebuild the desk under you */
  if (sameScene) render(); else applyScene(h);
}
window.addEventListener('hashchange', readHash);

/* ==========================================================================
   19. INTERACTION
   ========================================================================== */
function setWs(n){
  S.ws = n;
  const f = S.wins.filter(w => w.ws === n && !w.min).sort((a,b) => b.z - a.z);
  S.focus = f.length ? f[0].id : null;
  render();
  toast('Workspace ' + n, 'ok', f.length + ' windows on this workspace.');
}

/* ---- drag: the ONE place fb_shadow is called ---- */
let drag = null;
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ctxmenu')) closeMenu();
  const sl = e.target.closest('[data-sld]');
  if (sl){ dragSlider(sl, e); return; }
  const dh = e.target.closest('[data-drag]');
  if (dh && !e.target.closest('.wctl')){
    const w = S.wins.find(x => x.id === dh.dataset.drag); if (!w || w.max) return;
    raise(w);
    const node = $('#wins [data-id="' + w.id + '"]'); if (!node) return;
    const p = place(w);
    drag = {w, sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y, moved:false};
    node.classList.add('dragging');
    e.preventDefault();
  }
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  drag.moved = true;
  const node = $('#wins [data-id="' + drag.w.id + '"]'); if (!node) return;
  node.style.left = (drag.ox + dx) + 'px';
  node.style.top  = (drag.oy + dy) + 'px';
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  const node = $('#wins [data-id="' + drag.w.id + '"]');
  if (node && drag.moved){
    drag.w.px = parseFloat(node.style.left);
    drag.w.py = parseFloat(node.style.top);
  }
  if (node) node.classList.remove('dragging');
  drag = null; render();
});
function dragSlider(el, e){
  const name = el.dataset.sld, min = +el.dataset.min, max = +el.dataset.max;
  const set = ev => {
    const r = el.getBoundingClientRect();
    const t = clamp((ev.clientX - r.left) / r.width, 0, 1);
    let v = min + t * (max - min);
    if (name === 'scale')  v = Math.round(v * 20) / 20;
    if (name === 'gutter') v = Math.round(v);
    S[name] = v; render();
  };
  set(e);
  const mv = ev => set(ev);
  const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  e.preventDefault();
}

document.addEventListener('click', e => {
  const t = e.target;
  /* the ladder switch works while locked: the lock scene is one of the seven
     and it has to be inspectable in both materials */
  if (t.closest('#themetgl')){ setTheme(S.theme === 'dark' ? 'light' : 'dark'); return; }
  if (S.locked){ S.locked = false; render(); return; }

  const mi = t.closest('#ctxmenu [data-mi]');
  if (mi){ const it = menuItems[+mi.dataset.mi]; closeMenu(); if (it && it[2] && it[3] !== false) it[2](); return; }
  const md = t.closest('[data-mod]');
  if (md){ const yes = md.dataset.mod === 'yes', m = S.modal; S.modal = null; render(); if (yes && m && m.fn) m.fn(); return; }

  const c = t.closest('.wctl [data-c]');
  if (c){
    const w = S.wins.find(x => x.id === c.dataset.id); if (!w) return;
    if (c.dataset.c === 'min'){ w.min = true; if (S.focus === w.id) S.focus = null; render(); }
    else if (c.dataset.c === 'max'){ w.max = !w.max; w.px = w.py = null; raise(w); }
    else askClose(w);
    return;
  }
  if (t.closest('#railkey')){ S.drawer = !S.drawer; S.q = ''; render(); return; }
  if (t.closest('#railov')){ S.ov = !S.ov; render(); return; }
  const ws = t.closest('[data-ws]'); if (ws){ setWs(+ws.dataset.ws); return; }
  const la = t.closest('[data-launch]'); if (la){ S.drawer = false; openApp(la.dataset.launch); return; }
  const cell = t.closest('[data-cell]');
  if (cell){
    const w = S.wins.find(x => x.id === cell.dataset.cell); if (!w) return;
    if (w.min){ w.min = false; raise(w); }
    else if (S.focus === w.id){ w.min = true; S.focus = null; render(); }
    else raise(w);
    return;
  }
  const mini = t.closest('[data-mini]');
  if (mini){ const w = S.wins.find(x => x.id === mini.dataset.mini); if (w){ S.ov = false; w.min = false; raise(w); } return; }
  const cmd = t.closest('[data-cmd]');
  if (cmd){ const c2 = CMDS.find(x => x[0] === cmd.dataset.cmd); S.pal = false; render(); if (c2) c2[3](); return; }

  const seg = t.closest('[data-seg] [data-v]');
  if (seg){
    const g = seg.closest('[data-seg]').dataset.seg;
    if (g === 'theme') setTheme(seg.dataset.v);
    else { S[g] = seg.dataset.v; render(); toast('Accent', 'ok', 'One token repointed. No call site changed.', 'ZD_MARK + ZD_MARK_HI'); }
    return;
  }
  const tg = t.closest('[data-tgl]'); if (tg){ S[tg.dataset.tgl] = !S[tg.dataset.tgl]; render(); return; }
  const ck = t.closest('[data-ck]'); if (ck){ calcKey(ck.dataset.ck); return; }
  const fr = t.closest('tr[data-file]'); if (fr){ S.sel = fr.dataset.file; render(); return; }

  if (S.pal && !t.closest('#palette')){ S.pal = false; render(); return; }
  if (S.drawer && !t.closest('#drawer') && !t.closest('#railkey')){ S.drawer = false; render(); return; }

  const win = t.closest('.plate[data-id]');
  if (win){ const w = S.wins.find(x => x.id === win.dataset.id); if (w && w.id !== S.focus) raise(w); return; }
});
function askClose(w){
  if (w.app !== 'edit'){ closeWin(w); return; }
  S.modal = {
    h:'Discard changes to fb.c',
    b:'The buffer has 41 unsaved lines. A modal darkens nothing: the plate behind it just went unfocused, which is the same language the rest of the desktop uses.',
    no:'Keep editing', yes:'Discard', fn:() => closeWin(w)
  };
  render();
}
function calcKey(k){
  if (k === 'C') S.calcAcc = '0';
  else if (k === '='){ S.calcTape = S.calcTape.slice(-4).concat([S.calcAcc + ' = ' + S.calcAcc]); }
  else if (/[0-9.]/.test(k)) S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k;
  else S.calcAcc = S.calcAcc + ' ' + k + ' ';
  render();
}
function winMenu(w, x, y){
  showMenu(x, y, [
    ['Raise', 'ret', () => raise(w)],
    ['Minimise', '', () => { w.min = true; if (S.focus === w.id) S.focus = null; render(); }],
    ['Fit to field', 'ctrl+ret', () => { w.max = !w.max; w.px = w.py = null; raise(w); }],
    '-',
    ['Move to workspace 1', 'ctrl+1', () => { w.ws = 1; render(); }, w.ws !== 1],
    ['Move to workspace 2', 'ctrl+2', () => { w.ws = 2; render(); }, w.ws !== 2],
    '-',
    ['Close', 'ctrl+w', () => askClose(w)]
  ]);
}
document.addEventListener('contextmenu', e => {
  if (S.locked) return;
  e.preventDefault();
  const win = e.target.closest('.plate[data-id]');
  if (win){ const w = S.wins.find(x => x.id === win.dataset.id); if (w){ raise(w); winMenu(w, e.clientX, e.clientY); return; } }
  showMenu(e.clientX, e.clientY, [
    ['New shell', 'super+t', () => openApp('term')],
    ['Open Files', 'super+e', () => openApp('files')],
    ['Applications', 'super', () => { S.drawer = true; render(); }],
    ['Command', 'ctrl+k', () => { S.pal = true; S.q = ''; S.qi = 0; render(); }],
    '-',
    ['Activities', 'super', () => { S.ov = true; render(); }],
    ['Tile all to the datum', '', tileAll],
    ['Switch to ' + (S.theme === 'dark' ? 'paper' : 'ink'), 'shift+D', () => setTheme(S.theme === 'dark' ? 'light' : 'dark')],
    '-',
    ['Lock session', 'ctrl+l', () => { S.locked = true; render(); }]
  ]);
});
function tileAll(){
  const list = S.wins.filter(w => w.ws === S.ws && !w.min);
  const cols = Math.min(2, Math.max(1, list.length));
  list.forEach((w, i) => {
    w.max = false; w.px = w.py = null;
    w.fw = .495; w.fh = list.length > cols ? .485 : .97;
    w.fx = (i % cols) / Math.max(1, cols - 1 || 1);
    w.fy = list.length > cols ? Math.floor(i / cols) / Math.max(1, Math.ceil(list.length / cols) - 1 || 1) : 0;
    if (cols === 1) w.fx = 0;
  });
  render();
  toast('Tiled', 'ok', 'Every plate snapped to the 8dp grid whose origin is the datum.');
}
document.addEventListener('dblclick', e => {
  const dh = e.target.closest('[data-drag]');
  if (dh){ const w = S.wins.find(x => x.id === dh.dataset.drag); if (w){ w.max = !w.max; w.px = w.py = null; raise(w); } }
});

/* ---- keyboard ---- */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  /* bound before the lock guard, for the same reason the switch is */
  if ((e.shiftKey && k === 'd') || (e.ctrlKey && k === 'b')){
    e.preventDefault(); setTheme(S.theme === 'dark' ? 'light' : 'dark'); return;
  }
  if (S.locked){ if (e.key === 'Enter' || e.key === 'Escape'){ S.locked = false; render(); e.preventDefault(); } return; }
  if (S.modal){ if (e.key === 'Escape'){ S.modal = null; render(); } return; }

  if (e.ctrlKey && k === 'k'){ e.preventDefault(); S.pal = !S.pal; S.q = ''; S.qi = 0; S.drawer = false; render(); return; }
  if (e.ctrlKey && k === 'l'){ e.preventDefault(); S.locked = true; render(); return; }
  if (e.ctrlKey && k === 'w'){ e.preventDefault(); const w = focused(); if (w) askClose(w); return; }
  if (e.ctrlKey && (k === '1' || k === '2')){ e.preventDefault(); setWs(+k); return; }
  if (e.key === 'Escape'){
    if (S.pal || S.drawer || S.ov){ S.pal = S.drawer = S.ov = false; render(); }
    closeMenu(); return;
  }
  if (S.pal){
    const hits = cmdHits();
    if (e.key === 'ArrowDown'){ e.preventDefault(); S.qi = clamp(S.qi + 1, 0, hits.length - 1); renderPalette(); return; }
    if (e.key === 'ArrowUp'){ e.preventDefault(); S.qi = clamp(S.qi - 1, 0, hits.length - 1); renderPalette(); return; }
    if (e.key === 'Enter'){ e.preventDefault(); const c = hits[S.qi]; S.pal = false; render(); if (c) c[3](); return; }
    if (e.key === 'Backspace'){ e.preventDefault(); S.q = S.q.slice(0, -1); S.qi = 0; renderPalette(); return; }
    if (e.key.length === 1 && !e.ctrlKey){ e.preventDefault(); S.q += e.key; S.qi = 0; renderPalette(); return; }
  }
  if (S.drawer){
    if (e.key === 'Backspace'){ e.preventDefault(); S.q = S.q.slice(0, -1); renderDrawer(); return; }
    if (e.key.length === 1 && !e.ctrlKey){ e.preventDefault(); S.q += e.key; renderDrawer(); return; }
  }
});

/* ==========================================================================
   20. THE HEARTBEAT. Nothing on this desktop animates while the user is not
       acting, with exactly one exception, and the exception is the point:
       the raster strip advances one column per frame, forever.
   ========================================================================== */
let acc = 0, last = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!S.motion) return;
  if (!last) last = now;
  const dt = now - last; last = now;
  acc += dt;
  /* one column per rendered frame; batched to one DOM write every 3 frames */
  const steps = Math.min(6, Math.floor(acc / 16.667));
  if (steps < 3) return;
  acc -= steps * 16.667;
  for (let i = 0; i < steps; i++){
    S.tick++;
    let v = 8200 + Math.round(Math.sin(S.tick / 23) * 1400 + Math.sin(S.tick / 6.3) * 700)
              + S.wins.filter(w => !w.min && w.ws === S.ws).length * 260;
    if (S.tick % 97 === 0) v = 19400;
    if (S.tick % 211 === 0) v = 34800;
    S.hist.push(v);
    if (S.hist.length > HIST_MAX) S.hist.shift();
  }
  renderHist();
}
requestAnimationFrame(frame);

/* the slow tick: values move, nothing animates for decoration */
setInterval(() => {
  if (S.locked){ renderLock(); return; }
  renderStrip(); renderRail();
  S.wins.filter(w => w.ws === S.ws && !w.min && ['mon','net','clock'].indexOf(w.app) >= 0).forEach(w => {
    const n = $('#wins [data-id="' + w.id + '"] .wbody');
    if (n) n.innerHTML = BODY[w.app]();
  });
}, 1000);

window.addEventListener('resize', () => {
  if (drag) return;
  const f = F();
  if (Math.abs(f.w - S.lastW) > 2 || Math.abs(f.h - S.lastH) > 2){
    S.lastW = f.w; S.lastH = f.h;
  }
  render();
});

/* boot */
readHash();
</script>
</body>
</html>
