<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLUELINE / zlOS living prototype</title>
<style>
/* ======================================================================
   BLUELINE - the desktop as an engineering drawing.

   ONE HUE per mode. NO BLACK anywhere, in either mode. The ground is
   neither paper nor near-black: dark is a saturated Prussian-blue
   cyanotype, light is the buff diazo whiteprint that historically
   SUCCEEDED the blueprint, so the second ladder is a real second process
   rather than an inversion of the first.

   Separation is LINE, never value. The surface steps are deliberately
   below threshold - 1.21:1 dark, 1.07:1 light - because a drawing does
   not tint its views, it draws them. Everything a desktop normally says
   with fill, shadow or hue, this says with LINE TYPE:

       continuous     the view you are working in
       hidden (8-4)   a view that is present but not current
       chain-dot      a view that BELONGS TO another view
       phantom        a view that is minimised and still where it was

   All four are drawn at 2px. That is a correction to the original
   sketch, which had continuous at 2px and hidden at 1px: state would
   then have been riding partly on a single-pixel mark over a 1.07:1
   surface step with no value fallback under it. At one weight, the
   PATTERN alone carries the state, a one-pixel dash-phase drift is
   invisible, and the distinction survives any panel gamma.

   design.h token block. No hex value appears as a CSS value anywhere
   outside :root and :root[data-theme="dark"]. Every name below exists in
   BOTH ladders; a name in one mode only is a defect.
   ====================================================================== */
:root {
  /* ------------------------------------------------ LIGHT: THE DIAZO --
     The whiteprint. A diazo print is blue line on a buff, slightly
     yellowed stock - it is what drawing offices moved to when the wet
     cyanotype process died, and it prints the LINE dark on a light
     ground rather than clearing it out of a dark one. So it is the same
     drawing run through a different process, not this document with its
     values flipped. */
  --zb-ground:     #F0ECE0;  /* the sheet stock. everything sits on it. */
  --zb-sheet:      #F7F4EA;  /* a VIEW's fill. 1.07:1 on the ground.    */
  --zb-inset:      #EBE5D5;  /* a recessed cell: terminal, well, plate. */

  --zb-line-0:     #27427D;  /* FULL DENSITY. body text and continuous. */
  --zb-line-1:     #4A5F91;  /* secondary text: labels, dims, captions. */
  --zb-line-2:     #6B7FAE;  /* HIDDEN LINE value. frames and ticks.    */

  --zb-redline:    #A8341D;  /* THE CORRECTION. three uses, no fourth.  */
  --zb-on-red:     #F7F4EA;

  --zb-mark:       #27427D;  /* a solid graphic that IS the datum.      */
  --zb-mark-bulk:  #5C74A6;  /* a LARGE tonal area. never the solid.    */
  --zb-bub-fill:   #27427D;  /* the view bubble, focused: solid disc.   */
  --zb-bub-num:    #F7F4EA;  /* its number, knocked out of the disc.    */
  --zb-knob:       #F7F4EA;

  /* ---------------------------------------------------------- metrics */
  --ui: 1;
  --zb-corner-w:  calc(320px * var(--ui));
  --zb-title-h:   calc(180px * var(--ui));
  --zb-margin:    calc(16px  * var(--ui));
  --zb-bub:       calc(24px  * var(--ui));
  --zb-hdr-h:     calc(26px  * var(--ui));
  --zb-row-h:     calc(22px  * var(--ui));
  --zb-cell-h:    calc(20px  * var(--ui));
  --zb-pad:       calc(12px  * var(--ui));
  --zb-gap:       calc(8px   * var(--ui));
  --zb-w:         2px;       /* THE ONE LINE WEIGHT. all four patterns. */
  --zb-hair:      1px;       /* cell divisions inside the title block.  */
  --zb-r-0:       0px;       /* radius zero everywhere except a bubble. */
  --zb-dash:      8px;       /* hidden line: 8 on, 4 off.               */
  --zb-gapd:      4px;
  --zb-chain-l:   16px;      /* chain dot: 16 on, 4 off, 4 on, 4 off.   */

  --zb-track-lab: calc(2px * var(--ui));
  --zb-track-th:  calc(1px * var(--ui));
  --zb-track-big: calc(5px * var(--ui));
  --fs-data:  calc(11px * var(--ui));   /* 8x16 atlas               */
  --lh-data:  calc(16px * var(--ui));
  --fs-label: calc(11px * var(--ui));   /* 8x16 atlas, sans caps    */
  --fs-body:  calc(15px * var(--ui));   /* 8x16 at ui 1.4, prose    */
  --lh-body:  calc(22px * var(--ui));
  --fs-plate: calc(22px * var(--ui));   /* 16x32 atlas              */
  --lh-plate: calc(26px * var(--ui));
  --fs-huge:  calc(44px * var(--ui));   /* 24x48 atlas, lock only   */

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ------------------------------------------------- DARK: THE CYANOTYPE --
   The blueprint proper. Prussian blue ground, white linework, no
   gradient and no black. #16375E is a real cyanotype ground: saturated,
   flat, and nothing like the near-black-plus-accent shape this direction
   is most likely to be mistaken for from a thumbnail. The tell is that
   the WHITE is the body and the blue is the paper, not the reverse.

   Two things move relative to the light ladder and both are derived:
     1. The recessed cell goes DOWN in density in light (a well is
        sunken) and DOWN again in dark - #102A49 is deeper blue, because
        on a cyanotype an unexposed area is where the ferric salt washed
        out darker, not lighter.
     2. The redline opens up. #A8341D is a pencil correction on paper; on
        a blueprint the same correction is grease pencil or a wax pencil
        and reads pale. #F99B84 holds 4.76:1 on the view fill, which is
        where FAIL text actually lands.
   -------------------------------------------------------------------- */
:root[data-theme="dark"] {
  /* COLOUR TOKENS ONLY. Every one of the thirteen names in the light block
     is redeclared here and none is added; a colour role in one mode only
     would be a defect. The metric, radius, dash-pitch and type tokens are
     deliberately NOT repeated, because the direction's claim is that
     nothing but colour changes between the two processes - repeating them
     here would create two places for one number to drift. */
  --zb-ground:     #16375E;
  --zb-sheet:      #1D4470;
  --zb-inset:      #102A49;

  --zb-line-0:     #EDF1F3;
  --zb-line-1:     #A9BFD4;
  --zb-line-2:     #7E9CB8;

  --zb-redline:    #F99B84;
  --zb-on-red:     #16375E;

  --zb-mark:       #EDF1F3;
  --zb-mark-bulk:  #87A5C0;
  --zb-bub-fill:   #EDF1F3;
  --zb-bub-num:    #16375E;
  --zb-knob:       #16375E;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--zb-ground); font-family: var(--sans);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--zb-inset); }
::-webkit-scrollbar-thumb { background: var(--zb-mark-bulk); border-radius: var(--zb-r-0); }

/* ============================================================= type === */
.t-data { font-family: var(--mono); font-size: var(--fs-data); line-height: var(--lh-data);
          font-weight: 400; color: var(--zb-line-0); font-variant-numeric: tabular-nums; }
.t-label{ font-family: var(--sans); font-size: var(--fs-label); line-height: var(--lh-data);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--zb-track-lab);
          margin-right: calc(-1 * var(--zb-track-lab)); color: var(--zb-line-1); }
.t-body { font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body);
          color: var(--zb-line-0); }
.t-plate{ font-family: var(--sans); font-size: var(--fs-plate); line-height: var(--lh-plate);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--zb-track-big);
          margin-right: calc(-1 * var(--zb-track-big)); color: var(--zb-line-0); }
.t-huge { font-family: var(--mono); font-size: var(--fs-huge);
          line-height: calc(52px * var(--ui)); font-weight: 700; color: var(--zb-line-0);
          font-variant-numeric: tabular-nums; letter-spacing: var(--zb-track-big); }
.l0 { color: var(--zb-line-0); }
.l1 { color: var(--zb-line-1); }
.l2 { color: var(--zb-line-2); }
.bold { font-weight: 700; }

/* ==================================================== harness strip ====
   NOT desktop chrome. This band is the prototype's own navigation and it
   is deliberately outside #os, in the mono face, so it reads as a
   contact sheet header rather than as a top bar. Blueline's desktop has
   no top bar; deleting it is a third of the direction's claim. */
#strip {
  position: fixed; left: 0; right: 0; top: 0; height: 28px; z-index: 400;
  background: var(--zb-inset); border-bottom: var(--zb-w) solid var(--zb-line-0);
  display: flex; align-items: stretch; padding-left: 12px;
}
#strip .nm { display: flex; align-items: center; color: var(--zb-line-0); }
#strip .pitch { padding: 0 14px; color: var(--zb-line-1); font-family: var(--mono);
  font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 28px; min-width: 0; }
#strip .links { margin-left: auto; display: flex; }
#strip a, #strip .tk {
  display: flex; align-items: center; padding: 0 10px; text-decoration: none;
  border-left: var(--zb-hair) solid var(--zb-line-2); color: var(--zb-line-1);
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
}
#strip a.on, #strip .tk.on { background: var(--zb-line-0); color: var(--zb-ground); }
#strip .thm { display: flex; align-items: stretch; }
#strip .thint { display: flex; align-items: center; padding: 0 10px;
  border-left: var(--zb-hair) solid var(--zb-line-2); color: var(--zb-line-2);
  font-family: var(--mono); font-size: 11px; }

#os { position: fixed; left: 0; right: 0; top: 28px; bottom: 0;
      background: var(--zb-ground); overflow: hidden; }

/* ============================================== the sheet border ======
   One 2px rule around everything, divided into lettered and numbered
   ZONES exactly as a drawing frame is. This replaces PLATE's ruled
   module grid: the structure is stated on the FRAME, not painted across
   the field, so the drawing area stays edge to edge and empty. */
#frame { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#field { position: absolute; overflow: visible; }
#wins { position: absolute; inset: 0; }
#leaders { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 8; }

/* =================================================== a VIEW (window) === */
.win { position: absolute; background: var(--zb-sheet); display: flex; flex-direction: column;
       transition: left 100ms linear, top 100ms linear, width 100ms linear, height 100ms linear; }
.win.drag { transition: none; }
.win.gone { display: none; }

/* THE FRAME. Four background layers, one per edge, each an explicit
   repeating gradient so the dash pitch is ours and not the browser's.
   In fb.c this is a loop of fb_fill_px along an axis aligned edge - the
   cheapest primitive in the file, and the reason line type costs nothing
   here. --fc is the frame's colour, --fp its pattern. */
.fr { position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background-repeat: no-repeat;
      background-size: 100% var(--zb-w), 100% var(--zb-w), var(--zb-w) 100%, var(--zb-w) 100%;
      background-position: 0 0, 0 100%, 0 0, 100% 0; }
/* continuous - the current view */
.st-cont > .fr {
  --fc: var(--zb-line-0);
  background-image:
    linear-gradient(var(--fc), var(--fc)), linear-gradient(var(--fc), var(--fc)),
    linear-gradient(var(--fc), var(--fc)), linear-gradient(var(--fc), var(--fc));
}
/* hidden - present, not current */
.st-hidn > .fr, .st-phan > .fr {
  --fc: var(--zb-line-2);
  background-image:
    repeating-linear-gradient(to right,  var(--fc) 0 var(--zb-dash), transparent var(--zb-dash) calc(var(--zb-dash) + var(--zb-gapd))),
    repeating-linear-gradient(to right,  var(--fc) 0 var(--zb-dash), transparent var(--zb-dash) calc(var(--zb-dash) + var(--zb-gapd))),
    repeating-linear-gradient(to bottom, var(--fc) 0 var(--zb-dash), transparent var(--zb-dash) calc(var(--zb-dash) + var(--zb-gapd))),
    repeating-linear-gradient(to bottom, var(--fc) 0 var(--zb-dash), transparent var(--zb-dash) calc(var(--zb-dash) + var(--zb-gapd)));
}
/* chain dot - long short long. the drafting mark for a REFERENCE, so it
   is what a child window or a dialog is drawn in. */
.st-chain > .fr {
  --fc: var(--zb-line-2);
  background-image:
    repeating-linear-gradient(to right,  var(--fc) 0 var(--zb-chain-l), transparent var(--zb-chain-l) calc(var(--zb-chain-l) + 4px), var(--fc) calc(var(--zb-chain-l) + 4px) calc(var(--zb-chain-l) + 8px), transparent calc(var(--zb-chain-l) + 8px) calc(var(--zb-chain-l) + 12px)),
    repeating-linear-gradient(to right,  var(--fc) 0 var(--zb-chain-l), transparent var(--zb-chain-l) calc(var(--zb-chain-l) + 4px), var(--fc) calc(var(--zb-chain-l) + 4px) calc(var(--zb-chain-l) + 8px), transparent calc(var(--zb-chain-l) + 8px) calc(var(--zb-chain-l) + 12px)),
    repeating-linear-gradient(to bottom, var(--fc) 0 var(--zb-chain-l), transparent var(--zb-chain-l) calc(var(--zb-chain-l) + 4px), var(--fc) calc(var(--zb-chain-l) + 4px) calc(var(--zb-chain-l) + 8px), transparent calc(var(--zb-chain-l) + 8px) calc(var(--zb-chain-l) + 12px)),
    repeating-linear-gradient(to bottom, var(--fc) 0 var(--zb-chain-l), transparent var(--zb-chain-l) calc(var(--zb-chain-l) + 4px), var(--fc) calc(var(--zb-chain-l) + 4px) calc(var(--zb-chain-l) + 8px), transparent calc(var(--zb-chain-l) + 8px) calc(var(--zb-chain-l) + 12px));
}
/* phantom - MINIMISED AND STILL HERE. the outline stays where the view
   was, at reduced density, carrying only its bubble. This is why
   Blueline needs no dock: "where did it go" is answered on the sheet. */
.win.st-phan { background: transparent; }
/* the sketch said 25 %. measured on both grounds that is a mark you
   have to hunt for, and a phantom whose job is to answer "where did it
   go" must be found without hunting. 48 % is where it reads as present
   but plainly withdrawn, in the cyanotype and the diazo alike. */
.win.st-phan > .fr { opacity: 0.48; }
.win.st-phan > .hdr, .win.st-phan > .body, .win.st-phan > .vnote { display: none; }
.win.st-phan .bub { opacity: 0.80; }
.nophan .win.st-phan { display: none; }

/* THE VIEW BUBBLE. A drawing labels each view with a balloon on a leader.
   Focused, it is a solid disc with the number knocked out; unfocused, an
   outline. It is the only circle in the system and the only nonzero
   radius. */
.bub { position: absolute; left: calc(-1 * var(--zb-bub) / 2); top: calc(-1 * var(--zb-bub) / 2);
       width: var(--zb-bub); height: var(--zb-bub); border-radius: 50%; z-index: 9;
       display: flex; align-items: center; justify-content: center; cursor: pointer;
       background: var(--zb-sheet); border: var(--zb-w) solid var(--zb-line-2); }
.bub span { font-family: var(--mono); font-size: var(--fs-data); font-weight: 700;
            color: var(--zb-line-0); line-height: 1; }
.st-cont > .bub { background: var(--zb-bub-fill); border-color: var(--zb-bub-fill); }
.st-cont > .bub span { color: var(--zb-bub-num); }
.st-chain > .bub { border-style: dashed; }

.hdr { height: var(--zb-hdr-h); flex: none; display: flex; align-items: center;
       gap: var(--zb-gap); padding: 0 var(--zb-gap) 0 calc(20px * var(--ui));
       border-bottom: var(--zb-hair) solid var(--zb-line-2);
       color: var(--zb-line-1); user-select: none; cursor: default; }
.hdr .ttl { color: var(--zb-line-0); flex: none; white-space: nowrap; }
.hdr .sub { color: var(--zb-line-1); flex: 0 1 auto; min-width: 0; overflow: hidden;
            white-space: nowrap; font-family: var(--mono); font-size: var(--fs-data); }
.hdr .zone { margin-left: auto; color: var(--zb-line-1); font-family: var(--mono);
             font-size: var(--fs-data); white-space: nowrap; flex: none; }
.ctls { display: flex; height: 100%; flex: none; }
.ctl { width: calc(22px * var(--ui)); display: flex; align-items: center; justify-content: center;
       border-left: var(--zb-hair) solid var(--zb-line-2); color: var(--zb-line-1); cursor: pointer; }
.ctl:hover { background: var(--zb-inset); color: var(--zb-line-0); }
.ctl.x:hover { background: var(--zb-line-0); color: var(--zb-ground); }
.body { flex: 1; min-height: 0; padding: var(--zb-pad); display: flex; flex-direction: column;
        overflow: hidden; }
/* the view note: a drawing puts the view's own identity under it. */
.vnote { position: absolute; right: calc(-1 * var(--zb-w)); bottom: calc(-14px * var(--ui));
         height: calc(14px * var(--ui)); display: flex; align-items: center; gap: 6px;
         padding: 0 4px; background: var(--zb-ground); z-index: 7; white-space: nowrap; }
.vnote .t-data { font-size: calc(10px * var(--ui)); color: var(--zb-line-1); }
/* THE DELTA. Redline use 2 of 3: while a view is dragged off its zone,
   the distance back to the zone it will snap to is dimensioned in red. */
.delta { position: absolute; z-index: 10; pointer-events: none; }
.delta .dl { position: absolute; background: var(--zb-redline); }
.delta .dt { position: absolute; background: var(--zb-redline); color: var(--zb-on-red);
             font-family: var(--mono); font-size: calc(10px * var(--ui)); padding: 1px 4px;
             white-space: nowrap; }

/* ================================================ the corner block =====
   ALL persistent chrome. No rail, no top bar, no dock, no start menu.
   Bottom right, ruled into cells exactly as a drawing's title block is,
   with the REVISION TABLE stacked directly above it. */
#corner { position: absolute; right: var(--zb-margin); bottom: var(--zb-margin);
          width: var(--zb-corner-w);
          background: var(--zb-ground); border: var(--zb-w) solid var(--zb-line-0);
          display: flex; flex-direction: column; z-index: 40; }
#corner .cell { border-bottom: var(--zb-hair) solid var(--zb-line-2); }
#corner .chead { display: flex; align-items: center; gap: 6px;
                 padding: calc(3px * var(--ui)) calc(6px * var(--ui));
                 border-bottom: var(--zb-w) solid var(--zb-line-0); }
#corner .chead .t-label { color: var(--zb-line-0); }
#corner .chead .rt { margin-left: auto; color: var(--zb-line-1); font-family: var(--mono);
                     font-size: calc(10px * var(--ui)); }

.revrow { display: flex; align-items: center; height: calc(19px * var(--ui));
          border-bottom: var(--zb-hair) solid var(--zb-line-2);
          padding: 0 calc(6px * var(--ui)); gap: 6px; }
.revrow:last-child { border-bottom: 0; }
.revrow .rv { flex: none; width: calc(18px * var(--ui)); text-align: center; }
/* THE REVISION BALLOON. Redline use 1 of 3. A drawing circles the
   revision letter in red where the change landed; so does this. */
.balloon { display: inline-flex; align-items: center; justify-content: center;
           width: calc(15px * var(--ui)); height: calc(15px * var(--ui)); border-radius: 50%;
           border: var(--zb-hair) solid var(--zb-redline); color: var(--zb-redline);
           font-family: var(--mono); font-size: calc(10px * var(--ui)); font-weight: 700; }
.noball .balloon { border-color: var(--zb-line-2); color: var(--zb-line-1); }
.revrow .rw { flex: none; width: calc(58px * var(--ui)); color: var(--zb-line-0);
              overflow: hidden; white-space: nowrap; }
.revrow .rd { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
              text-overflow: ellipsis; color: var(--zb-line-1); }
.revrow .rt { flex: none; color: var(--zb-line-1); }

#vindex { display: grid; grid-template-columns: 1fr 1fr; }
.vrow { display: flex; align-items: center; height: calc(18px * var(--ui)); gap: 5px;
        padding: 0 calc(6px * var(--ui)); cursor: pointer;
        border-bottom: var(--zb-hair) solid var(--zb-line-2);
        border-right: var(--zb-hair) solid var(--zb-line-2); }
.vrow:nth-child(even) { border-right: 0; }
.vrow .vn { color: var(--zb-line-1); flex: none; }
.vrow .vl { color: var(--zb-line-1); overflow: hidden; white-space: nowrap; flex: 1; min-width: 0; }
.vrow .vs { flex: none; width: calc(9px * var(--ui)); height: calc(9px * var(--ui)); }
.vrow:hover { background: var(--zb-inset); }
.vrow.open .vl { color: var(--zb-line-0); }
.vrow.cur { background: var(--zb-line-0); }
.vrow.cur .vl, .vrow.cur .vn { color: var(--zb-ground); }

#tblock { height: var(--zb-title-h); flex: none; display: flex; flex-direction: column; }
#tblock .ident { padding: calc(6px * var(--ui)) calc(8px * var(--ui)) calc(4px * var(--ui));
                 border-bottom: var(--zb-w) solid var(--zb-line-0); }
#tblock .ident .t-plate { display: block; }
#tblock .ident .sub { display: block; color: var(--zb-line-1); font-family: var(--mono);
                      font-size: var(--fs-data); }
.tbcells { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }
.tbc { border-right: var(--zb-hair) solid var(--zb-line-2);
       border-bottom: var(--zb-hair) solid var(--zb-line-2);
       padding: calc(2px * var(--ui)) calc(6px * var(--ui)); min-width: 0; overflow: hidden; }
.tbc:nth-child(even) { border-right: 0; }
.tbc .k { display: block; color: var(--zb-line-1); font-family: var(--sans);
          font-size: calc(9px * var(--ui)); font-weight: 700; text-transform: uppercase;
          letter-spacing: var(--zb-track-lab); }
.tbc .v { display: block; color: var(--zb-line-0); font-family: var(--mono);
          font-size: var(--fs-data); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.wsrow { display: flex; border-top: var(--zb-w) solid var(--zb-line-0); flex: none; }
.wsc { flex: 1; height: calc(20px * var(--ui)); display: flex; align-items: center;
       justify-content: center; cursor: pointer;
       border-right: var(--zb-hair) solid var(--zb-line-2); }
.wsc:last-child { border-right: 0; }
.wsc.on { background: var(--zb-line-0); }
.wsc.on .t-label { color: var(--zb-ground); }

/* ======================================================== primitives === */
.scroll { overflow: auto; min-height: 0; flex: 1; }
.hr2 { height: var(--zb-w); background: var(--zb-line-0); flex: none; }
.hr1 { height: var(--zb-hair); background: var(--zb-line-2); flex: none; }
.vr1 { width: var(--zb-hair); background: var(--zb-line-2); align-self: stretch; flex: none; }
.row { display: flex; align-items: center; gap: var(--zb-gap); flex: none; overflow: hidden; }

.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th { text-align: left; height: var(--zb-cell-h); padding: 0 calc(4px * var(--ui));
          border-bottom: var(--zb-hair) solid var(--zb-line-2); white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis;
          font-family: var(--sans); font-size: var(--fs-label); font-weight: 700;
          text-transform: uppercase; letter-spacing: var(--zb-track-th); color: var(--zb-line-1); }
.tbl td { height: var(--zb-cell-h); padding: 0 calc(4px * var(--ui));
          border-bottom: var(--zb-hair) solid var(--zb-line-2); white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis;

.tbl tr.sel td { border-top: var(--zb-w) solid var(--zb-line-0);

.plotbox { position: relative; flex: 1; min-height: calc(40px * var(--ui));

.meanline { position: absolute; left: 0; right: 0; height: 1px; background: var(--zb-line-0); }

/* the three state words. NO HUE except the failure mark, which is the

.st-ok   { color: var(--zb-line-1); }

#overview { position: absolute; inset: 0; background: var(--zb-ground); z-index: 60;
            display: none; flex-direction: column; padding: calc(14px * var(--ui)); }

/* ============================================================= menu ==== */
.menu { position: absolute; z-index: 200; background: var(--zb-sheet);
        border: var(--zb-w) solid var(--zb-line-0); min-width: calc(196px * var(--ui)); display: none; }
.menu.on { display: block; }
.menu .mh { padding: 0 calc(8px * var(--ui)); height: calc(20px * var(--ui));

/* toasts stack directly ABOVE the corner block, in the chrome column, so

          z-index: 150; display: flex; flex-direction: column; gap: var(--zb-gap);
          align-items: flex-end; }

<body>

<script>
'use strict';
/* ====================================================================== *
 * BLUELINE - a living prototype of the zlOS desktop as an engineering
 * drawing. Chrome is ONE bottom-right corner block. Focus is LINE TYPE.
 * The sheet keeps its own revision history in its own title block.
 * ====================================================================== */

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad2 = n => (n < 10 ? '0' : '') + n;
const hx = (n, w) => n.toString(16).toUpperCase().padStart(w || 8, '0');

/* --------------------------------------------------- token readback ----
 * The settings view prints the stock's own hex values and contrast
 * ratios. A typed literal is a claim; these read the LIVE custom property
 * off :root, so the printed number is by construction the number being
 * rendered. */
function tokRaw(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function tokResolve(name, depth) {
  const v = tokRaw(name);
  const m = /^var\((--[\w-]+)\)$/.exec(v);
  if (m && (depth || 0) < 8) return tokResolve(m[1], (depth || 0) + 1);
  return v;
}
function tokHex(name) { return tokResolve(name).toUpperCase(); }
function tokRGB(name) {
  const h = tokResolve(name).replace('#', '');
  if (h.length !== 6) return null;
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
function relLum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
function tokRatio(fg, bg) {
  const a = tokRGB(fg), b = tokRGB(bg);
  if (!a || !b) return '--';
  let l1 = relLum(a), l2 = relLum(b);
  if (l1 < l2) { const t = l1; l1 = l2; l2 = t; }
  return ((l1 + 0.05) / (l2 + 0.05)).toFixed(2);
}
/* ------------------------------------------------------------- state -- */
const S = {
  sheet: 1,          /* the workspace. a drawing calls it a SHEET.        */
  theme: 'dark',     /* DARK PRIMARY. the cyanotype is the home ladder.   */
  scene: 'desktop',
  focus: null,
  zc: 8, zr: 5,      /* zone lattice: 8 lettered across, 5 numbered up.   */
  ui: 1,
  zones: true,       /* zone letters and ticks on the border rule.        */
  leaders: true,     /* orthogonal dogleg from a child view to its parent */
  phantom: true,     /* a minimised view keeps its outline where it was.  */
  balloons: true,    /* redline circles on the revision letters.          */
  blink: true,
  snap: true,
  dashIdx: 1,        /* dash pitch: 0 = 6-3, 1 = 8-4, 2 = 12-6            */
  fileSel: 1,
  procSel: 2,
  calcAcc: '241690',
  setTab: 0,
  pq: '', psel: 0,
  t: 0,
  clock: 14 * 3600 + 32 * 60 + 7,
  hist: { cpu: [], net: [], mem: [] },
  cpu: [34, 21, 47, 12],
  memPct: 62, load: 0.31, rx: 148.2, tx: 22.7,
  rev: [],           /* THE REVISION TABLE. the last five WM changes.     */
  revN: 0,
  wins: {}
};
for (let i = 0; i < 64; i++) {
  S.hist.cpu.push(18 + ((i * 37) % 46));
  S.hist.net.push(6 + ((i * 53) % 58));
  S.hist.mem.push(56 + ((i * 17) % 12));
}
const DASH_STEPS = [[6, 3], [8, 4], [12, 6]];
const ZONE_L = 'ABCDEFGHJKLM';   /* drawings skip I. so does this.        */

/* ================================================== the revision table =
 * A desktop that keeps a printed revision history in its own chrome. Every
 * state change the window manager makes gets a letter, a view, a
 * description and a time, and the last five stay on the sheet. This is
 * what a drawing does and what no desktop does.
 */
function rev(view, desc) {
  S.revN += 1;
  const L = ZONE_L[(S.revN - 1) % ZONE_L.length];
  S.rev.unshift({ r: L, w: view, d: desc, t: hhmmss(S.clock) });
  if (S.rev.length > 5) S.rev.pop();
  renderCorner();
}

/* ------------------------------------------------------------- icons -- *
 * Stencils on a 96x96 field, 8x8 modules of 12px, every vertex on a
 * multiple of 6, one stroke weight. Four constructions: the axis aligned
 * rectangle, the 45 degree diagonal, the circle, the quarter round. */
const ICON = {
  shell: '<path d="M6 12 H90 V84 H6 Z"/><path d="M24 36 L42 54 L24 72"/><path d="M54 72 H78"/>',
  files: '<path d="M6 24 V12 H36 L48 24"/><path d="M6 24 H90 V84 H6 Z"/>',
  mon:   '<circle cx="48" cy="48" r="36"/><path d="M48 48 L72 24"/>',
  edit:  '<path d="M18 6 H78 V90 H18 Z"/><path d="M30 30 H66"/><path d="M30 48 H66"/><path d="M30 66 H54"/>',
  log:   '<path d="M6 18 H90 V78 H6 Z"/><path d="M18 36 H42"/><path d="M18 48 H78"/><path d="M18 60 H60"/>',
  hex:   '<path d="M12 12 H84 V84 H12 Z"/><path d="M48 12 V84"/><path d="M12 48 H84"/>',
  calc:  '<path d="M18 6 H78 V90 H18 Z"/><path d="M30 18 H66 V36 H30 Z"/><path d="M30 54 H42"/><path d="M54 54 H66"/><path d="M30 72 H42"/><path d="M54 72 H66"/>',
  net:   '<path d="M18 78 L48 48 L78 78"/><path d="M6 84 H90"/><circle cx="48" cy="30" r="6"/>',
  clock: '<circle cx="48" cy="48" r="36"/><path d="M48 48 V24"/><path d="M48 48 H66"/>',
  chip:  '<path d="M24 24 H72 V72 H24 Z"/><path d="M36 24 V12"/><path d="M60 24 V12"/><path d="M36 72 V84"/><path d="M60 72 V84"/><path d="M24 36 H12"/><path d="M24 60 H12"/><path d="M72 36 H84"/><path d="M72 60 H84"/>',
  set:   '<path d="M6 30 H90"/><path d="M6 66 H90"/><path d="M30 18 H42 V42 H30 Z"/><path d="M60 54 H72 V78 H60 Z"/>',
  disk:  '<path d="M6 24 H90 V72 H6 Z"/><path d="M6 48 H90"/><circle cx="72" cy="36" r="6"/>',
  proc:  '<path d="M12 18 H84 V36 H12 Z"/><path d="M12 42 H84 V60 H12 Z"/><path d="M12 66 H84 V84 H12 Z"/>',
  regs:  '<path d="M12 12 H84 V84 H12 Z"/><path d="M36 12 V84"/><path d="M60 12 V84"/><path d="M12 36 H84"/>',
  type:  '<path d="M24 84 L48 12 L72 84"/><path d="M36 54 H60"/>',
  zone:  '<path d="M6 6 H90 V90 H6 Z"/><path d="M6 24 H90"/><path d="M24 6 V90"/><path d="M48 48 H90"/>',
  warn:  '<path d="M48 12 L90 84 H6 Z"/><path d="M48 42 V60"/><path d="M48 70 V72"/>'
};

/* ------------------------------------------------------------ tables -- */
function TH(cols) {
  return '<tr>' + cols.map(c => '<th class="' + (c.r ? 'r' : '') + '"' +
    (c.w ? ' style="width:' + c.w + '"' : '') + '>' + c.h + '</th>').join('') + '</tr>';
}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => {
    if (typeof c === 'string') return '<td>' + c + '</td>';
    return '<td class="' + (c.c || '') + '">' + c.t + '</td>';
  }).join('') + '</tr>';
}
function TBL(head, rows) {
  return '<table class="tbl"><thead>' + TH(head) + '</thead><tbody>' + rows.join('') + '</tbody></table>';
}
function plotFlex(series, max, minH) {
  const n = series.length, bw = 100 / n;
  let bars = '';
  series.forEach((v, i) => {
    const h = Math.max(1, (v / max) * 100);
    bars += '<rect x="' + (i * bw).toFixed(2) + '" y="' + (100 - h).toFixed(2) +
      '" width="' + (bw * 0.66).toFixed(2) + '" height="' + h.toFixed(2) + '"/>';
  });
  const mean = series.reduce((a, b) => a + b, 0) / n;
  return '<div class="plotbox"' + (minH ? ' style="min-height:' + minH + 'px"' : '') + '>' +
    '<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" ' +
    'fill="var(--zb-mark-bulk)" aria-hidden="true">' + bars + '</svg>' +
    '<span class="meanline" style="top:' + (100 - (mean / max) * 100).toFixed(2) + '%"></span></div>';
}
function meter(label, val, unit, kind) {
  const k = kind === 'bad' ? 'bad' : kind === 'hi' ? 'hi' : '';
  return '<div class="meter"><div class="mrow"><span class="t-label">' + label + '</span>' +
    '<span class="t-data">' + val + (unit || '') + '</span></div>' +
    '<div class="track"><i class="' + k + '" style="width:' + Math.max(0, Math.min(100, val)) + '%"></i></div></div>';
}
function kv(k, v) {
  return '<div class="kv"><span class="t-label">' + k + '</span><span class="v">' + v + '</span></div>';
}
/* the state word. hue is spent ONCE, on FAIL. */
function statword(w) {
  const c = w === 'FAIL' ? 'st-fail' : w === 'WARN' ? 'st-warn' : 'st-ok';
  return '<span class="t-label ' + c + '">' + w + '</span>';
}
function hhmmss(s) {
  s = ((s % 86400) + 86400) % 86400;
  return pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
}

R.hex = () => {
  const base = 0x0011A4C0;
  const rows = [];
  const seed = [0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, 0x01, 0x00];
  for (let r = 0; r < 20; r++) {
    let bytes = [], asc = '';
    for (let i = 0; i < 16; i++) {
      const v = r === 0 && i < 8 ? seed[i] : ((r * 37 + i * 11 + 0x21) & 0xff);
      bytes.push(hx(v, 2));
      asc += (v >= 32 && v < 127) ? String.fromCharCode(v) : '.';
    }
    rows.push('<tr' + (r === 0 ? ' class="sel"' : '') + '><td>' + hx(base + r * 16, 8) + '</td><td>' +
      bytes.slice(0, 8).join(' ') + '</td><td>' + bytes.slice(8).join(' ') + '</td><td>' +
      asc.replace(/</g, '&lt;') + '</td></tr>');
  }
  return viewhead('<span class="t-label">source</span><span class="t-data">/dev/rd0</span>' +
      '<span class="t-label">offset</span><span class="t-data">0x' + hx(base) + '</span>' +
      '<span class="t-data l1 spread">width 16 &middot; ascii</span>') +
    '<div class="scroll"><table class="tbl"><thead>' +
    TH([{ h: 'address', w: '17%' }, { h: '00 .. 07', w: '28%' }, { h: '08 .. 0f', w: '28%' },
        { h: 'ascii', w: '27%' }]) + '</thead><tbody>' + rows.join('') + '</tbody></table></div>' +
    '<div class="hr2"></div><div class="row" style="height:var(--zb-row-h)">' +
    '<span class="t-label">signature</span><span class="t-data l0 bold">7F 45 4C 46</span>' +
    '<span class="t-data l1">elf64, little endian</span>' +
    '<span class="spread"></span>' + statword('OK') + '</div>';
};

  out += '</div>';
  return out;
};

/* ====================================================== the lattice ==== */
let LAT = { W: 0, H: 0, mar: 16, zw: [], zx: [], zh: [], zy: [],
  zwBase: 0, zwRem: 0, zhBase: 0, zhRem: 0, resC: 99, resR: 99 };

function computeLat() {
  const os = $('#os');
  const mar = Math.round(16 * S.ui);
  const W = os.clientWidth, H = os.clientHeight;
  const f = $('#field');
  f.style.left = mar + 'px'; f.style.top = mar + 'px';
  f.style.width = (W - 2 * mar) + 'px'; f.style.height = (H - 2 * mar) + 'px';
  const fw = W - 2 * mar, fh = H - 2 * mar;
  const NC = S.zc, NR = S.zr;
  const zwBase = Math.floor(fw / NC), zwRem = fw - zwBase * NC;
  const zhBase = Math.floor(fh / NR), zhRem = fh - zhBase * NR;
  const zw = [], zx = [], zh = [], zy = [];
  let x = 0;
  for (let i = 0; i < NC; i++) { const w = zwBase + (i < zwRem ? 1 : 0); zw.push(w); zx.push(x); x += w; }
  let y = 0;
  for (let i = 0; i < NR; i++) { const h = zhBase + (i < zhRem ? 1 : 0); zh.push(h); zy.push(y); y += h; }
  /* the corner block is printed on the sheet, so the lattice records
     which zones it covers and no default placement stands there. */
  const cb = $('#corner');
  const bw = cb.offsetWidth || Math.round(320 * S.ui);
  const bh = cb.offsetHeight || Math.round(456 * S.ui);
  const bx = fw - bw, by = fh - bh;
  let resC = NC, resR = NR;
  for (let i = 0; i < NC; i++) if (zx[i] + zw[i] > bx + 8) { resC = i; break; }
  for (let i = 0; i < NR; i++) if (zy[i] + zh[i] > by + 8) { resR = i; break; }
  LAT = { W, H, mar, zw, zx, zh, zy, zwBase, zwRem, zhBase, zhRem, resC, resR };
}
/* THE TITLE BLOCK IS PRINTED ON THE SHEET. A view never runs under it,
   the way a view on a real drawing never runs under the title block. So
   the reserve is enforced HERE, once, rather than trusted to callers:
   a placement that would enter the reserved zones is shortened, upward
   first, then leftward. */
function zoneRect(c, r, cw, rh) {
  const Z = LAT;
  c = Math.max(0, Math.min(S.zc - 1, c));
  r = Math.max(0, Math.min(S.zr - 1, r));
  cw = Math.max(1, Math.min(S.zc - c, cw));
  rh = Math.max(1, Math.min(S.zr - r, rh));
  if (c + cw - 1 >= Z.resC && r + rh - 1 >= Z.resR) {
    if (r < Z.resR) rh = Z.resR - r;
    else if (c < Z.resC) cw = Z.resC - c;
    else { c = Math.max(0, Z.resC - cw); cw = Math.min(Z.resC - c, cw); }
    cw = Math.max(1, cw); rh = Math.max(1, rh);
  }
  let w = 0, h = 0;
  for (let i = 0; i < cw; i++) w += Z.zw[c + i];
  for (let i = 0; i < rh; i++) h += Z.zh[r + i];
  return { x: Z.zx[c], y: Z.zy[r], w, h, c, r, cw, rh };
}
function zoneName(c, r) { return (ZONE_L[c] || '?') + (r + 1); }

/* ================================================= the sheet border ====
 * One 2px rule. Its ONLY subdivision is the zone marks, which sit ON the
 * frame and never cross the drawing. Nothing is ruled across the field:
 * that is the difference between a drawing frame and a module grid. */
function drawFrame() {
  const svg = $('#frame'), Z = LAT;
  svg.setAttribute('width', Z.W); svg.setAttribute('height', Z.H);
  const m = Z.mar, W = Z.W, H = Z.H, w2 = 2;
  let s = '';
  const R = (x, y, w, h, c) => '<rect x="' + x + '" y="' + y + '" width="' + Math.max(0, w) +
    '" height="' + Math.max(0, h) + '" fill="var(--' + c + ')"/>';
  /* the border rule itself, 2px, continuous, ZB_LINE_0 */
  s += R(m - w2, m - w2, W - 2 * m + 2 * w2, w2, 'zb-line-0');
  s += R(m - w2, H - m, W - 2 * m + 2 * w2, w2, 'zb-line-0');
  s += R(m - w2, m - w2, w2, H - 2 * m + 2 * w2, 'zb-line-0');
  s += R(W - m, m - w2, w2, H - 2 * m + 2 * w2, 'zb-line-0');
  if (S.zones) {
    const tk = Math.round(6 * S.ui);
    Z.zx.forEach((x, i) => {
      if (i > 0) {
        s += R(m + x, m - w2 - tk, 1, tk, 'zb-line-2');
        s += R(m + x, H - m + w2, 1, tk, 'zb-line-2');
      }
      const cx = m + x + Z.zw[i] / 2;
      s += '<text x="' + cx.toFixed(1) + '" y="' + (m - 6) + '" text-anchor="middle" ' +
        'font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="' +
        Math.round(10 * S.ui) + '" fill="var(--zb-line-2)">' + ZONE_L[i] + '</text>';
      s += '<text x="' + cx.toFixed(1) + '" y="' + (H - m + 14) + '" text-anchor="middle" ' +
        'font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="' +
        Math.round(10 * S.ui) + '" fill="var(--zb-line-2)">' + ZONE_L[i] + '</text>';
    });
    Z.zy.forEach((y, i) => {
      if (i > 0) {
        s += R(m - w2 - tk, m + y, tk, 1, 'zb-line-2');
        s += R(W - m + w2, m + y, tk, 1, 'zb-line-2');
      }
      const cy = m + y + Z.zh[i] / 2 + 4;
      s += '<text x="' + (m - 8) + '" y="' + cy.toFixed(1) + '" text-anchor="end" ' +
        'font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="' +
        Math.round(10 * S.ui) + '" fill="var(--zb-line-2)">' + (i + 1) + '</text>';
      s += '<text x="' + (W - m + 8) + '" y="' + cy.toFixed(1) + '" ' +
        'font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="' +
        Math.round(10 * S.ui) + '" fill="var(--zb-line-2)">' + (i + 1) + '</text>';
    });
  }
  svg.innerHTML = s;
}
/* ====================================================== view manager === */
let ZTOP = 10;
function openWin(id, place, ws, quiet) {
  const a = APP[id];
  if (!a) return;
  if (S.wins[id]) { S.wins[id].min = false; focusWin(id); return; }
  const p = place || a.p;
  S.wins[id] = { id: id, ws: ws || S.sheet, c: p[0], r: p[1], cw: p[2], rh: p[3],
    det: false, x: 0, y: 0, w: 0, h: 0, min: false, max: false, prev: null, z: ++ZTOP };
  buildWin(id);
  focusWin(id);
  layout();

}
function closeWin(id, quiet) {
  const e = $('.win[data-id="' + id + '"]');
  if (e) e.remove();
  const had = !!S.wins[id];
  delete S.wins[id];
  /* a parent closing takes its children with it. that is what a leader
     means: the child exists only in reference to the parent. */
  APPS.filter(a => a.parent === id).forEach(a => { if (S.wins[a.id]) closeWin(a.id, true); });
  if (S.focus === id) {
    const rest = Object.values(S.wins).filter(w => w.ws === S.sheet && !w.min).sort((a, b) => b.z - a.z);
    S.focus = rest.length ? rest[0].id : null;

  if (had && !quiet) rev(APP[id].n + ' ' + APP[id].name, 'view removed from sheet ' + pad2(S.sheet));
}
function focusWin(id) {

}
function minWin(id) {

    S.focus = rest.length ? rest[0].id : null;

    zoneName(S.wins[id].c, S.wins[id].r) : 'minimised, outline suppressed');

function maxWin(id) {
  const w = S.wins[id];

  if (w.max) { Object.assign(w, w.prev); w.max = false; }
  else {
    w.prev = { c: w.c, r: w.r, cw: w.cw, rh: w.rh, det: w.det, x: w.x, y: w.y, w: w.w, h: w.h };

       does not run under it. so a maximised view stops at the reserve. */
    w.c = 0; w.r = 0; w.cw = S.zc; w.rh = LAT.resR > 0 ? LAT.resR : S.zr;
    w.det = false; w.max = true;

  rev(APP[id].n + ' ' + APP[id].name, w.max ? 'enlarged to A1 - ' + zoneName(S.zc - 1, w.rh - 1)
    : 'restored to ' + zoneName(w.c, w.r));
}

function buildWin(id) {

/* line type is assigned HERE and nowhere else. four states, one channel. */
function stateOf(w) {
  if (w.min) return 'st-phan';
  if (S.focus === w.id) return 'st-cont';
  if (APP[w.id].parent) return 'st-chain';
  return 'st-hidn';
}
function layout() {
  computeLat();
  drawFrame();
  Object.values(S.wins).forEach(w => {
    const e = $('.win[data-id="' + w.id + '"]');
    if (!e) return;
    const vis = w.ws === S.sheet;
    e.classList.toggle('gone', !vis);
    let x, y, ww, hh, zn;
    if (w.det) {
      x = w.x; y = w.y; ww = w.w; hh = w.h;
      zn = Math.round(x) + ', ' + Math.round(y) + ' px';
    } else {
      const r = zoneRect(w.c, w.r, w.cw, w.rh);
      x = r.x; y = r.y; ww = r.w; hh = r.h;
      w.c = r.c; w.r = r.r; w.cw = r.cw; w.rh = r.rh;
      zn = zoneName(r.c, r.r) + ' - ' + zoneName(r.c + r.cw - 1, r.r + r.rh - 1);
    }
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.width = ww + 'px'; e.style.height = hh + 'px';
    e.style.zIndex = String(w.min ? 3 : w.z);
    e.classList.remove('st-cont', 'st-hidn', 'st-chain', 'st-phan');
    e.classList.add(stateOf(w));
    const zs = $('.zone', e); if (zs) zs.textContent = zn;
    const nt = $('.nt', e);
    if (nt) {
      const st = w.min ? 'PHANTOM' : S.focus === w.id ? 'CONTINUOUS' :
        APP[w.id].parent ? 'CHAIN OF ' + APP[APP[w.id].parent].n : 'HIDDEN';
      nt.textContent = 'VIEW ' + APP[w.id].n + '  /  ' + zn + '  /  ' + st +
        '  /  ' + ww + ' x ' + hh;
    }
  });
  document.body.classList.toggle('nophan', !S.phantom);
  const cb = $('#corner');
  $('#toasts').style.bottom = (cb.offsetHeight + Math.round(24 * S.ui)) + 'px';
  drawLeaders();
  renderCorner();
}

/* ================================================== the dogleg leader ==
 * A child view is joined to its parent by an ORTHOGONAL leader with one
 * dogleg, drawn in chain dot. Orthogonal because fb_line has no dashed
 * diagonal path, which is also the correct drafting convention, so the
 * constraint and the artifact agree. */
function drawLeaders() {
  const svg = $('#leaders'), Z = LAT;
  svg.setAttribute('width', Z.W - 2 * Z.mar);
  svg.setAttribute('height', Z.H - 2 * Z.mar);
  if (!S.leaders) { svg.innerHTML = ''; return; }
  let s = '';
  Object.values(S.wins).forEach(w => {
    const par = APP[w.id].parent;
    if (!par || !S.wins[par]) return;
    if (w.ws !== S.sheet || S.wins[par].ws !== S.sheet) return;
    const ce = $('.win[data-id="' + w.id + '"]'), pe = $('.win[data-id="' + par + '"]');
    if (!ce || !pe) return;
    /* from the child's bubble (its top left) to the parent's nearest edge */
    const cx = parseFloat(ce.style.left), cy = parseFloat(ce.style.top);
    const px = parseFloat(pe.style.left), py = parseFloat(pe.style.top);
    const pw = parseFloat(pe.style.width), ph = parseFloat(pe.style.height);
    const ax = cx, ay = cy;
    /* attach to the parent's NEAREST vertical edge, at the parent's own
       header line - a leader points at what a thing IS, not at wherever
       the child happens to be sitting. */
    const bx = Math.abs(ax - px) <= Math.abs(ax - (px + pw)) ? px : px + pw;
    const by = Math.round(py + 13);
    /* the dogleg: run out from the bubble, turn once, come in square on
       the edge with a 24 px stub. one turn, both legs orthogonal. */
    const midx = bx + (ax >= bx ? 24 : -24);
    s += '<path d="M' + ax + ' ' + ay + ' H' + midx + ' V' + by + ' H' + bx + '" ' +
      'fill="none" stroke="var(--zb-line-2)" stroke-width="2" ' +
      'stroke-dasharray="16 4 4 4" shape-rendering="crispEdges"/>';
    /* the arrow at the parent end. a leader terminates, it does not fade. */
    const d = midx < bx ? -1 : 1;
    s += '<path d="M' + bx + ' ' + by + ' l' + (d * 9) + ' -5 l0 10 Z" fill="var(--zb-line-2)"/>';
  });
  svg.innerHTML = s;
}

/* ================================================== the corner block ===

    const k = Math.min(host.clientWidth / fw, host.clientHeight / fh);
    host.style.flex = 'none';
    host.style.width = Math.round(fw * k) + 'px';
    host.style.height = Math.round(fh * k) + 'px';
    const ks = $('[data-kscale]', ov);
    if (ks) ks.textContent = k.toFixed(2);
    const wrap = document.createElement('div');
    wrap.className = 'ovscale';
    wrap.style.width = fw + 'px';
    wrap.style.height = fh + 'px';
    wrap.style.transform = 'scale(' + k + ')';
    Object.values(S.wins).filter(w => w.ws === ws).sort((a, b) => a.z - b.z).forEach(w => {
      const src = $('.win[data-id="' + w.id + '"]');
      if (!src) return;
      const c = src.cloneNode(true);
      c.classList.remove('gone');
      c.style.pointerEvents = 'none';
      wrap.appendChild(c);
      const hit = document.createElement('div');
      hit.className = 'ovpick';
      hit.style.left = (parseFloat(src.style.left) * k) + 'px';
      hit.style.top = (parseFloat(src.style.top) * k) + 'px';
      hit.style.width = (parseFloat(src.style.width) * k) + 'px';
      hit.style.height = (parseFloat(src.style.height) * k) + 'px';
      hit.setAttribute('data-ovpick', w.id);
      hit.setAttribute('data-ovws', String(ws));
      host.appendChild(hit);
    });
    host.insertBefore(wrap, host.firstChild);
  });
}

/* ============================================================= tick ==== */
function walk(v, lo, hi, amp) {
  const n = v + (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, n));
}
function tick() {
  S.t += 1; S.clock += 1;
  S.cpu = S.cpu.map(v => Math.round(walk(v, 2, 99, 22)));
  S.memPct = Math.round(walk(S.memPct, 40, 92, 3));
  S.load = Math.round(walk(S.load, 0.05, 3.2, 0.22) * 100) / 100;
  S.rx = Math.round(walk(S.rx, 0, 420, 90) * 10) / 10;
  S.tx = Math.round(walk(S.tx, 0, 180, 30) * 10) / 10;
  S.hist.cpu.push(Math.round(S.cpu.reduce((a, b) => a + b, 0) / 4)); S.hist.cpu.shift();
  S.hist.net.push(Math.min(80, Math.round(S.rx / 5))); S.hist.net.shift();
  S.hist.mem.push(S.memPct); S.hist.mem.shift();
  renderCorner();
  ['mon', 'net', 'clock', 'proc', 'sys'].forEach(id => { if (S.wins[id] && !S.wins[id].min) redraw(id); });
  if ($('#lock').classList.contains('on')) renderLock();
}
/* =========================================================== events ==== */
document.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (!t.closest('.menu')) hideMenus();

  if ($('#lock').classList.contains('on')) {
    if (t.closest('#lock')) { setScene('desktop'); toast('session', 'unlocked, views restored to their zones'); }
    return;
  }
  if ($('#palette').classList.contains('on')) {
    const pr = t.closest('.prow');
    if (pr && pr.getAttribute('data-pi') !== null) { S.psel = Number(pr.getAttribute('data-pi')); runPalette(); return; }
    if (!t.closest('.sheet')) showPalette(false);
    return;
  }
  if (overviewOn()) {
    const pick = t.closest('[data-ovpick]');
    if (pick) {
      S.sheet = Number(pick.getAttribute('data-ovws'));
      showOverview(false);
      focusWin(pick.getAttribute('data-ovpick'));
      return;
    }
    const fld = t.closest('.ovfield');
    if (fld) { S.sheet = Number(fld.getAttribute('data-ovws')); showOverview(false); layout(); return; }
    if (!t.closest('.ovhead')) showOverview(false);
    return;
  }

  /* the view index in the title block is the tasklist AND the launcher */
  const vr = t.closest('.vrow');
  if (vr) {
    const id = vr.getAttribute('data-app');
    const w = S.wins[id];
    if (!w) openWin(id);
    else if (w.min || w.ws !== S.sheet) { w.ws = S.sheet; w.min = false; focusWin(id); }
    else if (S.focus === id) minWin(id);
    else focusWin(id);
    return;
  }
  const wsc = t.closest('.wsc');
  if (wsc) {
    if (wsc.getAttribute('data-ov')) { setScene('overview'); return; }
    S.sheet = Number(wsc.getAttribute('data-ws'));
    const top = Object.values(S.wins).filter(w => w.ws === S.sheet && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout();
    rev('sheet ' + pad2(S.sheet), 'brought forward, ' + top.length + ' views visible');
    toast('sheet', 'switched to ' + pad2(S.sheet) + ', ' + top.length + ' views visible');
    return;
  }

  const win = t.closest('.win');
  if (win) {
    const id = win.getAttribute('data-id');
    if (!S.wins[id]) return;
    if (S.wins[id].min) { focusWin(id); return; }
    const actEl = t.closest('[data-act]');
    const act = actEl ? actEl.getAttribute('data-act') : null;
    if (act === 'close') { closeWin(id); return; }
    if (act === 'closeself') { closeWin(id); return; }
    if (act === 'min') { minWin(id); return; }
    if (act === 'max') { maxWin(id); return; }
    if (act === 'winmenu') {
      focusWin(id);
      const r = win.getBoundingClientRect(), os = $('#os').getBoundingClientRect();
      showMenu($('#winmenu'), r.left - os.left, r.top - os.top + 26, [
        ['raise to continuous', 'click'],
        ['minimise to phantom', 'ctrl m'],
        [S.wins[id].max ? 'restore' : 'enlarge to sheet', 'ctrl f'],
        [S.wins[id].det ? 'return to zone' : 'free from zone', 'ctrl d'],
        ['transfer to sheet ' + (S.sheet === 1 ? '02' : '01'), 'shift ' + (S.sheet === 1 ? '2' : '1')],
        ['remove view', 'ctrl w']
      ], 'view ' + APP[id].n + ' ' + APP[id].name);
      $('#winmenu')._win = id;
      return;

    if (S.focus !== id) focusWin(id);

function handleWinAction(id, t) {
  const node = t.closest('[data-act], [data-toggle], [data-seg], [data-slider]');
  if (!node) return;
  if (node.hasAttribute('data-toggle')) {
    const k = node.getAttribute('data-toggle');
    S[k] = !S[k];
    if (k === 'zones') drawFrame();
    if (k === 'blink') document.body.classList.toggle('blinkon', S.blink);
    layout();
    redraw('set');
    toast(k, S[k] ? 'on' : 'off');
    return;
  }
  const segp = t.closest('[data-seg]');
  if (segp && t.closest('[data-arg]')) {
    const av = Number(t.closest('[data-arg]').getAttribute('data-arg'));
    if (segp.getAttribute('data-seg') === 'stock') { setStock(av ? 'dark' : 'light', true); return; }
    S.setTab = av; redraw('set');
    return;
  }
  const act = node.getAttribute('data-act');
  const arg = node.getAttribute('data-arg');
  if (act === 'file') { S.fileSel = Number(arg); redraw('files'); redraw('edit'); return; }
  if (act === 'proc') { S.procSel = Number(arg); redraw('mon'); return; }
  if (act === 'open') { openWin(arg); return; }
  if (act === 'ov') { setScene('overview'); return; }
  if (act === 'calc') { calcKey(arg); redraw('calc'); return; }
  if (act === 'toast') {
    const M = {
      build: ['make', 'zlos.elf relinked, text 218432 data 30720 bss 1441792'],
      unmount: ['zlfs', 'rd0 flushed, 2 pages written, unmounted clean'],
      reap: ['reaped', 'pid 42 regdump removed from the table'],
      renice: ['renice', 'pid 61 soak moved to nice 10'],
      retile: ['fitted', 'every view returned to the zone lattice'],
      plot: ['plotted', 'sheet ' + pad2(S.sheet) + ', 1 page, 1:1, monochrome']
    }[arg] || ['ok', arg];
    if (arg === 'retile') tileAll();
    if (arg === 'unmount') closeWin('dlg');
    toast(M[0], M[1]);
    return;
  }
}
function calcKey(k) {
  if (k === 'clr') { S.calcAcc = '0'; return; }
  if (k === 'eq') { S.calcAcc = String(parseInt(S.calcAcc, 10) || 0); return; }
  if (/^[0-9]$/.test(k)) { S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k; return; }
  if (k === 'div') { S.calcAcc = String(Math.floor((parseInt(S.calcAcc, 10) || 0) / 2)); return; }
  if (k === 'mul') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) * 2); return; }
  if (k === 'add') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) + 1); return; }
  if (k === 'sub') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) - 1); return; }
  if (k === 'hex' || k === 'dec' || k === 'bin') { toast('base', k + ' shown in the ledger above'); return; }
}
/* fit every view back onto the lattice, avoiding the reserved corner. */
function tileAll() {
  const list = Object.values(S.wins).filter(w => w.ws === S.sheet && !w.min && !APP[w.id].parent);
  const n = list.length;
  if (!n) return;
  const perRow = n <= 2 ? n : Math.ceil(n / 2);
  const rowsN = n <= 2 ? 1 : 2;
  const usableR = Math.max(1, LAT.resR);
  list.forEach((w, i) => {
    const rr = Math.floor(i / perRow), cc = i % perRow;
    const cwid = Math.max(1, Math.floor(S.zc / perRow));
    const rhh = Math.max(1, Math.floor(usableR / rowsN));
    w.det = false; w.max = false;
    w.c = cc * cwid; w.r = rr * rhh; w.cw = cwid; w.rh = rhh;
  });
  layout();
  rev('sheet ' + pad2(S.sheet), n + ' views fitted to the lattice');
  toast('fitted', n + ' views onto the ' + S.zc + ' x ' + S.zr + ' zone lattice');
}

/* ---------------------------------------------------------- sliders -- */
let SL = null;
document.addEventListener('mousedown', ev => {
  const s = ev.target.closest('[data-slider]');
  if (!s) return;
  SL = s; setSlider(ev);
});
document.addEventListener('mousemove', ev => { if (SL) setSlider(ev); });
document.addEventListener('mouseup', () => { SL = null; });
function setSlider(ev) {
  const name = SL.getAttribute('data-slider');
  const r = SL.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  const steps = name === 'ui' ? UI_STEPS : name === 'zc' ? ZC_STEPS : name === 'zr' ? ZR_STEPS : DASH_IDX;
  const v = steps[Math.round(p * (steps.length - 1))];
  if (name === 'ui') { if (v === S.ui) return; S.ui = v; applyUI(); }
  else if (name === 'zc') { if (v === S.zc) return; S.zc = v; }
  else if (name === 'zr') { if (v === S.zr) return; S.zr = v; }
  else {
    if (v === S.dashIdx) return;
    S.dashIdx = v;
    applyDash();
  }
  layout(); redraw('set'); redraw('zones');
}
function applyDash() {
  const d = DASH_STEPS[S.dashIdx];
  const root = document.documentElement.style;
  root.setProperty('--zb-dash', d[0] + 'px');
  root.setProperty('--zb-gapd', d[1] + 'px');
  root.setProperty('--zb-chain-l', (d[0] * 2) + 'px');
}
function applyUI() { document.documentElement.style.setProperty('--ui', String(S.ui)); }

/* ------------------------------------------------------------- drag --
 * While a view is off its zone, the distance back to the zone it will
 * snap to is DIMENSIONED IN REDLINE. That is the third and last use of
 * the second ink, and it is the only moment the desktop shows a delta. */
let DELTA = null;
function showDelta(w, tx, ty) {
  if (!DELTA) {
    DELTA = document.createElement('div');
    DELTA.className = 'delta';
    $('#field').appendChild(DELTA);
  }
  const dx = tx - w.x, dy = ty - w.y;
  DELTA.style.left = '0px'; DELTA.style.top = '0px';
  DELTA.style.width = '100%'; DELTA.style.height = '100%';
  let s = '';
  s += '<span class="dl" style="left:' + Math.min(w.x, tx) + 'px;top:' + w.y +
       'px;width:' + Math.abs(dx) + 'px;height:2px"></span>';
  s += '<span class="dl" style="left:' + tx + 'px;top:' + Math.min(w.y, ty) +
       'px;width:2px;height:' + Math.abs(dy) + 'px"></span>';
  s += '<span class="dt" style="left:' + (Math.min(w.x, tx) + 4) + 'px;top:' + (w.y - 16) +
       'px">dx ' + dx + '  dy ' + dy + '</span>';
  DELTA.innerHTML = s;
}
function hideDelta() { if (DELTA) { DELTA.remove(); DELTA = null; } }
function startDrag(ev, id, el) {
  const w = S.wins[id];
  if (w.max) return;
  const r = el.getBoundingClientRect(), f = $('#field').getBoundingClientRect();
  const ox = ev.clientX - r.left, oy = ev.clientY - r.top;
  const wid = r.width, hgt = r.height;
  el.classList.add('drag');
  function nearestZone() {
    let bc = 0, br = 0, bd = 1e9;
    LAT.zx.forEach((x, i) => { const d = Math.abs(x - w.x); if (d < bd) { bd = d; bc = i; } });
    bd = 1e9;
    LAT.zy.forEach((y, i) => { const d = Math.abs(y - w.y); if (d < bd) { bd = d; br = i; } });
    return { c: bc, r: br };
  }
  function move(e) {
    w.det = true;
    w.x = Math.round(e.clientX - f.left - ox);
    w.y = Math.round(e.clientY - f.top - oy);
    w.w = wid; w.h = hgt;
    layout();
    if (S.snap) { const z = nearestZone(); showDelta(w, LAT.zx[z.c], LAT.zy[z.r]); }
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    el.classList.remove('drag');
    hideDelta();
    if (S.snap && w.det) {
      const z = nearestZone();
      w.det = false; w.c = z.c; w.r = z.r;
      layout();
      rev(APP[id].n + ' ' + APP[id].name, 'snapped to zone ' + zoneName(z.c, z.r));
      toast('snapped', APP[id].name.toUpperCase() + ' to zone ' + zoneName(z.c, z.r));
    } else if (w.det) {
      rev(APP[id].n + ' ' + APP[id].name, 'placed free at ' + Math.round(w.x) + ', ' + Math.round(w.y));
    }
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

/* -------------------------------------------------------- keyboard --- */
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if ($('#lock').classList.contains('on')) {
    if (k === 'Enter' || k === 'Escape') { setScene('desktop'); toast('session', 'unlocked, views restored'); ev.preventDefault(); }
    return;
  }
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); ev.preventDefault(); return; }
    if (k === 'Enter') { runPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(S.psel + 1, Math.min(7, paletteResults().length - 1)); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    if (k.length === 1 && !ev.ctrlKey && !ev.metaKey) { S.pq += k; S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    return;
  }
  if (ev.shiftKey && (k === 'D' || k === 'd') && !ev.ctrlKey && !ev.metaKey) {
    setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return;
  }
  if (ev.ctrlKey && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if (ev.ctrlKey && k === ' ') { setScene(overviewOn() ? 'desktop' : 'overview'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'l' || k === 'L')) { setScene('lock'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'g' || k === 'G')) { S.zones = !S.zones; drawFrame(); redraw('set'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'i' || k === 'I')) { setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 't' || k === 'T')) { tileAll(); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'w' || k === 'W')) { if (S.focus) closeWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'f' || k === 'F')) { if (S.focus) maxWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'm' || k === 'M')) { if (S.focus) minWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === '1' || k === '2')) {
    S.sheet = Number(k);
    const top = Object.values(S.wins).filter(w => w.ws === S.sheet && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout(); ev.preventDefault(); return;
  }
  if (ev.altKey && /^[0-9]$/.test(k)) {
    const idx = k === '0' ? 9 : Number(k) - 1;
    if (APPS[idx]) openWin(APPS[idx].id);
    ev.preventDefault(); return;
  }
  if (k === 'Escape') { if (overviewOn()) setScene('desktop'); hideMenus(); }
});

/* ========================================================== process ====
 * Two processes, one set of role names. The cyanotype is the home ladder
 * and the default; the diazo whiteprint is the historical successor, not
 * an inversion. Setting data-theme is the ONLY switch - no weight, no
 * metric, no radius, no dash pitch and no motion value differs. */
const PROC = {
  dark: { name: 'cyanotype', other: 'diazo',
    pitch: 'the blueprint. prussian blue, white linework, no black.',
    toast: ['cyanotype', 'ground #16375E, linework #EDF1F3, redline #F99B84'] },
  light: { name: 'diazo', other: 'cyanotype',
    pitch: 'the whiteprint. the process that replaced it. still no black.',
    toast: ['diazo', 'ground #F0ECE0, blueline #27427D, redline #A8341D'] }
};
function applyTheme() {
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = PROC[S.theme].pitch;
  renderThemeTog();
}
function renderThemeTog() {
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-stock="dark">cyanotype</span>' +
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-stock="light">diazo</span>' +
    '<span class="thint">shift d</span>';
}
function hashName() { return S.scene + (S.theme === 'dark' ? '-dark' : ''); }
function setStock(t, announce) {
  const next = t === 'dark' ? 'dark' : 'light';
  if (next === S.theme && announce) return;
  S.theme = next;
  applyTheme();
  renderLinks();
  redraw('set');
  drawFrame();
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    rev('sheet ' + pad2(S.sheet), 'printed on ' + PROC[S.theme].name + ' stock');
    toast(PROC[S.theme].toast[0], PROC[S.theme].toast[1]);
  }
}
function renderLinks() {
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#links').innerHTML = SCENE_NAMES.map(n => '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  markLinks(S.scene);
}
function markLinks(name) {
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-dark$/, '') === name));
}

/* =========================================================== scenes ==== */
const SCENE_NAMES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.win[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZTOP = 10;
  S.rev = []; S.revN = 0;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#toasts').innerHTML = '';
}
function place(id, c, r, cw, rh, ws) { openWin(id, [c, r, cw, rh], ws || S.sheet, true); }
/* a seeded revision history, so the title block is never empty on load
   and the direction's own claim is visible in a screenshot. */
function seedRev() {
  S.rev = []; S.revN = 0;
  [['05 kernel log', 'nvme admin queue retried, 1 fail recorded'],
   ['03 monitor', 'sample rate held at 1 Hz, 64 s history'],
   ['02 files', 'unmount raised as a child view, chain dot'],
   ['sheet 01', '4 views fitted to the lattice'],
   ['14 registers', 'pipe A read back, 15 registers']].reverse()
    .forEach((r, i) => { S.revN += 1; S.rev.unshift({ r: ZONE_L[S.revN - 1], w: r[0], d: r[1],
      t: hhmmss(S.clock - (5 - i) * 47) }); });
}
function baseDesktop() {
  clearAll();
  S.sheet = 1; S.zc = 8; S.zr = 5;
  computeLat();
  place('shell', 0, 0, 3, 2);
  place('files', 3, 0, 3, 2);
  place('mon', 0, 2, 3, 3);
  place('net', 3, 2, 3, 3);
  /* 03 MONITOR is left MINIMISED, so the fourth line type - phantom - is
     on the sheet in a still. The outline stays exactly where the view
     was, carrying only its bubble, which is what makes a dock pointless. */
  S.wins.mon.min = true;
  place('log', 0, 0, 5, 3, 2);
  place('regs', 5, 0, 3, 2, 2);
  place('hex', 0, 3, 6, 2, 2);
  const Z = LAT, fw = Z.W - 2 * Z.mar;
  /* the child view: a dialog raised by 02 FILES, drawn in chain dot and
     joined to its parent by a dogleg leader. free of the lattice, because
     a dialog is a reference and not a view of the machine. */
  place('dlg', 5, 0, 3, 2);
  const d = S.wins.dlg;
  d.det = true;
  d.x = Z.zx[6] + 24; d.y = Math.round(40 * S.ui);
  d.w = Math.max(300, fw - d.x - 8); d.h = Math.round(268 * S.ui);
  /* one view freed from the lattice, front most, so the overlap state is
     visible without touching anything. */
  place('sys', 1, 0, 4, 3);
  const w = S.wins.sys;
  w.det = true;
  w.x = Math.round(fw * 0.115); w.y = Math.round(150 * S.ui);
  w.w = Math.round(fw * 0.446); w.h = Math.round(520 * S.ui);
  focusWin('sys');
  seedRev();
  layout();
}
function setScene(name, push) {
  let dark = false;
  if (/-dark$/.test(name)) { dark = true; name = name.slice(0, -5); }
  else if (SCENE_NAMES.indexOf(name) >= 0) dark = false;
  if (SCENE_NAMES.indexOf(name) < 0) { name = 'desktop'; dark = S.theme === 'dark'; }
  S.scene = name;
  S.theme = dark ? 'dark' : 'light';
  applyTheme();
  renderLinks();
  if (push !== false && location.hash.slice(1) !== hashName()) {
    history.replaceState(null, '', '#' + hashName());
  }
  markLinks(name);
  if (name === 'desktop') {
    baseDesktop();
    toast('sheet 01', '6 views: one continuous, two hidden, one chain dot, one phantom, one freed');
  } else if (name === 'overview') {
    baseDesktop(); showOverview(true);
  } else if (name === 'palette') {
    baseDesktop(); S.pq = 'zone'; S.psel = 0; showPalette(true);
  } else if (name === 'files') {
    clearAll(); S.sheet = 1; computeLat();
    place('files', 0, 0, 3, 5);
    place('edit', 3, 0, 3, 5);
    place('hex', 6, 0, 2, 2);
    S.fileSel = 1;
    redraw('files'); redraw('edit');
    focusWin('files');
    seedRev(); layout();
    toast('selected', 'fb.c 68.4 KiB, opened in view 04 EDITOR');
  } else if (name === 'monitor') {
    clearAll(); S.sheet = 1; computeLat();
    place('mon', 0, 0, 4, 5);
    place('net', 4, 0, 4, 2);
    place('proc', 4, 2, 2, 3);
    focusWin('mon');
    seedRev(); layout();
    toast('sampling', 'monitor and network at 1 Hz, 64 s history');
  } else if (name === 'settings') {
    clearAll(); S.sheet = 1; computeLat();
    place('set', 0, 0, 4, 5);
    place('type', 4, 0, 4, 2);
    place('calc', 4, 2, 2, 3);
    S.setTab = 0;
    redraw('set');
    focusWin('set');
    seedRev(); layout();
  } else if (name === 'lock') {
    baseDesktop(); showLock(true);
  }
  layout();
}
$('#themetog').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-stock]');
  if (t) { ev.preventDefault(); setStock(t.getAttribute('data-stock'), true); }
});
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
window.addEventListener('resize', () => {
  layout();
  if (overviewOn()) showOverview(true);
  if ($('#lock').classList.contains('on')) renderLock();
});

/* ============================================================ start ====
 * With no hash the desktop comes up on the CYANOTYPE. Blueline is the
 * dark primary member of the family; the diazo is the second process,
 * reachable by every deep link without the -dark suffix. */
document.body.classList.add('blinkon');
applyTheme(); applyUI(); applyDash();
computeLat();
setScene(location.hash.slice(1) || 'desktop-dark', false);
setInterval(tick, 1000);
</script>
