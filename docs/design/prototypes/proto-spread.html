/* ------------------------------------------------------------- drags --- *
 * Two, and they are the two things the running head makes possible.
 * SEGMENT DRAG reorders the spread by dragging a sheet BY ITS NAME in the
 * head; the sheet follows because the segment IS the sheet's column range.
 * SPLIT DRAG moves a column boundary, which is simultaneously a head division
 * and the edge of two sheets. Both reflow continuously. */
function startSegDrag(ev, id) {
  const seg = $('.hseg[data-seg-id="' + id + '"]');
  if (!seg || S.max) return;
  seg.classList.add('drag');
  const start = ev.clientX;
  let moved = false;
  function move(e) {
    if (Math.abs(e.clientX - start) < 6 && !moved) return;
    moved = true;
    const list = onSpread(S.ws);
    const i = list.indexOf(id);
    if (i < 0) return;
    const rect = $('#type').getBoundingClientRect();
    const x = e.clientX - rect.left;
    let target = i;
    list.forEach((oid, j) => {
      const w = S.wins[oid], r = spanRect(w.c, w.cw);
      if (x >= r.x && x <= r.x + r.w) target = j;
    });
    if (target !== i) {
      const full = S.order[S.ws];
      const from = full.indexOf(id);
      const to = full.indexOf(list[target]);
      full.splice(from, 1);
      full.splice(to, 0, id);
      layout();
    }
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    const s2 = $('.hseg[data-seg-id="' + id + '"]');
    if (s2) s2.classList.remove('drag');
    if (moved) { layout();
      toast('reflowed', APP[id].name.toUpperCase() + ' now owns col ' +
        p2(S.wins[id].c + 1) + ' - ' + p2(S.wins[id].c + S.wins[id].cw)); }
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
function startSplit(ev, el) {
  const a = S.wins[el.getAttribute('data-split-a')], b = S.wins[el.getAttribute('data-split-b')];
  if (!a || !b) return;
  const rect = $('#type').getBoundingClientRect();
  function move(e) {
    const x = e.clientX - rect.left;
    let best = a.c + 1, bd = 1e9;
    for (let k = a.c + 1; k <= a.c + a.cw + b.cw - 1; k++) {
      const d = Math.abs(GRID.colX[k] - x);
      if (d < bd) { bd = d; best = k; }
    }
    const total = a.cw + b.cw;
    const na = Math.max(1, Math.min(total - 1, best - a.c));
    if (na === a.cw) return;
    APP[a.id].cw = na; APP[b.id].cw = total - na;
    a.cw = na; b.c = a.c + na; b.cw = total - na;
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    toast('boundary moved', 'col ' + p2(b.c + 1) + ' - one drag moved the head division, ' +
      'both sheet edges and the leader rule');
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
/* free drag: a sheet dragged off the spread by its local plate. This is the
   third fallback case, and it is live the whole time the pointer is down. */
function startFree(ev, id, el) {
  const w = S.wins[id];
  if (!w.off) return;
  const r = el.getBoundingClientRect(), d = $('#desk').getBoundingClientRect();
  const ox = ev.clientX - r.left, oy = ev.clientY - r.top;
  el.classList.add('drag');
  w.offWhy = 'dragging';
  renderHead();
  function move(e) {
    w.x = Math.round(e.clientX - d.left - ox);
    w.y = Math.round(e.clientY - d.top - oy);
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    el.classList.remove('drag');
    w.offWhy = 'detached';
    layout();
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

/* scroll quantise: a scrolled region would otherwise put its rows between
   baselines, which is the one way the gate can be made to lie. */
document.addEventListener('scroll', ev => {
  if (!S.quant) return;
  const el = ev.target;
  if (!el.classList || !el.classList.contains('scr')) return;
  const b = Math.round(S.base * S.ui);
  const q = Math.round(el.scrollTop / b) * b;
  if (q !== el.scrollTop) el.scrollTop = q;
  S.audit = baselineAudit();
}, true);

/* ---------------------------------------------------------- keyboard --- */
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if ($('#lock').classList.contains('on')) {
    if (k === 'Enter' || k === 'Escape') { setScene('desktop');
      toast('unlocked', 'every segment back on the spread'); ev.preventDefault(); }
    return;
  }
  if (S.modal) {
    if (k === 'Escape') { showModal(false); ev.preventDefault(); return; }
    if (k === 'Enter') { runPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(S.psel + 1, Math.min(8, pRes().length - 1)); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    if (k.length === 1 && !ev.ctrlKey && !ev.metaKey) { S.pq += k; S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    return;
  }
  if (ev.shiftKey && (k === 'D' || k === 'd')) { setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showModal(true); ev.preventDefault(); return; }
  if (ev.ctrlKey && k === ' ') { setScene(ovOn() ? 'desktop' : 'overview'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'l' || k === 'L')) { setScene('lock'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'g' || k === 'G')) { S.grid = !S.grid; layout(); redraw('set'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'p' || k === 'P')) { S.pay = !S.pay; layout(); redrawAll(); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'r' || k === 'R')) { Object.values(S.wins).forEach(w => { w.off = false; }); layout(); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'd' || k === 'D')) { if (S.focus) { const w = S.wins[S.focus];
    if (w.off) reattach(S.focus); else detach(S.focus, 'detached'); } ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'w' || k === 'W')) { if (S.focus) closeWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'f' || k === 'F')) { if (S.focus) maxWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'm' || k === 'M')) { if (S.focus) minWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === '1' || k === '2')) { S.ws = Number(k); S.focus = topOf(S.ws);
    layout(); renderRail(); ev.preventDefault(); return; }
  if (ev.altKey && /^[0-9]$/.test(k)) {
    const idx = k === '0' ? 9 : Number(k) - 1;
    if (APPS[idx]) openWin(APPS[idx].id);
    ev.preventDefault(); return;
  }
  if (k === 'Escape') { if (ovOn()) setScene('desktop'); hideMenus(); }
});
/* ============================================================== stock ===

  }
  renderLinks();
  if (name === 'desktop') {
    baseDesktop();
    toast('respread', onSpread(1).length + ' segments on workspace 01, one sheet off the ' +
      'spread with its segment struck');
  } else if (name === 'overview') {
    baseDesktop(); showOverview(true);
  } else if (name === 'palette') {
    baseDesktop(); S.pq = 'spread'; S.psel = 0; showModal(true);
  } else if (name === 'files') {
    clearAll(); S.ws = 1;
    openWin('files'); openWin('edit'); openWin('hex');
    S.fileSel = 1; S.focus = 'edit';
    layout(); redrawAll(); renderRail();
    toast('selected', 'fb.c 68.4 KiB, opened in 04 EDITOR. five payload ranks inside the frame.');
  } else if (name === 'monitor') {
    clearAll(); S.ws = 1;
    openWin('mon'); openWin('proc'); openWin('net');
    S.focus = 'mon';
    layout(); redrawAll(); renderRail();
    toast('sampling', 'three sheets, one baseline. every row in MONITOR is level with a ' +
      'row in PROCESS across the gutter.');
  } else if (name === 'settings') {
    clearAll(); S.ws = 1;
    openWin('set'); openWin('sys'); openWin('clock');
    S.setTab = 0; S.focus = 'set';
    layout(); redrawAll(); renderRail();
  } else if (name === 'lock') {
    baseDesktop(); showLock(true);
  }
  S.audit = baselineAudit();
  redraw('set');
  renderRail(); renderFolio();
}

$('#thm').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-stock]');
  if (t) { ev.preventDefault(); setStock(t.getAttribute('data-stock'), true); }
});
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
window.addEventListener('resize', () => {
  layout();
  if (ovOn()) showOverview(true);
  if ($('#lock').classList.contains('on')) renderLock();
});

/* ============================================================== start === */
applyTheme();
document.documentElement.style.setProperty('--zd-sc', String(S.ui));
document.documentElement.style.setProperty('--zd-base', String(S.base));
computeGrid();
setScene(location.hash.slice(1) || 'desktop', false);
setInterval(tick, 1000);
</script>
