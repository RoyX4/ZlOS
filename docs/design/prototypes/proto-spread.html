<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPREAD / zlOS living prototype</title>
<style>
/* ============================================================================
   SPREAD.  Folio's twelve column page with PLATE's knockout lifted off the
   window entirely and hoisted into a RUNNING HEAD shared by the whole screen.
   One head, one baseline, one page.

   Every colour below is a design.h token name, lowercased. Zero hex appears as
   a CSS value anywhere outside the two :root blocks. Every name in the light
   block exists in the dark block; a name in only one mode is a defect.

   THREE THINGS NEITHER PARENT HAS
   1. THE RUNNING HEAD. One 32 dp band across the top of the type area, divided
      at COLUMN boundaries. Each sheet owns exactly the segment spanning its own
      columns. There is no title bar on any window. The focused segment knocks
      out to solid ink, so the black bar's left edge, right edge and width ARE
      the window's column span: the focus signal and the geometry readout are
      one object.
   2. THE SHARED BASELINE. A 24 dp grid ruled across the whole type area. Every
      sheet's body text sits on it, so a line in one sheet is level with a line
      in the sheet beside it across the gutter. Affordable only because text
      comes from fixed height baked atlases - integer, no float, and gateable as
      "every shell text origin y mod ZD_BASE == 0". The audit runs live in
      Settings > spread.
   3. COLOUR IS A BOUNDARY LAW, NOT A BUDGET LAW. The shell spends none at all -
      zero chromatic tokens outside the ZD_PAY_* and ZD_HEAT_* families. Inside
      a content rect, where the colour IS the payload, it is unconstrained. The
      2 px frame is the constitution.
   ========================================================================== */
:root {
  /* ---------------------------------------------------------- surfaces --
     THE DESK is the leaf under the sheet. THE SHEET is the stock. THE WELL is
     a content rect cut into the sheet, and it is the only ground on which a
     chromatic token is legal. THE BAND is the running head's unclaimed
     ground, and it is the DARKEST text-bearing surface in the system, which
     is what every ink below was picked against. */
  --zd-desk:      #EDE8DD;
  --zd-sheet:     #F7F4ED;
  --zd-well:      #FCFAF5;
  --zd-band:      #DFD9CC;

  /* -------------------------------------------------------------- inks --
     Three, and only three. INK_0 is the mark, INK_1 is body and data, INK_2
     is everything subordinate: unfocused titles, column numerals, captions,
     units. 5.25:1 on the band is the binding case. */
  --zd-ink-0:     #16140E;
  --zd-ink-1:     #2C2820;
  --zd-ink-2:     #5C5547;

  /* ------------------------------------------------------------- rules --
     Folio's three ranks, kept. HAIR is structure you are not meant to read.
     RULE is the 2 px structural weight - the head datum, the sheet frame when
     focused, the foot. CTRL is the one rank that must clear WCAG 1.4.11
     because it bounds an interactive control. */
  --zd-hair:      #C0B8A6;
  --zd-rule:      #16140E;
  --zd-rule-ctrl: #8A8270;

  /* --------------------------------------------------------- knockout --
     THE focus mechanism, and the only inversion in the system. On paper the
     segment goes to ink and the title is reversed out of it. KN_FG2 is the
     subordinate rank inside the knockout (the column span readout). KN_HAIR
     is a rule drawn ON the knockout ground. */
  --zd-kn-bg:     #16140E;
  --zd-kn-fg:     #F7F4ED;
  --zd-kn-fg2:    #B9B1A0;
  --zd-kn-hair:   #46413A;

  /* ------------------------------------------------------------- marks --
     A solid graphic that IS the datum: meter fill, slider fill, switch knob,
     scrollbar thumb. MARK_BULK is the same role over a large tonal area. On
     paper they are the same value; on carbon they separate. */
  --zd-mark:      #16140E;
  --zd-mark-bulk: #16140E;
  --zd-knob:      #F7F4ED;

  /* -------------------------------------------------- payload: colour --
     THE ONLY CHROMATIC TOKENS IN THE SYSTEM, and they are legal in exactly
     one place: inside a content rect bounded by a 2 px ZD_RULE frame on a
     ZD_WELL ground, where the colour is what the user came to read. Syntax
     highlighting, a heat map, a rendered page. The shell may not touch these.
     Every one is held to 4.5:1 on ZD_WELL in both modes. */
  --zd-pay-key:   #1D4E89;
  --zd-pay-str:   #7A4B00;
  --zd-pay-num:   #2E6A38;
  --zd-pay-cmt:   #6E6656;
  --zd-pay-err:   #A3301B;
  /* five step sequential ramp. NO TEXT IS EVER SET ON THESE - the top two
     steps cannot carry ink at 4.5:1 in either mode, so the figures live in
     the table beside the map, never in the cell. */
  --zd-heat-0:    #EDE8DD;
  --zd-heat-1:    #D9D0B8;
  --zd-heat-2:    #BFAE86;
  --zd-heat-3:    #9A7B50;
  --zd-heat-4:    #6B4626;

  /* ----------------------------------------------------------- metrics */
  --zd-sc:   1;
  --zd-u:    calc(1px * var(--zd-sc));
  /* ZD_BASE is the baseline unit and it is a NUMBER, not a length, because
     every other vertical metric in the shell is derived from it by integer
     multiplication. The Settings slider rewrites this one property. */
  --zd-base: 24;
  --zd-row:  calc(var(--zd-base) * var(--zd-u));
  --zd-head-h: calc(32 * var(--zd-u));   /* the running head band          */
  --zd-lead-h: var(--zd-row);            /* leader zone, exactly 1 baseline */
  --zd-rail-w: calc(176 * var(--zd-u));
  --zd-marg:   calc(24 * var(--zd-u));
  --zd-pad:    calc(16 * var(--zd-u));
  --zd-gap:    calc(12 * var(--zd-u));
  --zd-gap-s:  calc(8  * var(--zd-u));
  /* the 1 px keyline is paid for out of the sheet's top padding, so the first
     baseline lands at exactly ZD_BASE from the sheet's top edge, which is
     itself the desk origin. The FOCUS frame is drawn with an outline at
     offset -2, not a wider border, because a border that changed width would
     move every baseline in that sheet by one pixel and the gate would be
     measuring the focus state instead of the layout. */
  --zd-frame:  calc(2 * var(--zd-u));
  --zd-sheet-pad-t: calc(var(--zd-row) - 1px);
  /* 28 dp, DELIBERATELY OFF THE BASELINE. An object that is not on the spread
     must not pretend to be on it, so the local plate a detached sheet or a
     modal carries is the one metric in the system that is not a multiple of
     ZD_BASE. You can see it fail to line up, and that is the point. */
  --zd-plate-h: calc(28 * var(--zd-u));

  /* -------------------------------------------------------------- type --
     THREE SIZES, one per baked atlas, and no fourth. 13 -> 8x16, 21 -> 16x32,
     42 -> 24x48. Every line box is a whole number of baselines: 13 and 21 set
     on ZD_BASE, 42 set on two. Datum lost points for needing six sizes and
     upscaling; here the atlas limitation is what makes the grid exact. */
  --zd-fs-a:  calc(13 * var(--zd-u));
  --zd-fs-b:  calc(21 * var(--zd-u));
  --zd-fs-c:  calc(42 * var(--zd-u));
  --zd-trk-l: calc(1.5 * var(--zd-u));
  --zd-trk-h: calc(3   * var(--zd-u));
  --zd-sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --zd-mono: ui-monospace, 'DejaVu Sans Mono', monospace;

  /* ------------------------------------------------------------ motion --
     Two. A cut and a slide. Reflow is the only thing that moves, and it moves
     linearly because it is a layout being recomputed, not an object with
     momentum. */
  --zd-ms-flow: 110ms;
  --zd-ms-cut:  0ms;
}

/* ============================================================================
   THE SECOND LADDER. CARBON PAPER: the sheet under the top sheet, where a mark
   is where the pressure went through rather than where ink was laid. Same role
   names, second set of primitives - the shape ui_theme_init_q8() will have.

   1. IT STAYS WARM. Carbon is wax on stock, not glass. Every achromatic token
      here holds R > G > B on the same hue axis the paper carries. Breaking
      toward a cool near-black is precisely how this direction slides into the
      thing the brief bans, so the ground is #191510 and not #101010.
   2. THE SHEET BARELY LIFTS OFF THE DESK. 1.118:1, where paper measured
      1.112:1. The keyline carries the separation in both modes; the surfaces
      never did. This is the property that has to hold, not the hexes.
   3. THE KNOCKOUT INVERTS POLARITY, AS CARBON DOES. On paper the segment goes
      to ink. On carbon the segment CLEARS - the wax lifted - to ZD_KN_BG
      #EFE9DA with the title standing in the ground colour. Same operation,
      same rank, opposite pole, and the geometry is invariant.
   4. THE 2 PX RULE DROPS ITS VALUE, NOT ITS WEIGHT. A 2 px light rule on a
      dark ground blooms. Thinning it would delete the two weight system, which
      IS the depth model, so the weight stays 2 px and the value comes down
      from 16.76:1 to 4.49:1 - where the keyline sat on paper.
   5. THE BULK MARK SCREENS. A meter fill or a plot covers too much ground to
      sit at the solid mark value without becoming a lamp: ZD_MARK 10.14:1,
      ZD_MARK_BULK 4.87:1.
   6. THE BAND IS STILL THE TIGHTEST TEXT-BEARING SURFACE. On paper it is the
      darkest; on carbon it is the lightest, because more pressure means more
      mark. The sign flips, the rank does not: ZD_INK_2 measures 5.25:1 on the
      paper band and 5.32:1 on the carbon band.
   ========================================================================== */
:root[data-theme="dark"] {
  --zd-desk:      #191510;
  --zd-sheet:     #232019;
  --zd-well:      #2C2820;
  --zd-band:      #2E2A21;

  --zd-ink-0:     #E7E1D1;
  --zd-ink-1:     #CFC7B4;
  --zd-ink-2:     #A69D8A;

  --zd-hair:      #4C4536;
  --zd-rule:      #8E8672;
  --zd-rule-ctrl: #8A8270;

  --zd-kn-bg:     #EFE9DA;
  --zd-kn-fg:     #191510;
  --zd-kn-fg2:    #4C4536;
  --zd-kn-hair:   #A79F91;

  --zd-mark:      #D5CBBC;
  --zd-mark-bulk: #9C9482;
  --zd-knob:      #E7E1D1;

  --zd-pay-key:   #8FB6E0;
  --zd-pay-str:   #D8AC5C;
  --zd-pay-num:   #7BB584;
  --zd-pay-cmt:   #9A9280;
  --zd-pay-err:   #E4907C;
  --zd-heat-0:    #232019;
  --zd-heat-1:    #3A3327;
  --zd-heat-2:    #5C4E33;
  --zd-heat-3:    #8A6B3C;
  --zd-heat-4:    #C08B49;
}

/* ============================================================== reset === */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--zd-desk); font-family: var(--zd-sans);
       overflow: hidden; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--zd-well); border-left: 1px solid var(--zd-hair); }
::-webkit-scrollbar-thumb { background: var(--zd-mark-bulk); }

/* =============================================================== type === */
.t-d { font-family: var(--zd-mono); font-size: var(--zd-fs-a); line-height: var(--zd-row);
       font-weight: 400; color: var(--zd-ink-1); font-variant-numeric: tabular-nums; }
.t-l { font-family: var(--zd-sans); font-size: var(--zd-fs-a); line-height: var(--zd-row);
       font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-trk-l);
       margin-right: calc(-1 * var(--zd-trk-l)); color: var(--zd-ink-2); }
.t-b { font-family: var(--zd-sans); font-size: var(--zd-fs-a); line-height: var(--zd-row);
       font-weight: 400; color: var(--zd-ink-1); }
.t-h { font-family: var(--zd-sans); font-size: var(--zd-fs-b); line-height: var(--zd-row);
       font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-trk-h);
       margin-right: calc(-1 * var(--zd-trk-h)); color: var(--zd-ink-0); }
.t-x { font-family: var(--zd-mono); font-size: var(--zd-fs-c);
       line-height: calc(var(--zd-row) * 2); font-weight: 700; color: var(--zd-ink-0);
       font-variant-numeric: tabular-nums; letter-spacing: var(--zd-trk-h); }
.i0 { color: var(--zd-ink-0); } .i1 { color: var(--zd-ink-1); } .i2 { color: var(--zd-ink-2); }
.bd { font-weight: 700; }
.kn  { color: var(--zd-kn-fg); } .kn2 { color: var(--zd-kn-fg2); }

/* STATUS WITHOUT COLOUR. Folio's law, taken one step further than Folio took
   it: PLATE spends green, ochre and oxblood on OK / WARN / FAIL. SPREAD has no
   chromatic token available in the shell at all, so the three ranks are made
   with case, rule weight and inversion instead. */
/* INLINE, not inline-block: an inline-block set on the row's own line-height
   grows the line box past ZD_BASE and puts every table row after it off the
   baseline. An inline element takes a border-bottom without changing line
   height, which is exactly what the WARN rank needs. */
.st { font-family: var(--zd-sans); font-size: var(--zd-fs-a);
      font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-trk-l);
      display: inline; }
.st.ok   { color: var(--zd-ink-2); }
.st.warn { color: var(--zd-ink-0); border-bottom: 2px solid var(--zd-ink-0); }
.st.fail { color: var(--zd-kn-fg); background: var(--zd-kn-bg);
           padding: 0 calc(6 * var(--zd-u)); }
</style>
<style>
/* ==================================================== prototype strip ===
   Furniture belonging to this document, not to the design. */
#strip { position: fixed; left: 0; right: 0; top: 0; height: 28px; z-index: 400;
         background: var(--zd-kn-bg); border-bottom: 2px solid var(--zd-rule);
         display: flex; align-items: stretch; padding-left: 12px; }
#strip .nm { display: flex; align-items: center; color: var(--zd-kn-fg);
             font-family: var(--zd-sans); font-size: 13px; font-weight: 700;
             text-transform: uppercase; letter-spacing: 3px; }
#strip .pitch { display: block; line-height: 28px; padding: 0 14px; color: var(--zd-kn-fg2);
                font-family: var(--zd-mono); font-size: 11px; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#strip .links, #strip .thm { display: flex; }
#strip .links { margin-left: auto; }
#strip a, #strip .tk { display: flex; align-items: center; padding: 0 10px; cursor: pointer;
  text-decoration: none; border-left: 1px solid var(--zd-kn-hair); color: var(--zd-kn-fg2);
  font-family: var(--zd-sans); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; }
#strip a.on, #strip .tk.on { background: var(--zd-kn-fg); color: var(--zd-kn-bg); }
#strip .hint { display: flex; align-items: center; padding: 0 10px; color: var(--zd-kn-fg2);
  border-left: 1px solid var(--zd-kn-hair); font-family: var(--zd-mono); font-size: 11px; }

#os { position: fixed; left: 0; right: 0; top: 28px; bottom: 0;
      background: var(--zd-desk); overflow: hidden; }

/* ============================================================== rail ====
   Folio's left margin rail, DEMOTED. It is no longer the single index -
   the running head carries the tasklist now - so it is narrower than either
   parent's, it holds no knockout, and its only job is the running table of
   contents plus the Alt+NN table that still works. */
#rail { position: absolute; left: 0; top: 0; bottom: 0; width: var(--zd-rail-w);
        background: var(--zd-sheet); border-right: 2px solid var(--zd-rule);
        display: flex; flex-direction: column; z-index: 30; }
#rail .ident { height: calc(var(--zd-row) * 2); flex: none; padding: 0 var(--zd-pad);
               display: flex; flex-direction: column; justify-content: center; }
#rail .sect { height: var(--zd-row); flex: none; padding: 0 var(--zd-pad);
              display: flex; align-items: center; border-bottom: 1px solid var(--zd-hair); }
#toc { overflow-y: auto; overflow-x: hidden; flex: 0 1 auto; }
.toc { height: var(--zd-row); display: flex; align-items: center; cursor: pointer;
       padding: 0 var(--zd-pad); position: relative; }
.toc .mk { position: absolute; left: 0; top: 0; bottom: 0; width: calc(3 * var(--zd-u));
           background: transparent; }
.toc.open .mk { background: var(--zd-ink-0); }
.toc.held .mk { background: var(--zd-ink-0); top: 35%; bottom: 35%; }
.toc .nn { color: var(--zd-ink-2); width: calc(22 * var(--zd-u)); flex: none; }
.toc .rn { color: var(--zd-ink-2); overflow: hidden; white-space: nowrap; }
.toc.open .rn { color: var(--zd-ink-1); }
/* the rail's focus cue is WEIGHT AND A RULE, never inversion. Inversion is
   the running head's alone, and having two of them would make the head's
   claim - that the black bar IS the column span - untrue. */
.toc.foc .rn { color: var(--zd-ink-0); font-weight: 700; }
.toc.foc { box-shadow: inset 0 -2px 0 0 var(--zd-ink-0); }
.toc:hover:not(.foc) { background: var(--zd-well); }
#rail .wsr { display: flex; flex: none; border-top: 1px solid var(--zd-hair);
             border-bottom: 1px solid var(--zd-hair); }
#rail .wsc { flex: 1; height: var(--zd-row); display: flex; align-items: center;
             justify-content: center; cursor: pointer; border-right: 1px solid var(--zd-hair); }
#rail .wsc:last-child { border-right: 0; }
#rail .wsc.on { box-shadow: inset 0 -2px 0 0 var(--zd-ink-0); }
#rail .wsc.on .t-l { color: var(--zd-ink-0); }
#readout { margin-top: auto; flex: none; padding-bottom: var(--zd-row); }
.rd { height: var(--zd-row); display: flex; align-items: center; padding: 0 var(--zd-pad); }
.rd .v { margin-left: auto; padding-left: var(--zd-gap); color: var(--zd-ink-1); }

/* ============================================================== type ==== */
#type { position: absolute; left: var(--zd-rail-w); right: 0; top: 0; bottom: 0;
        overflow: hidden; background: var(--zd-desk); }

/* ====================================================== running head ====
   ONE header for the entire screen, and its divisions ARE the column layout. */
#head { position: absolute; left: 0; right: 0; top: 0; height: var(--zd-head-h); z-index: 25; }
#head .stock { position: absolute; top: 0; bottom: 0; background: var(--zd-band); }
#head .datum { position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
               background: var(--zd-rule); }
#head .cnum { position: absolute; top: 0; bottom: 2px; display: flex; align-items: center;
              justify-content: center; pointer-events: none; }
.hseg { position: absolute; top: 0; bottom: 2px; background: var(--zd-sheet);
        border-bottom: 1px solid var(--zd-hair); display: flex; align-items: center;
        padding: 0 calc(10 * var(--zd-u)); gap: var(--zd-gap-s); cursor: grab;
        overflow: hidden; white-space: nowrap;
        transition: left var(--zd-ms-flow) linear, width var(--zd-ms-flow) linear; }
.hseg.drag { transition: none; cursor: grabbing; z-index: 3; }
.hseg .hn { color: var(--zd-ink-2); flex: none; }
.hseg .ht { color: var(--zd-ink-2); font-weight: 700; overflow: hidden;
            text-overflow: ellipsis; min-width: 0; }
.hseg .hc { margin-left: auto; color: var(--zd-ink-2); flex: none; padding-left: var(--zd-gap-s); }
/* THE KNOCKOUT. The segment goes solid and the title reverses out of it. Its
   left edge, right edge and width are the sheet's column span, read off the
   top of the screen. */
.hseg.foc { background: var(--zd-kn-bg); border-bottom: 0; }
.hseg.foc .hn { color: var(--zd-kn-fg2); }
.hseg.foc .ht { color: var(--zd-kn-fg); }
.hseg.foc .hc { color: var(--zd-kn-fg2); }
/* THE NON-DISJOINT FALLBACK, and it is drawn before any head segment is.
   A window that cannot own a disjoint column range - detached, mid-drag, or
   blocked behind a modal - is NOT on the spread. Its segment is struck
   through with a 1 px rule and its span readout is replaced by the reason. */
.hseg.struck .ht, .hseg.struck .hn { color: var(--zd-ink-2); }
.hseg.struck .strike { position: absolute; left: calc(10 * var(--zd-u));
        right: calc(10 * var(--zd-u)); top: 50%; height: 1px; background: var(--zd-ink-0); }
.hseg .strike { display: none; }
.hseg.struck .strike { display: block; }
.hseg:hover:not(.foc) { background: var(--zd-well); }

/* leader rules: 1 px from each segment boundary down the leader zone to the
   sheet's top edge, tying head to sheet at distance. The focused segment's
   pair doubles with its frame. */
#lead { position: absolute; left: 0; right: 0; top: var(--zd-head-h); height: var(--zd-lead-h);
        z-index: 24; pointer-events: none; }

/* ============================================================== desk ==== */
#desk { position: absolute; left: 0; right: 0; overflow: hidden; }
#gridsvg { position: absolute; left: 0; top: 0; pointer-events: none; }
#wins { position: absolute; inset: 0; }
#folio { position: absolute; left: 0; right: 0; bottom: 0; height: var(--zd-row);
         display: flex; align-items: center; pointer-events: none;
         padding: 0 var(--zd-marg); }

/* ============================================================= sheet ====
   A window has NO TITLE BAR. Square corners, a 1 px keyline, and the top
   padding is ZD_BASE minus the frame so the first baseline lands exactly one
   baseline below the desk origin. */
.win { position: absolute; background: var(--zd-sheet); border: 1px solid var(--zd-hair);
       display: flex; flex-direction: column; overflow: hidden;
       padding: var(--zd-sheet-pad-t) var(--zd-pad) 0;
       transition: left var(--zd-ms-flow) linear, width var(--zd-ms-flow) linear; }
.win.drag { transition: none; }
.win.hidden { display: none; }
/* SECOND, REDUNDANT, STRUCTURAL CUE. The keyline steps from rank 1 to rank 3,
   drawn as an inset outline so it costs no layout. Toggleable in Settings so
   you can see what the knockout is carrying on its own. */
.cue2 .win.foc { outline: 2px solid var(--zd-rule); outline-offset: -2px;
                 border-color: var(--zd-rule); }
.win .body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
/* the foot rule: Folio's per-window subtitle and path line, moved off the
   (deleted) header and into the last baseline of the sheet. */
.win .foot { height: var(--zd-row); flex: none; display: flex; align-items: center;
             gap: var(--zd-gap); border-top: 1px solid var(--zd-hair); overflow: hidden;
             white-space: nowrap; }
/* the local 28 dp plate. Only ever drawn on something that is OFF the
   spread, and deliberately not a multiple of ZD_BASE. */
.win.off { padding: 0; border: 2px solid var(--zd-rule); }
.win.off .plate { height: var(--zd-plate-h); flex: none; display: flex; align-items: center;
       gap: var(--zd-gap-s); padding: 0 calc(10 * var(--zd-u)); cursor: grab;
       background: var(--zd-sheet); border-bottom: 1px solid var(--zd-hair); }
.win.off.foc .plate { background: var(--zd-kn-bg); border-bottom: 0; }
.win.off.foc .plate .t-l, .win.off.foc .plate .t-d { color: var(--zd-kn-fg); }
.win.off.foc .plate .dim { color: var(--zd-kn-fg2); }
.win.off .plate .dim { color: var(--zd-ink-2); }
.win .plate { display: none; }
.win.off .plate { display: flex; }
.win.off .body { padding: 0 calc(var(--zd-pad) - 2px); }
/* every table is a flex item, and a table that is allowed to shrink compresses
   its own fixed row heights - which is both a visible defect and a silent way
   to break the baseline gate. They never shrink. */
.tblbox { flex: none; }
.win .ctl { width: calc(20 * var(--zd-u)); height: var(--zd-plate-h); flex: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border-left: 1px solid var(--zd-hair); }
.win.off.foc .ctl { border-left-color: var(--zd-kn-hair); color: var(--zd-kn-fg); }

/* the split handle: the gutter between two adjacent sheets IS a column
   boundary AND a head division, so dragging it moves all three at once. */
.split { position: absolute; z-index: 6; cursor: col-resize; }
.split i { position: absolute; left: 50%; top: 45%; width: 1px; height: 10%;
           background: var(--zd-hair); }
.split:hover i { background: var(--zd-ink-0); width: 2px; }

/* ======================================================== primitives ==== */
/* scoped to div ON PURPOSE. `r` is also the table cell's right-align class,
   and an unscoped `.r { display: flex }` turns every right-aligned <td> into a
   flex box, which silently destroys table-layout: fixed. That is what was
   stacking the cpu and rss columns in MONITOR. */
div.r { height: var(--zd-row); flex: none; display: flex; align-items: center;
     gap: var(--zd-gap); overflow: hidden; white-space: nowrap; }
div.r2 { height: calc(var(--zd-row) * 2); flex: none; display: flex; align-items: center;
      gap: var(--zd-gap); overflow: hidden; }
.sp { margin-left: auto; }
.hr1 { height: 1px; background: var(--zd-hair); flex: none; }
.hr2 { height: 2px; background: var(--zd-rule); flex: none; }
.vr { width: 1px; height: calc(13 * var(--zd-u)); background: var(--zd-hair); flex: none; }
.scr { overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; }
/* THE CONTENT RECT. The 2 px frame is the constitution: inside it, colour is
   legal because the colour is the payload. Outside it, there is none. */
/* the frame costs 2 px top and bottom and the inner padding pays for it out of
   half a baseline each side, so a rect holding N payload lines measures
   ZD_BASE * (N + 1) and the shell grid closes over it again on the far side. */
.rect { border: 2px solid var(--zd-rule); background: var(--zd-well); min-height: 0;
        padding: calc(var(--zd-row) / 2 - 2px) 0;
        display: flex; flex-direction: column; overflow: hidden; }
.rect .pre { font-family: var(--zd-mono); font-size: var(--zd-fs-a);
             line-height: var(--zd-row); white-space: pre; color: var(--zd-ink-1);
             padding: 0 calc(10 * var(--zd-u)); }
/* a payload wider than its frame scrolls INSIDE the frame. It never sets its
   own width against the shell, because the frame is the boundary. */
.rect .scr { overflow-x: auto; }
.pay-key { color: var(--zd-pay-key); } .pay-str { color: var(--zd-pay-str); }
.pay-num { color: var(--zd-pay-num); } .pay-cmt { color: var(--zd-pay-cmt); }
.pay-err { color: var(--zd-pay-err); }
/* the boundary law, switched off: every payload rank falls back to a weight
   or a case distinction and nothing else changes. */
.nopay .pay-key { color: var(--zd-ink-0); font-weight: 700; }
.nopay .pay-str { color: var(--zd-ink-1); }
.nopay .pay-num { color: var(--zd-ink-1); font-weight: 700; }
.nopay .pay-cmt { color: var(--zd-ink-2); }
.nopay .pay-err { color: var(--zd-ink-0); font-weight: 700;
                  box-shadow: inset 0 -2px 0 0 var(--zd-ink-0); }

/* SEPARATE, not collapse. A collapsed bottom border on the last row hangs half
   a pixel outside the table box, so a table of N rows measures 24N + 1 and
   every element after it is one pixel off the baseline. With separate borders
   and zero spacing each cell's rule lives inside its own 24 px border box and
   the table is exactly 24N. */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.tbl th { text-align: left; height: var(--zd-row); padding: 0 calc(6 * var(--zd-u));
          border-bottom: 1px solid var(--zd-hair); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; line-height: calc(var(--zd-row) - 1px);
          font-family: var(--zd-sans); font-size: var(--zd-fs-a);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-trk-l);
          color: var(--zd-ink-2); }
.tbl td { height: var(--zd-row); padding: 0 calc(6 * var(--zd-u));
          border-bottom: 1px solid var(--zd-hair); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; font-family: var(--zd-mono); font-size: var(--zd-fs-a);
          color: var(--zd-ink-1); font-variant-numeric: tabular-nums;
          /* the cell's own strut must BE the baseline MINUS its rule. The
             cell's border box is ZD_BASE and the 1 px rule lives inside it, so
             a line-height of a full ZD_BASE overflows the content box and
             grows the row to 25 px. Every inline child inherits this, which is
             what stops a .t-l or a .st re-introducing the same 1 px. */
          line-height: calc(var(--zd-row) - 1px); }
.tbl td *, .tbl th * { line-height: inherit; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl tr.pick { cursor: pointer; }
.tbl tr.pick:hover:not(.sel) td { background: var(--zd-well); }
.tbl tr.sel td { background: var(--zd-kn-bg); color: var(--zd-kn-fg); }
.tbl tr.sel td .i2, .tbl tr.sel td .st.ok { color: var(--zd-kn-fg2); }
.tbl tr.sel td .st.warn { color: var(--zd-kn-fg); box-shadow: inset 0 -2px 0 0 var(--zd-kn-fg); }
.tbl tr.sel td .st.fail { background: var(--zd-kn-fg); color: var(--zd-kn-bg); }

.kv { height: var(--zd-row); flex: none; display: flex; align-items: baseline;
      border-bottom: 1px solid var(--zd-hair); overflow: hidden; }
.kv .v { margin-left: auto; padding-left: var(--zd-gap); color: var(--zd-ink-1);
         font-family: var(--zd-mono); font-size: var(--zd-fs-a); white-space: nowrap;
         font-variant-numeric: tabular-nums; }
.kvg { display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(20 * var(--zd-u));
       flex: none; }
.c2 { display: flex; gap: calc(20 * var(--zd-u)); min-height: 0; flex: 1; }
.c2 > * { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

.btn { height: var(--zd-row); padding: 0 var(--zd-gap); display: inline-flex; align-items: center;
       border: 1px solid var(--zd-rule-ctrl); background: var(--zd-sheet); cursor: pointer; flex: none; }
.btn .t-l { color: var(--zd-ink-1); }
.btn:hover { background: var(--zd-well); }
.btn.on, .btn:active { background: var(--zd-kn-bg); border-color: var(--zd-kn-bg); }
.btn.on .t-l, .btn:active .t-l { color: var(--zd-kn-fg); }
/* the control's own keyline is paid for out of its height, so a segmented
   control in the flow is exactly one baseline tall and not 26 px. */
.seg { display: flex; border: 1px solid var(--zd-rule-ctrl); flex: none;
       height: var(--zd-row); }
.seg > span { flex: 1; height: 100%; display: flex; align-items: center;
        justify-content: center; cursor: pointer; border-right: 1px solid var(--zd-rule-ctrl); }
.seg > span:last-child { border-right: 0; }
.seg > span.on { background: var(--zd-kn-bg); }
.seg > span.on .t-l { color: var(--zd-kn-fg); }

.mtr { flex: none; height: var(--zd-row); display: flex; align-items: center; gap: var(--zd-gap); }
.trk { flex: 1; height: calc(8 * var(--zd-u)); background: var(--zd-well);
       border: 1px solid var(--zd-rule-ctrl); min-width: 0; }
.trk > i { display: block; height: 100%; background: var(--zd-mark-bulk); }
.sw { width: calc(32 * var(--zd-u)); height: calc(16 * var(--zd-u)); background: var(--zd-well);
      border: 1px solid var(--zd-rule-ctrl); position: relative; cursor: pointer; flex: none; }
.sw > i { position: absolute; left: 1px; top: 1px; width: calc(12 * var(--zd-u));
          height: calc(12 * var(--zd-u)); background: var(--zd-mark); }
.sw.on { background: var(--zd-mark); }
.sw.on > i { left: auto; right: 1px; background: var(--zd-knob); }
.sld { position: relative; width: calc(160 * var(--zd-u)); height: var(--zd-row);
       display: flex; align-items: center; cursor: pointer; flex: none; }
.sld .st2 { position: absolute; left: 0; right: 0; height: calc(8 * var(--zd-u));
            background: var(--zd-well); border: 1px solid var(--zd-rule-ctrl); }
.sld .sf { position: absolute; left: 1px; height: calc(6 * var(--zd-u));
           background: var(--zd-mark-bulk); }
.sld .sh { position: absolute; top: calc(4 * var(--zd-u)); width: calc(8 * var(--zd-u));
           height: calc(16 * var(--zd-u)); background: var(--zd-knob);
           border: 2px solid var(--zd-mark); }
.sld .tk { position: absolute; bottom: calc(2 * var(--zd-u)); width: 1px;
           height: calc(3 * var(--zd-u)); background: var(--zd-rule-ctrl); }
.hmap { display: flex; flex: none; height: calc(var(--zd-row) * 2);
        border: 2px solid var(--zd-rule); }
.hmap > i { flex: 1; border-right: 1px solid var(--zd-hair); }
.hmap > i:last-child { border-right: 0; }
.plot { position: relative; flex: 1; min-height: calc(var(--zd-row) * 2);
        border: 2px solid var(--zd-rule); background: var(--zd-well); overflow: hidden; }
.plot svg { display: block; }
.mean { position: absolute; left: 0; right: 0; height: 1px; background: var(--zd-ink-0); }
.caret { display: inline-block; width: calc(7 * var(--zd-u)); height: calc(15 * var(--zd-u));
         background: var(--zd-ink-0); vertical-align: text-bottom; }
.rect .caret { background: var(--zd-ink-1); }
.blinkon .caret { animation: bl 500ms steps(1, end) infinite; }
@keyframes bl { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }

/* ========================================================== overview ==== */
/* above the off-spread sheets. A detached window carries z 200 + its raise
   counter, which climbs without bound, so the overview cannot sit at a fixed
   60 and hope to win. */
#ov { position: absolute; inset: 0; background: var(--zd-desk); z-index: 999; display: none;
      flex-direction: column; padding: var(--zd-marg); }
#ov.on { display: flex; }
.ovws { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ovbox { position: relative; flex: 1; border: 2px solid var(--zd-hair);
         background: var(--zd-desk); overflow: hidden; cursor: pointer; }
.ovbox.cur { border-color: var(--zd-rule); }
.ovsc { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.ovpick { position: absolute; z-index: 5; cursor: pointer; }
.ovpick:hover { outline: 2px solid var(--zd-ink-0); }

/* ==================================================== modal + menus ==== */
#modal { position: absolute; inset: 0; z-index: 120; display: none; }
#modal.on { display: block; }
#modal .veil { position: absolute; inset: 0; }
#modal .box { position: absolute; left: 50%; top: calc(var(--zd-row) * 4);
      transform: translateX(-50%); width: calc(600 * var(--zd-u));
      background: var(--zd-sheet); border: 2px solid var(--zd-rule);
      display: flex; flex-direction: column; }
#modal .plate { height: var(--zd-plate-h); flex: none; display: flex; align-items: center;
      gap: var(--zd-gap-s); padding: 0 calc(10 * var(--zd-u)); background: var(--zd-kn-bg); }
.prow { height: var(--zd-row); display: flex; align-items: center; gap: var(--zd-gap);
        padding: 0 calc(10 * var(--zd-u)); border-bottom: 1px solid var(--zd-hair);
        cursor: pointer; white-space: nowrap; overflow: hidden; }
.prow.on { background: var(--zd-kn-bg); }
.prow.on .t-l { color: var(--zd-kn-fg); }
.prow.on .t-d { color: var(--zd-kn-fg2); }
.prow .hint { margin-left: auto; color: var(--zd-ink-2); }
.menu { position: absolute; z-index: 200; background: var(--zd-sheet);
        border: 2px solid var(--zd-rule); min-width: calc(200 * var(--zd-u)); display: none; }
.menu.on { display: block; }
.menu .mh { height: var(--zd-plate-h); background: var(--zd-kn-bg); display: flex;
            align-items: center; padding: 0 calc(10 * var(--zd-u)); }
.menu .mi { height: var(--zd-row); display: flex; align-items: center; gap: var(--zd-gap);
            padding: 0 calc(10 * var(--zd-u)); border-bottom: 1px solid var(--zd-hair);
            cursor: pointer; white-space: nowrap; }
.menu .mi:last-child { border-bottom: 0; }
.menu .mi:hover { background: var(--zd-kn-bg); }
.menu .mi:hover .t-l { color: var(--zd-kn-fg); }
.menu .mi:hover .hint { color: var(--zd-kn-fg2); }
.menu .mi .hint { margin-left: auto; color: var(--zd-ink-2); }

/* ============================================================ toasts ==== */
#toasts { position: absolute; right: var(--zd-marg); bottom: var(--zd-row); z-index: 150;
          display: flex; flex-direction: column; gap: var(--zd-gap-s); align-items: flex-end; }
.toast { background: var(--zd-sheet); border: 2px solid var(--zd-rule);
         width: calc(320 * var(--zd-u)); padding: 0 var(--zd-gap); }
.toast .tl { height: var(--zd-row); display: flex; align-items: center; }
.toast .tx { display: block; color: var(--zd-ink-1); font-family: var(--zd-mono);
             font-size: var(--zd-fs-a); line-height: var(--zd-row); white-space: normal;
             padding-bottom: calc(var(--zd-row) / 4); }
.toast .cl { margin-left: auto; cursor: pointer; color: var(--zd-ink-2); display: flex; }

/* ============================================================== lock ==== */
#lock { position: absolute; inset: 0; z-index: 300; background: var(--zd-desk); display: none; }
#lock.on { display: block; }
#lock .page { position: absolute; left: var(--zd-marg); right: var(--zd-marg);
              top: calc(var(--zd-row) * 3); bottom: var(--zd-row); display: flex;
              flex-direction: column; }
#lock .lhead { height: var(--zd-head-h); flex: none; position: relative;
               border-bottom: 2px solid var(--zd-rule); }
#lock .lbody { flex: 1; display: flex; gap: calc(32 * var(--zd-u)); min-height: 0;
               padding-top: var(--zd-row); }
#lock .col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
</style>
</head>
<body>
<div id="strip">
  <span class="nm">Spread</span>
  <span class="pitch" id="pitch"></span>
  <span class="links" id="links"></span>
  <span class="thm" id="thm"></span>
</div>

<div id="os">
  <div id="rail">
    <div class="ident">
      <span class="t-h">zlos</span>
      <span class="t-d i2">0.3 &middot; x86_64</span>
    </div>
    <div class="sect"><span class="t-l">contents</span></div>
    <div id="toc"></div>
    <div class="sect"><span class="t-l">workspace</span></div>
    <div class="wsr" id="wsr"></div>
    <div id="readout"></div>
  </div>

  <div id="type">
    <div id="head"></div>
    <div id="lead"></div>
    <div id="desk">
      <svg id="gridsvg" shape-rendering="crispEdges" aria-hidden="true"></svg>
      <div id="wins"></div>
      <div id="folio"></div>
      <div id="ov"></div>
      <div id="toasts"></div>
    </div>
  </div>

  <div id="modal">
    <div class="veil"></div>
    <div class="box">
      <div class="plate">
        <span class="t-l kn">command</span>
        <span class="t-d kn2">zlsh builtin</span>
        <span class="t-d kn2 sp" id="pcount"></span>
      </div>
      <div class="prow" style="cursor:default">
        <span class="t-l">run</span>
        <span class="t-d" id="pq"></span><span class="caret"></span>
      </div>
      <div id="presults"></div>
      <div class="prow" style="cursor:default;border-bottom:0;border-top:2px solid var(--zd-rule)">
        <span class="t-l">enter</span><span class="t-d i2">run</span>
        <span class="t-l">up down</span><span class="t-d i2">select</span>
        <span class="t-l">esc</span><span class="t-d i2">dismiss</span>
        <span class="t-d i2 sp">28 dp plate, off the baseline on purpose</span>
      </div>
    </div>
  </div>

  <div id="lock">
    <div class="page">
      <div class="lhead"></div>
      <div class="lbody">
        <div class="col" id="lockL"></div>
        <div class="col" id="lockR"></div>
      </div>
    </div>
  </div>

  <div class="menu" id="ctx"></div>
  <div class="menu" id="wmenu"></div>
</div>
<script>
'use strict';
/* ========================================================================== *
 * SPREAD - a living prototype of the zlOS desktop.
 * RAIL (contents) / RUNNING HEAD (one, shared, divided at column boundaries)
 * / LEADER ZONE / DESK (12 columns, 24 dp baseline ruled across everything).
 * Depth: keyline rank, gutter, knockout. No shadow, no blur, no gradient.
 * ========================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const p2 = n => (n < 10 ? '0' : '') + n;
const hx = (n, w) => (n >>> 0).toString(16).toUpperCase().padStart(w || 8, '0');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ------------------------------------------------------ token readback --
 * The Settings sheet prints the stock's own hex values and contrast ratios.
 * Typed literals are a claim; these read the LIVE custom property off :root,
 * so the sheet cannot print a number it is not actually rendering. */
function tokRaw(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function tokResolve(n, d) {
  const v = tokRaw(n), m = /^var\((--[\w-]+)\)$/.exec(v);
  return (m && (d || 0) < 8) ? tokResolve(m[1], (d || 0) + 1) : v;
}
function tokHex(n) { return tokResolve(n).toUpperCase(); }
function tokRGB(n) {
  const h = tokResolve(n).replace('#', '');
  return h.length === 6 ? [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)) : null;
}
function relLum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
function ratio(fg, bg) {
  const a = tokRGB(fg), b = tokRGB(bg);
  if (!a || !b) return '--';
  let l1 = relLum(a), l2 = relLum(b);
  if (l1 < l2) { const t = l1; l1 = l2; l2 = t; }
  return ((l1 + 0.05) / (l2 + 0.05)).toFixed(2);
}

/* ------------------------------------------------------------- state --- */
const S = {
  ws: 1, theme: 'light', scene: 'desktop',
  focus: null, max: null,
  cols: 12, gut: 12, ui: 1, base: 24,
  grid: true, colrule: true, leader: true, cue2: true, pay: true, quant: true, blink: true,
  fileSel: 2, procSel: 0, calcAcc: '241690', setTab: 0,
  pq: '', psel: 0, modal: null,
  t: 0, clock: 14 * 3600 + 32 * 60 + 7,
  cpu: [34, 21, 47, 12], memPct: 62, load: 0.31, rx: 148.2, tx: 22.7,
  hist: { cpu: [], mem: [] },
  audit: { n: 0, off: 0 },
  order: { 1: [], 2: [] },
  wins: {}
};
for (let i = 0; i < 72; i++) {
  S.hist.cpu.push(18 + ((i * 37) % 46));
  S.hist.mem.push(54 + ((i * 17) % 14));
}

/* -------------------------------------------------------------- icons ---
 * Stencils on a 96 field, 8x8 modules of 12, every vertex a multiple of 6,
 * one stroke weight. Four constructions: axis aligned rect, 45 degree
 * diagonal, circle, quarter round. Drawn as geometry, never as an image. */
const ICON = {
  shell: '<path d="M6 12 H90 V84 H6 Z"/><path d="M24 36 L42 54 L24 72"/><path d="M54 72 H78"/>',
  files: '<path d="M6 24 V12 H36 L48 24"/><path d="M6 24 H90 V84 H6 Z"/>',
  mon:   '<circle cx="48" cy="48" r="36"/><path d="M48 48 L72 24"/>',
  edit:  '<path d="M18 6 H78 V90 H18 Z"/><path d="M30 30 H66"/><path d="M30 48 H66"/><path d="M30 66 H54"/>',
  log:   '<path d="M6 18 H90 V78 H6 Z"/><path d="M18 36 H42"/><path d="M18 48 H78"/><path d="M18 60 H60"/>',
  hex:   '<path d="M12 12 H84 V84 H12 Z"/><path d="M48 12 V84"/><path d="M12 48 H84"/>',
  calc:  '<path d="M18 6 H78 V90 H18 Z"/><path d="M30 18 H66 V36 H30 Z"/><path d="M30 54 H42"/><path d="M54 54 H66"/><path d="M30 72 H42"/><path d="M54 72 H66"/>',
  net:   '<path d="M18 78 L48 48 L78 78"/><path d="M6 84 H90"/><circle cx="48" cy="30" r="6"/>',
  clock: '<circle cx="48" cy="48" r="36"/><path d="M48 48 V24"/><path d="M48 48 H66"/>',
  chip:  '<path d="M24 24 H72 V72 H24 Z"/><path d="M36 24 V12"/><path d="M60 24 V12"/><path d="M36 72 V84"/><path d="M60 72 V84"/><path d="M24 36 H12"/><path d="M24 60 H12"/><path d="M72 36 H84"/><path d="M72 60 H84"/>',
  set:   '<path d="M6 30 H90"/><path d="M6 66 H90"/><path d="M30 18 H42 V42 H30 Z"/><path d="M60 54 H72 V78 H60 Z"/>',
  disk:  '<path d="M6 24 H90 V72 H6 Z"/><path d="M6 48 H90"/><circle cx="72" cy="36" r="6"/>',
  proc:  '<path d="M12 18 H84 V36 H12 Z"/><path d="M12 42 H84 V60 H12 Z"/><path d="M12 66 H84 V84 H12 Z"/>',
  regs:  '<path d="M12 12 H84 V84 H12 Z"/><path d="M36 12 V84"/><path d="M60 12 V84"/><path d="M12 36 H84"/>'
};
function icon(n, px) {
  return '<svg width="' + (px || 16) + '" height="' + (px || 16) + '" viewBox="0 0 96 96" ' +
    'fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="butt" ' +
    'stroke-linejoin="miter" aria-hidden="true">' + ICON[n] + '</svg>';
}
const X_MIN = '<svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="7" width="10" height="2" fill="currentColor"/></svg>';
const X_MAX = '<svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
const X_CLS = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>';

/* --------------------------------------------------------- primitives --- */
function TH(cols) {
  return '<tr>' + cols.map(c => '<th class="' + (c.r ? 'r' : '') + '"' +
    (c.w ? ' style="width:' + c.w + '"' : '') + '>' + c.h + '</th>').join('') + '</tr>';
}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => typeof c === 'string'
    ? '<td>' + c + '</td>'

function TBL(head, rows) {

/* a column plot that fills its box. Bars in a 0..100 space stretched by
   preserveAspectRatio, so the plot grows with the sheet instead of clipping. */
function plot(series, max) {
  const n = series.length, bw = 100 / n;
  let bars = '';
  series.forEach((v, i) => {
    const h = Math.max(1, (v / max) * 100);
    bars += '<rect x="' + (i * bw).toFixed(2) + '" y="' + (100 - h).toFixed(2) +
      '" width="' + (bw * 0.7).toFixed(2) + '" height="' + h.toFixed(2) + '"/>';
  });
  const mean = series.reduce((a, b) => a + b, 0) / n;
  return '<div class="plot"><svg width="100%" height="100%" viewBox="0 0 100 100" ' +
    'preserveAspectRatio="none" fill="var(--zd-mark-bulk)" aria-hidden="true">' + bars +
    '</svg><span class="mean" style="top:' + (100 - (mean / max) * 100).toFixed(2) + '%"></span></div>';
}
function hhmmss(s) {
  s = ((s % 86400) + 86400) % 86400;
  return p2(Math.floor(s / 3600)) + ':' + p2(Math.floor(s / 60) % 60) + ':' + p2(s % 60);
}

R.hex = () => {
  /* eight bytes to the line, not sixteen. A dump that ellipsises half of every
     row is not a dump; the sheet's column span sets the stride. */
  const base = 0x0011A4C0, seed = [0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, 0x01, 0x00], rows = [];
  for (let r = 0; r < 24; r++) {
    const bytes = []; let asc = '';
    for (let i = 0; i < 8; i++) {
      const v = r === 0 && i < 8 ? seed[i] : ((r * 37 + i * 11 + 0x21) & 0xff);
      bytes.push(hx(v, 2));
      asc += (v >= 32 && v < 127) ? String.fromCharCode(v) : '.';
    }
    rows.push('<tr' + (r === 0 ? ' class="sel"' : '') + '><td>' + hx(base + r * 8, 8) + '</td><td>' +
      bytes.join(' ') + '</td><td>' + esc(asc) + '</td></tr>');
  }
  return head2('offset', '0x' + hx(base) + ' &middot; width 8') +
    '<div class="scr"><div class="tblbox"><table class="tbl"><thead>' +
    TH([{ h: 'address', w: '30%' }, { h: '00 .. 07', w: '50%' },
        { h: 'ascii', w: '20%' }]) + '</thead><tbody>' + rows.join('') + '</tbody></table></div></div>' +
    '<div class="hr2"></div><div class="r">' + lab('signature') + dat('7F 45 4C 46', 'i0 bd') +
    dat('elf64, little endian', 'i2') + '<span class="sp"></span>' + stw('ok') + '</div>';
};

 * possible because text comes from fixed height baked atlases: integer row

function baselineAudit() {
  const desk = $('#desk');
  if (!desk) return { n: 0, off: 0, worst: 0 };
  const d0 = desk.getBoundingClientRect().top;
  const base = Math.round(S.base * S.ui);
  let n = 0, off = 0, worst = 0;
  $$('.win:not(.hidden):not(.off) .body div.r, .win:not(.hidden):not(.off) .body .kv, ' +
     '.win:not(.hidden):not(.off) .body div.r2, .win:not(.hidden):not(.off) .body .mtr, ' +
     '.win:not(.hidden):not(.off) .body .tbl tr, .win:not(.hidden):not(.off) .foot').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.height < 1) return;
    /* THE SAME BOUNDARY THE COLOUR LAW USES. Inside a 2 px content rect the
       payload governs its own metrics, exactly as it governs its own colour,
       so the shell's baseline gate stops at the frame. Excluding it is the
       law, not a way of passing the test. */
    if (el.closest('.rect')) return;
    /* the overview clones every sheet inside a scale() wrapper. A scaled copy
       is a picture of the layout, not the layout, so it is not evidence. */
    if (el.closest('#ov')) return;
    const y = Math.round(r.top - d0);
    if (y < 0) return;
    n++;
    let m = ((y % base) + base) % base;
    if (m > base / 2) m -= base;
    if (m !== 0) { off++; if (Math.abs(m) > Math.abs(worst)) worst = m; }
  });
  return { n: n, off: off, worst: worst };
}

/* =============================================================== grid ===
 * The type area is cut into ZD_COLS columns by integer division, remainder to
 * the first R columns, exactly as PLATE does horizontally. The vertical axis
 * is not divided at all: every sheet is full desk height, because SPREAD is a
 * COLUMN spread. That is what makes the head's claim true - a column range
 * identifies exactly one sheet, so a head segment can BE a column range. */
let GRID = { W: 0, H: 0, marg: 24, gut: 12, headH: 32, leadH: 24, deskY: 56, deskH: 0,
  sheetH: 0, rows: 0, colW: [], colX: [], cwBase: 0, cwRem: 0 };

function computeGrid() {
  const t = $('#type');
  const W = t.clientWidth, H = t.clientHeight;
  const u = S.ui;
  const base = Math.round(S.base * u);
  const gut = Math.max(4, Math.round(S.gut * u));
  const marg = Math.round(24 * u);
  const headH = Math.round(32 * u);
  const leadH = base;                       /* the leader zone is one baseline */
  const deskY = headH + leadH;
  const availH = H - deskY - marg;
  /* the sheet is a whole number of baselines PLUS its own bottom keyline. The
     top keyline is paid for out of the top padding, so the first baseline is
     at exactly ZD_BASE and the foot rule starts at ZD_BASE * (rows - 1). */
  const rows = Math.max(3, Math.floor((availH - 1) / base));
  const sheetH = base * rows + 1;
  const deskH = H - deskY;
  const NC = S.cols;
  const availW = W - 2 * marg - (NC - 1) * gut;
  const cwBase = Math.floor(availW / NC), cwRem = availW - cwBase * NC;
  const colW = [], colX = [];
  let x = marg;
  for (let i = 0; i < NC; i++) {
    const w = cwBase + (i < cwRem ? 1 : 0);
    colW.push(w); colX.push(x); x += w + gut;
  }
  GRID = { W, H, marg, gut, headH, leadH, deskY, deskH, sheetH, rows, colW, colX, cwBase, cwRem, base };
  const d = $('#desk');
  d.style.top = deskY + 'px';
  d.style.height = deskH + 'px';
}
function spanRect(c, cw) {
  const g = GRID;
  c = Math.max(0, Math.min(S.cols - 1, c));
  cw = Math.max(1, Math.min(S.cols - c, cw));
  let w = 0;
  for (let i = 0; i < cw; i++) w += g.colW[c + i];
  w += g.gut * (cw - 1);
  return { x: g.colX[c], w: w, c: c, cw: cw };
}

/* ============================================================ respread ==
 * CONTINUOUS REFLOW IS MANDATORY, not occasional. PLATE's own post mortem
 * records that its single largest structural failure was having no reflow
 * story at all, with four separate defects turning out to be that one failure
 * wearing different hats. SPREAD takes that area and makes it the load path:
 * the head cannot be drawn until this function has GUARANTEED that every
 * sheet on the spread owns a disjoint column range.
 *
 * The guarantee is structural rather than checked. Sheets on the spread are an
 * ORDERED list; this walks it once, hands out column ranges left to right, and
 * never revisits. Overlap is unrepresentable, which is the price Folio's free
 * drag paid to buy the shared head. */
function onSpread(ws) {
  return (S.order[ws] || []).filter(id => {
    const w = S.wins[id];
    return w && w.ws === ws && !w.min && !w.off;
  });
}
/* divide `span` columns among `ids` by their declared weights, repaired to an
   exact integer sum. No float survives this function. */
function divide(ids, span) {
  const n = ids.length;
  const minC = 1;
  const want = ids.map(id => Math.max(minC, APP[id].cw));
  const total = want.reduce((a, b) => a + b, 0);
  const got = want.map(v => Math.max(minC, Math.round(v * span / total)));
  let sum = got.reduce((a, b) => a + b, 0), guard = 0;
  while (sum !== span && guard++ < 400) {
    const i = sum > span ? got.indexOf(Math.max.apply(null, got))
                         : got.indexOf(Math.min.apply(null, got));
    if (sum > span && got[i] <= minC) break;
    got[i] += sum > span ? -1 : 1;
    sum = got.reduce((a, b) => a + b, 0);
  }
  return got;
}
function respread() {
  [1, 2].forEach(ws => {
    /* AN OFF-SPREAD SHEET KEEPS ITS COLUMN RANGE RESERVED. That is what makes
       the struck segment honest: the range is still spoken for, so nothing on
       the spread may claim it, and the head cannot end up with two segments
       over the same columns. Without this the fallback would be a drawing
       instruction with no layout behind it. */
    const held = new Array(S.cols).fill(false);
    Object.values(S.wins).filter(w => w.ws === ws && w.off).forEach(w => {
      const c = Math.max(0, Math.min(S.cols - 1, w.c));
      const cw = Math.max(1, Math.min(S.cols - c, w.cw));
      w.c = c; w.cw = cw;
      for (let i = c; i < c + cw; i++) held[i] = true;
    });
    if (S.max && S.wins[S.max] && S.wins[S.max].ws === ws && !S.wins[S.max].off) {
      const w = S.wins[S.max];
      w.c = 0; w.cw = S.cols;
      return;
    }
    const list = onSpread(ws);
    if (!list.length) return;
    /* maximal contiguous runs of unreserved columns */
    const runs = [];
    let i = 0;
    while (i < S.cols) {
      if (held[i]) { i++; continue; }
      let j = i;
      while (j < S.cols && !held[j]) j++;
      runs.push({ c: i, len: j - i });
      i = j;
    }
    if (!runs.length) {
      /* every column is reserved. Nothing can be drawn disjointly, so the
         whole spread goes off with it rather than being drawn wrong. */
      list.forEach(id => { S.wins[id].off = true; S.wins[id].offWhy = 'no free columns'; });
      return;
    }
    const free = runs.reduce((a, r) => a + r.len, 0);
    /* hand the sheets out run by run, proportional to run length, at least one
       per run while sheets remain */
    const perRun = runs.map(r => Math.max(0, Math.round(list.length * r.len / free)));
    let sum = perRun.reduce((a, b) => a + b, 0), guard = 0;
    while (sum !== list.length && guard++ < 400) {
      const k = sum > list.length ? perRun.indexOf(Math.max.apply(null, perRun))
                                  : perRun.indexOf(Math.min.apply(null, perRun));
      perRun[k] += sum > list.length ? -1 : 1;
      if (perRun[k] < 0) perRun[k] = 0;
      sum = perRun.reduce((a, b) => a + b, 0);
    }
    let k = 0;
    runs.forEach((r, ri) => {
      let take = Math.min(perRun[ri], r.len, list.length - k);
      if (take <= 0) return;
      const ids = list.slice(k, k + take);
      const widths = divide(ids, r.len);
      let c = r.c;
      ids.forEach((id, m) => { S.wins[id].c = c; S.wins[id].cw = widths[m]; c += widths[m]; });
      k += take;
    });
    /* anything that did not fit into a run cannot own a disjoint range: the
       fallback, applied by the tiler rather than by the renderer. */
    for (; k < list.length; k++) {
      const w = S.wins[list[k]];
      w.off = true; w.offWhy = 'no free columns';
      w.x = GRID.colX ? (GRID.colX[0] || 24) + 24 * k : 24;
      w.y = Math.round(2 * (GRID.base || 24));
      w.ow = Math.round((GRID.W || 800) / 3);
      w.oh = Math.max(6 * (GRID.base || 24), (GRID.sheetH || 400) - 4 * (GRID.base || 24));
    }
  });
}

/* ====================================================== window mgmt ==== */
let ZTOP = 10;
function openWin(id, ws) {
  const a = APP[id];
  if (!a) return;
  if (S.wins[id]) { S.wins[id].min = false; focusWin(id); layout(); return; }
  const w = ws || S.ws;
  S.wins[id] = { id: id, ws: w, c: 0, cw: a.cw, min: false, off: false,
                 offWhy: '', x: 0, y: 0, ow: 0, oh: 0, z: ++ZTOP };
  if (!S.order[w]) S.order[w] = [];
  S.order[w].push(id);
  buildWin(id);
  S.focus = id;
  layout(); renderRail();
}
function closeWin(id) {
  const w = S.wins[id];
  if (!w) return;
  const e = $('.win[data-id="' + id + '"]');
  if (e) e.remove();
  S.order[w.ws] = (S.order[w.ws] || []).filter(x => x !== id);
  delete S.wins[id];
  if (S.max === id) S.max = null;
  if (S.focus === id) S.focus = topOf(S.ws);
  layout(); renderRail();
}
function topOf(ws) {
  const l = Object.values(S.wins).filter(w => w.ws === ws && !w.min).sort((a, b) => b.z - a.z);
  return l.length ? l[0].id : null;
}
function focusWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].z = ++ZTOP;
  S.wins[id].min = false;
  S.focus = id;
  layout(); renderRail();
}
function minWin(id) {
  const w = S.wins[id];
  if (!w) return;
  w.min = true; w.off = false;
  if (S.max === id) S.max = null;
  if (S.focus === id) S.focus = topOf(S.ws);
  layout(); renderRail();
  toast('held', APP[id].name.toUpperCase() + ' left the spread, ' +
    onSpread(S.ws).length + ' segments reflowed');
}
function maxWin(id) {
  if (!S.wins[id]) return;
  S.max = (S.max === id) ? null : id;
  focusWin(id);
  toast(S.max ? 'full spread' : 'restored', S.max
    ? APP[id].name.toUpperCase() + ' owns all ' + S.cols + ' columns, one segment'
    : onSpread(S.ws).length + ' segments back on the spread');
}
/* THE NON-DISJOINT FALLBACK. Defined before a single head segment is drawn.
 * A window that leaves the spread keeps its home column range reserved, so
 * disjointness still holds for everything that stayed, and its segment is
 * struck through with a 1 px rule instead of being deleted. Without that the
 * head would silently lie about what is open. */
function detach(id, why) {
  const w = S.wins[id];
  if (!w) return;
  const r = spanRect(w.c, w.cw);
  w.off = true; w.offWhy = why || 'detached';
  w.x = r.x + Math.round(20 * S.ui);
  w.y = Math.round(2 * GRID.base);
  /* 28 dp plate + 4 px of frame + a whole number of baselines. The plate is
     off the grid on purpose; the body under it is not. */
  w.ow = r.w;
  w.oh = Math.round(28 * S.ui) + 4 + GRID.base * Math.max(6, GRID.rows - 8);
  if (S.max === id) S.max = null;
  layout(); renderRail();
}
function reattach(id) {
  const w = S.wins[id];
  if (!w) return;
  w.off = false; w.offWhy = '';
  layout(); renderRail();
  toast('back on the spread', APP[id].name.toUpperCase() +
    ' rejoined, head reflowed to ' + onSpread(S.ws).length + ' segments');
}

function buildWin(id) {

      '<span class="ctl" data-act="close">' + X_CLS + '</span>' +
    '</div>' +
    '<div class="body"></div>' +
    '<div class="foot">' +
      '<span class="t-l">' + a.n + '</span>' +
      '<span class="t-d i2 fsub">' + a.sub + '</span>' +
      '<span class="vr"></span>' +
      '<span class="t-d i2 fpath">' + a.path + '</span>' +

function redraw(id) {

  if (!e) return;
  $('.body', e).innerHTML = R[id] ? R[id]() : '';
}
function redrawAll() { Object.keys(S.wins).forEach(redraw); }
/* ============================================================= layout === */
function layout() {
  computeGrid();
  respread();
  const g = GRID;
  document.body.classList.toggle('cue2', S.cue2);
  document.body.classList.toggle('nopay', !S.pay);
  document.body.classList.toggle('blinkon', S.blink);
  Object.values(S.wins).forEach(w => {
    const e = $('.win[data-id="' + w.id + '"]');
    if (!e) return;
    const vis = w.ws === S.ws && !w.min && (!S.max || S.max === w.id || w.off);
    e.classList.toggle('hidden', !vis);
    e.classList.toggle('off', w.off);
    e.classList.toggle('foc', w.id === S.focus);
    if (w.off) {
      e.style.left = w.x + 'px'; e.style.top = w.y + 'px';
      e.style.width = w.ow + 'px'; e.style.height = w.oh + 'px';
      e.style.zIndex = String(200 + w.z);
      $('.offwhy', e).textContent = w.offWhy;
      $('.fspan', e).textContent = 'off spread';
    } else {
      const r = spanRect(w.c, w.cw);
      w.c = r.c; w.cw = r.cw;
      e.style.left = r.x + 'px'; e.style.top = '0px';
      e.style.width = r.w + 'px'; e.style.height = g.sheetH + 'px';
      e.style.zIndex = String(w.z);
      $('.fspan', e).textContent = p2(r.c + 1) + '-' + p2(r.c + r.cw) +
        ' ' + r.cw + '/' + S.cols;
    }
  });
  drawGrid();
  renderHead();
  drawLeaders();
  drawSplits();
  renderFolio();
  S.audit = baselineAudit();
}

/* ============================================== the running head ======= */
function renderHead() {
  const g = GRID, h = $('#head');
  const list = onSpread(S.ws);
  const off = Object.values(S.wins).filter(w => w.ws === S.ws && w.off);
  const modalBlocked = S.modal ? S.focus : null;
  let html = '<div class="stock" style="left:' + g.marg + 'px;width:' + (g.W - 2 * g.marg) + 'px"></div>';
  /* the unclaimed columns keep their numerals on the band ground, which is
     the darkest text-bearing surface in the system and the value ZD_INK_2
     was picked against. */
  const claimed = new Array(S.cols).fill(false);
  list.forEach(id => { const w = S.wins[id];
    for (let i = 0; i < w.cw; i++) claimed[w.c + i] = true; });
  off.forEach(w => { for (let i = 0; i < w.cw; i++) claimed[w.c + i] = true; });
  for (let i = 0; i < S.cols; i++) {
    if (claimed[i]) continue;
    html += '<span class="cnum t-d i2" style="left:' + g.colX[i] + 'px;width:' + g.colW[i] + 'px">' +
      p2(i + 1) + '</span>';
  }
  const seg = (w, kind) => {
    const r = spanRect(w.c, w.cw);
    const a = APP[w.id];
    const focused = w.id === S.focus && kind !== 'struck';
    const readout = kind === 'struck'
      ? (w.id === modalBlocked ? 'modal' : w.offWhy || 'off spread')
      : 'col ' + p2(r.c + 1) + ' - ' + p2(r.c + r.cw);
    return '<div class="hseg' + (focused ? ' foc' : '') + (kind === 'struck' ? ' struck' : '') +
      '" data-seg-id="' + w.id + '" style="left:' + r.x + 'px;width:' + r.w + 'px">' +
      '<span class="t-d hn">' + a.n + '</span>' +
      '<span class="t-l ht">' + a.name + '</span>' +
      '<span class="t-d hc">' + readout + '</span>' +
      '<span class="strike"></span></div>';
  };
  list.forEach(id => {
    const w = S.wins[id];
    html += seg(w, (S.modal && id === modalBlocked) ? 'struck' : 'live');
  });
  off.forEach(w => { html += seg(w, 'struck'); });
  html += '<div class="datum"></div>';
  h.innerHTML = html;
}

/* leader rules: 1 px from every head division down to the sheet's top edge.
   The focused segment's pair doubles with its frame, so the tie between the
   black bar at the top of the screen and the sheet 900 px below it is drawn
   twice for the one window that matters. */
function drawLeaders() {
  const g = GRID, host = $('#lead');
  host.setAttribute('width', g.W); host.setAttribute('height', g.leadH);
  host.style.height = g.leadH + 'px';
  if (!S.leader) { host.innerHTML = ''; return; }
  let s = '<svg width="' + g.W + '" height="' + g.leadH + '" shape-rendering="crispEdges" aria-hidden="true">';
  const edges = [];
  onSpread(S.ws).forEach(id => {
    const w = S.wins[id], r = spanRect(w.c, w.cw);
    edges.push([r.x, id]); edges.push([r.x + r.w - 1, id]);
  });
  edges.forEach(e => {
    const foc = e[1] === S.focus;
    s += '<rect x="' + (foc ? e[0] - 0 : e[0]) + '" y="0" width="' + (foc ? 2 : 1) +
      '" height="' + g.leadH + '" fill="var(--' + (foc ? 'zd-rule' : 'zd-hair') + ')"/>';
  });
  s += '</svg>';
  host.innerHTML = s;
}

/* the shared baseline, ruled across the WHOLE type area, so it shows in every
   gutter and both margins. This is the claim made visible: a line in one sheet
   is level with a line in the sheet beside it. */
function drawGrid() {
  const g = GRID, svg = $('#gridsvg');
  svg.setAttribute('width', g.W); svg.setAttribute('height', g.deskH);
  if (!S.grid && !S.colrule) { svg.innerHTML = ''; return; }
  let s = '';
  if (S.grid) {
    for (let y = 0; y <= g.deskH; y += g.base) {
      s += '<rect x="' + g.marg + '" y="' + y + '" width="' + (g.W - 2 * g.marg) +
        '" height="1" fill="var(--zd-hair)"/>';
    }
  }
  if (S.colrule) {
    g.colX.forEach((x, i) => {
      s += '<rect x="' + x + '" y="0" width="1" height="' + g.deskH + '" fill="var(--zd-hair)"/>';
      s += '<rect x="' + (x + g.colW[i] - 1) + '" y="0" width="1" height="' + g.deskH +
        '" fill="var(--zd-hair)"/>';
    });
  }
  svg.innerHTML = s;
}

/* the gutter between two adjacent sheets IS a column boundary AND a head
   division, so one drag moves all three. */
function drawSplits() {
  const g = GRID, host = $('#wins');
  $$('.split', host).forEach(e => e.remove());
  if (S.max) return;
  const list = onSpread(S.ws);
  for (let i = 0; i < list.length - 1; i++) {
    const a = S.wins[list[i]], b = S.wins[list[i + 1]];
    const r = spanRect(a.c, a.cw);
    const e = document.createElement('div');
    e.className = 'split';
    e.style.left = (r.x + r.w) + 'px';
    e.style.top = '0px';
    e.style.width = g.gut + 'px';
    e.style.height = g.sheetH + 'px';
    e.setAttribute('data-split-a', a.id);
    e.setAttribute('data-split-b', b.id);
    e.innerHTML = '<i></i>';
    host.appendChild(e);
  }
}

/* ========================================================== overview ====
 * The overview is where the running head stops being chrome and becomes an
 * index: two spreads side by side, each with its own head, and the head alone
 * tells you what is open and how wide it is. */
function ovOn() { return $('#ov').classList.contains('on'); }
function showOverview(on) {
  const ov = $('#ov');

  const g = GRID;
  let html = '<div class="r2"><span class="t-h">the spread</span>' +
    '<span class="t-d i2 sp">both workspaces, one head each, to scale &middot; esc returns</span></div>' +

    'padding-top:var(--zd-row)">';

    const n = onSpread(ws).length;
    html += '<div class="ovws"><div class="r">' + lab('workspace ' + p2(ws)) +
      dat(n + ' on the spread', 'i2') +
      (ws === S.ws ? '<span class="t-l i0 sp">current</span>' : '<span class="sp"></span>') +
      '</div><div class="ovbox' + (ws === S.ws ? ' cur' : '') + '" data-ovws="' + ws + '"></div></div>';
  });
  html += '</div>';
  const rows = Object.values(S.wins)
    .sort((a, b) => APP[a.id].n.localeCompare(APP[b.id].n)).map(w => {
      const st = w.min ? 'held' : w.off ? 'off spread' : S.max === w.id ? 'full' : 'on spread';
      const span = w.off ? '-' : p2(w.c + 1) + ' - ' + p2(w.c + w.cw);
      return TR([APP[w.id].n, { t: '<span class="t-l i0">' + APP[w.id].name + '</span>' },
        APP[w.id].sub, 'ws ' + p2(w.ws), span, { t: w.cw + '/' + S.cols, c: 'r' },
        { t: '<span class="t-l">' + st + '</span>' },
        { t: S.focus === w.id ? '<span class="t-l i0">focus</span>' : '', c: 'r' }],
        'class="pick" data-ovpick="' + w.id + '" data-ovws="' + w.ws + '"');
    });
  html += '<div class="r2">' + lab('segment register') +
    '<span class="t-d i2 sp">' + Object.keys(S.wins).length + ' open &middot; ' + S.cols +
    ' columns &middot; every range disjoint by construction</span></div>' +
    '<div class="scr">' + TBL([{ h: 'nn', w: '5%' }, { h: 'sheet', w: '16%' },
      { h: 'subtitle', w: '20%' }, { h: 'ws', w: '9%' }, { h: 'columns', w: '13%' },
      { h: 'width', w: '11%', r: 1 }, { h: 'state', w: '15%' }, { h: '', w: '11%', r: 1 }], rows) +
    '</div>';
  ov.innerHTML = html;
  ov.classList.add('on');
  $$('.ovbox', ov).forEach(host => {
    const ws = Number(host.getAttribute('data-ovws'));
    const fullH = g.deskY + g.sheetH + g.marg;
    const k = Math.min(host.clientWidth / g.W, host.clientHeight / fullH);
    host.style.flex = 'none';
    host.style.width = Math.round(g.W * k) + 'px';
    host.style.height = Math.round(fullH * k) + 'px';
    const wrap = document.createElement('div');
    wrap.className = 'ovsc';
    wrap.style.width = g.W + 'px';
    wrap.style.height = fullH + 'px';
    wrap.style.transform = 'scale(' + k + ')';
    /* the head is cloned with the spread. In the overview you read the page by
       its running head, which is the whole argument for having one. */
    const head = document.createElement('div');
    head.style.cssText = 'position:absolute;left:0;top:0;width:' + g.W + 'px;height:' +
      g.headH + 'px';
    let hh = '<div class="stock" style="position:absolute;top:0;bottom:0;left:' + g.marg +
      'px;width:' + (g.W - 2 * g.marg) + 'px;background:var(--zd-band)"></div>';
    onSpread(ws).forEach(id => {
      const w = S.wins[id], r = spanRect(w.c, w.cw);
      const foc = (ws === S.ws && id === S.focus);
      hh += '<div class="hseg' + (foc ? ' foc' : '') + '" style="left:' + r.x + 'px;width:' +
        r.w + 'px;pointer-events:none">' +
        '<span class="t-d hn">' + APP[id].n + '</span>' +
        '<span class="t-l ht">' + APP[id].name + '</span>' +
        '<span class="strike"></span></div>';
    });
    Object.values(S.wins).filter(w => w.ws === ws && w.off).forEach(w => {
      const r = spanRect(w.c, w.cw);
      hh += '<div class="hseg struck" style="left:' + r.x + 'px;width:' + r.w +
        'px;pointer-events:none"><span class="t-d hn">' + APP[w.id].n + '</span>' +
        '<span class="t-l ht">' + APP[w.id].name + '</span><span class="strike"></span></div>';
    });
    hh += '<div class="datum"></div>';
    head.innerHTML = hh;
    wrap.appendChild(head);
    const deck = document.createElement('div');
    deck.style.cssText = 'position:absolute;left:0;top:' + g.deskY + 'px;width:' + g.W +
      'px;height:' + g.deskH + 'px';
    Object.values(S.wins).filter(w => w.ws === ws && !w.min)
      .sort((a, b) => a.z - b.z).forEach(w => {
        const src = $('.win[data-id="' + w.id + '"]');
        if (!src) return;
        const c = src.cloneNode(true);
        c.classList.remove('hidden');
        c.style.pointerEvents = 'none';
        if (ws !== S.ws) {
          const r = w.off ? { x: w.x, w: w.ow } : spanRect(w.c, w.cw);
          c.style.left = (w.off ? w.x : r.x) + 'px';
          c.style.top = (w.off ? w.y : 0) + 'px';
          c.style.width = (w.off ? w.ow : r.w) + 'px';
          c.style.height = (w.off ? w.oh : g.sheetH) + 'px';
          c.classList.toggle('foc', false);
        }
        deck.appendChild(c);
        const hit = document.createElement('div');
        hit.className = 'ovpick';
        hit.style.left = (parseFloat(c.style.left) * k) + 'px';
        hit.style.top = ((g.deskY + parseFloat(c.style.top || 0)) * k) + 'px';
        hit.style.width = (parseFloat(c.style.width) * k) + 'px';
        hit.style.height = (parseFloat(c.style.height) * k) + 'px';
        hit.setAttribute('data-ovpick', w.id);
        hit.setAttribute('data-ovws', String(ws));
        host.appendChild(hit);
      });
    wrap.appendChild(deck);
    host.insertBefore(wrap, host.firstChild);
  });
}

/* ====================================================== command palette ==
 * A MODAL, and therefore the second case of the non-disjoint fallback. While
 * it is open the focused sheet cannot own its column range, so its head
 * segment is struck through and reads "modal". The palette itself carries a
 * local 28 dp plate - deliberately off the baseline, because it is not on the
 * spread and must not pretend to be. */
const CMDS = [];
APPS.forEach(a => CMDS.push({
  n: a.n, name: 'open ' + a.n + ' ' + a.name, hint: 'alt ' + Number(a.n),

    ' took ' + S.wins[a.id].cw + ' columns, head reflowed'); }

CMDS.push(
  { n: '20', name: 'detach focused sheet from the spread', hint: 'ctrl d',
    run: () => { if (S.focus) { detach(S.focus, 'detached');
      toast('off spread', APP[S.focus].name.toUpperCase() +
        ' has a local 28 dp plate, its segment is struck'); } } },
  { n: '21', name: 'return every sheet to the spread', hint: 'ctrl r',
    run: () => { Object.values(S.wins).forEach(w => { w.off = false; });
      layout(); toast('respread', onSpread(S.ws).length + ' segments, every range disjoint'); } },
  { n: '22', name: 'toggle the shared baseline grid', hint: 'ctrl g',
    run: () => { S.grid = !S.grid; layout(); redraw('set');
      toast('baseline', S.grid ? 'ruled across the type area' : 'hidden, still enforced'); } },
  { n: '23', name: 'toggle payload colour inside content rects', hint: 'ctrl p',

  { n: '24', name: 'set columns to 16', hint: 'grid',
    run: () => { S.cols = 16; layout(); redrawAll(); toast('re-ruled', '16 columns, head divided at 16'); } },
  { n: '25', name: 'send focused sheet to workspace 02', hint: 'shift 2',

      S.order[S.wins[id].ws] = S.order[S.wins[id].ws].filter(x => x !== id);
      S.wins[id].ws = 2; (S.order[2] = S.order[2] || []).push(id);

  { n: '26', name: 'run the baseline gate', hint: 'audit',

/* ============================================================ toasts ==== */
const TOAST_MS = 4600, TOAST_MAX = 3;
function toast(title, body) {
  const host = $('#toasts');
  while (host.children.length >= TOAST_MAX) host.removeChild(host.firstChild);
  const e = document.createElement('div');
  e.className = 'toast';
  e.innerHTML = '<div class="tl">' + lab(title) +
    '<span class="cl" data-act="untoast">' + X_CLS + '</span></div>' +
    '<span class="tx">' + body + '</span>';

/* ============================================================== tick ==== */
function walk(v, lo, hi, amp) {
  return Math.max(lo, Math.min(hi, v + (Math.random() - 0.5) * amp));
}
function tick() {
  S.t += 1; S.clock += 1;
  S.cpu = S.cpu.map(v => Math.round(walk(v, 2, 99, 22)));
  S.memPct = Math.round(walk(S.memPct, 40, 92, 3));
  S.load = Math.round(walk(S.load, 0.05, 3.2, 0.22) * 100) / 100;
  S.rx = Math.round(walk(S.rx, 0, 420, 90) * 10) / 10;
  S.tx = Math.round(walk(S.tx, 0, 180, 30) * 10) / 10;
  S.hist.cpu.push(Math.round(S.cpu.reduce((a, b) => a + b, 0) / 4)); S.hist.cpu.shift();
  S.hist.mem.push(S.memPct); S.hist.mem.shift();
  renderRail(); renderFolio();
  ['mon', 'net', 'clock', 'proc'].forEach(id => {
    if (S.wins[id] && !S.wins[id].min && S.wins[id].ws === S.ws) redraw(id);
  });
  if ($('#lock').classList.contains('on')) renderLock();
}

document.addEventListener('mousedown', ev => {

  if (!t.closest('.menu')) hideMenus();

  if ($('#lock').classList.contains('on')) {
    if (t.closest('#lock')) { setScene('desktop'); toast('unlocked', 'every segment back on the spread'); }
    return;
  }
  if (S.modal) {
    const pr = t.closest('.prow');
    if (pr && pr.getAttribute('data-pi') !== null) { S.psel = Number(pr.getAttribute('data-pi')); runPalette(); return; }
    if (!t.closest('.box')) showModal(false);
    return;
  }
  if (ovOn()) {
    const pick = t.closest('[data-ovpick]');
    if (pick) {
      S.ws = Number(pick.getAttribute('data-ovws'));
      showOverview(false); focusWin(pick.getAttribute('data-ovpick'));
      return;
    }
    const box = t.closest('.ovbox');
    if (box) { S.ws = Number(box.getAttribute('data-ovws')); showOverview(false);
      S.focus = topOf(S.ws); layout(); renderRail(); return; }
    if (!t.closest('.r2')) showOverview(false);
    return;
  }

  const toc = t.closest('.toc');
  if (toc) {
    const id = toc.getAttribute('data-app'), w = S.wins[id];
    if (!w) openWin(id);
    else if (w.min || w.ws !== S.ws) { w.ws = S.ws; w.min = false;
      if (!(S.order[S.ws] || []).includes(id)) (S.order[S.ws] = S.order[S.ws] || []).push(id);
      focusWin(id); }
    else if (S.focus === id) minWin(id);
    else focusWin(id);
    return;
  }
  const wsc = t.closest('.wsc');
  if (wsc) {
    if (wsc.getAttribute('data-ov')) { setScene('overview'); return; }
    S.ws = Number(wsc.getAttribute('data-ws'));
    S.focus = topOf(S.ws);
    layout(); renderRail();
    toast('workspace ' + p2(S.ws), onSpread(S.ws).length + ' segments on this spread');
    return;
  }
  const sp = t.closest('.split');
  if (sp) { startSplit(ev, sp); return; }
  const hs = t.closest('.hseg');
  if (hs) {
    const id = hs.getAttribute('data-seg-id');
    if (ev.button === 0) { focusWin(id); startSegDrag(ev, id); }
    return;
  }
  const win = t.closest('.win');
  if (win) {
    const id = win.getAttribute('data-id');
    const an = t.closest('[data-act]');
    const act = an ? an.getAttribute('data-act') : null;
    if (act === 'close') { closeWin(id); return; }
    if (act === 'min') { minWin(id); return; }
    if (act === 'reattach') { reattach(id); return; }
    if (S.focus !== id) focusWin(id);
    handleAction(id, t);

    if (pl && !t.closest('.ctl')) startFree(ev, id, win);
    return;

function calcKey(k) {
  const n = parseInt(S.calcAcc, 10) || 0;
  if (k === 'c') { S.calcAcc = '0'; return; }
  if (k === '=') { S.calcAcc = String(n); return; }
  if (/^[0-9]$/.test(k)) { S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k; return; }
  if (k === '/') { S.calcAcc = String(Math.floor(n / 2)); return; }
  if (k === 'x') { S.calcAcc = String(n * 2); return; }
  if (k === '+') { S.calcAcc = String(n + 1); return; }
  if (k === '-') { S.calcAcc = String(n - 1); return; }

function setSlider(ev) {

  const p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  const steps = { ui: UI_STEPS, cols: COL_STEPS, base: BASE_STEPS, gut: GUT_STEPS }[name];
  const v = steps[Math.round(p * (steps.length - 1))];
  if (name === 'ui') { if (v === S.ui) return; S.ui = v;
    document.documentElement.style.setProperty('--zd-sc', String(v)); }
  else if (name === 'cols') { if (v === S.cols) return; S.cols = v; }
  else if (name === 'base') { if (v === S.base) return; S.base = v;
    document.documentElement.style.setProperty('--zd-base', String(v)); }
  else { if (v === S.gut) return; S.gut = v; }
