<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLATE / zlOS living prototype</title>
<style>
:root {
  /* ============================================================ design.h
     Every colour in this document is one of these tokens. No hex value is
     used as a CSS value anywhere outside this block. ------------------- */
  --zd-paper:        #F2EFE6;
  --zd-desk:         #E4E0D5;
  --zd-well:         #D6D0C0;
  /* ZD_FILL is the zebra tint, and it is the WORST GROUND IN THE SYSTEM:
     it is the only surface that is neither paper nor plate, and the status
     column sets 11px bold text on it (OK, WARN, LISTEN, BOUND, TILED,
     STALE). The dark block used to call it "no text", which was wrong in
     both modes. Every ink that can land on a table row is therefore held
     to 4.5:1 against THIS value, not against ZD_PAPER - checking against
     paper is what let six tokens ship at 3.2-3.7:1. The tint itself was
     also opened one notch (1.72:1 -> 1.45:1 against the sheet) so the
     inks did not have to be darkened far enough to lose their hue. */
  --zd-fill:         #CEC8B8;
  --zd-rule-1:       #5C574C;
  --zd-rule-2:       #14120E;
  --zd-plate-0:      #14120E;
  --zd-plate-1:      #2A2721;
  --zd-text-0:       #14120E;
  --zd-text-1:       #26231D;
  --zd-text-4:       #585349;
  --zd-text-5:       #595344;
  --zd-text-6:       #5E5848;
  --zd-ok:           #1C5F34;
  --zd-warn:         #734B00;
  --zd-bad:          #A31D11;
  --zd-ok-ko:        #5FC07E;
  --zd-warn-ko:      #E5B14A;
  --zd-bad-ko:       #FF8E76;
  --zd-grid-line:    #A69E8A;
  /* the four second inks. ZD_ACCENT is one of these at a time. */
  --zd-ink-verm:     #B7311A;
  --zd-ink-verm-ko:  #D14A2E;
  --zd-ink-ox:       #A31D11;
  --zd-ink-ox-ko:    #FF8E76;
  --zd-ink-press:    #1F6B3A;
  --zd-ink-press-ko: #5FC07E;
  --zd-ink-ochre:    #7D5200;
  --zd-ink-ochre-ko: #E5B14A;
  /* invented for the knockout side of the rail. not in the spec palette. */
  --zd-text-4-ko:    #A69E8A;
  --zd-rule-1-ko:    #46413A;

  /* ---------------------------------------------------- role splits ----
     PLATE on paper conflates four jobs into one value, #14120E: the rail's
     permanent ground, the emphatic knockout, a solid graphic mark, and the
     2px structural rule. On paper that is correct - there is exactly one
     ink. On the negative they separate, so they are named here as roles and
     the light block assigns them the values the sheet already used. Every
     name below exists in BOTH modes; a name in only one mode is a defect.

     INV  - the SHEET inversion. Light: a sheet goes to ink. Dark: a sheet
            goes to clear film. The emphatic transient - focused header,
            selected row, pressed button, on segment, menu hover.
     RINV - the PLATE inversion. Light: a rail row goes to paper (up). Dark:
            a rail row goes to clear (also up). On paper the two inversions
            point in OPPOSITE directions; on film they both point at Dmin,
            because both grounds are already dense.
     KO   - text set on the permanent Dmax plate (rail, lock plate, palette
            head, menu head, terminal ground).
     MARK - a solid graphic that IS the datum: meter fill, slider fill,
            switch knob, status dot, scrollbar thumb.
  */
  --zd-inv-bg:    #14120E;
  --zd-inv-0:     #F2EFE6;
  --zd-inv-1:     #E4E0D5;
  --zd-rule-inv:  #46413A;
  --zd-rinv-bg:   #F2EFE6;
  --zd-rinv-0:    #14120E;
  --zd-rinv-1:    #5C574C;
  --zd-ko-0:      #F2EFE6;
  --zd-ko-1:      #E4E0D5;
  --zd-mark:      #14120E;
  --zd-mark-bulk: #14120E;
  --zd-knob:      #F2EFE6;
  --zd-knob-edge: #14120E;
  --zd-on-accent: #F2EFE6;
  --zd-ok-inv:    #5FC07E;
  --zd-warn-inv:  #E5B14A;
  --zd-bad-inv:   #FF8E76;

  --zd-accent:    var(--zd-ink-verm);
  --zd-accent-ko: var(--zd-ink-verm-ko);

  /* ---------------------------------------------------------- metrics */
  --ui: 1;
  --zd-rail-w:  calc(148px * var(--ui));
  --zd-slug-h:  calc(28px  * var(--ui));
  --zd-title-h: calc(28px  * var(--ui));
  --zd-row-h:   calc(24px  * var(--ui));
  --zd-cell-h:  calc(20px  * var(--ui));
  --zd-pad:     calc(12px  * var(--ui));
  --zd-gap:     calc(8px   * var(--ui));
  --zd-r-0: 0px;
  --zd-r-2: 2px;
  --zd-track-label: calc(2px * var(--ui));
  /* table headers are uppercase AND letterspaced inside fixed-width
     columns, which is what pushed DRIVER/LENGTH past their cells in the
     narrow 5x5 sheet. One notch tighter buys ~2 characters per header
     and is invisible at 11px next to the 2px used everywhere else. */
  --zd-track-th:    calc(1px * var(--ui));
  --zd-track-plate: calc(4px * var(--ui));
  --fs-data:  calc(11px * var(--ui));
  --lh-data:  calc(16px * var(--ui));
  --fs-label: calc(11px * var(--ui));
  --fs-body:  calc(15px * var(--ui));
  --lh-body:  calc(22px * var(--ui));
  --fs-plate: calc(22px * var(--ui));
  --lh-plate: calc(26px * var(--ui));

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ==================================================== design.h, dark ===
   THE PROCESS NEGATIVE.  Paper is gone; what is left of a printed page in
   a trade shop is the film it was shot on. Not "dark grey" - ortho lith
   negative on the stripping table, and every value below is derived from
   what film actually is rather than from inverting the sheet.

   1. FILM BASE IS NOT BLACK. Developed base-plus-fog is a warm amber
      brown. Every surface here keeps R > G > B on the same warm axis the
      paper had, so the direction's hue survives. A neutral grey ground
      would have thrown PLATE away.
   2. DENSITY DOES NOT REACH EITHER END. There is no Dmax of zero and no
      Dmin of clear, because base-plus-fog exists. So nothing in this mode
      is #000000 and nothing is #FFFFFF. The lightest value in the system,
      ZD_INV_BG #F4E9D5, is deliberately BELOW the light mode's paper
      #F2EFE6 in warmth and luminance - it is clear film, not clear glass.
   3. KNOCKOUT IS NOW CLEARING, NOT INKING. On paper the emphatic move is
      an ink plate with the title knocked out. On film the same move is the
      emulsion cleared to Dmin with the title standing in density. Same
      operation, same rank, opposite pole. And because the clear area is
      effectively a scrap of paper, the inks set on it are the LIGHT mode's
      own inks, reused verbatim: ZD_INV_0 #14120E, ZD_OK_INV #1C5F34,
      ZD_WARN_INV #734B00, ZD_BAD_INV #A31D11.
   4. THE RAIL STAYS DMAX. Light mode used ONE value for both the rail's
      permanent ground and the transient knockout. Inverting that literally
      would make the full height rail the brightest object on screen, which
      is the failure this direction is most exposed to. So the two split:
      the rail takes Dmax #0A0906, the knockout takes Dmin #F4E9D5, and the
      knockout stays small and one-at-a-time. Emphasis still ranks in the
      same order it did on paper - knockout, then emphasis ink, then mark,
      then body - because ZD_MARK is held at 9.00:1 while ZD_INV_BG is at
      12.00:1, so the focused header is still the single loudest thing.
   5. RULES DROP ONE RUNG EACH, WEIGHT UNCHANGED. A 2px light rule on a
      dark ground blooms and reads far louder than the same rule in ink.
      Thinning it would delete the two-weight system, which IS the depth
      model, so the weights stay at 2px and 1px and the VALUES come down:
      ZD_RULE_2 16.27 -> 5.50 (where the 1px rule sat on paper), ZD_RULE_1
      6.25 -> 2.40 (where the desk grid sat on paper). ZD_GRID_LINE 2.02 ->
      1.70, so the ruled desk survives as structure without glowing.
   6. THE SECOND INK IS RE-PICKED, NOT LIGHTENED. #B7311A is a paper
      vermilion; on film it falls to 1.9:1 and the saturation screams.
      Same hue family, opened up and desaturated: #E8734F, 4.81:1 on the
      sheet against 5.28:1 for the paper vermilion on paper. The paper value
      was #C4341C at 4.74:1 on the sheet, but it only reached 4.13:1 on the
      DESK, and ZD_ACCENT sets small bold text there (CURRENT, DETACHED), so
      it was deepened to #B7311A: 4.60:1 on the desk, still vermilion and
      still clear of ZD_INK_OX #A31D11.
   7. ONE DIRECTION REVERSES, AND IT IS DERIVED. A WELL on paper is sunken,
      so it is darker. On the stripping table a well is a window cut in the
      masking sheet - you are looking THROUGH to the light box - so it is
      lighter. ZD_DESK still sits behind the sheet (darker, 1.17:1), while
      ZD_WELL and ZD_FILL now sit through it (lighter, 1.34:1 and 1.72:1).
      The magnitudes are the light mode's exactly; only the sign changes on
      the "through" pair. This is the one place the dark ladder is not
      order-isomorphic to the light one, and it is why the whole secondary
      text ramp reproduces the light ratios to two decimals.
   ------------------------------------------------------------------- */
:root[data-theme="dark"] {
  --zd-paper:        #2E2921;  /* THE SHEET. working density.            */
  --zd-desk:         #201C16;  /* THE FIELD. film base behind the sheet. */
  --zd-well:         #433D31;  /* WINDOW CUT IN THE MASK. lighter.       */
  --zd-fill:         #4A4237;  /* HALF TONE TINT. zebra. CARRIES TEXT.   */
  --zd-rule-1:       #6A6256;  /* 1px. 2.40:1 on the sheet.              */
  --zd-rule-2:       #AB9E8D;  /* 2px. 5.50:1 on the sheet.              */
  --zd-plate-0:      #0A0906;  /* DMAX. the rail, the lock plate.        */
  --zd-plate-1:      #16130D;  /* second density. terminal ground.       */
  --zd-text-0:       #E5DBC6;
  --zd-text-1:       #D0C7B5;
  --zd-text-4:       #B8B09F;
  --zd-text-5:       #B8AFA3;
  --zd-text-6:       #B1A89D;
  --zd-ok:           #6AC28D;
  --zd-warn:         #D5AA53;
  --zd-bad:          #EF9B84;
  --zd-ok-ko:        #68C88F;
  --zd-warn-ko:      #DEAF4F;
  --zd-bad-ko:       #F8977F;
  --zd-grid-line:    #474239;  /* 1.70:1 on the field. structure, not a net. */
  --zd-ink-verm:     #E8734F;
  --zd-ink-verm-ko:  #EF8460;
  --zd-ink-ox:       #E4705C;
  --zd-ink-ox-ko:    #EB8270;
  --zd-ink-press:    #4FB673;
  --zd-ink-press-ko: #5FC482;
  --zd-ink-ochre:    #C79A34;
  --zd-ink-ochre-ko: #D6A945;
  --zd-text-4-ko:    #827E70;
  --zd-rule-1-ko:    #554D44;

  --zd-inv-bg:    #F4E9D5;  /* DMIN. the cleared emulsion.               */
  --zd-inv-0:     #14120E;  /* the light ladder's ink, reused on clear.  */
  --zd-inv-1:     #443D31;
  --zd-rule-inv:  #A79F91;  /* a 1px rule ON the cleared plate.          */
  --zd-rinv-bg:   #F4E9D5;
  --zd-rinv-0:    #14120E;
  --zd-rinv-1:    #443D31;
  --zd-ko-0:      #DCD4C2;
  --zd-ko-1:      #A49D90;
  --zd-mark:      #D5CBBC;  /* held BELOW inv-bg so knockout still wins. */
  --zd-mark-bulk: #A7A191;  /* SCREENED. a large tonal area is halftoned,
                               never solid: a plot or a meter fill covers
                               too much ground to sit at the solid value
                               without becoming a lamp. 5.60:1, not 9.00. */
  --zd-knob:      #DAD2C1;
  --zd-knob-edge: #2E2921;
  --zd-on-accent: #1A160F;
  --zd-ok-inv:    #1C5F34;
  --zd-warn-inv:  #734B00;
  --zd-bad-inv:   #A31D11;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--zd-desk); font-family: var(--sans);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--zd-well); border-left: 1px solid var(--zd-rule-1); }
::-webkit-scrollbar-thumb { background: var(--zd-mark); border-radius: var(--zd-r-0); }

/* ============================================================ type ==== */
.t-data { font-family: var(--mono); font-size: var(--fs-data); line-height: var(--lh-data);
          font-weight: 400; color: var(--zd-text-1); font-variant-numeric: tabular-nums; }
.t-label{ font-family: var(--sans); font-size: var(--fs-label); line-height: var(--lh-data);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-track-label);
          margin-right: calc(-1 * var(--zd-track-label)); color: var(--zd-text-5); }
.t-body { font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body);
          font-weight: 400; color: var(--zd-text-1); }
.t-plate{ font-family: var(--sans); font-size: var(--fs-plate); line-height: var(--lh-plate);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-track-plate);
          margin-right: calc(-1 * var(--zd-track-plate)); color: var(--zd-text-0); }
.t-plate-m { font-family: var(--mono); font-size: calc(44px * var(--ui)); line-height: calc(52px * var(--ui));
          font-weight: 700; color: var(--zd-text-0); font-variant-numeric: tabular-nums;
          letter-spacing: var(--zd-track-plate); }
.ink0 { color: var(--zd-text-0); } .ink4 { color: var(--zd-text-4); }
.ink6 { color: var(--zd-text-6); } .ink1 { color: var(--zd-text-1); }
.ko   { color: var(--zd-ko-0); } .ko-d { color: var(--zd-ko-1); }
.ko-4 { color: var(--zd-text-4-ko); }
.w-ok { color: var(--zd-ok); } .w-warn { color: var(--zd-warn); } .w-bad { color: var(--zd-bad); }
.k-ok { color: var(--zd-ok-ko); } .k-warn { color: var(--zd-warn-ko); } .k-bad { color: var(--zd-bad-ko); }
.acc  { color: var(--zd-accent); }
.bold { font-weight: 700; }

/* ==================================================== page furniture == */
#strip {
  position: fixed; left: 0; right: 0; top: 0; height: 28px; z-index: 400;
  background: var(--zd-plate-0); border-bottom: 2px solid var(--zd-accent);
  display: flex; align-items: stretch; padding-left: 12px;
}
#strip .nm { display: flex; align-items: center; color: var(--zd-ko-0); }
#strip .pitch { display: flex; align-items: center; padding: 0 14px;
  color: var(--zd-text-4-ko); font-family: var(--mono); font-size: 11px;
  white-space: nowrap; overflow: hidden; min-width: 0; text-overflow: ellipsis;
  display: block; line-height: 28px; }
#strip .links { margin-left: auto; display: flex; }
#strip a { display: flex; align-items: center; padding: 0 10px; text-decoration: none;
  border-left: 1px solid var(--zd-rule-1-ko); color: var(--zd-text-4-ko);
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; }
#strip a.on { background: var(--zd-rinv-bg); color: var(--zd-rinv-0); }
#strip .thm { display: flex; align-items: stretch; }
#strip .thm .tk { display: flex; align-items: center; padding: 0 10px; cursor: pointer;
  border-left: 1px solid var(--zd-rule-1-ko); color: var(--zd-text-4-ko);
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; }
#strip .thm .tk.on { background: var(--zd-rinv-bg); color: var(--zd-rinv-0); }
#strip .thm .thint { display: flex; align-items: center; padding: 0 10px;
  border-left: 1px solid var(--zd-rule-1-ko); color: var(--zd-text-4-ko);
  font-family: var(--mono); font-size: 11px; }

#os { position: fixed; left: 0; right: 0; top: 28px; bottom: 0;
      background: var(--zd-desk); overflow: hidden; }

/* ============================================================ rail ==== */
#rail { position: absolute; left: 0; top: 0; bottom: 0; width: var(--zd-rail-w);
        background: var(--zd-plate-0); display: flex; flex-direction: column; z-index: 30;
        border-right: 2px solid var(--zd-rule-2); }
.ident { padding: calc(10px * var(--ui)) var(--zd-pad) calc(8px * var(--ui)); }
.ident .t-plate { color: var(--zd-ko-0); display: block; }
.ident .build { color: var(--zd-text-4-ko); display: block; }
.accrule { height: 2px; background: var(--zd-accent-ko); flex: none; }
.sect { padding: calc(8px * var(--ui)) var(--zd-pad) calc(4px * var(--ui));
        color: var(--zd-text-4-ko); display: block; flex: none; }
#reg { overflow-y: auto; overflow-x: hidden; flex: 0 1 auto; }
.reg { position: relative; height: var(--zd-row-h); display: flex; align-items: center;
       padding-left: var(--zd-pad); border-bottom: 1px solid var(--zd-rule-1-ko); cursor: pointer; }
.reg .mk { position: absolute; left: 0; top: 0; bottom: 1px; width: 3px; background: transparent; }
.reg.run  .mk { background: var(--zd-accent-ko); }
.reg.hold .mk { background: var(--zd-accent-ko); top: 35%; bottom: 35%; }
.reg.foc  .mk { background: var(--zd-accent); }
.reg .nn { color: var(--zd-text-4-ko); width: calc(20px * var(--ui)); flex: none; }
.reg .rn { color: var(--zd-ko-0); overflow: hidden; white-space: nowrap; }
.reg.off .rn { color: var(--zd-text-4-ko); }
.reg.foc { background: var(--zd-rinv-bg); }
.reg.foc .nn { color: var(--zd-rinv-1); }
.reg.foc .rn { color: var(--zd-rinv-0); }
.reg:hover:not(.foc) { background: var(--zd-plate-1); }

.wsbar { display: flex; flex: none; border-top: 1px solid var(--zd-rule-1-ko);
         border-bottom: 1px solid var(--zd-rule-1-ko); }
.wsc { flex: 1; height: var(--zd-row-h); display: flex; align-items: center; justify-content: center;
       border-right: 1px solid var(--zd-rule-1-ko); cursor: pointer; }
.wsc:last-child { border-right: 0; }
.wsc .t-label { color: var(--zd-text-4-ko); }
.wsc.on { background: var(--zd-rinv-bg); }
.wsc.on .t-label { color: var(--zd-rinv-0); }
.wscount { display: flex; flex: none; padding: calc(2px * var(--ui)) 0; }
.wscount > span { flex: 1; text-align: center; }
.readout { margin-top: auto; padding-bottom: calc(10px * var(--ui)); flex: none; }
.rd { display: flex; align-items: baseline; padding: 0 var(--zd-pad); }
.rd .k { color: var(--zd-text-4-ko); }
.rd .v { color: var(--zd-ko-0); margin-left: auto; }

/* ============================================================ slug ==== */
#slug { position: absolute; left: var(--zd-rail-w); right: 0; top: 0; height: var(--zd-slug-h);
        background: var(--zd-desk); border-bottom: 2px solid var(--zd-rule-2); z-index: 20;
        display: flex; align-items: center; padding: 0 var(--zd-pad) 0 calc(16px * var(--ui)); }
#slug .line { color: var(--zd-text-4); white-space: nowrap; overflow: hidden; }
#slug .rm { margin-left: auto; padding-left: 12px; display: flex; cursor: pointer; flex: none; }

/* =========================================================== field ==== */
#field { position: absolute; left: var(--zd-rail-w); right: 0; top: var(--zd-slug-h); bottom: 0;
         background: var(--zd-desk); overflow: hidden; }
#gridsvg { position: absolute; left: 0; top: 0; pointer-events: none; }
#legend { position: absolute; left: calc(32px * var(--ui)); bottom: calc(2px * var(--ui));
          color: var(--zd-text-6); pointer-events: none; }
#wins { position: absolute; inset: 0; }

/* ========================================================== window ==== */
.win { position: absolute; background: var(--zd-paper); border: 2px solid var(--zd-rule-2);
       border-radius: var(--zd-r-0); display: flex; flex-direction: column; overflow: hidden;
       transition: left 100ms linear, top 100ms linear, width 100ms linear, height 100ms linear; }
.win.drag { transition: none; }
.win.hidden { display: none; }
.focusbar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--zd-accent); z-index: 4; pointer-events: none; }
.hdr { height: var(--zd-title-h); flex: none; display: flex; align-items: center;
       gap: calc(8px * var(--ui)); padding-left: calc(8px * var(--ui)); background: var(--zd-paper);
       border-bottom: 2px solid var(--zd-rule-2); color: var(--zd-text-4); cursor: default;
       user-select: none; }
.hdr .ttl { color: var(--zd-text-4); flex: none; white-space: nowrap; }
.hdr .sub { color: var(--zd-text-6); flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.hdr .coord { color: var(--zd-text-6); flex: none; margin-left: auto; white-space: nowrap; }
.hdr .ico { color: var(--zd-text-4); flex: none; cursor: pointer;
            width: calc(24px * var(--ui)); height: calc(24px * var(--ui)); }
.ctls { display: flex; height: 100%; flex: none; margin-left: calc(6px * var(--ui)); }
.ctl { width: calc(20px * var(--ui)); display: flex; align-items: center; justify-content: center;
       border-left: 1px solid var(--zd-rule-1); color: inherit; cursor: pointer; }
.ctl:hover { background: var(--zd-paper); color: var(--zd-text-0); }
.ctl.x:hover { background: var(--zd-accent); color: var(--zd-on-accent); }
.win.foc .hdr { background: var(--zd-inv-bg); border-bottom: 0; padding-left: calc(11px * var(--ui)); }
.win.foc .hdr .ttl { color: var(--zd-inv-0); }
.win.foc .hdr .sub { color: var(--zd-inv-1); }
.win.foc .hdr .coord { color: var(--zd-inv-1); }
.win.foc .hdr .ico { color: var(--zd-inv-0); }
.win.foc .ctl { color: var(--zd-inv-0); border-left-color: var(--zd-rule-inv); }
.win.foc .ctl:hover { background: var(--zd-paper); color: var(--zd-text-0); }
.win.foc .ctl.x:hover { background: var(--zd-accent); color: var(--zd-on-accent); }
.body { flex: 1; min-height: 0; padding: var(--zd-pad); display: flex; flex-direction: column;
        overflow: hidden; }
.win.foc .body { padding-left: calc(15px * var(--ui)); }
.dtab { position: absolute; right: 0; bottom: 0; height: calc(16px * var(--ui));

.well { background: var(--zd-well); border: 1px solid var(--zd-rule-1);

.plate { background: var(--zd-plate-1); padding: calc(6px * var(--ui)) calc(8px * var(--ui));
         border-radius: var(--zd-r-0); }

.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }

          border-bottom: 1px solid var(--zd-rule-1); white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis;
          font-family: var(--sans); font-size: var(--fs-label); font-weight: 700;
          text-transform: uppercase; letter-spacing: var(--zd-track-th); color: var(--zd-text-5); }

.tbl th.r, .tbl td.r { text-align: right; }
.zeb .tbl tbody tr:nth-child(even) td { background: var(--zd-fill); }
/* the inversion must beat the zebra tint, or a selected even row is
   ZD_PAPER on ZD_FILL at 1.45:1. same specificity as the zebra rule. */
.zeb .tbl tbody tr.sel td, .tbl tr.sel td { background: var(--zd-inv-bg); color: var(--zd-inv-0); }
.tbl tr.sel td .ink4, .tbl tr.sel td .ink6 { color: var(--zd-inv-1); }
.tbl tr.sel td .w-ok { color: var(--zd-ok-inv); }
.tbl tr.sel td .w-warn { color: var(--zd-warn-inv); }

.tbl tr.pick:hover:not(.sel) td { background: var(--zd-well); }

.btn { height: calc(22px * var(--ui)); padding: 0 calc(10px * var(--ui)); display: inline-flex;
       align-items: center; border: 1px solid var(--zd-rule-1); border-radius: var(--zd-r-0);
       background: var(--zd-paper); cursor: pointer; flex: none; }
.btn .t-label { color: var(--zd-text-1); }

.btn:active, .btn.down { background: var(--zd-inv-bg); border-color: var(--zd-inv-bg); }
.btn:active .t-label, .btn.down .t-label { color: var(--zd-inv-0); }
.btn.prim { background: var(--zd-accent); border-color: var(--zd-accent); }
.btn.prim .t-label { color: var(--zd-on-accent); }
.btn.prim:hover { background: var(--zd-accent); }

.seg { display: flex; background: var(--zd-well); border: 1px solid var(--zd-rule-1);

.seg > span { flex: 1; height: calc(22px * var(--ui)); display: flex; align-items: center;

.seg > span:last-child { border-right: 0; }

.meter { margin-bottom: calc(6px * var(--ui)); flex: none; }

.mrow .t-data { margin-left: auto; color: var(--zd-text-0); font-weight: 700; }
.track { height: calc(10px * var(--ui)); background: var(--zd-well);

.track > i { display: block; height: 100%; background: var(--zd-mark-bulk); border-radius: var(--zd-r-0); }

.ctlrow { min-height: calc(28px * var(--ui)); display: flex; align-items: center; flex: none;
          border-bottom: 1px solid var(--zd-rule-1); }

.sw { width: calc(32px * var(--ui)); height: calc(16px * var(--ui)); background: var(--zd-well);
      border: 1px solid var(--zd-rule-2); border-radius: var(--zd-r-0); position: relative;

.sw > i { position: absolute; left: 1px; top: 1px; width: calc(12px * var(--ui));

.sw.on { background: var(--zd-mark); }

.slider { position: relative; width: calc(180px * var(--ui)); height: calc(16px * var(--ui));
          display: flex; align-items: center; cursor: pointer; flex: none; }
.slider .st { position: absolute; left: 0; right: 0; height: calc(8px * var(--ui));
              background: var(--zd-well); border: 1px solid var(--zd-rule-1); border-radius: var(--zd-r-0); }
.slider .sf { position: absolute; left: 1px; top: calc(50% - (4px * var(--ui)) + 1px);
              height: calc(6px * var(--ui)); background: var(--zd-mark-bulk); border-radius: var(--zd-r-0); }
.slider .sh { position: absolute; top: 0; width: calc(8px * var(--ui)); height: calc(16px * var(--ui));

.slider .tick { position: absolute; top: calc(16px * var(--ui)); width: 1px;
                height: calc(3px * var(--ui)); background: var(--zd-rule-1); }
.swatchrow { display: flex; gap: var(--zd-gap); flex: none; }
.swatch { display: block; width: calc(56px * var(--ui)); height: calc(26px * var(--ui)); cursor: pointer;

.caret { display: inline-block; width: calc(7px * var(--ui)); height: var(--lh-data);

.blinkon .caret { animation: bl 500ms steps(1, end) infinite; }
@keyframes bl { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

.plotbox { position: relative; flex: 1; min-height: calc(40px * var(--ui));

#overview { position: absolute; inset: 0; background: var(--zd-desk); z-index: 60; display: none;
            flex-direction: column; padding: calc(14px * var(--ui)); }

.ovbody { flex: none; height: 54%; display: flex; gap: calc(24px * var(--ui)); min-height: 0;

.ovreg { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding-top: calc(12px * var(--ui)); }
.ovws { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ========================================================= palette ==== */
#palette { position: absolute; inset: 0; z-index: 120; display: none; }
#palette.on { display: block; }
#palette .scrim { position: absolute; inset: 0; }
#palette .sheet { position: absolute; left: 50%; top: calc(56px * var(--ui));
                  transform: translateX(-50%); width: calc(620px * var(--ui));

                        background: var(--zd-accent); }

         gap: calc(8px * var(--ui)); padding: 0 calc(8px * var(--ui)); flex: none; }
.pin { display: flex; align-items: center; gap: calc(6px * var(--ui)); background: var(--zd-well);
       border-bottom: 1px solid var(--zd-rule-1); padding: calc(6px * var(--ui)) calc(10px * var(--ui)); }
.prow { display: flex; align-items: center; height: var(--zd-row-h); padding: 0 calc(10px * var(--ui));
        gap: calc(10px * var(--ui)); border-bottom: 1px solid var(--zd-rule-1); cursor: pointer;

.prow.on .mk { background: var(--zd-accent); }

         padding: calc(5px * var(--ui)) calc(10px * var(--ui)); border-top: 2px solid var(--zd-rule-2); }

/* ============================================================ lock ==== */
#lock { position: absolute; inset: 0; z-index: 300; background: var(--zd-desk); display: none; }
#lock.on { display: block; }
#lock .sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
               width: calc(760px * var(--ui)); background: var(--zd-paper);
               border: 2px solid var(--zd-rule-2); display: flex; padding-left: 3px; }
#lock .fb { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--zd-accent); }
#lock .lplate { width: calc(220px * var(--ui)); background: var(--zd-plate-0); flex: none;
                padding: calc(14px * var(--ui)) calc(14px * var(--ui)) calc(12px * var(--ui));
                display: flex; flex-direction: column; }
#lock .lmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#lock .lhead { height: var(--zd-title-h); background: var(--zd-plate-1); display: flex;
               align-items: center; gap: calc(8px * var(--ui)); padding: 0 calc(12px * var(--ui)); }
#lock .lbody { padding: calc(14px * var(--ui)); display: flex; flex-direction: column; }
#lock .hold { display: flex; align-items: center; gap: calc(8px * var(--ui));
              border-bottom: 1px solid var(--zd-rule-1-ko); height: calc(20px * var(--ui)); }

/* ============================================================ menu ==== */
.menu { position: absolute; z-index: 200; background: var(--zd-paper);
        border: 2px solid var(--zd-rule-2); min-width: calc(190px * var(--ui)); display: none; }
.menu.on { display: block; }
.menu .mh { background: var(--zd-plate-0); padding: 0 calc(8px * var(--ui));
            height: calc(20px * var(--ui)); display: flex; align-items: center; }
.menu .mi { height: var(--zd-row-h); display: flex; align-items: center; gap: calc(10px * var(--ui));
            padding: 0 calc(10px * var(--ui)); border-bottom: 1px solid var(--zd-rule-1); cursor: pointer; }
.menu .mi:last-child { border-bottom: 0; }
.menu .mi:hover { background: var(--zd-inv-bg); }
.menu .mi:hover .t-label { color: var(--zd-inv-0); }
.menu .mi:hover .t-data { color: var(--zd-inv-1); }
.menu .mi .hint { margin-left: auto; color: var(--zd-text-6); }

/* ========================================================== toasts ==== */
#toasts { position: absolute; right: calc(16px * var(--ui)); bottom: calc(16px * var(--ui));
          z-index: 150; display: flex; flex-direction: column; gap: var(--zd-gap);
          align-items: flex-end; }
.toast { background: var(--zd-paper); border: 2px solid var(--zd-rule-2); position: relative;
         width: calc(300px * var(--ui)); padding: calc(6px * var(--ui)) calc(10px * var(--ui))
         calc(7px * var(--ui)) calc(13px * var(--ui)); }
.toast > .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--zd-accent); }

</style>

<body>

<div id="strip">
  <span class="nm t-label">Plate</span>
  <span class="pitch" id="pitch"></span>
  <span class="links" id="links"></span>
  <span class="thm" id="themetog"></span>
</div>

<div id="os">
  <div id="rail">
    <div class="ident">
      <span class="t-plate">zlos</span>
      <span class="t-data build">0.3 &middot; x86_64</span>
    </div>
    <div class="accrule"></div>
    <span class="t-label sect">register</span>
    <div id="reg"></div>
    <span class="t-label sect">workspace</span>
    <div class="wsbar" id="wsbar"></div>
    <div class="wscount" id="wscount"></div>
    <div class="readout">
      <span class="t-label sect">readout</span>
      <div id="readout"></div>
    </div>
  </div>

  <div id="slug">
    <span class="t-data line" id="slugline"></span>
    <span class="rm" id="regmark" title="command palette">
      <svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true">
        <circle cx="6" cy="6" r="3.5" fill="none" stroke="var(--zd-accent)" stroke-width="1"/>
        <path d="M6 0 V12 M0 6 H12" stroke="var(--zd-accent)" stroke-width="1"/>
      </svg>
    </span>
  </div>

  <div id="field">
    <svg id="gridsvg" shape-rendering="crispEdges" aria-hidden="true"></svg>

  </div>

  <div id="palette">
    <div class="scrim"></div>
    <div class="sheet"><span class="fb"></span>
      <div class="phead">
        <span class="t-label ko">command</span>
        <span class="t-data ko-d">zlsh builtin</span>
        <span class="t-data ko-d spread" id="pcount"></span>
      </div>
      <div class="pin">
        <span class="t-label">run</span>
        <span class="t-data" id="pq"></span><span class="caret"></span>
      </div>
      <div id="presults"></div>
      <div class="pfoot">
        <span class="t-label">enter</span><span class="t-data ink6">run</span>
        <span class="t-label">up down</span><span class="t-data ink6">select</span>
        <span class="t-label">esc</span><span class="t-data ink6">dismiss</span>
      </div>
    </div>

    <svg id="locksvg" shape-rendering="crispEdges" aria-hidden="true"
         style="position:absolute;left:0;top:0;pointer-events:none"></svg>

      <span class="fb"></span>
      <div class="lplate" id="lockplate"></div>

        <div class="lhead">
          <span class="t-label ko">session locked</span>
          <span class="t-data ko-d">tty1 &middot; seat0</span>
          <span class="t-data ko-d spread" id="lockup"></span>
        </div>
        <div class="lbody" id="lockbody"></div>

  <div class="menu" id="ctxmenu"></div>
  <div class="menu" id="winmenu"></div>
</div>

<script>
'use strict';
/* ====================================================================== *
 * PLATE - a living prototype of the zlOS desktop.
 * Structure: RAIL (numbered register) / SLUG / FIELD (ruled module grid).
 * Depth model: rules and gutters and inversion. No shadow, no blur, no gradient.
 * ====================================================================== */

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad2 = n => (n < 10 ? '0' : '') + n;
const hx = (n, w) => n.toString(16).toUpperCase().padStart(w || 8, '0');

/* --------------------------------------------------- token readback ----
 * The settings sheet prints the stock's own hex values and contrast ratios.
 * Those used to be typed literals, which is a claim rather than a fact: move
 * a token and the sheet keeps printing the old number. These read the LIVE
 * custom property off :root, so the printed value is by construction the
 * value being rendered. resolve() follows var() aliases (ZD_ACCENT is one).
 */
function tokRaw(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function tokResolve(name, depth) {
  const v = tokRaw(name);
  const m = /^var\((--[\w-]+)\)$/.exec(v);
  if (m && (depth || 0) < 8) return tokResolve(m[1], (depth || 0) + 1);
  return v;
}
function tokHex(name) { return tokResolve(name).toUpperCase(); }
function tokRGB(name) {
  const h = tokResolve(name).replace('#', '');
  if (h.length !== 6) return null;
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
function relLum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
function tokRatio(fg, bg) {
  const a = tokRGB(fg), b = tokRGB(bg);
  if (!a || !b) return '--';
  let l1 = relLum(a), l2 = relLum(b);
  if (l1 < l2) { const t = l1; l1 = l2; l2 = t; }
  return ((l1 + 0.05) / (l2 + 0.05)).toFixed(2);
}

/* ------------------------------------------------------------- state -- */
const S = {
  ws: 1,
  theme: 'light',
  scene: 'desktop',
  focus: null,
  cols: 12,
  rows: 8,
  gut: 8,
  ui: 1,
  grid: true,
  crop: true,
  zebra: true,
  blink: true,
  snap: true,
  accent: 'verm',
  fileSel: 1,
  procSel: 2,
  calcAcc: '241690',
  setTab: 0,
  pq: '',
  psel: 0,
  t: 0,
  clock: 14 * 3600 + 32 * 60 + 7,
  hist: { cpu: [], net: [], mem: [] },
  cpu: [34, 21, 47, 12],
  memPct: 62,
  load: 0.31,
  rx: 148.2,
  tx: 22.7,
  order: [],
  wins: {}
};
for (let i = 0; i < 64; i++) {
  S.hist.cpu.push(18 + ((i * 37) % 46));
  S.hist.net.push(6 + ((i * 53) % 58));
  S.hist.mem.push(56 + ((i * 17) % 12));
}

/* ------------------------------------------------------------- icons -- *
 * Stencils. 96x96 field, 8x8 modules of 12px, every vertex on a multiple
 * of 6. One stroke weight (8 at 96). Four constructions only: the axis
 * aligned rectangle, the 45 degree diagonal, the circle, the quarter round.
 */
const ICON = {
  shell: '<path d="M6 12 H90 V84 H6 Z"/><path d="M24 36 L42 54 L24 72"/><path d="M54 72 H78"/>',
  files: '<path d="M6 24 V12 H36 L48 24"/><path d="M6 24 H90 V84 H6 Z"/>',
  mon:   '<circle cx="48" cy="48" r="36"/><path d="M48 48 L72 24"/>',
  edit:  '<path d="M18 6 H78 V90 H18 Z"/><path d="M30 30 H66"/><path d="M30 48 H66"/><path d="M30 66 H54"/>',
  log:   '<path d="M6 18 H90 V78 H6 Z"/><path d="M18 36 H42"/><path d="M18 48 H78"/><path d="M18 60 H60"/>',

function TH(cols) {
  return '<tr>' + cols.map(c => '<th class="' + (c.r ? 'r' : '') + '"' +
    (c.w ? ' style="width:' + c.w + '"' : '') + '>' + c.h + '</th>').join('') + '</tr>';
}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => {
    if (typeof c === 'string') return '<td>' + c + '</td>';
    return '<td class="' + (c.c || '') + '">' + c.t + '</td>';
  }).join('') + '</tr>';
}
function TBL(head, rows) {
  return '<table class="tbl"><thead>' + TH(head) + '</thead><tbody>' + rows.join('') + '</tbody></table>';
}
function colplot(series, w, h, max, cls) {
  const n = series.length, bw = 3, gp = 1, step = bw + gp;
  const take = Math.min(n, Math.floor((w - 2) / step));
  const s = series.slice(n - take);
  let out = '<svg width="' + w + '" height="' + h + '" shape-rendering="crispEdges" aria-hidden="true">';
  out += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="var(--zd-well)"/>';
  out += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="none" stroke="var(--zd-rule-1)" stroke-width="1"/>';
  let mean = 0;
  s.forEach(v => { mean += v; });
  mean = mean / s.length;
  const my = Math.round(h - 1 - (mean / max) * (h - 2));
  s.forEach((v, i) => {
    const bh = Math.max(1, Math.round((v / max) * (h - 2)));
    out += '<rect x="' + (1 + i * step) + '" y="' + (h - 1 - bh) + '" width="' + bw + '" height="' + bh +
      '" fill="var(--' + (cls || 'zd-mark-bulk') + ')"/>';
  });
  out += '<rect x="1" y="' + my + '" width="' + (w - 2) + '" height="1" fill="var(--zd-accent)"/>';
  out += '</svg>';
  return out;
}
/* a column plot that fills whatever box it is given. bars in a 0..100 space,
   stretched by preserveAspectRatio, so the plot grows with the sheet. */
function plotFlex(series, max, minH) {
  const n = series.length, bw = 100 / n;
  let bars = '';
  series.forEach((v, i) => {
    const h = Math.max(1, (v / max) * 100);
    bars += '<rect x="' + (i * bw).toFixed(2) + '" y="' + (100 - h).toFixed(2) +
      '" width="' + (bw * 0.68).toFixed(2) + '" height="' + h.toFixed(2) + '"/>';
  });
  const mean = series.reduce((a, b) => a + b, 0) / n;
  return '<div class="plotbox"' + (minH ? ' style="min-height:' + minH + 'px"' : '') + '>' +
    '<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" ' +
    'fill="var(--zd-mark-bulk)" aria-hidden="true">' + bars + '</svg>' +
    '<span class="meanline" style="top:' + (100 - (mean / max) * 100).toFixed(2) + '%"></span></div>';
}
function meter(label, val, unit, kind) {
  const k = kind === 'bad' ? 'bad' : kind === 'warn' ? 'warn' : '';
  return '<div class="meter"><div class="mrow"><span class="t-label">' + label + '</span>' +
    '<span class="t-data">' + val + (unit || '') + '</span></div>' +
    '<div class="track"><i class="' + k + '" style="width:' + Math.max(0, Math.min(100, val)) + '%"></i></div></div>';
}
function kv(k, v) {
  return '<div class="kv"><span class="t-label">' + k + '</span><span class="v">' + v + '</span></div>';
}
function statword(w) {
  const c = w === 'OK' ? 'w-ok' : w === 'WARN' ? 'w-warn' : w === 'FAIL' ? 'w-bad' : 'ink4';
  return '<span class="t-label ' + c + '">' + w + '</span>';
}

R.hex = () => {
  const base = 0x0011A4C0;
  const rows = [];
  const seed = [0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, 0x01, 0x00];
  for (let r = 0; r < 18; r++) {
    let bytes = [], asc = '';
    for (let i = 0; i < 16; i++) {
      const v = r === 0 && i < 8 ? seed[i] : ((r * 37 + i * 11 + 0x21) & 0xff);
      bytes.push(hx(v, 2));
      asc += (v >= 32 && v < 127) ? String.fromCharCode(v) : '.';
    }
    const mark = r === 0 ? ' class="sel"' : '';
    rows.push('<tr' + mark + '><td>' + hx(base + r * 16, 8) + '</td><td>' +
      bytes.slice(0, 8).join(' ') + '</td><td>' + bytes.slice(8).join(' ') + '</td><td>' +
      asc.replace(/</g, '&lt;') + '</td></tr>');
  }
  return '<div class="row" style="border-bottom:2px solid var(--zd-rule-2);height:var(--zd-row-h)">' +
    '<span class="t-label">source</span><span class="t-data">/dev/rd0</span>' +
    '<span class="t-label">offset</span><span class="t-data">0x' + hx(base) + '</span>' +
    '<span class="t-data ink6 spread">width 16 &middot; ascii</span></div>' +
    '<div class="scroll">' + '<table class="tbl"><thead>' +
    TH([{ h: 'address', w: '17%' }, { h: '00 .. 07', w: '28%' }, { h: '08 .. 0f', w: '28%' },
        { h: 'ascii', w: '27%' }]) + '</thead><tbody>' + rows.join('') + '</tbody></table></div>' +
    '<div class="hr2"></div><div class="row" style="height:var(--zd-row-h)">' +
    '<span class="t-label">signature</span><span class="t-data ink0">7F 45 4C 46</span>' +
    '<span class="t-data ink6">elf64, little endian</span>' +
    '<span class="spread"></span>' + statword('OK') + '</div>';
};

function hhmmss(s) {
  s = ((s % 86400) + 86400) % 86400;
  return pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
}
R.clock = () => {

  const sec = t % 60, min = Math.floor(t / 60) % 60, hr = Math.floor(t / 3600) % 12;
  const ang = (deg, len) => {
    const a = (deg - 90) * Math.PI / 180;

  const hp = ang(hr * 30 + min * 0.5, 22), mp = ang(min * 6, 33), sp = ang(sec * 6, 36);

function sliderHTML(name, steps, val, fmt) {
  const i = steps.indexOf(val);

  const ticks = steps.map((s, k) => '<span class="tick" style="left:' +
    (steps.length === 1 ? 0 : (k / (steps.length - 1)) * 100) + '%"></span>').join('');
  return '<span class="slider" data-slider="' + name + '">' +
    '<span class="st"></span>' +
    '<span class="sf" style="width:calc(' + (pct * 100) + '% - 2px)"></span>' +
    '<span class="sh" style="left:calc(' + (pct * 100) + '% - ' + (pct * 8) + 'px)"></span>' +
    ticks + '</span>';

/* ============================================================ grid ==== */
let GRID = { W: 0, H: 0, mar: 16, gut: 8, colW: [], colX: [], rowH: [], rowY: [],
  cwBase: 0, cwRem: 0, rhBase: 0, rhRem: 0 };

function computeGrid() {
  const f = $('#field');
  const W = f.clientWidth, H = f.clientHeight;
  const gut = Math.max(2, Math.round(S.gut * S.ui));
  const mar = gut * 2;
  const NC = S.cols, NR = S.rows;
  const availW = W - 2 * mar - (NC - 1) * gut;
  const availH = H - 2 * mar - (NR - 1) * gut;
  const cwBase = Math.floor(availW / NC), cwRem = availW - cwBase * NC;
  const rhBase = Math.floor(availH / NR), rhRem = availH - rhBase * NR;
  const colW = [], colX = [], rowH = [], rowY = [];
  let x = mar;
  for (let i = 0; i < NC; i++) {
    const w = cwBase + (i < cwRem ? 1 : 0);
    colW.push(w); colX.push(x); x += w + gut;
  }
  let y = mar;
  for (let i = 0; i < NR; i++) {
    const h = rhBase + (i < rhRem ? 1 : 0);
    rowH.push(h); rowY.push(y); y += h + gut;
  }
  GRID = { W, H, mar, gut, colW, colX, rowH, rowY, cwBase, cwRem, rhBase, rhRem };
}
function modRect(c, r, cw, rh) {
  const g = GRID;
  c = Math.max(0, Math.min(S.cols - 1, c));
  r = Math.max(0, Math.min(S.rows - 1, r));
  cw = Math.max(1, Math.min(S.cols - c, cw));
  rh = Math.max(1, Math.min(S.rows - r, rh));
  let w = 0, h = 0;
  for (let i = 0; i < cw; i++) w += g.colW[c + i];
  w += g.gut * (cw - 1);
  for (let i = 0; i < rh; i++) h += g.rowH[r + i];
  h += g.gut * (rh - 1);
  return { x: g.colX[c], y: g.rowY[r], w, h, c, r, cw, rh };
}
function drawGrid() {
  const svg = $('#gridsvg'), g = GRID;
  svg.setAttribute('width', g.W); svg.setAttribute('height', g.H);
  if (!S.grid && !S.crop) { svg.innerHTML = ''; $('#legend').textContent = ''; return; }
  let s = '';
  if (S.grid) {
    g.colX.forEach((x, i) => {
      s += '<rect x="' + x + '" y="' + g.mar + '" width="1" height="' + (g.H - 2 * g.mar) + '" fill="var(--zd-grid-line)"/>';
      s += '<rect x="' + (x + g.colW[i] - 1) + '" y="' + g.mar + '" width="1" height="' + (g.H - 2 * g.mar) + '" fill="var(--zd-grid-line)"/>';
    });
    g.rowY.forEach((y, i) => {
      s += '<rect x="' + g.mar + '" y="' + y + '" width="' + (g.W - 2 * g.mar) + '" height="1" fill="var(--zd-grid-line)"/>';
      s += '<rect x="' + g.mar + '" y="' + (y + g.rowH[i] - 1) + '" width="' + (g.W - 2 * g.mar) + '" height="1" fill="var(--zd-grid-line)"/>';
    });
  }
  if (S.crop) {
    /* two 16 px marks per corner, offset 6 px outside the trim, running along it */
    const L = 16, o = 6, m = g.mar, R = g.W - g.mar, B = g.H - g.mar;
    const hz = (x, y) => '<rect x="' + x + '" y="' + y + '" width="' + L + '" height="1" fill="var(--zd-accent)"/>';
    const vt = (x, y) => '<rect x="' + x + '" y="' + y + '" width="1" height="' + L + '" fill="var(--zd-accent)"/>';
    s += hz(m, m - o) + vt(m - o, m);
    s += hz(R - L, m - o) + vt(R + o, m);
    s += hz(m, B + o) + vt(m - o, B - L);
    s += hz(R - L, B + o) + vt(R + o, B - L);
  }
  svg.innerHTML = s;
  const cwTxt = g.cwRem ? (g.cwBase + 1) + '/' + g.cwBase : String(g.cwBase);
  const rhTxt = g.rhRem ? (g.rhBase + 1) + '/' + g.rhBase : String(g.rhBase);
  $('#legend').textContent = 'MODULE ' + S.cols + ' x ' + S.rows + '  ·  ' +
    cwTxt + ' x ' + rhTxt + ' px  ·  GUTTER ' + g.gut;
}

/* ====================================================== window mgmt === */
let ZTOP = 10;
function openWin(id, place, ws) {
  const a = APP[id];
  if (!a) return;
  if (S.wins[id]) { S.wins[id].min = false; focusWin(id); return; }
  const p = place || a.p;
  S.wins[id] = { id: id, ws: ws || S.ws, c: p[0], r: p[1], cw: p[2], rh: p[3],
    det: false, x: 0, y: 0, w: 0, h: 0, min: false, max: false, prev: null, z: ++ZTOP };
  buildWin(id);
  focusWin(id);
  layout();
  renderRail();
}
function closeWin(id) {
  const e = $('.win[data-id="' + id + '"]');
  if (e) e.remove();
  delete S.wins[id];
  if (S.focus === id) {
    const rest = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min)
      .sort((a, b) => b.z - a.z);
    S.focus = rest.length ? rest[0].id : null;
  }
  paintFocus(); renderRail(); redraw('grid');
}
function focusWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].z = ++ZTOP;
  S.wins[id].min = false;
  S.focus = id;
  paintFocus(); renderRail(); layout();
}
function minWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].min = true;
  if (S.focus === id) {
    const rest = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = rest.length ? rest[0].id : null;
  }
  layout(); paintFocus(); renderRail();
}
function maxWin(id) {
  const w = S.wins[id];
  if (!w) return;
  if (w.max) {
    Object.assign(w, w.prev); w.max = false;
  } else {
    w.prev = { c: w.c, r: w.r, cw: w.cw, rh: w.rh, det: w.det, x: w.x, y: w.y, w: w.w, h: w.h };
    w.c = 0; w.r = 0; w.cw = S.cols; w.rh = S.rows; w.det = false; w.max = true;
  }
  focusWin(id); layout(); redraw('grid');
}

function buildWin(id) {
  const a = APP[id];
  const e = document.createElement('div');
  e.className = 'win';
  e.setAttribute('data-id', id);
  e.innerHTML =
    '<span class="focusbar"></span>' +
    '<div class="hdr">' +
      '<span class="ico" data-act="winmenu">' + icon(a.ico) + '</span>' +
      '<span class="t-label ttl">' + a.name + '</span>' +
      '<span class="t-data sub">' + a.sub + '</span>' +
      '<span class="t-data coord"></span>' +
      '<span class="ctls">' +
        '<span class="ctl" data-act="min">' + CTL_MIN + '</span>' +
        '<span class="ctl" data-act="max">' + CTL_MAX + '</span>' +
        '<span class="ctl x" data-act="close">' + CTL_CLS + '</span>' +
      '</span>' +
    '</div>' +
    '<div class="body"></div>';
  $('#wins').appendChild(e);
  redraw(id);
}
function redraw(id) {
  const w = S.wins[id];
  if (!w) return;
  const e = $('.win[data-id="' + id + '"]');
  if (!e) return;
  const b = $('.body', e);
  b.className = 'body' + (S.zebra ? ' zeb' : '');
  b.innerHTML = R[id] ? R[id]() : '';
}
function redrawAll() { Object.keys(S.wins).forEach(redraw); }

function layout() {
  computeGrid();
  drawGrid();
  Object.values(S.wins).forEach(w => {
    const e = $('.win[data-id="' + w.id + '"]');
    if (!e) return;
    const vis = w.ws === S.ws && !w.min;
    e.classList.toggle('hidden', !vis);
    let x, y, ww, hh, coord;
    if (w.det) {
      x = w.x; y = w.y; ww = w.w; hh = w.h;
      coord = '[' + Math.round(x) + ',' + Math.round(y) + ' px]';
    } else {
      const r = modRect(w.c, w.r, w.cw, w.rh);
      x = r.x; y = r.y; ww = r.w; hh = r.h;
      w.c = r.c; w.r = r.r; w.cw = r.cw; w.rh = r.rh;
      coord = '[' + (r.c + 1) + ',' + (r.r + 1) + ' ' + r.cw + 'x' + r.rh + ']';
    }
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.width = ww + 'px'; e.style.height = hh + 'px';
    e.style.zIndex = String(w.z);
    $('.coord', e).textContent = coord;
    let tab = $('.dtab', e);
    if (w.det && !tab) {
      tab = document.createElement('span');
      tab.className = 'dtab';
      tab.innerHTML = '<span class="t-label">detached</span>';
      e.appendChild(tab);
    } else if (!w.det && tab) tab.remove();
  });
  paintFocus();
}
function paintFocus() {
  $$('.win').forEach(e => e.classList.toggle('foc', e.getAttribute('data-id') === S.focus));
}

    TBL([{ h: 'nn', w: '6%' }, { h: 'sheet', w: '20%' }, { h: 'subtitle', w: '18%' },
      { h: 'workspace', w: '12%' }, { h: 'module', w: '18%' }, { h: 'state', w: '16%' },
      { h: '', w: '10%', r: 1 }], rows) + '</div>' +
    '<div class="hr2" style="margin-top:auto"></div>' +
    '<div class="row" style="height:var(--zd-row-h)">' +
    '<span class="t-label">proof sheet</span>' +
    '<span class="t-data ink4">2 workspaces</span><span class="vr1" style="height:12px"></span>' +
    '<span class="t-data ink4">plate scale <span data-kscale>1.00</span></span>' +
    '<span class="vr1" style="height:12px"></span>' +
    '<span class="t-data ink4">every sheet is the real sheet, drawn once and scaled</span>' +
    '<span class="spread"></span>' + statword('OK') +
    '<span class="t-data ink6">click a plate, a sheet or a row to return to it</span></div></div>';
  ov.innerHTML = html;
  ov.classList.add('on');
  $$('.ovfield', ov).forEach(host => {
    const ws = Number(host.getAttribute('data-ovws'));
    const k = Math.min(host.clientWidth / g.W, host.clientHeight / g.H);
    /* the plate keeps the field's aspect ratio, so a scaled sheet lands where it really is */
    host.style.flex = 'none';
    host.style.width = Math.round(g.W * k) + 'px';
    host.style.height = Math.round(g.H * k) + 'px';
    const ks = $('[data-kscale]', ov);
    if (ks) ks.textContent = k.toFixed(2);
    const wrap = document.createElement('div');
    wrap.className = 'ovscale';
    wrap.style.width = g.W + 'px';
    wrap.style.height = g.H + 'px';
    wrap.style.transform = 'scale(' + k + ')';
    Object.values(S.wins).filter(w => w.ws === ws).sort((a, b) => a.z - b.z).forEach(w => {
      const src = $('.win[data-id="' + w.id + '"]');
      if (!src) return;
      const c = src.cloneNode(true);
      c.classList.remove('hidden');
      c.style.pointerEvents = 'none';
      if (w.min) c.style.opacity = '0.55';
      wrap.appendChild(c);
      const hit = document.createElement('div');
      hit.className = 'ovpick';
      hit.style.left = (parseFloat(src.style.left) * k) + 'px';
      hit.style.top = (parseFloat(src.style.top) * k) + 'px';
      hit.style.width = (parseFloat(src.style.width) * k) + 'px';
      hit.style.height = (parseFloat(src.style.height) * k) + 'px';
      hit.setAttribute('data-ovpick', w.id);
      hit.setAttribute('data-ovws', String(ws));
      host.appendChild(hit);
    });
    host.insertBefore(wrap, host.firstChild);
  });
}

const TOAST_MS = 4200, TOAST_MAX = 3;

/* ============================================================ tick ==== */
function walk(v, lo, hi, amp) {
  const n = v + (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, n));
}
function tick() {
  S.t += 1; S.clock += 1;
  S.cpu = S.cpu.map(v => Math.round(walk(v, 2, 99, 22)));
  S.memPct = Math.round(walk(S.memPct, 40, 92, 3));
  S.load = Math.round(walk(S.load, 0.05, 3.2, 0.22) * 100) / 100;
  S.rx = Math.round(walk(S.rx, 0, 420, 90) * 10) / 10;
  S.tx = Math.round(walk(S.tx, 0, 180, 30) * 10) / 10;
  S.hist.cpu.push(Math.round(S.cpu.reduce((a, b) => a + b, 0) / 4));
  S.hist.cpu.shift();
  S.hist.net.push(Math.min(80, Math.round(S.rx / 5)));
  S.hist.net.shift();
  renderSlug();
  renderRail();
  ['mon', 'net', 'clock', 'proc'].forEach(id => { if (S.wins[id] && !S.wins[id].min) redraw(id); });
  if ($('#lock').classList.contains('on')) renderLock();
}

/* ========================================================== events ==== */
document.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (!t.closest('.menu')) hideMenus();

  /* lock screen swallows everything under it */
  if ($('#lock').classList.contains('on')) {
    if (t.closest('#lock')) { setScene('desktop'); toast('session', 'unlocked, 3 sheets restored'); }
    return;
  }
  /* palette */
  if ($('#palette').classList.contains('on')) {
    const pr = t.closest('.prow');
    if (pr && pr.getAttribute('data-pi') !== null) {
      S.psel = Number(pr.getAttribute('data-pi'));
      runPalette();
      return;
    }
    if (!t.closest('.sheet')) showPalette(false);
    return;
  }
  /* overview */
  if (overviewOn()) {
    const pick = t.closest('[data-ovpick]');
    if (pick) {
      S.ws = Number(pick.getAttribute('data-ovws'));
      showOverview(false);
      focusWin(pick.getAttribute('data-ovpick'));
      layout(); renderRail();
      return;
    }
    const fld = t.closest('.ovfield');
    if (fld) { S.ws = Number(fld.getAttribute('data-ovws')); showOverview(false); layout(); renderRail(); return; }
    if (!t.closest('.ovhead')) { showOverview(false); }
    return;
  }

  /* rail */
  const reg = t.closest('.reg');
  if (reg) {
    const id = reg.getAttribute('data-app');
    const w = S.wins[id];
    if (!w) openWin(id);
    else if (w.min || w.ws !== S.ws) { w.ws = S.ws; w.min = false; focusWin(id); layout(); }
    else if (S.focus === id) minWin(id);
    else focusWin(id);
    return;
  }
  const wsc = t.closest('.wsc');
  if (wsc) {
    if (wsc.getAttribute('data-ov')) { setScene('overview'); return; }
    S.ws = Number(wsc.getAttribute('data-ws'));
    const top = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout(); renderRail(); renderSlug();
    toast('workspace', 'switched to ' + pad2(S.ws) + ', ' + top.length + ' sheets visible');
    return;
  }
  if (t.closest('#regmark')) { showPalette(true); return; }

  /* window chrome */
  const win = t.closest('.win');
  if (win) {
    const id = win.getAttribute('data-id');
    const act = t.closest('[data-act]') ? t.closest('[data-act]').getAttribute('data-act') : null;
    if (act === 'close') { closeWin(id); return; }
    if (act === 'min') { minWin(id); return; }
    if (act === 'max') { maxWin(id); return; }
    if (act === 'winmenu') {
      focusWin(id);
      const r = win.getBoundingClientRect(), os = $('#os').getBoundingClientRect();
      showMenu($('#winmenu'), r.left - os.left, r.top - os.top + r.height * 0 + 30, [
        ['raise to front', 'click'],
        ['minimise', 'ctrl m'],
        [S.wins[id].max ? 'restore' : 'maximise', 'ctrl f'],
        [S.wins[id].det ? 'return to module' : 'detach from module', 'ctrl d'],
        ['send to workspace ' + (S.ws === 1 ? '02' : '01'), 'shift ' + (S.ws === 1 ? '2' : '1')],
        ['close sheet', 'ctrl w']
      ], APP[id].name);
      $('#winmenu')._win = id;
      return;
    }
    if (S.focus !== id) focusWin(id);
    handleWinAction(id, t);
    const hdr = t.closest('.hdr');
    if (hdr && !t.closest('.ctls') && !t.closest('.ico')) startDrag(ev, id, win);
    return;
  }

  /* desk */
  if (t.closest('#field') || t.closest('#slug')) {
    if (ev.button === 0) { /* click on desk clears nothing, print keeps its state */ }
  }
});

function handleWinAction(id, t) {
  const node = t.closest('[data-act], [data-toggle], [data-accent], [data-seg], [data-slider]');
  if (!node) return;
  if (node.hasAttribute('data-toggle')) {
    const k = node.getAttribute('data-toggle');
    S[k] = !S[k];
    if (k === 'grid' || k === 'crop') drawGrid();
    if (k === 'zebra') redrawAll();
    if (k === 'blink') document.body.classList.toggle('blinkon', S.blink);
    redraw('set');
    toast(k, S[k] ? 'on' : 'off');
    return;
  }
  if (node.hasAttribute('data-accent')) {
    S.accent = node.getAttribute('data-accent');
    applyAccent(); redraw('set');
    const a = ACCENTS.find(x => x[0] === S.accent);
    toast('second ink', a[1] + ' now carries all four accent places');
    return;
  }
  const segp = t.closest('[data-seg]');
  if (segp && t.closest('[data-arg]')) {
    const av = Number(t.closest('[data-arg]').getAttribute('data-arg'));
    if (segp.getAttribute('data-seg') === 'stock') { setStock(av ? 'dark' : 'light', true); return; }
    S.setTab = av;
    redraw('set');
    return;
  }
  const act = node.getAttribute('data-act');
  const arg = node.getAttribute('data-arg');
  if (act === 'file') {
    S.fileSel = Number(arg);
    redraw('files'); redraw('edit');
    return;
  }
  if (act === 'proc') { S.procSel = Number(arg); redraw('mon'); return; }
  if (act === 'open') { openWin(arg); return; }
  if (act === 'ov') { setScene('overview'); return; }
  if (act === 'calc') { calcKey(arg); redraw('calc'); return; }
  if (act === 'toast') {
    const M = {
      build: ['make', 'zlos.elf relinked, text 218432 data 30720 bss 1441792'],
      ink: ['design.h', 'ZD_ACCENT rewritten, 4 call sites re-inked'],
      revert: ['design.h', 'reverted to the measured value'],
      proof: ['printed', 'proof sheet queued, 2 workspaces, 1 page'],
      stat: ['stat', '1 extent, contiguous, generation 3, crc verified'],
      reap: ['reaped', 'pid 42 regdump removed from the table'],
      renice: ['renice', 'pid 61 soak moved to nice 10'],
      retile: ['retiled', 'every sheet snapped back to the module grid']
    }[arg] || ['ok', arg];
    if (arg === 'retile') tileAll();
    toast(M[0], M[1]);
    return;
  }
}
function calcKey(k) {
  if (k === 'clr') { S.calcAcc = '0'; return; }
  if (k === 'eq') { S.calcAcc = String(parseInt(S.calcAcc, 10) || 0); return; }
  if (/^[0-9]$/.test(k)) { S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k; return; }
  if (k === 'div') { S.calcAcc = String(Math.floor((parseInt(S.calcAcc, 10) || 0) / 2)); return; }
  if (k === 'mul') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) * 2); return; }
  if (k === 'add') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) + 1); return; }
  if (k === 'sub') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) - 1); return; }
  if (k === 'hex' || k === 'dec' || k === 'bin') { toast('base', k + ' shown in the ledger below'); return; }
}
function tileAll() {
  const list = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min);
  const n = list.length;
  if (!n) return;
  const perRow = n <= 2 ? n : Math.ceil(n / 2);
  const rowsN = n <= 2 ? 1 : 2;
  list.forEach((w, i) => {
    const rr = Math.floor(i / perRow), cc = i % perRow;
    const cwid = Math.floor(S.cols / perRow), rhh = Math.floor(S.rows / rowsN);
    w.det = false; w.max = false;
    w.c = cc * cwid; w.r = rr * rhh; w.cw = cwid; w.rh = rhh;
  });
  layout(); redraw('grid');
  toast('tiled', n + ' sheets onto the ' + S.cols + ' x ' + S.rows + ' module grid');
}

document.addEventListener('mousemove', ev => { if (SL) setSlider(ev); });

function setSlider(ev) {
  const name = SL.getAttribute('data-slider');
  const r = SL.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  const steps = name === 'ui' ? UI_STEPS : name === 'cols' ? COL_STEPS : GUT_STEPS;
  const v = steps[Math.round(p * (steps.length - 1))];
  if (name === 'ui') { if (v === S.ui) return; S.ui = v; applyUI(); }
  else if (name === 'cols') { if (v === S.cols) return; S.cols = v; }
  else { if (v === S.gut) return; S.gut = v; }
  layout(); redraw('set'); redraw('grid'); renderSlug();
}

/* ------------------------------------------------------------- drag -- */
function startDrag(ev, id, el) {
  const w = S.wins[id];
  if (w.max) return;
  const r = el.getBoundingClientRect(), f = $('#field').getBoundingClientRect();
  const ox = ev.clientX - r.left, oy = ev.clientY - r.top;
  const wid = r.width, hgt = r.height;
  el.classList.add('drag');
  function move(e) {
    w.det = true;
    w.x = Math.round(e.clientX - f.left - ox);
    w.y = Math.round(e.clientY - f.top - oy);
    w.w = wid; w.h = hgt;
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    el.classList.remove('drag');
    if (S.snap && w.det) {
      let bc = 0, br = 0, bd = 1e9;
      GRID.colX.forEach((x, i) => { const d = Math.abs(x - w.x); if (d < bd) { bd = d; bc = i; } });
      bd = 1e9;
      GRID.rowY.forEach((y, i) => { const d = Math.abs(y - w.y); if (d < bd) { bd = d; br = i; } });
      w.det = false; w.c = bc; w.r = br;
      layout();
      toast('snapped', APP[id].name.toUpperCase() + ' to module ' + (bc + 1) + ',' + (br + 1));
    }
    redraw('grid');
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

/* -------------------------------------------------------- keyboard --- */
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if ($('#lock').classList.contains('on')) {
    if (k === 'Enter' || k === 'Escape') { setScene('desktop'); toast('session', 'unlocked, sheets restored'); ev.preventDefault(); }
    return;
  }
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); ev.preventDefault(); return; }
    if (k === 'Enter') { runPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(S.psel + 1, Math.min(7, paletteResults().length - 1)); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    if (k.length === 1 && !ev.ctrlKey && !ev.metaKey) { S.pq += k; S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    return;
  }
  if (ev.ctrlKey && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if (ev.ctrlKey && k === ' ') { setScene(overviewOn() ? 'desktop' : 'overview'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'l' || k === 'L')) { setScene('lock'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'g' || k === 'G')) { S.grid = !S.grid; drawGrid(); redraw('set'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'i' || k === 'I')) { setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 't' || k === 'T')) { tileAll(); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'w' || k === 'W')) { if (S.focus) closeWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'f' || k === 'F')) { if (S.focus) maxWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'm' || k === 'M')) { if (S.focus) minWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === '1' || k === '2')) {
    S.ws = Number(k);
    const top = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout(); renderRail(); renderSlug(); ev.preventDefault(); return;
  }
  if (ev.altKey && /^[0-9]$/.test(k)) {
    const idx = k === '0' ? 9 : Number(k) - 1;
    if (APPS[idx]) openWin(APPS[idx].id);
    ev.preventDefault(); return;
  }
  if (k === 'Escape') {
    if (overviewOn()) setScene('desktop');
    hideMenus();
  }
});

/* =========================================================== stock ====
 * THE STOCK. Two primitive ladders, one set of role names. Light is the
 * default and the direction's home; dark is the same grammar shot onto
 * ortho lith film. Setting data-theme is the ONLY switch - no rule weight,
 * no metric, no radius and no motion value differs between the two.
 */
const STOCK = {
  light: { name: 'paper', other: 'negative',
    pitch: 'a printed technical document. warm paper, black ink, hard rules, ' +
           'one vermilion overprint.',
    slug: 'STOCK PAPER',
    toast: ['paper', 'warm stock, ink plate rail, knockout sets the title in paper'] },
  dark:  { name: 'negative', other: 'paper',
    pitch: 'the same document on the film it was shot on. ortho lith, amber ' +
           'base, Dmax rail, knockout clears.',
    slug: 'STOCK NEG',
    toast: ['negative', 'ortho lith, Dmax rail #0A0906, knockout clears to Dmin #F4E9D5'] }
};
function applyTheme() {
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = STOCK[S.theme].pitch;
  renderThemeTog();
}
function renderThemeTog() {
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-stock="light">paper</span>' +
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-stock="dark">negative</span>' +
    '<span class="thint">ctrl i</span>';
}
/* the hash is authoritative for BOTH scene and stock: #files is light,
 * #files-dark is dark, on load and on every hashchange. */
function hashName() { return S.scene + (S.theme === 'dark' ? '-dark' : ''); }
function setStock(t, announce) {
  const next = t === 'dark' ? 'dark' : 'light';
  if (next === S.theme && announce) return;
  S.theme = next;
  applyTheme();
  renderLinks();
  renderSlug();
  redraw('set');
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    toast(STOCK[S.theme].toast[0], STOCK[S.theme].toast[1]);
  }
}
function renderLinks() {
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#links').innerHTML = SCENE_NAMES.map(n =>
    '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  markLinks(S.scene);
}

/* ========================================================== scenes ==== */
const SCENE_NAMES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.win[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZTOP = 10;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#toasts').innerHTML = '';
}
function place(id, c, r, cw, rh, ws) {
  openWin(id, [c, r, cw, rh], ws || S.ws);
}
function baseDesktop() {
  clearAll();
  S.ws = 1; S.cols = 12; S.gut = 8;
  place('shell', 0, 0, 7, 4);
  place('files', 7, 0, 5, 4);
  place('mon', 0, 4, 7, 4);
  place('net', 7, 4, 5, 4);
  place('log', 0, 0, 7, 4, 2);
  place('regs', 7, 0, 5, 5, 2);
  place('hex', 0, 4, 12, 4, 2);
  /* one detached sheet, front most, to show the explicit overlap state */
  openWin('sys', [3, 2, 6, 5]);
  const w = S.wins.sys;
  const r = modRect(3, 2, 6, 5);
  w.det = true; w.x = r.x + 18; w.y = r.y - 34; w.w = r.w; w.h = r.h;
  focusWin('sys');
  layout();
}
function setScene(name, push) {
  let dark = false;
  if (/-dark$/.test(name)) { dark = true; name = name.slice(0, -5); }
  if (SCENE_NAMES.indexOf(name) < 0) { name = 'desktop'; dark = false; }
  S.scene = name;
  S.theme = dark ? 'dark' : 'light';
  applyTheme();
  renderLinks();
  if (push !== false && location.hash.slice(1) !== hashName()) {
    history.replaceState(null, '', '#' + hashName());
  }
  markLinks(name);
  if (name === 'desktop') {
    baseDesktop();
    toast('tiled', '5 sheets on workspace 01, module ' + S.cols + ' x ' + S.rows +
      ', one detached and marked');
  } else if (name === 'overview') {
    baseDesktop();
    layout();
    showOverview(true);
  } else if (name === 'palette') {
    baseDesktop();
    S.pq = 'mon'; S.psel = 0;
    showPalette(true);
  } else if (name === 'files') {
    clearAll();
    S.ws = 1;
    place('files', 0, 0, 5, 8);
    place('edit', 5, 0, 7, 8);
    S.fileSel = 1;
    redraw('files'); redraw('edit');
    focusWin('files');
    layout();
    toast('selected', 'fb.c 68.4 KiB, opened in 04 EDITOR');
  } else if (name === 'monitor') {
    clearAll();
    S.ws = 1;
    place('mon', 0, 0, 7, 8);
    place('net', 7, 0, 5, 8);
    focusWin('mon');
    layout();
    toast('sampling', 'monitor and network at 1 Hz, 64 s history');
  } else if (name === 'settings') {
    clearAll();
    S.ws = 1;
    place('sys', 7, 0, 5, 5);
    place('clock', 7, 5, 5, 3);
    place('set', 0, 0, 7, 8);
    S.setTab = 0;
    redraw('set');
    focusWin('set');
    layout();
  } else if (name === 'lock') {
    baseDesktop();
    showLock(true);
  }
  renderRail(); renderSlug();
}
function markLinks(name) {
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-dark$/, '') === name));
}
$('#themetog').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-stock]');
  if (t) { ev.preventDefault(); setStock(t.getAttribute('data-stock'), true); }
});
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
window.addEventListener('resize', () => { layout(); if (overviewOn()) showOverview(true); if ($('#lock').classList.contains('on')) renderLock(); });

/* =========================================================== start ==== */
document.body.classList.add('blinkon');
applyTheme(); applyAccent(); applyUI();
computeGrid();
setScene(location.hash.slice(1) || 'desktop', false);
setInterval(tick, 1000);
</script>
</body>
