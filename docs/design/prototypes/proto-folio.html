<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio - zlOS desktop prototype</title>
<style>
/* ============================================================================
   FOLIO. Every colour below is a design.h token name, lowercased.
   Zero hex appears as a CSS value anywhere outside this :root block.
   ============================================================================ */
:root{
  /* ---- PAPER LADDER ---- */
  --zd-paper-0:   #E9E4DB;
  --zd-paper-0b:  #E2DCD1;
  --zd-paper-1:   #F4F1EA;
  --zd-paper-2:   #FBFAF6;
  --zd-paper-3:   #DED8CB;
  /* ---- INK LADDER ---- */
  --zd-ink-0:     #17150F;
  --zd-ink-1:     #2E2A22;
  --zd-ink-2:     #4A4438;
  --zd-ink-3:     #5E5648;
  --zd-ink-mute:  #8E8674;
  /* ---- KEYLINE RANKS ---- */
  --zd-rule-hair: #C2BAA8;
  --zd-rule-mid:  #A29A87;
  --zd-rule-ctrl: #8A8270;
  /* ---- THE THREE STATE INKS. No accent exists beyond these. ---- */
  --zd-red:       #A3301B;
  --zd-green:     #2E6A38;
  --zd-ochre:     #7E5305;

  /* ATTENTION INK. The single chromatic ink in the system; the Settings
     "attention ink" control repoints this token and nothing else. */
  --zd-attn:      var(--zd-red);

  /* derived alphas, declared here so no rule anywhere carries a literal */
  --zd-hair-45:   rgba(194,186,168,0.45);   /* RULE_HAIR 45% = the drawn grid */
  --zd-band-60:   rgba(222,216,203,0.60);   /* PAPER_3 60% = drag target columns */
  --zd-scrim-24:  rgba(23,21,15,0.24);      /* INK_0 24% = modal scrim, flat */
  --zd-lift:      rgba(23,21,15,0.22);      /* INK_0 22% = the one shadow */

  /* ---- TWO ROLES THAT USED TO BE LITERALS AT THE CALL SITE. ----
     ui_theme_init_q8() maps role names onto a primitive ladder; a role that is
     spelled INK_0 in one mode and INK_1 in the other cannot be a literal in CSS
     either. Both names exist in both modes; only the values move.

     RULE2  is the 2 dp INK_0 DIVIDER (masthead, sheet head). It is decoration
            weight, and light-on-dark blooms, so dark halves it.
     FRAME  is the rank-3 KEYLINE (Index sheet, modal box). Dark keeps 2 px
            because the scrim loses most of its power on a dark ground and the
            frame has to carry what the scrim can no longer say.
     KN_*   is THE KNOCKOUT: the one inverted element in the system. On paper the
            loudest value and the largest area were the same token (INK_0). On a
            dark ground that makes a near-white slab the brightest thing on
            screen, so the plate steps down one rung to INK_1 and INK_0 is
            reserved for marks 3 dp and thinner. */
  --zd-rule2:     2px;
  --zd-frame:     2px;
  --zd-kn-bg:     var(--zd-ink-0);
  --zd-kn-fg:     var(--zd-paper-1);

  /* Z_FURNITURE. Whether the colophon and the folio are inside the scrim.
     On paper they are, and they must be: a 24% veil darkens the ground AND the
     mark together, 5.31:1 becomes 4.14:1, and the line stays a line. Lifting
     them out on paper is strictly worse - the mark keeps its value while the
     ground behind it loses 17 dL*, measured 3.21:1. So paper leaves them under.
     Ink cannot do that. See the dark block. */
  --zd-z-furniture: 0;

  /* FURNITURE INK, and the third option the paragraph above did not take.
     Leaving the marks under the veil at INK_3 measured 4.13:1 - below 4.5, on the
     colophon AND on the inactive workspace numerals, which the folio rule twelve
     lines down calls information and refuses to fade. Lifting them out is worse
     (3.32:1). So paper keeps them under the veil, where the physical story is
     right, and steps the INK one rung while the veil is up: INK_2 veiled measures
     5.28:1 on the veiled ground. Ink needs no such step - it lifts them clear at
     z 860 - so both names resolve to the same rung there. */
  --zd-furn:        var(--zd-ink-3);
  --zd-furn-veiled: var(--zd-ink-2);

  /* the OTHER mode's ladder, for the side-by-side specimen. Declared here so the
     "zero hex outside :root" rule survives a two-palette specimen. */
  --zd-alt-paper-0: #16130D; --zd-alt-paper-0b:#100D09;
  --zd-alt-paper-1: #221F17; --zd-alt-paper-2: #312C22;
  --zd-alt-paper-3: #3A3429;
  --zd-alt-ink-0:   #F3EFE7; --zd-alt-ink-1:   #DDD5C6;
  --zd-alt-ink-2:   #BDB4A3; --zd-alt-ink-3:   #A99F8D;
  --zd-alt-ink-mute:#726A5A;
  --zd-alt-rule-hair:#514937; --zd-alt-rule-mid:#70654D; --zd-alt-rule-ctrl:#877C64;
  --zd-alt-red:     #DE8D7C; --zd-alt-green:   #7BB584; --zd-alt-ochre:   #D1A654;
  --zd-alt-kn-bg:   #DDD5C6; --zd-alt-kn-fg:   #16130D;

  /* ---- SCALE. --zd-sc is driven by the Settings UI-scale slider. ---- */
  --zd-sc: 1;
  --zd-u: calc(1px * var(--zd-sc));

  /* ---- TYPE. ratio 1.5, three sizes, two weights, four registers ---- */
  --zd-sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --zd-mono: ui-monospace, 'DejaVu Sans Mono', monospace;
  --zd-r1:   calc(8  * var(--zd-u));
  --zd-r2:   calc(12 * var(--zd-u));
  --zd-r3:   calc(12 * var(--zd-u));
  --zd-r4:   calc(16 * var(--zd-u));
  --zd-trk:  calc(0.64 * var(--zd-u));

  /* ---- RADIUS. Three values, chosen by what the element IS. ---- */
  --zd-r-page:  0px;
  --zd-r-set:   calc(2 * var(--zd-u));
  --zd-r-round: 999px;

  /* ---- SPACE ---- */
  --zd-rail-w: calc(160 * var(--zd-u));
  --zd-margin: calc(24 * var(--zd-u));
  --zd-pad:    calc(20 * var(--zd-u));
  --zd-gap:    calc(8  * var(--zd-u));
  --zd-row-h:  calc(28 * var(--zd-u));
  --zd-head-h: calc(32 * var(--zd-u));

  /* ---- MOTION. five tokens. ---- */
  --zd-ms-fade: 120ms;
  --zd-ms-pop:   80ms;
  --zd-ms-press:100ms;
  --zd-ms-snap: 140ms;
  --zd-ms-grid: 100ms;
  --zd-ease-win: cubic-bezier(0.25,0.10,0.25,1);
}

/* ============================================================================
   THE SECOND LADDER. Same role names, second set of primitives - exactly the
   shape ui_theme_init_q8() will have. Nothing below is a new name.

   DERIVATION, one sentence per decision:

   THE GROUND. Folio's ground is not "a light colour", it is PAPER; its opposite
     in this system's own vocabulary is not black, it is INK - so the dark ground
     is the ink ladder's own warm brown-black at hue 40, the identical hue axis
     the paper carries, and the dark ink ladder is the paper ladder's hues used
     as marks. Nothing here is an inversion of a hex; every rung was placed by
     target L* and then checked.
   THE HUE AXIS SURVIVES. Every achromatic token in both modes sits at hue
     38-44 with 12-33% HSL saturation. A neutral grey dark mode would have made
     this a different design; the ground is #16130D, not #101010.
   THE PAPER LADDER STILL ASCENDS. A sheet laid on the desk catches more light
     than the desk, and a well cut in the sheet shows cleaner stock, so
     PAPER_0 < PAPER_1 < PAPER_2 in BOTH modes. Only the absolute range moves.
   THE BAND FLIPS SIDES, and it is the only rung that does. On paper a band is
     more ink laid down, so PAPER_3 sat below the sheet; on an ink ground more
     ink says nothing, so the band is the one lateral step that changes sign.
   RULES GET DIMMER, NOT WIDER. Optical weight is not symmetric, so every rule
     was placed by matching its dL* against the sheet to the light mode's, not
     its ratio: RULE_HAIR is 19.8 dL* off the sheet here against 19.5 there.
   THE 2 dp DIVIDER HALVES. See --zd-rule2 above.
   THE KNOCKOUT STEPS DOWN A RUNG. See --zd-kn-bg above.
   THE SCRIM CHANGES SIGN. A scrim means "this page recedes", which physically
     means less light; INK_0 at 24% would ADD light here, so the dark scrim is
     near-black at 82%. It can only buy 8.7 dL* of recession against the light
     mode's 18.9 - the frame makes up the rest. This is a real compromise.
   THE ONE SHADOW MOSTLY STOPS WORKING, and that is left honest rather than
     replaced by a glow: a dark lift over a dark ground is nothing. It still
     registers where a dragged sheet crosses ANOTHER SHEET, which is the case
     that carries information, and the drag band is stronger here to cover the
     rest.
   ============================================================================ */
:root[data-theme="dark"]{
  /* ---- PAPER LADDER. Four rungs, same order, wider steps. ---- */
  --zd-paper-0:   #16130D;   /* ground / desk        L* 6.0  */
  --zd-paper-0b:  #100D09;   /* gradient bottom stop L* 3.8  */
  --zd-paper-1:   #221F17;   /* the sheet            L* 11.8 */
  --zd-paper-2:   #312C22;   /* the well + mount lip L* 18.2 */
  --zd-paper-3:   #3A3429;   /* the band             L* 22.0 */
  /* ---- INK LADDER ---- */
  --zd-ink-0:     #F3EFE7;   /* 14.35:1 on the sheet. Capped below paper-white:
                                a pure white body of marks blooms.            */
  --zd-ink-1:     #DDD5C6;   /* 11.29:1 body ink                              */
  --zd-ink-2:     #BDB4A3;   /*  8.01:1 secondary                             */
  --zd-ink-3:     #A99F8D;   /*  6.29:1 on the sheet, 4.72:1 on the BAND -
                                the band is the lightest text-bearing surface
                                here, exactly as PAPER_3 was the darkest there. */
  --zd-ink-mute:  #726A5A;   /*  3.07:1 NON-TEXT ONLY, same restriction        */
  /* ---- KEYLINE RANKS. dL*-matched to light, not ratio-matched. ---- */
  --zd-rule-hair: #514937;   /* 1.85:1 on the sheet (light 1.71) */
  --zd-rule-mid:  #70654D;   /* 2.87:1 (light 2.48)              */
  --zd-rule-ctrl: #877C64;   /* 3.99:1 / 3.37:1 on PAPER_1/PAPER_2, clears 1.4.11 */
  /* ---- THE THREE STATE INKS. Same hue family, re-picked luminance + sat. ---- */
  --zd-red:       #DE8D7C;   /* hue 10.4 (was 9.3), sat 60% (was 72%), 6.43:1 */
  --zd-green:     #7BB584;   /* hue 129 (was 130),  sat 28% (was 40%), 6.88:1 */
  --zd-ochre:     #D1A654;   /* hue 39  (was 39),   sat 58% (was 92%), 7.28:1 */
  --zd-attn:      var(--zd-red);

  /* derived alphas, each solved for perceptual parity against the light mode */
  --zd-hair-45:   rgba(81,73,55,0.26);   /* drawn grid: 6.9 dL* off ground vs light's 6.8 */
  --zd-band-60:   rgba(58,52,41,0.40);   /* drag target: 6.4 dL* vs light's 2.5 - it is
                                            stronger on purpose, because it is the only
                                            pre-drop cue left once the lift stops reading */
  --zd-scrim-24:  rgba(8,7,5,0.82);      /* recession, not veiling */
  --zd-lift:      rgba(5,4,3,0.62);      /* reads sheet-on-sheet, not over bare ground */

  /* THE FURNITURE COMES OUT OF THE SCRIM, and this is the one place the two
     stocks differ in STRUCTURE rather than value. Physically: on paper a shadow
     falls across desk and printed line together and the line survives, because
     both terms scale. On ink the veil is the lamp going down, and a light mark
     fading toward a black ground has nothing left - the colophon measured
     1.27:1 in Overview and the inactive workspace numerals, which are a
     CONTROL, went with it. No alpha fixes that: matching light's ratio loss
     needs 0.30, which buys 1.5 dL* of recession and stops being a scrim.
     So on ink the desk's own marks are lifted out of the veil (860 = above the
     modal at 850, below the lock page at 880, which draws its own), and the
     scrim keeps its full 14.6 dL* on the SHEET, where it is doing the work. */
  --zd-z-furniture: 860;
  /* nothing veils them here, so the veiled name is the same rung as the plain one */
  --zd-furn:        var(--zd-ink-3);
  --zd-furn-veiled: var(--zd-ink-3);

  --zd-rule2:     1px;                   /* the divider halves */
  --zd-frame:     2px;                   /* the rank-3 keyline does not */
  --zd-kn-bg:     var(--zd-ink-1);       /* knockout plate steps down one rung */
  --zd-kn-fg:     var(--zd-paper-0);     /* 12.72:1 (light knockout was 16.18:1) */

  --zd-alt-paper-0: #E9E4DB; --zd-alt-paper-0b:#E2DCD1;
  --zd-alt-paper-1: #F4F1EA; --zd-alt-paper-2: #FBFAF6;
  --zd-alt-paper-3: #DED8CB;
  --zd-alt-ink-0:   #17150F; --zd-alt-ink-1:   #2E2A22;
  --zd-alt-ink-2:   #4A4438; --zd-alt-ink-3:   #5E5648;
  --zd-alt-ink-mute:#8E8674;
  --zd-alt-rule-hair:#C2BAA8; --zd-alt-rule-mid:#A29A87; --zd-alt-rule-ctrl:#8A8270;
  --zd-alt-red:     #A3301B; --zd-alt-green:   #2E6A38; --zd-alt-ochre:   #7E5305;
  --zd-alt-kn-bg:   #17150F; --zd-alt-kn-fg:   #F4F1EA;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--zd-sans);
  font-size:var(--zd-r2);
  color:var(--zd-ink-1);
  background:var(--zd-paper-0);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
::selection{background:var(--zd-paper-3);color:var(--zd-ink-0)}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
svg{display:block}

/* ---------- shared registers ---------- */
.r1{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3);white-space:nowrap}
.r2{font-size:var(--zd-r2);color:var(--zd-ink-1)}
.r3{font-size:var(--zd-r3);font-weight:700;color:var(--zd-ink-0)}
.r4{font-size:var(--zd-r4);font-weight:700;color:var(--zd-ink-0);line-height:1.25}
.mn{font-family:var(--zd-mono);font-variant-numeric:tabular-nums}
.hair{height:1px;background:var(--zd-rule-hair);flex:none}
.rule2{height:var(--zd-rule2);background:var(--zd-ink-0);flex:none}
.gr{color:var(--zd-green)} .oc{color:var(--zd-ochre)} .rd{color:var(--zd-attn)}
.dim{color:var(--zd-ink-3)} .sec{color:var(--zd-ink-2)}

/* ============================ THE STRIP ============================
   Harness furniture only: the direction's name and the scene links.   */
#strip{
  position:fixed;left:0;top:0;right:0;height:calc(28 * var(--zd-u));
  background:var(--zd-paper-1);
  border-bottom:1px solid var(--zd-rule-hair);
  display:flex;align-items:center;gap:calc(16 * var(--zd-u));
  padding:0 calc(20 * var(--zd-u));
  z-index:900;
}
#strip .name{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:calc(2 * var(--zd-u));font-weight:700;color:var(--zd-ink-0)}
#strip nav{display:flex;gap:calc(14 * var(--zd-u));margin-left:auto}
#strip a{
  font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);
  color:var(--zd-ink-3);text-decoration:none;padding-bottom:2px;
  border-bottom:2px solid transparent;
}
#strip a.on{color:var(--zd-ink-0);font-weight:700;border-bottom-color:var(--zd-ink-0)}
/* The mode switch is named in the direction's own vocabulary, not "light/dark",
   and it is set in R1 like every other label in the strip. */
#stock{display:flex;gap:calc(10 * var(--zd-u));margin-left:auto;align-items:center}
#stock .lb{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3)}
#stock .sw{display:flex;border:1px solid var(--zd-rule-ctrl);border-radius:var(--zd-r-page)}
#stock .sw span{
  height:calc(16 * var(--zd-u));display:flex;align-items:center;padding:0 calc(8 * var(--zd-u));
  font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);
  color:var(--zd-ink-2);border-left:1px solid var(--zd-rule-ctrl);cursor:default;
}
#stock .sw span:first-child{border-left:0}
#stock .sw span.on{background:var(--zd-kn-bg);color:var(--zd-kn-fg);font-weight:700}
#strip nav{margin-left:calc(20 * var(--zd-u))}

/* ============================ THE DESK ============================ */
#desk{
  position:fixed;left:0;top:calc(28 * var(--zd-u));right:0;bottom:0;
  overflow:hidden;
}

/* ---------------- THE TYPE AREA ---------------- */
#ta{
  position:absolute;left:var(--zd-rail-w);top:0;right:0;bottom:0;
  background:linear-gradient(180deg,var(--zd-paper-0) 0%,var(--zd-paper-0b) 100%);
  overflow:hidden;
}
#grid{position:absolute;inset:0;pointer-events:none}
#grid .gv{position:absolute;top:0;bottom:0;width:1px;background:var(--zd-hair-45)}
#grid .gh{position:absolute;height:1px;background:var(--zd-hair-45)}
#drop{position:absolute;inset:0;pointer-events:none}
#drop .band{
  position:absolute;background:var(--zd-band-60);
  opacity:0;transition:opacity var(--zd-ms-grid) linear;
}
#drop.live .band{opacity:1}
/* The colophon and the folio are the DESK's own marks, like the strip (z 900)
   and the rail. Whether an overlay veils them is a stock decision, not a layout
   one: see --zd-z-furniture in both :root blocks. */
#colophon{
  position:absolute;left:var(--zd-margin);bottom:calc(10 * var(--zd-u));
  font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);
  color:var(--zd-furn);
  z-index:var(--zd-z-furniture);
}
#folio{
  position:absolute;right:var(--zd-margin);bottom:calc(6 * var(--zd-u));
  z-index:var(--zd-z-furniture);
  display:flex;gap:calc(10 * var(--zd-u));align-items:baseline;
  font-family:var(--zd-mono);font-size:var(--zd-r4);font-weight:700;
}
/* ZD_INK_MUTE is 2.65:1 on the ground and is banned for text that carries
   information. An inactive workspace numeral IS information, so the inactive/active
   split is carried by WEIGHT on one ink (INK_3 5.31:1, INK_0 14.41:1), not by fade. */
#folio b{color:var(--zd-furn);font-weight:400;cursor:default}
#folio b.on{color:var(--zd-ink-0);font-weight:700}
/* THE VEIL IS A STATE, so the ink that answers it is selected on that state.
   Only the marks that stay UNDER the scrim take the step; on ink the two names
   are the same rung, so this rule is a no-op there rather than a second design. */
#ta:has(> #ov.show) #colophon,
#ta:has(> #modal.show) #colophon{color:var(--zd-furn-veiled)}
#ta:has(> #ov.show) #folio b,
#ta:has(> #modal.show) #folio b{color:var(--zd-furn-veiled)}
#ta:has(> #ov.show) #folio b.on,
#ta:has(> #modal.show) #folio b.on{color:var(--zd-ink-0)}

/* ---------------- THE RAIL ---------------- */
#rail{
  position:absolute;left:0;top:0;bottom:0;width:var(--zd-rail-w);
  background:var(--zd-paper-1);
  border-right:1px solid var(--zd-rule-hair);
  border-radius:var(--zd-r-page);
  z-index:400;display:flex;flex-direction:column;overflow:hidden;
}
.rc{padding:0 var(--zd-pad)}                 /* the 20dp text column */
#rail .mast{padding:var(--zd-margin) var(--zd-pad) 0}
#rail .mast .word{font-size:var(--zd-r4);font-weight:700;color:var(--zd-ink-0);line-height:calc(20 * var(--zd-u))}
#rail .mast .ver{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3);margin-top:calc(2 * var(--zd-u))}
#rail .mast .rule2{margin-top:var(--zd-gap)}
.sect{margin-top:calc(24 * var(--zd-u));flex:none}
.sect.first{margin-top:calc(28 * var(--zd-u))}
.sect .hd{padding:0 var(--zd-pad);margin-bottom:calc(4 * var(--zd-u))}
.sect .hair{margin:0 var(--zd-pad)}
.list{margin-top:calc(4 * var(--zd-u));overflow:hidden}
.trow{
  position:relative;height:var(--zd-row-h);display:flex;align-items:center;
  padding-left:var(--zd-pad);padding-right:calc(2 * var(--zd-u));
  border-radius:var(--zd-r-page);cursor:default;
}
.trow:hover{background:var(--zd-paper-3)}
.trow .num{
  width:calc(20 * var(--zd-u));text-align:right;flex:none;
  font-family:var(--zd-mono);font-size:var(--zd-r1);color:var(--zd-ink-3);
}
.trow .ttl{
  margin-left:var(--zd-gap);font-size:var(--zd-r2);color:var(--zd-ink-2);
  white-space:nowrap;overflow:hidden;
}
.trow.on .ttl{font-weight:700;color:var(--zd-ink-0)}
.trow.on .num{color:var(--zd-ink-0)}
.trow.min .ttl{color:var(--zd-ink-3)}
.mark{position:absolute;left:0;top:0;width:calc(3 * var(--zd-u));height:100%;background:var(--zd-ink-0)}
.lrow{
  position:relative;height:var(--zd-row-h);display:flex;align-items:center;
  padding-left:calc(48 * var(--zd-u));font-size:var(--zd-r2);color:var(--zd-ink-2);cursor:default;
}
.lrow:hover{background:var(--zd-paper-3)}
.lrow.idx{color:var(--zd-ink-2);letter-spacing:var(--zd-trk)}
.spacer{flex:1 1 auto;min-height:calc(12 * var(--zd-u))}
#marg{flex:none;padding-bottom:var(--zd-pad)}
#marg .hair{margin:0 var(--zd-pad) calc(10 * var(--zd-u))}
.mline{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--zd-pad);height:calc(16 * var(--zd-u))}
.mline .k{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3)}
.mline .v{font-family:var(--zd-mono);font-size:var(--zd-r2);color:var(--zd-ink-1);font-variant-numeric:tabular-nums}

/* ============================ A WINDOW IS A SHEET ============================ */
.win{
  position:absolute;border-radius:var(--zd-r-page);
  border:1px solid var(--zd-rule-hair);          /* THE MOUNT, outer */
  background:var(--zd-paper-1);
}
/* ZD_MS_FADE applies to a sheet that is being PUT ON the page by the user.
   A sheet already on the page when you arrive is simply there. */
.win.fresh{animation:zfade var(--zd-ms-fade) linear}
#ov.fresh .sheet{animation:zfade var(--zd-ms-fade) linear}
.toast.fresh{animation:zfade var(--zd-ms-fade) linear}
@keyframes zfade{from{opacity:0}to{opacity:1}}
.win.snapping{transition:left var(--zd-ms-snap) var(--zd-ease-win),top var(--zd-ms-snap) var(--zd-ease-win),width var(--zd-ms-snap) var(--zd-ease-win),height var(--zd-ms-snap) var(--zd-ease-win)}
.win.drag{box-shadow:0 calc(4 * var(--zd-u)) calc(10 * var(--zd-u)) var(--zd-lift)}
.win-in{
  height:100%;border:1px solid var(--zd-paper-2);  /* THE MOUNT, inner */
  background:var(--zd-paper-1);
  display:flex;flex-direction:column;overflow:hidden;
}
.head{height:var(--zd-head-h);flex:none;display:flex;align-items:center;padding:0 var(--zd-pad);cursor:default}
.head .t{font-size:var(--zd-r2);font-weight:400;color:var(--zd-ink-3);white-space:nowrap}
/* The window subtitle names the OPEN OBJECT - /kernel, fb.c, tty0, eth0. That is
   information, and INK_MUTE is banned for information by the rule three lines
   below its own declaration: it measured 3.20:1 on paper and 3.07:1 on ink, and
   the ink figure is the worse of the two. It is INK_3, the caption ink, in both
   stocks - 6.42:1 paper, 6.29:1 ink - and INK_MUTE is now non-text everywhere,
   which is what the token comment always claimed. */
.head .s{margin-left:calc(12 * var(--zd-u));font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3);white-space:nowrap;overflow:hidden}
.win.on .head .t{font-weight:700;color:var(--zd-ink-0)}
.win.on .head .s{color:var(--zd-ink-3)}
.head .unsaved{margin-left:var(--zd-gap);width:calc(3 * var(--zd-u));height:calc(3 * var(--zd-u));background:var(--zd-attn);flex:none}
.ctrls{margin-left:auto;display:flex;align-items:center;gap:var(--zd-gap);padding-left:calc(12 * var(--zd-u))}
.ctrl{width:calc(20 * var(--zd-u));height:calc(20 * var(--zd-u));display:flex;align-items:center;justify-content:center;border-radius:var(--zd-r-page)}
.ctrl svg *{stroke:var(--zd-ink-1);stroke-width:1;fill:none}
.ctrl:hover{background:var(--zd-paper-3)}
.ctrl.x:hover svg *{stroke:var(--zd-attn)}
/* FOCUS IS A RULE. */
.frule{height:1px;background:var(--zd-rule-hair);flex:none}
.win.on .frule{height:2px;background:var(--zd-ink-0)}
.body{flex:1 1 auto;overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0}
.pad{padding:var(--zd-pad)}

/* toolbars and status bars are lines of type, not filled bars */
.tool{height:var(--zd-row-h);flex:none;display:flex;align-items:center;gap:calc(12 * var(--zd-u));padding:0 var(--zd-pad)}
.tool .k{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3)}
.tool .v{font-family:var(--zd-mono);font-size:var(--zd-r2);color:var(--zd-ink-1)}
.tool .rt{margin-left:auto;display:flex;gap:calc(12 * var(--zd-u));align-items:center}
.tool .act{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-2);cursor:default}
.tool .act:hover{color:var(--zd-ink-0)}
.stat-bar{height:calc(24 * var(--zd-u));flex:none;display:flex;align-items:center;gap:calc(14 * var(--zd-u));padding:0 var(--zd-pad)}
.stat-bar .k{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3)}
.stat-bar .v{font-family:var(--zd-mono);font-size:var(--zd-r2);color:var(--zd-ink-1)}
.scrolly{overflow:hidden;flex:1 1 auto;position:relative;min-height:0}
.body > .pad{flex:none}

/* ---- tables: rules, not fills ---- */
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
table.tb th{
  font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);
  color:var(--zd-ink-3);font-weight:400;text-align:left;
  background:var(--zd-paper-3);
  height:calc(20 * var(--zd-u));padding:0 var(--zd-gap);
  border-bottom:1px solid var(--zd-rule-hair);white-space:nowrap;
}
table.tb td{
  font-size:var(--zd-r2);color:var(--zd-ink-1);height:var(--zd-row-h);
  padding:0 var(--zd-gap);border-bottom:1px solid var(--zd-rule-hair);
  white-space:nowrap;overflow:hidden;text-overflow:clip;
}
table.tb td.n,table.tb th.n{font-family:var(--zd-mono);text-align:right;font-variant-numeric:tabular-nums}
table.tb td.m{font-family:var(--zd-mono)}
table.tb tr.sel td{background:var(--zd-paper-3);font-weight:700;color:var(--zd-ink-0)}
table.tb tr.sel td:first-child{box-shadow:inset calc(3 * var(--zd-u)) 0 0 0 var(--zd-ink-0)}
table.tb tr:hover td{background:var(--zd-paper-3)}
table.tb tr.sel:hover td{background:var(--zd-paper-3)}
.fmark{display:inline-block;vertical-align:-2px;margin-right:var(--zd-gap)}
.fmark svg *{stroke:var(--zd-ink-1);stroke-width:1;fill:none}
tr.sel .fmark svg *{stroke:var(--zd-ink-0)}

/* ---- the well: cut into the paper ---- */
.well{
  background:var(--zd-paper-2);
  border:1px solid var(--zd-rule-hair);
  border-radius:var(--zd-r-set);
  font-family:var(--zd-mono);font-size:var(--zd-r2);
  line-height:calc(16 * var(--zd-u));color:var(--zd-ink-1);
  padding:calc(10 * var(--zd-u));white-space:pre;overflow:hidden;
}
.caret{display:inline-block;width:calc(2 * var(--zd-u));height:calc(11 * var(--zd-u));background:var(--zd-attn);vertical-align:-1px;margin-left:1px}

/* ---- stat pair: R1 key over R4 value. no border, no fill. ---- */
.stats{display:flex;flex-wrap:wrap;gap:calc(20 * var(--zd-u)) calc(28 * var(--zd-u))}
.stat{min-width:calc(96 * var(--zd-u))}
.stat .k{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3);line-height:calc(12 * var(--zd-u))}
.stat .v{font-family:var(--zd-mono);font-size:var(--zd-r4);font-weight:700;color:var(--zd-ink-0);line-height:calc(20 * var(--zd-u));margin-top:calc(2 * var(--zd-u));font-variant-numeric:tabular-nums}
.stat .u{font-size:var(--zd-r1);letter-spacing:var(--zd-trk);color:var(--zd-ink-3);margin-left:calc(3 * var(--zd-u))}
.meter{height:calc(4 * var(--zd-u));background:var(--zd-paper-3);border-radius:var(--zd-r-page);margin-top:calc(6 * var(--zd-u))}
.meter i{display:block;height:100%;background:var(--zd-ink-1);border-radius:var(--zd-r-page)}

/* ---- controls ---- */
.btn{
  height:calc(24 * var(--zd-u));display:inline-flex;align-items:center;padding:0 calc(12 * var(--zd-u));
  font-size:var(--zd-r3);font-weight:700;border-radius:var(--zd-r-page);
  border:1px solid var(--zd-rule-ctrl);background:var(--zd-paper-1);color:var(--zd-ink-0);
  cursor:default;transition:background var(--zd-ms-press) linear;
}
.btn:active{background:var(--zd-paper-3)}
/* THE KNOCKOUT, all four sites. Light: INK_0 plate, PAPER_1 text, 16.18:1.
   Dark:  INK_1 plate, PAPER_0 text, 12.72:1 - one rung down, so that the
   brightest value in the dark system only ever appears as a mark 3 dp or
   thinner (the focus rule, the marginal bar, R4 figures) and a 90 dp button
   can no longer outshout the focus rule it is sitting under. */
.btn.pri{background:var(--zd-kn-bg);border-color:var(--zd-kn-bg);color:var(--zd-kn-fg)}
.btn.tall{height:calc(28 * var(--zd-u));padding:0 calc(16 * var(--zd-u))}
.btnrow{display:flex;gap:var(--zd-gap);flex-wrap:wrap}
.tgl{width:calc(28 * var(--zd-u));height:calc(14 * var(--zd-u));border-radius:var(--zd-r-round);background:var(--zd-paper-3);border:1px solid var(--zd-rule-ctrl);position:relative;flex:none;cursor:default;transition:background var(--zd-ms-press) linear}
.tgl b{position:absolute;top:calc(2 * var(--zd-u));left:calc(2 * var(--zd-u));width:calc(8 * var(--zd-u));height:calc(8 * var(--zd-u));border-radius:var(--zd-r-round);background:var(--zd-ink-2);transition:left var(--zd-ms-press) linear}
.tgl.on{background:var(--zd-kn-bg);border-color:var(--zd-kn-bg)}
.tgl.on b{left:calc(16 * var(--zd-u));background:var(--zd-kn-fg)}
.sld{position:relative;height:calc(4 * var(--zd-u));background:var(--zd-paper-3);border-radius:var(--zd-r-page);flex:1 1 auto;cursor:default}
.sld i{display:block;height:100%;background:var(--zd-ink-1);border-radius:var(--zd-r-page)}
.sld b{position:absolute;top:calc(-4 * var(--zd-u));width:calc(12 * var(--zd-u));height:calc(12 * var(--zd-u));border-radius:var(--zd-r-round);background:var(--zd-ink-0);margin-left:calc(-6 * var(--zd-u))}
.seg{display:flex;border:1px solid var(--zd-rule-ctrl);border-radius:var(--zd-r-page);overflow:hidden;width:max-content}
.seg span{
  height:calc(22 * var(--zd-u));display:flex;align-items:center;padding:0 calc(10 * var(--zd-u));
  font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-2);
  border-left:1px solid var(--zd-rule-ctrl);cursor:default;
}
.seg span:first-child{border-left:0}
.seg span.on{background:var(--zd-kn-bg);color:var(--zd-kn-fg);font-weight:700}
.field{display:flex;align-items:center;gap:calc(12 * var(--zd-u));height:var(--zd-row-h)}
.field .lb{font-size:var(--zd-r2);color:var(--zd-ink-1);width:calc(116 * var(--zd-u));flex:none}
.field .st{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-2);width:calc(44 * var(--zd-u));flex:none}
.field .nm2{font-family:var(--zd-mono);font-size:var(--zd-r2);color:var(--zd-ink-1);width:calc(48 * var(--zd-u));flex:none;text-align:right}
.dl{display:flex;align-items:baseline;height:calc(22 * var(--zd-u));border-bottom:1px solid var(--zd-rule-hair)}
.dl .k{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3);flex:none;width:calc(112 * var(--zd-u))}
.dl .v{font-family:var(--zd-mono);font-size:var(--zd-r2);color:var(--zd-ink-1);margin-left:auto;text-align:right;overflow:hidden;white-space:nowrap}
/* The thumb needs a gutter of its own: parked over the content it covered the
   last digit of every right-flush figure in the table beneath it. */
.sbar{position:absolute;right:calc(4 * var(--zd-u));width:calc(4 * var(--zd-u));border-radius:var(--zd-r-round);background:var(--zd-ink-mute)}
.scrolly.gut{padding-right:calc(12 * var(--zd-u))}

/* ============================ OVERLAYS ============================ */
/* #ov already lives inside #ta, which is itself offset by the rail. Offsetting
   it by the rail a SECOND time pushed every overlay 160dp right of its sheet.
   It covers the type area exactly, and carries the rank-3 modal scrim. */
#ov{position:absolute;inset:0;z-index:500;display:none}
#ov.show{display:block;background:var(--zd-scrim-24)}
.sheet{
  position:absolute;inset:var(--zd-margin);
  background:var(--zd-paper-2);
  border:var(--zd-frame) solid var(--zd-ink-0);
  border-radius:var(--zd-r-page);
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet .shead{padding:var(--zd-pad) var(--zd-pad) 0;flex:none}
.sheet .shead .rule2{margin-top:calc(10 * var(--zd-u))}
.searchwell{
  margin:calc(14 * var(--zd-u)) var(--zd-pad) 0;height:calc(24 * var(--zd-u));flex:none;
  background:var(--zd-paper-1);border:1px solid var(--zd-rule-ctrl);border-radius:var(--zd-r-set);
  display:flex;align-items:center;padding:0 var(--zd-gap);gap:var(--zd-gap);
}
.searchwell input{flex:1 1 auto;font-family:var(--zd-mono);font-size:var(--zd-r2);color:var(--zd-ink-0);caret-color:var(--zd-attn)}
.searchwell .r1{flex:none}
.idxcols{flex:1 1 auto;display:flex;overflow:hidden;margin-top:calc(14 * var(--zd-u))}
.idxcol{flex:1 1 0;border-left:1px solid var(--zd-rule-hair);padding:0 calc(14 * var(--zd-u));overflow:hidden}
.idxcol:first-child{border-left:0}
.idxrun{margin-top:calc(10 * var(--zd-u))}
.idxrun .hair{margin-bottom:calc(2 * var(--zd-u))}
.irow{height:calc(24 * var(--zd-u));display:flex;align-items:center;gap:var(--zd-gap);position:relative;padding-left:calc(6 * var(--zd-u));cursor:default}
.irow .g{width:calc(16 * var(--zd-u));flex:none}
.irow .g svg *{stroke:var(--zd-ink-1);stroke-width:1;fill:none}
.irow .nm{font-size:var(--zd-r2);color:var(--zd-ink-1);overflow:hidden;white-space:nowrap}
.irow .kb{margin-left:auto;font-family:var(--zd-mono);font-size:var(--zd-r1);color:var(--zd-ink-3);flex:none}
.irow.on{background:var(--zd-paper-3)}
.irow.on .nm{font-weight:700;color:var(--zd-ink-0)}
.irow.on .g svg *{stroke:var(--zd-ink-0)}
.irow:hover{background:var(--zd-paper-3)}

/* command palette: a narrower sheet, still a page */
#pal .sheet{left:12%;right:12%;top:calc(48 * var(--zd-u));bottom:auto;max-height:78%}
.cmdrow{height:var(--zd-row-h);display:flex;align-items:center;gap:calc(12 * var(--zd-u));padding:0 var(--zd-pad);position:relative;cursor:default}
.cmdrow .no{font-family:var(--zd-mono);font-size:var(--zd-r1);color:var(--zd-ink-3);width:calc(18 * var(--zd-u));text-align:right;flex:none}
.cmdrow .nm{font-size:var(--zd-r2);color:var(--zd-ink-1);overflow:hidden;white-space:nowrap}
.cmdrow .cat{margin-left:auto;font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-3);flex:none}
.cmdrow .kb{font-family:var(--zd-mono);font-size:var(--zd-r1);color:var(--zd-ink-3);flex:none;width:calc(56 * var(--zd-u));text-align:right}
.cmdrow.on{background:var(--zd-paper-3)}
.cmdrow.on .nm{font-weight:700;color:var(--zd-ink-0)}
.cmdrow.on .no{color:var(--zd-ink-0)}
.cmdrow:hover{background:var(--zd-paper-3)}

/* overview: a contents spread */
#ovw .sheet{background:var(--zd-paper-1)}
.ovbody{flex:1 1 auto;overflow:hidden;padding:0 var(--zd-pad) var(--zd-pad)}
.ovsect{margin-top:calc(16 * var(--zd-u))}
.ovsect .hdr{display:flex;align-items:baseline;gap:var(--zd-gap)}
.ovsect .hair{margin-top:calc(4 * var(--zd-u))}
.ovrow{display:flex;gap:calc(16 * var(--zd-u));flex-wrap:wrap;margin-top:calc(12 * var(--zd-u))}
.mini{cursor:default}
.mini .frame{
  border:1px solid var(--zd-rule-hair);background:var(--zd-paper-1);
  overflow:hidden;position:relative;
}
.mini.on .frame{border-color:var(--zd-ink-0);box-shadow:inset 0 0 0 1px var(--zd-ink-0)}
.mini .cap{display:flex;align-items:baseline;gap:var(--zd-gap);margin-top:calc(6 * var(--zd-u))}
.mini .cap .no{font-family:var(--zd-mono);font-size:var(--zd-r1);color:var(--zd-ink-3)}
.mini .cap .nm{font-size:var(--zd-r2);color:var(--zd-ink-2);white-space:nowrap;overflow:hidden}
.mini.on .cap .nm{font-weight:700;color:var(--zd-ink-0)}
.miniscale{transform-origin:0 0;pointer-events:none}
.ovempty{font-size:var(--zd-r1);text-transform:uppercase;letter-spacing:var(--zd-trk);color:var(--zd-ink-mute);margin-top:calc(12 * var(--zd-u))}

/* menus: rank 2 keyline */
.menu{
  position:fixed;z-index:800;background:var(--zd-paper-1);
  border:1px solid var(--zd-rule-mid);border-radius:var(--zd-r-page);
  min-width:calc(184 * var(--zd-u));padding:calc(4 * var(--zd-u)) 0;
  animation:zfade var(--zd-ms-pop) linear;
}
.menu .mh{padding:calc(4 * var(--zd-u)) calc(14 * var(--zd-u)) calc(6 * var(--zd-u))}
.menu .mi{
  height:var(--zd-row-h);display:flex;align-items:center;gap:calc(16 * var(--zd-u));
  padding:0 calc(14 * var(--zd-u));font-size:var(--zd-r2);color:var(--zd-ink-1);cursor:default;
}
.menu .mi:hover{background:var(--zd-paper-3)}
.menu .mi .kb{margin-left:auto;font-family:var(--zd-mono);font-size:var(--zd-r1);color:var(--zd-ink-3)}
.menu .hair{margin:calc(4 * var(--zd-u)) 0}

/* toasts */
#toasts{position:absolute;right:var(--zd-margin);bottom:calc(40 * var(--zd-u));z-index:700;display:flex;flex-direction:column;gap:var(--zd-gap);align-items:flex-end}
.toast{
  background:var(--zd-paper-1);border:1px solid var(--zd-rule-mid);border-radius:var(--zd-r-page);
  min-width:calc(220 * var(--zd-u));max-width:calc(320 * var(--zd-u));
}
.toast .th{display:flex;align-items:center;gap:var(--zd-gap);padding:var(--zd-gap) calc(12 * var(--zd-u)) calc(6 * var(--zd-u))}
.toast .hair{margin:0 calc(12 * var(--zd-u))}
.toast .tb2{padding:calc(6 * var(--zd-u)) calc(12 * var(--zd-u)) calc(10 * var(--zd-u));font-size:var(--zd-r2);color:var(--zd-ink-1);line-height:1.4}
.toast .tb2 .mn{color:var(--zd-ink-2)}
.dot{width:calc(3 * var(--zd-u));height:calc(3 * var(--zd-u));flex:none;background:var(--zd-ink-1)}
.dot.g{background:var(--zd-green)} .dot.o{background:var(--zd-ochre)} .dot.r{background:var(--zd-attn)}

/* modal + scrim */
#modal{position:absolute;inset:0;z-index:850;display:none}
#modal.show{display:block}
#modal .scrim{position:absolute;inset:0;background:var(--zd-scrim-24)}
#modal .box{
  position:absolute;left:50%;top:34%;transform:translate(-50%,-34%);
  width:calc(400 * var(--zd-u));background:var(--zd-paper-1);
  border:var(--zd-frame) solid var(--zd-ink-0);border-radius:var(--zd-r-page);
}

/* lock: the title page */
#lock{position:absolute;inset:0;z-index:880;display:none;background:linear-gradient(180deg,var(--zd-paper-0) 0%,var(--zd-paper-0b) 100%)}
#lock.show{display:block}
#lock .plate{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;padding:calc(56 * var(--zd-u)) calc(64 * var(--zd-u))}
#lock .lgrid{position:absolute;inset:0;pointer-events:none}
#lock .lgrid i{position:absolute;top:0;bottom:0;width:1px;background:var(--zd-hair-45)}
#lock .lgrid u{position:absolute;height:1px;background:var(--zd-hair-45)}
#lock .top{display:flex;align-items:baseline;gap:calc(16 * var(--zd-u))}
#lock .word{font-size:calc(48 * var(--zd-u));font-weight:700;color:var(--zd-ink-0);line-height:1;letter-spacing:calc(-1 * var(--zd-u))}
#lock .rule2{margin-top:calc(18 * var(--zd-u));width:calc(560 * var(--zd-u));max-width:100%}
#lock .clock{font-family:var(--zd-mono);font-size:calc(96 * var(--zd-u));font-weight:700;color:var(--zd-ink-0);line-height:1;margin-top:calc(44 * var(--zd-u));font-variant-numeric:tabular-nums}
#lock .date{margin-top:calc(10 * var(--zd-u))}
#lock .authwell{
  margin-top:calc(40 * var(--zd-u));width:calc(320 * var(--zd-u));height:calc(28 * var(--zd-u));
  background:var(--zd-paper-2);border:1px solid var(--zd-rule-ctrl);border-radius:var(--zd-r-set);
  display:flex;align-items:center;padding:0 calc(10 * var(--zd-u));gap:var(--zd-gap);
}
#lock .authwell .stars{font-family:var(--zd-mono);font-size:var(--zd-r2);color:var(--zd-ink-0);letter-spacing:calc(2 * var(--zd-u))}
#lock .foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:calc(24 * var(--zd-u))}
#lock .fnum{font-family:var(--zd-mono);font-size:var(--zd-r4);font-weight:700;color:var(--zd-ink-3)}
/* The machine facts are FOOT MATTER, not body: the auto margin belongs to the
   notice so the two bottom groups travel together. With it on .foot the notice
   was stranded a third of the way down a page with 500 dp of nothing under it. */
#lock .notice{display:flex;gap:calc(28 * var(--zd-u));margin-top:auto}
/* THE TITLE PAGE IS A SPREAD: masthead and clock on the recto, the held sheets
   set as a contents list on the verso. Without these four rules renderLock()'s
   markup collapses into one column and the held rows run their own words
   together - the numeral, the sheet name and its open object had no boxes to
   sit in, so "1" + "Files" + "/kernel" printed as "1Files/kernel". */
#lock .spread{display:flex;align-items:flex-start;gap:calc(64 * var(--zd-u))}
#lock .lmain{flex:1 1 auto;min-width:0}
#lock .held{flex:none;width:calc(300 * var(--zd-u));max-width:38%;margin-top:calc(6 * var(--zd-u))}
#lock .held .hair{margin:calc(6 * var(--zd-u)) 0 calc(2 * var(--zd-u))}
#lock .hrow{display:flex;align-items:baseline;gap:var(--zd-gap);height:var(--zd-row-h)}
#lock .hrow .num{
  font-family:var(--zd-mono);font-size:var(--zd-r1);color:var(--zd-ink-3);
  width:calc(16 * var(--zd-u));text-align:right;flex:none;
}

/* ==========================================================================
   5. GEOMETRY. The grid is the layout system, made visible.
   ========================================================================== */
function M(){
  const ta = $('#ta').getBoundingClientRect();
  const sc = S.scale;
  const MG = Math.round(24 * sc), COL = Math.round((S.module - 16) * sc),
        GUT = Math.round(16 * sc), MOD = COL + GUT, ROW = Math.round(28 * sc);
  const inner = ta.width - 2 * MG;
  const cols = Math.max(4, Math.floor((inner + GUT) / MOD));
  const used = cols * MOD - GUT;
  const ox = Math.floor((ta.width - used) / 2);
  const rows = Math.max(6, Math.floor((ta.height - 2 * MG) / ROW));
  return {w:ta.width, h:ta.height, MG, COL, GUT, MOD, ROW, cols, rows, ox, oy:MG};
}
function place(w){
  const m = M();
  const gw = Math.min(w.gw, m.cols), gh = Math.min(w.gh, m.rows);
  const gx = clamp(w.gx, 0, m.cols - gw), gy = clamp(w.gy, 0, m.rows - gh);
  if (w.max) return {x:m.ox, y:m.oy, w:m.cols * m.MOD - m.GUT, h:m.rows * m.ROW};
  if (w.px != null) return {x:w.px, y:w.py, w:gw * m.MOD - m.GUT, h:gh * m.ROW};
  return {x:m.ox + gx * m.MOD, y:m.oy + gy * m.ROW, w:gw * m.MOD - m.GUT, h:gh * m.ROW};
}

function openApp(app, opts){
  const a = APPS[app]; if (!a) { toast('Index', 'ochre', esc(app) + ' is not in this build.'); return null; }
  let w = S.wins.find(x => x.app === app);
  if (w){ w.ws = S.ws; w.min = false; raise(w); return w; }
  /* fresh:true is what arms ZD_MS_FADE. renderWins() reads w.fresh and clears it,
     so the 120 ms fade plays exactly once, on the paint that puts the sheet on the
     page. Nothing set it, so the token was declared, styled and never fired. */
  w = Object.assign({
    id:'w' + (S.seq++), app, name:a.name, sub:a.sub, gw:a.gw, gh:a.gh,
    gx:2, gy:2, px:null, py:null, ws:S.ws, min:false, max:false, z:++S.zc,
    unsaved:!!a.unsaved, fresh:true
  }, opts || {});
  S.wins.push(w); S.focus = w.id; render(); return w;
}
function raise(w){ w.z = ++S.zc; S.focus = w.id; render(); }
function closeWin(w){
  S.wins = S.wins.filter(x => x !== w);
  const rest = S.wins.filter(x => x.ws === S.ws && !x.min).sort((a,b) => b.z - a.z);
  S.focus = rest.length ? rest[0].id : null;
  toast('Window closed', 'ink', w.name + ' left the folio. ' + S.wins.length + ' sheets remain.');
  render();
}
function focused(){ return S.wins.find(w => w.id === S.focus) || null; }

   ========================================================================== */
function toast(head, kind, body){
  const t = {id:'t' + (S.seq++), head, kind, body, fresh:true};
  S.toasts.push(t); if (S.toasts.length > 3) S.toasts.shift();
  renderToasts();
  setTimeout(() => { S.toasts = S.toasts.filter(x => x !== t); renderToasts(); }, 5200);
}
/* Same one-shot rule as a sheet: a toast fades in on the paint that puts it on the
   page, and is simply there on every re-render after that. Re-arming it on each
   render() would restart the fade under a mouse move, which is a flicker, not motion. */
function renderToasts(){
  const k = {ok:'g', warn:'o', fail:'r', ink:''};
  $('#toasts').innerHTML = S.toasts.map(t => {
    const fr = t.fresh ? ' fresh' : ''; t.fresh = false;
    return '<div class="toast' + fr + '"><div class="th"><i class="dot ' + (k[t.kind] || '') + '"></i>' +
    '<span class="r1">' + esc(t.head) + '</span></div><div class="hair"></div>' +
    '<div class="tb2">' + t.body + '</div></div>';
  }).join('');
}

    '<line x1="0" y1="0.5" x2="' + w + '" y2="0.5"/>' +

/* ---- Hex Viewer ---- */
APPBODY.hexv = () => {
  seed = 771102;
  const bytes = [];
  for (let i = 0; i < 24 * 16; i++) bytes.push(Math.floor(rnd() * 256));
  const seedTxt = 'zlOS 0.3 no libc no heap no float ' + 'ELF64 x86_64 static ';
  for (let i = 0; i < seedTxt.length; i++) bytes[80 + i] = seedTxt.charCodeAt(i);
  let out = '';
  for (let r = 0; r < 24; r++){
    const off = 0x00108000 + r * 16;
    let h = '', a = '';
    for (let c = 0; c < 16; c++){
      const b = bytes[r * 16 + c];
      const isSel = (r * 16 + c) >= 80 && (r * 16 + c) < 96;
      const hh = hex(b, 2);
      h += (isSel ? '<b>' + hh + '</b>' : hh) + (c === 7 ? '  ' : ' ');
      const ch = (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
      a += isSel ? '<b>' + esc(ch) + '</b>' : esc(ch);
    }
    out += '<span class="off">' + hex(off, 8) + '</span>  ' + h + ' ' + a + '\n';
  }
  return '<div class="tool"><span class="k">Node</span><span class="v">/kernel/zl.bin</span>' +

/* ---- Clocks ---- */
function faceSVG(mins){
  const d = new Date(Date.now() + mins * 60000);
  const h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();
  const P = (ang, r) => [40 + Math.sin(ang) * r, 40 - Math.cos(ang) * r];
  const ha = (h + m / 60) / 12 * Math.PI * 2, ma = m / 60 * Math.PI * 2, sa = s / 60 * Math.PI * 2;
  let ticks = '';
  for (let i = 0; i < 12; i++){
    const a = i / 12 * Math.PI * 2, p1 = P(a, 32), p2 = P(a, i % 3 === 0 ? 26 : 29);
    ticks += '<line class="tick" x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) + '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '"/>';
  }
  const hp = P(ha, 18), mp = P(ma, 27), sp = P(sa, 29);
  return '<svg class="face" width="80" height="80" viewBox="0 0 80 80">' +
    '<circle class="rim" cx="40" cy="40" r="34"/>' + ticks +
    '<line class="hh" x1="40" y1="40" x2="' + hp[0].toFixed(1) + '" y2="' + hp[1].toFixed(1) + '"/>' +
    '<line class="mh" x1="40" y1="40" x2="' + mp[0].toFixed(1) + '" y2="' + mp[1].toFixed(1) + '"/>' +
    '<line class="sh" x1="40" y1="40" x2="' + sp[0].toFixed(1) + '" y2="' + sp[1].toFixed(1) + '"/></svg>';
}

  const now = Date.now();

    const d = new Date(now + c[2] * 60000);
    const t = pad(d.getHours(), 2, '0') + ':' + pad(d.getMinutes(), 2, '0');
    return '<div style="flex:1 1 40%;min-width:calc(120 * var(--zd-u))">' +
      '<div class="r1">' + esc(c[0]) + ' &middot; ' + esc(c[1]) + '</div>' +

  return '<div class="pad" style="padding-bottom:0"><div style="display:flex;flex-wrap:wrap;gap:calc(18 * var(--zd-u))">' + cells + '</div></div>' +
    '<div class="pad" style="padding-top:16px;padding-bottom:0"><div class="r1">Timers hung off the 100 Hz tick</div>' +

function renderGrid(){
  const m = M(), g = $('#grid'), d = $('#drop');
  if (!S.gridOn){ g.innerHTML = ''; d.innerHTML = ''; return; }
  let h = '';
  for (let c = 0; c <= m.cols; c++){
    const x = m.ox + c * m.MOD - (c === m.cols ? m.GUT : 0);
    h += '<i class="gv" style="left:' + x + 'px"></i>';
    if (c < m.cols) h += '<i class="gv" style="left:' + (m.ox + c * m.MOD + m.COL) + 'px"></i>';
  }
  h += '<i class="gh" style="left:' + m.ox + 'px;width:' + (m.cols * m.MOD - m.GUT) + 'px;top:' + m.oy + 'px"></i>';
  h += '<i class="gh" style="left:' + m.ox + 'px;width:' + (m.cols * m.MOD - m.GUT) + 'px;top:' + (m.oy + m.rows * m.ROW) + 'px"></i>';

}

/* ---- the Index: a book index, not a tile grid ---- */
function indexEntries(){
  const real = Object.keys(APPS).map(k => ({name:APPS[k].name, ico:APPS[k].ico, app:k}));
  const util = UTILS.map(u => ({name:u[0], ico:'util', app:null}));
  return real.concat(util).sort((a, b) => a.name.localeCompare(b.name));
}
function renderIndex(){
  const q = S.q.toLowerCase();
  const all = indexEntries().filter(e => !q || e.name.toLowerCase().includes(q));
  const ncols = 4, per = Math.ceil(all.length / ncols);
  let cols = [];
  for (let c = 0; c < ncols; c++) cols.push(all.slice(c * per, (c + 1) * per));
  const kb = n => 'C-' + n.toLowerCase()[0];
  const colHTML = list => {
    let out = '', run = '';
    list.forEach((e, i) => {
      const L = e.name[0].toUpperCase();
      if (L !== run){ run = L; out += '<div class="idxrun"><div class="hair"></div><span class="r1">' + L + '</span></div>'; }
      const gi = all.indexOf(e);
      out += '<div class="irow' + (gi === S.qi ? ' on' : '') + '" data-idx="' + esc(e.name) + '">' +
        '<span class="g">' + ico(e.ico, 14) + '</span><span class="nm">' + esc(e.name) + '</span>' +
        '<span class="kb">' + kb(e.name) + '</span></div>';
    });
    return out;
  };
  return '<div class="sheet"><div class="shead"><div class="r4">Index</div>' +
    '<div class="r1" style="margin-top:4px">' + all.length + ' entries &middot; type to filter &middot; esc closes</div>' +
    '<div class="rule2"></div></div>' +
    '<div class="searchwell"><span class="r1">Find</span>' +
    '<input id="qi" value="' + esc(S.q) + '" autocomplete="off" spellcheck="false"><span class="caret"></span></div>' +
    '<div class="idxcols">' + cols.map(c => '<div class="idxcol">' + colHTML(c) + '</div>').join('') + '</div></div>';
}

  if (!S.ov){ ov.className = ''; ov.innerHTML = ''; S.ovFresh = true; return; }
  /* One fade per opening, not one per keystroke: typing in the palette re-renders
     the sheet on every character, and re-arming the animation there would strobe. */
  ov.className = S.ovFresh ? 'show fresh' : 'show';
  S.ovFresh = false;
  ov.innerHTML = S.ov === 'index' ? renderIndex() : S.ov === 'palette' ? renderPalette() : renderOverview();
  const inp = $('#qi');
  if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

/* ---- lock: the title page ---- */
function renderLock(){
  const L = $('#lock');
  L.className = S.locked ? 'show' : '';
  if (!S.locked){ L.innerHTML = ''; return; }
  const d = new Date();
  const m = M();
  /* The lock page is the same page. It was drawing one line per module while the
     desktop draws BOTH edges of every column, and it was missing the two margin
     horizontals entirely, so the wallpaper did not match itself between scenes. */
  const rw = parseFloat(getComputedStyle($('#rail')).width);
  let g = '';
  for (let c = 0; c <= m.cols; c++){
    g += '<i style="left:' + (rw + m.ox + c * m.MOD - (c === m.cols ? m.GUT : 0)) + 'px"></i>';
    if (c < m.cols) g += '<i style="left:' + (rw + m.ox + c * m.MOD + m.COL) + 'px"></i>';
  }
  const gwid = m.cols * m.MOD - m.GUT;
  g += '<u style="left:' + (rw + m.ox) + 'px;width:' + gwid + 'px;top:' + m.oy + 'px"></u>';
  g += '<u style="left:' + (rw + m.ox) + 'px;width:' + gwid + 'px;top:' + (m.oy + m.rows * m.ROW) + 'px"></u>';
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const mons = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const held = S.wins.map((w, i) =>
    '<div class="hrow"><span class="num">' + (i + 1) + '</span>' +
    '<span class="ttl">' + esc(w.name) + '</span>' +
    '<span class="sb">' + esc(w.sub) + '</span></div>').join('');
  /* and the plate sits ON that grid: left edge on column 1, right edge on the
     last column boundary, top under the margin rule. It was using its own 64dp
     inset, which put the masthead and the colophon outside the page's own grid. */
  const pl = 'style="left:' + (rw + m.ox) + 'px;right:' + (m.w + rw - (rw + m.ox + gwid)) +
    'px;padding:' + (m.oy + m.ROW) + 'px 0 ' + m.oy + 'px 0"';
  L.innerHTML = '<div class="lgrid">' + g + '</div><div class="plate" ' + pl + '>' +
    '<div class="spread"><div class="lmain">' +
    '<div class="top"><span class="word">zlOS</span><span class="r1">0.3 &middot; folio</span></div>' +
    '<div class="rule2"></div>' +
    '<div class="clock mn">' + pad(d.getHours(), 2, '0') + ':' + pad(d.getMinutes(), 2, '0') + '</div>' +
    '<div class="date r2 sec">' + days[d.getDay()] + ' ' + d.getDate() + ' ' + mons[d.getMonth()] + '</div>' +
    '<div class="authwell"><span class="r1">Key</span><span class="stars">' + '&#183;'.repeat(8) + '</span><span class="caret"></span></div>' +
    '<div class="r1" style="margin-top:10px">press return to unlock &middot; session held, ' + S.wins.length + ' sheets open</div>' +
    '</div><div class="held"><span class="r1">Held</span><div class="hair"></div>' + held +
    '<div class="r1" style="margin-top:calc(10 * var(--zd-u))">nothing is discarded on lock</div>' +
    '</div></div>' +
    '<div class="notice">' +
    '<div><div class="r1">Uptime</div><div class="mn r2" style="margin-top:2px">04:18:22</div></div>' +
    '<div><div class="r1">Load</div><div class="mn r2" style="margin-top:2px">0.42 0.31 0.28</div></div>' +
    '<div><div class="r1">Storage</div><div class="mn r2" style="margin-top:2px">386.2 GiB free</div></div>' +
    '<div><div class="r1">Link</div><div class="mn r2" style="margin-top:2px">eth0 up</div></div>' +
    '</div>' +
    '<div class="foot"><span class="r1">ZLOS &middot; 0.3 &middot; NO LIBC &middot; NO HEAP &middot; NO FLOAT</span>' +
    '<span class="fnum">' + S.ws + '</span></div></div>';
}

function render(){
  document.documentElement.style.setProperty('--zd-sc', S.scale);
  document.documentElement.style.setProperty('--zd-attn', 'var(' + ATTN[S.attn] + ')');
  document.body.style.webkitFontSmoothing = S.sub ? 'antialiased' : 'none';
  renderGrid(); renderWins(); renderRail(); renderFolio(); renderOv(); renderLock(); renderToasts();
  renderScenes(); syncBars();
}
/* A thumb that is drawn whether or not anything is off the page is a lie about
   the document. Size it from the real overflow, and remove it when there is none. */
function syncBars(){
  document.querySelectorAll('.scrolly').forEach(sc => {
    const bar = sc.querySelector('.sbar'); if (!bar) return;
    const ch = sc.clientHeight, sh = sc.scrollHeight;
    if (sh <= ch + 1){ bar.style.display = 'none'; return; }
    bar.style.display = '';
    bar.style.top = '0px';
    bar.style.height = Math.max(24, Math.round(ch * ch / sh)) + 'px';
  });
}

/* ==========================================================================
   10. SCENES. Reading the hash puts the prototype into a named state,
       on load and on hashchange.
   ========================================================================== */
const SCENE_NAMES = ['desktop','overview','palette','files','monitor','settings','lock'];
/* Every scene link carries the CURRENT stock, so clicking through the seven
   scenes never silently drops you back to paper. The seven bare hashes still
   mean exactly what they meant before: that scene, on paper. */
function renderScenes(){
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#scenes').innerHTML = SCENE_NAMES.map(n =>
    '<a href="#' + n + sfx + '" class="' + (n === S.scene ? 'on' : '') + '">' + n + '</a>').join('');
  document.querySelectorAll('#stock [data-theme-set]').forEach(el =>
    el.classList.toggle('on', el.dataset.themeSet === S.theme));
}
function applyTheme(t){
  S.theme = (t === 'dark') ? 'dark' : 'light';
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
/* The switch rewrites the hash rather than just flipping the attribute, so the
   address bar is always a truthful deep link to what is on screen. */
function setTheme(t){
  if (t === S.theme) return;
  location.hash = '#' + S.scene + (t === 'dark' ? '-dark' : '');
}
function mk(app, gx, gy, extra){
  const a = APPS[app];
  return Object.assign({id:'w' + (S.seq++), app, name:a.name, sub:a.sub, gw:a.gw, gh:a.gh,
    gx, gy, px:null, py:null, ws:1, min:false, max:false, z:++S.zc, unsaved:!!a.unsaved}, extra || {});
}
function baseDesktop(){
  const m = M(), R = m.rows;
  const r = (frac, min) => Math.max(min, Math.round(R * frac));
  S.wins = [
    mk('files', 8,  0,           {gw:9,  gh:r(0.48, 12)}),
    mk('log',   8,  r(0.52, 14), {gw:10, gh:r(0.46, 11)}),
    mk('mon',   0,  r(0.45, 12), {gw:8,  gh:r(0.53, 13)}),
    mk('edit',  12, r(0.24, 7),  {gw:9,  gh:r(0.52, 13)}),
    mk('term',  0,  0,           {gw:8,  gh:r(0.44, 12)})
  ];
  S.focus = S.wins[S.wins.length - 1].id;
}
/* two sheets abutting on a column boundary, filling the type area */
function twoUp(a, b){
  const m = M(), half = Math.floor(m.cols / 2), H = Math.max(8, m.rows - 2);
  a.gx = 0;    a.gw = half;          a.gy = 0; a.gh = H;
  b.gx = half; b.gw = m.cols - half; b.gy = 0; b.gh = H;
  a.px = b.px = null;
}
function applyScene(name){
  S.scene = name;
  const m0 = M(); S.lastCols = m0.cols; S.lastRows = m0.rows;
  S.wins = []; S.zc = 10; S.seq = 1; S.ov = null; S.locked = false;
  S.ws = 1; S.q = ''; S.qi = 0; S.toasts = []; S.menu = null;
  closeMenu();
  if (name === 'desktop'){
    baseDesktop();
    setTimeout(() => toast('wmshot', 'ok', 'Wrote <span class="mn">/tmp/wmshot.ppm</span>, 9216000 bytes in 11.2 ms.'), 60);
  } else if (name === 'overview'){
    baseDesktop();
    S.wins.push(mk('net', 2, 2, {ws:2, gh:15}), mk('clock', 11, 4, {ws:2}), mk('regs', 1, 6, {ws:3}));
    S.ov = 'overview';
  } else if (name === 'palette'){
    baseDesktop();
    S.ov = 'palette'; S.q = 'col'; S.qi = 0;
  } else if (name === 'files'){
    S.wins = [mk('edit', 0, 0), mk('files', 0, 0)];
    twoUp(S.wins[1], S.wins[0]);
    S.focus = S.wins[1].id; S.sel = 'fb.c'; S.doc = 'fb.c';
  } else if (name === 'monitor'){
    S.wins = [mk('net', 0, 0), mk('mon', 0, 0)];
    twoUp(S.wins[1], S.wins[0]);
    S.focus = S.wins[1].id;
  } else if (name === 'settings'){
    /* The split is a FRACTION of the column count, not a fixed 7 + 11. At 22
       columns the fixed pair used 18 and left four columns of bare page on the
       right, and a 7-column shell clipped its own build log mid-word. */
    const m = M(), R = Math.max(8, m.rows - 2);
    const L = clamp(Math.round(m.cols * 0.42), 8, m.cols - 8);
    S.wins = [
      mk('term',  0, 0,                   {gw:L, gh:Math.round(R * 0.48)}),
      mk('files', 0, Math.round(R * 0.5), {gw:L, gh:R - Math.round(R * 0.5)}),
      mk('set',   L, 0,                   {gw:m.cols - L, gh:R})
    ];
    S.focus = S.wins[2].id;
  } else if (name === 'lock'){
    baseDesktop();
    S.locked = true;
  }
  render();
}
/* DEEP LINKS. "#files" is the scene on paper; "#files-dark" is the same scene on
   ink with no clicks, on load and on hashchange. The suffix is stripped BEFORE
   the scene lookup, so the seven original hashes resolve exactly as they did. */
function readHash(){
  let h = (location.hash || '#desktop').slice(1);
  let theme = 'light';
  if (h.slice(-5) === '-dark'){ theme = 'dark'; h = h.slice(0, -5); }
  if (SCENE_NAMES.indexOf(h) < 0) h = 'desktop';
  const sameScene = (h === S.scene && S.wins.length > 0);
  applyTheme(theme);
  /* Flipping stock must not rebuild the desk under you: if only the theme moved,
     re-render, do not re-lay the scene. */
  if (sameScene) render(); else applyScene(h);
}
window.addEventListener('hashchange', readHash);

/* ==========================================================================
   11. INTERACTION
   ========================================================================== */
function setAttn(v){ S.attn = v; render(); toast('Attention ink', 'ok', 'One token repointed. No call site changed.'); }
function setOv(v){ S.ov = (S.ov === v) ? null : v; S.q = ''; S.qi = 0; render(); }
function setLock(v){ S.locked = v; render(); }
function closeMenu(){ const m = document.querySelector('.menu'); if (m) m.remove(); }
function showMenu(x, y, head, items){
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu';
  el.innerHTML = (head ? '<div class="mh"><span class="r1">' + esc(head) + '</span></div><div class="hair"></div>' : '') +
    items.map((it, i) => it === '-' ? '<div class="hair"></div>' :
      '<div class="mi" data-mi="' + i + '">' + esc(it[0]) + '<span class="kb">' + esc(it[1] || '') + '</span></div>').join('');
  el.style.left = Math.min(x, innerWidth - 200) + 'px';
  el.style.top = Math.min(y, innerHeight - 40 - items.length * 28) + 'px';
  document.body.appendChild(el);
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-mi]'); if (!t) return;
    const it = items[+t.dataset.mi]; closeMenu(); if (it && it[2]) it[2]();
  });
}

/* ---- drag, with the one shadow and the column bands ---- */
let drag = null;
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.menu')) closeMenu();
  const sl = e.target.closest('[data-sld]');
  if (sl){ dragSlider(sl, e); return; }
  const dh = e.target.closest('[data-drag]');
  if (dh && !e.target.closest('.ctrl')){
    const w = S.wins.find(x => x.id === dh.dataset.drag); if (!w) return;
    raise(w);
    const node = $('#wins [data-id="' + w.id + '"]'); if (!node) return;
    const p = place(w);
    drag = {w, sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y, w0:p.w, h0:p.h, moved:false};
    node.classList.add('drag');
    e.preventDefault();
  }
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  drag.moved = true;
  const node = $('#wins [data-id="' + drag.w.id + '"]'); if (!node) return;
  const nx = drag.ox + dx, ny = drag.oy + dy;
  node.style.left = nx + 'px'; node.style.top = ny + 'px';
  node.classList.remove('snapping');
  showBands(nx, drag.w0);
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  const node = $('#wins [data-id="' + drag.w.id + '"]');
  const m = M();
  if (node && drag.moved){
    const nx = parseFloat(node.style.left), ny = parseFloat(node.style.top);
    if (S.snap){
      const gx = clamp(Math.round((nx - m.ox) / m.MOD), 0, m.cols - Math.min(drag.w.gw, m.cols));
      const gy = clamp(Math.round((ny - m.oy) / m.ROW), 0, m.rows - Math.min(drag.w.gh, m.rows));
      drag.w.gx = gx; drag.w.gy = gy; drag.w.px = null; drag.w.py = null;
      const p = place(drag.w);
      node.classList.add('snapping');
      node.style.left = p.x + 'px'; node.style.top = p.y + 'px';
    } else { drag.w.px = nx; drag.w.py = ny; }
  }
  if (node) node.classList.remove('drag');
  $('#drop').className = '';
  const w = drag.w; drag = null;
  setTimeout(() => { if (node) node.classList.remove('snapping'); renderRail(); }, 180);
});
function showBands(x, wpx){
  const m = M(), d = $('#drop');
  if (!S.gridOn || !S.snap){ d.className = ''; return; }
  const c0 = clamp(Math.round((x - m.ox) / m.MOD), 0, m.cols - 1);
  const n = Math.max(1, Math.round((wpx + m.GUT) / m.MOD));
  let h = '';
  for (let c = c0; c < Math.min(c0 + n, m.cols); c++)
    h += '<i class="band" style="left:' + (m.ox + c * m.MOD) + 'px;top:' + m.oy + 'px;width:' + m.COL + 'px;height:' + (m.rows * m.ROW) + 'px"></i>';
  d.innerHTML = h; d.className = 'live';
}
function dragSlider(el, e){
  const name = el.dataset.sld, min = +el.dataset.min, max = +el.dataset.max;
  const set = ev => {
    const r = el.getBoundingClientRect();
    const t = clamp((ev.clientX - r.left) / r.width, 0, 1);
    let v = min + t * (max - min);
    if (name === 'scale') v = Math.round(v * 20) / 20;
    if (name === 'module') v = Math.round(v / 8) * 8;
    S[name] = v; render();
  };
  set(e);
  const mv = ev => set(ev);
  const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  e.preventDefault();
}

/* ---- clicks ---- */
document.addEventListener('click', e => {
  const t = e.target;
  /* the stock switch sits in the harness strip and works even while locked -
     the lock scene is one of the seven, and you have to be able to see it in ink */
  const ts = t.closest('[data-theme-set]');
  if (ts){ setTheme(ts.dataset.themeSet); return; }
  if (S.locked){ setLock(false); return; }

  const c = t.closest('.ctrl[data-c]');
  if (c){
    const w = S.wins.find(x => x.id === c.dataset.id); if (!w) return;
    if (c.dataset.c === 'min'){ w.min = true; if (S.focus === w.id) S.focus = null; render(); }
    else if (c.dataset.c === 'fit'){ w.max = !w.max; w.px = null; raise(w); }
    else closeWin(w);
    return;
  }
  const toc = t.closest('[data-toc]');
  if (toc){
    const w = S.wins.find(x => x.id === toc.dataset.toc); if (!w) return;
    if (w.min){ w.min = false; raise(w); }
    else if (S.focus === w.id){ w.min = true; S.focus = null; render(); }
    else raise(w);
    return;
  }
  const la = t.closest('[data-launch]'); if (la){ openApp(la.dataset.launch); return; }
  const ovb = t.closest('[data-ov]');    if (ovb){ setOv(ovb.dataset.ov); return; }
  const wsb = t.closest('[data-ws]');
  if (wsb){ S.ws = +wsb.dataset.ws; const f = S.wins.filter(w => w.ws === S.ws && !w.min).sort((a,b) => b.z - a.z);
    S.focus = f.length ? f[0].id : null; render(); toast('Workspace', 'ok', 'Sheet ' + S.ws + ' of 3, ' + f.length + ' windows.'); return; }

  const mini = t.closest('[data-mini]');
  if (mini){
    const w = S.wins.find(x => x.id === mini.dataset.mini); if (!w) return;
    S.ws = w.ws; w.min = false; S.ov = null; raise(w); return;
  }
  const idx = t.closest('[data-idx]');
  if (idx){
    const e2 = indexEntries().find(x => x.name === idx.dataset.idx);
    S.ov = null;
    if (e2 && e2.app) openApp(e2.app);
    else { const w = openUtil(e2 ? e2.name : idx.dataset.idx); }
    return;
  }
  const cmd = t.closest('[data-cmd]');
  if (cmd){ const c2 = CMDS.find(x => x[0] === cmd.dataset.cmd); S.ov = null; render(); if (c2) c2[3](); return; }

  const fr = t.closest('tr[data-file]');
  if (fr){ S.sel = fr.dataset.file; if (SRC[S.sel]) S.doc = S.sel; render(); return; }

  const sg = t.closest('[data-seg]');
  if (sg){ if (sg.dataset.seg === 'attn') setAttn(sg.dataset.v); return; }
  const tg = t.closest('[data-tgl]');
  if (tg){ S[tg.dataset.tgl] = !S[tg.dataset.tgl]; render(); return; }

  const ck = t.closest('[data-ck]');
  if (ck){ calcKey(ck.dataset.ck); return; }

  const wm2 = t.closest('[data-wmenu]');
  if (wm2){ const w = S.wins.find(x => x.id === wm2.dataset.wmenu); if (w) winMenu(w, e.clientX, e.clientY + 8); return; }

  const win = t.closest('.win[data-id]');
  if (win){ const w = S.wins.find(x => x.id === win.dataset.id); if (w && w.id !== S.focus) raise(w); return; }
});
function openUtil(name){
  let w = S.wins.find(x => x.name === name);
  if (w){ w.ws = S.ws; w.min = false; raise(w); return w; }
  w = {id:'w' + (S.seq++), app:'__util', name, sub:'utility', gw:8, gh:12, gx:3, gy:4,
       px:null, py:null, ws:S.ws, min:false, max:false, z:++S.zc, unsaved:false};
  S.wins.push(w); S.focus = w.id; render(); return w;
}
function calcKey(k){
  if (k === 'C'){ S.calcAcc = '0'; }
  else if (k === '='){ S.calcTape = S.calcTape.slice(-4).concat([S.calcAcc + ' = ' + S.calcAcc]); }
  else if (/[0-9.]/.test(k)) S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k;
  else S.calcAcc = S.calcAcc + ' ' + k + ' ';
  render();
}
function winMenu(w, x, y){
  showMenu(x, y, w.name, [
    ['Raise', 'Ret', () => raise(w)],
    ['Minimise', '', () => { w.min = true; if (S.focus === w.id) S.focus = null; render(); }],
    ['Fit to columns', 'C-Ret', () => { w.max = !w.max; w.px = null; raise(w); }],
    '-',
    ['Move to workspace 1', 'C-1', () => { w.ws = 1; render(); }],
    ['Move to workspace 2', 'C-2', () => { w.ws = 2; render(); }],
    ['Move to workspace 3', 'C-3', () => { w.ws = 3; render(); }],
    '-',
    ['Close', 'C-w', () => closeWin(w)]
  ]);
}
document.addEventListener('contextmenu', e => {
  if (S.locked) return;
  e.preventDefault();
  const win = e.target.closest('.win[data-id]');
  if (win){ const w = S.wins.find(x => x.id === win.dataset.id); if (w){ raise(w); winMenu(w, e.clientX, e.clientY); return; } }
  showMenu(e.clientX, e.clientY, 'Page', [
    ['New shell', '', () => openApp('term')],
    ['Open Files', '', () => openApp('files')],
    ['Index...', 'C-i', () => setOv('index')],
    ['Command...', 'C-k', () => setOv('palette')],
    '-',
    ['Toggle column grid', 'C-g', () => { S.gridOn = !S.gridOn; render(); }],
    ['Fit all to columns', '', () => { S.wins.filter(w => w.ws === S.ws).forEach((w, i) => { w.gx = (i % 2) * 9; w.gy = 0; w.gw = 9; w.gh = 18; w.px = null; }); render(); toast('Tidied', 'ok', 'Every sheet snapped to the column grid.'); }],
    ['Activities', 'C-o', () => setOv('overview')],
    '-',
    ['Lock session', 'C-l', () => setLock(true)]
  ]);
});
document.addEventListener('dblclick', e => {
  const dh = e.target.closest('[data-drag]');
  if (dh){ const w = S.wins.find(x => x.id === dh.dataset.drag); if (w){ w.max = !w.max; w.px = null; raise(w); } }
});

/* ---- keyboard ---- */
document.addEventListener('keydown', e => {
  /* C-b flips the stock. Bound before the lock guard for the same reason the
     switch is: the lock scene has to be inspectable in both. */
  if (e.ctrlKey && e.key.toLowerCase() === 'b'){
    e.preventDefault(); setTheme(S.theme === 'dark' ? 'light' : 'dark'); return;
  }
  if (S.locked){ if (e.key === 'Enter' || e.key === 'Escape'){ setLock(false); e.preventDefault(); } return; }
  const inPal = S.ov === 'palette' || S.ov === 'index';
  if (e.ctrlKey && e.key.toLowerCase() === 'k'){ e.preventDefault(); setOv('palette'); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'i'){ e.preventDefault(); setOv('index'); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'o'){ e.preventDefault(); setOv('overview'); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'l'){ e.preventDefault(); setLock(true); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'g'){ e.preventDefault(); S.gridOn = !S.gridOn; render(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'w'){ e.preventDefault(); const w = focused(); if (w) closeWin(w); return; }
  if (e.ctrlKey && '123'.includes(e.key)){ e.preventDefault(); S.ws = +e.key;
    const f = S.wins.filter(w => w.ws === S.ws && !w.min).sort((a,b) => b.z - a.z);
    S.focus = f.length ? f[0].id : null; render(); return; }
  if (e.key === 'Escape'){ if (S.ov){ S.ov = null; render(); } closeMenu(); return; }
  if (inPal){
    const list = S.ov === 'palette' ? cmdMatches() : indexEntries().filter(x => !S.q || x.name.toLowerCase().includes(S.q.toLowerCase()));
    if (e.key === 'ArrowDown'){ e.preventDefault(); S.qi = clamp(S.qi + 1, 0, list.length - 1); renderOv(); return; }
    if (e.key === 'ArrowUp'){ e.preventDefault(); S.qi = clamp(S.qi - 1, 0, list.length - 1); renderOv(); return; }
    if (e.key === 'Enter'){
      e.preventDefault();
      const it = list[S.qi]; S.ov = null; render();
      if (!it) return;
      if (S.ov === null && Array.isArray(it)) it[3]();
      else if (it && it[3]) it[3]();
      else if (it && it.app) openApp(it.app);
      else if (it && it.name) openUtil(it.name);
      return;
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'qi') return;
  S.q = e.target.value; S.qi = 0;
  const box = $('#ov');
  const scrollQ = e.target.value;
  box.innerHTML = S.ov === 'index' ? renderIndex() : renderPalette();
  const inp = $('#qi'); if (inp){ inp.value = scrollQ; inp.focus(); inp.setSelectionRange(scrollQ.length, scrollQ.length); }
});

/* ---- live tick. Values move, nothing animates for decoration. ---- */
setInterval(() => {
  if (S.locked){ renderLock(); return; }
  S.tick++;
  renderRail();
  const live = S.wins.filter(w => w.ws === S.ws && !w.min && (w.app === 'mon' || w.app === 'net' || w.app === 'clock'));
  live.forEach(w => {
    const node = $('#wins [data-id="' + w.id + '"] .body');
    if (node) node.innerHTML = APPBODY[w.app]();
  });
  syncBars();
}, 1000);

/* A scene's sheet geometry is expressed in COLUMNS AND ROWS, and both are a
   function of the page size. Re-rendering alone redrew the grid at the new
   count while the sheets kept the old one, so the page stopped being filled.
   Re-lay the scene whenever the count actually moves; plain render otherwise. */
window.addEventListener('resize', () => {
  if (drag) return;
  const m = M();
  if (m.cols !== S.lastCols || m.rows !== S.lastRows){
    S.lastCols = m.cols; S.lastRows = m.rows;
    applyScene(S.scene || 'desktop');
    return;
  }
  render();
});

/* boot */
readHash();
</script>
