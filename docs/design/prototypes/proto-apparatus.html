<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APPARATUS / zlOS living prototype</title>
<style>
/* ==================================================== design.h, light ==
   APPARATUS. Every window is a scholarly text with a critical apparatus:
   numbered lines in the outer margin, the machine's commentary set at the
   foot in the smallest register with lemma references, and focus means the
   apparatus is open.

   THE LAW OF THIS DIRECTION: colour carries nothing. There is no accent, no
   chromatic ink, no red error and no green ok anywhere in the system. The
   machine is distinguished from the user by REGISTER and by POSITION, not
   by hue - which is exactly how a real apparatus criticus distinguishes a
   variant from a conjecture.

   Light is a WHITE WOVE. An academic press prints on good stock, not on
   cream, so this is the highest-contrast paper in the family: AP_PAPER sits
   at L* 93.1 against Folio's warmer, lower sheet.

   Every hex in this document is one of the tokens below. No hex value is
   used as a CSS value anywhere outside the two :root blocks. Every token
   name exists in BOTH blocks; a name in only one mode is a defect.
   --------------------------------------------------------------------- */
:root {
  /* --- the four stocks. measured L*, and the step between them --------
     PAPER  L* 93.1   the sheet, the user's ground
     APP    L* 90.3   the apparatus band. dL* 2.81 below the sheet, which
                      is a setting change you can see before you read a word
     DESK   L* 88.5   the reading table. dL* 4.57 below the sheet
     WELL   L* 96.5   a window cut in the sheet: terminal ground, input
                      wells, the editor's text column. dL* 3.41 ABOVE
                      the sheet, because on white wove a well is where the
                      ink has not gone.                                   */
  --ap-paper:    #EFEBE1;
  --ap-app:      #E8E3D6;
  --ap-desk:     #E3DED1;
  --ap-well:     #F7F5EE;

  /* --- one ink, four densities ---------------------------------------
     ratios are given against AP_PAPER first, then against AP_APP, which
     is the darkest text-bearing surface in this mode and therefore the
     one every ink is actually held to.
     INK_0  16.20 : 1  /  15.05 : 1   the 2px rule, the cut edge, focused
                                      running head, the one inversion
     INK_1  13.33 : 1  /  12.39 : 1   body text, table cells
     INK_2   8.51 : 1  /   7.90 : 1   secondary, labels, unfocused titles
     INK_3   6.30 : 1  /   5.86 : 1   the apparatus itself, line numbers
     HAIR    1.69 : 1  /   1.57 : 1   NOT TEXT. the quiet keyline, the
                                      drawn column grid, meter tracks.   */
  --ap-ink-0:    #100E0A;
  --ap-ink-1:    #25221B;
  --ap-ink-2:    #474134;
  --ap-ink-3:    #5B5445;
  --ap-hair:     #BEB6A3;

  /* --- roles. named for what they DO, so ui.c can bind them once ------
     RULE_2  the 2px structural rule and the cut edge. always INK_0.
     RULE_1  the 1px hair that closes an apparatus and mounts a free edge.
     MARK    a solid graphic that IS the datum: meter fill, slider fill,
             the sigla marginal bar, the caret, the scrollbar thumb.
     TRACK   the unfilled remainder of any such graphic.
     INV_BG / INV_0 / INV_1  the ONE inversion in the system: a selected
             row. At most one per sheet. INV_1 is 9.56:1 on INV_BG.
     GRID    the desk's drawn column grid.
     SCRIM   the overview and lock ground: the desk, opaque. There is no
             translucency and no shadow anywhere in this direction.      */
  --ap-rule-2:   #100E0A;
  --ap-rule-1:   #BEB6A3;
  --ap-mark:     #100E0A;
  --ap-mark-2:   #474134;
  --ap-track:    #BEB6A3;
  --ap-inv-bg:   #100E0A;
  --ap-inv-0:    #EFEBE1;
  --ap-inv-1:    #BEB6A3;
  --ap-grid:     #BEB6A3;
  --ap-scrim:    #E3DED1;
  --ap-knob:     #EFEBE1;

  /* ------------------------------------------------------------ metrics
     Spacing is on the 4 / 8 / 12 / 16 / 24 scale. The three reserved
     regions of a sheet are 28dp head, 28dp outer margin, and an apparatus
     band of 28 + 16*(lines-1) dp - 28dp exactly when one line is set,
     which is the stated minimum.                                        */
  --ui: 1;
  --ap-rail-w:  calc(128px * var(--ui));
  --ap-sig-w:   calc(24px  * var(--ui));
  --ap-head-h:  calc(28px  * var(--ui));
  --ap-marg-w:  calc(28px  * var(--ui));
  --ap-lines:   3;
  --ap-app-h:   calc((28px + 16px * (var(--ap-lines) - 1)) * var(--ui));
  --ap-ln:      calc(16px  * var(--ui));   /* the baseline the margin counts */
  --ap-row-h:   calc(20px  * var(--ui));
  --ap-pad:     calc(12px  * var(--ui));
  --ap-gap:     calc(8px   * var(--ui));
  --ap-cut-w:   2px;
  --ap-bar-w:   3px;
  --ap-r-0:     0px;

  /* --------------------------------------------------------- registers
     THREE atlas sizes, not six. Datum lost points for needing upscaling;
     this needs none.
       R1  the 8x16 mono atlas.  The MACHINE's register: the apparatus,
           the outer-margin line numbers, every tabular figure, every
           label. If the machine said it, it is R1.
       R2  the proportional face on the same 16dp cell. The USER's
           register: running heads, prose, rail titles.
       R3  R2's bold. Same atlas, same size, one weight. Focused running
           head, table heads. Costs zero resampling.
       R4  the 16x32 mono atlas. Used for exactly two things: the sigla
           letters and the lock plate's clock.
     The 24x48 atlas is not used by this direction at all.               */
  --fs-r1: calc(11px * var(--ui));  --lh-r1: calc(16px * var(--ui));
  --fs-r2: calc(14px * var(--ui));  --lh-r2: calc(16px * var(--ui));
  --fs-r4: calc(21px * var(--ui));  --lh-r4: calc(24px * var(--ui));
  --tr-lab: calc(1px * var(--ui));

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ===================================================== design.h, dark ==
   IRON GALL INK, AND THE GROUND IS THE INK ITSELF. The page is what is
   left where the ink is not.

   This is not an inversion of the light block and it is not a stock
   near-black. Iron gall oxidises to a cool blue-green-black, so dark
   APPARATUS inverts the HUE TEMPERATURE as well as the value: a cool
   ground carrying warm bone-coloured marks, where Folio's dark is a warm
   ground carrying warm marks. Every surface here has B >= G > R; every
   mark has R > G > B. The two temperatures are what makes a bone letter
   on an ink ground read as a letter and not as a hole.

   Three consequences, all derived rather than chosen:

   1. THE WELL REVERSES SIGN, LIKE THE APPARATUS DOES NOT. On white wove
      a well is lighter (less ink). On an ink ground a well is lighter
      too - it is still less ink. So AP_WELL stays above AP_PAPER in both
      modes: dL* +3.41 on paper, +4.69 here. The apparatus band, which is
      MORE ink in both readings, stays below: dL* -2.81 / -3.49.
   2. THE DARKEST TEXT-BEARING SURFACE SWAPS ENDS. In light it is AP_APP
      and every ink is held to it. Here it is AP_WELL, the LIGHTEST
      surface, and every mark is held to that instead - AP_INK_3 is
      4.71:1 on AP_WELL, the mirror of light's 5.86:1 on AP_APP.
   3. THE CUT EDGE STAYS AP_INK_0 AND IS NOW A BONE LINE, 13.19:1 on the
      sheet against light's 16.20:1. Same role, same 2px, opposite pole -
      the occluder still draws it and the occluded still never does.   */
:root[data-theme="dark"] {
  --ap-paper:    #1A211E;   /* THE SHEET.        L* 12.0 */
  --ap-app:      #131A17;   /* apparatus band.   L*  8.5, dL* -3.49 */
  --ap-desk:     #0F1412;   /* THE GROUND.       L*  5.8 */
  --ap-well:     #232B27;   /* cut in the sheet. L* 16.7, dL* +4.69 */

  /* PARCH_0..3. ratios against the sheet first, then against AP_WELL,
     which is the surface every mark is held to in this mode.
     INK_0  13.19 : 1  /  11.68 : 1
     INK_1  10.60 : 1  /   9.38 : 1
     INK_2   6.87 : 1  /   6.08 : 1
     INK_3   5.32 : 1  /   4.71 : 1
     HAIR    1.73 : 1  /   1.53 : 1   NOT TEXT.                       */
  --ap-ink-0:    #EDE6D6;
  --ap-ink-1:    #D8CFBC;
  --ap-ink-2:    #B0A793;
  --ap-ink-3:    #9B9280;
  --ap-hair:     #3E4844;

  --ap-rule-2:   #EDE6D6;
  --ap-rule-1:   #3E4844;
  --ap-mark:     #EDE6D6;
  --ap-mark-2:   #B0A793;
  --ap-track:    #3E4844;
  --ap-inv-bg:   #EDE6D6;
  --ap-inv-0:    #1A211E;
  --ap-inv-1:    #3E4844;
  --ap-grid:     #3E4844;
  --ap-scrim:    #0F1412;
  --ap-knob:     #1A211E;
}

/* ============================================================== reset == */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--ap-desk);
  color: var(--ap-ink-1);
  font-family: var(--sans);
  font-size: var(--fs-r2);
  line-height: var(--lh-r2);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ========================================================== registers == */
.r1  { font-family: var(--mono); font-size: var(--fs-r1); line-height: var(--lh-r1);
       font-variant-numeric: tabular-nums; letter-spacing: 0; }
.r2  { font-family: var(--sans); font-size: var(--fs-r2); line-height: var(--lh-r2);
       font-weight: 400; }
.r3  { font-family: var(--sans); font-size: var(--fs-r2); line-height: var(--lh-r2);
       font-weight: 700; }
.r4  { font-family: var(--mono); font-size: var(--fs-r4); line-height: var(--lh-r4);
       font-weight: 700; font-variant-numeric: tabular-nums; }
.lab { font-family: var(--mono); font-size: var(--fs-r1); line-height: var(--lh-r1);
       text-transform: uppercase; letter-spacing: var(--tr-lab); }
.i0 { color: var(--ap-ink-0); } .i1 { color: var(--ap-ink-1); }
.i2 { color: var(--ap-ink-2); } .i3 { color: var(--ap-ink-3); }
.push { margin-left: auto; }
.rt { text-align: right; }

/* ======================================================= prototype bar ==
   This strip is NOT part of the design language - it is the harness that
   lets a reviewer reach every scene without clicking. It is set in the
   machine's own register so it does not pretend otherwise.              */
#strip {
  height: 24px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 12px; background: var(--ap-inv-bg); color: var(--ap-inv-1);
  font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
}
#strip .nm { color: var(--ap-inv-0); font-weight: 700; }
#strip .pitch { color: var(--ap-inv-1); letter-spacing: 0; text-transform: none;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#strip .links { margin-left: auto; display: flex; gap: 0; }
#strip .links a { padding: 0 8px; height: 24px; display: flex; align-items: center;
  text-transform: uppercase; }
#strip .links a.on { background: var(--ap-inv-0); color: var(--ap-inv-bg); font-weight: 700; }
#strip .thm { display: flex; gap: 0; align-items: center; }
#strip .tk { padding: 0 8px; height: 24px; display: flex; align-items: center;
  cursor: pointer; text-transform: uppercase; }
#strip .tk.on { background: var(--ap-inv-0); color: var(--ap-inv-bg); font-weight: 700; }
#strip .hint { color: var(--ap-inv-1); padding-left: 8px; }

/* =============================================================== shell == */
#os { position: absolute; inset: 24px 0 0 0; display: flex; background: var(--ap-desk); }

/* ====================================================== sigla register ==
   The rail is the SIGLA REGISTER. It is ordered TOP OF STACK FIRST, so
   reading order down the margin IS the z-order: A B C means A is on top.
   That is the ordinal half of the stacking answer, and it is the half you
   can read from across the room.                                        */
#rail {
  width: var(--ap-rail-w); flex: none; display: flex; flex-direction: column;
  background: var(--ap-desk);
  border-right: 2px solid var(--ap-rule-2);
  padding: 12px 0 8px 0;
}
#rail .brand { padding: 0 12px 12px 12px; }
#rail .brand .n { display: block; color: var(--ap-ink-0); }
#rail .brand .v { display: block; color: var(--ap-ink-3); }
#rail .sec { padding: 8px 12px 4px 12px; color: var(--ap-ink-3); }
#rail .hr { height: 1px; background: var(--ap-rule-1); margin: 4px 12px; flex: none; }
#rail .hr2 { height: 2px; background: var(--ap-rule-2); margin: 0 0 0 0; flex: none; }
#rail .list { overflow: hidden; }
.sig {
  display: flex; align-items: center; height: calc(24px * var(--ui));
  padding-right: 8px; cursor: pointer; position: relative;
}
.sig .bar { position: absolute; left: 0; top: 0; bottom: 0; width: var(--ap-bar-w);
  background: var(--ap-mark); opacity: 0; }
.sig .gl { width: var(--ap-sig-w); flex: none; text-align: center;
  color: var(--ap-ink-2); font-family: var(--mono); font-size: var(--fs-r1);
  line-height: var(--lh-r1); font-weight: 700; margin-left: calc(var(--ap-bar-w) + 5px); }
.sig .tt { color: var(--ap-ink-2); overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; }
.sig .st { margin-left: auto; color: var(--ap-ink-3); font-family: var(--mono);
  font-size: var(--fs-r1); }
.sig.on .bar { opacity: 1; }
.sig.on .gl { color: var(--ap-ink-0); font-size: var(--fs-r4); line-height: var(--lh-r1); }
.sig.on .tt { color: var(--ap-ink-0); font-weight: 700; }
.sig.held .gl, .sig.held .tt { color: var(--ap-ink-3); }
.sig:hover .tt { color: var(--ap-ink-0); }
.lch { display: flex; align-items: center; height: calc(22px * var(--ui));
  padding-left: calc(var(--ap-sig-w) + var(--ap-bar-w) + 5px); padding-right: 8px;
  cursor: pointer; color: var(--ap-ink-2); }
.lch:hover { color: var(--ap-ink-0); }
#wsrow { display: flex; margin: 4px 12px 0 12px; border: 1px solid var(--ap-rule-1); }
#wsrow .w { flex: 1; text-align: center; height: calc(20px * var(--ui)); cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--ap-ink-2);
  border-right: 1px solid var(--ap-rule-1); }
#wsrow .w:last-child { border-right: 0; }
#wsrow .w.on { background: var(--ap-inv-bg); color: var(--ap-inv-0); font-weight: 700; }
#readout { margin: 8px 12px 0 12px; }
#readout .rd { display: flex; justify-content: space-between; }
#readout .k { color: var(--ap-ink-3); }
#readout .v { color: var(--ap-ink-1); }

/* ================================================================ desk == */
#field { flex: 1; position: relative; overflow: hidden; background: var(--ap-desk); }
#gridsvg { position: absolute; inset: 0; pointer-events: none; }
#wins { position: absolute; inset: 0; }
#colophon { position: absolute; left: 0; right: 0; bottom: 0; height: 20px;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  color: var(--ap-ink-3); pointer-events: none; }
#deskapp { position: absolute; left: 16px; right: 16px; bottom: 20px;
  pointer-events: none; }
/* THE DESK'S OWN APPARATUS. The brief says the machine speaks only in the
   apparatus, in one register, at the foot. A notification is commentary on
   the DESK rather than on a sheet, so it is set exactly the same way: at
   the foot, opened by a 2px rule, in R1, in lemma form. There is no toast
   card, no colour and no shadow. */
#deskapp .dnote { display: flex; gap: 8px; align-items: baseline;
  color: var(--ap-ink-3); border-top: 1px solid var(--ap-rule-1); padding: 2px 0; }
#deskapp .dnote:first-child { border-top: 2px solid var(--ap-rule-2); }
#deskapp .dnote .lm { color: var(--ap-ink-1); }

/* =============================================================== sheet ==
   Every sheet is divided by two horizontal rules into three regions:

     1  RUNNING HEAD    28dp. Title, and the siglum flush right.
     2  TEXT BLOCK      the user's setting, with a 28dp OUTER MARGIN
                        COLUMN on its right carrying line numbers.
     3  APPARATUS       the machine's setting, on AP_APP stock, opened by
                        a 2px AP_INK_0 rule.

   Regions 2's margin and region 3 are RESERVED AT ALL TIMES, at their
   focused height. Opening the apparatus therefore reflows nothing: ink
   appears in air that was already there. That is the most detectable
   class of change at arm's length and it costs no relayout.            */
.sheet {
  position: absolute; display: flex; flex-direction: column;
  background: var(--ap-paper); color: var(--ap-ink-1);
  border: 1px solid var(--ap-rule-1);      /* the quiet mount, free edges */
  border-radius: var(--ap-r-0);
  overflow: hidden;
}
.sheet.hidden { display: none; }
.rhead {
  height: var(--ap-head-h); flex: none; display: flex; align-items: center;
  gap: 8px; padding: 0 var(--ap-pad); background: var(--ap-paper);
}
.rhead .ttl { color: var(--ap-ink-3); font-weight: 400; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; }
.rhead .sub { color: var(--ap-ink-3); font-family: var(--mono);
  font-size: var(--fs-r1); }
.rhead .sg { margin-left: auto; color: var(--ap-ink-3); font-family: var(--mono);
  font-size: var(--fs-r1); font-weight: 700; }
.rhead .ctls { display: flex; gap: 0; margin-left: 8px; }
.rhead .ctl { width: 20px; height: 20px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; color: var(--ap-ink-3); }
.rhead .ctl:hover { color: var(--ap-ink-0); }
.sheet.foc > .rhead .ttl { color: var(--ap-ink-0); font-weight: 700; }
.sheet.foc > .rhead .sg { color: var(--ap-ink-0); }
.sheet.foc > .rhead .ctl { color: var(--ap-ink-2); }
.hrule { height: 1px; flex: none; background: var(--ap-rule-1); }

.block { flex: 1; display: flex; min-height: 0; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column;
  padding: 8px var(--ap-pad) 8px var(--ap-pad); overflow: hidden; }
/* THE OUTER MARGIN COLUMN. 28dp, reserved always, blank until focus. The
   numbers are a ruler on the sheet's 16dp baseline, right-aligned and
   tabular, exactly as a critical edition sets them. */
.marg { width: var(--ap-marg-w); flex: none; position: relative;
  border-left: 1px solid var(--ap-rule-1); }
.marg .ln { position: absolute; right: 4px; color: var(--ap-ink-3);
  font-family: var(--mono); font-size: var(--fs-r1); line-height: var(--lh-r1);
  font-variant-numeric: tabular-nums; }

/* THE APPARATUS. Closed: one hair and a right-flush count. Open: a 2px
   AP_INK_0 rule, 1.69:1 -> 16.20:1, and the commentary set below it. */
.appx { height: var(--ap-app-h); flex: none; background: var(--ap-app);
  border-top: 1px solid var(--ap-rule-1); padding: 3px var(--ap-pad) 0 var(--ap-pad);
  display: flex; flex-direction: column; }
.sheet.foc > .appx { border-top: 2px solid var(--ap-rule-2); padding-top: 2px; }
.appx .cnt { margin-left: auto; color: var(--ap-ink-3); font-family: var(--mono);
  font-size: var(--fs-r1); line-height: var(--lh-r1); }
.appx .ent { display: flex; gap: 6px; align-items: baseline;
  font-family: var(--mono); font-size: var(--fs-r1); line-height: var(--lh-r1);
  color: var(--ap-ink-3); white-space: nowrap; overflow: hidden; }
.appx .ent .n  { color: var(--ap-ink-3); width: 2.2em; text-align: right; flex: none;
  font-variant-numeric: tabular-nums; }
.appx .ent .lm { color: var(--ap-ink-1); }
.appx .ent .br { color: var(--ap-ink-3); }
.appx .ent .cm { overflow: hidden; text-overflow: ellipsis; }

/* THE CUT EDGE. Where this sheet occludes another, it draws a 2px AP_INK_0
   rule along exactly the segments of its OWN outer boundary that lie over
   another sheet - nowhere else. The border you can see is drawn by the
   occluder, never by the occluded. An isolated sheet stays quiet at
   1.69:1; the instant anything overlaps, the contact boundary is 16.20:1.
   A sheet lying ENTIRELY INSIDE another has its whole boundary over that
   sheet, so all four edges draw: that is this mechanism's loudest case,
   not a blind spot. The genuinely silent case is a fully COVERED lower
   sheet, which has nothing to disambiguate; the sigla register covers it. */
.cuts { position: absolute; inset: 0; pointer-events: none; }
.cut { position: absolute; background: var(--ap-rule-2); }

/* =============================================================== parts == */
.well { background: var(--ap-well); border: 1px solid var(--ap-rule-1);
  padding: 6px 8px; }
.pre { font-family: var(--mono); font-size: var(--fs-r1); line-height: var(--lh-r1);
  white-space: pre; color: var(--ap-ink-1); }
.scroll { flex: 1; min-height: 0; overflow: hidden; }
.row { display: flex; align-items: baseline; gap: 8px; }
.stack { display: flex; flex-direction: column; }
.cols2 { display: flex; gap: 16px; flex: 1; min-height: 0; }
.cols2 > * { flex: 1; min-width: 0; overflow: hidden; }
.pt { padding-top: 8px; }
.col > .row, .col > .kv, .col > .met, .col > .gate, .col > .swatch,
.col > .trow, .col > .sld, .col > .tabs { flex: none; }
.hr2 { height: 2px; background: var(--ap-rule-2); flex: none; }
.hr1 { height: 1px; background: var(--ap-rule-1); flex: none; }
.vr { width: 1px; align-self: stretch; background: var(--ap-rule-1); }
.caret { display: inline-block; width: 6px; height: 12px; background: var(--ap-mark);
  vertical-align: -2px; }
body.blinkoff .caret { opacity: 0; }

table.tbl { width: 100%; border-collapse: collapse; table-layout: fixed;
  font-family: var(--mono); font-size: var(--fs-r1); line-height: var(--lh-r1);
  font-variant-numeric: tabular-nums; }
table.tbl th { text-align: left; font-weight: 700; color: var(--ap-ink-2);
  text-transform: uppercase; letter-spacing: var(--tr-lab);
  border-bottom: 1px solid var(--ap-rule-1); padding: 2px 6px 2px 0;
  font-family: var(--mono); font-size: var(--fs-r1); }
table.tbl th.rt { text-align: right; padding-right: 10px; }
table.tbl td { color: var(--ap-ink-1); padding: 2px 6px 2px 0;
  height: var(--ap-row-h); overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; }
table.tbl td.rt { text-align: right; padding-right: 10px; }
table.tbl tr.zeb:nth-child(even) td { background: var(--ap-app); }
table.tbl tr.zeb.sel td,
table.tbl tr.sel td { background: var(--ap-inv-bg); color: var(--ap-inv-0); }

<body>

<div id="strip">
  <span class="nm">APPARATUS</span>

  <span class="links" id="links"></span>

</div>

<div id="os">
  <div id="rail">
    <div class="brand">
      <span class="r3 n">zlOS</span>
      <span class="r1 v">0.3 x86_64</span>
    </div>
    <div class="hr2"></div>
    <div class="sec lab">sigla</div>
    <div class="list" id="sigla"></div>
    <div class="hr"></div>
    <div class="sec lab">launch</div>
    <div class="list" id="launch"></div>

  </div>

  <div id="field">
    <svg id="gridsvg" shape-rendering="crispEdges" aria-hidden="true"></svg>
    <div id="wins"></div>

    <div class="pf">
      <div class="ent r1" style="display:flex;gap:6px;color:var(--ap-ink-3)">
        <span style="color:var(--ap-ink-1)" id="pflem">command</span>
        <span>]</span><span id="pfcom"></span>
      </div>
    </div>
  </div>

  <div id="lock"></div>
  <div class="menu" id="ctxmenu"></div>
  <div class="menu" id="winmenu"></div>

<script>
'use strict';
/* ======================================================== primitives ==== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad2 = n => (n < 10 ? '0' : '') + n;
const hx = (n, w) => (n >>> 0).toString(16).toUpperCase().padStart(w || 8, '0');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const SIGLA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

/* --- contrast, computed rather than estimated -------------------------- */
function tokRaw(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function tokHex(n) { return tokRaw(n).toUpperCase(); }
function tokRGB(n) {
  const h = tokRaw(n).replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function relLum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
function ratio(a, b) {
  const la = relLum(tokRGB(a)), lb = relLum(tokRGB(b));
  return ((Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05));
}
function lstar(n) {
  const y = relLum(tokRGB(n));
  return y > 0.008856 ? 116 * Math.pow(y, 1 / 3) - 16 : 903.3 * y;
}

/* ============================================================= state ==== */
const S = {
  scene: 'desktop', theme: 'light', ws: 1, focus: null, wins: {},
  cols: 12, rows: 8, gut: 8, ui: 1,
  appLines: 3, lnEvery: 5, cutW: 2, grid: true, cutOn: true,
  margAlways: false, appStock: true, siglaBar: true, zebra: true,
  fileSel: 5, procSel: 2, setTab: 0, calcAcc: '241690',
  pq: '', psel: 0,
  clock: 22 * 3600 + 41 * 60 + 7, up: 4211,
  cpu: [61, 38, 74, 22], memPct: 62, load: 0.41, rx: 84.7, tx: 12.4,
  hist: { cpu: [], mem: [], net: [] }
};
for (let i = 0; i < 64; i++) {
  S.hist.cpu.push(30 + Math.round(38 * Math.abs(Math.sin(i / 5.2)) + (i % 7) * 2));
  S.hist.mem.push(52 + Math.round(12 * Math.abs(Math.sin(i / 8.1))) + (i % 3));
  S.hist.net.push(10 + Math.round(58 * Math.abs(Math.sin(i / 3.7))) + (i % 5) * 3);
}

/* ============================================== THE CUT EDGE, and its ===
 * GOLDEN. The one change this direction was told to make is that the
 * hosttest golden comes FIRST, because an occlusion bug here is 2px of
 * black at 16:1 in the wrong place - the loudest possible failure mode.
 * So the geometry lives in one pure function over a z-ordered rect list,
 * it is asserted against four hand-computed cases at load, and the result
 * is printed in the settings sheet where it cannot be ignored.
 *
 * RULE. For sheet W, for each of W's four boundary lines, emit the
 * sub-segments of that line whose points lie inside SOME sheet below W.
 * Coordinates returned are LOCAL to W, so wm.c can hand them straight to
 * fb_fill_px. Integer arithmetic only; no new primitive; nothing is
 * computed at all when nothing overlaps.
 */
function mergeSegs(list) {
  const s = list.filter(a => a[1] > a[0]).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const seg of s) {
    if (out.length && seg[0] <= out[out.length - 1][1]) {
      out[out.length - 1][1] = Math.max(out[out.length - 1][1], seg[1]);
    } else out.push([seg[0], seg[1]]);
  }
  return out;
}
/* R is {x,y,w,h}; below is an array of {x,y,w,h} strictly under R. */
function cutSegments(R, below) {
  const spanH = py => mergeSegs(below
    .filter(b => py >= b.y && py <= b.y + b.h - 1)
    .map(b => [Math.max(R.x, b.x), Math.min(R.x + R.w, b.x + b.w)]))
    .map(s => [s[0] - R.x, s[1] - R.x]);
  const spanV = px => mergeSegs(below
    .filter(b => px >= b.x && px <= b.x + b.w - 1)
    .map(b => [Math.max(R.y, b.y), Math.min(R.y + R.h, b.y + b.h)]))
    .map(s => [s[0] - R.y, s[1] - R.y]);
  return {
    top:    spanH(R.y),
    bottom: spanH(R.y + R.h - 1),
    left:   spanV(R.x),
    right:  spanV(R.x + R.w - 1)
  };
}
/* ---- the golden. four cases, sixteen assertions, run before anything ---- */
const GOLDEN = (function () {
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const cases = [];
  let pass = 0, total = 0;
  function C(name, note, R, below, want) {
    const got = cutSegments(R, below);
    const res = ['top', 'bottom', 'left', 'right'].map(k => {
      total++;
      const ok = eq(got[k], want[k]);
      if (ok) pass++;
      return { k, ok, got: got[k], want: want[k] };
    });
    cases.push({ name, note, ok: res.every(r => r.ok), res });
  }
  /* 1. DISJOINT. Nothing touches, so nothing is drawn: the mechanism
        costs zero until two sheets actually meet. */
  C('disjoint', 'nothing drawn until two sheets touch',
    { x: 200, y: 0, w: 100, h: 100 }, [{ x: 0, y: 0, w: 100, h: 100 }],
    { top: [], bottom: [], left: [], right: [] });
  /* 2. OVERLAP. The classic corner. Only the two edges that lie over the
        lower sheet are inked, and only for the length that does. */
  C('overlap', 'two edges inked, and only where they cross',
    { x: 50, y: 50, w: 100, h: 100 }, [{ x: 0, y: 0, w: 100, h: 100 }],
    { top: [[0, 50]], bottom: [], left: [[0, 50]], right: [] });
  /* 3. CONTAINED. The case the direction wrongly called its blind spot.
        A sheet entirely inside another has its WHOLE boundary over that
        sheet, so all four edges draw. It is the loudest case, not silent. */
  C('contained', 'all four edges draw: the loudest case, not the silent one',
    { x: 50, y: 50, w: 100, h: 100 }, [{ x: 0, y: 0, w: 200, h: 200 }],
    { top: [[0, 100]], bottom: [[0, 100]], left: [[0, 100]], right: [[0, 100]] });
  /* 4. COVERED. The genuinely silent case: a lower sheet completely under
        an upper one draws nothing, and needs nothing - it is not visible.
        Rank is carried by the sigla register instead. */
  C('covered', 'the lower sheet draws nothing, and needs nothing',
    { x: 50, y: 50, w: 100, h: 100 }, [],
    { top: [], bottom: [], left: [], right: [] });
  return { cases, pass, total, ok: pass === total };
})();
console.log('[apparatus] cut-edge golden ' + GOLDEN.pass + '/' + GOLDEN.total +
  ' assertions ' + (GOLDEN.ok ? 'PASS' : 'FAIL'), GOLDEN.cases);

/* ============================================================== icons ===
 * Geometric, drawn as geometry, on a 24 grid with every vertex on a
 * multiple of 3. No image, no emoji, one weight. They appear in exactly
 * one place - the launch list - because a scholarly page does not use
 * pictures where a word will do.
 */
const ICON = {
  shell: 'M4 6 L10 12 L4 18 M12 18 L20 18',
  files: 'M3 6 H10 L12 9 H21 V19 H3 Z',
  mon:   'M3 18 L8 10 L12 15 L16 6 L21 13',
  edit:  'M4 5 H20 M4 10 H16 M4 15 H20 M4 20 H12',
  log:   'M4 6 H20 M4 11 H20 M4 16 H14 M4 21 H18',
  hex:   'M4 5 H10 V11 H4 Z M14 5 H20 V11 H14 Z M4 14 H10 V20 H4 Z M14 14 H20 V20 H14 Z',
  calc:  'M4 4 H20 V20 H4 Z M4 10 H20 M10 10 V20 M16 10 V20',
  net:   'M12 4 V20 M4 8 H20 M4 16 H20 M12 4 C6 9 6 15 12 20 C18 15 18 9 12 4',
  clock: 'M12 4 A8 8 0 1 0 12 20 A8 8 0 1 0 12 4 M12 8 V12 L15 15',
  chip:  'M7 7 H17 V17 H7 Z M4 10 H7 M4 14 H7 M17 10 H20 M17 14 H20 M10 4 V7 M14 4 V7 M10 17 V20 M14 17 V20',
  set:   'M4 8 H20 M4 16 H20 M9 5 V11 M15 13 V19',
  disk:  'M3 7 A9 3 0 1 0 21 7 A9 3 0 1 0 3 7 M3 7 V17 A9 3 0 0 0 21 17 V7',
  proc:  'M4 5 H20 V10 H4 Z M4 14 H20 V19 H4 Z',
  regs:  'M4 6 H20 M4 12 H20 M4 18 H20 M9 3 V21 M15 3 V21'
};
function icon(n, px) {
  const p = ICON[n] || ICON.chip;
  return '<svg width="' + (px || 14) + '" height="' + (px || 14) + '" viewBox="0 0 24 24" ' +
    'fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="' + p + '"/></svg>';
}
const CTL_MIN = '<svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="8" width="10" height="1" fill="currentColor"/></svg>';
const CTL_MAX = '<svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
const CTL_CLS = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>';

/* ========================================================== fragments === */
function TH(cols) {
  return '<tr>' + cols.map(c => '<th' + (c.r ? ' class="rt"' : '') +
    (c.w ? ' style="width:' + c.w + '"' : '') + '>' + (c.h || '') + '</th>').join('') + '</tr>';
}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => {
    if (c && typeof c === 'object') return '<td' + (c.r ? ' class="rt"' : '') + '>' + c.t + '</td>';
    return '<td>' + c + '</td>';
  }).join('') + '</tr>';
}
function TBL(head, rows) {
  const z = S.zebra ? rows.map(r => r.replace('<tr ', '<tr class="zeb" ').replace('<tr class="zeb" class="', '<tr class="zeb ')) : rows;
  return '<table class="tbl"><thead>' + TH(head) + '</thead><tbody>' + z.join('') + '</tbody></table>';
}
function KV(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function MET(k, v, unit, sec) {
  const p = Math.max(0, Math.min(100, v));
  return '<div class="met' + (sec ? ' sec' : '') + '"><div class="lr"><span class="k">' + k +
    '</span><span class="v">' + v + (unit || '') + '</span></div>' +
    '<div class="tk"><i style="width:' + p + '%"></i></div></div>';
}
function PLOT(series, max) {
  const mean = series.reduce((a, b) => a + b, 0) / series.length;
  return '<div class="plot">' + series.map(v =>
    '<i class="' + (v > mean ? 'hi' : '') + '" style="height:' + Math.max(2, Math.round(v / max * 100)) + '%"></i>').join('') + '</div>';
}
function PRE(lines) {
  return '<div class="pre">' + lines.map(l => esc(l)).join('\n') + '</div>';
}

R.hex = () => {
  const base = 0x0011A4C0;
  const seed = [0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, 0x01, 0x00];
  const rows = [];
  for (let r = 0; r < 20; r++) {
    const b = [];
    let asc = '';
    for (let i = 0; i < 16; i++) {
      const v = (r === 0 && i < 8) ? seed[i] : ((r * 37 + i * 11 + 0x21) & 0xff);
      b.push(hx(v, 2));
      asc += (v >= 32 && v < 127) ? String.fromCharCode(v) : '.';
    }
    rows.push(TR([hx(base + r * 16, 8), b.slice(0, 8).join(' '), b.slice(8).join(' '), esc(asc)],
      r === 0 ? 'class="sel"' : ''));
  }
  return '<div class="row"><span class="lab i3">device</span>' +
    '<span class="r1 i1">/dev/rd0</span>' +
    '<span class="lab i3">offset</span><span class="r1 i1">0x' + hx(base) + '</span>' +
    '<span class="r1 i3 push">width 16 · ascii pane</span></div>' +
    '<div class="hr2"></div>' +
    '<div class="scroll">' + TBL([{ h: 'address', w: '17%' }, { h: '00 .. 07', w: '28%' },
      { h: '08 .. 0f', w: '28%' }, { h: 'ascii', w: '27%' }], rows) + '</div>' +
    '<div class="hr1"></div>' +
    '<div class="row pt"><span class="lab i3">signature</span>' +
    '<span class="r1 i0">7F 45 4C 46</span>' +

};

  const i = Math.max(0, steps.indexOf(val));

  return '<div class="sld"><span class="kk">' + key.label + '</span>' +

    '<b style="left:calc(' + p + '% - 2px)"></b></span>' +

  return '<div class="trow"><span class="sw' + (S[k] ? ' on' : '') + '" data-tog="' + k + '"><i></i></span>' +
    '<span class="tx"><span class="n r2">' + label + '</span> ' +

}
function SWATCH(name, role) {
  const bg = (S.theme === 'dark') ? '--ap-well' : '--ap-app';
  const isSurface = /paper|app|desk|well/.test(name);
  const against = isSurface ? '--ap-ink-1' : bg;

  return '<div class="swatch"><span class="chip" style="background:var(--' + name + ')"></span>' +

/* ============================================================= grid ==== */
let GRID = { W: 0, H: 0, mar: 16, gut: 8, colW: [], colX: [], rowH: [], rowY: [] };
function computeGrid() {
  const f = $('#field');
  const W = f.clientWidth, H = Math.max(0, f.clientHeight - 20);
  const gut = Math.max(2, Math.round(S.gut * S.ui));
  const mar = gut * 2;
  const NC = S.cols, NR = S.rows;
  const aw = W - 2 * mar - (NC - 1) * gut, ah = H - 2 * mar - (NR - 1) * gut;
  const cwB = Math.floor(aw / NC), cwR = aw - cwB * NC;
  const rhB = Math.floor(ah / NR), rhR = ah - rhB * NR;
  const colW = [], colX = [], rowH = [], rowY = [];
  let x = mar;
  for (let i = 0; i < NC; i++) { const w = cwB + (i < cwR ? 1 : 0); colW.push(w); colX.push(x); x += w + gut; }
  let y = mar;
  for (let i = 0; i < NR; i++) { const h = rhB + (i < rhR ? 1 : 0); rowH.push(h); rowY.push(y); y += h + gut; }
  GRID = { W, H, mar, gut, colW, colX, rowH, rowY, cwB, rhB };
}
function modRect(c, r, cw, rh) {
  const g = GRID;
  c = Math.max(0, Math.min(S.cols - 1, c)); r = Math.max(0, Math.min(S.rows - 1, r));
  cw = Math.max(1, Math.min(S.cols - c, cw)); rh = Math.max(1, Math.min(S.rows - r, rh));
  let w = 0, h = 0;
  for (let i = 0; i < cw; i++) w += g.colW[c + i];
  w += g.gut * (cw - 1);
  for (let i = 0; i < rh; i++) h += g.rowH[r + i];
  h += g.gut * (rh - 1);
  return { x: g.colX[c], y: g.rowY[r], w, h, c, r, cw, rh };
}
function drawGrid() {
  const svg = $('#gridsvg'), g = GRID;
  svg.setAttribute('width', g.W); svg.setAttribute('height', g.H + 20);
  if (!S.grid) { svg.innerHTML = ''; return; }
  let s = '';
  g.colX.forEach((x, i) => {
    s += '<rect x="' + x + '" y="' + g.mar + '" width="1" height="' + (g.H - 2 * g.mar) + '" fill="var(--ap-grid)"/>';
    s += '<rect x="' + (x + g.colW[i] - 1) + '" y="' + g.mar + '" width="1" height="' + (g.H - 2 * g.mar) + '" fill="var(--ap-grid)"/>';
  });
  s += '<rect x="' + g.mar + '" y="' + g.mar + '" width="' + (g.W - 2 * g.mar) + '" height="1" fill="var(--ap-grid)"/>';
  s += '<rect x="' + g.mar + '" y="' + (g.H - g.mar - 1) + '" width="' + (g.W - 2 * g.mar) + '" height="1" fill="var(--ap-grid)"/>';
  svg.innerHTML = s;
}

/* ==================================================== window manager === */
let ZTOP = 10;
function zlist(ws) {
  return Object.values(S.wins).filter(w => w.ws === (ws || S.ws)).sort((a, b) => b.z - a.z);
}
function siglumOf(id) {
  const l = zlist(S.wins[id] ? S.wins[id].ws : S.ws);
  const i = l.findIndex(w => w.id === id);
  return i < 0 ? '·' : SIGLA[i % 26];
}
function openWin(id, place, ws) {
  const a = APP[id];
  if (!a) return;
  if (S.wins[id]) { S.wins[id].min = false; focusWin(id); return; }
  const p = place || a.p;
  S.wins[id] = { id, ws: ws || S.ws, c: p[0], r: p[1], cw: p[2], rh: p[3],
    det: false, x: 0, y: 0, w: 0, h: 0, min: false, max: false, prev: null, z: ++ZTOP,
    _x: 0, _y: 0, _w: 0, _h: 0 };
  buildWin(id);
  focusWin(id);
}
function closeWin(id) {
  const e = $('.sheet[data-id="' + id + '"]');
  if (e) e.remove();
  delete S.wins[id];
  if (S.focus === id) { const r = zlist().filter(w => !w.min); S.focus = r.length ? r[0].id : null; }
  layout(); renderRail();
}
function focusWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].z = ++ZTOP; S.wins[id].min = false; S.focus = id;
  layout(); renderRail(); redrawHeads();
}
function minWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].min = true;
  if (S.focus === id) { const r = zlist().filter(w => !w.min); S.focus = r.length ? r[0].id : null; }
  layout(); renderRail(); redrawHeads();
  note('minimise', APP[id].name + ' held, siglum kept in the register');
}
function maxWin(id) {
  const w = S.wins[id];
  if (!w) return;
  if (w.max) { Object.assign(w, w.prev); w.max = false; }
  else {
    w.prev = { c: w.c, r: w.r, cw: w.cw, rh: w.rh, det: w.det, x: w.x, y: w.y, w: w.w, h: w.h };
    w.c = 0; w.r = 0; w.cw = S.cols; w.rh = S.rows; w.det = false; w.max = true;
  }
  focusWin(id);
}
function buildWin(id) {
  const a = APP[id];
  const e = document.createElement('div');
  e.className = 'sheet';
  e.setAttribute('data-id', id);
  e.innerHTML =
    '<div class="rhead">' +
      '<span class="r2 ttl">' + a.name + '</span>' +
      '<span class="sub">' + a.sub + '</span>' +
      '<span class="sg" data-act="winmenu">' + siglumOf(id) + '</span>' +
      '<span class="ctls">' +
        '<span class="ctl" data-act="min">' + CTL_MIN + '</span>' +
        '<span class="ctl" data-act="max">' + CTL_MAX + '</span>' +
        '<span class="ctl" data-act="close">' + CTL_CLS + '</span>' +
      '</span>' +
    '</div>' +
    '<div class="hrule"></div>' +
    '<div class="block"><div class="col"></div><div class="marg"></div></div>' +
    '<div class="appx"></div>' +
    '<div class="cuts"></div>';
  $('#wins').appendChild(e);
  redraw(id);
}
function redraw(id) {
  const w = S.wins[id];
  if (!w) return;
  const e = $('.sheet[data-id="' + id + '"]');
  if (!e) return;

function redrawHeads() {

/* THE APPARATUS, painted. Closed is a count; open is the commentary. */

/* THE OUTER MARGIN, painted. A ruler on the sheet's 16 dp baseline. */
function paintMargin(id) {
  const e = $('.sheet[data-id="' + id + '"]');
  if (!e) return;

  const foc = S.focus === id;

  }

/* THE CUT EDGE, painted. See cutSegments() and its golden above. */
function paintCuts() {
  const vis = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => a.z - b.z);
  vis.forEach((w, i) => {
    const e = $('.sheet[data-id="' + w.id + '"]');
    if (!e) return;
    const host = $(':scope > .cuts', e);
    if (!S.cutOn) { host.innerHTML = ''; return; }
    const R0 = { x: w._x, y: w._y, w: w._w, h: w._h };
    const below = vis.slice(0, i).map(b => ({ x: b._x, y: b._y, w: b._w, h: b._h }));
    const seg = cutSegments(R0, below);
    const cw = S.cutW;
    let s = '';
    seg.top.forEach(g => { s += '<i class="cut" style="left:' + g[0] + 'px;top:0;width:' + (g[1] - g[0]) + 'px;height:' + cw + 'px"></i>'; });
    seg.bottom.forEach(g => { s += '<i class="cut" style="left:' + g[0] + 'px;bottom:0;width:' + (g[1] - g[0]) + 'px;height:' + cw + 'px"></i>'; });
    seg.left.forEach(g => { s += '<i class="cut" style="top:' + g[0] + 'px;left:0;height:' + (g[1] - g[0]) + 'px;width:' + cw + 'px"></i>'; });
    seg.right.forEach(g => { s += '<i class="cut" style="top:' + g[0] + 'px;right:0;height:' + (g[1] - g[0]) + 'px;width:' + cw + 'px"></i>'; });
    host.innerHTML = s;
  });
}

function layout() {
  computeGrid();
  drawGrid();
  Object.values(S.wins).forEach(w => {
    const e = $('.sheet[data-id="' + w.id + '"]');
    if (!e) return;
    const vis = w.ws === S.ws && !w.min;
    e.classList.toggle('hidden', !vis);
    let x, y, ww, hh;
    if (w.det) { x = w.x; y = w.y; ww = w.w; hh = w.h; }
    else {
      const r = modRect(w.c, w.r, w.cw, w.rh);
      x = r.x; y = r.y; ww = r.w; hh = r.h;
      w.c = r.c; w.r = r.r; w.cw = r.cw; w.rh = r.rh;
    }
    w._x = Math.round(x); w._y = Math.round(y); w._w = Math.round(ww); w._h = Math.round(hh);
    e.style.left = w._x + 'px'; e.style.top = w._y + 'px';
    e.style.width = w._w + 'px'; e.style.height = w._h + 'px';
    e.style.zIndex = String(w.z);
    e.classList.toggle('foc', w.id === S.focus);
  });
  paintCuts();
  Object.keys(S.wins).forEach(paintMargin);
  renderColophon();
}

    /* measure while the plate is still stretched by the flex parent, THEN
       pin it: reading a flex:1 box that has been told not to stretch gives
       zero, and a zero scale silently empties the whole collation. */
    const bw = host.clientWidth, bh = host.clientHeight;
    const k = Math.min(bw / g.W, bh / g.H);

      hit.setAttribute('data-ovpick', w.id);

    });

/* ================================================================ tick = */
function hhmmss(s) {
  s = ((s % 86400) + 86400) % 86400;
  return pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
}
function walk(v, lo, hi, amp) {
  v += (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, v));
}
function tick() {
  S.clock++; S.up++;
  S.cpu = S.cpu.map(v => Math.round(walk(v, 4, 98, 14)));
  S.memPct = Math.round(walk(S.memPct, 45, 88, 3));
  S.load = Number(walk(S.load, 0.05, 3.2, 0.22).toFixed(2));
  S.rx = Number(walk(S.rx, 1, 240, 24).toFixed(1));
  S.tx = Number(walk(S.tx, 0.4, 90, 9).toFixed(1));
  S.hist.cpu.push(Math.round(S.cpu.reduce((a, b) => a + b, 0) / 4)); S.hist.cpu.shift();
  S.hist.mem.push(S.memPct); S.hist.mem.shift();
  S.hist.net.push(Math.round(S.rx / 3)); S.hist.net.shift();
  document.body.classList.toggle('blinkoff', (S.clock % 2) === 0);
  renderRail(); renderColophon();
  ['mon', 'net', 'clock', 'sys', 'proc'].forEach(id => { if (S.wins[id]) redraw(id); });
  if ($('#lock').classList.contains('on')) renderLock();
}

function tileAll() {
  const l = zlist().filter(w => !w.min).reverse();
  const n = l.length;
  if (!n) return;
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
  const rows = Math.ceil(n / cols);
  l.forEach((w, i) => {
    const cx = i % cols, ry = Math.floor(i / cols);
    w.det = false; w.max = false;
    w.c = Math.round(cx * S.cols / cols);
    w.cw = Math.round((cx + 1) * S.cols / cols) - w.c;
    w.r = Math.round(ry * S.rows / rows);
    w.rh = Math.round((ry + 1) * S.rows / rows) - w.r;
  });
  layout();
}
function calcKey(k) {
  if (k === 'clr') { S.calcAcc = '0'; return; }
  if (k === 'eq') { S.calcAcc = String(parseInt(S.calcAcc, 10) || 0); return; }
  if (/^[0-9]$/.test(k)) { S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k; return; }
  if (k === 'hex' || k === 'dec' || k === 'bin') return;
}

    SL = { k: sd.getAttribute('data-sld'), el: sd };
    setSlider(ev);
    const up = () => { SL = null; document.removeEventListener('mousemove', setSlider); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', setSlider);
    document.addEventListener('mouseup', up);
    return;
  }
  const tb = t.closest('[data-tab]');
  if (tb) { ev.preventDefault(); S.setTab = Number(tb.getAttribute('data-tab')); redraw('set'); return; }
  /* --- inside a sheet -------------------------------------------------- */
  const sh = t.closest('.sheet:not(.spec)');
  if (sh) {
    const id = sh.getAttribute('data-id');
    if (S.focus !== id) focusWin(id);
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.getAttribute('data-act'), g = act.getAttribute('data-arg');
      ev.preventDefault();
      if (a === 'close') { closeWin(id); return; }
      if (a === 'min') { minWin(id); return; }
      if (a === 'max') { maxWin(id); return; }
      if (a === 'winmenu') {
        const r = act.getBoundingClientRect();
        $('#winmenu').setAttribute('data-for', id);
        showMenu($('#winmenu'), r.left - 100, r.bottom + 2, WINMENU, 'sheet ' + siglumOf(id) + ' · ' + APP[id].name);
        return;
      }
      if (a === 'open') { openWin(g); return; }
      if (a === 'file') { S.fileSel = Number(g); redraw('files'); redraw('edit'); return; }
      if (a === 'proc') { S.procSel = Number(g); redraw('mon'); redraw('proc'); return; }
      if (a === 'calc') { calcKey(g); redraw('calc'); return; }
      if (a === 'toast') { note(g === 'build' ? 'make' : g, g === 'build' ?
        'exit 0 · 11 objects · 2.418 s' : 'uid 0 gid 0 · generation 3 · contiguous'); return; }
    }
    const hd = t.closest('.rhead');
    if (hd) { ev.preventDefault(); startDrag(ev, id, sh); return; }
    return;
  }
  /* --- the desk -------------------------------------------------------- */
  if (t.closest('#field')) {
    if (ev.button === 2) return;
    S.focus = null; layout(); renderRail(); redrawHeads();
  }
});
document.addEventListener('contextmenu', ev => {
  const sh = ev.target.closest('.sheet:not(.spec)');
  ev.preventDefault();
  if (sh) {
    const id = sh.getAttribute('data-id');
    focusWin(id);
    $('#winmenu').setAttribute('data-for', id);
    showMenu($('#winmenu'), ev.clientX, ev.clientY, WINMENU, 'sheet ' + siglumOf(id) + ' · ' + APP[id].name);
  } else if (ev.target.closest('#field')) {
    showMenu($('#ctxmenu'), ev.clientX, ev.clientY, DESKMENU, 'the desk');
  }
});
function setSlider(ev) {
  if (!SL) return;
  const r = SL.el.getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  const steps = { ui: UI_STEPS, cols: COL_STEPS, gut: GUT_STEPS,
    appLines: LINE_STEPS, lnEvery: EVERY_STEPS, cutW: CUT_STEPS }[SL.k];
  const v = steps[Math.round(f * (steps.length - 1))];
  if (S[SL.k] === v) return;
  S[SL.k] = v;
  applyMetrics();
  redrawAll(); redrawHeads(); renderRail();
}
function startDrag(ev, id, el) {
  const w = S.wins[id];
  if (!w || w.max) return;
  const sx = ev.clientX, sy = ev.clientY;
  const r = modRect(w.c, w.r, w.cw, w.rh);
  const ox = w.det ? w.x : r.x, oy = w.det ? w.y : r.y;
  const ow = w.det ? w.w : r.w, oh = w.det ? w.h : r.h;
  let moved = false;
  function move(e) {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    moved = true;
    w.det = true; w.w = ow; w.h = oh;
    w.x = Math.max(0, Math.min(GRID.W - ow, ox + dx));
    w.y = Math.max(0, Math.min(GRID.H - oh, oy + dy));
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    if (moved) note('drag', APP[id].name + ' detached at ' + Math.round(w.x) + ',' + Math.round(w.y) + ' px');
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

/* ============================================================ keyboard = */
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); ev.preventDefault(); return; }
    if (k === 'Enter') { runPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowDown') { S.psel++; renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    if (k.length === 1 && !ev.ctrlKey && !ev.metaKey) { S.pq += k; S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    return;
  }
  if (ev.shiftKey && (k === 'D' || k === 'd')) { setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if (ev.ctrlKey && k === ' ') { setScene(overviewOn() ? 'desktop' : 'overview'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'l' || k === 'L')) { setScene('lock'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'g' || k === 'G')) { S.grid = !S.grid; drawGrid(); redraw('set'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'e' || k === 'E')) { S.cutOn = !S.cutOn; layout(); redraw('set'); note('cut edge', S.cutOn ? 'armed at ' + S.cutW + ' px' : 'disarmed'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 't' || k === 'T')) { tileAll(); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'w' || k === 'W')) { if (S.focus) closeWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'f' || k === 'F')) { if (S.focus) maxWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'm' || k === 'M')) { if (S.focus) minWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === '1' || k === '2')) {
    S.ws = Number(k);
    const l = zlist().filter(w => !w.min);
    S.focus = l.length ? l[0].id : null;
    layout(); renderRail(); redrawHeads(); ev.preventDefault(); return;
  }
  if (k === 'Tab' && !ev.ctrlKey) {
    const l = zlist().filter(w => !w.min);
    if (l.length > 1) { focusWin(l[1].id); note('cycle', 'siglum A is now ' + APP[l[1].id].name); }
    ev.preventDefault(); return;
  }
  if (k === 'Escape') {
    if ($('#lock').classList.contains('on')) { setScene('desktop'); return; }
    if (overviewOn()) { setScene('desktop'); return; }
    hideMenus();
  }
});

/* =============================================================== stock =
 * Two primitive ladders, one set of role names. Setting data-theme is the
 * ONLY switch: no rule weight, no metric, no radius and no reserved region
 * differs between the two. */
const STOCK = {
  light: { name: 'wove', other: 'gall',
    pitch: 'a scholarly text with a critical apparatus. white wove, one ink, ' +
           'line numbers in the outer margin, the machine at the foot.' },
  dark: { name: 'gall', other: 'wove',
    pitch: 'iron gall ink, and the ground is the ink itself. a cool blue green ' +
           'black carrying warm bone marks. the page is what the ink left.' }
};
function applyTheme() {
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = STOCK[S.theme].pitch;
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-stock="light">wove</span>' +
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-stock="dark">gall</span>';
}
function hashName() { return S.scene + (S.theme === 'dark' ? '-dark' : ''); }
function setStock(t, announce) {
  const next = t === 'dark' ? 'dark' : 'light';
  if (next === S.theme) return;
  S.theme = next;
  applyTheme(); renderLinks(); renderColophon(); redraw('set'); redrawAll(); redrawHeads();
  if ($('#lock').classList.contains('on')) renderLock();
  if (overviewOn()) showOverview(true);
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    note('stock', S.theme === 'dark'
      ? 'iron gall · AP_PAPER ' + tokHex('--ap-paper') + ' · marks ' + ratio('--ap-ink-0', '--ap-paper').toFixed(2) + ':1'
      : 'white wove · AP_PAPER ' + tokHex('--ap-paper') + ' · ink ' + ratio('--ap-ink-0', '--ap-paper').toFixed(2) + ':1');
  }
}
const SCENE_NAMES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function renderLinks() {
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#links').innerHTML = SCENE_NAMES.map(n => '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  markLinks(S.scene);
}
function markLinks(name) {
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-dark$/, '') === name));
}

/* ============================================================== scenes = */
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.sheet[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZTOP = 10;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#deskapp').innerHTML = '';
}
function place(id, c, r, cw, rh, ws) { openWin(id, [c, r, cw, rh], ws || S.ws); }
function baseDesktop() {
  clearAll();
  S.ws = 1;
  place('shell', 0, 0, 7, 4);
  place('files', 7, 0, 5, 4);
  place('mon', 0, 4, 7, 4);
  place('net', 7, 4, 5, 4);
  place('log', 0, 0, 7, 4, 2);
  place('regs', 7, 0, 5, 5, 2);
  place('hex', 0, 4, 12, 4, 2);
  /* Three sheets deliberately overlapping, because the cut edge is this
     direction's whole technical claim and a tiled screenshot hides it.
     SYSTEM sits over MONITOR and FILES; PROCESSES sits entirely inside
     SYSTEM, which is the case the direction wrongly called a blind spot
     and which in fact draws all four of its edges at full contrast. */
  openWin('sys', [2, 1, 7, 5]);
  layout();
  let r = modRect(2, 1, 7, 5);
  Object.assign(S.wins.sys, { det: true, x: r.x + 22, y: r.y + 18, w: r.w, h: r.h });
  openWin('proc', [3, 2, 5, 3]);
  layout();
  const s = S.wins.sys;
  Object.assign(S.wins.proc, { det: true, x: s.x + 48, y: s.y + 74, w: s.w - 108, h: s.h - 132 });
  focusWin('proc');
  layout();
}
function setScene(name, push, quiet) {
  let dark = false;
  if (/-dark$/.test(name)) { dark = true; name = name.slice(0, -5); }
  if (SCENE_NAMES.indexOf(name) < 0) { name = 'desktop'; dark = false; }
  const wasWs = S.ws;
  S.scene = name;
  S.theme = dark ? 'dark' : 'light';
  applyTheme(); renderLinks();
  if (push !== false && location.hash.slice(1) !== hashName()) {
    history.replaceState(null, '', '#' + hashName());
  }
  markLinks(name);
  if (quiet) { showOverview(false); showPalette(false); showLock(false); layout(); renderRail(); return; }
  if (name === 'desktop') {
    baseDesktop();
    note('compose', '5 sheets on workspace 01 · cut edge ' + S.cutW + ' px · golden ' + GOLDEN.pass + '/' + GOLDEN.total);
  } else if (name === 'overview') {
    baseDesktop(); layout(); showOverview(true);
  } else if (name === 'palette') {
    baseDesktop(); S.pq = 'cut'; S.psel = 0; showPalette(true);
  } else if (name === 'files') {
    clearAll(); S.ws = 1;
    place('files', 0, 0, 5, 8);
    place('edit', 5, 0, 7, 8);
    S.fileSel = 5;
    redraw('files'); redraw('edit');
    focusWin('edit'); layout();
    note('select', 'fb.c 68.4 KiB · opened in the text editor');
  } else if (name === 'monitor') {
    clearAll(); S.ws = 1;
    place('mon', 0, 0, 7, 8);
    place('net', 7, 0, 5, 4);
    place('disk', 7, 4, 5, 4);
    focusWin('mon'); layout();
    note('sample', 'monitor, network and disk at 1 Hz · 64 s history');
  } else if (name === 'settings') {
    clearAll(); S.ws = 1;
    place('sys', 7, 0, 5, 8);
    place('set', 0, 0, 7, 8);
    S.setTab = 0;
    redraw('set');
    focusWin('set'); layout();
  } else if (name === 'lock') {
    baseDesktop(); showLock(true);
  }
  if (wasWs !== S.ws) renderRail();
  renderRail(); redrawHeads(); renderColophon();
}
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
window.addEventListener('resize', () => {
  layout(); redrawHeads();
  if (overviewOn()) showOverview(true);
  if ($('#lock').classList.contains('on')) renderLock();
});

/* =============================================================== start = */
applyTheme();
applyMetrics();
computeGrid();
setScene(location.hash.slice(1) || 'desktop', false);
setInterval(tick, 1000);
</script>
