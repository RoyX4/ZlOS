<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPER BLEND / zlOS living prototype</title>
<style>
/* ======================================================================
   THE PAPER BLEND - a per-axis decision, not an average of four directions.

   Ground polarity ....... PAPER primary, dual ladder, both real   [PLATE]
   Material law .......... one material, inversion as a STATE      [PLATE]
                           Datum's two-material law is NOT taken.
   Window boundary ....... 2px ink frame, all four sides           [PLATE]
   Depth rank ............ rule weight, two values                 [PLATE]
   Focus signal .......... knockout header, solid ink              [PLATE]
   Colour policy ......... one structural ink, vermilion, 4 jobs   [PLATE]
                           Folio's zero-colour law is OUT. Stated below.
   Arrangement ........... tile onto a ruled module grid           [PLATE]
   Type hierarchy ........ two sizes, case + weight + tracking     [PLATE]
   Instrumentation ....... printer's slug + FULL machine record    [PLATE + DATUM]
                           raster strip, per-window us, memory ruler
   Motion ................ CUT 0ms, SLIDE 100ms linear            [PLATE]
                           Datum's strip is re-clocked to DAMAGE, not to frames.

   The blend is PLATE's structure carrying Datum's instrumentation. That is
   the only pair in the ten-axis matrix where an entire axis position moves
   across intact: instrumentation is mono text in bands that already exist,
   it touches no surface value, no boundary token, no radius, no focus signal
   and no colour. Everything else here is PLATE, because on a paper ground
   PLATE's answers are the ones that survive their own stated costs.
   ====================================================================== */
:root {
  /* ============================================================ design.h
     Every colour in this document is one of these tokens. No hex value is
     used as a CSS value anywhere outside this block and its dark twin.
     Every name below exists in BOTH modes; a name in one mode only is a
     defect and the settings sheet checks for it at runtime. ----------- */
  --zd-paper:        #F2EFE6;  /* THE SHEET.  window interior, menu, modal */
  --zd-desk:         #E4E0D5;  /* THE FIELD.  substrate behind the sheets  */
  --zd-well:         #D6D0C0;  /* SUNKEN.     inputs, tracks, log wells    */
  --zd-fill:         #CEC8B8;  /* TINT.       zebra rows. CARRIES TEXT.    */
  --zd-rule-1:       #5C574C;  /* the 1px rule: rows, cells, group edges   */
  --zd-rule-2:       #14120E;  /* the 2px rule: frames, region boundaries  */
  --zd-plate-0:      #14120E;  /* THE INK PLATE. rail, raster strip ground */
  --zd-plate-1:      #2A2721;  /* second plate. terminal ground.           */
  --zd-text-0:       #14120E;  /* emphasis ink                             */
  --zd-text-1:       #26231D;  /* BODY ink. the root colour.               */
  --zd-text-4:       #585349;  /* secondary. units, slug, inactive.        */
  --zd-text-5:       #595344;  /* label. tracked uppercase.                */
  --zd-text-6:       #5E5848;  /* hint. placeholders, timestamps.          */
  --zd-ok:           #1C5F34;
  --zd-warn:         #734B00;
  --zd-bad:          #A31D11;
  --zd-ok-ko:        #5FC07E;
  --zd-warn-ko:      #E5B14A;
  --zd-bad-ko:       #FF8E76;
  --zd-grid-line:    #A69E8A;  /* the printed module grid on the desk      */
  /* the four second inks. ZD_ACCENT is exactly one of them at a time. */
  --zd-ink-verm:     #B7311A;
  --zd-ink-verm-ko:  #D14A2E;
  --zd-ink-ox:       #A31D11;
  --zd-ink-ox-ko:    #FF8E76;
  --zd-ink-press:    #1F6B3A;
  --zd-ink-press-ko: #5FC07E;
  --zd-ink-ochre:    #7D5200;
  --zd-ink-ochre-ko: #E5B14A;
  --zd-text-4-ko:    #A69E8A;  /* secondary, knocked out on the plate      */
  --zd-rule-1-ko:    #46413A;  /* the 1px rule ON the plate                */

  /* ---------------------------------------------------- role splits ----
     INV  - the SHEET inversion. Light: a sheet goes to ink. Dark: a sheet
            goes to clear film. The emphatic transient: focused header,
            selected row, pressed button, on segment, menu hover.
     RINV - the PLATE inversion. A rail row going the other way.
     KO   - text set on the permanent plate (rail, strip, lock, menu head).
     MARK - a solid graphic that IS the datum: meter fill, slider fill,
            switch knob, ruler region, scrollbar thumb. ----------------- */
  --zd-inv-bg:    #14120E;
  --zd-inv-0:     #F2EFE6;
  --zd-inv-1:     #E4E0D5;
  --zd-rule-inv:  #46413A;
  --zd-rinv-bg:   #F2EFE6;
  --zd-rinv-0:    #14120E;
  --zd-rinv-1:    #5C574C;
  --zd-ko-0:      #F2EFE6;
  --zd-ko-1:      #E4E0D5;
  --zd-mark:      #14120E;
  --zd-mark-bulk: #14120E;
  --zd-knob:      #F2EFE6;
  --zd-knob-edge: #14120E;
  --zd-on-accent: #F2EFE6;
  --zd-ok-inv:    #5FC07E;
  --zd-warn-inv:  #E5B14A;
  --zd-bad-inv:   #FF8E76;

  --zd-accent:    var(--zd-ink-verm);
  --zd-accent-ko: var(--zd-ink-verm-ko);

  /* -------------------------------------------- the instrument bands ---
     NEW IN THE BLEND. Datum's three instruments, re-tokenised onto PLATE's
     ladder. They are ink-plate furniture, so their inks are the knockout
     ramp. Nothing here is a new PRIMITIVE - the strip is fb_fill_px, the
     ruler is fb_rect plus fb_rule, the per-window band is fb_text_role. */
  --zd-strip-bg:    #14120E;  /* raster strip ground = the ink plate      */
  --zd-strip-track: #3A342B;  /* the 16 667 us budget line, 1.52:1        */
  --zd-strip-0:     #A69E8A;  /* a composite under budget,   7.02:1       */
  /* over budget uses ZD_WARN_KO 9.55:1, over 2x uses ZD_BAD_KO 8.36:1,
     and the word is spelled out beside the colour in every case. */
  --zd-ruler-use:   #14120E;  /* usable RAM        12.15:1 on the track   */
  --zd-ruler-krn:   #2A2721;  /* kernel image, heap, arenas   9.67:1      */
  --zd-ruler-rsv:   #7E7767;  /* reserved and firmware        2.89:1      */
  --zd-ruler-mmio:  #B0A996;  /* device MMIO windows          1.52:1      */
  --zd-ruler-bg:    #D6D0C0;  /* free / unmapped = the well               */

  /* ---------------------------------------------------------- metrics */
  --ui: 1;
  --zd-rail-w:   calc(148px * var(--ui));
  --zd-slug-h:   calc(28px  * var(--ui));
  --zd-strip-h:  calc(34px  * var(--ui));
  --zd-ruler-h:  calc(38px  * var(--ui));
  --zd-title-h:  calc(28px  * var(--ui));
  --zd-band-h:   calc(20px  * var(--ui));
  --zd-row-h:    calc(24px  * var(--ui));
  --zd-cell-h:   calc(20px  * var(--ui));
  --zd-pad:      calc(12px  * var(--ui));
  --zd-gap:      calc(8px   * var(--ui));
  --zd-r-0: 0px;
  --zd-r-2: 2px;
  --zd-track-label: calc(2px * var(--ui));
  --zd-track-th:    calc(1px * var(--ui));
  --zd-track-plate: calc(4px * var(--ui));
  --fs-data:  calc(11px * var(--ui));
  --lh-data:  calc(16px * var(--ui));
  --fs-label: calc(11px * var(--ui));
  --fs-body:  calc(15px * var(--ui));
  --lh-body:  calc(22px * var(--ui));
  --fs-plate: calc(22px * var(--ui));
  --lh-plate: calc(26px * var(--ui));

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ==================================================== design.h, dark ===
   THE PROCESS NEGATIVE, inherited from PLATE's own dark derivation and
   extended to cover the three instrument bands.

   1. FILM BASE IS NOT BLACK. Every surface keeps R > G > B on the warm
      axis the paper had, so the direction's hue survives inversion.
   2. DENSITY REACHES NEITHER END. Nothing here is #000000 and nothing is
      #FFFFFF, because base-plus-fog exists.
   3. KNOCKOUT BECOMES CLEARING. On paper the emphatic move is an ink plate
      with the title knocked out; on film it is emulsion cleared to Dmin
      with the title standing in density. Same operation, opposite pole.
   4. THE RAIL AND THE STRIP STAY DMAX. Inverting them literally would make
      the two largest pieces of permanent chrome the brightest objects on
      screen. Both take Dmax #0A0906; only the transient knockout clears.
   5. RULES DROP ONE RUNG, WEIGHT UNCHANGED. 2px 16.27 -> 5.50, 1px 6.25 ->
      2.40, desk grid 2.02 -> 1.70.
   6. THE SECOND INK IS RE-PICKED, NOT LIGHTENED. #B7311A falls to 1.9:1 on
      film; #E8734F is the same hue opened up, 4.81:1 on the sheet.
   7. THE RULER INVERTS ITS SENSE AND SAYS SO. On paper a mapped region is
      INKED and free space is the bare well. On film a mapped region is
      where the emulsion was EXPOSED, so it is the light one: ZD_RULER_USE
      becomes the screened value #A7A191 at 4.18:1 on the track. A large
      tonal area is halftoned in this mode, never solid - the same rule that
      holds meter fills at 5.60:1 instead of 9.00:1.
   ------------------------------------------------------------------- */
:root[data-theme="dark"] {
  --zd-paper:        #2E2921;
  --zd-desk:         #201C16;
  --zd-well:         #433D31;
  --zd-fill:         #4A4237;
  --zd-rule-1:       #6A6256;
  --zd-rule-2:       #AB9E8D;
  --zd-plate-0:      #0A0906;
  --zd-plate-1:      #16130D;
  --zd-text-0:       #E5DBC6;
  --zd-text-1:       #D0C7B5;
  --zd-text-4:       #B8B09F;
  --zd-text-5:       #B8AFA3;
  --zd-text-6:       #B1A89D;
  --zd-ok:           #6AC28D;
  --zd-warn:         #D5AA53;
  --zd-bad:          #EF9B84;
  --zd-ok-ko:        #68C88F;
  --zd-warn-ko:      #DEAF4F;
  --zd-bad-ko:       #F8977F;
  --zd-grid-line:    #474239;
  --zd-ink-verm:     #E8734F;
  --zd-ink-verm-ko:  #EF8460;
  --zd-ink-ox:       #E4705C;
  --zd-ink-ox-ko:    #EB8270;
  --zd-ink-press:    #4FB673;
  --zd-ink-press-ko: #5FC482;
  --zd-ink-ochre:    #C79A34;
  --zd-ink-ochre-ko: #D6A945;
  --zd-text-4-ko:    #827E70;
  --zd-rule-1-ko:    #554D44;

  --zd-inv-bg:    #F4E9D5;
  --zd-inv-0:     #14120E;
  --zd-inv-1:     #443D31;
  --zd-rule-inv:  #A79F91;
  --zd-rinv-bg:   #F4E9D5;
  --zd-rinv-0:    #14120E;
  --zd-rinv-1:    #443D31;
  --zd-ko-0:      #DCD4C2;
  --zd-ko-1:      #A49D90;
  --zd-mark:      #D5CBBC;
  --zd-mark-bulk: #A7A191;
  --zd-knob:      #DAD2C1;
  --zd-knob-edge: #2E2921;
  --zd-on-accent: #1A160F;
  --zd-ok-inv:    #1C5F34;
  --zd-warn-inv:  #734B00;
  --zd-bad-inv:   #A31D11;

  --zd-accent:    var(--zd-ink-verm);
  --zd-accent-ko: var(--zd-ink-verm-ko);

  --zd-strip-bg:    #0A0906;
  --zd-strip-track: #3A3223;
  --zd-strip-0:     #A29C8C;
  --zd-ruler-use:   #A7A191;
  --zd-ruler-krn:   #8A8474;
  --zd-ruler-rsv:   #635D50;
  --zd-ruler-mmio:  #544E42;
  --zd-ruler-bg:    #433D31;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--zd-desk); font-family: var(--sans);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--zd-well); border-left: 1px solid var(--zd-rule-1); }
::-webkit-scrollbar-thumb { background: var(--zd-mark); border-radius: var(--zd-r-0); }

/* ============================================================ type ====
   Two sizes in ordinary use. Hierarchy is CASE, WEIGHT, TRACKING and RULE
   WEIGHT. Four exhaustive styles: DATA, LABEL, BODY, PLATE. --------- */
.t-data { font-family: var(--mono); font-size: var(--fs-data); line-height: var(--lh-data);
          font-weight: 400; color: var(--zd-text-1); font-variant-numeric: tabular-nums; }
.t-label{ font-family: var(--sans); font-size: var(--fs-label); line-height: var(--lh-data);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-track-label);
          margin-right: calc(-1 * var(--zd-track-label)); color: var(--zd-text-5); }
.t-body { font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body);
          font-weight: 400; color: var(--zd-text-1); }
.t-plate{ font-family: var(--sans); font-size: var(--fs-plate); line-height: var(--lh-plate);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-track-plate);
          margin-right: calc(-1 * var(--zd-track-plate)); color: var(--zd-text-0); }
.t-plate-m { font-family: var(--mono); font-size: calc(44px * var(--ui));
          line-height: calc(52px * var(--ui)); font-weight: 700; color: var(--zd-text-0);
          font-variant-numeric: tabular-nums; letter-spacing: var(--zd-track-plate); }
.ink0 { color: var(--zd-text-0); } .ink4 { color: var(--zd-text-4); }
.ink6 { color: var(--zd-text-6); } .ink1 { color: var(--zd-text-1); }
.ko   { color: var(--zd-ko-0); } .ko-d { color: var(--zd-ko-1); }
.ko-4 { color: var(--zd-text-4-ko); }
.w-ok { color: var(--zd-ok); } .w-warn { color: var(--zd-warn); } .w-bad { color: var(--zd-bad); }
.k-ok { color: var(--zd-ok-ko); } .k-warn { color: var(--zd-warn-ko); } .k-bad { color: var(--zd-bad-ko); }
.acc  { color: var(--zd-accent); }
.bold { font-weight: 700; }

/* ==================================================== page furniture == */
#strip {
  position: fixed; left: 0; right: 0; top: 0; height: 28px; z-index: 400;
  background: var(--zd-plate-0); border-bottom: 2px solid var(--zd-accent);
  display: flex; align-items: stretch; padding-left: 12px;
}
#strip .nm { display: flex; align-items: center; color: var(--zd-ko-0); }
#strip .pitch { padding: 0 14px; color: var(--zd-text-4-ko); font-family: var(--mono);
  font-size: 11px; white-space: nowrap; overflow: hidden; min-width: 0;
  text-overflow: ellipsis; display: block; line-height: 28px; }
#strip .links { margin-left: auto; display: flex; }
#strip a { display: flex; align-items: center; padding: 0 10px; text-decoration: none;
  border-left: 1px solid var(--zd-rule-1-ko); color: var(--zd-text-4-ko);
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; }
#strip a.on { background: var(--zd-rinv-bg); color: var(--zd-rinv-0); }
#strip .thm { display: flex; align-items: stretch; }
#strip .thm .tk { display: flex; align-items: center; padding: 0 10px; cursor: pointer;
  border-left: 1px solid var(--zd-rule-1-ko); color: var(--zd-text-4-ko);
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px; }
#strip .thm .tk.on { background: var(--zd-rinv-bg); color: var(--zd-rinv-0); }
#strip .thm .thint { display: flex; align-items: center; padding: 0 10px;
  border-left: 1px solid var(--zd-rule-1-ko); color: var(--zd-text-4-ko);
  font-family: var(--mono); font-size: 11px; white-space: nowrap; }

#os { position: fixed; left: 0; right: 0; top: 28px; bottom: 0;
      background: var(--zd-desk); overflow: hidden; }

/* ============================================================ rail ==== */
#rail { position: absolute; left: 0; top: 0; bottom: 0; width: var(--zd-rail-w);
        background: var(--zd-plate-0); display: flex; flex-direction: column; z-index: 30;
        border-right: 2px solid var(--zd-rule-2); }
.ident { padding: calc(10px * var(--ui)) var(--zd-pad) calc(8px * var(--ui)); }
.ident .t-plate { color: var(--zd-ko-0); display: block; }
.ident .build { color: var(--zd-text-4-ko); display: block; }
.accrule { height: 2px; background: var(--zd-accent-ko); flex: none; }
.sect { padding: calc(8px * var(--ui)) var(--zd-pad) calc(4px * var(--ui));
        color: var(--zd-text-4-ko); display: block; flex: none; }
#reg { overflow-y: auto; overflow-x: hidden; flex: 0 1 auto; }
.reg { position: relative; height: var(--zd-row-h); display: flex; align-items: center;
       padding-left: var(--zd-pad); border-bottom: 1px solid var(--zd-rule-1-ko); cursor: pointer; }
.reg .mk { position: absolute; left: 0; top: 0; bottom: 1px; width: 3px; background: transparent; }
.reg.run  .mk { background: var(--zd-accent-ko); }
.reg.hold .mk { background: var(--zd-accent-ko); top: 35%; bottom: 35%; }
.reg.foc  .mk { background: var(--zd-accent); }
.reg .nn { color: var(--zd-text-4-ko); width: calc(20px * var(--ui)); flex: none; }
.reg .rn { color: var(--zd-ko-0); overflow: hidden; white-space: nowrap; }
.reg .us { margin-left: auto; padding-right: calc(6px * var(--ui));
           color: var(--zd-text-4-ko); flex: none; }
.reg.off .rn { color: var(--zd-text-4-ko); }
.reg.foc { background: var(--zd-rinv-bg); }
.reg.foc .nn, .reg.foc .us { color: var(--zd-rinv-1); }
.reg.foc .rn { color: var(--zd-rinv-0); }
.reg:hover:not(.foc) { background: var(--zd-plate-1); }

.wsbar { display: flex; flex: none; border-top: 1px solid var(--zd-rule-1-ko);
         border-bottom: 1px solid var(--zd-rule-1-ko); }
.wsc { flex: 1; height: var(--zd-row-h); display: flex; align-items: center; justify-content: center;
       border-right: 1px solid var(--zd-rule-1-ko); cursor: pointer; }
.wsc:last-child { border-right: 0; }
.wsc .t-label { color: var(--zd-text-4-ko); }
.wsc.on { background: var(--zd-rinv-bg); }
.wsc.on .t-label { color: var(--zd-rinv-0); }
.wscount { display: flex; flex: none; padding: calc(2px * var(--ui)) 0; }
.wscount > span { flex: 1; text-align: center; }
.readout { margin-top: auto; padding-bottom: calc(10px * var(--ui)); flex: none; }
.rd { display: flex; align-items: baseline; padding: 0 var(--zd-pad); }
.rd .k { color: var(--zd-text-4-ko); }
.rd .v { color: var(--zd-ko-0); margin-left: auto; }

/* ============================================================ slug ==== */
#slug { position: absolute; left: var(--zd-rail-w); right: 0; top: 0; height: var(--zd-slug-h);
        background: var(--zd-desk); border-bottom: 1px solid var(--zd-rule-1); z-index: 20;
        display: flex; align-items: center; padding: 0 var(--zd-pad) 0 calc(16px * var(--ui)); }
#slug .line { color: var(--zd-text-4); white-space: nowrap; overflow: hidden; }
#slug .rm { margin-left: auto; padding-left: 12px; display: flex; cursor: pointer; flex: none; }

/* ==================================================== raster strip ====
   DATUM, taken whole and re-clocked. One column per COMPOSITE, not one per
   frame: the compositor is damage driven, so a machine nobody is touching
   produces no composites and the strip stands still. Datum's own version
   advances per frame forever, which is 215 993 wakeups an hour at rest on
   a 59.998 Hz panel - the exact standing tax Datum deleted ZD_MS_PULSE to
   avoid. Re-clocking is the only change made to it. ------------------ */
#raster { position: absolute; left: var(--zd-rail-w); right: 0; top: var(--zd-slug-h);
          height: var(--zd-strip-h); background: var(--zd-strip-bg); z-index: 20;
          border-bottom: 2px solid var(--zd-rule-2);
          display: flex; align-items: stretch; }
#raster .rlab { display: flex; flex-direction: column; justify-content: center; flex: none;
                padding: 0 calc(10px * var(--ui)); border-right: 1px solid var(--zd-rule-1-ko); }
#raster .rlab .t-label { color: var(--zd-ko-0); }
#raster .rlab .t-data { color: var(--zd-text-4-ko); line-height: calc(13px * var(--ui)); }
#rasterplot { flex: 1; min-width: 0; position: relative; }
#rasterplot svg { display: block; }
#raster .rout { display: flex; align-items: center; gap: calc(10px * var(--ui)); flex: none;
                padding: 0 calc(10px * var(--ui)); border-left: 1px solid var(--zd-rule-1-ko); }
#raster .rout .t-data { color: var(--zd-text-4-ko); }
#raster .rout .v { color: var(--zd-ko-0); }

/* =========================================================== field ==== */
#field { position: absolute; left: var(--zd-rail-w); right: 0;
         top: calc(var(--zd-slug-h) + var(--zd-strip-h));
         bottom: var(--zd-ruler-h);
         background: var(--zd-desk); overflow: hidden; }
#gridsvg { position: absolute; left: 0; top: 0; pointer-events: none; }
#legend { position: absolute; left: calc(32px * var(--ui)); bottom: calc(2px * var(--ui));
          color: var(--zd-text-6); pointer-events: none; }
#wins { position: absolute; inset: 0; }

/* ==================================================== memory ruler ====
   DATUM's third instrument. The whole address space along the bottom edge,
   to scale, on the desk rather than on a sheet - it describes the machine,
   not a document. Region identity is value plus a 1px rule plus a spelled
   label, never value alone: the neighbouring tints run 1.26 to 3.35:1 and
   the rule is what actually separates them. That is PLATE's depth model
   doing the work, not a fifth channel. ------------------------------- */
#ruler { position: absolute; left: var(--zd-rail-w); right: 0; bottom: 0;
         height: var(--zd-ruler-h); background: var(--zd-desk);
         border-top: 2px solid var(--zd-rule-2); z-index: 20;
         display: flex; flex-direction: column;
         padding: calc(3px * var(--ui)) var(--zd-pad) 0 calc(16px * var(--ui)); }
#rulerbar { height: calc(14px * var(--ui)); position: relative; flex: none;
            border: 1px solid var(--zd-rule-1); background: var(--zd-ruler-bg); }
#rulerbar > i { position: absolute; top: 0; bottom: 0; display: block; }
#rulerbar > i.sep { border-left: 1px solid var(--zd-rule-1); }
#rulerbar > u { position: absolute; top: calc(-3px * var(--ui)); bottom: calc(-3px * var(--ui));
                width: 1px; background: var(--zd-accent); }
#rulercap { display: flex; align-items: center; flex: none; overflow: hidden;
            height: calc(16px * var(--ui)); gap: calc(10px * var(--ui)); }
#rulercap .t-data { color: var(--zd-text-6); white-space: nowrap; }
#rulercap .sw { width: calc(9px * var(--ui)); height: calc(9px * var(--ui));
                border: 1px solid var(--zd-rule-1); flex: none; display: inline-block;
                margin-right: calc(4px * var(--ui)); vertical-align: -1px; }

/* ========================================================== window ==== */
.win { position: absolute; background: var(--zd-paper); border: 2px solid var(--zd-rule-2);
       border-radius: var(--zd-r-0); display: flex; flex-direction: column; overflow: hidden;
       transition: left 100ms linear, top 100ms linear, width 100ms linear, height 100ms linear; }
.win.drag { transition: none; }
.win.hidden { display: none; }
.focusbar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--zd-accent); z-index: 4; pointer-events: none; }
.hdr { height: var(--zd-title-h); flex: none; display: flex; align-items: center;
       gap: calc(8px * var(--ui)); padding-left: calc(8px * var(--ui)); background: var(--zd-paper);
       border-bottom: 2px solid var(--zd-rule-2); color: var(--zd-text-4); cursor: default;
       user-select: none; }
.hdr .ttl { color: var(--zd-text-4); flex: none; white-space: nowrap; }
.hdr .sub { color: var(--zd-text-6); flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.hdr .coord { color: var(--zd-text-6); flex: none; margin-left: auto; white-space: nowrap; }
.hdr .ico { color: var(--zd-text-4); flex: none; cursor: pointer;
            width: calc(24px * var(--ui)); height: calc(24px * var(--ui)); }
.ctls { display: flex; height: 100%; flex: none; margin-left: calc(6px * var(--ui)); }
.ctl { width: calc(20px * var(--ui)); display: flex; align-items: center; justify-content: center;
       border-left: 1px solid var(--zd-rule-1); color: inherit; cursor: pointer; }
.ctl:hover { background: var(--zd-paper); color: var(--zd-text-0); }
.ctl.x:hover { background: var(--zd-accent); color: var(--zd-on-accent); }
/* THE KNOCKOUT. 12.17 % of a 445x460 sheet's pixels change state, and it
   is the loudest move available on a paper ground. It costs nothing here
   because nothing else in the blend wanted the header band. */
.win.foc .hdr { background: var(--zd-inv-bg); border-bottom: 0; padding-left: calc(11px * var(--ui)); }
.win.foc .hdr .ttl { color: var(--zd-inv-0); }
.win.foc .hdr .sub { color: var(--zd-inv-1); }
.win.foc .hdr .coord { color: var(--zd-inv-1); }
.win.foc .hdr .ico { color: var(--zd-inv-0); }
.win.foc .ctl { color: var(--zd-inv-0); border-left-color: var(--zd-rule-inv); }
.win.foc .ctl:hover { background: var(--zd-paper); color: var(--zd-text-0); }
.win.foc .ctl.x:hover { background: var(--zd-accent); color: var(--zd-on-accent); }
.body { flex: 1; min-height: 0; padding: var(--zd-pad); display: flex; flex-direction: column;
        overflow: hidden; }
.win.foc .body { padding-left: calc(15px * var(--ui)); }
/* the per-window status band. mono in a band the sheet already had. */
.band { height: var(--zd-band-h); flex: none; display: flex; align-items: center;
        gap: calc(8px * var(--ui)); padding: 0 calc(8px * var(--ui));
        border-top: 1px solid var(--zd-rule-1); background: var(--zd-paper); overflow: hidden; }
.win.foc .band { padding-left: calc(11px * var(--ui)); }
.band .t-data { color: var(--zd-text-6); white-space: nowrap; }
.band .v { color: var(--zd-text-1); }
.band .sp { margin-left: auto; }
.dtab { position: absolute; right: 0; bottom: var(--zd-band-h); height: calc(16px * var(--ui));
        background: var(--zd-accent); display: flex; align-items: center; padding: 0 6px; z-index: 3; }
.dtab .t-label { color: var(--zd-on-accent); }

/* ======================================================== primitives == */
.scroll { overflow: auto; min-height: 0; flex: 1; }
.hr1 { height: 1px; background: var(--zd-rule-1); flex: none; }
.hr2 { height: 2px; background: var(--zd-rule-2); flex: none; }
.vr1 { width: 1px; background: var(--zd-rule-1); align-self: stretch; flex: none; }
.row { display: flex; align-items: center; gap: var(--zd-gap); flex: none; overflow: hidden; }
.row > .t-label, .row > .t-data, .kv > .t-label { white-space: nowrap; }
.spread { margin-left: auto; }
.pad-t { margin-top: var(--zd-gap); }

.well { background: var(--zd-well); border: 1px solid var(--zd-rule-1);
        border-radius: var(--zd-r-0); padding: calc(6px * var(--ui)) calc(8px * var(--ui)); }
.plate { background: var(--zd-plate-1); padding: calc(6px * var(--ui)) calc(8px * var(--ui));
         border-radius: var(--zd-r-0); }
.plate .t-data { color: var(--zd-ko-0); }
.plate .dim { color: var(--zd-ko-1); }

.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th { text-align: left; height: var(--zd-cell-h); padding: 0 calc(4px * var(--ui));
          border-bottom: 1px solid var(--zd-rule-1); white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis;
          font-family: var(--sans); font-size: var(--fs-label); font-weight: 700;
          text-transform: uppercase; letter-spacing: var(--zd-track-th); color: var(--zd-text-5); }
.tbl td { height: var(--zd-cell-h); padding: 0 calc(4px * var(--ui));
          border-bottom: 1px solid var(--zd-rule-1); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis;
          font-family: var(--mono); font-size: var(--fs-data); line-height: var(--lh-data);
          color: var(--zd-text-1); font-variant-numeric: tabular-nums; }
.tbl th.r, .tbl td.r { text-align: right; }
.zeb .tbl tbody tr:nth-child(even) td { background: var(--zd-fill); }
.zeb .tbl tbody tr.sel td, .tbl tr.sel td { background: var(--zd-inv-bg); color: var(--zd-inv-0); }
.tbl tr.sel td .ink4, .tbl tr.sel td .ink6 { color: var(--zd-inv-1); }
.tbl tr.sel td .w-ok { color: var(--zd-ok-inv); }
.tbl tr.sel td .w-warn { color: var(--zd-warn-inv); }
.tbl tr.sel td .w-bad { color: var(--zd-bad-inv); }
.tbl tr.pick { cursor: pointer; }
.tbl tr.pick:hover:not(.sel) td { background: var(--zd-well); }

.btn { height: calc(22px * var(--ui)); padding: 0 calc(10px * var(--ui)); display: inline-flex;
       align-items: center; border: 1px solid var(--zd-rule-1); border-radius: var(--zd-r-0);
       background: var(--zd-paper); cursor: pointer; flex: none; }
.btn .t-label { color: var(--zd-text-1); }
.btn:hover { background: var(--zd-well); }
.btn:active, .btn.down { background: var(--zd-inv-bg); border-color: var(--zd-inv-bg); }
.btn:active .t-label, .btn.down .t-label { color: var(--zd-inv-0); }
.btn.prim { background: var(--zd-accent); border-color: var(--zd-accent); }
.btn.prim .t-label { color: var(--zd-on-accent); }
.btn.prim:hover { background: var(--zd-accent); }

.seg { display: flex; background: var(--zd-well); border: 1px solid var(--zd-rule-1);
       border-radius: var(--zd-r-0); flex: none; }
.seg > span { flex: 1; height: calc(22px * var(--ui)); display: flex; align-items: center;
       justify-content: center; background: var(--zd-fill); border-right: 1px solid var(--zd-rule-1);
       cursor: pointer; }
.seg > span:last-child { border-right: 0; }
.seg > span .t-label { color: var(--zd-text-1); }
.seg > span.on { background: var(--zd-inv-bg); }
.seg > span.on .t-label { color: var(--zd-inv-0); }

.meter { margin-bottom: calc(6px * var(--ui)); flex: none; }
.mrow { display: flex; align-items: baseline; }
.mrow .t-data { margin-left: auto; color: var(--zd-text-0); font-weight: 700; }
.track { height: calc(10px * var(--ui)); background: var(--zd-well);
         border: 1px solid var(--zd-rule-1); border-radius: var(--zd-r-0); }
.track > i { display: block; height: 100%; background: var(--zd-mark-bulk); border-radius: var(--zd-r-0); }
.track > i.warn { background: var(--zd-warn); }
.track > i.bad  { background: var(--zd-bad); }

.ctlrow { min-height: calc(28px * var(--ui)); display: flex; align-items: center; flex: none;
          border-bottom: 1px solid var(--zd-rule-1); }
.ctlrow .right { margin-left: auto; display: flex; align-items: center; gap: calc(10px * var(--ui)); }
.sw2 { width: calc(32px * var(--ui)); height: calc(16px * var(--ui)); background: var(--zd-well);
      border: 1px solid var(--zd-rule-2); border-radius: var(--zd-r-0); position: relative;
      cursor: pointer; flex: none; }
.sw2 > i { position: absolute; left: 1px; top: 1px; width: calc(12px * var(--ui));
          height: calc(12px * var(--ui)); background: var(--zd-mark); border-radius: var(--zd-r-2); }
.sw2.on { background: var(--zd-mark); }
.sw2.on > i { left: auto; right: 1px; background: var(--zd-inv-0); }
.slider { position: relative; width: calc(180px * var(--ui)); height: calc(16px * var(--ui));
          display: flex; align-items: center; cursor: pointer; flex: none; }
.slider .st { position: absolute; left: 0; right: 0; height: calc(8px * var(--ui));
              background: var(--zd-well); border: 1px solid var(--zd-rule-1); border-radius: var(--zd-r-0); }
.slider .sf { position: absolute; left: 1px; top: calc(50% - (4px * var(--ui)) + 1px);
              height: calc(6px * var(--ui)); background: var(--zd-mark-bulk); border-radius: var(--zd-r-0); }
.slider .sh { position: absolute; top: 0; width: calc(8px * var(--ui)); height: calc(16px * var(--ui));
              background: var(--zd-knob); border: 2px solid var(--zd-knob-edge); border-radius: var(--zd-r-2); }
.slider .tick { position: absolute; top: calc(16px * var(--ui)); width: 1px;
                height: calc(3px * var(--ui)); background: var(--zd-rule-1); }
.swatchrow { display: flex; gap: var(--zd-gap); flex: none; }
.swatch { display: block; width: calc(56px * var(--ui)); height: calc(26px * var(--ui)); cursor: pointer;
          border: 1px solid var(--zd-rule-1); border-radius: var(--zd-r-0); position: relative; }
.swatch.on { border: 2px solid var(--zd-rule-2); }
.swatch.on::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
                    background: var(--zd-on-accent); }
.dot { width: calc(8px * var(--ui)); height: calc(8px * var(--ui)); border-radius: var(--zd-r-2);
       background: var(--zd-mark); flex: none; }
.caret { display: inline-block; width: calc(7px * var(--ui)); height: var(--lh-data);
         background: var(--zd-text-0); vertical-align: text-bottom; }
.plate .caret { background: var(--zd-ko-0); }
.blinkon .caret { animation: bl 500ms steps(1, end) infinite; }
@keyframes bl { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

.plotbox { position: relative; flex: 1; min-height: calc(40px * var(--ui));
           max-height: calc(420px * var(--ui));
           background: var(--zd-well); border: 1px solid var(--zd-rule-1); overflow: hidden; }
.plotbox svg { display: block; }
.meanline { position: absolute; left: 0; right: 0; height: 1px; background: var(--zd-accent); }
.kvgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(16px * var(--ui));
          flex: none; }
.kv { display: flex; align-items: baseline; border-bottom: 1px solid var(--zd-rule-1);
      height: var(--zd-cell-h); flex: none; overflow: hidden; }
.kv .v { margin-left: auto; padding-left: calc(10px * var(--ui)); color: var(--zd-text-1);
         font-family: var(--mono); font-size: var(--fs-data); white-space: nowrap;
         font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; min-height: 0; }
.cols2 { display: flex; gap: calc(12px * var(--ui)); min-height: 0; flex: 1; }
.cols2 > * { flex: 1; min-width: 0; overflow: hidden; }
.pre { font-family: var(--mono); font-size: var(--fs-data); line-height: var(--lh-data);
       white-space: pre; color: var(--zd-text-1); }
.plate .pre { color: var(--zd-ko-0); }
.gutnum { color: var(--zd-text-6); text-align: right; padding-right: calc(8px * var(--ui));
          border-right: 1px solid var(--zd-rule-1); background: var(--zd-well); }

/* ======================================================== overview ==== */
#overview { position: absolute; inset: 0; background: var(--zd-desk); z-index: 60; display: none;
            flex-direction: column; padding: calc(14px * var(--ui)); }
#overview.on { display: flex; }
.ovhead { display: flex; align-items: baseline; gap: calc(12px * var(--ui)); flex: none;
          border-bottom: 2px solid var(--zd-rule-2); padding-bottom: calc(6px * var(--ui)); }
.ovbody { flex: none; height: 52%; display: flex; gap: calc(24px * var(--ui)); min-height: 0;
          padding-top: calc(12px * var(--ui)); }
.ovreg { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding-top: calc(12px * var(--ui)); }
.ovws { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ovlab { display: flex; align-items: baseline; gap: calc(8px * var(--ui)); flex: none;
         padding-bottom: calc(4px * var(--ui)); }
.ovfield { position: relative; flex: 1; background: var(--zd-desk); border: 2px solid var(--zd-rule-2);
           overflow: hidden; cursor: pointer; }
.ovscale { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.ovscale .win { transition: none; }
.ovpick { position: absolute; cursor: pointer; z-index: 5; }
.ovpick:hover { outline: 3px solid var(--zd-accent); outline-offset: 0; }

/* ========================================================= palette ==== */
#palette { position: absolute; inset: 0; z-index: 120; display: none; }
#palette.on { display: block; }
#palette .scrim { position: absolute; inset: 0; }
#palette .sheet { position: absolute; left: 50%; top: calc(56px * var(--ui));
                  transform: translateX(-50%); width: calc(640px * var(--ui));
                  background: var(--zd-paper); border: 2px solid var(--zd-rule-2);
                  display: flex; flex-direction: column; padding-left: 3px; }
#palette .sheet > .fb { position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
                        background: var(--zd-accent); }
.phead { height: var(--zd-title-h); background: var(--zd-plate-0); display: flex; align-items: center;
         gap: calc(8px * var(--ui)); padding: 0 calc(8px * var(--ui)); flex: none; }
.pin { display: flex; align-items: center; gap: calc(6px * var(--ui)); background: var(--zd-well);
       border-bottom: 1px solid var(--zd-rule-1); padding: calc(6px * var(--ui)) calc(10px * var(--ui)); }
.prow { display: flex; align-items: center; height: var(--zd-row-h); padding: 0 calc(10px * var(--ui));
        gap: calc(10px * var(--ui)); border-bottom: 1px solid var(--zd-rule-1); cursor: pointer;
        position: relative; }
.prow .mk { position: absolute; left: 0; top: 0; bottom: 1px; width: 3px; background: transparent; }
.prow.on { background: var(--zd-inv-bg); }
.prow.on .mk { background: var(--zd-accent); }
.prow.on .t-label { color: var(--zd-inv-0); }
.prow.on .t-data { color: var(--zd-inv-1); }
.prow .hint { margin-left: auto; color: var(--zd-text-6); }
.pfoot { display: flex; align-items: center; gap: calc(14px * var(--ui));
         padding: calc(5px * var(--ui)) calc(10px * var(--ui)); border-top: 2px solid var(--zd-rule-2); }

/* ============================================================ lock ==== */
#lock { position: absolute; inset: 0; z-index: 300; background: var(--zd-desk); display: none; }
#lock.on { display: block; }
#lock .sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
               width: calc(800px * var(--ui)); background: var(--zd-paper);
               border: 2px solid var(--zd-rule-2); display: flex; padding-left: 3px; }
#lock .fb { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--zd-accent); }
#lock .lplate { width: calc(228px * var(--ui)); background: var(--zd-plate-0); flex: none;
                padding: calc(14px * var(--ui)) calc(14px * var(--ui)) calc(12px * var(--ui));
                display: flex; flex-direction: column; }
#lock .lmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#lock .lhead { height: var(--zd-title-h); background: var(--zd-plate-1); display: flex;
               align-items: center; gap: calc(8px * var(--ui)); padding: 0 calc(12px * var(--ui)); }
#lock .lbody { padding: calc(14px * var(--ui)); display: flex; flex-direction: column; }
#lock .hold { display: flex; align-items: center; gap: calc(8px * var(--ui));
              border-bottom: 1px solid var(--zd-rule-1-ko); height: calc(20px * var(--ui)); }

/* ============================================================ menu ==== */
.menu { position: absolute; z-index: 200; background: var(--zd-paper);
        border: 2px solid var(--zd-rule-2); min-width: calc(200px * var(--ui)); display: none; }
.menu.on { display: block; }
.menu .mh { background: var(--zd-plate-0); padding: 0 calc(8px * var(--ui));
            height: calc(20px * var(--ui)); display: flex; align-items: center; }
.menu .mi { height: var(--zd-row-h); display: flex; align-items: center; gap: calc(10px * var(--ui));
            padding: 0 calc(10px * var(--ui)); border-bottom: 1px solid var(--zd-rule-1); cursor: pointer; }
.menu .mi:last-child { border-bottom: 0; }
.menu .mi:hover { background: var(--zd-inv-bg); }
.menu .mi:hover .t-label { color: var(--zd-inv-0); }
.menu .mi:hover .t-data { color: var(--zd-inv-1); }
.menu .mi .hint { margin-left: auto; color: var(--zd-text-6); }

/* ========================================================== toasts ==== */
#toasts { position: absolute; right: calc(16px * var(--ui)); bottom: calc(16px * var(--ui));
          z-index: 150; display: flex; flex-direction: column; gap: var(--zd-gap);
          align-items: flex-end; }
.toast { background: var(--zd-paper); border: 2px solid var(--zd-rule-2); position: relative;
         width: calc(320px * var(--ui)); padding: calc(6px * var(--ui)) calc(10px * var(--ui))
         calc(7px * var(--ui)) calc(13px * var(--ui)); }
.toast > .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--zd-accent); }
.toast .tl { display: flex; align-items: baseline; }
.toast .tx { display: block; color: var(--zd-text-1); }
.toast .cl { margin-left: auto; cursor: pointer; color: var(--zd-text-4); display: flex; }
</style>
</head>
<body>

<div id="strip">
  <span class="nm t-label">Paper blend</span>
  <span class="pitch" id="pitch"></span>
  <span class="links" id="links"></span>
  <span class="thm" id="themetog"></span>
</div>

<div id="os">
  <div id="rail">
    <div class="ident">
      <span class="t-plate">zlos</span>
      <span class="t-data build">0.3 &middot; x86_64</span>
    </div>
    <div class="accrule"></div>
    <span class="t-label sect">register</span>
    <div id="reg"></div>
    <span class="t-label sect">workspace</span>
    <div class="wsbar" id="wsbar"></div>
    <div class="wscount" id="wscount"></div>
    <div class="readout">
      <span class="t-label sect">readout</span>
      <div id="readout"></div>
    </div>
  </div>

  <div id="slug">
    <span class="t-data line" id="slugline"></span>
    <span class="rm" id="regmark" title="command palette">
      <svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true">
        <circle cx="6" cy="6" r="3.5" fill="none" stroke="var(--zd-accent)" stroke-width="1"/>
        <path d="M6 0 V12 M0 6 H12" stroke="var(--zd-accent)" stroke-width="1"/>
      </svg>
    </span>
  </div>

  <div id="raster">
    <span class="rlab">
      <span class="t-label">raster</span>
      <span class="t-data">16 667 us</span>
    </span>
    <div id="rasterplot"></div>
    <span class="rout" id="rasterout"></span>
  </div>

  <div id="field">
    <svg id="gridsvg" shape-rendering="crispEdges" aria-hidden="true"></svg>
    <span class="t-data" id="legend"></span>
    <div id="wins"></div>
    <div id="overview"></div>
    <div id="toasts"></div>
  </div>

  <div id="ruler">
    <div id="rulerbar"></div>
    <div id="rulercap"></div>
  </div>

  <div id="palette">
    <div class="scrim"></div>
    <div class="sheet"><span class="fb"></span>
      <div class="phead">
        <span class="t-label ko">command</span>
        <span class="t-data ko-d">zlsh builtin</span>
        <span class="t-data ko-d spread" id="pcount"></span>
      </div>
      <div class="pin">
        <span class="t-label">run</span>
        <span class="t-data" id="pq"></span><span class="caret"></span>
      </div>
      <div id="presults"></div>
      <div class="pfoot">
        <span class="t-label">enter</span><span class="t-data ink6">run</span>
        <span class="t-label">up down</span><span class="t-data ink6">select</span>
        <span class="t-label">esc</span><span class="t-data ink6">dismiss</span>
      </div>
    </div>
  </div>

  <div id="lock">
    <svg id="locksvg" shape-rendering="crispEdges" aria-hidden="true"
         style="position:absolute;left:0;top:0;pointer-events:none"></svg>
    <div class="sheet">
      <span class="fb"></span>
      <div class="lplate" id="lockplate"></div>
      <div class="lmain">
        <div class="lhead">
          <span class="t-label ko">session locked</span>
          <span class="t-data ko-d">tty1 &middot; seat0</span>
          <span class="t-data ko-d spread" id="lockup"></span>
        </div>
        <div class="lbody" id="lockbody"></div>
      </div>
    </div>
  </div>

  <div class="menu" id="ctxmenu"></div>
  <div class="menu" id="winmenu"></div>
</div>

<script>
'use strict';
/* ====================================================================== *
 * THE PAPER BLEND - a living prototype of the zlOS desktop.
 *
 * Structure and every value decision:  PLATE.

R.hex = f => {
  const base = 0x0011A4C0;
  const rows = [];
  const seed = [0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, 0x01, 0x00];
  const n = f.short ? 8 : 18;
  for (let r = 0; r < n; r++) {
    let bytes = [], asc = '';
    for (let i = 0; i < 16; i++) {
      const v = r === 0 && i < 8 ? seed[i] : ((r * 37 + i * 11 + 0x21) & 0xff);
      bytes.push(hx(v, 2));
      asc += (v >= 32 && v < 127) ? String.fromCharCode(v) : '.';
    }
    const mark = r === 0 ? ' class="sel"' : '';
    rows.push('<tr' + mark + '><td>' + hx(base + r * 16, 8) + '</td><td>' +
      bytes.slice(0, 8).join(' ') + '</td><td>' + bytes.slice(8).join(' ') + '</td><td>' +
      asc.replace(/</g, '&lt;') + '</td></tr>');
  }
  return '<div class="row" style="border-bottom:2px solid var(--zd-rule-2);height:var(--zd-row-h)">' +
    '<span class="t-label">source</span><span class="t-data">/dev/rd0</span>' +
    '<span class="t-label">offset</span><span class="t-data">0x' + hx(base) + '</span>' +
    '<span class="t-data ink6 spread">width 16 &middot; ascii</span></div>' +
    '<div class="scroll">' + '<table class="tbl"><thead>' +
    TH([{ h: 'address', w: '17%' }, { h: '00 .. 07', w: '28%' }, { h: '08 .. 0f', w: '28%' },
        { h: 'ascii', w: '27%' }]) + '</thead><tbody>' + rows.join('') + '</tbody></table></div>' +
    '<div class="hr2"></div><div class="row" style="height:var(--zd-row-h)">' +
    '<span class="t-label">signature</span><span class="t-data ink0">7F 45 4C 46</span>' +
    '<span class="t-data ink6">elf64, little endian</span>' +
    '<span class="spread"></span>' + statword('OK') + '</div>';
};

/* ============================================================ grid ==== */
let GRID = { W: 0, H: 0, mar: 16, gut: 8, colW: [], colX: [], rowH: [], rowY: [],
  cwBase: 0, cwRem: 0, rhBase: 0, rhRem: 0 };

function computeGrid() {
  const f = $('#field');
  const W = f.clientWidth, H = f.clientHeight;
  const gut = Math.max(2, Math.round(S.gut * S.ui));
  const mar = gut * 2;
  const NC = S.cols, NR = S.rows;
  const availW = W - 2 * mar - (NC - 1) * gut;
  const availH = H - 2 * mar - (NR - 1) * gut;
  const cwBase = Math.floor(availW / NC), cwRem = availW - cwBase * NC;
  const rhBase = Math.floor(availH / NR), rhRem = availH - rhBase * NR;
  const colW = [], colX = [], rowH = [], rowY = [];
  let x = mar;
  for (let i = 0; i < NC; i++) {
    const w = cwBase + (i < cwRem ? 1 : 0);
    colW.push(w); colX.push(x); x += w + gut;
  }
  let y = mar;
  for (let i = 0; i < NR; i++) {
    const h = rhBase + (i < rhRem ? 1 : 0);
    rowH.push(h); rowY.push(y); y += h + gut;
  }
  GRID = { W, H, mar, gut, colW, colX, rowH, rowY, cwBase, cwRem, rhBase, rhRem };
}
function modRect(c, r, cw, rh) {
  const g = GRID;
  c = Math.max(0, Math.min(S.cols - 1, c));
  r = Math.max(0, Math.min(S.rows - 1, r));
  cw = Math.max(1, Math.min(S.cols - c, cw));
  rh = Math.max(1, Math.min(S.rows - r, rh));
  let w = 0, h = 0;
  for (let i = 0; i < cw; i++) w += g.colW[c + i];
  w += g.gut * (cw - 1);
  for (let i = 0; i < rh; i++) h += g.rowH[r + i];
  h += g.gut * (rh - 1);
  return { x: g.colX[c], y: g.rowY[r], w, h, c, r, cw, rh };
}
function drawGrid() {
  const svg = $('#gridsvg'), g = GRID;
  svg.setAttribute('width', g.W); svg.setAttribute('height', g.H);
  if (!S.grid && !S.crop) { svg.innerHTML = ''; $('#legend').textContent = ''; return; }
  let s = '';
  if (S.grid) {
    g.colX.forEach((x, i) => {
      s += '<rect x="' + x + '" y="' + g.mar + '" width="1" height="' + (g.H - 2 * g.mar) + '" fill="var(--zd-grid-line)"/>';
      s += '<rect x="' + (x + g.colW[i] - 1) + '" y="' + g.mar + '" width="1" height="' + (g.H - 2 * g.mar) + '" fill="var(--zd-grid-line)"/>';
    });
    g.rowY.forEach((y, i) => {
      s += '<rect x="' + g.mar + '" y="' + y + '" width="' + (g.W - 2 * g.mar) + '" height="1" fill="var(--zd-grid-line)"/>';
      s += '<rect x="' + g.mar + '" y="' + (y + g.rowH[i] - 1) + '" width="' + (g.W - 2 * g.mar) + '" height="1" fill="var(--zd-grid-line)"/>';
    });
  }
  if (S.crop) {
    const L = 16, o = 6, m = g.mar, Rr = g.W - g.mar, B = g.H - g.mar;
    const hz = (x, y) => '<rect x="' + x + '" y="' + y + '" width="' + L + '" height="1" fill="var(--zd-accent)"/>';
    const vt = (x, y) => '<rect x="' + x + '" y="' + y + '" width="1" height="' + L + '" fill="var(--zd-accent)"/>';
    s += hz(m, m - o) + vt(m - o, m);
    s += hz(Rr - L, m - o) + vt(Rr + o, m);
    s += hz(m, B + o) + vt(m - o, B - L);
    s += hz(Rr - L, B + o) + vt(Rr + o, B - L);
  }
  svg.innerHTML = s;
  /* FREE RIDER: the measured grid legend. The module AS COMPUTED at this
     resolution, which doubles as a live check on where the integer division
     remainder went. It is instrumentation ABOUT the layout, not part of it. */
  const cwTxt = g.cwRem ? (g.cwBase + 1) + '/' + g.cwBase : String(g.cwBase);
  const rhTxt = g.rhRem ? (g.rhBase + 1) + '/' + g.rhBase : String(g.rhBase);
  $('#legend').textContent = 'MODULE ' + S.cols + ' x ' + S.rows + '  ·  ' +
    cwTxt + ' x ' + rhTxt + ' px  ·  GUTTER ' + g.gut;
}

/* ==================================================== the raster strip =
 * DATUM's instrument, re-clocked onto damage. One column is one COMPOSITE.
 * damage() is the only thing that pushes a sample, and it is called from
 * exactly the places wm.c would raise a damage rect from.
 */
function damage(kind, weight) {
  S.composites += 1;
  /* a composite costs roughly the blended area. a whole field relayout is
     the expensive one; a focus flip repaints two headers. */
  const base = { relayout: 11800, move: 8600, focus: 5200, tick: 6100, open: 13400 }[kind] || 6000;
  const jitter = ((S.composites * 2654435761) % 2800);
  let us = base + jitter + (weight || 0) * 420;
  if (S.composites % 401 === 0) us += 9000;
  if (us > BUDGET_US) S.dropped += 1;
  if (S.stripLive) {
    S.raster.push(us);
    while (S.raster.length > 400) S.raster.shift();
  }
  Object.values(S.wins).forEach(w => {
    if (w.ws !== S.ws || w.min) return;
    const area = (w.det ? w.w * w.h : 0) || 180000;
    w.rects = 1 + (S.composites + w.z) % 5;
    w.px = Math.round(area * (0.05 + ((S.composites * 37 + w.z * 11) % 60) / 400));
    w.us = Math.round(w.px / 44) + 60;
  });
  drawRaster();
}
function drawRaster() {
  if (!S.strip) { $('#raster').style.display = 'none'; return; }
  $('#raster').style.display = 'flex';
  const host = $('#rasterplot');
  const W = host.clientWidth, H = host.clientHeight;
  if (W < 8 || H < 4) return;
  const step = 3, bw = 2;               /* one composite = one 2 px column */
  const n = Math.max(1, Math.floor(W / step));
  const s = S.raster.slice(Math.max(0, S.raster.length - n));
  const top = 2, bot = H - 2;
  const scale = v => Math.max(1, Math.round((Math.min(v, BUDGET_US * 2) / (BUDGET_US * 2)) * (bot - top)));
  const off = Math.max(0, (n - s.length) * step);
  let out = '<svg width="' + W + '" height="' + H + '" shape-rendering="crispEdges" aria-hidden="true">';
  /* the budget line. everything below it is inside 16 667 us. */
  const by = bot - Math.round((BUDGET_US / (BUDGET_US * 2)) * (bot - top));
  out += '<rect x="0" y="' + by + '" width="' + W + '" height="1" fill="var(--zd-strip-track)"/>';
  s.forEach((v, i) => {
    const h = scale(v);
    const col = v > BUDGET_US * 2 ? '--zd-bad-ko' : v > BUDGET_US ? '--zd-warn-ko' : '--zd-strip-0';
    out += '<rect x="' + (off + i * step) + '" y="' + (bot - h) + '" width="' + bw +
      '" height="' + h + '" fill="var(' + col + ')"/>';
  });
  out += '</svg>';
  host.innerHTML = out;
  const mx = s.length ? Math.max.apply(null, s) : 0;
  const mean = s.length ? Math.round(s.reduce((a, b) => a + b, 0) / s.length) : 0;
  const word = mx > BUDGET_US * 2 ? 'FAIL' : mx > BUDGET_US ? 'WARN' : 'OK';
  $('#rasterout').innerHTML =
    '<span class="t-data">mean</span><span class="t-data v">' + grp(mean) + ' us</span>' +
    '<span class="t-data">max</span><span class="t-data v">' + grp(mx) + ' us</span>' +
    '<span class="t-data">composites</span><span class="t-data v">' + grp(S.composites) + '</span>' +
    '<span class="t-data">over</span><span class="t-data v">' + S.dropped + '</span>' +
    '<span class="t-label ' + (word === 'OK' ? 'k-ok' : word === 'WARN' ? 'k-warn' : 'k-bad') + '">' +
    word + '</span>' +
    (S.stripLive ? '' : '<span class="t-label ko-4">parked</span>');
}

/* ==================================================== the memory ruler =
 * DATUM's third instrument. The whole address space to scale along the
 * bottom edge, drawn from the same table 10 SYSTEM prints, so the two
 * cannot drift. Regions under 0.15 % of the space would be sub pixel; they
 * are held at 2 px and the caption says so rather than quietly lying.
 */
const MMAP = [
  { base: '0x00000000', b: 0, len: '640 KiB', n: 655360, kind: 'usable', c: 'use' },
  { base: '0x000A0000', b: 655360, len: '384 KiB', n: 393216, kind: 'reserved', c: 'rsv' },
  { base: '0x00100000', b: 1048576, len: '3.0 GiB', n: 3220176896, kind: 'usable', c: 'use' },
  { base: '0xC0000000', b: 3221225472, len: '128 MiB', n: 134217728, kind: 'drag scratch', c: 'krn' },
  { base: '0xC8000000', b: 3355443200, len: '128 MiB', n: 134217728, kind: 'browser dom', c: 'krn' },
  { base: '0xD0000000', b: 3489660928, len: '16 MiB', n: 16777216, kind: 'gen9 bar0', c: 'mmio' },
  { base: '0xE0000000', b: 3758096384, len: '256 MiB', n: 268435456, kind: 'gen9 stolen', c: 'mmio' },
  { base: '0xFEC00000', b: 4273995776, len: '4 KiB', n: 4096, kind: 'io apic', c: 'mmio' },
  { base: '0xFED00000', b: 4275044352, len: '1 KiB', n: 1024, kind: 'hpet', c: 'mmio' },
  { base: '0xFEE00000', b: 4276092928, len: '4 KiB', n: 4096, kind: 'local apic', c: 'mmio' },
  { base: '0xFFC00000', b: 4290772992, len: '4 MiB', n: 4194304, kind: 'firmware', c: 'rsv' },
  { base: '0x100000000', b: 4294967296, len: '12.4 GiB', n: 13314398618, kind: 'usable', c: 'use' }
];
const MMAP_TOP = 4294967296 + 13314398618;
function drawRuler() {
  const host = $('#ruler');
  if (!S.ruler) { host.style.display = 'none'; return; }
  host.style.display = 'flex';
  const bar = $('#rulerbar');
  const W = bar.clientWidth;
  if (W < 16) return;
  const MINW = 2;
  /* first pass: proportional. second pass: floor the tiny ones at MINW and
     take the difference back out of the largest region, so the bar still
     sums to W exactly and the biggest span is the one that pays. */
  let px = MMAP.map(m => (m.n / MMAP_TOP) * W);
  let debt = 0, held = 0;
  px = px.map(v => { if (v < MINW) { debt += MINW - v; held += 1; return MINW; } return v; });
  const bigI = px.indexOf(Math.max.apply(null, px));
  px[bigI] -= debt;
  /* integer edges accumulated from the running total, and the last region
     is pinned to W. rounding each width on its own drifted ~12 px and left a
     strip of bare track at the top of the address space that meant nothing. */
  let acc = 0, prev = 0, out = '';
  MMAP.forEach((m, i) => {
    acc += px[i];
    const x1 = (i === MMAP.length - 1) ? W : Math.round(acc);
    out += '<i class="' + (i ? 'sep' : '') + '" style="left:' + prev + 'px;width:' +
      Math.max(1, x1 - prev) + 'px;background:var(--zd-ruler-' + m.c + ')"></i>';
    prev = x1;
  });
  /* THE REGISTER MARK. The one accent on this band, and it is job three of
     the four the ink already had, not a fifth: it marks the datum, here the
     framebuffer base the plane is scanning out of. */
  const fbx = Math.round((3758096384 / MMAP_TOP) * W);
  out += '<u style="left:' + fbx + 'px"></u>';
  bar.innerHTML = out;
  const key = [['use', 'usable'], ['krn', 'kernel arenas'], ['rsv', 'reserved'], ['mmio', 'device mmio']];
  $('#rulercap').innerHTML =
    '<span class="t-label">e820</span>' +
    key.map(k => '<span class="t-data"><span class="sw" style="background:var(--zd-ruler-' + k[0] +
      ')"></span>' + k[1] + '</span>').join('') +
    '<span class="t-data"><span class="sw" style="background:var(--zd-accent)"></span>' +
    'plane surf 0xE0000000</span>' +
    '<span class="t-data spread">0x0 to 0x3FFFFFFFF &middot; 15.4 GiB &middot; ' +
    MMAP.length + ' regions &middot; ' + held + ' held at ' + MINW + ' px</span>';
}

/* ====================================================== window mgmt === */
let ZTOP = 10;

/* THE SHELL GATE. sheet_rows() lives here and nowhere else. PLATE had no
   reflow story at all and four separate defects were that one omission. */
function fitOf(w) {
  let rows, cols;
  if (w.det) {
    const rh = (GRID.rowH[0] || 60) + GRID.gut;
    const cwd = (GRID.colW[0] || 90) + GRID.gut;
    rows = Math.max(1, Math.round(w.h / rh));
    cols = Math.max(1, Math.round(w.w / cwd));
  } else { rows = w.rh; cols = w.cw; }
  /* FOUR rows is already short. Measured: 03 MONITOR and 08 NETWORK both
     overflowed their own frames at 7x4 and 5x4 with the threshold at 3. */
  return { rows, cols, short: rows <= 4, narrow: cols <= 4 };
}

function openWin(id, place, ws) {
  const a = APP[id];
  if (!a) return;
  if (S.wins[id]) { S.wins[id].min = false; focusWin(id); return; }
  const p = place || a.p;
  S.wins[id] = { id: id, ws: ws || S.ws, c: p[0], r: p[1], cw: p[2], rh: p[3],
    det: false, x: 0, y: 0, w: 0, h: 0, min: false, max: false, prev: null, z: ++ZTOP,
    rects: 3, px: 18432, us: 480 };
  buildWin(id);
  focusWin(id);
  layout();
  renderRail();
  damage('open');
}
function closeWin(id) {
  const e = $('.win[data-id="' + id + '"]');
  if (e) e.remove();
  delete S.wins[id];
  if (S.focus === id) {
    const rest = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min)
      .sort((a, b) => b.z - a.z);
    S.focus = rest.length ? rest[0].id : null;
  }
  paintFocus(); renderRail(); redraw('grid'); damage('relayout');
}
function focusWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].z = ++ZTOP;
  S.wins[id].min = false;
  S.focus = id;
  paintFocus(); renderRail(); layout();
  damage('focus');
}
function minWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].min = true;
  if (S.focus === id) {
    const rest = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = rest.length ? rest[0].id : null;
  }
  layout(); paintFocus(); renderRail(); damage('relayout');
}
function maxWin(id) {
  const w = S.wins[id];
  if (!w) return;
  if (w.max) { Object.assign(w, w.prev); w.max = false; }
  else {
    w.prev = { c: w.c, r: w.r, cw: w.cw, rh: w.rh, det: w.det, x: w.x, y: w.y, w: w.w, h: w.h };
    w.c = 0; w.r = 0; w.cw = S.cols; w.rh = S.rows; w.det = false; w.max = true;
  }
  focusWin(id); layout(); redraw(id); redraw('grid'); damage('relayout');
}

function buildWin(id) {

/* DATUM: per window microsecond timing in every status band. The pixels and
   the rect count are what wm.c actually measures per surface; the us figure

function paintBand(id) {
  const w = S.wins[id];

    '<span class="t-data ink6">derived</span>' +

    statword(over ? 'WARN' : 'OK');
}
function redrawAll() { Object.keys(S.wins).forEach(redraw); }

function layout() {
  computeGrid();
  drawGrid();
  Object.values(S.wins).forEach(w => {
    const e = $('.win[data-id="' + w.id + '"]');
    if (!e) return;
    const vis = w.ws === S.ws && !w.min;
    e.classList.toggle('hidden', !vis);
    let x, y, ww, hh, coord;
    if (w.det) {
      x = w.x; y = w.y; ww = w.w; hh = w.h;
      coord = '[' + Math.round(x) + ',' + Math.round(y) + ' px]';
    } else {
      const r = modRect(w.c, w.r, w.cw, w.rh);
      x = r.x; y = r.y; ww = r.w; hh = r.h;
      w.c = r.c; w.r = r.r; w.cw = r.cw; w.rh = r.rh;
      coord = '[' + (r.c + 1) + ',' + (r.r + 1) + ' ' + r.cw + 'x' + r.rh + ']';
    }
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.width = ww + 'px'; e.style.height = hh + 'px';
    e.style.zIndex = String(w.z);
    $('.coord', e).textContent = coord;
    let tab = $('.dtab', e);
    if (w.det && !tab) {
      tab = document.createElement('span');
      tab.className = 'dtab';
      tab.innerHTML = '<span class="t-label">detached</span>';
      e.appendChild(tab);
    } else if (!w.det && tab) tab.remove();
    paintBand(w.id);
  });
  paintFocus();
  drawRuler();
}

/* ========================================================== toasts ==== */
const TOAST_MS = 4200, TOAST_MAX = 3;
function toast(title, body) {
  const host = $('#toasts');
  while (host.children.length >= TOAST_MAX) host.removeChild(host.firstChild);
  const e = document.createElement('div');
  e.className = 'toast';
  e.innerHTML = '<span class="bar"></span><div class="tl"><span class="t-label">' + title + '</span>' +
    '<span class="cl" data-act="untoast">' + CTL_CLS + '</span></div>' +
    '<span class="t-data tx">' + body + '</span>';
  host.appendChild(e);
  setTimeout(() => { if (e.parentNode) e.remove(); }, TOAST_MS);
}

/* ============================================================ tick ==== */
function walk(v, lo, hi, amp) {
  const n = v + (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, n));
}
function tick() {
  S.t += 1; S.clock += 1;
  S.cpu = S.cpu.map(v => Math.round(walk(v, 2, 99, 22)));
  S.memPct = Math.round(walk(S.memPct, 40, 92, 3));
  S.load = Math.round(walk(S.load, 0.05, 3.2, 0.22) * 100) / 100;
  S.rx = Math.round(walk(S.rx, 0, 420, 90) * 10) / 10;
  S.tx = Math.round(walk(S.tx, 0, 180, 30) * 10) / 10;
  S.hist.cpu.push(Math.round(S.cpu.reduce((a, b) => a + b, 0) / 4));
  S.hist.cpu.shift();
  S.hist.net.push(Math.min(80, Math.round(S.rx / 5)));
  S.hist.net.shift();
  S.hist.mem.push(S.memPct);
  S.hist.mem.shift();
  renderSlug();
  renderRail();
  /* a clock tick IS damage: the rail readout and the slug both changed. */
  damage('tick', Object.keys(S.wins).length);
  ['mon', 'net', 'clock', 'proc', 'sys', 'grid'].forEach(id => { if (S.wins[id] && !S.wins[id].min) redraw(id); });
  if ($('#lock').classList.contains('on')) renderLock();
}

document.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (!t.closest('.menu')) hideMenus();

  if ($('#lock').classList.contains('on')) {
    if (t.closest('#lock')) { setScene('desktop'); toast('session', 'unlocked, sheets restored'); }
    return;
  }
  if ($('#palette').classList.contains('on')) {
    const pr = t.closest('.prow');
    if (pr && pr.getAttribute('data-pi') !== null) {
      S.psel = Number(pr.getAttribute('data-pi'));
      runPalette();
      return;
    }
    if (!t.closest('.sheet')) showPalette(false);
    return;
  }
  if (overviewOn()) {
    const pick = t.closest('[data-ovpick]');
    if (pick) {
      S.ws = Number(pick.getAttribute('data-ovws'));
      showOverview(false);
      focusWin(pick.getAttribute('data-ovpick'));
      layout(); renderRail();
      return;
    }
    const fld = t.closest('.ovfield');
    if (fld) { S.ws = Number(fld.getAttribute('data-ovws')); showOverview(false); layout(); renderRail(); return; }
    if (!t.closest('.ovhead')) showOverview(false);
    return;
  }

  const reg = t.closest('.reg');
  if (reg) {
    const id = reg.getAttribute('data-app');
    const w = S.wins[id];
    if (!w) openWin(id);
    else if (w.min || w.ws !== S.ws) { w.ws = S.ws; w.min = false; focusWin(id); layout(); }
    else if (S.focus === id) minWin(id);
    else focusWin(id);
    return;
  }
  const wsc = t.closest('.wsc');
  if (wsc) {
    if (wsc.getAttribute('data-ov')) { setScene('overview'); return; }
    S.ws = Number(wsc.getAttribute('data-ws'));
    const top = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout(); renderRail(); renderSlug(); damage('relayout');
    toast('workspace', 'switched to ' + pad2(S.ws) + ', ' + top.length + ' sheets visible');
    return;
  }
  if (t.closest('#regmark')) { showPalette(true); return; }

  const win = t.closest('.win');
  if (win) {
    const id = win.getAttribute('data-id');
    const act = t.closest('[data-act]') ? t.closest('[data-act]').getAttribute('data-act') : null;
    if (act === 'close') { closeWin(id); return; }
    if (act === 'min') { minWin(id); return; }
    if (act === 'max') { maxWin(id); return; }
    if (act === 'winmenu') {
      focusWin(id);
      const r = win.getBoundingClientRect(), os = $('#os').getBoundingClientRect();
      showMenu($('#winmenu'), r.left - os.left, r.top - os.top + 30, [
        ['raise to front', 'click'],
        ['minimise', 'ctrl m'],
        [S.wins[id].max ? 'restore' : 'maximise', 'ctrl f'],
        [S.wins[id].det ? 'return to module' : 'detach from module', 'ctrl d'],
        ['send to workspace ' + (S.ws === 1 ? '02' : '01'), 'shift ' + (S.ws === 1 ? '2' : '1')],
        ['close sheet', 'ctrl w']
      ], APP[id].name);
      $('#winmenu')._win = id;
      return;
    }
    if (S.focus !== id) focusWin(id);
    handleWinAction(id, t);
    const hdr = t.closest('.hdr');
    if (hdr && !t.closest('.ctls') && !t.closest('.ico')) startDrag(ev, id, win);
    return;
  }
});

function handleWinAction(id, t) {
  const node = t.closest('[data-act], [data-toggle], [data-accent], [data-seg], [data-slider]');
  if (!node) return;
  if (node.hasAttribute('data-toggle')) {
    const k = node.getAttribute('data-toggle');
    S[k] = !S[k];
    if (k === 'grid' || k === 'crop') drawGrid();
    if (k === 'zebra') redrawAll();
    if (k === 'blink') document.body.classList.toggle('blinkon', S.blink);
    if (k === 'strip') { drawRaster(); layout(); }
    if (k === 'stripLive') drawRaster();
    if (k === 'ruler') layout();
    if (k === 'bands') redrawAll();
    redraw('set');
    toast(k, S[k] ? 'on' : 'off');
    return;
  }
  if (node.hasAttribute('data-accent')) {
    S.accent = node.getAttribute('data-accent');
    applyAccent(); redraw('set');
    const a = ACCENTS.find(x => x[0] === S.accent);
    toast('second ink', a[1] + ' now carries all four accent places');
    return;
  }
  const segp = t.closest('[data-seg]');
  if (segp && t.closest('[data-arg]')) {
    const av = Number(t.closest('[data-arg]').getAttribute('data-arg'));
    if (segp.getAttribute('data-seg') === 'stock') { setStock(av ? 'dark' : 'light', true); return; }
    S.setTab = av;
    redraw('set');
    return;
  }
  const act = node.getAttribute('data-act');
  const arg = node.getAttribute('data-arg');
  if (act === 'file') { S.fileSel = Number(arg); redraw('files'); redraw('edit'); return; }
  if (act === 'proc') { S.procSel = Number(arg); redraw('mon'); return; }
  if (act === 'open') { openWin(arg); return; }
  if (act === 'ov') { setScene('overview'); return; }
  if (act === 'calc') { calcKey(arg); redraw('calc'); return; }
  if (act === 'toast') {
    const M = {
      build: ['make', 'zlos.elf relinked, text 218432 data 30720 bss 1441792'],
      ink: ['design.h', 'ZD_ACCENT rewritten, 4 call sites re-inked'],
      revert: ['design.h', 'reverted to the measured value'],
      proof: ['printed', 'proof sheet queued, 2 workspaces, 1 page'],
      stat: ['stat', '1 extent, contiguous, generation 3, crc verified'],
      reap: ['reaped', 'pid 42 regdump removed from the table'],
      renice: ['renice', 'pid 61 soak moved to nice 10'],
      retile: ['retiled', 'every sheet snapped back to the module grid']
    }[arg] || ['ok', arg];
    if (arg === 'retile') { tileAll(); return; }
    toast(M[0], M[1]);
    return;
  }
}
function calcKey(k) {
  if (k === 'clr') { S.calcAcc = '0'; return; }
  if (k === 'eq') { S.calcAcc = String(parseInt(S.calcAcc, 10) || 0); return; }
  if (/^[0-9]$/.test(k)) { S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k; return; }
  if (k === 'div') { S.calcAcc = String(Math.floor((parseInt(S.calcAcc, 10) || 0) / 2)); return; }
  if (k === 'mul') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) * 2); return; }
  if (k === 'add') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) + 1); return; }
  if (k === 'sub') { S.calcAcc = String((parseInt(S.calcAcc, 10) || 0) - 1); return; }
  if (k === 'hex' || k === 'dec' || k === 'bin') { toast('base', k + ' shown in the ledger below'); return; }
}
function tileAll() {
  const list = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min);
  const n = list.length;
  if (!n) return;
  const perRow = n <= 2 ? n : Math.ceil(n / 2);
  const rowsN = n <= 2 ? 1 : 2;
  list.forEach((w, i) => {
    const rr = Math.floor(i / perRow), cc = i % perRow;
    const cwid = Math.floor(S.cols / perRow), rhh = Math.floor(S.rows / rowsN);
    w.det = false; w.max = false;
    w.c = cc * cwid; w.r = rr * rhh; w.cw = cwid; w.rh = rhh;
  });
  layout(); redrawAll(); damage('relayout');
  toast('tiled', n + ' sheets onto the ' + S.cols + ' x ' + S.rows + ' module grid');
}

/* ---------------------------------------------------------- sliders -- */
let SL = null;
document.addEventListener('mousedown', ev => {
  const s = ev.target.closest('[data-slider]');
  if (!s) return;
  SL = s; setSlider(ev);
});
document.addEventListener('mousemove', ev => { if (SL) setSlider(ev); });
document.addEventListener('mouseup', () => { SL = null; });
function setSlider(ev) {
  const name = SL.getAttribute('data-slider');
  const r = SL.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  const steps = name === 'ui' ? UI_STEPS : name === 'cols' ? COL_STEPS : GUT_STEPS;
  const v = steps[Math.round(p * (steps.length - 1))];
  if (name === 'ui') { if (v === S.ui) return; S.ui = v; applyUI(); }
  else if (name === 'cols') { if (v === S.cols) return; S.cols = v; }
  else { if (v === S.gut) return; S.gut = v; }
  layout(); redrawAll(); drawRaster(); renderSlug(); damage('relayout');
}

/* ------------------------------------------------------------- drag -- */
function startDrag(ev, id, el) {
  const w = S.wins[id];
  if (w.max) return;
  const r = el.getBoundingClientRect(), f = $('#field').getBoundingClientRect();
  const ox = ev.clientX - r.left, oy = ev.clientY - r.top;
  const wid = r.width, hgt = r.height;
  el.classList.add('drag');
  function move(e) {
    w.det = true;
    w.x = Math.round(e.clientX - f.left - ox);
    w.y = Math.round(e.clientY - f.top - oy);
    w.w = wid; w.h = hgt;
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    el.classList.remove('drag');
    if (S.snap && w.det) {
      let bc = 0, br = 0, bd = 1e9;
      GRID.colX.forEach((x, i) => { const d = Math.abs(x - w.x); if (d < bd) { bd = d; bc = i; } });
      bd = 1e9;
      GRID.rowY.forEach((y, i) => { const d = Math.abs(y - w.y); if (d < bd) { bd = d; br = i; } });
      w.det = false; w.c = bc; w.r = br;
      layout();
      toast('snapped', APP[id].name.toUpperCase() + ' to module ' + (bc + 1) + ',' + (br + 1));
    }
    redraw(id); redraw('grid'); damage('move');
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

/* -------------------------------------------------------- keyboard --- */
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if ($('#lock').classList.contains('on')) {
    if (k === 'Enter' || k === 'Escape') { setScene('desktop'); toast('session', 'unlocked, sheets restored'); ev.preventDefault(); }
    return;
  }
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); ev.preventDefault(); return; }
    if (k === 'Enter') { runPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(S.psel + 1, Math.min(7, paletteResults().length - 1)); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    if (k.length === 1 && !ev.ctrlKey && !ev.metaKey) { S.pq += k; S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    return;
  }
  /* the required mode key, and PLATE's own ctrl i kept as a synonym */
  if (ev.shiftKey && (k === 'D' || k === 'd') && !ev.ctrlKey && !ev.metaKey) {
    setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return;
  }
  if (ev.ctrlKey && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if (ev.ctrlKey && k === ' ') { setScene(overviewOn() ? 'desktop' : 'overview'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'l' || k === 'L')) { setScene('lock'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'g' || k === 'G')) { S.grid = !S.grid; drawGrid(); redraw('set'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'i' || k === 'I')) { setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 't' || k === 'T')) { tileAll(); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'w' || k === 'W')) { if (S.focus) closeWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'f' || k === 'F')) { if (S.focus) maxWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'm' || k === 'M')) { if (S.focus) minWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === '1' || k === '2')) {
    S.ws = Number(k);
    const top = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout(); renderRail(); renderSlug(); damage('relayout'); ev.preventDefault(); return;
  }
  if (ev.altKey && /^[0-9]$/.test(k)) {
    const idx = k === '0' ? 9 : Number(k) - 1;
    if (APPS[idx]) openWin(APPS[idx].id);
    ev.preventDefault(); return;
  }
  if (k === 'Escape') {
    if (overviewOn()) setScene('desktop');
    hideMenus();
  }
});

/* =========================================================== stock ====
 * Two primitive ladders, one set of role names. Setting data-theme is the
 * ONLY switch: no rule weight, no metric, no radius, no motion value and
 * no band height differs between the two.
 */
const STOCK = {
  light: { name: 'paper', other: 'negative',
    pitch: 'PLATE structure carrying Datum instrumentation. warm paper, black ink, ' +
           'one vermilion overprint, and a machine that shows its own raster.',
    toast: ['paper', 'warm stock, ink plate rail and strip, knockout sets the title in paper'] },
  dark:  { name: 'negative', other: 'paper',
    pitch: 'the same document on the film it was shot on. ortho lith, amber base, ' +
           'Dmax rail and strip, knockout clears, the ruler halftones.',
    toast: ['negative', 'ortho lith. the rail holds at Dmax and only the knockout clears'] }
};
function applyTheme() {
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = STOCK[S.theme].pitch;
  renderThemeTog();
}
function renderThemeTog() {
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-stock="light">paper</span>' +
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-stock="dark">negative</span>' +
    '<span class="thint">shift d</span>';
}
function hashName() { return S.scene + (S.theme === 'dark' ? '-dark' : ''); }
function setStock(t, announce) {
  const next = t === 'dark' ? 'dark' : 'light';
  if (next === S.theme && announce) return;
  S.theme = next;
  applyTheme();
  renderLinks();
  renderSlug();
  drawRaster();
  redraw('set');
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    toast(STOCK[S.theme].toast[0], STOCK[S.theme].toast[1]);
  }
}
function renderLinks() {
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#links').innerHTML = SCENE_NAMES.map(n =>
    '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  markLinks(S.scene);
}

/* ========================================================== scenes ==== */
const SCENE_NAMES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.win[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZTOP = 10;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#toasts').innerHTML = '';
}
function place(id, c, r, cw, rh, ws) { openWin(id, [c, r, cw, rh], ws || S.ws); }
function baseDesktop() {
  clearAll();
  S.ws = 1; S.cols = 12; S.rows = 8; S.gut = 8;
  place('shell', 0, 0, 7, 4);
  place('files', 7, 0, 5, 4);
  place('mon', 0, 4, 7, 4);
  place('net', 7, 4, 5, 4);
  place('log', 0, 0, 7, 4, 2);
  place('regs', 7, 0, 5, 5, 2);
  place('hex', 0, 4, 12, 4, 2);
  /* one detached sheet, front most, so the explicit overlap state is on
     screen from the first paint. DETACHED is a state here, not a default. */
  openWin('sys', [3, 2, 6, 5]);
  const w = S.wins.sys;
  const r = modRect(3, 2, 6, 5);
  w.det = true; w.x = r.x + 18; w.y = r.y - 34; w.w = r.w; w.h = r.h;
  focusWin('sys');
  layout(); redrawAll();
}
function setScene(name, push) {
  let dark = false;
  if (/-dark$/.test(name)) { dark = true; name = name.slice(0, -5); }
  if (SCENE_NAMES.indexOf(name) < 0) { name = 'desktop'; dark = false; }
  S.scene = name;
  S.theme = dark ? 'dark' : 'light';
  applyTheme();
  renderLinks();
  if (push !== false && location.hash.slice(1) !== hashName()) {
    history.replaceState(null, '', '#' + hashName());
  }
  markLinks(name);
  if (name === 'desktop') {
    baseDesktop();
    toast('tiled', '7 sheets over 2 workspaces, module ' + S.cols + ' x ' + S.rows +
      ', one detached and marked');
  } else if (name === 'overview') {
    baseDesktop();
    layout();
    showOverview(true);
  } else if (name === 'palette') {
    baseDesktop();
    S.pq = 'raster'; S.psel = 0;
    showPalette(true);
  } else if (name === 'files') {
    clearAll();
    S.ws = 1;
    place('files', 0, 0, 5, 8);
    place('edit', 5, 0, 7, 8);
    S.fileSel = 1;
    focusWin('files');
    layout(); redrawAll();
    toast('selected', 'fb.c 68.4 KiB, opened in 04 EDITOR');
  } else if (name === 'monitor') {
    clearAll();
    S.ws = 1;
    place('mon', 0, 0, 7, 8);
    place('net', 7, 0, 5, 4);
    place('proc', 7, 4, 5, 4);
    focusWin('mon');
    layout(); redrawAll();
    toast('sampling', 'monitor at 1 Hz, 64 s history, strip at 1 column per composite');
  } else if (name === 'settings') {
    clearAll();
    S.ws = 1;
    place('grid', 7, 0, 5, 4);
    place('clock', 7, 4, 5, 4);
    place('set', 0, 0, 7, 8);
    S.setTab = 0;
    focusWin('set');
    layout(); redrawAll();
  } else if (name === 'lock') {
    baseDesktop();
    showLock(true);
  }
  renderRail(); renderSlug(); drawRaster(); drawRuler();
}
function markLinks(name) {
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-dark$/, '') === name));
}
$('#themetog').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-stock]');
  if (t) { ev.preventDefault(); setStock(t.getAttribute('data-stock'), true); }
});
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
window.addEventListener('resize', () => {
  layout(); drawRaster();
  if (overviewOn()) showOverview(true);
  if ($('#lock').classList.contains('on')) renderLock();
});

/* =========================================================== start ==== */
document.body.classList.add('blinkon');
applyTheme(); applyAccent(); applyUI();
computeGrid();
setScene(location.hash.slice(1) || 'desktop', false);
drawRaster(); drawRuler();
setInterval(tick, 1000);

</script>
</body>
