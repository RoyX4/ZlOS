<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INKSTOCK / zlOS living prototype</title>
<style>
/* ======================================================================
   INKSTOCK - design.h
   ----------------------------------------------------------------------
   RESOLUTION 3: TWO MATERIALS, BOTH DARK.

   The ground is not a dark UI surface. It is a dark printed STOCK: warm,
   and screened by an ordered dither rather than tinted flat, so it reads
   as a material with tooth. On it sits a second material: the machine's
   MACHINED PLATE - cool, flat, no tooth. Chrome is plate. Content is
   stock.

   WHAT IS NOT CLAIMED. deciding.md C3 establishes that Datum's paper/ink
   law needs a ground at L* >= 89.6 to hold its 14.26:1, that every dark
   ground in the set yields 1.13 to 1.57:1, and that Datum's own dark mode
   measured 1.18:1 with the rail's meaning evaporating while its screen
   area did not. That law is DEAD here and this direction does not claim
   it. INKSTOCK's two materials measure 1.0018:1 against each other. That
   is not a weaker version of the law, it is a different one.

   WHAT IS CLAIMED, on three channels, each measured:

     1  HUE       STOCK_1 #332A22  L* 17.81  h 68.8    C* 7.26
                  PLATE_0 #242C38  L* 17.75  h 270.3   C* 8.82
                  dE*ab 15.80, dh 158.6 deg, dL* 0.061.
                  15.80 is 6.9x the CIE just-noticeable difference of 2.3.
     2  TEXTURE   stock is a 2x1 ordered screen of STOCK_1 against
                  TOOTH_1 #372E25. Amplitude dL* 1.83, screen mean
                  L* 18.72. Plate is flat: amplitude 0.00.
     3  RULE      ZD_RULE_2 #818181 lies in every material seam.
                  3.606:1 on stock, 3.612:1 on plate. It is NEUTRAL by
                  construction - it belongs to neither material, which is
                  what lets one value serve both sides of every seam.

   THE PAYOFF OF MATCHING THE TWO MATERIALS IN LUMINANCE. Because
   STOCK_1 and PLATE_0 differ by 0.061 L*, EVERY ink in the system has
   the same contrast on both materials to two decimal places. One
   vermilion, 4.53:1 on stock and 4.54:1 on plate. One rule, one edge,
   one text ramp per polarity. Datum needed two of everything and a
   knockout ramp; this needs one, and the second ramp exists only
   because the cool material wants cool ink, not because it needs more
   contrast.

   DARK IS PRIMARY. :root IS the dark ladder. :root[data-theme="light"]
   is the derived one, and every custom property name below appears in
   both. A token in one mode only is a defect; there are none, and the
   settings pane checks at run time.
   ====================================================================== */
:root {
  /* ================================================== STOCK, the warm
     material. The user's. Hue held at 68 to 76, chroma 4.9 to 9.9. Every
     rung is dithered against its TOOTH partner; the partner is the fibre
     that stands up out of the sheet and catches the raking light, so on
     a dark stock the tooth is the LIGHTER of the pair. ------------- */
  --zd-stock-cut:   #1D1812;
  --zd-stock-well:  #261F19;
  --zd-stock-0:     #2C241D;
  --zd-tooth-0:     #2F271F;
  --zd-stock-1:     #332A22;
  --zd-tooth-1:     #372E25;
  --zd-stock-2:     #3E342B;
  --zd-stock-graze: #4E4238;
  --zd-stock-lit:   #605246;

  /* ================================================== PLATE, the cool
     material. The machine's. Hue held at 268 to 273. FLAT - no tooth,
     ever. The absence of the screen is half the separation and it costs
     nothing to draw. Its internal step PLATE_CUT -> PLATE_0 is 1.241:1,
     louder than any step on stock, because a machined surface may have
     a crisper groove than a printed one. That is deliberate and it is
     the only place the two ladders disagree about step size. ------- */
  --zd-plate-cut:   #161A20;
  --zd-plate-0:     #242C38;
  --zd-plate-1:     #2E3644;
  --zd-plate-graze: #3C4554;
  --zd-plate-lit:   #4C5565;

  /* ================================================ boundaries, three
     ranks. RULE_1 is the hairline INSIDE a material - rows, cells,
     bands. RULE_2 is THE SEAM: every material boundary, every region
     boundary, the head of every table. Both are pure neutral, a* 0.00
     b* 0.00, and that is the point: the rule belongs to neither
     material, so it can lie in the seam between them without taking a
     side. EDGE_OVER is Raking-through-Graphite's occluding edge, kept
     unmodified in intent: on a dark ground the downward direction is
     arithmetically shut, so the edge that lies on another plate is the
     LIGHT, and the occluder draws it. --------------------------- */
  --zd-rule-1:      #555555;
  --zd-rule-2:      #818181;
  --zd-edge-over:   #998F86;
  --zd-grid:        #41372F;

  /* ===================================================== ink on stock */
  --zd-text-0:      #EFE7E0;
  --zd-text-1:      #DBD3CD;
  --zd-text-2:      #B9B2AD;
  --zd-text-3:      #A69F9A;
  --zd-text-inert:  #6C6763;

  /* ============================== ink on plate, the knockout ramp.
     Cool, because the plate is cool. NOT because it needs more
     contrast - KO_0 on PLATE_0 is 11.51:1 and TEXT_0 on STOCK_1 is
     11.49:1, which is the same number. The ramp exists so the ink
     belongs to its material, and for no other reason. ------------ */
  --zd-ko-0:        #E3E9F0;
  --zd-ko-1:        #BCC1C9;
  --zd-ko-2:        #9BA1A8;

  /* ==================================================== THE OVERPRINT
     ONE saturated ink, and it is laid ON the surface, never used AS the
     surface. Four jobs and no fifth: the register mark, the focus rule
     and left overprint, the caret and the ruler datum, and the FAIL
     state. Re-picked for this ground rather than lightened from paper:
     PLATE's #B7311A measures 1.42:1 on STOCK_1 and is unusable.
     #FF5A3C  L* 60.66  h 39.5  C* 79.3
       4.53:1 on STOCK_1, 4.54:1 on PLATE_0, 4.92:1 on STOCK_0.
     It clears the 4.5 body floor on BOTH materials with ONE value.
     Its luminance ratio is what survives greyscale, and 4.53:1 is a
     ratio, so the overprint is the one part of the focus signal that a
     monochrome display still carries. That is why it exists.
     ONE fill exception, named: ZD_INK_ON on a solid vermilion field, on
     the close control only. A solid plate of the ink is reserved for
     the single irreversible control on the window. ---------------- */
  --zd-verm:        #FF5A3C;
  --zd-ink-on:      #2F261F;

  /* ================================================ state, two hues.
     Desaturated on purpose: C* 35 and 44 against the overprint's 79, so
     the vermilion is unambiguously the one SATURATED ink. FAIL is the
     vermilion itself - the machine's one loud ink means one thing,
     "look here", and an error is that. -------------------------- */
  --zd-ok:          #86B882;
  --zd-warn:        #D6B164;

  /* -------------------------------------------------------- metrics
     Spacing on 4 / 8 / 12 / 16 / 24 only. Every height below is a
     multiple of 4. Rules and marks are 1, 2 and 3 device px and are
     NOT on the spacing scale, because a hairline is a hairline at
     every ui scale. */
  --ui: 1;
  --sp-1: calc(4px  * var(--ui));
  --sp-2: calc(8px  * var(--ui));
  --sp-3: calc(12px * var(--ui));
  --sp-4: calc(16px * var(--ui));
  --sp-6: calc(24px * var(--ui));
  --zd-rail-w:  calc(152px * var(--ui));
  --zd-strip-h: calc(28px  * var(--ui));
  --zd-foot-h:  calc(44px  * var(--ui));
  --zd-title-h: calc(28px  * var(--ui));
  --zd-row-h:   calc(24px  * var(--ui));
  --zd-band-h:  calc(20px  * var(--ui));

  /* RADIUS. Graphite's 10dp plate is a soft edge and this direction
     imports hard rules; PLATE's 0 is a lie about fb_rrect, which
     anti-aliases corners for free and is the only reason the corner of
     a plate does not stair-step. 3dp is a machined chamfer: it reads as
     cut metal rather than as a rounded card, and it still exercises the
     AA corner path. Nesting halves it. */
  --zd-r-plate: calc(3px * var(--ui));
  --zd-r-inset: calc(2px * var(--ui));
  --zd-r-bolt:  0px;

  /* FOCUS geometry. Both are live settings; 3dp is the shipped mark. */
  --zd-mark:    calc(3px * var(--ui));
  --zd-rule-w:  calc(2px * var(--ui));

  /* THE TOOTH. A 2x1 ordered screen. In fb.c this is fb_gradient
     between two adjacent stock values: fb.c:1654-1665 already carries a
     4x4 ordered threshold at 8 extra bits of precision, so the screen
     costs ZERO new primitives. Verified by reading fb.c, not assumed.
     Here it is a repeating-conic-gradient at a 2px tile, which renders
     pixel-exact - measured off a headless screenshot: alternating
     (51,42,34) and (55,46,37) with no antialiased pixel between them. */
  --zd-tooth-cell: 2px;

  /* TYPE. Three sizes, because fb.c bakes three atlases and there is no
     runtime rasteriser. SM 11 / MD 13 / LG 21, ratios 1.182 and 1.615.
     TRACKING is imported from PLATE and it is the one type cost this
     direction pays. fb_text_role cannot track. But fb_glyph_aa can, and
     a tracked label is a loop over it with an added advance - roughly
     fifteen lines in ui.c, no new fb.c primitive. That is "nobody has
     written it yet", which is not the same thing as "the renderer
     cannot do it", and the distinction is the whole cost. */
  --fs-sm: calc(11px * var(--ui));
  --fs-md: calc(13px * var(--ui));
  --fs-lg: calc(21px * var(--ui));
  --lh-sm: calc(16px * var(--ui));
  --lh-md: calc(20px * var(--ui));
  --lh-lg: calc(28px * var(--ui));
  --zd-track: calc(1px * var(--ui));

  /* MOTION. Graphite's three durations and one curve, kept. PLATE's
     CUT 0 is not taken: a plate that changes material with no transit
     reads as a repaint bug rather than as a state change. */
  --ms-rise:   90ms;
  --ms-travel: 160ms;
  --ms-settle: 240ms;
  --ease: cubic-bezier(0.200, 0.850, 0.300, 1.000);

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ======================================================================
   design.h - THE DERIVED LADDER. Work light.

   DERIVED, NOT INVERTED, and here is the derivation in one sentence:
   hold the L*-match between the two materials, hold the hue split, and
   move BOTH materials to the other end of the ladder together. Light
   mode is still two materials at one luminance; it is not stock on top
   and plate underneath.

     dark   STOCK_1 L* 17.81 / PLATE_0 L* 17.75   ratio 1.0018:1
     light  STOCK_1 L* 92.14 / PLATE_0 L* 92.01   ratio 1.0035:1

   WHAT IT LOSES, three things, each measured:

   1  THE TOOTH HALVES. The same screen amplitude in 8-bit steps buys
      dL* 1.83 at L* 18 and dL* 1.38 at L* 92, because dL* per unit Y falls as Y
      rises. 25 percent of the texture channel is gone and it cannot be
      bought back without widening the screen until it reads as a
      pattern instead of as a surface.
   2  THE LIGHT CHANGES WHICH EDGE CARRIES. This is Graphite's own
      finding and it holds here. On stock at L* 92 there is almost no
      headroom above the ground, so the STRUCK run collapses and the CUT
      groove takes over. Same recipe, same call site, same token names.
      ZD_EDGE_OVER goes DARK in this mode for exactly that reason.
   3  THE OVERPRINT LOSES ITS SECOND JOB. #C52506 is 4.72:1 on stock and
      sits 49 L* points BELOW its ground: it is a hole in the sheet. The
      dark #FF5A3C is 4.53:1 and sits 43 L* points ABOVE its ground: it
      is a light as well as an ink, which is why in dark it can rule a
      focused header at 2dp and still read as emitted. On paper the same
      2dp rule reads as printed. The ink survives; one of its two
      readings does not.

   What it KEEPS: the material law, the hue split, the neutral seam rule
   at almost the same grey (#818181 dark, #777777 light - the seam
   belongs to neither material in either mode, so it barely moves), the
   register, the module grid, the slug and every instrument.
   ====================================================================== */
:root[data-theme="light"] {
  --zd-stock-cut:   #BDB5AC;
  --zd-stock-well:  #D4CBC1;
  --zd-stock-0:     #E5DBD1;
  --zd-tooth-0:     #E2D8CE;
  --zd-stock-1:     #F1E7DC;
  --zd-tooth-1:     #EDE3D9;
  --zd-stock-2:     #FBF2E9;
  --zd-stock-graze: #FEF7F0;
  --zd-stock-lit:   #FFFCF6;

  --zd-plate-cut:   #B4BCC6;
  --zd-plate-0:     #E0E9F5;
  --zd-plate-1:     #ECF4FF;
  --zd-plate-graze: #F3F9FF;
  --zd-plate-lit:   #F9FDFF;

  --zd-rule-1:      #ABABAB;
  --zd-rule-2:      #777777;
  --zd-edge-over:   #6D6761;
  --zd-grid:        #CBC2B9;

  --zd-text-0:      #231F1A;
  --zd-text-1:      #35302B;
  --zd-text-2:      #57524D;
  --zd-text-3:      #67625E;
  --zd-text-inert:  #9A9591;

  --zd-ko-0:        #1B2026;
  --zd-ko-1:        #42474E;
  --zd-ko-2:        #63696F;

  --zd-verm:        #C52506;
  --zd-ink-on:      #FCF5EF;

  --zd-ok:          #2C612E;
  --zd-warn:        #6E520E;
}

/* ============================================================ reset == */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--zd-stock-0); color: var(--zd-text-1);
  font-family: var(--sans); font-size: var(--fs-md); line-height: var(--lh-md);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--zd-verm); color: var(--zd-ink-on); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--zd-stock-well); }
::-webkit-scrollbar-thumb { background: var(--zd-rule-1); border-radius: var(--zd-r-bolt); }

/* ============================================== THE TWO MATERIALS ====
   Two classes, and every surface in the document is one of them. The
   stock face carries the screen; the plate face never does. */
.stock { background-color: var(--zd-stock-1);
         background-image: repeating-conic-gradient(var(--zd-tooth-1) 0% 25%, transparent 0% 50%);
         background-size: var(--zd-tooth-cell) var(--zd-tooth-cell); }
.stock-0 { background-color: var(--zd-stock-0);
           background-image: repeating-conic-gradient(var(--zd-tooth-0) 0% 25%, transparent 0% 50%);
           background-size: var(--zd-tooth-cell) var(--zd-tooth-cell); }
.plate { background-color: var(--zd-plate-0); background-image: none; }
body.notooth .stock, body.notooth .stock-0 { background-image: none; }

/* ============================================================= type == */
.t-sm { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.t-md { font-size: var(--fs-md); line-height: var(--lh-md); }
.t-lg { font-size: var(--fs-lg); line-height: var(--lh-lg); font-variant-numeric: tabular-nums; }
/* LABEL. PLATE's, imported whole: uppercase, tracked, small, and doing
   structural work rather than decorating. The tracking is the one thing
   in this document that needs code written for it. */
.t-lab { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
         letter-spacing: var(--zd-track); margin-right: calc(-1 * var(--zd-track));
         font-weight: 700; color: var(--zd-text-3); white-space: nowrap; }
.t-num { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
         font-variant-numeric: tabular-nums; }
.ink0 { color: var(--zd-text-0); } .ink1 { color: var(--zd-text-1); }
.ink2 { color: var(--zd-text-2); } .ink3 { color: var(--zd-text-3); }
.ko0 { color: var(--zd-ko-0); } .ko1 { color: var(--zd-ko-1); } .ko2 { color: var(--zd-ko-2); }
.verm { color: var(--zd-verm); }
.k-ok { color: var(--zd-ok); } .k-warn { color: var(--zd-warn); } .k-bad { color: var(--zd-verm); }
.bold { font-weight: 700; }
.spread { margin-left: auto; }

/* ============================================ the prototype strip ==== */
#strip {
  position: fixed; left: 0; right: 0; top: 0; height: calc(28px * var(--ui));
  background: var(--zd-plate-cut); color: var(--zd-ko-1); z-index: 400;
  display: flex; align-items: stretch;
  /* THE SEAM, not the ink. This border used to be 2dp of ZD_VERM run
     the full 1600px, which made the harness strip the single largest
     vermilion area anywhere on screen while meaning nothing - and it
     sat directly under the 2dp vermilion underline that marks the
     ACTIVE tab, so the one mark that carries information competed with
     a decoration. On #lock, where nothing sits below it, it read as a
     stray rule across an empty field. It is a material boundary, so it
     takes what every material boundary here takes: ZD_RULE_2. */
  border-bottom: var(--zd-rule-w) solid var(--zd-rule-2);
  font-size: var(--fs-sm);
}
#strip .nm { display: flex; align-items: center; padding: 0 var(--sp-3); color: var(--zd-ko-0);
             font-weight: 700; text-transform: uppercase; letter-spacing: var(--zd-track);
             flex: 0 0 auto; white-space: nowrap; }
#strip .pitch { display: flex; align-items: center; padding-right: var(--sp-3);
                font-family: var(--mono); color: var(--zd-ko-1); flex: 1 1 auto; min-width: 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#strip .links { display: flex; margin-left: auto; flex: 0 0 auto; }
#strip .links a { display: flex; align-items: center; padding: 0 var(--sp-2);
                  border-left: 1px solid var(--zd-rule-1); color: var(--zd-ko-1);
                  text-decoration: none; text-transform: uppercase; font-weight: 700;
                  letter-spacing: var(--zd-track); }
#strip .links a.on { color: var(--zd-ko-0); box-shadow: inset 0 calc(-2px * var(--ui)) 0 0 var(--zd-verm); }
#strip .links a:hover { color: var(--zd-ko-0); }
#strip .thm { display: flex; flex: 0 0 auto; }
#strip .tk { display: flex; align-items: center; padding: 0 var(--sp-2); cursor: pointer;
             border-left: 1px solid var(--zd-rule-1); color: var(--zd-ko-1); white-space: nowrap;
             text-transform: uppercase; font-weight: 700; letter-spacing: var(--zd-track); }
#strip .tk.on { color: var(--zd-ko-0); box-shadow: inset 0 calc(-2px * var(--ui)) 0 0 var(--zd-verm); }
#strip .hint { display: flex; align-items: center; padding: 0 var(--sp-2); flex: 0 0 auto;
               border-left: 1px solid var(--zd-rule-1); font-family: var(--mono); white-space: nowrap; }

/* =============================================================== os == */
#os { position: fixed; left: 0; right: 0; top: calc(28px * var(--ui)); bottom: 0;
      display: flex; overflow: hidden; }

/* ============================================================= rail ==
   PLATE's numbered REGISTER on Graphite's single rail, and the rail is
   the machine, so it is PLATE material end to end. 152dp, not Graphite's
   132: the register names are tracked uppercase here and "KERNEL LOG"
   at SM with 1dp tracking does not fit in 132. A free rider that is free
   with respect to colour is still paid for in geometry, and this is the
   invoice. The rail meets three screen edges so its radius is BOLT - a
   radius against a screen edge is a lie about a shape nobody can see. */
#rail {
  width: var(--zd-rail-w); flex: 0 0 var(--zd-rail-w);
  display: flex; flex-direction: column; position: relative; z-index: 60;
  border-right: 1px solid var(--zd-rule-2);
}
#rail .ident { padding: var(--sp-3) var(--sp-3) var(--sp-2); }
#rail .ident .w { font-size: var(--fs-lg); line-height: var(--lh-lg); color: var(--zd-ko-0);
                  font-weight: 700; text-transform: uppercase; letter-spacing: calc(2px * var(--ui)); }
#rail .sect { padding: var(--sp-2) var(--sp-3) var(--sp-1); display: block; color: var(--zd-ko-2); }
#rail .hr { height: 1px; background: var(--zd-rule-1); flex: 0 0 1px; }
#reg { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
.slot { display: flex; align-items: center; gap: var(--sp-2);
        height: var(--zd-row-h); padding: 0 var(--sp-2) 0 var(--sp-3); cursor: pointer;
        position: relative; color: var(--zd-ko-2);
        border-bottom: 1px solid var(--zd-rule-1); }
.slot .n { font-family: var(--mono); font-size: var(--fs-sm); font-variant-numeric: tabular-nums;
           color: var(--zd-ko-2); flex: 0 0 auto; }
.slot .nm { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: var(--zd-track);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot:hover { background: var(--zd-plate-1); }
.slot.run .n { color: var(--zd-ko-1); }
.slot.run .nm { color: var(--zd-ko-0); }
/* THE REGISTER MARK. A 3dp overprint on the rail's inner edge: open gets
   a short mark in ZD_RULE_2, focused gets the full row height in the
   vermilion. This is the third locus of the focus signal and the only
   one legible from the rail. It is an overprint, laid on the plate -
   the slot face never becomes the ink. */
.slot .mk { position: absolute; left: 0; top: 35%; bottom: 35%;
            width: var(--zd-mark); background: var(--zd-rule-2);
            transition: top var(--ms-rise) var(--ease), bottom var(--ms-rise) var(--ease),
                        background var(--ms-rise) var(--ease); }
.slot.act .mk { top: 0; bottom: 1px; background: var(--zd-verm); }
.slot.act .nm { color: var(--zd-ko-0); font-weight: 700; }
.slot.act .n { color: var(--zd-verm); }
#rail .wsrow { display: flex; flex: 0 0 auto;
               border-top: 1px solid var(--zd-rule-1); border-bottom: 1px solid var(--zd-rule-1); }
.wsb { flex: 1; height: var(--zd-row-h); display: flex; align-items: center;
       justify-content: center; cursor: pointer; border-right: 1px solid var(--zd-rule-1);
       color: var(--zd-ko-2); }
.wsb:last-child { border-right: 0; }
.wsb.on { color: var(--zd-ko-0); box-shadow: inset 0 calc(-3px * var(--ui)) 0 0 var(--zd-verm); }
#rail .stat { padding: var(--sp-1) var(--sp-3); }
.strow { display: flex; align-items: center; gap: var(--sp-2); height: var(--zd-band-h); }
.strow svg { flex: 0 0 auto; }
.strow .w { margin-left: auto; font-family: var(--mono); font-size: var(--fs-sm); }
#rail .clock { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
#rail .clock .hm { font-size: var(--fs-lg); line-height: var(--lh-lg); color: var(--zd-ko-0);
                   font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============================================================ field == */
#fieldwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

/* THE RASTER STRIP - Datum's, re-clocked to the damage flush the way
   both parents re-clocked it. Plate material: it is the machine talking
   about itself. */
#raster { height: var(--zd-strip-h); flex: 0 0 var(--zd-strip-h);
          border-bottom: 1px solid var(--zd-rule-2); display: flex; align-items: stretch;
          position: relative; overflow: hidden; }
#raster .lbl { position: absolute; left: var(--sp-3); top: 50%;
               transform: translateY(-50%); z-index: 2; pointer-events: none; color: var(--zd-ko-0); }
#raster .rd { position: absolute; right: var(--sp-3); top: 50%;
              transform: translateY(-50%); z-index: 2; pointer-events: none;
              display: flex; gap: var(--sp-3); align-items: baseline; }
#rcanvas { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }

#field { flex: 1; position: relative; overflow: hidden; }
/* THE RULED MODULE GRID, from PLATE. It is drawn on the desk and it
   explains where windows sit rather than decorating behind them: the
   module is COMPUTED from the field and the legend at the foot prints
   the number it was computed to. ZD_GRID is 1.316:1 on the desk - above
   the stock ladder's own steps (1.066 to 1.086) and far below the seam
   rule (3.606), so it reads as ruling and never as structure. */
#gridsvg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
#legend { position: absolute; left: var(--sp-4); bottom: var(--sp-1); pointer-events: none;
          color: var(--zd-text-2); z-index: 0; }
#wins { position: absolute; inset: 0; }
/* NO WALLPAPER GRADIENT. Graphite's field is one fb_glow from off-screen
   upper left; here the field is a material with tooth and a ruled grid,
   and a wash over the top of both would fight the screen. The raking
   light survives entirely on the edges, which is where it was always
   doing the work. */

/* ============================================================= foot ==
   THE PRINTER'S SLUG and Datum's MEMORY MAP RULER, one band, plate
   material. The slug is the sheet identifying itself at the foot: what
   this is, what it was set at, and how much of the machine it is using
   right now. The ruler is the whole address space, to scale, along the
   bottom edge, with a vermilion datum tick at the framebuffer. */
#foot { height: var(--zd-foot-h); flex: 0 0 var(--zd-foot-h);
        border-top: 1px solid var(--zd-rule-2);
        display: flex; flex-direction: column; padding: var(--sp-1) var(--sp-3) 0; }
#rulerbar { height: calc(12px * var(--ui)); display: flex; position: relative; flex: 0 0 auto;
            background: var(--zd-plate-cut); border: 1px solid var(--zd-rule-1); }
#rulerbar span { display: block; height: 100%; border-right: 1px solid var(--zd-rule-1); }
#rulerbar span:last-child { border-right: 0; }
#rulerbar u { position: absolute; top: calc(-3px * var(--ui)); bottom: calc(-3px * var(--ui));
              width: calc(2px * var(--ui)); background: var(--zd-verm); }
#slug { display: flex; align-items: center; gap: var(--sp-3); flex: 1; min-height: 0;
        overflow: hidden; }
#slug .t-num { color: var(--zd-ko-2); white-space: nowrap; }
#slug .v { color: var(--zd-ko-0); }

/* =========================================================== window ==
   THE SEAT RECIPE, Graphite's, taken unmodified because it is the half
   of the depth model this mix was told to keep:
     1  fb_rrect(x, y, w, h, r, ZD_STOCK_CUT)              the groove ring
     2  fb_rrect(x+1, y+1, w-2, h-2, r-1, <surface>)       the object
     3  fb_fill_px(x+r, y, w-2r, 1, <lit>)                 the struck top
     4  fb_fill_px(x, y+r, 1, h-2r, ZD_STOCK_GRAZE)        the grazed left
   ONE LIGHT, BOTH MATERIALS: <lit> is the LIT token of the face the run
   lands on, ZD_STOCK_LIT on a stock head band and ZD_PLATE_LIT on a
   focused one. Painting the stock token over the one cool band on the
   sheet was a warm edge on a cool face, and it overprinted the first of
   the two vermilion rows on the way past.
   Bottom and right stay CUT. One raking light, off screen upper left, no
   drop shadow at rest and NO DROP SHADOW AT ALL - see the drag note.
   When a plate lies OVER another plate its ring is ZD_EDGE_OVER, drawn
   by the occluder and never by the occluded. */
.win {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  border-radius: var(--zd-r-plate); border: 1px solid var(--zd-stock-cut);
  transition: border-color var(--ms-rise) var(--ease);
}
.win::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; z-index: 5;
  box-shadow: inset 0 1px 0 0 var(--zd-stock-lit), inset 1px 0 0 0 var(--zd-stock-graze);
  transition: box-shadow var(--ms-rise) var(--ease); }
.win.over { border-color: var(--zd-edge-over); }
.win.mini { display: none; }
.win.max { border-radius: var(--zd-r-bolt); }
/* THE DRAG CUE, and the reason this direction ships ZERO shadow tokens
   and ZERO blur tokens. Graphite lifts a dragged plate on
   0 6px 14px rgba(0,0,0,.55). Folio's one shadow buys 18.9 dL* of
   recession on paper and 8.7 dL* on dark stock, 46 percent, so a dark
   ground pays for the lift and gets under half of it. A dragged plate is
   over every other plate by definition, so the occlusion rule already
   draws all four of its edges; the cue is the vermilion perimeter, which
   is the ink already reserved for "the machine wants your attention".
   fb_shadow and fb_blur_paint are never called by this design. */
.win.drag { border-color: var(--zd-verm); transition: none; }
.win.drag::after { box-shadow: inset 0 0 0 var(--zd-mark) var(--zd-verm); }

/* THE HEADER, and THE KNOCKOUT - the whole argument of this direction.

   PLATE knocks a focused header out to solid ink. On Graphite's ladder
   that computes 11.92:1 against ZD_BASE, six times the achromatic
   budget, and it does two measurable kinds of damage:
     1  the light inverts sign. ZD_LIT, which IS the struck top edge,
        computes 5.98:1 DARK against the knockout and ZD_CUT computes
        15.88:1, so the raised edge reads as a groove and the groove
        becomes the loudest line on screen.
     2  surface steps already below threshold stop being read at all.

   INKSTOCK keeps the GESTURE and moves it off the luminance axis. The
   focused header does not go to ink; it changes MATERIAL. Stock to
   plate. The machine claims the header of the window you are driving,
   and the rail's focused row does the reciprocal thing.

     knockout luminance ratio       1.0018:1   (PLATE's: 11.92:1)
     dL* across the knockout        0.061      (PLATE's: 74.0)
     ZD_STOCK_LIT before / after    1.868:1 lighter / 1.871:1 lighter
     ZD_STOCK_CUT before / after    1.255:1 darker  / 1.252:1 darker

   Every edge in the recipe keeps its SIGN and changes its ratio by
   0.003. Failure 1 does not occur. And because the knockout adds
   1.0018:1 to the achromatic budget - that is, nothing - the surface
   steps are not outranked either, so failure 2 does not occur.

   THE COST, stated: a knockout that is invisible in luminance is
   invisible to a luminance-only observer. That is what the 2dp
   vermilion rule across the head of the band and the 3dp vermilion
   overprint down the left edge are for. Both are 4.54:1 against the
   knocked-out header AS A LUMINANCE RATIO, so both survive greyscale,
   monochrome output and achromatopsia. The material change is the
   signal; the overprint is the floor under it. */
.tbar { height: var(--zd-title-h); flex: 0 0 var(--zd-title-h); display: flex;
        align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2) 0 var(--sp-3);
        cursor: default; position: relative; user-select: none;
        border-bottom: 1px solid var(--zd-rule-2);
        transition: background-color var(--ms-rise) var(--ease); }
.tbar .ttl { font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase;
             letter-spacing: var(--zd-track); color: var(--zd-text-2);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             transition: color var(--ms-rise) var(--ease); }
.tbar .sub { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-3);
             white-space: nowrap; }
.tbar .reg { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-3); }
.win.focus::after { box-shadow: inset 1px 0 0 0 var(--zd-stock-graze); }
.win.focus .tbar { border-bottom-color: var(--zd-rule-2);
                   box-shadow: inset 0 1px 0 0 var(--zd-plate-lit),
                               inset 0 calc(1px + var(--zd-rule-w)) 0 0 var(--zd-verm); }
.win.focus .tbar .ttl { color: var(--zd-ko-0); }
.win.focus .tbar .sub { color: var(--zd-ko-2); }
.win.focus .tbar .reg { color: var(--zd-verm); }
.win.focus .cbtn { color: var(--zd-ko-2); }
.win.focus .cbtn:hover { background: var(--zd-plate-1); color: var(--zd-ko-0); }
/* THE LEFT OVERPRINT. 3dp of the one ink down the full height, laid
   INBOARD of the grazed left by one pixel. It used to start at left 0
   with z-index 6, which painted over the 1px ZD_STOCK_GRAZE that
   .win.focus::after declares one line below - measured on a rendered
   sheet, the focused window's left edge read CUT, verm, verm, verm,
   body, while every unfocused sheet read CUT, GRAZE, body. The focused
   window was the ONE window in the system with no grazed left, which is
   backwards: it is the sheet that should read most raised. The mark is
   an overprint, so it lies ON the surface and not ON the edge. */
.foc-mark { position: absolute; left: 1px; top: 0; bottom: 0; width: var(--zd-mark);
            background: var(--zd-verm); z-index: 6; pointer-events: none; display: none; }
.win.focus .foc-mark { display: block; }
body.noknock .win.focus .tbar { background-color: var(--zd-stock-1) !important;
                                background-image: repeating-conic-gradient(var(--zd-tooth-1) 0% 25%, transparent 0% 50%);
                                background-size: var(--zd-tooth-cell) var(--zd-tooth-cell); }
body.noknock .win.focus .tbar .ttl { color: var(--zd-text-0); }
body.noknock .win.focus .tbar .sub { color: var(--zd-text-3); }
body.nomark .foc-mark { display: none; }

.cbtn { width: var(--sp-6); height: var(--zd-band-h); display: flex;
        align-items: center; justify-content: center; cursor: pointer;
        color: var(--zd-text-3); border-left: 1px solid var(--zd-rule-1); }
.tbar .ctl { display: flex; margin-left: auto; align-items: stretch; height: 100%; }
.cbtn:hover { background: var(--zd-stock-2); color: var(--zd-text-0); }
/* the one solid overprint in the system, on the one irreversible control */
.cbtn.x:hover { background: var(--zd-verm); color: var(--zd-ink-on); }

.wbody { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding: var(--sp-2) var(--sp-3) var(--sp-2); gap: var(--sp-1); overflow: hidden; }
/* THE STATUS BAND with Datum's per window app_us. A free rider: mono ink
   in a band the sheet already had. It costs one real thing and it is not
   visual - wm.c measures app_us in AGGREGATE only, so per window
   attribution is new work. The fallback is the window's repaint_pixels
   in the same slot, and the settings pane switches between them so the
   fallback is something you can look at rather than a sentence. */
.sband { height: var(--zd-band-h); flex: 0 0 var(--zd-band-h);
         display: flex; align-items: center; gap: var(--sp-3);
         border-top: 1px solid var(--zd-rule-2); margin: 0 calc(-1 * var(--sp-3));
         padding: 0 var(--sp-3); }
body.nous .sband .us { display: none; }
.grip { position: absolute; right: 0; bottom: 0;
        width: var(--sp-4); height: var(--sp-4); cursor: nwse-resize; z-index: 6; }

/* ======================================================= primitives ==
   Hard rules everywhere, from PLATE. Nothing inside a window separates
   by value alone: every adjacency is a 1px ZD_RULE_1 at 1.884:1 or a
   ZD_RULE_2 seam at 3.606:1, and the surface step only confirms it. */
.hr  { height: 1px; background: var(--zd-rule-1); flex: 0 0 1px; }
.hr2 { height: 1px; background: var(--zd-rule-2); flex: 0 0 1px; }
.row { display: flex; align-items: center; gap: var(--sp-2); flex: 0 0 auto; }
.stack { display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.scroll.more { border-bottom: var(--zd-rule-w) solid var(--zd-rule-2); }
/* SUNKEN: the seat recipe with the sign flipped, on stock. */
.well { background: var(--zd-stock-well); border-radius: var(--zd-r-inset);
        border: 1px solid var(--zd-rule-1);
        box-shadow: inset 0 1px 0 0 var(--zd-stock-cut), inset 0 -1px 0 0 var(--zd-stock-graze);
        padding: var(--sp-1) var(--sp-2); }
/* RAISED, one nesting level in, still stock. */
.well .t-lab { color: var(--zd-text-2); }
.card { background-color: var(--zd-stock-2); border-radius: var(--zd-r-inset);
        border: 1px solid var(--zd-rule-1);
        box-shadow: inset 0 1px 0 0 var(--zd-stock-lit);
        padding: var(--sp-1) var(--sp-2); }
/* A PLATE INSET inside a stock sheet: the machine quoting itself inside
   the user's document. Flat, cool, no tooth, ruled seam. */
.inset-plate { background: var(--zd-plate-0); border-radius: var(--zd-r-inset);
               border: 1px solid var(--zd-rule-2); padding: var(--sp-1) var(--sp-2); }
.inset-plate .t-num, .inset-plate .pre { color: var(--zd-ko-1); }
.btn { display: inline-flex; align-items: center; gap: var(--sp-1);
       height: var(--zd-row-h); padding: 0 var(--sp-3);
       background: var(--zd-stock-2); border: 1px solid var(--zd-rule-1);
       box-shadow: inset 0 1px 0 0 var(--zd-stock-lit); border-radius: var(--zd-r-inset);
       cursor: pointer; color: var(--zd-text-2); white-space: nowrap; }
.btn:hover { color: var(--zd-text-0); border-color: var(--zd-rule-2); }
.btn:active { background: var(--zd-stock-well); box-shadow: inset 0 1px 0 0 var(--zd-stock-cut); }
/* PRIMARY IS AN OVERPRINT, not a fill. The face stays stock; a 2dp
   vermilion rule is laid across its head. The ink is never the surface. */
.btn.prim { box-shadow: inset 0 var(--zd-rule-w) 0 0 var(--zd-verm); color: var(--zd-text-0); }
.btn.prim .t-lab { color: var(--zd-text-0); }
table { width: 100%; border-collapse: collapse; }
th { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
     letter-spacing: var(--zd-track); color: var(--zd-text-3); font-weight: 700; text-align: left;
     padding: 0 var(--sp-2); height: var(--zd-band-h);
     border-bottom: 1px solid var(--zd-rule-2);
     position: sticky; top: 0; background: var(--zd-stock-1); }
td { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
     color: var(--zd-text-2); padding: calc(2px * var(--ui)) var(--sp-2);
     border-bottom: 1px solid var(--zd-rule-1);
     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.r, th.r { text-align: right; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--zd-stock-2); color: var(--zd-text-1); }
/* SELECTION IS AN OVERPRINT TOO. The row rises one stock rung and takes
   a 3dp vermilion mark on its leading edge. It does not become the ink. */
tr.sel td { background: var(--zd-stock-2); color: var(--zd-text-0); }
tr.sel td:first-child { box-shadow: inset var(--zd-mark) 0 0 0 var(--zd-verm); }
.kv { display: flex; align-items: baseline; gap: var(--sp-2);
      min-height: var(--lh-md); border-bottom: 1px solid var(--zd-rule-1); }
.kv .k { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
         letter-spacing: var(--zd-track); font-weight: 700;
         color: var(--zd-text-3); width: calc(148px * var(--ui)); flex: 0 0 auto;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv .v { flex: 1; min-width: 0; font-family: var(--mono); font-size: var(--fs-sm);
         color: var(--zd-text-0); }
.meter { display: flex; align-items: center; gap: var(--sp-2); height: var(--zd-band-h); }
.meter .lb { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: var(--zd-track);
             font-weight: 700; color: var(--zd-text-3); width: calc(76px * var(--ui)); flex: 0 0 auto; }
.mtrack { flex: 1; height: var(--sp-2); background: var(--zd-stock-well);
          border: 1px solid var(--zd-rule-1); overflow: hidden; }
.mfill { height: 100%; background: var(--zd-text-2);
         transition: width var(--ms-settle) var(--ease); }
.mfill.warn { background: var(--zd-warn); } .mfill.bad { background: var(--zd-verm); }
.meter .vv { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-0);
             width: calc(56px * var(--ui)); text-align: right; flex: 0 0 auto; }
.dot { width: calc(8px * var(--ui)); height: calc(8px * var(--ui)); flex: 0 0 auto;
       border: 1px solid var(--zd-rule-1); }
/* THE STATE WORD BESIDE THE STATE COLOUR, kept from Graphite. Four
   characters of text next to the swatch, so the colour axis carries
   nothing alone. */
.sw { display: inline-flex; align-items: center; gap: var(--sp-1); }
.pre { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
       white-space: pre; color: var(--zd-text-2); }
.gut { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
       color: var(--zd-text-2); text-align: right; padding-right: var(--sp-2);
       border-right: 1px solid var(--zd-rule-1); flex: 0 0 auto; }
.caret { display: inline-block; width: calc(7px * var(--ui)); height: calc(13px * var(--ui));
         background: var(--zd-verm); vertical-align: text-bottom; }
body.blink .caret { animation: bl 1s steps(1) infinite; }
@keyframes bl { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
.spark { display: block; }

/* ========================================================= overview ==
   The activities overview is the machine arranging the user's documents,
   so its ground is PLATE and the thumbnails stay stock. Two materials,
   doing the one job the overview exists for. */
#overview { position: absolute; inset: 0; z-index: 200; display: none; }
#overview.on { display: flex; flex-direction: column; }
#overview .ohead { display: flex; align-items: center; gap: var(--sp-3);
                   padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--zd-rule-2); }
#overview .ogrid { flex: 1; position: relative; margin: var(--sp-4); }
/* A CARD IS A SHEET, so it takes the sheet's edges and the sheet's
   focus signal, not a third language of its own. Two things were wrong
   and both were measured on a rendered overview:

     1  .thumb's `inset 0 1px ZD_STOCK_LIT` never drew. An inset shadow
        on the card paints under its CHILDREN's backgrounds, and the
        first child IS the head band, so the struck top was covered on
        every card. Every window read raised and every card read flat.
        The lit run now lives on the band itself, which is the face it
        actually lands on - the same rule .win.focus .tbar follows.
     2  the focused card took `border-color: ZD_VERM`, a vermilion
        PERIMETER. That is the reserved DRAG cue (.win.drag), and it
        replaced ZD_EDGE_OVER, which is the occluder's border and the
        only thing separating a card from the plate field behind it.
        The focus signal is the same two marks a window uses: the
        material change in the band, a 2dp head rule, a 3dp overprint
        down the left, inboard of the edge. */
.thumb { position: absolute; border: 1px solid var(--zd-edge-over); overflow: hidden;
         cursor: pointer; border-radius: var(--zd-r-plate); }
.thumb .th { height: var(--zd-band-h); display: flex; align-items: center;
             gap: var(--sp-2); padding: 0 var(--sp-2);
             border-bottom: 1px solid var(--zd-rule-2);
             box-shadow: inset 0 1px 0 0 var(--zd-stock-lit),
                         inset 1px 0 0 0 var(--zd-stock-graze); }
.thumb.on .th { box-shadow: inset 0 1px 0 0 var(--zd-plate-lit),
                            inset 0 calc(1px + var(--zd-rule-w)) 0 0 var(--zd-verm),
                            inset 1px 0 0 0 var(--zd-plate-graze); }
.thumb.on::after { content: ''; position: absolute; left: 1px; top: 0; bottom: 0;
                   width: var(--zd-mark); background: var(--zd-verm);
                   z-index: 4; pointer-events: none; }
.thumb.on .th .ko0 { color: var(--zd-ko-0); }
.thumb .tc { position: absolute; inset: var(--zd-band-h) 0 0 0; overflow: hidden;
             transform-origin: 0 0; pointer-events: none; }

/* ========================================================== palette ==
   Plate, no shadow, no scrim blur. Datum's argument re-cut: a plate
   object on stock separates by material, by the seam rule at 3.61:1 and
   by the occluding edge at 4.44:1, which is more separation than a
   shadow gives and costs no blur arena. */
#palette { position: absolute; inset: 0; z-index: 260; display: none; }
#palette.on { display: block; }
#palette .scrim { position: absolute; inset: 0; background: var(--zd-plate-cut); opacity: .82; }
#palette .sheet { position: absolute; left: 50%; top: calc(56px * var(--ui));
                  transform: translateX(-50%); width: calc(560px * var(--ui));
                  border: 1px solid var(--zd-edge-over); overflow: hidden;
                  border-radius: var(--zd-r-plate);
                  box-shadow: inset 0 1px 0 0 var(--zd-plate-lit),
                              inset 0 calc(1px + var(--zd-rule-w)) 0 0 var(--zd-verm),
                              inset 1px 0 0 0 var(--zd-plate-graze); }
#palette .ph { display: flex; align-items: center; gap: var(--sp-3);
               padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--zd-rule-1); }
#palette .pin { display: flex; align-items: center; gap: var(--sp-2);
                margin: var(--sp-2) var(--sp-3); background: var(--zd-plate-cut);
                border: 1px solid var(--zd-rule-1); padding: var(--sp-1) var(--sp-2); }
#presults { max-height: calc(280px * var(--ui)); overflow-y: auto; }
.prow { display: flex; align-items: center; gap: var(--sp-3);
        padding: 0 var(--sp-3); height: var(--zd-row-h); cursor: pointer;
        border-bottom: 1px solid var(--zd-rule-1); color: var(--zd-ko-1); }
.prow:hover { background: var(--zd-plate-1); }
.prow.on { background: var(--zd-plate-1); box-shadow: inset var(--zd-mark) 0 0 0 var(--zd-verm); }
.prow.on .ko1 { color: var(--zd-ko-0); }
#palette .pf { display: flex; gap: var(--sp-3); align-items: center;
               padding: var(--sp-1) var(--sp-3); border-top: 1px solid var(--zd-rule-2); }

/* ============================================================= lock == */
#lock { position: fixed; inset: 0; z-index: 320; display: none;
        background: var(--zd-plate-cut); }
#lock.on { display: flex; align-items: center; justify-content: center; }
#lock .sheet { position: relative; width: calc(640px * var(--ui));
               border: 1px solid var(--zd-edge-over); overflow: hidden;
               border-radius: var(--zd-r-plate);
               box-shadow: inset 0 1px 0 0 var(--zd-stock-lit), inset 1px 0 0 0 var(--zd-stock-graze); }
#lock .sheet .tbar { box-shadow: inset 0 1px 0 0 var(--zd-plate-lit),
                                 inset 0 calc(1px + var(--zd-rule-w)) 0 0 var(--zd-verm); }
#lock .sheet .wbody { padding: var(--sp-4); gap: var(--sp-2); }
#lock .sheet .sband { margin: var(--sp-2) calc(-1 * var(--sp-4)) 0; padding: 0 var(--sp-4);
                      height: auto; min-height: var(--zd-band-h); align-items: flex-start; }
/* the lock takes the whole screen, so the slug follows it there: the
   machine identifying itself at the foot of its own plate. */
#lockslug { position: absolute; left: 0; right: 0; bottom: 0; height: var(--zd-foot-h);
            display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-3);
            border-top: 1px solid var(--zd-rule-1); }

/* ============================================================= menu ==
   Plate. The machine speaking, so it takes the machine's material. */
.menu { position: absolute; z-index: 300; display: none; min-width: calc(232px * var(--ui));
        border: 1px solid var(--zd-edge-over); padding: 0;
        border-radius: var(--zd-r-plate); overflow: hidden;
        box-shadow: inset 0 1px 0 0 var(--zd-plate-lit),
                    inset 1px 0 0 0 var(--zd-plate-graze); }
.menu.on { display: block; }
.menu .mh { padding: 0 var(--sp-3); height: var(--zd-band-h); display: flex; align-items: center;
            border-bottom: 1px solid var(--zd-rule-2); }
.mi { display: flex; align-items: center; gap: var(--sp-3);
      padding: 0 var(--sp-3); height: var(--zd-row-h); cursor: pointer; color: var(--zd-ko-1);
      border-bottom: 1px solid var(--zd-rule-1); }
.mi:hover { background: var(--zd-plate-1); box-shadow: inset var(--zd-mark) 0 0 0 var(--zd-verm); }
.mi:hover .t-md { color: var(--zd-ko-0); }
.mi.dis { color: var(--zd-ko-2); cursor: default; }
.mi.dis:hover { background: transparent; box-shadow: none; }
.msep { height: 1px; background: var(--zd-rule-2); }

/* =========================================================== toasts == */
#toasts { position: absolute; right: var(--sp-4); bottom: var(--sp-4);
          z-index: 280; display: flex; flex-direction: column; gap: var(--sp-2);
          align-items: flex-end; }
/* The toast is the machine speaking, so it is plate - and it was the one
   plate object in the system with no struck top and no grazed left: its
   only box-shadow was the vermilion mark, laid at left 0 where the graze
   belongs. It now takes the same four-call seat every other plate takes,
   with the overprint moved inboard by a pixel. */
.toast { width: calc(340px * var(--ui)); border: 1px solid var(--zd-edge-over);
         padding: var(--sp-2) var(--sp-3); position: relative; border-radius: var(--zd-r-plate);
         box-shadow: inset 0 1px 0 0 var(--zd-plate-lit),
                     inset 1px 0 0 0 var(--zd-plate-graze);
         animation: rise var(--ms-rise) var(--ease); }
.toast::before { content: ''; position: absolute; left: 1px; top: 0; bottom: 0;
                 width: var(--zd-mark); background: var(--zd-verm); pointer-events: none; }
@keyframes rise { from { opacity: 0; transform: translateY(var(--sp-1)); } }
body.nomo * { transition: none !important; animation: none !important; }

<script>
'use strict';
/* ======================================================================
 * INKSTOCK - a living prototype of the zlOS desktop.
 *
 *   ground      dark printed stock, warm, screened by an ordered dither
 *   chrome      machined plate, cool, flat, at the SAME luminance
 *   depth       Graphite's 1px struck edge and cut groove, three ranks
 *   boundary    Graphite's ZD_EDGE_OVER, plus PLATE's hard rules inside
 *   focus       the header changes MATERIAL, plus a vermilion overprint
 *   rail        PLATE's numbered register, tracked uppercase, Alt+NN
 *   arrangement PLATE's ruled module grid, computed and printed
 *   colour      ONE saturated ink, vermilion, four jobs, never a surface
 *   instrument  Datum's raster strip, per window us, memory ruler, slug
 *
 * Every colour is a custom property. There is no hex literal below.
 * ====================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const cs = getComputedStyle(document.documentElement);

/* --------------------------------------------------- contrast, computed
 * Not estimated. Every number printed in the settings pane and in the
 * system window comes out of these functions at run time, against the
 * tokens as the browser resolved them, so a token edit moves the number.
 */
function tokHex(n) {
  let v = cs.getPropertyValue(n).trim();
  for (let i = 0; i < 4 && /^var\(/.test(v); i++)
    v = cs.getPropertyValue(v.slice(4, -1).trim()).trim();
  return v.toUpperCase();
}
function rgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function relY(h) { const c = rgb(h); return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
function ratio(a, b) {
  const x = relY(tokHex(a)), y = relY(tokHex(b));
  return ((Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05));
}
function r2(a, b) { return ratio(a, b).toFixed(2); }
function r3(a, b) { return ratio(a, b).toFixed(3); }
function r4(a, b) { return ratio(a, b).toFixed(4); }
/* CIELAB, because this direction's whole claim lives on the axes that a
 * luminance ratio cannot see. D65, 2 degree observer. */
function lab(n) {
  const c = rgb(tokHex(n)).map(lin);
  const X = 0.4124 * c[0] + 0.3576 * c[1] + 0.1805 * c[2];
  const Y = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  const Z = 0.0193 * c[0] + 0.1192 * c[1] + 0.9505 * c[2];
  const f = t => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
  const fx = f(X / 0.95047), fy = f(Y / 1.0), fz = f(Z / 1.08883);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function lstar(n) { return lab(n)[0].toFixed(2); }
function hueAb(n) { const l = lab(n); return ((Math.atan2(l[2], l[1]) * 180 / Math.PI) % 360 + 360) % 360; }
function chroma(n) { const l = lab(n); return Math.hypot(l[1], l[2]); }
function dE(a, b) {
  const p = lab(a), q = lab(b);
  return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
}
function dHue(a, b) {
  let d = Math.abs(hueAb(a) - hueAb(b));
  return d > 180 ? 360 - d : d;
}
function isLighter(a, b) { return relY(tokHex(a)) > relY(tokHex(b)); }
function darkCeil(n) { return ((relY(tokHex(n)) + 0.05) / 0.05).toFixed(3); }
function liteCeil(n) { return ((1.05) / (relY(tokHex(n)) + 0.05)).toFixed(3); }
/* the L* amplitude of the ordered screen: the texture channel, measured */
function toothAmp(a, b) { return Math.abs(lab(a)[0] - lab(b)[0]).toFixed(2); }
function toothMean(a, b) { return ((lab(a)[0] + lab(b)[0]) / 2).toFixed(2); }

  power: '<path d="M6.5 6.5 A8 8 0 1 0 17.5 6.5"/><rect x="11.2" y="2.5" width="1.6" height="8" class="sol"/>',
  vol:   '<path d="M4 9.5 L8 9.5 L12.5 5.5 L12.5 18.5 L8 14.5 L4 14.5 Z" class="sol"/><path d="M16 9 A5 5 0 0 1 16 15" class="w1"/><path d="M18.5 6.5 A9 9 0 0 1 18.5 17.5" class="w1"/>',
  lock:  '<rect x="5" y="10" width="14" height="10" rx="1"/><path d="M8 10 V7.5 A4 4 0 0 1 16 7.5 V10" class="w1"/><rect x="11" y="13" width="2" height="4" class="sol"/>'

function icon(n, px, col) {
  const p = ICO[n] || ICO.chip;

/* ============================================================ state == */
const S = {

  wins: {}, focus: null, z: 10,
  fileSel: 1, procSel: 0, logSel: 0, hexPage: 0, setTab: 0,

let ZT = 10;

/* ============================================================== data ==
 * Real kernel file names, real Intel Gen9 register values, plausible
 * timings, real looking logs. Nothing here is filler.
 */
const FILES = [
  ['kernel.zl',    '41.2 KiB',  'zl source', '-r--r--r--', '12:04'],
  ['fb.c',         '68.4 KiB',  'C source',  '-r--r--r--', '12:04'],

  ['heap.c',       '9.3 KiB',   'C source',  '-r--r--r--', '10:40'],

const SRC = {
  'fb.c':
'1654  /* A gradient, DITHERED. truncating the interpolation to\n' +
'1655     whole bytes leaves horizontal stripes wherever the\n' +
'1656     colour holds for several rows. so the interpolation\n' +
'1657     is kept at 8 extra bits and an ordered 4x4 threshold\n' +
'1658     decides whether each pixel rounds up. THIS IS THE\n' +
'1659     SCREEN INKSTOCK USES FOR THE TOOTH - two adjacent\n' +
'1660     stock values through the same call, no new code. */\n' +
'1661  static const unsigned char dither4[4][4] = {\n' +
'1662      {   0, 136,  34, 170 },\n' +
'1663      { 204,  68, 238, 102 },\n' +
'1664      {  51, 187,  17, 153 },\n' +
'1665      { 255, 119, 221,  85 }\n' +
'1666  };\n' +

/* ================================================= render primitives == */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function hx(v, n) { let s = (v >>> 0).toString(16).toUpperCase(); while (s.length < n) s = '0' + s; return s; }
function TBL(cols, rows) {
  return '<table><thead><tr>' + cols.map(c =>
    '<th' + (c.r ? ' class="r"' : '') + (c.w ? ' style="width:' + c.w + '"' : '') + '>' + c.h + '</th>').join('') +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => {
    if (typeof c === 'object') return '<td class="' + (c.c || '') + '">' + c.t + '</td>';
    return '<td>' + esc(c) + '</td>';
  }).join('') + '</tr>';
}
function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function meter(lb, val, unit, kind) {
  return '<div class="meter"><span class="lb">' + lb + '</span><div class="mtrack">' +
    '<div class="mfill ' + (kind || '') + '" style="width:' + Math.max(0, Math.min(100, val)) + '%"></div>' +
    '</div><span class="vv">' + val.toFixed(1) + unit + '</span></div>';
}
/* THE STATE WORD BESIDE THE STATE COLOUR. Kept from Graphite, and here it
 * matters more: a system whose primary separation is hue must never put
 * meaning on hue alone anywhere else. */
function sw(w) {
  const m = { OK: 'ok', PASS: 'ok', UP: 'ok', RUN: 'ok', LISTEN: 'ok', ESTABLISHED: 'ok',
              WARN: 'warn', BOUND: 'warn', DRIFT: 'warn', RO: 'warn',
              FAIL: 'bad', DOWN: 'bad', Z: 'bad' };
  const k = m[w] || 'ok';
  const c = k === 'ok' ? 'var(--zd-ok)' : k === 'warn' ? 'var(--zd-warn)' : 'var(--zd-verm)';
  const ink = k === 'ok' ? 'k-ok' : k === 'warn' ? 'k-warn' : 'k-bad';
  return '<span class="sw"><span class="dot" style="background:' + c + '"></span>' +
    '<span class="t-num ' + ink + '">' + w + '</span></span>';
}
function spark(series, w, h, max, col) {
  const n = series.length, sw2 = w / n;
  let d = '';
  series.forEach((v, i) => {
    const bh = Math.max(1, Math.round((v / max) * (h - 1)));
    d += '<rect x="' + (i * sw2).toFixed(2) + '" y="' + (h - bh) + '" width="' +
      Math.max(1, sw2 - 0.6).toFixed(2) + '" height="' + bh + '" fill="' + col + '"/>';
  });
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" ' +
    'shape-rendering="crispEdges" aria-hidden="true">' + d + '</svg>';
}
function usBand(id) {
  const w = S.wins[id]; if (!w) return '';
  const mode = S.cfg.us;
  if (mode === 'off') return '';
  const val = mode === 'measured'
    ? '<span class="t-num ink0">' + w.us + ' us</span>'
    : '<span class="t-num ink0">' + w.px.toLocaleString('en-US') + ' px</span>';
  return '<span class="us row" style="gap:var(--sp-1)">' +
    '<span class="t-lab">' + (mode === 'measured' ? 'app us' : 'repaint px') + '</span>' + val + '</span>';
}
/* the per window status band, and the module coordinate that PLATE's
 * arrangement axis makes meaningful: a sheet knows which modules it owns */
function band(id, left) {
  const w = S.wins[id];
  const mod = w ? modOf(w) : '-';
  return '<div class="sband"><span class="t-lab">' + APP[id].n + '</span>' +
    '<span class="t-num ink3">' + left + '</span>' + usBand(id) +
    '<span class="t-lab">module</span><span class="t-num ink2">' + mod + '</span>' +
    '<span class="spread t-num ink3">ws ' + (w ? ('0' + w.ws) : '01') + '</span></div>';
}

R.hex = () => {
  const base = 0x1000 * S.hexPage;
  let rows = [];
  for (let r = 0; r < 20; r++) {
    const off = base + r * 16;
    let hexs = '', asc = '';
    for (let i = 0; i < 16; i++) {
      const b = (off * 31 + i * 17 + (i & 3) * 41) & 0xFF;
      hexs += hx(b, 2) + (i === 7 ? '  ' : ' ');
      asc += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
    }
    rows.push(TR([{ t: '<span class="ink3">' + hx(off, 8) + '</span>' },
      { t: '<span class="ink1">' + hexs.trim() + '</span>' },
      { t: '<span class="ink2">' + esc(asc) + '</span>' }]));
  }
  return '<div class="row" style="height:var(--zd-band-h)"><span class="t-lab">device</span>' +
    '<span class="t-num ink1">rd0</span><span class="t-lab">offset</span>' +
    '<span class="t-num ink0">0x' + hx(base, 8) + '</span>' +
    '<span class="spread t-num ink3">zlfs superblock &middot; generation 3</span></div>' +
    '<div class="scroll">' + TBL([{ h: 'offset', w: '16%' }, { h: 'bytes', w: '62%' },
      { h: 'ascii', w: '22%' }], rows) + '</div>' +

R.grid = () => {
  const g = GRID;

    const w = S.wins[id]; if (w.ws !== S.ws || w.min) return;
    const m = modRect(w);
    for (let r = m[1]; r < m[1] + m[3]; r++)
      for (let c = m[0]; c < m[0] + m[2]; c++) occ[r + ',' + c] = APP[id].n;
  });
  for (let r = 0; r < S.rows; r++) for (let c = 0; c < S.cols; c++) {
    const k = occ[r + ',' + c];
    cells += '<span style="height:calc(18px * var(--ui));background:var(--zd-' +
      (k ? 'stock-2' : 'stock-well') + ');display:flex;align-items:center;justify-content:center">' +
      (k ? '<span class="t-num verm">' + k + '</span>' : '') + '</span>';
  }
  cells += '</div>';
  return '<div class="row" style="height:var(--zd-band-h)"><span class="t-lab">module</span>' +

/* ============================================================ grid ====
 * PLATE's ruled module, COMPUTED from the field rather than fixed. The
 * legend at the foot prints the numbers it was computed to, so the grid
 * is a claim you can check rather than a decoration you cannot.
 */
const GRID = { W: 0, H: 0, mar: 16, gut: 8, colW: 0, rowH: 0 };
function computeGrid() {
  const f = $('#field');
  GRID.W = f.clientWidth; GRID.H = f.clientHeight;
  GRID.colW = Math.floor((GRID.W - 2 * GRID.mar - (S.cols - 1) * GRID.gut) / S.cols);
  GRID.rowH = Math.floor((GRID.H - 2 * GRID.mar - (S.rows - 1) * GRID.gut) / S.rows);
}
function modX(c) { return GRID.mar + c * (GRID.colW + GRID.gut); }
function modY(r) { return GRID.mar + r * (GRID.rowH + GRID.gut); }
function modW(n) { return n * GRID.colW + (n - 1) * GRID.gut; }
function modH(n) { return n * GRID.rowH + (n - 1) * GRID.gut; }
function modRect(w) {
  const c = Math.max(0, Math.round((w.x - GRID.mar) / (GRID.colW + GRID.gut)));
  const r = Math.max(0, Math.round((w.y - GRID.mar) / (GRID.rowH + GRID.gut)));
  const cw = Math.max(1, Math.round((w.w + GRID.gut) / (GRID.colW + GRID.gut)));
  const rh = Math.max(1, Math.round((w.h + GRID.gut) / (GRID.rowH + GRID.gut)));
  return [Math.min(c, S.cols - 1), Math.min(r, S.rows - 1),
          Math.min(cw, S.cols), Math.min(rh, S.rows)];
}
function modOf(w) {
  const m = modRect(w);
  return 'c' + (m[0] + 1) + ' r' + (m[1] + 1) + ' ' + m[2] + 'x' + m[3];
}
function drawGrid() {
  const svg = $('#gridsvg');
  computeGrid();
  svg.setAttribute('width', GRID.W); svg.setAttribute('height', GRID.H);
  if (!S.cfg.grid) { svg.innerHTML = ''; $('#legend').textContent = ''; return; }
  let s = '';
  for (let c = 0; c < S.cols; c++) {
    const x = modX(c);
    s += '<rect x="' + x + '" y="' + GRID.mar + '" width="1" height="' + (GRID.H - 2 * GRID.mar) +
      '" fill="var(--zd-grid)"/>';
    s += '<rect x="' + (x + GRID.colW - 1) + '" y="' + GRID.mar + '" width="1" height="' +
      (GRID.H - 2 * GRID.mar) + '" fill="var(--zd-grid)"/>';
  }
  for (let r = 0; r < S.rows; r++) {
    const y = modY(r);
    s += '<rect x="' + GRID.mar + '" y="' + y + '" width="' + (GRID.W - 2 * GRID.mar) +
      '" height="1" fill="var(--zd-grid)"/>';
    s += '<rect x="' + GRID.mar + '" y="' + (y + GRID.rowH - 1) + '" width="' +
      (GRID.W - 2 * GRID.mar) + '" height="1" fill="var(--zd-grid)"/>';
  }
  svg.innerHTML = s;
  $('#legend').textContent = 'module ' + S.cols + ' x ' + S.rows + '  col ' + GRID.colW +
    '  row ' + GRID.rowH + '  gutter ' + GRID.gut + '  margin ' + GRID.mar + '  computed';
}

/* ====================================================== window mgmt ===
 * wm.c is mechanically unchanged: floating, draggable, resizable, z
 * ordered, per window surface cache. Two additions, both risks Raking
 * named and did not fix.
 *   1  THE RAIL MUST NEVER BE COVERED. wm.c has no reserved strut, so
 *      wm_open and drag clamp. With no top bar and no dock the rail is
 *      the only route to every system function.
 *   2  OVERLAP IS COMPUTED, because the occluder draws the border.
 */
function openWin(id, rect, ws) {
  const a = APP[id];
  if (S.wins[id]) { focusWin(id); return; }
  const r = rect || a.p;
  S.wins[id] = { id: id, x: r[0], y: r[1], w: r[2], h: r[3], ws: ws || S.ws,
                 min: false, max: false, z: ++ZT,
                 us: 340 + ((id.charCodeAt(0) * 37) % 900),
                 px: 40000 + ((id.charCodeAt(0) * 5417) % 260000) };
  buildWin(id); focusWin(id); layout();
}
function closeWin(id) {
  const e = $('.win[data-id="' + id + '"]'); if (e) e.remove();
  delete S.wins[id];
  if (S.focus === id) {
    const rest = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min);
    S.focus = rest.length ? rest.sort((a, b) => S.wins[b].z - S.wins[a].z)[0] : null;
  }
  renderRail(); layout(); damage();
}
function focusWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].z = ++ZT; S.wins[id].min = false; S.focus = id;
  layout(); renderRail(); damage(); if (S.wins.grid) redraw('grid');
}
function minWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].min = true;
  if (S.focus === id) S.focus = null;
  layout(); renderRail(); damage();
  toast('minimised', APP[id].n + ' ' + APP[id].name.toUpperCase() + ' travels to its register slot in ' +
    'TRAVEL 160 ms, then the register mark drops back to ZD_RULE_2');
}
function maxWin(id) {
  const w = S.wins[id]; if (!w) return;
  if (w.max) { w.max = false; } else { w.pre = [w.x, w.y, w.w, w.h]; w.max = true; }
  focusWin(id);
}
function buildWin(id) {
  const a = APP[id];
  const e = document.createElement('div');
  e.className = 'win stock'; e.setAttribute('data-id', id);
  e.innerHTML =
    '<div class="tbar" data-drag="1">' +
    '<span class="reg">' + a.n + '</span>' +
    '<span class="ttl">' + a.name + '</span>' +
    '<span class="sub">' + a.sub + '</span>' +
    '<span class="ctl">' +
    '<span class="cbtn" data-wa="min" title="minimise"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9 H10"/></svg></span>' +
    '<span class="cbtn" data-wa="max" title="maximise"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="8" height="8"/></svg></span>' +
    '<span class="cbtn x" data-wa="close" title="close"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5"/></svg></span>' +
    '</span></div>' +
    '<span class="foc-mark"></span>' +
    '<div class="wbody"></div>' +
    '<svg class="grip" viewBox="0 0 14 14" fill="none" stroke="var(--zd-text-inert)" stroke-width="1.2">' +
    '<path d="M13 5 L5 13 M13 9 L9 13 M13 1 L1 13"/></svg>';
  $('#wins').appendChild(e);
  redraw(id);
}
function redraw(id) {
  const e = $('.win[data-id="' + id + '"]'); if (!e) return;
  const f = R[id] || (() => '<div class="well"><span class="pre ink2">no renderer</span></div>');
  $('.wbody', e).innerHTML = f();
  $$('.scroll', e).forEach(sc => sc.classList.toggle('more', sc.scrollHeight - sc.clientHeight > 2));
  /* the parity check runs whenever the ladder tab is on screen, not once
     at boot, so it reports the tokens as they are RIGHT NOW. */
  if (id === 'set' && S.setTab === 4) parityCheck();
}
function redrawAll() { Object.keys(S.wins).forEach(redraw); }
function overlaps(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
}
function layout() {
  const field = $('#field'), fw = field.clientWidth, fh = field.clientHeight;
  const list = Object.keys(S.wins).map(k => S.wins[k])
    .filter(w => w.ws === S.ws).sort((a, b) => a.z - b.z);
  Object.keys(S.wins).forEach(id => {
    const w = S.wins[id], e = $('.win[data-id="' + id + '"]');
    if (!e) return;
    if (w.ws !== S.ws || w.min) { e.style.display = 'none'; return; }
    e.style.display = '';
    let x = w.x, y = w.y, ww = w.w, hh = w.h;
    if (w.max) { x = 0; y = 0; ww = fw; hh = fh; }
    x = Math.max(0, Math.min(x, Math.max(0, fw - 120)));
    y = Math.max(0, Math.min(y, Math.max(0, fh - 60)));
    ww = Math.min(ww, fw); hh = Math.min(hh, fh);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.width = ww + 'px'; e.style.height = hh + 'px';
    e.style.zIndex = w.z;
    e.classList.toggle('focus', S.focus === id);
    e.classList.toggle('max', !!w.max);
    /* THE KNOCKOUT IS APPLIED HERE, and it is a class swap on the title
       band from the stock face to the plate face. Nothing else changes. */
    const tb = $('.tbar', e);
    const foc = S.focus === id && S.cfg.knock;
    tb.classList.toggle('plate', foc);
    tb.classList.toggle('stock', !foc);
    const me = { x: x, y: y, w: ww, h: hh };
    let over = false;
    if (S.cfg.over) {
      for (let i = 0; i < list.length; i++) {
        const o = list[i]; if (o.id === id || o.z >= w.z) continue;
        const oe = $('.win[data-id="' + o.id + '"]'); if (!oe || oe.style.display === 'none') continue;
        if (overlaps(me, { x: oe.offsetLeft, y: oe.offsetTop, w: oe.offsetWidth, h: oe.offsetHeight })) { over = true; break; }
      }
    }
    e.classList.toggle('over', over);
  });
}

/* ====================================================== raster strip == */
function damage(n) {
  const k = n || 1;
  for (let i = 0; i < k; i++) {
    S.composites++;
    S.raster.push({ us: 5200 + Math.round(Math.random() * 7000) });
  }
  if (S.raster.length > 900) S.raster.splice(0, S.raster.length - 900);
  drawRaster();
}
function drawRaster() {
  const c = $('#rcanvas'), p = c.parentElement;
  const w = p.clientWidth, h = p.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const budget = 16667;
  const norm = tokHex('--zd-ko-1'), warn = tokHex('--zd-warn'), rule = tokHex('--zd-rule-1');
  const x0 = 88, x1 = w - 470, span = Math.max(10, x1 - x0);
  const n = Math.min(S.raster.length, Math.floor(span / 2));
  const start = S.raster.length - n;
  for (let i = 0; i < n; i++) {
    const s = S.raster[start + i];
    const bh = Math.max(1, Math.round((s.us / budget) * (h - 8)));
    g.fillStyle = s.us > budget * 0.85 ? warn : norm;
    g.fillRect(x0 + i * 2, h - 4 - bh, 1, bh);
  }
  g.fillStyle = rule;
  g.fillRect(x0, h - 4, span, 1);
  const rd = $('#rasterrd');
  const idleH = S.cfg.rasterClock === 'frame' ? '215,993' : '0';
  rd.innerHTML = '<span class="t-lab" style="color:var(--zd-ko-2)">advance</span>' +
    '<span class="t-num ko0">' + S.cfg.rasterClock + '</span>' +
    '<span class="t-lab" style="color:var(--zd-ko-2)">idle wakeups/h</span>' +
    '<span class="t-num ' + (S.cfg.rasterClock === 'frame' ? 'k-warn' : 'ko0') + '">' + idleH + '</span>' +
    '<span class="t-lab" style="color:var(--zd-ko-2)">budget</span><span class="t-num ko2">16 667 us</span>';
}

/* ================================================ the foot: slug + ruler
 * The printer's slug, PLATE's instrumentation position, and Datum's
 * memory map in one band. Region identity is a value ramp plus a 1px
 * rule plus a spelled label - never value alone, because the neighbouring
 * tints on a dark ground run well under 1.5:1 and the rule is what
 * actually separates them.
 */
function renderFoot() {
  const tot = MEMMAP.reduce((a, m) => a + m[2], 0);
  const shades = ['--zd-ko-0', '--zd-ko-1', '--zd-ko-2', '--zd-plate-graze',
                  '--zd-plate-1', '--zd-plate-0', '--zd-plate-cut', '--zd-plate-cut'];
  let acc = 0, tick = 0;
  $('#rulerbar').innerHTML = MEMMAP.map((m, i) => {
    const pc = 100 * m[2] / tot;
    if (m[3] === 'fb') tick = acc + pc / 2;
    acc += pc;
    return '<span title="' + m[0] + '" style="width:' + pc.toFixed(3) +
      '%;background:var(' + shades[i] + ')"></span>';
  }).join('') + '<u style="left:' + tick.toFixed(3) + '%" title="framebuffer datum"></u>';
  const w = window.innerWidth, h = window.innerHeight;

    '<span class="t-num"><span class="v">zlOS 0.3</span> inkstock</span>' +

    '<span class="t-num">stock <span class="v">' + tokHex('--zd-stock-1') + '</span> plate <span class="v">' +
    tokHex('--zd-plate-0') + '</span> at <span class="v">' + r4('--zd-stock-1', '--zd-plate-0') + ':1</span></span>' +
    '<span class="t-num">screen <span class="v">dL* ' + toothAmp('--zd-stock-1', '--zd-tooth-1') + '</span></span>' +
    '<span class="t-num">module <span class="v">' + S.cols + 'x' + S.rows + '</span></span>' +
    '<span class="t-num spread">0x00100000 .. 0xC0611000 &middot; <span class="v">' +
    (tot / 1048576).toFixed(1) + ' MiB</span> mapped &middot; ' +
    (MEMMAP[MEMMAP.length - 1][2] / 1048576).toFixed(1) + ' MiB free</span>';

/* ========================================================= overview == */
function ovOn() { return $('#overview').classList.contains('on'); }
function showOverview(on) {
  $('#overview').classList.toggle('on', on);
  if (!on) return;
  const g = $('#ogrid'), gw = g.clientWidth || 1200, gh = g.clientHeight || 600;
  const list = Object.keys(S.wins).map(k => S.wins[k])
    .filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
  const cols = Math.min(3, Math.max(1, list.length));
  const rows = Math.ceil(list.length / cols) || 1;
  const cw = (gw - (cols - 1) * 16) / cols, ch = (gh - (rows - 1) * 16) / rows;
  g.innerHTML = list.map((w, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const foc = S.focus === w.id;
    return '<div class="thumb stock' + (foc ? ' on' : '') + '" data-act="ovpick" data-arg="' + w.id +
      '" style="left:' + (c * (cw + 16)) + 'px;top:' + (r * (ch + 16)) + 'px;width:' + cw + 'px;height:' + ch + 'px;visibility:hidden">' +
      '<div class="th ' + (foc ? 'plate' : 'stock') + '"><span class="t-num ' + (foc ? 'verm' : 'ink3') + '">' +
      APP[w.id].n + '</span>' +
      '<span class="t-lab" style="color:var(--zd-' + (foc ? 'ko-0' : 'text-2') + ')">' + APP[w.id].name + '</span>' +
      '<span class="spread t-num ' + (foc ? 'ko2' : 'ink3') + '">' + modOf(w) + '</span></div>' +
      '<div class="tc" data-src="' + w.id + '"></div></div>';
  }).join('');
  /* A THUMB IS AS TALL AS THE SHEET IT SHOWS. The cells used to be a
     uniform grid while the clone inside was scaled by WIDTH alone, so a
     wide short window left a third of its card as bare stock and the
     card's own status band floated in the middle of nothing. Height is
     now derived from the same scale factor the clone gets, rows take the
     tallest card in the row, and if the stack is deeper than the field
     one factor shrinks the whole thing and the block is centred. */
  const boxes = [];
  list.forEach(w => {
    const holder = $('.tc[data-src="' + w.id + '"]', g);
    const src = $('.win[data-id="' + w.id + '"] .wbody');
    if (!holder || !src) return;
    const box = holder.parentElement;
    const band = $('.th', box).offsetHeight;
    /* MEASURE THE SHEET, do not trust its record. w.w / w.h are the
       nominal module figures; the laid out body is what the clone has to
       reproduce, and the two differ by the border and the title band.
       Scaling by the nominal number laid the clone out at a width the
       content never used, which is where the empty third of every card
       came from. */
    const bw = src.offsetWidth, bh = src.offsetHeight;
    const sc = box.clientWidth / bw;
    const clone = src.cloneNode(true);
    clone.style.width = bw + 'px'; clone.style.height = bh + 'px';
    /* THE HOLDER TAKES THE SHEET'S SIZE AND THEN SHRINKS. It used to be
       stretched to the CARD and scaled from there, so overflow:hidden cut
       the clone at the card's box BEFORE the transform and the survivor
       was shrunk again: two thirds of every window, cut mid word, with
       the remaining third of the card left bare. */
    holder.style.right = 'auto'; holder.style.bottom = 'auto';
    holder.style.width = bw + 'px'; holder.style.height = bh + 'px';
    holder.style.transform = 'scale(' + sc.toFixed(4) + ')';
    holder.appendChild(clone);
    boxes.push({ box: box, band: band, h: band + bh * sc });
  });
  if (!boxes.length) return;
  /* the band is a real row of type and does not scale with the clone, so
     the fit factor is solved for the CONTENT only: rows of band plus q
     times the tallest clone in the row, plus the gutters, equal to the
     field. Each card then takes its own clone's height, which is why the
     feet of a row are ragged - they are five different sheets. */
  const nrow = Math.ceil(boxes.length / cols);
  const rowC = [];
  boxes.forEach((b, i) => {
    const r = Math.floor(i / cols);
    rowC[r] = Math.max(rowC[r] || 0, b.h - b.band);
  });
  const bandH = boxes[0].band;
  const sumC = rowC.reduce((a, v) => a + v, 0);
  const room = gh - (nrow - 1) * 16 - nrow * bandH;
  const q = sumC > room ? Math.max(0.2, room / sumC) : 1;
  const top = [];
  let acc = 0;
  rowC.forEach((v, r) => { top[r] = acc; acc += bandH + v * q + 16; });
  /* THE BLOCK HANGS FROM THE HEADER, it does not float in the field.
     This was (gh - height) / 2, which centred five cards in a field
     built for six and put 180 dp of bare plate between the ACTIVITIES
     line and the first card - a gap that reads as a layout failure
     rather than as breathing room. When the stack is deeper than the
     field q shrinks it and acc reaches gh, so this term was only ever
     non zero in the slack case, which is exactly the case it hurt. */
  const yoff = 0;
  const xoff = Math.max(0, (gw - (cols * cw * q + (cols - 1) * 16)) / 2);
  boxes.forEach((b, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    b.box.style.left = (xoff + c * (cw * q + 16)) + 'px';
    b.box.style.top = (yoff + top[r]) + 'px';
    b.box.style.width = (cw * q) + 'px';
    b.box.style.height = (bandH + (b.h - b.band) * q) + 'px';
    b.box.style.visibility = '';
    if (q < 1) {
      const holder = $('.tc', b.box);
      const cur = parseFloat((holder.style.transform.match(/[\d.]+/) || [1])[0]);
      holder.style.transform = 'scale(' + (cur * q).toFixed(3) + ')';
    }
  });
}
