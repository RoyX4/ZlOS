/* ============================================================= tick == */
function walk(v, lo, hi, amp) {
  v += (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, v));
}
function clockStr() {
  const d = new Date(2026, 7, 26, 14, 32, 7 + S.t);
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function tick() {
  S.t++;
  S.cpu = S.cpu.map(v => walk(v, 2, 96, 14));
  S.mem = walk(S.mem, 30, 72, 3);
  $('#clockhm').textContent = clockStr();
  $('#clockd').textContent = '26 aug 2026';
  if (S.cfg.rasterClock === 'frame') damage(6);
  else if (S.wins.mon || S.wins.net || S.wins.clock) damage(1);
  else drawRaster();
  ['mon', 'net', 'clock', 'sys'].forEach(id => { if (S.wins[id]) redraw(id); });
  if (S.wins.set && S.setTab === 3) redraw('set');
  if ($('#lock').classList.contains('on')) renderLock();
}

/* ========================================================== config === */
function applyCfg() {
  const d = document.documentElement;
  d.style.setProperty('--zd-mark', 'calc(' + S.cfg.mark + 'px * var(--ui))');
  d.style.setProperty('--ui', (S.cfg.ui / 100).toFixed(2));
  document.body.classList.toggle('noknock', !S.cfg.knock);
  document.body.classList.toggle('notooth', !S.cfg.tooth);
  document.body.classList.toggle('nomark', S.cfg.mark === 0);
  document.body.classList.toggle('nous', S.cfg.us === 'off');
  document.body.classList.toggle('nomo', !S.cfg.motion);
  document.body.classList.toggle('blink', S.cfg.motion);
  layout(); drawRaster(); drawGrid(); renderFoot();
}
function setWs(n) {
  S.ws = n;
  const cur = Object.keys(S.wins).filter(k => S.wins[k].ws === n && !S.wins[k].min);
  S.focus = cur.length ? cur.sort((a, b) => S.wins[b].z - S.wins[a].z)[0] : null;
  layout(); renderRail(); damage();
  toast('workspace 0' + n, cur.length + ' sheets. the register keeps its numbering across ' +
    'workspaces, so alt+NN means the same app on both');
}
/* PLATE's arrangement axis: tiling snaps to the ruled module, not to a
   free split, and the module is the one printed at the foot. */
function tileAll() {
  const list = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min);
  computeGrid();
  const cols = Math.ceil(Math.sqrt(list.length)) || 1;
  const rows = Math.ceil(list.length / cols) || 1;
  const cSpan = Math.floor(S.cols / cols), rSpan = Math.floor(S.rows / rows);
  list.forEach((id, i) => {
    const w = S.wins[id];
    w.max = false;
    const c = (i % cols) * cSpan, r = Math.floor(i / cols) * rSpan;
    w.x = modX(c); w.y = modY(r); w.w = modW(cSpan); w.h = modH(rSpan);
  });
  layout(); damage(); if (S.wins.grid) redraw('grid');
  toast('tiled onto the module', list.length + ' sheets on a ' + cSpan + ' x ' + rSpan +
    ' module block each. nothing overlaps, so every occlusion edge falls back to ZD_STOCK_CUT - ' +
    'which is exactly when that rule is inert');
}
function calcKey(k) {
  if (S.calcVal === undefined) S.calcVal = 241690;
  if (k === '=') { return; }
  if ('0123456789'.indexOf(k) >= 0) { S.calcVal = (S.calcVal * 10 + parseInt(k, 10)) % 1000000000; return; }
  if (k === '+') S.calcVal += 1000;
  else if (k === '-') S.calcVal = Math.max(0, S.calcVal - 1000);
  else if (k === '*') S.calcVal = Math.min(999999999, S.calcVal * 2);
  else if (k === '/') S.calcVal = Math.floor(S.calcVal / 2);
}

/* =========================================================== events == */
function winOf(el) { const w = el.closest('.win'); return w ? w.getAttribute('data-id') : null; }
function act(t, arg, ev) {
  switch (t) {
    case 'open': openWin(arg); break;
    case 'file': S.fileSel = +arg; redraw('files'); if (S.wins.edit) redraw('edit'); damage(); break;
    case 'proc': S.procSel = +arg; redraw('mon'); damage(); break;
    case 'log':  S.logSel = +arg; redraw('log'); damage(); break;
    case 'hexp': S.hexPage = Math.max(0, S.hexPage + (+arg)); redraw('hex'); damage(); break;
    case 'calc': calcKey(arg); redraw('calc'); damage(); break;
    case 'settab': S.setTab = +arg; redraw('set'); damage(); break;
    case 'cols': S.cols = Math.max(6, Math.min(20, S.cols + (+arg)));
      drawGrid(); renderFoot(); redraw('grid'); damage(); break;
    case 'tog': S.cfg[arg] = !S.cfg[arg]; applyCfg(); redraw('set'); damage();
      if (arg === 'knock') toast(S.cfg.knock ? 'knockout on' : 'knockout off',
        S.cfg.knock ? 'the focused header is PLATE. ' + r4('--zd-stock-1', '--zd-plate-0') +
          ':1 in luminance, dE*ab ' + dE('--zd-stock-1', '--zd-plate-0').toFixed(2) + ' in colour. no edge changes sign'
        : 'the header stays stock. what is left of the focus signal is the ' + S.cfg.mark +
          'dp overprint at ' + r2('--zd-verm', '--zd-stock-1') + ':1 and the register mark on the rail');
      else if (arg === 'tooth') toast(S.cfg.tooth ? 'stock screen on' : 'stock screen off',
        S.cfg.tooth ? 'STOCK_1 against TOOTH_1, ordered 2x1, amplitude dL* ' +
          toothAmp('--zd-stock-1', '--zd-tooth-1') + '. fb_gradient already does this, fb.c:1654'
        : 'flat fill. one of the three separation channels is now gone and the two ' +
          'materials are down to hue and the seam rule');
      else if (arg === 'over') toast(S.cfg.over ? 'occlusion edge on' : 'occlusion edge off',
        S.cfg.over ? 'a sheet over a sheet draws ZD_EDGE_OVER at ' + r2('--zd-edge-over', '--zd-stock-1') +
          ':1 on the body underneath'
        : 'fallback is ZD_STOCK_CUT at ' + r2('--zd-stock-cut', '--zd-stock-1') +
          ':1. drag two sheets over each other and try to read the stack order');
      else if (arg === 'grid') { drawGrid(); }
      break;
    case 'seg': { const p = arg.split(':'); S.cfg[p[0]] = p[1]; applyCfg(); redrawAll(); damage(); break; }
    case 'ws': setWs(+arg); break;
    case 'ovpick': showOverview(false); focusWin(arg); break;
    case 'prun': S.psel = +arg; runPalette(); break;
    case 'unlock': showLock(false); toast('unlocked', 'session resumed on tty1, seat0'); break;
    case 'detoast': { const e = ev.target.closest('.toast'); if (e) e.remove(); break; }
    case 'tile': tileAll(); break;
    case 'palette': showPalette(true); break;
    case 'overview': showOverview(!ovOn()); break;
    case 'lock': showLock(true); break;
    case 'closew': closeWin(arg); break;
    case 'minw': minWin(arg); break;
    case 'maxw': maxWin(arg); break;
    case 'toast': toast(arg === 'build' ? 'rebuilt' : arg === 'stat' ? 'stat' : 'block re-read',
      arg === 'build' ? 'zlos.elf 249.8 KiB, text 218432 data 30720 bss 1441792, 1.42 s'
      : arg === 'stat' ? FILES[S.fileSel][0] + ', generation 3, 1 extent, contiguous, crc verified'
      : 'pipe A read back, PSR idle, 241690 kHz unchanged'); break;
  }
}

      ['open 11 settings', 'open', 'set', false, 'alt 11'],
      ['open 15 module', 'open', 'grid', false, 'alt 15'],
      ['lock session', 'lock', '', false, 'ctrl l']
    ], 'desk');
  }
});
function startDrag(ev, id) {
  const w = S.wins[id]; if (!w || w.max) return;
  const e = $('.win[data-id="' + id + '"]');
  const ox = ev.clientX - e.offsetLeft, oy = ev.clientY - e.offsetTop;
  e.classList.add('drag');
  function mv(m) { w.x = m.clientX - ox; w.y = m.clientY - oy; layout(); }
  function up() {
    e.classList.remove('drag');
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(4); if (S.wins.grid) redraw('grid');
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startResize(ev, id) {
  const w = S.wins[id]; if (!w) return;
  w.max = false;
  const sx = ev.clientX, sy = ev.clientY, sw2 = w.w, sh = w.h;
  function mv(m) {
    w.w = Math.max(280, sw2 + m.clientX - sx);
    w.h = Math.max(160, sh + m.clientY - sy);
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(2); if (S.wins.grid) redraw('grid');
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startSlider(ev, el) {
  const key = el.getAttribute('data-slider');
  const lo = +el.getAttribute('data-lo'), hi = +el.getAttribute('data-hi');
  function set(e) {
    const r = el.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    S.cfg[key] = Math.round(lo + p * (hi - lo));
    applyCfg(); redraw('set');
  }
  set(ev);
  function up() { document.removeEventListener('mousemove', set); document.removeEventListener('mouseup', up); damage(); }
  document.addEventListener('mousemove', set);
  document.addEventListener('mouseup', up);
}
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if (ev.shiftKey && (k === 'D' || k === 'd')) { setTheme(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return; }
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); return; }
    if (k === 'Enter') { runPalette(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(pmatch().length - 1, S.psel + 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); return; }
    if (k.length === 1) { S.pq += k; S.psel = 0; renderPalette(); return; }
    return;
  }
  if ($('#lock').classList.contains('on')) {
    if (k === 'Escape' || k === 'Enter') { showLock(false); toast('unlocked', 'session resumed on tty1, seat0'); }
    return;
  }
  if (k === 'Escape') { if (ovOn()) showOverview(false); hideMenus(); return; }
  if (k === 'F1') { showOverview(!ovOn()); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'l' || k === 'L')) { showLock(true); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'g' || k === 'G')) { act('tog', 'grid'); ev.preventDefault(); return; }
  if (ev.altKey && (k === '1' || k === '2')) { setWs(+k); ev.preventDefault(); return; }
});

/* ============================================================ theme ==
 * DARK IS THE DEFAULT AND :root IS DARK. The hash is authoritative for
 * both scene and ladder: #files is INKSTOCK, #files-light is the derived
 * work-light ladder. That is the opposite suffix convention from
 * Graphite, and deliberately so - this direction's home is the unsuffixed
 * one and pretending otherwise would be a second lie about which ladder
 * the tokens were designed on.
 */
const LADDER = {
  dark: { name: 'inkstock', other: 'work light',
    pitch: 'two materials, both dark. warm screened stock, cool flat plate, ' +
           '1.0018:1 and 15.80 dE*ab apart.' },
  light: { name: 'work light', other: 'inkstock',
    pitch: 'the same two materials under work light. derived, not inverted, ' +
           'and both move up together.' }
};
function applyTheme() {
  if (S.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = LADDER[S.theme].pitch;
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-ladder="dark">inkstock</span>' +
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-ladder="light">work light</span>';
}
function hashName() { return S.scene + (S.theme === 'light' ? '-light' : ''); }
function setTheme(t, announce) {
  S.theme = t === 'light' ? 'light' : 'dark';
  applyTheme(); renderLinks(); drawRaster(); drawGrid(); renderFoot(); redrawAll(); renderRail();
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    toast(LADDER[S.theme].name, S.theme === 'dark'
      ? 'stock L* ' + lstar('--zd-stock-1') + ' / plate L* ' + lstar('--zd-plate-0') +
        ' at ' + r4('--zd-stock-1', '--zd-plate-0') + ':1, dE*ab ' + dE('--zd-stock-1', '--zd-plate-0').toFixed(2) +
        ', screen amplitude dL* ' + toothAmp('--zd-stock-1', '--zd-tooth-1') +
        ', struck edge carries at ' + r3('--zd-stock-lit', '--zd-stock-1') + ':1'
      : 'stock L* ' + lstar('--zd-stock-1') + ' / plate L* ' + lstar('--zd-plate-0') +
        ' at ' + r4('--zd-stock-1', '--zd-plate-0') + ':1, dE*ab ' + dE('--zd-stock-1', '--zd-plate-0').toFixed(2) +
        '. the screen falls to dL* ' + toothAmp('--zd-stock-1', '--zd-tooth-1') +
        ' and the cut edge takes over at ' + r3('--zd-stock-cut', '--zd-stock-1') +
        ':1 against a struck run of only ' + r3('--zd-stock-lit', '--zd-stock-1') + ':1');
  }
}
const SCENES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function renderLinks() {
  const sfx = S.theme === 'light' ? '-light' : '';
  $('#links').innerHTML = SCENES.map(n => '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-light$/, '') === S.scene));
}
$('#themetog').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-ladder]');
  if (t) { ev.preventDefault(); ev.stopPropagation(); setTheme(t.getAttribute('data-ladder'), true); }
});
/* TOKEN PARITY, checked at run time rather than promised in a comment.
 * Every name in the dark block must resolve in the light block and the
 * two must differ; a name that resolves to the same value in both, or
 * fails to resolve at all, is reported here. */
const TOKENS = ['--zd-stock-cut','--zd-stock-well','--zd-stock-0','--zd-tooth-0','--zd-stock-1',
  '--zd-tooth-1','--zd-stock-2','--zd-stock-graze','--zd-stock-lit','--zd-plate-cut','--zd-plate-0',
  '--zd-plate-1','--zd-plate-graze','--zd-plate-lit','--zd-rule-1','--zd-rule-2','--zd-edge-over',
  '--zd-grid','--zd-text-0','--zd-text-1','--zd-text-2','--zd-text-3','--zd-text-inert','--zd-ko-0',
  '--zd-ko-1','--zd-ko-2','--zd-verm','--zd-ink-on','--zd-ok','--zd-warn'];
function parityCheck() {
  const el = $('#parity'); if (!el) return;
  const was = S.theme;
  const a = {}, b = {};
  document.documentElement.removeAttribute('data-theme');
  TOKENS.forEach(t => { a[t] = tokHex(t); });
  document.documentElement.setAttribute('data-theme', 'light');
  TOKENS.forEach(t => { b[t] = tokHex(t); });
  if (was === 'dark') document.documentElement.removeAttribute('data-theme');
  const missing = TOKENS.filter(t => !a[t] || !b[t]);
  const same = TOKENS.filter(t => a[t] && a[t] === b[t]);
  el.innerHTML = missing.length
    ? '<span class="k-bad">' + missing.length + ' missing: ' + missing.join(' ') + '</span>'
    : TOKENS.length + ' of ' + TOKENS.length + ' resolve in both modes, ' + same.length + ' identical';
}

/* =========================================================== scenes == */
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.win[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZT = 10;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#toasts').innerHTML = '';
}
function put(id, x, y, w, h, ws) { openWin(id, [x, y, w, h], ws || S.ws); }
/* sheets are placed ON THE MODULE, not at arbitrary pixels. */
function putMod(id, c, r, cw, rh, ws) {
  computeGrid();
  openWin(id, [modX(c), modY(r), modW(cw), modH(rh)], ws || S.ws);
}
function baseDesktop() {
  clearAll();
  S.ws = 1; computeGrid();
  putMod('shell', 0, 0, 6, 4);
  putMod('files', 6, 0, 6, 4);
  putMod('mon',   0, 4, 6, 4);
  putMod('log',   6, 4, 6, 4);
  /* one sheet deliberately laid ACROSS two others, front most, because
     the occlusion rule is the whole reason this ground can float its
     windows and it should be visible without touching anything. */
  putMod('regs', 3, 2, 6, 4);
  putMod('hex', 0, 0, 7, 5, 2);
  putMod('net', 4, 2, 7, 5, 2);
  focusWin('regs');
  layout(); damage(40);
}
function setScene(name, push) {
  let light = false;
  if (/-light$/.test(name)) { light = true; name = name.slice(0, -6); }
  if (SCENES.indexOf(name) < 0) { name = 'desktop'; light = false; }
  S.scene = name; S.theme = light ? 'light' : 'dark';
  applyTheme(); renderLinks(); computeGrid();
  if (push !== false) history.replaceState(null, '', '#' + hashName());

  if (name === 'desktop') {
    baseDesktop();
    toast('five sheets, one over two',
      '13 REGISTERS lies across 01 and 03. its edges are ZD_EDGE_OVER at ' +
      r2('--zd-edge-over', '--zd-stock-1') + ':1 on the bodies underneath, and its header is the ' +
      'only PLATE face among the five. a groove cannot do the boundary job: pure black on this ' +
      'ground tops out at ' + darkCeil('--zd-stock-1') + ':1 and the floor is 3.00');
  } else if (name === 'overview') {
    baseDesktop(); layout(); showOverview(true);
  } else if (name === 'palette') {
    baseDesktop(); S.pq = 'mo'; S.psel = 0; showPalette(true);
  } else if (name === 'files') {
    clearAll(); S.ws = 1; computeGrid();
    putMod('files', 0, 0, 5, 8);
    putMod('edit', 5, 0, 7, 8);
    S.fileSel = 1; redraw('files'); redraw('edit');
    focusWin('files'); layout(); damage(20);
    toast('selected', 'fb.c 68.4 KiB, opened in 04 EDITOR. 02 FILES is focused so its header is ' +
      'plate; 04 EDITOR is stock end to end. the two sheets abut on the module and do not ' +
      'overlap, so both draw ZD_STOCK_CUT and the occlusion rule is inert');
  } else if (name === 'monitor') {
    clearAll(); S.ws = 1; computeGrid();
    /* SIX ROWS, NOT EIGHT. At 7x8 the sheet was a third taller than
       anything it had to show: both columns ran out at row 5 and the
       focused window - the one sheet a reader is meant to look at -
       carried 300 dp of bare stock under its own content. Six rows is
       what the meters, the composite spark, the IRQ table and the
       process table actually occupy. The overlap with 08 NETWORK, which
       is the point of this scene, survives: mon holds cols 0-6 rows 0-5
       and net holds cols 5-11 rows 1-6. */
    putMod('mon', 0, 0, 7, 6);
    putMod('net', 5, 1, 7, 6);
    focusWin('mon'); layout(); damage(60);
    toast('sampling at 1 Hz', '03 MONITOR is focused and lies over 08 NETWORK, so MONITOR draws ' +
      'the boundary and NETWORK draws none. the plate inset inside each sheet is the machine ' +
      'quoting itself inside the user document: cool, flat, no tooth, ruled seam');
  } else if (name === 'settings') {
    clearAll(); S.ws = 1; computeGrid();
    putMod('sys', 6, 0, 6, 5);
    putMod('clock', 6, 5, 6, 3);
    putMod('set', 0, 0, 6, 8);
    S.setTab = 0; redraw('set'); focusWin('set'); layout(); damage(12);
  } else if (name === 'lock') {
    baseDesktop(); showLock(true);
  }
  renderRail(); drawGrid(); renderFoot(); applyCfg(); parityCheck(); markScroll();
}
/* run after layout, because a region cannot know it overflows until the
   sheet it lives in has been given its height. */
function markScroll() {
  $$('.scroll').forEach(sc => sc.classList.toggle('more', sc.scrollHeight - sc.clientHeight > 2));
}
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
window.addEventListener('resize', () => {
  computeGrid(); layout(); drawRaster(); drawGrid(); renderFoot(); markScroll();
  if (ovOn()) showOverview(true);
});

/* ============================================================ start == */
applyCfg();
for (let i = 0; i < 720; i++) S.raster.push({ us: 5200 + Math.round(Math.random() * 7000) });
setScene(location.hash.slice(1) || 'desktop', false);
drawRaster();
setInterval(tick, 1000);
</script>
