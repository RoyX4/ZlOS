<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAPHITE BLEND / zlOS living prototype</title>
<style>
/* ======================================================================
   THE GRAPHITE BLEND - design.h
   ----------------------------------------------------------------------
   DARK-NATIVE. Said plainly because it changes what the two blocks below
   mean. Every other direction in this directory designed a light ladder
   and derived a dark one. This one is designed on graphite and derives
   the light one, so :root is the SECOND ladder and :root[data-theme=dark]
   is the home. The convention is kept anyway (hash without a suffix is
   :root, hash with -dark is the override) because the deep links have to
   match every other prototype here, and because a direction that cannot
   survive its own secondary ladder is not finished.

   The derivation is not an inversion. One raking light, upper left, in
   both modes. What changes is which edge can do the work:

     graphite  ground L* 18.15, huge headroom above it
               -> the STRUCK edge carries depth. LIT on BASE 1.993:1,
                  CUT on BASE 1.332:1.
     work light ground L* 91.43, almost no headroom above it
               -> the CUT edge carries depth. CUT on BASE 1.831:1,
                  LIT on BASE 1.241:1.

   Same token names, same draw order, same call sites. Only the values
   move, which is exactly the shape ui_theme_init_q8() needs. A token
   that exists in one mode only is a defect; there are none.
   ====================================================================== */
:root {
  /* ------------------------------------------------- surfaces (light) */
  --zd-cut:        #B3AB9C;
  --zd-well:       #D6CFC1;
  --zd-void:       #DED8CC;
  --zd-base:       #EBE6DC;
  --zd-raise:      #F2EEE6;
  --zd-float:      #F8F5EF;
  --zd-litsoft:    #FCFAF5;
  --zd-lit:        #FFFFFC;

  /* ZD_EDGE_OVER - NEW TOKEN, and the reason this blend can float its
     windows at all. See the note in the dark block; it is the same
     argument with the sign flipped. 4.83:1 on BASE, 3.88:1 on WELL. */
  --zd-edge-over:  #6A6256;

  /* ZD_FOCUS_WASH - NEW TOKEN. The light falling into the focused
     plate's title band. STEEL over BASE at 18%, resolved to a hex so it
     is a real token and not a blend call. 1.305:1 on BASE. */
  --zd-focus-wash: #C3CDCD;

  /* ----------------------------------------------------- ink (light) */
  --zd-text-0:     #141109;
  --zd-text-1:     #26221A;
  --zd-text-2:     #4A4438;
  --zd-text-3:     #5C554A;
  --zd-text-inert: #9C9488;

  /* THE ACCENT IS THE LIGHT, not a brand colour. Re-picked per mode
     rather than reused: Datum's dark blue measured 2.36:1 as a smudge in
     dark, and the same failure runs the other way - #7FB2E0 on paper is
     1.9:1 and unreadable. Hue held at 205-208, saturation held low. */
  --zd-steel:      #0E5C8A;
  --zd-steel-br:   #08456B;

  --zd-ok:         #17592A;
  --zd-warn:       #7A4E00;
  --zd-bad:        #C0362A;
  --zd-bad-ink:    #A32418;
  --zd-ink-on:     #F8F5EF;

  /* -------------------------------------------------------- metrics */
  --ui: 1;
  --zd-rail-w:   calc(132px * var(--ui));
  --zd-strip-h:  calc(26px  * var(--ui));
  --zd-ruler-h:  calc(22px  * var(--ui));
  --zd-title-h:  calc(28px  * var(--ui));
  --zd-row-h:    calc(24px  * var(--ui));
  --zd-pad:      calc(10px  * var(--ui));
  --zd-gap:      calc(8px   * var(--ui));

  /* RADIUS: one rule. Radius encodes how much the object can move, and
     nesting halves it. Taken from Raking unmodified - it is free under
     fb_rrect and it survives every other pick on this page. */
  --zd-r-bolt:   0px;
  --zd-r-plate:  calc(10px * var(--ui));
  --zd-r-inset:  calc(5px  * var(--ui));
  --zd-r-chip:   calc(3px  * var(--ui));

  /* FOCUS. bezel width is a live setting; 3dp is the shipped value. */
  --zd-bezel:    calc(3px * var(--ui));

  /* TYPE: three sizes, because fb.c bakes three atlases and there is no
     runtime rasteriser. SM 11 / MD 13 / LG 21. Ratios 1.182 and 1.615 -
     the big jump is deliberate so LG cannot be used as a heading. */
  --fs-sm:  calc(11px * var(--ui));
  --fs-md:  calc(13px * var(--ui));
  --fs-lg:  calc(21px * var(--ui));
  --lh-sm:  calc(15px * var(--ui));
  --lh-md:  calc(18px * var(--ui));
  --lh-lg:  calc(24px * var(--ui));

  /* MOTION: three durations keyed to distance travelled, one curve.
     Amended from Raking: the focus signal no longer waits on SETTLE.
     The load-bearing half (the bezel) arrives at RISE, the ambient half
     (the wash) settles over SETTLE. */
  --ms-rise:   90ms;
  --ms-travel: 160ms;
  --ms-settle: 240ms;
  --ease: cubic-bezier(0.200, 0.850, 0.300, 1.000);

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ======================================================================
   design.h - THE HOME LADDER. Warm graphite, hue 22, 18-31% saturation.
   Six rungs inside 17 L* points, every adjacent step below perceptual
   threshold (1.073 / 1.126 / 1.089 / 1.077 : 1). The surfaces do not
   separate themselves and that is the premise: a 1px struck run on the
   top edge and a cut groove underneath do all of it.
   ====================================================================== */
:root[data-theme="dark"] {
  --zd-cut:        #19120E;
  --zd-well:       #231C18;
  --zd-void:       #29221E;
  --zd-base:       #322B27;
  --zd-raise:      #38312D;
  --zd-float:      #3D3632;
  --zd-litsoft:    #4A433F;
  --zd-lit:        #5F5854;

  /* ---------------------------------------------------- ZD_EDGE_OVER
     THE ONE VALUE THIS BLEND HAD TO INVENT, and the arithmetic that
     forced it.

     Free-floating windows put a >=3:1 floor on the window boundary,
     because under overlap the only thing saying which sheet is on top is
     the upper sheet's bottom/right edge lying on the lower sheet's body.
     Raking draws that edge ZD_CUT: 1.332:1. It fails.

     It cannot be fixed by darkening. ZD_BASE has Y = 0.02552, so the
     largest ratio ANY darker colour can reach against it is
     (0.02552 + 0.05) / (0 + 0.05) = 1.510:1, and that is pure black.
     Against ZD_FLOAT the ceiling is 1.772:1. On a dark ground the
     downward direction is arithmetically shut: there is no groove, at
     any value, that clears 3:1.

     So the occluding edge is the LIGHT, not the groove - which is what
     the raking light does anyway. An edge standing proud of another
     object catches the source across its full thickness; an edge lying
     on the field does not. ZD_EDGE_OVER is that struck near edge:
       3.67:1 on BASE, 3.13:1 on FLOAT, 4.14:1 on VOID,
       3.37:1 on RAISE, 4.44:1 on WELL.
     Every surface in the system clears 3:1, so the rule is
     unconditional and needs no per-case table. It is a value, not a
     primitive - fb_fill_px already draws it.

     Who draws it is Apparatus's rule, adopted whole: THE BORDER YOU CAN
     SEE IS DRAWN BY THE OCCLUDER, NEVER THE OCCLUDED. -------------- */
  --zd-edge-over:  #8A8279;

  /* ---------------------------------------------------- ZD_FOCUS_WASH
     STEEL over BASE at alpha 18%, resolved to a hex. 1.400:1 against
     ZD_BASE - above every surface step in the system (loudest 1.126:1)
     and below the struck edge (1.993:1), so it reads as a step without
     outranking the light. -------------------------------------------- */
  --zd-focus-wash: #404348;

  --zd-text-0:     #F2EDE4;
  --zd-text-1:     #DAD3C7;
  --zd-text-2:     #BDB5A7;
  --zd-text-3:     #AAA194;
  --zd-text-inert: #6A635A;

  --zd-steel:      #7FB2E0;
  --zd-steel-br:   #A9CFF2;

  --zd-ok:         #7FBF63;
  --zd-warn:       #E3A63F;
  --zd-bad:        #E8664B;
  --zd-bad-ink:    #E58972;
  --zd-ink-on:     #181310;
}

/* ============================================================ reset == */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--zd-void); color: var(--zd-text-1);
  font-family: var(--sans); font-size: var(--fs-md); line-height: var(--lh-md);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--zd-steel); color: var(--zd-ink-on); }

/* ============================================================= type == */
.t-sm  { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.t-md  { font-size: var(--fs-md); line-height: var(--lh-md); }
.t-lg  { font-size: var(--fs-lg); line-height: var(--lh-lg); font-variant-numeric: tabular-nums; }
/* micro label. UPPERCASE at the call site, which is free, and it is what
   substitutes for the letter-spacing fb_text_role cannot do without a
   new primitive. There is no tracking anywhere in this document. */
.t-lab { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
         color: var(--zd-text-3); white-space: nowrap; }
/* mono is one size forever. Every figure the machine measured is set in
   it; everything a person wrote is proportional. That is the cheap half
   of Datum's face law, and it needs no atlas the build does not bake. */
.t-num { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
         font-variant-numeric: tabular-nums; }
.ink0 { color: var(--zd-text-0); } .ink1 { color: var(--zd-text-1); }
.ink2 { color: var(--zd-text-2); } .ink3 { color: var(--zd-text-3); }
.steel { color: var(--zd-steel); } .steelbr { color: var(--zd-steel-br); }
.k-ok { color: var(--zd-ok); } .k-warn { color: var(--zd-warn); } .k-bad { color: var(--zd-bad-ink); }
.bold { font-weight: 700; }
.spread { margin-left: auto; }

/* ==================================================== the strip bar == */
#strip {
  position: fixed; left: 0; right: 0; top: 0; height: calc(30px * var(--ui));
  background: var(--zd-cut); color: var(--zd-text-3); z-index: 400;
  display: flex; align-items: center; gap: calc(14px * var(--ui));
  padding: 0 calc(12px * var(--ui)); font-size: var(--fs-sm);
  border-bottom: 1px solid var(--zd-edge-over);
}
#strip .nm { color: var(--zd-text-1); font-weight: 700; text-transform: uppercase; }
#strip .pitch { color: var(--zd-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#strip .links { display: flex; gap: calc(9px * var(--ui)); margin-left: auto; }
#strip .links a { color: var(--zd-text-3); text-decoration: none; }
#strip .links a.on { color: var(--zd-steel); }
#strip .links a:hover { color: var(--zd-text-0); }
#strip .thm { display: flex; gap: calc(2px * var(--ui)); align-items: center; }
#strip .tk { padding: calc(2px * var(--ui)) calc(7px * var(--ui)); cursor: pointer;
             border-radius: var(--zd-r-chip); color: var(--zd-text-3); }
#strip .tk.on { background: var(--zd-steel); color: var(--zd-ink-on); }
#strip .hint { color: var(--zd-text-3); }

/* =============================================================== os == */
#os { position: fixed; left: 0; right: 0; top: calc(30px * var(--ui)); bottom: 0;
      display: flex; overflow: hidden; background: var(--zd-void); }

/* ============================================================= rail ==
   PLATE's numbered register, on Raking's single rail. 132dp, not 56dp:
   "01 SHELL" does not fit in 56dp, and the register is the whole point
   of taking it. The consequence is checked and paid: Raking's stacked
   HH-over-MM clock exists ONLY because a 56dp rail cannot hold 23:41 on
   one line. At 132dp it can, so the stacking is dropped. A free rider
   that is free with respect to colour can still be paid for in geometry.
   The rail is ZD_R_BOLT - it meets three screen edges, and a radius
   against a screen edge is a lie about a shape that cannot be seen. */
#rail {
  width: var(--zd-rail-w); flex: 0 0 var(--zd-rail-w); background: var(--zd-raise);
  display: flex; flex-direction: column; position: relative; z-index: 60;
  border-right: 1px solid var(--zd-lit);
}
#rail .ident { padding: calc(12px * var(--ui)) var(--zd-pad) calc(8px * var(--ui)); }
#rail .ident .w { font-size: var(--fs-lg); line-height: var(--lh-lg); color: var(--zd-text-0); font-weight: 700; }
#rail .div { height: 1px; background: var(--zd-cut); margin: calc(4px * var(--ui)) var(--zd-pad); }
#rail .sect { padding: calc(8px * var(--ui)) var(--zd-pad) calc(3px * var(--ui)); display: block; }
#reg { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
.slot { display: flex; align-items: center; gap: calc(7px * var(--ui));
        height: calc(26px * var(--ui)); padding: 0 0 0 var(--zd-pad); cursor: pointer;
        position: relative; color: var(--zd-text-3); }
.slot .n { font-family: var(--mono); font-size: var(--fs-sm); font-variant-numeric: tabular-nums;
           color: var(--zd-text-inert); }
.slot .nm { font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot:hover { background: var(--zd-float); border-radius: var(--zd-r-chip) 0 0 var(--zd-r-chip); }
.slot.run .n  { color: var(--zd-text-2); }
.slot.run .nm { color: var(--zd-text-1); }
.slot.act .n  { color: var(--zd-steel); }
.slot.act .nm { color: var(--zd-text-0); font-weight: 700; }
/* THE RUNNING INDICATOR REPLACES THE TILE. No tile, no rounded face, no
   box. A running app gets a 2dp bar on the rail's lit edge pointing into
   the field at the window it owns; the app owning the FOCUSED window
   gets the full slot height at STEEL_BR. This is the third locus of the
   focus signal and it is the only one that is legible from the rail. */
.slot .bar { position: absolute; right: 0; width: calc(2px * var(--ui));
             height: calc(14px * var(--ui)); background: var(--zd-steel);
             top: 50%; transform: translateY(-50%);
             transition: height var(--ms-rise) var(--ease), background var(--ms-settle) var(--ease),
                         width var(--ms-rise) var(--ease); }
.slot.act .bar { height: calc(26px * var(--ui)); width: calc(3px * var(--ui)); background: var(--zd-steel-br); }
#rail .wsrow { display: flex; gap: calc(4px * var(--ui)); padding: calc(2px * var(--ui)) var(--zd-pad); }
.wsb { flex: 1; height: calc(22px * var(--ui)); background: var(--zd-base);
       border: 1px solid var(--zd-cut); border-top-color: var(--zd-lit);
       border-radius: var(--zd-r-inset); display: flex; align-items: center;
       justify-content: center; cursor: pointer; }
.wsb.on { background: var(--zd-steel); border-color: var(--zd-steel); color: var(--zd-ink-on); }
.wsb.on .t-num { color: var(--zd-ink-on); }
#rail .stat { padding: calc(4px * var(--ui)) var(--zd-pad); }
.strow { display: flex; align-items: center; gap: calc(6px * var(--ui)); height: calc(20px * var(--ui)); }
.strow svg { flex: 0 0 auto; }
.strow .w { margin-left: auto; font-family: var(--mono); font-size: var(--fs-sm); }
#rail .clock { padding: calc(6px * var(--ui)) var(--zd-pad) calc(12px * var(--ui)); }
#rail .clock .hm { font-size: var(--fs-lg); line-height: var(--lh-lg); color: var(--zd-text-0);
                   font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============================================================ field == */
#fieldwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

/* THE RASTER STRIP - Datum's, with its clock re-derived.
   Datum deletes every infinite loop for an explicit reason ("the damage
   list is never empty on a compositor whose entire architecture is
   damage-driven repaint") and then makes exactly one exception with
   exactly that property: 215,993 composite wakeups per hour on an idle
   machine at 59.998 Hz. The exception is not needed. The strip advances
   one column PER COMPOSITE, not per frame. On an idle machine it is
   still, and a still strip is information: it says nothing damaged. */
#raster { height: var(--zd-strip-h); flex: 0 0 var(--zd-strip-h); background: var(--zd-well);
          border-bottom: 1px solid var(--zd-cut); display: flex; align-items: stretch;
          position: relative; overflow: hidden; }
#raster .lbl { position: absolute; left: calc(8px * var(--ui)); top: 50%;
               transform: translateY(-50%); z-index: 2; pointer-events: none; }
#raster .rd { position: absolute; right: calc(8px * var(--ui)); top: 50%;
              transform: translateY(-50%); z-index: 2; pointer-events: none;
              display: flex; gap: calc(12px * var(--ui)); align-items: baseline; }
#rcanvas { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }

#field { flex: 1; position: relative; overflow: hidden; background: var(--zd-void); }
/* THE WALLPAPER IS ONE CALL. fb_glow(-w/8, -h/6, w*11/8, h*11/8, LITSOFT,
   26, 0, 100): a single raking light entering from off screen upper left
   and falling to ZD_VOID at the lower right. Nine layers become one, and
   the light is the identity rather than a texture. */
#field::before { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 130% at -8% -12%,
              color-mix(in srgb, var(--zd-litsoft) 62%, transparent) 0%,
              color-mix(in srgb, var(--zd-litsoft) 22%, transparent) 34%,
              transparent 72%); }

/* THE MEMORY MAP RULER - Datum, unchanged in intent. It is mono text and
   fills in a band that exists regardless: no surface value, no boundary
   token, no radius, no focus signal and no colour of its own. */
#ruler { height: var(--zd-ruler-h); flex: 0 0 var(--zd-ruler-h); background: var(--zd-raise);
         border-top: 1px solid var(--zd-lit); display: flex; align-items: center;
         gap: calc(10px * var(--ui)); padding: 0 calc(10px * var(--ui)); }
#rulerbar { flex: 1; height: calc(10px * var(--ui)); display: flex; background: var(--zd-well);
            border-radius: var(--zd-r-chip); overflow: hidden; border: 1px solid var(--zd-cut); }
#rulerbar span { display: block; height: 100%; }

/* =========================================================== window ==
   THE SEAT RECIPE. Four calls, taken from Raking unmodified:
     1  fb_rrect(x, y, w, h, r, ZD_CUT)                 the groove ring
     2  fb_rrect(x+1, y+1, w-2, h-2, r-1, <surface>)    the object
     3  fb_fill_px(x+r, y, w-2r, 1, ZD_LIT)             the struck top
     4  fb_fill_px(x, y+r, 1, h-2r, ZD_LITSOFT)         the grazed left
   Bottom and right stay ZD_CUT. Steps 3 and 4 run only between the
   corner arcs. The recipe is LOAD-BEARING and lives in exactly one
   function - if an edge is clipped away the plate does not look slightly
   wrong, it vanishes into the field.

   AMENDED, and this is the blend's one structural change: when a plate
   lies OVER another plate, its edges are drawn ZD_EDGE_OVER instead. The
   occluder draws them, never the occluded. See the token note above for
   why this is the only direction the arithmetic allows on a dark ground.
   ---------------------------------------------------------------- */
#wins { position: absolute; inset: 0; }
.win {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  background: var(--zd-base); border-radius: var(--zd-r-plate);
  border: 1px solid var(--zd-cut);
  transition: border-color var(--ms-rise) var(--ease);
}
/* The struck runs live on an overlay, not on the plate's own box shadow,
   because the focus wash paints over the title band and an inset shadow
   sits UNDER content. The edge must be the last thing drawn or the wash
   dilutes it - measured: the 3dp bezel came out 1 device px at 55% of
   ZD_STEEL before this was split out. */
.win::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; z-index: 5;
  box-shadow: inset 0 1px 0 0 var(--zd-lit), inset 1px 0 0 0 var(--zd-litsoft);
  transition: box-shadow var(--ms-rise) var(--ease); }
/* rank 2: this plate lies over another plate. */
.win.over { border-color: var(--zd-edge-over); }
/* rank 3 and the focused plate: the bezel. */
.win.focus::after {
  box-shadow: inset 0 var(--zd-bezel) 0 0 var(--zd-steel),
              inset var(--zd-bezel) 0 0 0 var(--zd-steel);
}
.win.drag { border-color: var(--zd-edge-over);
  box-shadow: 0 calc(6px * var(--ui)) calc(14px * var(--ui)) rgba(0,0,0,.55); }
.win.drag::after {
  box-shadow: inset 0 var(--zd-bezel) 0 0 var(--zd-steel-br),
              inset var(--zd-bezel) 0 0 0 var(--zd-steel-br),
              inset calc(-1px * var(--ui)) 0 0 0 var(--zd-edge-over),
              inset 0 calc(-1px * var(--ui)) 0 0 var(--zd-edge-over); }
.win.mini { display: none; }
.win.max { border-radius: var(--zd-r-bolt); }

.tbar { height: var(--zd-title-h); flex: 0 0 var(--zd-title-h); display: flex;
        align-items: center; gap: calc(8px * var(--ui)); padding: 0 calc(8px * var(--ui)) 0 calc(12px * var(--ui));
        cursor: default; position: relative; user-select: none; }
/* THE WASH. A horizontal ramp from ZD_FOCUS_WASH at the plate's lit
   corner to nothing at the right edge: the raking light entering the
   window. It is not a knockout and must never become one - the whole
   reason it works here is that it stays inside the achromatic budget. */
.tbar::before { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, var(--zd-focus-wash) 0%,
              color-mix(in srgb, var(--zd-focus-wash) 45%, transparent) 38%, transparent 78%);
  opacity: 0; transition: opacity var(--ms-settle) var(--ease); }
.win.focus .tbar::before { opacity: 1; }
#lock .sheet .tbar::before { opacity: 1; }
body.nowash .tbar::before { display: none; }
.tbar > * { position: relative; z-index: 1; }
.tbar .ttl { font-size: var(--fs-md); font-weight: 700; color: var(--zd-text-2);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             transition: color var(--ms-rise) var(--ease); }
.win.focus .tbar .ttl { color: var(--zd-text-0); }
.tbar .sub { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-3);
             white-space: nowrap; }
.tbar .reg { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-inert); }
.win.focus .tbar .reg { color: var(--zd-steel); }
/* NO FACE AT REST. Three bare glyphs; the current three filled circles
   are three unnecessary rectangles on every window. */
.tbar .ctl { display: flex; gap: calc(4px * var(--ui)); margin-left: auto; }
.cbtn { width: calc(20px * var(--ui)); height: calc(20px * var(--ui)); display: flex;
        align-items: center; justify-content: center; cursor: pointer;
        border-radius: var(--zd-r-chip); color: var(--zd-text-3); }
.cbtn:hover { background: var(--zd-raise); color: var(--zd-text-0); }
.cbtn.x:hover { background: var(--zd-bad); color: var(--zd-ink-on); }
.cbtn:active { background: var(--zd-cut); }

.wbody { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding: 0 calc(10px * var(--ui)) calc(8px * var(--ui)); gap: calc(6px * var(--ui)); overflow: hidden; }

<script>
'use strict';
/* ======================================================================
 * THE GRAPHITE BLEND - a living prototype of the zlOS desktop.
 *
 *   ground      Raking's warm graphite, dark native
 *   depth       Raking's 1px struck edge and cut groove, three ranks
 *   boundary    Raking's directional runs, amended by Apparatus's cut
 *               edge on a new token ZD_EDGE_OVER
 *   focus       NEW. bezel + wash + register mark. 7.13% of a plate.
 *   rail        PLATE's numbered register
 *   instrument  Datum's, with the raster strip's clock re-derived
 *
 * Every colour is a custom property. There is no hex literal below.
 * ====================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const cs = getComputedStyle(document.documentElement);

/* --------------------------------------------------- contrast, computed
 * Not estimated. The numbers printed in the settings pane and in the
 * system window come out of these two functions at run time, against the
 * tokens as the browser resolved them, so a token edit moves the number.
 */
function tokHex(n) {
  let v = cs.getPropertyValue(n).trim();
  for (let i = 0; i < 4 && /^var\(/.test(v); i++)
    v = cs.getPropertyValue(v.slice(4, -1).trim()).trim();
  return v.toUpperCase();
}
function rgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function relY(h) { const c = rgb(h); return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
function ratio(a, b) {
  const x = relY(tokHex(a)), y = relY(tokHex(b));
  return ((Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05));
}
function r2(a, b) { return ratio(a, b).toFixed(2); }
function r3(a, b) { return ratio(a, b).toFixed(3); }
function lstar(n) {
  const y = relY(tokHex(n));
  return (y > 216 / 24389 ? 116 * Math.pow(y, 1 / 3) - 16 : y * 24389 / 27).toFixed(2);
}
/* The ceiling on a DARKER boundary: the ratio pure black would reach
 * against this surface. On graphite it is the number that shuts the
 * downward direction; on the work-light ladder it is large and the
 * argument runs the other way. Computed, never quoted. */
/* Is the first token the lighter term against the second? The knockout
 * argument depends on this and it flips with the ladder, so it is asked
 * rather than asserted. */
function isLighter(a, b) { return relY(tokHex(a)) > relY(tokHex(b)); }
function darkCeil(n) { return ((relY(tokHex(n)) + 0.05) / 0.05).toFixed(3); }
function liteCeil(n) { return ((1.05) / (relY(tokHex(n)) + 0.05)).toFixed(3); }

/* ============================================================ icons ==
 * MACHINED FROM THE SAME PLATE. 45/90 armature only: every straight
 * segment is horizontal, vertical or exactly 45 degrees. Two stroke

 * where the object is physically round.
 */

  log:   '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 9 H12 M6 12 H15 M6 15 H10" class="w1"/><rect x="16" y="8" width="2.6" height="2.6" class="sol"/>',
  hex:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9 H21 M9 4 V20 M15 4 V20" class="w1"/><rect x="9.6" y="9.6" width="4.8" height="4.8" class="sol"/>',
  calc:  '<rect x="4" y="3" width="16" height="18" rx="2"/><rect x="7" y="6" width="10" height="3.4" class="sol"/><path d="M8 13 H10 M14 13 H16 M8 17 H10 M14 17 H16" class="w1"/>',

  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7 L12 12 L15.5 14" class="w1"/><rect x="11.2" y="2.6" width="1.6" height="2.2" class="sol"/>',
  chip:  '<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 3 V6 M12 3 V6 M15 3 V6 M9 18 V21 M12 18 V21 M15 18 V21 M3 9 H6 M3 12 H6 M3 15 H6 M18 9 H21 M18 12 H21 M18 15 H21" class="w1"/><rect x="9.2" y="9.2" width="5.6" height="5.6" class="sol"/>',

  disk:  '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.4" class="sol"/><path d="M12 3.5 L12 6 M16.5 16.5 L18.4 18.4" class="w1"/>',

  type:  '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 16 L10.5 8 L14 16 M8.4 13.4 H12.6" class="w1"/><rect x="16" y="8" width="2.4" height="8" class="sol"/>',
  power: '<path d="M6.5 6.5 A8 8 0 1 0 17.5 6.5"/><rect x="11.2" y="2.5" width="1.6" height="8" class="sol"/>',
  vol:   '<path d="M4 9.5 L8 9.5 L12.5 5.5 L12.5 18.5 L8 14.5 L4 14.5 Z" class="sol"/><path d="M16 9 A5 5 0 0 1 16 15" class="w1"/><path d="M18.5 6.5 A9 9 0 0 1 18.5 17.5" class="w1"/>',

  grid:  '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9 H21 M3 15 H21 M9 3 V21 M15 3 V21" class="w1"/><rect x="3.8" y="3.8" width="4.4" height="4.4" class="sol"/>'

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function hx(v, n) { let s = (v >>> 0).toString(16).toUpperCase(); while (s.length < n) s = '0' + s; return s; }
function TBL(cols, rows) {
  return '<table><thead><tr>' + cols.map(c =>
    '<th' + (c.r ? ' class="r"' : '') + (c.w ? ' style="width:' + c.w + '"' : '') + '>' + c.h + '</th>').join('') +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => {
    if (typeof c === 'object') return '<td class="' + (c.c || '') + '">' + c.t + '</td>';
    return '<td>' + esc(c) + '</td>';
  }).join('') + '</tr>';
}
function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function meter(lb, val, unit, kind) {
  return '<div class="meter"><span class="lb">' + lb + '</span><div class="mtrack">' +
    '<div class="mfill ' + (kind || '') + '" style="width:' + Math.max(0, Math.min(100, val)) + '%"></div>' +
    '</div><span class="vv">' + val.toFixed(1) + unit + '</span></div>';
}
/* THE STATE WORD BESIDE THE STATE COLOUR. */
function sw(w) {
  const m = { OK: 'ok', PASS: 'ok', UP: 'ok', RUN: 'ok', LISTEN: 'ok', ESTABLISHED: 'ok',
              WARN: 'warn', BOUND: 'warn', DRIFT: 'warn', RO: 'warn',
              FAIL: 'bad', DOWN: 'bad', Z: 'bad' };
  const k = m[w] || 'ok';
  const c = k === 'ok' ? 'var(--zd-ok)' : k === 'warn' ? 'var(--zd-warn)' : 'var(--zd-bad)';
  const ink = k === 'ok' ? 'k-ok' : k === 'warn' ? 'k-warn' : 'k-bad';
  return '<span class="sw"><span class="dot" style="background:' + c + '"></span>' +
    '<span class="t-num ' + ink + '">' + w + '</span></span>';
}
function spark(series, w, h, max, col) {
  const n = series.length, sw2 = w / n;
  let d = '';
  series.forEach((v, i) => {
    const bh = Math.max(1, Math.round((v / max) * (h - 1)));
    d += '<rect x="' + (i * sw2).toFixed(2) + '" y="' + (h - bh) + '" width="' +
      Math.max(1, sw2 - 0.6).toFixed(2) + '" height="' + bh + '" fill="' + col + '"/>';
  });
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" ' +
    'shape-rendering="crispEdges" aria-hidden="true">' + d + '</svg>';
}
function usBand(id) {
  const w = S.wins[id]; if (!w) return '';
  const mode = S.cfg.us;
  if (mode === 'off') return '';
  const val = mode === 'measured'
    ? '<span class="t-num ink0">' + w.us + ' us</span>'
    : '<span class="t-num ink0">' + w.px.toLocaleString('en-US') + ' px</span>';
  return '<span class="us row" style="gap:calc(6px * var(--ui))">' +
    '<span class="t-lab">' + (mode === 'measured' ? 'app us' : 'repaint px') + '</span>' + val + '</span>';
}
function band(id, left) {
  return '<div class="sband"><span class="t-lab">' + APP[id].n + '</span>' +
    '<span class="t-num ink3">' + left + '</span>' + usBand(id) +
    '<span class="spread t-num ink3">ws ' + (S.wins[id] ? ('0' + S.wins[id].ws) : '01') + '</span></div>';
}

R.hex = () => {
  const base = 0x1000 * S.hexPage;
  let rows = '';
  for (let r = 0; r < 20; r++) {
    const off = base + r * 16;
    let hexs = '', asc = '';
    for (let i = 0; i < 16; i++) {
      const b = (off * 31 + i * 17 + (i & 3) * 41) & 0xFF;
      hexs += hx(b, 2) + (i === 7 ? '  ' : ' ');
      asc += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
    }
    rows += TR([{ t: '<span class="ink3">' + hx(off, 8) + '</span>' },
      { t: '<span class="ink1">' + hexs.trim() + '</span>' },
      { t: '<span class="ink2">' + esc(asc) + '</span>' }]);
  }
  return '<div class="row" style="height:calc(22px * var(--ui))"><span class="t-lab">device</span>' +
    '<span class="t-num ink1">rd0</span><span class="t-lab">offset</span>' +
    '<span class="t-num ink0">0x' + hx(base, 8) + '</span>' +
    '<span class="spread t-num ink3">zlfs superblock &middot; generation 3</span></div>' +
    '<div class="scroll">' + TBL([{ h: 'offset', w: '16%' }, { h: 'bytes', w: '62%' },
      { h: 'ascii', w: '22%' }], rows.split('</tr>').filter(Boolean).map(x => x + '</tr>')) + '</div>' +
    '<div class="row"><span class="btn" data-act="hexp" data-arg="-1"><span class="t-lab">prev</span></span>' +

    '<span class="cbtn" data-wa="max" title="maximise"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="8" height="8"/></svg></span>' +
    '<span class="cbtn x" data-wa="close" title="close"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5"/></svg></span>' +
    '</span></div><div class="wbody"></div>' +

    '<path d="M13 5 L5 13 M13 9 L9 13 M13 1 L1 13"/></svg>';
  $('#wins').appendChild(e);
  redraw(id);
}
function redraw(id) {
  const e = $('.win[data-id="' + id + '"]'); if (!e) return;
  const f = R[id] || (() => '<div class="well"><span class="pre ink2">no renderer</span></div>');
  $('.wbody', e).innerHTML = f();
}
function redrawAll() { Object.keys(S.wins).forEach(redraw); }
/* rank 2 detection: does this plate lie over a plate below it in z? */
function overlaps(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
}
function layout() {
  const field = $('#field'), fw = field.clientWidth, fh = field.clientHeight;
  const list = Object.keys(S.wins).map(k => S.wins[k])
    .filter(w => w.ws === S.ws).sort((a, b) => a.z - b.z);
  Object.keys(S.wins).forEach(id => {
    const w = S.wins[id], e = $('.win[data-id="' + id + '"]');
    if (!e) return;
    if (w.ws !== S.ws || w.min) { e.style.display = 'none'; return; }
    e.style.display = '';
    let x = w.x, y = w.y, ww = w.w, hh = w.h;
    if (w.max) { x = 0; y = 0; ww = fw; hh = fh; }
    /* the rail clamp. it is here and not in the app because wm.c is the
       only place that knows the rail exists. */
    x = Math.max(0, Math.min(x, Math.max(0, fw - 120)));
    y = Math.max(0, Math.min(y, Math.max(0, fh - 60)));
    ww = Math.min(ww, fw); hh = Math.min(hh, fh);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.width = ww + 'px'; e.style.height = hh + 'px';
    e.style.zIndex = w.z;
    e.classList.toggle('focus', S.focus === id);
    e.classList.toggle('max', !!w.max);
    const me = { x: x, y: y, w: ww, h: hh };
    let over = false;
    if (S.cfg.over) {
      for (let i = 0; i < list.length; i++) {
        const o = list[i]; if (o.id === id || o.z >= w.z) continue;
        const oe = $('.win[data-id="' + o.id + '"]'); if (!oe || oe.style.display === 'none') continue;
        if (overlaps(me, { x: oe.offsetLeft, y: oe.offsetTop, w: oe.offsetWidth, h: oe.offsetHeight })) { over = true; break; }
      }
    }
    e.classList.toggle('over', over);
  });
}

/* ====================================================== raster strip ==
 * Datum's, re-clocked. One column per composite, never per vblank.
 */
function damage(n) {
  const k = n || 1;
  for (let i = 0; i < k; i++) {
    S.composites++;
    S.raster.push({ us: 5200 + Math.round(Math.random() * 7000), k: Math.random() });
  }
  if (S.raster.length > 900) S.raster.splice(0, S.raster.length - 900);
  drawRaster();
}
function drawRaster() {
  const c = $('#rcanvas'), p = c.parentElement;
  const w = p.clientWidth, h = p.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const budget = 16667;
  const steel = tokHex('--zd-steel'), warn = tokHex('--zd-warn'), inert = tokHex('--zd-text-inert');
  const x0 = 78, x1 = w - 450, span = Math.max(10, x1 - x0);
  const n = Math.min(S.raster.length, Math.floor(span / 2));
  const start = S.raster.length - n;
  for (let i = 0; i < n; i++) {
    const s = S.raster[start + i];
    const bh = Math.max(1, Math.round((s.us / budget) * (h - 8)));
    g.fillStyle = s.us > budget * 0.85 ? warn : steel;
    g.fillRect(x0 + i * 2, h - 4 - bh, 1, bh);
  }
  g.fillStyle = inert;
  g.fillRect(x0, h - 4, span, 1);
  const rd = $('#rasterrd');
  const idleH = S.cfg.rasterClock === 'frame' ? '215,993' : '0';
  rd.innerHTML = '<span class="t-lab">advance</span>' +
    '<span class="t-num ink0">' + S.cfg.rasterClock + '</span>' +
    '<span class="t-lab">idle wakeups/h</span>' +
    '<span class="t-num ' + (S.cfg.rasterClock === 'frame' ? 'k-warn' : 'ink0') + '">' + idleH + '</span>' +
    '<span class="t-lab">budget</span><span class="t-num ink3">16 667 us</span>';
}

function toast(t, b) {

/* ============================================================= tick == */
function walk(v, lo, hi, amp) {
  v += (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, v));
}
function clockStr() {
  const d = new Date(2026, 7, 25, 14, 32, 7 + S.t);
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function tick() {
  S.t++;
  S.cpu = S.cpu.map(v => walk(v, 2, 96, 14));
  S.mem = walk(S.mem, 30, 72, 3);
  $('#clockhm').textContent = clockStr();
  $('#clockd').textContent = '25 aug 2026';
  /* THE STRIP ADVANCES ON DAMAGE. A 1 Hz sampler redraw is one damage
     flush, so it gets one column. Under the frame clock it would get
     sixty, which is the whole argument. */
  if (S.cfg.rasterClock === 'frame') damage(6);
  else if (S.wins.mon || S.wins.net || S.wins.clock) damage(1);
  else drawRaster();
  ['mon', 'net', 'clock', 'sys'].forEach(id => { if (S.wins[id]) redraw(id); });
  if (S.wins.set && S.setTab === 2) redraw('set');
  if ($('#lock').classList.contains('on')) renderLock();
}

/* ========================================================== config === */
function applyCfg() {
  const d = document.documentElement;
  d.style.setProperty('--zd-bezel', 'calc(' + S.cfg.bezel + 'px * var(--ui))');
  d.style.setProperty('--ui', (S.cfg.ui / 100).toFixed(2));
  document.body.classList.toggle('nowash', !S.cfg.wash);
  document.body.classList.toggle('nous', S.cfg.us === 'off');
  document.body.classList.toggle('nomo', !S.cfg.motion);
  document.body.classList.toggle('blink', S.cfg.motion);
  $('#ruler').style.display = S.cfg.ruler ? '' : 'none';
  layout(); drawRaster(); renderRuler();
}
function setWs(n) {
  S.ws = n;
  const cur = Object.keys(S.wins).filter(k => S.wins[k].ws === n && !S.wins[k].min);
  S.focus = cur.length ? cur.sort((a, b) => S.wins[b].z - S.wins[a].z)[0] : null;
  layout(); renderRail(); damage();
  toast('workspace 0' + n, cur.length + ' plates. the register keeps its numbering across ' +
    'workspaces, so alt+NN means the same app on both');
}
function tileAll() {
  const list = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min);
  const fw = $('#field').clientWidth, fh = $('#field').clientHeight;
  const cols = Math.ceil(Math.sqrt(list.length)) || 1;
  const rows = Math.ceil(list.length / cols) || 1;
  list.forEach((id, i) => {
    const w = S.wins[id];
    w.max = false;
    w.w = Math.floor((fw - (cols + 1) * 10) / cols);
    w.h = Math.floor((fh - (rows + 1) * 10) / rows);
    w.x = 10 + (i % cols) * (w.w + 10);
    w.y = 10 + Math.floor(i / cols) * (w.h + 10);
  });
  layout(); damage();
  toast('tiled', list.length + ' plates, no overlap. every occlusion edge falls back to ' +
    'ZD_CUT because nothing is over anything - which is exactly when the rule is inert');
}
function calcKey(k) {
  if (S.calcVal === undefined) S.calcVal = 241690;
  if (k === '=') { S.calcVal = S.calcVal; return; }
  if ('0123456789'.indexOf(k) >= 0) { S.calcVal = (S.calcVal * 10 + parseInt(k, 10)) % 1000000000; return; }
  if (k === '+') S.calcVal += 1000;
  else if (k === '-') S.calcVal = Math.max(0, S.calcVal - 1000);
  else if (k === '*') S.calcVal = Math.min(999999999, S.calcVal * 2);
  else if (k === '/') S.calcVal = Math.floor(S.calcVal / 2);
}

/* =========================================================== events == */
function winOf(el) { const w = el.closest('.win'); return w ? w.getAttribute('data-id') : null; }
function act(t, arg, ev) {
  switch (t) {
    case 'open': openWin(arg); break;
    case 'file': S.fileSel = +arg; redraw('files'); if (S.wins.edit) redraw('edit'); damage(); break;
    case 'proc': S.procSel = +arg; redraw('mon'); damage(); break;
    case 'log':  S.logSel = +arg; redraw('log'); damage(); break;
    case 'hexp': S.hexPage = Math.max(0, S.hexPage + (+arg)); redraw('hex'); damage(); break;
    case 'calc': calcKey(arg); redraw('calc'); damage(); break;
    case 'settab': S.setTab = +arg; redraw('set'); damage(); break;
    case 'tog': S.cfg[arg] = !S.cfg[arg]; applyCfg(); redraw('set'); damage();
      if (arg === 'over') toast(S.cfg.over ? 'occlusion edge on' : 'occlusion edge off',
        S.cfg.over ? 'a plate over a plate draws ZD_EDGE_OVER, ' + r2('--zd-edge-over', '--zd-base') +
          ':1 on the body underneath'
        : 'fallback is ZD_CUT at ' + r2('--zd-cut', '--zd-base') +
          ':1. drag two plates over each other and read the stack order');
      break;
    case 'seg': { const p = arg.split(':'); S.cfg[p[0]] = p[1]; applyCfg(); redrawAll(); damage(); break; }
    case 'ws': setWs(+arg); break;
    case 'ovpick': showOverview(false); focusWin(arg); break;
    case 'prun': S.psel = +arg; runPalette(); break;
    case 'unlock': showLock(false); toast('unlocked', 'session resumed on tty1, seat0'); break;
    case 'detoast': { const e = ev.target.closest('.toast'); if (e) e.remove(); break; }
    case 'tile': tileAll(); break;
    case 'palette': showPalette(true); break;
    case 'overview': showOverview(!ovOn()); break;
    case 'lock': showLock(true); break;
    case 'closew': closeWin(arg); break;
    case 'minw': minWin(arg); break;
    case 'maxw': maxWin(arg); break;
    case 'toast': toast(arg === 'build' ? 'rebuilt' : arg === 'stat' ? 'stat' : 'block re-read',
      arg === 'build' ? 'zlos.elf 249.8 KiB, text 218432 data 30720 bss 1441792, 1.42 s'
      : arg === 'stat' ? FILES[S.fileSel][0] + ', generation 3, 1 extent, contiguous, crc verified'
      : 'pipe A read back, PSR idle, 241690 kHz unchanged'); break;
  }
}
document.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (!t.closest('.menu')) hideMenus();

  const sl = t.closest('[data-slider]');
  if (sl) { ev.preventDefault(); startSlider(ev, sl); return; }

  const wa = t.closest('[data-wa]');
  if (wa) {
    ev.preventDefault(); ev.stopPropagation();
    const id = winOf(wa), a = wa.getAttribute('data-wa');
    if (a === 'close') closeWin(id); else if (a === 'min') minWin(id); else maxWin(id);
    return;
  }
  const a = t.closest('[data-act]');
  if (a) {
    ev.preventDefault();
    const id = winOf(a); if (id) focusWin(id);
    act(a.getAttribute('data-act'), a.getAttribute('data-arg'), ev);
    return;
  }
  const drag = t.closest('[data-drag]');
  if (drag) { const id = winOf(drag); focusWin(id); startDrag(ev, id); return; }
  const grip = t.closest('.grip');
  if (grip) { const id = winOf(grip); focusWin(id); startResize(ev, id); return; }
  const w = t.closest('.win');
  if (w) { focusWin(w.getAttribute('data-id')); return; }
  if (t.closest('#palette .scrim')) showPalette(false);
});
document.addEventListener('dblclick', ev => {
  const d = ev.target.closest('[data-drag]');
  if (d) maxWin(winOf(d));
});
document.addEventListener('contextmenu', ev => {

  if (d) {
    ev.preventDefault();
    const id = winOf(d);
    showMenu($('#winmenu'), ev.clientX, ev.clientY, [
      ['bring to front', 'open', id, false, 'click'],
      ['minimise', 'minw', id, false, 'travel 160'],
      ['maximise', 'maxw', id, false, 'double click'],
      '-',
      ['tile all', 'tile', '', false, ''],
      ['this plate is ' + ($('.win[data-id="' + id + '"]').classList.contains('over') ?
        'over another' : 'on the field'), 'noop', '', true,
        $('.win[data-id="' + id + '"]').classList.contains('over') ?
        r2('--zd-edge-over', '--zd-base') : r2('--zd-cut', '--zd-void')],
      '-',
      ['close', 'closew', id, false, '']
    ], APP[id].n + ' ' + APP[id].name);
    return;
  }
  if (ev.target.closest('#field')) {
    ev.preventDefault();
    showMenu($('#ctxmenu'), ev.clientX, ev.clientY, [
      ['activities', 'overview', '', false, 'f1'],
      ['command palette', 'palette', '', false, 'ctrl k'],
      '-',
      ['tile all plates', 'tile', '', false, ''],
      ['workspace 01', 'ws', '1', false, 'alt 1'],
      ['workspace 02', 'ws', '2', false, 'alt 2'],
      '-',
      ['open 11 settings', 'open', 'set', false, 'alt 11'],
      ['lock session', 'lock', '', false, 'ctrl l']
    ], 'field');
  }
});
function startDrag(ev, id) {
  const w = S.wins[id]; if (!w || w.max) return;
  const e = $('.win[data-id="' + id + '"]');
  const ox = ev.clientX - e.offsetLeft, oy = ev.clientY - e.offsetTop;
  e.classList.add('drag');
  function mv(m) {
    w.x = m.clientX - ox; w.y = m.clientY - oy;
    layout();
  }
  function up() {
    e.classList.remove('drag');
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(4);
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startResize(ev, id) {
  const w = S.wins[id]; if (!w) return;
  w.max = false;
  const sx = ev.clientX, sy = ev.clientY, sw2 = w.w, sh = w.h;
  function mv(m) {
    w.w = Math.max(260, sw2 + m.clientX - sx);
    w.h = Math.max(150, sh + m.clientY - sy);
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(2);
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startSlider(ev, el) {
  const key = el.getAttribute('data-slider');
  const lo = +el.getAttribute('data-lo'), hi = +el.getAttribute('data-hi');
  function set(e) {
    const r = el.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    S.cfg[key] = Math.round(lo + p * (hi - lo));
    applyCfg(); redraw('set');
  }
  set(ev);
  function up() { document.removeEventListener('mousemove', set); document.removeEventListener('mouseup', up); damage(); }
  document.addEventListener('mousemove', set);
  document.addEventListener('mouseup', up);
}
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if (ev.shiftKey && (k === 'D' || k === 'd')) { setTheme(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return; }
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); return; }
    if (k === 'Enter') { runPalette(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(pmatch().length - 1, S.psel + 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); return; }
    if (k.length === 1) { S.pq += k; S.psel = 0; renderPalette(); return; }
    return;
  }
  if ($('#lock').classList.contains('on')) {
    if (k === 'Escape' || k === 'Enter') { showLock(false); toast('unlocked', 'session resumed on tty1, seat0'); }
    return;
  }
  if (k === 'Escape') { if (ovOn()) showOverview(false); hideMenus(); return; }
  if (k === 'F1') { showOverview(!ovOn()); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (k === 'l' || k === 'L')) { showLock(true); ev.preventDefault(); return; }
  if (ev.altKey && (k === '1' || k === '2')) { setWs(+k); ev.preventDefault(); return; }
});

/* ============================================================ theme ==
 * The hash is authoritative for BOTH scene and ladder. #files is the
 * derived work-light ladder, #files-dark is graphite - the home. The
 * suffix convention matches every other prototype in this directory even
 * though this direction's default is the suffixed one, because a reader
 * comparing ten files should not have to remember an exception.
 */
const LADDER = {
  dark: { name: 'graphite', other: 'work light',
    pitch: 'warm graphite, one raking light, and a focus signal that spends area ' +
           'instead of contrast. dark native.' },
  light: { name: 'work light', other: 'graphite',
    pitch: 'the same machined plate under work light. derived, not inverted - the ' +
           'struck edge loses its headroom and the cut edge takes over.' }
};
function applyTheme() {
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = LADDER[S.theme].pitch;
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-ladder="light">work light</span>' +
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-ladder="dark">graphite</span>';
}
function hashName() { return S.scene + (S.theme === 'dark' ? '-dark' : ''); }
function setTheme(t, announce) {
  S.theme = t === 'dark' ? 'dark' : 'light';
  applyTheme(); renderLinks(); drawRaster(); redrawAll();
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    toast(LADDER[S.theme].name, S.theme === 'dark'
      ? 'ground L* ' + lstar('--zd-base') + ', struck edge carries depth at ' +
        r3('--zd-lit', '--zd-base') + ':1, groove at ' + r3('--zd-cut', '--zd-base') + ':1'
      : 'ground L* ' + lstar('--zd-base') + ', no headroom above it, so the cut edge carries at ' +
        r3('--zd-cut', '--zd-base') + ':1 and the struck run drops to ' + r3('--zd-lit', '--zd-base') + ':1');
  }
}
const SCENES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function renderLinks() {
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#links').innerHTML = SCENES.map(n => '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-dark$/, '') === S.scene));
}
$('#themetog').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-ladder]');
  if (t) { ev.preventDefault(); ev.stopPropagation(); setTheme(t.getAttribute('data-ladder'), true); }
});

/* =========================================================== scenes == */
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.win[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZT = 10;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#toasts').innerHTML = '';
}
function put(id, x, y, w, h, ws) { openWin(id, [x, y, w, h], ws || S.ws); }
function baseDesktop() {
  clearAll();
  S.ws = 1;
  const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 830;
  const cw = Math.floor((fw - 34) / 2), ch = Math.floor((fh - 34) / 2);
  put('shell', 12, 12, cw, ch);
  put('files', cw + 22, 12, cw, ch);
  put('mon', 12, ch + 22, cw, ch);
  put('log', cw + 22, ch + 22, cw, ch);
  /* one plate deliberately laid ACROSS two others, front most, because
     the occlusion rule is the whole reason this ground can float its
     windows and it should be visible without touching anything. */
  put('regs', Math.floor(fw * 0.30), Math.floor(fh * 0.26), Math.floor(fw * 0.44), Math.floor(fh * 0.50));
  put('hex', 40, 40, Math.floor(fw * 0.5), Math.floor(fh * 0.55), 2);
  put('net', Math.floor(fw * 0.4), Math.floor(fh * 0.3), Math.floor(fw * 0.52), Math.floor(fh * 0.6), 2);
  focusWin('regs');
  layout(); damage(40);
}
function setScene(name, push) {
  let dark = false;
  if (/-dark$/.test(name)) { dark = true; name = name.slice(0, -5); }
  if (SCENES.indexOf(name) < 0) { name = 'desktop'; dark = true; }
  S.scene = name; S.theme = dark ? 'dark' : 'light';
  applyTheme(); renderLinks();
  if (push !== false) history.replaceState(null, '', '#' + hashName());

  if (name === 'desktop') {
    baseDesktop();
    toast('five plates, one over two',
      '13 REGISTERS lies across 01 and 03. its edges are ZD_EDGE_OVER at ' +
      r2('--zd-edge-over', '--zd-base') + ':1 on the bodies underneath. a groove cannot do it: ' +
      'pure black on this ground tops out at ' + darkCeil('--zd-base') + ':1, and the floor is 3.00');
  } else if (name === 'overview') {
    baseDesktop(); layout(); showOverview(true);
  } else if (name === 'palette') {
    baseDesktop(); S.pq = 'mon'; S.psel = 0; showPalette(true);
  } else if (name === 'files') {
    clearAll(); S.ws = 1;
    const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 830;
    put('files', 12, 12, Math.floor(fw * 0.44), fh - 24);
    put('edit', Math.floor(fw * 0.44) + 22, 12, fw - Math.floor(fw * 0.44) - 34, fh - 24);
    S.fileSel = 1; redraw('files'); redraw('edit');
    focusWin('files'); layout(); damage(20);
    toast('selected', 'fb.c 68.4 KiB, opened in 04 EDITOR. the two plates abut and do not ' +
      'overlap, so both draw ZD_CUT and the occlusion rule is inert');
  } else if (name === 'monitor') {
    clearAll(); S.ws = 1;
    const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 830;
    put('mon', 12, 12, Math.floor(fw * 0.56), fh - 24);
    put('net', Math.floor(fw * 0.50), 60, fw - Math.floor(fw * 0.50) - 24, fh - 100);
    focusWin('mon'); layout(); damage(60);
    toast('sampling at 1 Hz', '03 MONITOR is focused and lies over 08 NETWORK, so MONITOR draws ' +
      'the boundary and NETWORK draws none. the raster strip advances one column per composite, ' +
      'so a 1 Hz sampler produces one column per second and not sixty');
  } else if (name === 'settings') {
    clearAll(); S.ws = 1;
    const fw = $('#field').clientWidth || 1400, fh = $('#field').clientHeight || 830;
    put('sys', Math.floor(fw * 0.52), 12, fw - Math.floor(fw * 0.52) - 24, Math.floor(fh * 0.58));
    put('clock', Math.floor(fw * 0.52), Math.floor(fh * 0.60), fw - Math.floor(fw * 0.52) - 24, Math.floor(fh * 0.38));
    put('set', 12, 12, Math.floor(fw * 0.50), fh - 24);
    S.setTab = 0; redraw('set'); focusWin('set'); layout(); damage(12);
  } else if (name === 'lock') {
    baseDesktop(); showLock(true);
  }
  renderRail(); renderRuler(); applyCfg();
}
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop-dark', false));
window.addEventListener('resize', () => { layout(); drawRaster(); if (ovOn()) showOverview(true); });

/* ============================================================ start == */
applyCfg();
for (let i = 0; i < 720; i++) S.raster.push({ us: 5200 + Math.round(Math.random() * 7000), k: 0 });
setScene(location.hash.slice(1) || 'desktop-dark', false);
drawRaster();
setInterval(tick, 1000);
</script>
