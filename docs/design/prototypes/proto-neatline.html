      ['raise to front', 'click'],
      ['fill the sheet', 'ctrl f'],
      ['minimise', 'ctrl m'],
      ['send to ws ' + pad2(S.ws === 1 ? 2 : 1), 'shift'],
      ['close sheet', 'ctrl w']
    ], APP[id].name + '  ' + S.wins[id].ref);
    $('#ctxmenu')._kind = 'win';
    $('#ctxmenu')._win = id;
  }
});

$('#ctxmenu').addEventListener('mousedown', ev => {
  const mi = ev.target.closest('.mi');
  if (!mi) return;
  const i = Number(mi.getAttribute('data-mi'));
  const el = $('#ctxmenu');
  hideMenus();
  if (el._kind === 'field') {
    [() => openWin('term'), () => showPalette(true), () => setScene('overview'),
     () => { S.grid = !S.grid; layout(); redraw('set'); toast('grid', S.grid ? 'ruled' : 'unruled'); },
     () => setKeyFull(!S.keyFull),
     () => tileAll(), () => setScene('lock'),
     () => setStock(S.theme === 'dark' ? 'light' : 'dark', true)][i]();
  } else {
    const id = el._win;
    [() => focusWin(id), () => maxWin(id), () => minWin(id),
     () => { S.wins[id].ws = S.ws === 1 ? 2 : 1; layout(); toast('moved', id.toUpperCase() + ' to ws ' + pad2(S.ws === 1 ? 2 : 1)); },
     () => closeWin(id)][i]();
  }
});
$('#winmenu').addEventListener('mousedown', ev => {
  const mi = ev.target.closest('.mi');
  if (!mi) return;
  const i = Number(mi.getAttribute('data-mi'));
  const id = $('#winmenu')._win;
  hideMenus();
  const w = S.wins[id];
  [() => focusWin(id), () => minWin(id), () => maxWin(id),
   () => {
     if (w.free) { w.free = false; }
     else {
       const r = winRect(w);
       w.free = true; w.px = r.x + 14; w.py = r.y + 9; w.pw = r.w; w.ph = r.h;
     }
     layout();
     toast(w.free ? 'off grid' : 'back on the grid',
       w.free ? id.toUpperCase() + ' no longer sits on a cell boundary'
              : id.toUpperCase() + ' snapped to ' + w.ref);
   },
   () => { w.ws = S.ws === 1 ? 2 : 1; layout(); toast('moved', id.toUpperCase() + ' to ws ' + pad2(w.ws)); },
   () => toast('grid ref', APP[id].name.toUpperCase() + ' south west corner ' + w.ref),
   () => closeWin(id)][i]();
});

function handleWinAction(id, t) {
  const node = t.closest('[data-act], [data-toggle], [data-seg], [data-slider]');
  if (!node) return;
  if (node.hasAttribute('data-toggle')) {
    const k = node.getAttribute('data-toggle');
    S[k] = !S[k];
    if (k === 'zebra' || k === 'bands') redrawAll();
    if (k === 'blink') document.body.classList.toggle('blinkon', S.blink);
    layout(); redraw('set');
    toast(k, S[k] ? 'on' : 'off');
    return;
  }
  const segp = t.closest('[data-seg]');
  if (segp && t.closest('[data-arg]')) {
    const av = Number(t.closest('[data-arg]').getAttribute('data-arg'));
    const which = segp.getAttribute('data-seg');
    if (which === 'stock') { setStock(av ? 'dark' : 'light', true); return; }
    if (which === 'keymode') { setKeyFull(!!av); return; }
    S.setTab = av; redraw('set');
    return;
  }
  const act = node.getAttribute('data-act');
  const arg = node.getAttribute('data-arg');
  if (act === 'file') { S.fileSel = Number(arg); redraw('files'); redraw('edit'); return; }
  if (act === 'proc') { S.procSel = Number(arg); redraw('mon'); redraw('proc'); return; }
  if (act === 'open') { openWin(arg); return; }
  if (act === 'calc') { calcKey(arg); redraw('calc'); return; }
  if (act === 'toast') {
    const M = {
      build: ['make', 'zlos.elf relinked, text 218432 data 30720 bss 1441792'],
      fsck:  ['zlfs', 'generation 3, 0 orphan extents, crc verified'],
      reap:  ['reaped', 'pid 77 intel_lt removed from the task table'],
      renice: ['renice', 'pid 61 soak moved to nice 10'],
      retile: ['re-ruled', 'every sheet snapped back to a cell boundary']
    }[arg] || ['ok', arg];
    if (arg === 'retile') tileAll();
    toast(M[0], M[1]);
    return;
  }
}
function calcKey(k) {
  if (k === 'clr') { S.calcAcc = '0'; return; }
  if (k === 'eq') { S.calcAcc = String(parseInt(S.calcAcc, 10) || 0); return; }
  if (/^[0-9]$/.test(k)) { S.calcAcc = (S.calcAcc === '0' ? '' : S.calcAcc) + k; return; }
  const n = parseInt(S.calcAcc, 10) || 0;
  if (k === 'div') { S.calcAcc = String(Math.floor(n / 2)); return; }
  if (k === 'mul') { S.calcAcc = String(n * 2); return; }
  if (k === 'add') { S.calcAcc = String(n + 1); return; }
  if (k === 'sub') { S.calcAcc = String(n - 1); return; }
}
function tileAll() {
  const list = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min);
  const n = list.length;
  if (!n) return;
  const perRow = n <= 2 ? n : Math.ceil(n / 2);
  const rowsN = n <= 2 ? 1 : 2;
  list.forEach((w, i) => {
    const rr = Math.floor(i / perRow), cc = i % perRow;
    w.free = false; w.max = false; w.moved = true;
    w.cw = Math.floor(GRID.nx / perRow); w.ch = Math.floor(GRID.ny / rowsN);
    w.cx = cc * w.cw; w.cy = rr * w.ch;
  });
  layout();
  toast('re-ruled', n + ' sheets onto the ' + GRID.nx + ' x ' + GRID.ny + ' cell grid');
}

/* -------------------------------------------------------------- sliders */
let SL = null;
document.addEventListener('mousedown', ev => {
  const s = ev.target.closest('[data-slider]');
  if (!s) return;
  SL = s; setSlider(ev);
});
document.addEventListener('mousemove', ev => { if (SL) setSlider(ev); });
document.addEventListener('mouseup', () => { SL = null; });
function setSlider(ev) {
  const name = SL.getAttribute('data-slider');
  const r = SL.getBoundingClientRect();
  const p = clamp((ev.clientX - r.left) / r.width, 0, 1);
  const steps = name === 'ui' ? UI_STEPS : PITCH_STEPS;
  const v = steps[Math.round(p * (steps.length - 1))];
  if (name === 'ui') { if (v === S.ui) return; S.ui = v; applyUI(); applyKeyH(); }
  else { if (v === S.pitch) return; S.pitch = v; }
  layout(); redrawAll();
}

/* ----------------------------------------------------------------- drag */
function startDrag(ev, id, el) {
  const w = S.wins[id];
  if (w.max) return;
  const r = el.getBoundingClientRect(), f = $('#field').getBoundingClientRect();
  const ox = ev.clientX - r.left, oy = ev.clientY - r.top;
  const wid = r.width, hgt = r.height;
  el.classList.add('drag');
  function move(e) {
    w.free = true;
    w.px = Math.round(e.clientX - f.left - ox);
    w.py = Math.round(e.clientY - f.top - oy);
    w.pw = wid; w.ph = hgt;
    layout();
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    el.classList.remove('drag');
    if (S.snap && w.free) {
      w.cx = clamp(Math.round(w.px / S.pitch), 0, Math.max(0, GRID.nx - w.cw));
      w.cy = clamp(Math.round(w.py / S.pitch), 0, Math.max(0, GRID.ny - w.ch));
      w.free = false; w.moved = true;
      layout();
      toast('placed', APP[id].name.toUpperCase() + ' at ' + w.ref);
    }
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

/* -------------------------------------------------------------- keyboard */
let KEYHELD = false;
document.addEventListener('keydown', ev => {
  const k = ev.key;
  if ($('#lock').classList.contains('on')) {
    if (k === 'Enter' || k === 'Escape') { setScene('desktop'); toast('session', 'unlocked, sheets restored'); ev.preventDefault(); }
    return;
  }
  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); ev.preventDefault(); return; }
    if (k === 'Enter') { runPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowDown') { S.psel = Math.min(S.psel + 1, Math.min(7, paletteResults().length - 1)); renderPalette(); ev.preventDefault(); return; }
    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
    if (k === 'Backspace') { S.pq = S.pq.slice(0, -1); S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    if (k.length === 1 && !ev.ctrlKey && !ev.metaKey) { S.pq += k; S.psel = 0; renderPalette(); ev.preventDefault(); return; }
    return;
  }
  if (ev.shiftKey && (k === 'D' || k === 'd') && !ev.ctrlKey && !ev.altKey) {
    setStock(S.theme === 'dark' ? 'light' : 'dark', true); ev.preventDefault(); return;
  }
  if (!ev.ctrlKey && !ev.altKey && !ev.shiftKey && (k === 'k' || k === 'K')) {
    if (!KEYHELD) { KEYHELD = true; setKeyFull(true); }
    ev.preventDefault(); return;
  }
  if (ev.ctrlKey && (k === 'k' || k === 'K')) { S.pq = ''; S.psel = 0; showPalette(true); ev.preventDefault(); return; }
  if (ev.ctrlKey && k === ' ') { setScene(overviewOn() ? 'desktop' : 'overview'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'l' || k === 'L')) { setScene('lock'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'g' || k === 'G')) { S.grid = !S.grid; layout(); redraw('set'); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 't' || k === 'T')) { tileAll(); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'w' || k === 'W')) { if (S.focus) closeWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'f' || k === 'F')) { if (S.focus) maxWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && (k === 'm' || k === 'M')) { if (S.focus) minWin(S.focus); ev.preventDefault(); return; }
  if (ev.ctrlKey && /^[1-4]$/.test(k)) {
    S.ws = Number(k);
    const top = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout(); ev.preventDefault(); return;
  }
  if (ev.altKey && /^[a-zA-Z]$/.test(k)) {
    const a = APPS.find(x => x.key === k.toUpperCase());
    if (a) { openWin(a.id); ev.preventDefault(); }
    return;
  }
  if (k === 'Escape') { if (overviewOn()) setScene('desktop'); hideMenus(); }
});
document.addEventListener('keyup', ev => {
  if ((ev.key === 'k' || ev.key === 'K') && KEYHELD) { KEYHELD = false; setKeyFull(false); }
});

/* ================================================================ stock */
const STOCK = {
  light: { name: 'day', other: 'night',
    pitch: 'one map sheet. a full perimeter apron, a ruled 100 unit field, and five inks ' +
           'that each mean exactly one class of thing because the key on screen says so.',
    toast: ['day', () => 'unprinted margin ' + tokHex('--zd-apron') + ' above the field ' +
            tokHex('--zd-field') + ', ink at ' + tokRatio('--zd-ink', '--zd-field') + ':1'] },
  dark:  { name: 'night', other: 'day',
    pitch: 'the same sheet on the bridge at night. IHO S-52 NIGHT: teal black ground, ' +
           'chart white at 13.34:1, and no large area is ever allowed to be bright.',
    toast: ['night', () => 'S-52 night table, ground ' + tokHex('--zd-field') +
            ', chart white ' + tokHex('--zd-ink') + ' at ' +
            tokRatio('--zd-ink', '--zd-field') + ':1'] }
};
function applyTheme() {
  if (S.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  $('#pitch').textContent = STOCK[S.theme].pitch;
  $('#themetog').innerHTML =
    '<span class="tk' + (S.theme === 'light' ? ' on' : '') + '" data-stock="light">day</span>' +
    '<span class="tk' + (S.theme === 'dark' ? ' on' : '') + '" data-stock="dark">night</span>' +
    '<span class="thint">shift D</span>';
}
function hashName() { return S.scene + (S.theme === 'dark' ? '-dark' : ''); }
function setStock(t, announce) {
  const next = t === 'dark' ? 'dark' : 'light';
  if (next === S.theme && announce) return;
  S.theme = next;
  applyTheme(); renderLinks(); redraw('set'); layout();
  if (announce) {
    history.replaceState(null, '', '#' + hashName());
    const tb = STOCK[S.theme].toast[1];
    toast(STOCK[S.theme].toast[0], typeof tb === 'function' ? tb() : tb);
  }
}
function renderLinks() {
  const sfx = S.theme === 'dark' ? '-dark' : '';
  $('#links').innerHTML = SCENE_NAMES.map(n => '<a href="#' + n + sfx + '">' + n + '</a>').join('');
  markLinks(S.scene);
}
function markLinks(name) {
  $$('#links a').forEach(a => a.classList.toggle('on',
    a.getAttribute('href').slice(1).replace(/-dark$/, '') === name));
}

/* =============================================================== scenes */
const SCENE_NAMES = ['desktop', 'overview', 'palette', 'files', 'monitor', 'settings', 'lock'];
function clearAll() {
  Object.keys(S.wins).forEach(id => { const e = $('.win[data-id="' + id + '"]'); if (e) e.remove(); });
  S.wins = {}; S.focus = null; ZTOP = 10;
  showOverview(false); showPalette(false); showLock(false); hideMenus();
  $('#toasts').innerHTML = '';
}
function place(id, c, r, cw, rh, ws) { openWin(id, [c, r, cw, rh], ws || S.ws); }
function baseDesktop() {
  clearAll();
  S.ws = 1;
  place('term', 0, 0, 7, 4);
  place('files', 7, 0, 5, 4);
  place('mon', 0, 4, 7, 4);
  place('net', 7, 4, 5, 4);
  place('log', 0, 0, 7, 4, 2);
  place('regs', 7, 0, 5, 5, 2);
  place('hex', 0, 4, 12, 4, 2);
  /* one sheet deliberately off the grid, to show the state exists */
  openWin('sys', [3, 2, 6, 5]);
  const w = S.wins.sys;
  const r = winRect(w);
  w.free = true; w.px = r.x + 17; w.py = r.y - 23; w.pw = r.w; w.ph = r.h;
  focusWin('sys');
  layout();
}
function setScene(name, push) {
  let dark = false;
  if (/-dark$/.test(name)) { dark = true; name = name.slice(0, -5); }
  if (SCENE_NAMES.indexOf(name) < 0) { name = 'desktop'; dark = false; }
  S.scene = name;
  S.theme = dark ? 'dark' : 'light';
  applyTheme(); renderLinks();
  if (push !== false && location.hash.slice(1) !== hashName()) {
    history.replaceState(null, '', '#' + hashName());
  }
  markLinks(name);
  computeGrid();
  if (name === 'desktop') {
    baseDesktop();
    toast('placed', '4 sheets on ws 01, one off the grid and marked');
  } else if (name === 'overview') {
    baseDesktop(); layout(); showOverview(true);
  } else if (name === 'palette') {
    baseDesktop(); S.pq = 'grid'; S.psel = 0; showPalette(true);
  } else if (name === 'files') {
    clearAll(); S.ws = 1;
    place('files', 0, 0, 5, 8);
    place('edit', 5, 0, 7, 8);
    S.fileSel = 1;
    redraw('files'); redraw('edit');
    focusWin('files');
    toast('selected', 'fb.c 68.4 KiB, opened in EDITOR');
  } else if (name === 'monitor') {
    clearAll(); S.ws = 1;
    place('mon', 0, 0, 7, 8);
    place('net', 7, 0, 5, 8);
    focusWin('mon');
    toast('sampling', 'monitor and network at 1 Hz, 72 s history');
  } else if (name === 'settings') {
    clearAll(); S.ws = 1;
    place('sys', 7, 0, 5, 5);
    place('clock', 7, 5, 5, 3);
    place('set', 0, 0, 7, 8);
    S.setTab = 0;
    redraw('set');
    focusWin('set');
  } else if (name === 'lock') {
    baseDesktop(); showLock(true);
  }
  layout();
}
$('#themetog').addEventListener('mousedown', ev => {
  const t = ev.target.closest('[data-stock]');
  if (t) { ev.preventDefault(); setStock(t.getAttribute('data-stock'), true); }
});
window.addEventListener('hashchange', () => setScene(location.hash.slice(1) || 'desktop', false));
/* Synchronous, not deferred. A deferred relayout depends on a frame being
   scheduled, and there are two real cases where one is not: a headless capture
   that resizes the viewport after load, and a background tab. layout() does
   not change the size of #field, so observing #field and laying out inside the
   callback cannot loop. */
let RELAY = 0;
function relayout() {
  if (RELAY) return;
  RELAY = 1;
  layout();
  if (overviewOn()) showOverview(true);
  if ($('#lock').classList.contains('on')) renderLock();
  RELAY = 0;
}
window.addEventListener('resize', relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe($('#field'));

/* ================================================================ start */
document.body.classList.add('blinkon');
applyTheme(); applyUI(); applyKeyH();
computeGrid();
setScene(location.hash.slice(1) || 'desktop', false);
relayout();
window.addEventListener('load', relayout);
/* The viewport is not necessarily final when the first layout runs: fonts
   settle, a scrollbar appears or disappears, and a headless capture resizes
   after load. Four cheap re-rules cover every case that has actually bitten,
   and the ResizeObserver covers the rest. */
[0, 60, 250, 800].forEach(ms => setTimeout(relayout, ms));
setInterval(tick, 1000);
</script>
</body>
