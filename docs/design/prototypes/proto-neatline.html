<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neatline / zlOS living prototype</title>
<style>
/* ============================================================== design.h
   NEATLINE. The desktop is ONE MAP SHEET.

   Chrome is a full perimeter apron, not a rail: eastings and the sheet title
   on the top edge, northings on the left, the tick channel on the right, and
   the KEY along the bottom. Inside the neatline the field is ruled on a
   100 unit grid, 1 px, every fifth line heavier.

   FIVE INKS, AND EACH ONE MEANS EXACTLY ONE CLASS OF THING, because the key
   on screen says so:

     INK      structure, type, rules. everything that is not a referent.
     WATER    i/o, net, pipes, streams.
     WOOD     user data and files.
     CONTOUR  level and pressure. cpu, memory, heat. drawn as banded fills
              exactly as contours are.
     ROAD     routes and actions. the one primary action, and failure.

   Three laws follow from that, and they are enforced in this stylesheet:
     1. NO LEXICAL INK IS EVER SET AS TEXT. They are marks, fills and rules.
        Every text colour in this document is ZD_INK, ZD_INK_2, ZD_INK_3 or a
        knockout rank. Grep for "color: var(--zd-water" and you will not
        find one.
     2. NO LEXICAL INK CARRIES STATE. Focus, selection, hover and pressed are
        all made with the neatline, with weight, and with value inversion.
        A hue never moves to say "this one".
     3. THE KEY IS ALWAYS ON SCREEN. The bottom apron collapses from the full
        96 dp KEY to a 24 dp LIVE LEGEND carrying only the inks and symbols
        actually on screen, but it never collapses to nothing. The contract is
        the legal justification for spending five inks and it is the one thing
        that may not be cut.

   Zero hex appears as a CSS value anywhere outside the two :root blocks.
   Every custom property name below exists in BOTH modes.
   ------------------------------------------------------------------------ */
:root {
  /* -------------------------------------------------------- the stock --
     THE MARGIN IS BRIGHTER THAN THE FIELD. This is the one relationship
     that inverts PLATE. On a real sheet the margin is unprinted paper and
     the body carries the base tint, so the apron sits ABOVE the field in
     luminance (1.16:1) rather than below it. */
  --zd-apron:      #F5F2E8;   /* the marginal apron. unprinted stock.       */
  --zd-paper:      #F1EDE1;   /* a window sheet.                            */
  --zd-field:      #E7E2D4;   /* the ruled field inside the neatline.       */
  --zd-well:       #DFDACA;   /* a sunken box: input, plot ground, track.   */
  --zd-tint:       #DCD6C6;   /* the zebra tint. CARRIES TEXT.              */

  --zd-ink:        #101211;   /* 16.07:1 on paper, 14.53:1 on the field.    */
  --zd-ink-2:      #3A3831;   /* 10.02 / 9.07                               */
  --zd-ink-3:      #56534A;   /* 6.57 / 5.94                                */

  --zd-grid:       #8E897A;   /* the 1 px grid line. 2.70:1 on the field.   */
  --zd-grid-5:     #6E6A5D;   /* every fifth line. 4.18:1 on the field.     */
  --zd-rule-1:     #6E6A5D;   /* 1 px hairline inside a sheet.              */
  --zd-rule-2:     #101211;   /* 2 px structural rule. the neatline.        */

  /* ------------------------------------------------- the five inks ----
     Measured, not estimated. Each is quoted against the FIELD and against
     PAPER, the two grounds a mark can land on, and the key prints these
     same numbers live off :root at run time. None is used as text, so the
     binding floor is the 3:1 non text floor; all four clear 4.10. */
  --zd-water:      #42718A;   /* 4.10 field / 4.53 paper  i/o, net, streams */
  --zd-wood:       #4F6F44;   /* 4.40 / 4.86              user data, files  */
  --zd-contour:    #95592D;   /* 4.33 / 4.79              level, pressure   */
  --zd-road:       #B23A22;   /* 4.61 / 5.09              routes, actions   */

  /* the contour ramp. a level is drawn as BANDED FILL, the way a contour
     map draws height, never as a single bar in one colour. band 4 is the
     contour ink itself; 1 to 3 are its screened tints. */
  --zd-band-1:     #E3D6C0;
  --zd-band-2:     #D3BB98;
  --zd-band-3:     #BE9C6C;
  --zd-band-4:     #95592D;

  /* ------------------------------------------------------ the knockout --
     The one value inversion in the system. It marks a SELECTED ROW, a
     pressed control and a menu head. It never marks window focus: that is
     the neatline's job, and giving it two signals would make the neatline
     decorative. */
  --zd-slab:       #101211;
  --zd-slab-0:     #F5F2E8;   /* 16.79:1 on the slab                        */
  --zd-slab-1:     #BDB8A9;   /*  9.49:1 on the slab                        */

  /* the three status words. not lexical inks: these are TYPE, so they are
     held to the 4.5:1 body floor on every ground they can land on. */
  --zd-ok:         #1C5F34;
  --zd-warn:       #6B4400;
  --zd-bad:        #A3210F;

  /* ------------------------------------------------------------ metrics */
  --ui: 1;
  --ap:        calc(24px * var(--ui));   /* apron on three edges           */
  --keyh:      calc(24px * var(--ui));   /* bottom apron. 24 live, 96 full */
  --neat:      calc(6px * var(--ui));    /* 2 outer + 3 paper + 1 inner    */
  --pitch:     20px;                     /* grid pitch, px per 20 units    */
  --row-h:     calc(24px * var(--ui));
  --cell-h:    calc(20px * var(--ui));
  --hdr-h:     calc(26px * var(--ui));
  --pad:       calc(12px * var(--ui));
  --gap:       calc(8px  * var(--ui));
  --r-0: 0px;

  /* THREE TYPE SIZES AND ONE DISPLAY SIZE. 11 / 15 / 22 map onto the baked
     8x16, 16x32 and 24x48 atlases at 1.0 scale; 44 is 24x48 doubled, used
     once, on the lock clock. Nothing else upscales. */
  --fs-data:   calc(11px * var(--ui));
  --lh-data:   calc(16px * var(--ui));
  --fs-body:   calc(15px * var(--ui));
  --lh-body:   calc(22px * var(--ui));
  --fs-title:  calc(22px * var(--ui));
  --lh-title:  calc(26px * var(--ui));
  --fs-disp:   calc(44px * var(--ui));
  --track:     calc(2px * var(--ui));
  --track-tt:  calc(1px * var(--ui));

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ========================================================= design.h, dark
   THE NIGHT SHEET, and it is made of a documented real thing rather than
   taste. IHO S-52 defines a NIGHT colour table for ECDIS, the chart display
   on a ship's bridge, whose whole job is to stay readable without wrecking
   the watch officer's dark adaptation. Four things follow from adopting it,
   and all four are visible below:

   1. THE GROUND IS COOL, NOT NEUTRAL. #0D1214 is a teal black. A neutral
      near black is the stock answer and it is what the current zlOS desktop
      already is; the chart ground is specifically NOT that.
   2. NOTHING IS WHITE. "Chart white" at night is #D6DAD6, 13.34:1 on the
      ground. A real white would be a lamp.
   3. NO LARGE AREA IS EVER BRIGHT. This is why the knockout does not
      invert literally. On paper the slab is ink and the type is stock; at
      night the slab CANNOT become chart white, because a selected table row
      would then be the brightest object in the room. So ZD_SLAB steps to a
      lifted band #3E4A4F (2.06:1 above the ground) and the type on it comes
      DOWN to #E8ECE8. Same rank, same operation, no lamp.
   4. THE FIVE INKS ARE RETUNED, NOT LIGHTENED. Each keeps its hue family
      and its meaning and is re-measured on the night ground: water 5.56,
      wood 5.50, contour 5.08, road 4.95 on the field.

   The apron stays BRIGHTER than the field in this mode too, because that
   relationship is the direction, not a light mode artifact.
   ------------------------------------------------------------------------ */
:root[data-theme="dark"] {
  --zd-apron:      #151D20;   /* margin, still above the field: 1.10:1      */
  --zd-paper:      #1E262A;   /* a window sheet. 1.23:1 on the ground.      */
  --zd-field:      #0D1214;   /* S-52 NIGHT ground. cool teal black.        */
  --zd-well:       #171E21;
  --zd-tint:       #273035;

  --zd-ink:        #D6DAD6;   /* chart white. 13.34:1 on the field.         */
  --zd-ink-2:      #AFB6B4;   /* 9.13 on field / 7.45 on paper              */
  --zd-ink-3:      #949C9A;   /* 6.72 / 5.48                                */

  --zd-grid:       #333E43;   /* 1.72:1. structure at night, not a net.     */
  --zd-grid-5:     #4A575C;   /* 2.52:1                                     */
  --zd-rule-1:     #4A575C;
  --zd-rule-2:     #D6DAD6;

  --zd-water:      #5A93AB;   /* 5.56 field / 4.54 paper                    */
  --zd-wood:       #6E9560;   /* 5.50 / 4.49                                */
  --zd-contour:    #B0793F;   /* 5.08 / 4.14                                */
  --zd-road:       #D2604A;   /* 4.95 / 4.04                                */

  --zd-band-1:     #232B2C;
  --zd-band-2:     #3C3B33;
  --zd-band-3:     #6B5334;
  --zd-band-4:     #B0793F;

  --zd-slab:       #3E4A4F;   /* NOT chart white. see note 3 above.         */
  --zd-slab-0:     #E8ECE8;   /* 7.66:1 on the slab                         */
  --zd-slab-1:     #B4BDBB;   /* 4.76:1 on the slab                         */

  --zd-ok:         #64C08A;
  --zd-warn:       #D2A44E;
  --zd-bad:        #EE8F76;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--zd-field); font-family: var(--sans); overflow: hidden;
       -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--zd-well); border-left: 1px solid var(--zd-rule-1); }
::-webkit-scrollbar-thumb { background: var(--zd-ink-3); border-radius: var(--r-0); }

/* ================================================================ type == */
.t-data  { font-family: var(--mono); font-size: var(--fs-data); line-height: var(--lh-data);
           color: var(--zd-ink-2); font-variant-numeric: tabular-nums; }
.t-label { font-family: var(--sans); font-size: var(--fs-data); line-height: var(--lh-data);
           font-weight: 700; text-transform: uppercase; letter-spacing: var(--track);
           margin-right: calc(-1 * var(--track)); color: var(--zd-ink-3); }
.t-body  { font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body);
           color: var(--zd-ink-2); }
.t-title { font-family: var(--sans); font-size: var(--fs-title); line-height: var(--lh-title);
           font-weight: 700; text-transform: uppercase; letter-spacing: calc(4px * var(--ui));
           margin-right: calc(-4px * var(--ui)); color: var(--zd-ink); }
.t-disp  { font-family: var(--mono); font-size: var(--fs-disp); line-height: 1.15;
           font-weight: 700; color: var(--zd-ink); font-variant-numeric: tabular-nums;
           letter-spacing: calc(3px * var(--ui)); }
.i0 { color: var(--zd-ink); } .i2 { color: var(--zd-ink-2); } .i3 { color: var(--zd-ink-3); }
.k0 { color: var(--zd-slab-0); } .k1 { color: var(--zd-slab-1); }
.w-ok { color: var(--zd-ok); } .w-warn { color: var(--zd-warn); } .w-bad { color: var(--zd-bad); }
.b { font-weight: 700; }
.mono { font-family: var(--mono); }

/* ================================================== prototype furniture = */
#strip { position: fixed; left: 0; right: 0; top: 0; height: 28px; z-index: 500;
         background: var(--zd-slab); display: flex; align-items: stretch; padding-left: 12px;
         border-bottom: 2px solid var(--zd-rule-2); }
#strip .nm { display: flex; align-items: center; color: var(--zd-slab-0); }
#strip .pitchtxt { display: block; line-height: 28px; padding: 0 14px; color: var(--zd-slab-1);
         font-family: var(--mono); font-size: 11px; white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; min-width: 0; }
#strip .links { margin-left: auto; display: flex; }
#strip a, #strip .tk, #strip .thint {
         display: flex; align-items: center; padding: 0 10px; text-decoration: none;
         border-left: 1px solid var(--zd-slab-1); color: var(--zd-slab-1);
         font-family: var(--sans); font-size: 11px; font-weight: 700;
         text-transform: uppercase; letter-spacing: 2px; }
#strip .thint { font-family: var(--mono); font-weight: 400; text-transform: none; letter-spacing: 0; }
#strip a.on, #strip .tk.on { background: var(--zd-slab-0); color: var(--zd-slab); }
#strip .tk { cursor: pointer; }
#strip .thm { display: flex; align-items: stretch; }

#os { position: fixed; left: 0; right: 0; top: 28px; bottom: 0;
      background: var(--zd-apron); overflow: hidden; }

/* ================================================================ apron =
   Chrome on all four edges. This is the move: the desktop is a BOUNDED
   SHEET with an outside, not a field with a sidebar. */
.apron { position: absolute; background: var(--zd-apron); z-index: 40; overflow: hidden; }
#ap-top    { left: 0; right: 0; top: 0; height: var(--ap); }
#ap-left   { left: 0; top: var(--ap); bottom: var(--keyh); width: var(--ap); }
#ap-right  { right: 0; top: var(--ap); bottom: var(--keyh); width: var(--ap); }
#ap-bottom { left: 0; right: 0; bottom: 0; height: var(--keyh);
             border-top: 1px solid var(--zd-rule-1); }

#ap-top .sheetname { position: absolute; left: calc(var(--ap) + var(--neat)); top: 0;
             height: var(--ap); display: flex; align-items: center; gap: 10px;
             background: var(--zd-apron); padding: 0 12px 0 6px; z-index: 3; }
#ap-top .sheetno { position: absolute; right: calc(var(--ap) + var(--neat) + 6px); top: 0;
             height: var(--ap); display: flex; align-items: center; gap: 10px;
             background: var(--zd-apron); padding-left: 12px; z-index: 3; }
.apsvg { position: absolute; left: 0; top: 0; pointer-events: none; }
.apsvg.echo { z-index: 6; }

/* the neatline of the SHEET ITSELF: 2 px outer, 3 px stock, 1 px inner. */
#neatframe { position: absolute; left: var(--ap); right: var(--ap); top: var(--ap);
             bottom: var(--keyh); border: 2px solid var(--zd-rule-2);
             background: var(--zd-apron); padding: 3px; z-index: 10; pointer-events: none; }
#neatframe > i { display: block; width: 100%; height: 100%; border: 1px solid var(--zd-rule-2); }

#field { position: absolute; left: calc(var(--ap) + var(--neat)); right: calc(var(--ap) + var(--neat));
         top: calc(var(--ap) + var(--neat)); bottom: calc(var(--keyh) + var(--neat));
         background: var(--zd-field); overflow: hidden; z-index: 12; }
#gridsvg { position: absolute; left: 0; top: 0; pointer-events: none; }
#wins { position: absolute; inset: 0; }

/* ================================================================== key =
   THE KEY IS THE LAUNCHER. A key's job is to explain a sheet you have never
   seen; a dock's job is to hold seven things you already know. That is why
   this one still works at 53 apps: it scrolls and it stays alphabetical. */
#ap-bottom.full { height: calc(96px * var(--ui)); }
.keyhead { height: calc(16px * var(--ui)); display: flex; align-items: center; gap: 10px;
           padding: 0 calc(var(--ap)) 0 var(--ap); border-bottom: 1px solid var(--zd-rule-1); }
.keybody { display: flex; height: calc(80px * var(--ui)); }
.keycols { flex: 1; min-width: 0; display: flex; overflow-x: auto; overflow-y: hidden;
           padding-left: var(--ap); }
.keycol  { flex: none; width: calc(212px * var(--ui)); display: flex; flex-direction: column;
           border-right: 1px solid var(--zd-rule-1); }
.keyrow  { height: calc(20px * var(--ui)); display: flex; align-items: center;
           gap: calc(6px * var(--ui)); padding: 0 calc(8px * var(--ui)); cursor: pointer; }
.keyrow:hover { background: var(--zd-slab); }
.keyrow:hover .t-label, .keyrow:hover .t-data { color: var(--zd-slab-0); }
.keyrow .sym { flex: none; width: calc(24px * var(--ui)); height: calc(20px * var(--ui));
               display: flex; align-items: center; justify-content: center; color: var(--zd-ink); }
.keyrow:hover .sym { color: var(--zd-slab-0); }
.keyrow .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
              text-overflow: ellipsis; color: var(--zd-ink-2); }
.keyrow .sc { flex: none; color: var(--zd-ink-3); }
.keyrow.run .nm { color: var(--zd-ink); font-weight: 700; }
.keyrow.run .sym::after { content: ''; }
.keyrow .lit { flex: none; width: 3px; height: calc(12px * var(--ui)); background: transparent; }
.keyrow.run .lit { background: var(--zd-ink); }
.keyrow.hold .lit { background: var(--zd-ink-3); }

.keyside { flex: none; display: flex; border-left: 2px solid var(--zd-rule-2); }
.inkkey  { width: calc(304px * var(--ui)); padding: 0 calc(10px * var(--ui)); }
.inkrow  { height: calc(16px * var(--ui)); display: flex; align-items: center; gap: 8px; }
.inkrow .sw { flex: none; width: calc(22px * var(--ui)); height: calc(9px * var(--ui));
              border: 1px solid var(--zd-rule-1); }
.inkrow .mn { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
.inkrow .rt { flex: none; color: var(--zd-ink-3); }
.scalebox { width: calc(196px * var(--ui)); padding: calc(4px * var(--ui)) calc(10px * var(--ui));
            border-left: 1px solid var(--zd-rule-1); display: flex; flex-direction: column;
            justify-content: center; }
.northbox { width: calc(86px * var(--ui)); border-left: 1px solid var(--zd-rule-1);
            display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* the 24 dp LIVE LEGEND. only what is on screen, and it is never absent. */
.legend { height: calc(24px * var(--ui)); display: flex; align-items: center;
          gap: calc(10px * var(--ui)); padding: 0 calc(10px * var(--ui)) 0 var(--ap);
          flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
.legend .lit { display: flex; align-items: center; gap: 5px; flex: none; white-space: nowrap; }
.legend > * { flex: none; }
.legend .t-data, .legend .t-label { white-space: nowrap; }
.legend .sw { width: calc(18px * var(--ui)); height: calc(8px * var(--ui));
              border: 1px solid var(--zd-rule-1); }
.legend .vr { width: 1px; height: calc(12px * var(--ui)); background: var(--zd-rule-1); flex: none; }
.legend .grow { margin-left: auto; }
.legend .hint { cursor: pointer; }
.legend .syms { display: flex; align-items: center; gap: 3px; color: var(--zd-ink); }

/* =============================================================== window =
   FOCUS IS THE NEATLINE. Unfocused a sheet carries a single 1 px frame;
   focused it carries the full border of a map sheet, 2 px outer rule,
   3 px of stock, 1 px inner rule. The 6 px is reserved in BOTH states, so
   focus never reflows a single glyph. */
/* THE ONLY MOTION besides the 500 ms caret: a 100 ms linear slide when a sheet
   moves. It is deliberately NOT applied to width or height. A transitioned
   size means the DOM and the pixels disagree for 100 ms, which is invisible in
   use and wrong every time something measures the sheet: a headless capture, a
   screenshot gate, or the index sheet cloning a live window. Position animates,
   extent does not. */
.win { position: absolute; border: 2px solid transparent; padding: 3px; background: transparent;
       display: flex; border-radius: var(--r-0);
       transition: left 100ms linear, top 100ms linear; }
.win.drag { transition: none; }
.win.hidden { display: none; }
.win.foc { border-color: var(--zd-rule-2); background: var(--zd-apron); }
.frame { flex: 1; min-width: 0; border: 1px solid var(--zd-rule-2); background: var(--zd-paper);
         display: flex; flex-direction: column; overflow: hidden; }
.hdr { height: var(--hdr-h); flex: none; display: flex; align-items: center;
       gap: calc(8px * var(--ui)); padding-left: calc(7px * var(--ui));
       border-bottom: 1px solid var(--zd-rule-1); user-select: none; cursor: default; }
.win.foc .hdr { border-bottom: 2px solid var(--zd-rule-2); }
.hdr .ico { flex: none; width: calc(20px * var(--ui)); height: calc(20px * var(--ui));
            color: var(--zd-ink); cursor: pointer; display: flex; align-items: center; }
.hdr .ttl { color: var(--zd-ink-2); flex: none; white-space: nowrap; }
.win.foc .hdr .ttl { color: var(--zd-ink); }
.hdr .sub { color: var(--zd-ink-3); flex: 0 1 auto; min-width: 0; overflow: hidden;
            white-space: nowrap; }
/* the grid reference, in the real format: two letters, four digits, which is
   exactly six mono cells wide. */
.hdr .ref { color: var(--zd-ink-2); flex: none; margin-left: auto; letter-spacing: 1px;
            padding-right: calc(6px * var(--ui)); white-space: nowrap; }
.win.foc .hdr .ref { color: var(--zd-ink); font-weight: 700; }
.ctls { display: flex; height: 100%; flex: none; }
.ctl { width: calc(22px * var(--ui)); display: flex; align-items: center; justify-content: center;
       border-left: 1px solid var(--zd-rule-1); color: var(--zd-ink-2); cursor: pointer; }
.ctl:hover { background: var(--zd-slab); color: var(--zd-slab-0); }
.body { flex: 1; min-height: 0; padding: calc(9px * var(--ui)); display: flex;
        flex-direction: column; overflow: hidden; }

/* =========================================================== primitives = */
.scroll { overflow: auto; min-height: 0; flex: 1; }
.hr1 { height: 1px; background: var(--zd-rule-1); flex: none; }
.hr2 { height: 2px; background: var(--zd-rule-2); flex: none; }
.vr1 { width: 1px; background: var(--zd-rule-1); align-self: stretch; flex: none; }
.row { display: flex; align-items: center; gap: var(--gap); flex: none; overflow: hidden; }
.row > .t-label, .row > .t-data { white-space: nowrap; }
.grow { margin-left: auto; }
.stack { display: flex; flex-direction: column; min-height: 0; }
.cols2 { display: flex; gap: calc(10px * var(--ui)); min-height: 0; flex: 1; }
.cols2 > * { flex: 1; min-width: 0; }
.well { background: var(--zd-well); border: 1px solid var(--zd-rule-1);
        padding: calc(5px * var(--ui)) calc(8px * var(--ui)); }
.slab { background: var(--zd-slab); padding: calc(5px * var(--ui)) calc(8px * var(--ui)); }
.slab .t-data { color: var(--zd-slab-0); }
.slab .dim { color: var(--zd-slab-1); }
.pre { font-family: var(--mono); font-size: var(--fs-data); line-height: var(--lh-data);
       white-space: pre; color: var(--zd-ink-2); }
.slab .pre { color: var(--zd-slab-0); }

.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th { text-align: left; height: var(--cell-h); padding: 0 calc(4px * var(--ui));
          border-bottom: 1px solid var(--zd-rule-1); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; font-family: var(--sans); font-size: var(--fs-data);
          font-weight: 700; text-transform: uppercase; letter-spacing: var(--track-tt);
          color: var(--zd-ink-3); }
.tbl td { height: var(--cell-h); padding: 0 calc(4px * var(--ui));
          border-bottom: 1px solid var(--zd-rule-1); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; font-family: var(--mono); font-size: var(--fs-data);
          line-height: var(--lh-data); color: var(--zd-ink-2); font-variant-numeric: tabular-nums; }
.tbl th.r, .tbl td.r { text-align: right; }
.zeb .tbl tbody tr:nth-child(even) td { background: var(--zd-tint); }
.zeb .tbl tbody tr.sel td, .tbl tbody tr.sel td { background: var(--zd-slab); color: var(--zd-slab-0); }
.tbl tr.sel td .i3, .tbl tr.sel td .i2 { color: var(--zd-slab-1); }
.tbl tr.pick { cursor: pointer; }
.tbl tr.pick:hover:not(.sel) td { background: var(--zd-well); }
/* a cell whose VALUE is a referent gets a 3 px ink bar, not coloured text.
   this is how a lexical ink reaches a table without becoming type. */
.cbar { display: inline-block; width: 3px; height: calc(11px * var(--ui));
        vertical-align: -1px; margin-right: 5px; }

.btn { height: calc(22px * var(--ui)); padding: 0 calc(10px * var(--ui)); display: inline-flex;
       align-items: center; border: 1px solid var(--zd-rule-1); background: var(--zd-paper);
       cursor: pointer; flex: none; border-radius: var(--r-0); }
.btn .t-label { color: var(--zd-ink-2); }
.btn:hover { background: var(--zd-well); }
.btn:active, .btn.down { background: var(--zd-slab); border-color: var(--zd-slab); }
.btn:active .t-label, .btn.down .t-label { color: var(--zd-slab-0); }
/* the ONE primary action per sheet. ROAD means routes and actions, so the
   primary action is marked with a 3 px road rule down its leading edge.
   the label stays ink: the ink is the mark, never the type. */
.btn.prim { border-left: 3px solid var(--zd-road); }
.btn.prim .t-label { color: var(--zd-ink); }

.seg { display: flex; border: 1px solid var(--zd-rule-1); flex: none; }
.seg > span { flex: 1; height: calc(22px * var(--ui)); display: flex; align-items: center;
       justify-content: center; background: var(--zd-well);
       border-right: 1px solid var(--zd-rule-1); cursor: pointer; }
.seg > span:last-child { border-right: 0; }
.seg > span .t-label { color: var(--zd-ink-2); }
.seg > span.on { background: var(--zd-slab); }
.seg > span.on .t-label { color: var(--zd-slab-0); }

/* CONTOUR: a level is drawn as banded fill. four bands, hard edges, exactly
   the way a contour map draws height. no gradient, no single bar. */
.cmeter { margin-bottom: calc(6px * var(--ui)); flex: none; }
.crow { display: flex; align-items: baseline; }
.crow .t-data { margin-left: auto; color: var(--zd-ink); font-weight: 700; }
.ctrack { height: calc(11px * var(--ui)); background: var(--zd-well);
          border: 1px solid var(--zd-rule-1); display: flex; overflow: hidden; }
.ctrack > i { display: block; height: 100%; }
.cb1 { background: var(--zd-band-1); } .cb2 { background: var(--zd-band-2); }
.cb3 { background: var(--zd-band-3); } .cb4 { background: var(--zd-band-4); }
.ctrack > u { display: block; height: 100%; width: 1px; background: var(--zd-rule-1); }

.kvgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(14px * var(--ui));
          flex: none; }
.kv { display: flex; align-items: baseline; border-bottom: 1px solid var(--zd-rule-1);
      height: var(--cell-h); flex: none; overflow: hidden; }
.kv .v { margin-left: auto; padding-left: calc(10px * var(--ui)); color: var(--zd-ink-2);
         font-family: var(--mono); font-size: var(--fs-data); white-space: nowrap;
         font-variant-numeric: tabular-nums; }

.plotbox { position: relative; flex: 1; min-height: calc(38px * var(--ui));
           max-height: calc(320px * var(--ui));
           background: var(--zd-well); border: 1px solid var(--zd-rule-1); overflow: hidden; }
.plotbox svg { display: block; }
.meanline { position: absolute; left: 0; right: 0; height: 1px; background: var(--zd-ink-3); }

.ctlrow { min-height: calc(28px * var(--ui)); display: flex; align-items: center; flex: none;
          border-bottom: 1px solid var(--zd-rule-1); }
.ctlrow .right { margin-left: auto; display: flex; align-items: center; gap: calc(10px * var(--ui)); }
.sw { width: calc(32px * var(--ui)); height: calc(16px * var(--ui)); background: var(--zd-well);
      border: 1px solid var(--zd-rule-2); position: relative; cursor: pointer; flex: none; }
.sw > i { position: absolute; left: 1px; top: 1px; width: calc(12px * var(--ui));
          height: calc(12px * var(--ui)); background: var(--zd-ink-3); }
.sw.on { background: var(--zd-slab); }
.sw.on > i { left: auto; right: 1px; background: var(--zd-slab-0); }
.slider { position: relative; width: calc(178px * var(--ui)); height: calc(16px * var(--ui));
          display: flex; align-items: center; cursor: pointer; flex: none; }
.slider .st { position: absolute; left: 0; right: 0; height: calc(8px * var(--ui));
              background: var(--zd-well); border: 1px solid var(--zd-rule-1); }
.slider .sf { position: absolute; left: 1px; top: calc(50% - (4px * var(--ui)) + 1px);
              height: calc(6px * var(--ui)); background: var(--zd-ink-3); }
.slider .sh { position: absolute; top: 0; width: calc(8px * var(--ui)); height: calc(16px * var(--ui));
              background: var(--zd-apron); border: 2px solid var(--zd-rule-2); }
.slider .tick { position: absolute; top: calc(16px * var(--ui)); width: 1px;
                height: calc(3px * var(--ui)); background: var(--zd-rule-1); }
.caret { display: inline-block; width: calc(7px * var(--ui)); height: var(--lh-data);
         background: var(--zd-ink); vertical-align: text-bottom; }
.slab .caret { background: var(--zd-slab-0); }

@keyframes bl { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

.silo { display: flex; flex-wrap: wrap; gap: calc(6px * var(--ui)); }
.silo > span { width: calc(34px * var(--ui)); height: calc(34px * var(--ui));
               border: 1px solid var(--zd-rule-1); display: flex; align-items: center;
               justify-content: center; background: var(--zd-well); color: var(--zd-ink); }

/* ============================================================= overview = */
#overview { position: absolute; inset: 0; background: var(--zd-field); z-index: 60; display: none;
            flex-direction: column; padding: calc(12px * var(--ui)); }
#overview.on { display: flex; }
.ovhead { display: flex; align-items: baseline; gap: calc(12px * var(--ui)); flex: none;
          border-bottom: 2px solid var(--zd-rule-2); padding-bottom: calc(6px * var(--ui)); }
/* the plans are sized from the field's own aspect ratio, so the row is as
   tall as the plans are and no taller. a fixed percentage left a dead band
   between the plans and the register. */
.ovbody { flex: none; display: flex; gap: calc(20px * var(--ui)); align-items: flex-start;
          padding-top: calc(10px * var(--ui)); }
.ovws { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ovlab { display: flex; align-items: baseline; gap: calc(8px * var(--ui)); flex: none;
         padding-bottom: calc(4px * var(--ui)); }
.ovfield { position: relative; background: var(--zd-field);
           border: 1px solid var(--zd-rule-2); overflow: hidden; cursor: pointer; }
.ovfield.cur { border: 2px solid var(--zd-rule-2); }
.ovscale { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.ovscale .win { transition: none; }
.ovpick { position: absolute; cursor: pointer; z-index: 5; }
.ovpick:hover { outline: 2px solid var(--zd-ink); outline-offset: 0; }
.ovreg { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding-top: calc(10px * var(--ui)); }
/* the register keeps ruling to the foot of the sheet whether or not there are
   rows to put on it. that is what a printed register does, and it is why the
   empty half of the index sheet reads as a form rather than as a hole. */
.ovreg .scroll { background: repeating-linear-gradient(to bottom,
                 transparent 0, transparent calc(var(--cell-h) - 1px),
                 var(--zd-rule-1) calc(var(--cell-h) - 1px), var(--zd-rule-1) var(--cell-h)); }

/* ============================================================== palette = */
#palette { position: absolute; inset: 0; z-index: 120; display: none; }
#palette.on { display: block; }
#palette .scrim { position: absolute; inset: 0; }
#palette .sheet { position: absolute; left: 50%; top: calc(48px * var(--ui));
                  transform: translateX(-50%); width: calc(640px * var(--ui));
                  background: var(--zd-apron); border: 2px solid var(--zd-rule-2); padding: 3px;
                  display: flex; flex-direction: column; }
#palette .inner { border: 1px solid var(--zd-rule-2); background: var(--zd-paper);
                  display: flex; flex-direction: column; }
.phead { height: var(--hdr-h); background: var(--zd-slab); display: flex; align-items: center;
         gap: calc(8px * var(--ui)); padding: 0 calc(9px * var(--ui)); flex: none; }
.pin { display: flex; align-items: center; gap: calc(6px * var(--ui)); background: var(--zd-well);
       border-bottom: 1px solid var(--zd-rule-1);
       padding: calc(6px * var(--ui)) calc(10px * var(--ui)); }
.prow { display: flex; align-items: center; height: var(--row-h); padding: 0 calc(10px * var(--ui));
        gap: calc(10px * var(--ui)); border-bottom: 1px solid var(--zd-rule-1); cursor: pointer;
        position: relative; }
.prow.on { background: var(--zd-slab); }
.prow.on .t-label { color: var(--zd-slab-0); }
.prow.on .t-data { color: var(--zd-slab-1); }
.prow .hint { margin-left: auto; color: var(--zd-ink-3); }
.pfoot { display: flex; align-items: center; gap: calc(14px * var(--ui));
         padding: calc(5px * var(--ui)) calc(10px * var(--ui)); border-top: 2px solid var(--zd-rule-2); }

/* ================================================================= lock = */
#lock { position: absolute; inset: 0; z-index: 300; background: var(--zd-field); display: none; }
#lock.on { display: block; }
#locksvg { position: absolute; left: 0; top: 0; pointer-events: none; }
#lock .sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
               width: calc(780px * var(--ui)); background: var(--zd-apron);
               border: 2px solid var(--zd-rule-2); padding: 3px; }
#lock .inner { border: 1px solid var(--zd-rule-2); background: var(--zd-paper); display: flex; }
#lock .lmar { width: calc(232px * var(--ui)); flex: none; background: var(--zd-apron);
              border-right: 1px solid var(--zd-rule-2);
              padding: calc(12px * var(--ui)); display: flex; flex-direction: column; }
#lock .lmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#lock .lhead { height: var(--hdr-h); background: var(--zd-slab); display: flex; align-items: center;
               gap: calc(8px * var(--ui)); padding: 0 calc(12px * var(--ui)); }
#lock .lbody { padding: calc(13px * var(--ui)); display: flex; flex-direction: column; }
#lock .hold { display: flex; align-items: center; gap: calc(8px * var(--ui));
              border-bottom: 1px solid var(--zd-rule-1); height: calc(20px * var(--ui)); }

/* ================================================================= menu = */
.menu { position: absolute; z-index: 200; background: var(--zd-apron);
        border: 2px solid var(--zd-rule-2); padding: 3px;
        min-width: calc(200px * var(--ui)); display: none; }
.menu.on { display: block; }
.menu > .mw { border: 1px solid var(--zd-rule-2); background: var(--zd-paper); }
.menu .mh { background: var(--zd-slab); padding: 0 calc(8px * var(--ui));
            height: calc(20px * var(--ui)); display: flex; align-items: center; gap: 8px; }
.menu .mi { height: var(--row-h); display: flex; align-items: center; gap: calc(10px * var(--ui));
            padding: 0 calc(10px * var(--ui)); border-bottom: 1px solid var(--zd-rule-1);
            cursor: pointer; }
.menu .mi:last-child { border-bottom: 0; }
.menu .mi:hover { background: var(--zd-slab); }
.menu .mi:hover .t-label { color: var(--zd-slab-0); }
.menu .mi:hover .t-data { color: var(--zd-slab-1); }
.menu .mi .hint { margin-left: auto; color: var(--zd-ink-3); }

/* =============================================================== toasts = */
#toasts { position: absolute; right: calc(12px * var(--ui)); bottom: calc(12px * var(--ui));
          z-index: 150; display: flex; flex-direction: column; gap: var(--gap);
          align-items: flex-end; }
.toast { background: var(--zd-apron); border: 2px solid var(--zd-rule-2); padding: 3px;
         width: calc(312px * var(--ui)); }
.toast > .tw { border: 1px solid var(--zd-rule-2); background: var(--zd-paper);
               padding: calc(5px * var(--ui)) calc(9px * var(--ui)) calc(6px * var(--ui)); }
.toast .tl { display: flex; align-items: baseline; }
.toast .tx { display: block; color: var(--zd-ink-2); }
.toast .cl { margin-left: auto; cursor: pointer; color: var(--zd-ink-3); display: flex; }
</style>

<body>

            <span class="t-data k1 grow" id="lockup"></span>

<script>
'use strict';
/* ========================================================================= *
 * NEATLINE. The zlOS desktop as one map sheet.
 *
 *   apron   full perimeter chrome. eastings + sheet title on top, northings
 *           left, tick channel right, THE KEY along the bottom.
 *   key     the launcher, the tasklist AND the definition of every mark on
 *           screen. two state: 24 dp live legend, 96 dp full alphabetical key.
 *   field   ruled on a 100 unit grid, 1 px, every fifth line heavier.
 *   focus   the neatline itself plus four heavy ticks in the margin.
 *
 * The five inks are LEXICAL. They are never text, never state, never mood.
 * ========================================================================= */

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad2 = n => (n < 10 ? '0' : '') + n;
const hx = (n, w) => (n >>> 0).toString(16).toUpperCase().padStart(w || 8, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ------------------------------------------------------ token readback --
 * The key and the settings sheet print the stock's own hex values and its
 * contrast ratios. Typed literals would be a CLAIM: move a token and the
 * sheet keeps printing the old number. These read the live custom property
 * off :root, so what is printed is by construction what is rendered. */
function tokRaw(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function tokResolve(name, depth) {
  const v = tokRaw(name);
  const m = /^var\((--[\w-]+)\)$/.exec(v);
  if (m && (depth || 0) < 8) return tokResolve(m[1], (depth || 0) + 1);
  return v;
}
function tokHex(name) { return tokResolve(name).toUpperCase(); }
function tokRGB(name) {
  const h = tokResolve(name).replace('#', '');
  if (h.length !== 6) return null;
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
function relLum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
function tokRatio(fg, bg) {
  const a = tokRGB(fg), b = tokRGB(bg);
  if (!a || !b) return '--';
  let l1 = relLum(a), l2 = relLum(b);
  if (l1 < l2) { const t = l1; l1 = l2; l2 = t; }
  return ((l1 + 0.05) / (l2 + 0.05)).toFixed(2);
}

/* ---------------------------------------------------------------- state - */
const S = {
  ws: 1,
  theme: 'light',
  scene: 'desktop',
  focus: null,
  pitch: 20,          /* px per fine cell. one fine cell is 20 map units.   */
  ui: 1,
  keyFull: false,     /* 24 dp live legend by default. hold K for the key.  */
  grid: true,
  fifth: true,
  zebra: true,
  ticks: true,        /* the margin focus echo                             */
  bands: true,        /* contour banding on level readouts                 */
  blink: true,
  snap: true,
  fileSel: 1,
  procSel: 2,
  calcAcc: '241690',
  setTab: 0,
  pq: '',
  psel: 0,
  t: 0,
  clock: 14 * 3600 + 32 * 60 + 7,
  hist: { cpu: [], net: [], mem: [] },
  cpu: [34, 21, 47, 12],
  memPct: 62,
  load: 0.31,
  rx: 148.2,
  tx: 22.7,
  wins: {}
};
for (let i = 0; i < 72; i++) {
  S.hist.cpu.push(18 + ((i * 37) % 46));
  S.hist.net.push(6 + ((i * 53) % 58));
  S.hist.mem.push(56 + ((i * 17) % 12));
}

/* ---------------------------------------------------------------- grid --
 * The sheet is measured in MAP UNITS. One fine cell is 20 units; every fifth
 * line, 100 units, is heavier. Northings run UP from the bottom edge, which
 * is the map convention and the opposite of a screen's y axis.
 * A grid reference is two letters and four digits, which is exactly six
 * mono cells wide, which is why the window header can carry one. */
const LET = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const UNITS_PER_CELL = 20;
const BLOCK = 400;                 /* units per lettered block */
function upx() { return UNITS_PER_CELL / S.pitch; }        /* units per px */
function eastOf(xpx) { return Math.round(xpx * upx()); }
function northOf(ypx, hpx) { return Math.round((hpx - ypx) * upx()); }
function refOf(xpx, ypx, hpx) {
  const e = Math.max(0, eastOf(xpx)), n = Math.max(0, northOf(ypx, hpx));
  const l1 = LET[Math.floor(e / BLOCK) % LET.length];
  const l2 = LET[Math.floor(n / BLOCK) % LET.length];
  return l1 + l2 + pad2(Math.floor((e % BLOCK) / 4)) + pad2(Math.floor((n % BLOCK) / 4));
}

/* --------------------------------------------------------------- icons --
 * Stencils on a 96 x 96 field, 8 x 8 modules of 12, every vertex on a
 * multiple of 2. One stroke weight, 8 at 96.
 *
 * THE OPEN ITEM THIS DIRECTION SHIPPED WITH, RESOLVED HERE. Because colour
 * is doing referent work it cannot also do identity work, so a key symbol
 * has to be told apart by SILHOUETTE ALONE. So every stencil declares its
 * outer boundary explicitly as `s`, the drawn icon strokes exactly that
 * boundary, and Settings renders all sixteen as flat ink silhouettes at
 * 24 dp so the claim can be checked rather than asserted. No two share an
 * outer shape: notched rect, folder, circle, chamfered portrait, comb,
 * hexagon, tee, triangle, stemmed circle, legged square, three bars, a
 * parallelogram, a stepped ell, four squares, an ay, a cross. */
const ICON = {
  shell: { s: 'M6 18 H90 V78 H36 L6 48 Z',
           d: 'M26 36 L40 48 L26 60 M52 62 H74' },
  files: { s: 'M6 16 H34 L44 30 H90 V80 H6 Z',
           d: 'M6 30 H90 M20 46 H60' },
  mon:   { s: 'M48 12 A36 36 0 0 1 48 84 A36 36 0 0 1 48 12 Z',
           d: 'M48 48 L70 30 M48 48 H14' },
  edit:  { s: 'M20 8 H66 L80 22 V88 H20 Z',
           d: 'M32 34 H64 M32 50 H64 M32 66 H52' },
  log:   { s: 'M30 12 H88 V84 H30 V74 H6 V62 H30 V54 H6 V42 H30 V34 H6 V22 H30 Z',
           d: 'M42 30 H76 M42 48 H76 M42 66 H62' },
  hex:   { s: 'M30 12 H66 L84 48 L66 84 H30 L12 48 Z',
           d: 'M48 12 V84 M20 32 H76 M20 64 H76' },
  calc:  { s: 'M10 10 H86 V34 H60 V86 H36 V34 H10 Z',
           d: 'M20 20 H76 M44 46 H52 M44 62 H52 M44 78 H52' },
  net:   { s: 'M48 12 L88 84 H8 Z',
           d: 'M28 66 H68 M48 40 V52' },
  clock: { s: 'M38 4 H58 V26 H38 Z M52 22 A32 32 0 0 1 52 86 A32 32 0 0 1 52 22 Z',
           d: 'M52 54 V34 M52 54 H74' },
  chip:  { s: 'M48 4 L92 48 L48 92 L4 48 Z',
           d: 'M48 26 L70 48 L48 70 L26 48 Z' },
  set:   { s: 'M8 6 H90 V26 H8 Z M8 40 H62 V60 H8 Z M8 74 H34 V94 H8 Z',

function TH(cols) {

function TR(cells, attr) {

}
function TBL(head, rows) {

function statword(w) {

/* CONTOUR. A level is banded, never a solid bar: four hard steps, the way a
   contour map draws height. The band edges are at 25 / 50 / 75 per cent. */
function contourMeter(label, val, unit, note) {
  const v = clamp(val, 0, 100);
  let inner = '';
  if (S.bands) {
    const edges = [25, 50, 75, 100];
    let prev = 0;
    edges.forEach((e, i) => {
      const seg = clamp(v, prev, e) - prev;
      if (seg > 0) {
        inner += '<i class="cb' + (i + 1) + '" style="width:' + seg + '%"></i>';
        if (v > e) inner += '<u></u>';
      }
      prev = e;
    });
  } else {
    inner = '<i class="cb4" style="width:' + v + '%"></i>';
  }
  return '<div class="cmeter"><div class="crow"><span class="t-label">' + label + '</span>' +
    (note ? '<span class="t-data i3" style="margin-left:8px">' + note + '</span>' : '') +
    '<span class="t-data">' + val + (unit || '') + '</span></div>' +
    '<div class="ctrack">' + inner + '</div></div>';
}
/* a column plot. the SERIES ink is passed in and is always a lexical ink. */
function plotFlex(series, max, inkVar, minH) {
  const n = series.length, bw = 100 / n;
  let bars = '';
  series.forEach((v, i) => {
    const h = Math.max(1, (v / max) * 100);
    bars += '<rect x="' + (i * bw).toFixed(2) + '" y="' + (100 - h).toFixed(2) +
      '" width="' + (bw * 0.7).toFixed(2) + '" height="' + h.toFixed(2) + '"/>';
  });
  const mean = series.reduce((a, b) => a + b, 0) / n;
  return '<div class="plotbox"' + (minH ? ' style="min-height:' + minH + 'px"' : '') + '>' +
    '<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" ' +
    'fill="var(' + inkVar + ')" aria-hidden="true">' + bars + '</svg>' +
    '<span class="meanline" style="top:' + (100 - (mean / max) * 100).toFixed(2) + '%"></span></div>';
}

  return out;
};

/* 02 FILES. WOOD is user data, so the size column carries a wood bar. */

/* 06 HEX VIEWER */
R.hex = () => {
  const base = 0x0011A4C0;
  const seed = [0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, 0x01, 0x00,
                0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00];
  const rows = [];
  for (let r = 0; r < 20; r++) {
    let cells = '', txt = '';
    for (let i = 0; i < 16; i++) {
      const b = r === 0 ? seed[i] : ((base + r * 16 + i) * 37 + r * 13) & 0xff;
      cells += hx(b, 2) + (i === 7 ? '  ' : ' ');
      txt += (b >= 32 && b < 127) ? String.fromCharCode(b).replace(/</g, '&lt;').replace(/&(?!lt;)/g, '&amp;') : '.';
    }
    rows.push(TR([{ t: hx(base + r * 16, 8), c: 'i3' }, cells.trim(), { t: txt, c: '' }]));
  }
  return '<div class="row" style="padding-bottom:6px">' +
    '<span class="t-label i0">rd0 offset 0x0011A4C0</span>' +
    '<span class="t-data i3">' + bar('wood') + 'zlfs extent 24 &middot; 4096 B &middot; crc 0x9C41A2E7</span>' +
    '<span class="t-data i3 grow">320 of 4096 shown</span></div><div class="hr2"></div>' +
    '<div class="scroll' + (S.zebra ? ' zeb' : '') + '">' +
    TBL([{ h: 'offset', w: '14%' }, { h: '00 01 02 03 04 05 06 07  08 09 0a 0b 0c 0d 0e 0f', w: '62%' },
         { h: 'ascii', w: '24%' }], rows) + '</div>' +
    '<div class="hr1"></div>' +
    '<div class="row" style="height:var(--row-h)"><span class="t-label">magic</span>' +
    '<span class="t-data i0">7f 45 4c 46</span><span class="t-data i3">ELF64 little endian</span>' +
    '<span class="grow"></span>' + statword('OK') + '</div>';
};

/* 07 CALCULATOR. no lexical ink at all: nothing here is a referent. */
R.calc = () => {
  const keys = [
    ['7', '7'], ['8', '8'], ['9', '9'], ['div', '/ 2'],
    ['4', '4'], ['5', '5'], ['6', '6'], ['mul', 'x 2'],
    ['1', '1'], ['2', '2'], ['3', '3'], ['sub', '- 1'],
    ['0', '0'], ['clr', 'clr'], ['eq', '='], ['add', '+ 1']
  ];
  const n = parseInt(S.calcAcc, 10) || 0;
  let grid = '<div style="display:grid;grid-template-columns:repeat(4,1fr);' +
    'border-left:1px solid var(--zd-rule-1);border-top:1px solid var(--zd-rule-1);flex:none">';
  keys.forEach(k => {
    grid += '<span data-act="calc" data-arg="' + k[0] + '" style="height:calc(30px * var(--ui));' +
      'display:flex;align-items:center;justify-content:center;cursor:pointer;' +
      'border-right:1px solid var(--zd-rule-1);border-bottom:1px solid var(--zd-rule-1)">' +
      '<span class="t-label">' + k[1] + '</span></span>';
  });
  grid += '</div>';
  return '<div class="row" style="padding-bottom:6px"><span class="t-label i0">int64</span>' +
    '<span class="t-data i3">no floating point anywhere in this build</span></div>' +
    '<div class="hr2"></div>' +
    '<div class="well" style="margin:8px 0;text-align:right">' +
    '<span class="t-data i0 b" style="font-size:var(--fs-title);line-height:var(--lh-title)">' +
    S.calcAcc + '</span></div>' + grid +
    '<div class="kvgrid" style="margin-top:10px">' +
    kv('hex', '0x' + hx(n, 8)) + kv('octal', '0o' + (n >>> 0).toString(8)) +
    kv('binary', (n >>> 0).toString(2).padStart(24, '0').slice(-24)) +
    kv('popcount', String((n >>> 0).toString(2).split('1').length - 1)) +
    kv('as kHz', (n / 1000).toFixed(3) + ' MHz') +
    kv('at 24 bpp', (n / 1000 / 1600 / 1000 * 1000).toFixed(3) + ' Hz est') +
    '</div>' +
    '<div class="row" style="margin-top:8px"><span class="t-data i3">' +
    '241690 is the measured pipe A pixel clock in kHz</span></div>';
};

/* 08 NETWORK. WATER for every stream, ROAD for the routing table, which is

/* 09 CLOCKS */
function hhmmss(s) {
  s = ((s % 86400) + 86400) % 86400;
  return pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
}
R.clock = () => {
  const t = S.clock;
  const zones = [['local', 0, 'Europe/London', 'BST'], ['utc', -3600, 'Etc/UTC', 'Z'],
                 ['pacific', -28800, 'America/Los_Angeles', 'PDT'],
                 ['tokyo', 28800, 'Asia/Tokyo', 'JST'], ['boot', 0, 'monotonic', 'CLOCK']];
  const rows = zones.map(z => TR([z[0], { t: hhmmss(z[1] === 0 && z[0] === 'boot' ? 4211 + S.t : t + z[1]), c: 'r b' },
    { t: z[2], c: 'i3' }, { t: z[3], c: 'r i3' }]));
  const sec = t % 60, min = Math.floor(t / 60) % 60, hr = Math.floor(t / 3600) % 12;
  const ang = (deg, len) => {
    const r = (deg - 90) * Math.PI / 180;
    return [48 + Math.cos(r) * len, 48 + Math.sin(r) * len];
  };
  const hp = ang(hr * 30 + min * 0.5, 21), mp = ang(min * 6, 32), sp = ang(sec * 6, 35);
  let ticks = '';
  for (let i = 0; i < 12; i++) {
    const a = ang(i * 30, 40), b = ang(i * 30, i % 3 === 0 ? 32 : 36);
    ticks += '<path d="M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' L' + b[0].toFixed(1) +
      ' ' + b[1].toFixed(1) + '" stroke="var(--zd-ink-3)" stroke-width="' + (i % 3 === 0 ? 3 : 1.5) + '"/>';
  }
  const dial = '<svg width="132" height="132" viewBox="0 0 96 96" fill="none" aria-hidden="true">' +
    '<rect x="2" y="2" width="92" height="92" fill="none" stroke="var(--zd-rule-1)" stroke-width="1"/>' +
    '<circle cx="48" cy="48" r="42" stroke="var(--zd-ink)" stroke-width="2"/>' + ticks +
    '<path d="M48 48 L' + hp[0].toFixed(1) + ' ' + hp[1].toFixed(1) + '" stroke="var(--zd-ink)" stroke-width="5"/>' +
    '<path d="M48 48 L' + mp[0].toFixed(1) + ' ' + mp[1].toFixed(1) + '" stroke="var(--zd-ink)" stroke-width="3"/>' +
    '<path d="M48 48 L' + sp[0].toFixed(1) + ' ' + sp[1].toFixed(1) + '" stroke="var(--zd-ink-3)" stroke-width="1.5"/>' +
    '</svg>';
  const timers = [['build watch', '00:04:12', 'RUN'], ['soak test', '02:41:55', 'RUN'],
                  ['panel T12 guard', '00:00:00', 'IDLE'], ['ntp poll', '00:11:03', 'RUN']]
    .map(x => TR([x[0], { t: x[1], c: 'r' }, { t: statword(x[2]), c: 'r' }]));
  return '<div class="row" style="padding-bottom:6px"><span class="t-label i0">clocks</span>' +
    '<span class="t-data i3">tsc invariant &middot; hpet 24 MHz &middot; drift +0.4 ppm</span></div>' +
    '<div class="hr2"></div>' +
    '<div class="cols2" style="padding-top:10px;flex:none">' +
    '<div style="display:flex;align-items:center;justify-content:center">' + dial + '</div>' +
    '<div class="stack">' +
    '<span class="t-label">local</span>' +
    '<span class="t-data i0 b" style="font-size:var(--fs-title);line-height:var(--lh-title)">' +
      hhmmss(t) + '</span>' +
    '<span class="t-data i3">friday 12 september &middot; week 37 &middot; day 255</span>' +
    '<div class="hr1" style="margin:8px 0"></div>' +
    kv('uptime', hhmmss(4211 + S.t)) + kv('boot', '13:21:56') +
    kv('tsc', (2903000000 + S.t * 2903000).toLocaleString('en-GB')) +
    kv('pit', '1193182 / 1000') +
    '</div></div>' +
    '<div class="row" style="padding:10px 0 4px"><span class="t-label">zones</span></div>' +
    '<div class="' + (S.zebra ? 'zeb' : '') + '" style="flex:none">' +
    TBL([{ h: 'name', w: '28%' }, { h: 'time', w: '26%', r: 1 }, { h: 'zone', w: '32%' },
         { h: 'abbr', w: '14%', r: 1 }], rows) + '</div>' +
    '<div class="row" style="padding:10px 0 4px"><span class="t-label">timers</span></div>' +
    '<div class="scroll' + (S.zebra ? ' zeb' : '') + '">' +
    TBL([{ h: 'timer', w: '48%' }, { h: 'elapsed', w: '30%', r: 1 },
         { h: 'state', w: '22%', r: 1 }], timers) + '</div>';
};

/* 11 SETTINGS. every control here changes something you can see on the sheet

const UI_STEPS = [0.9, 1.0, 1.1, 1.25];

function sliderHTML(name, steps, val, fmt) {
  const i = steps.indexOf(val);
  const pct = steps.length === 1 ? 0 : i / (steps.length - 1);
  const ticks = steps.map((s, k) => '<span class="tick" style="left:' +
    (steps.length === 1 ? 0 : (k / (steps.length - 1)) * 100).toFixed(2) + '%"></span>').join('');
  return '<span class="slider" data-slider="' + name + '"><span class="st"></span>' +
    '<span class="sf" style="width:calc(' + (pct * 100).toFixed(2) + '% - 2px)"></span>' +
    '<span class="sh" style="left:calc(' + (pct * 100).toFixed(2) + '% - ' +
    (pct * 8).toFixed(2) + 'px)"></span>' + ticks + '</span>' +
    '<span class="t-data i0 b" style="width:calc(58px * var(--ui));text-align:right">' +
    fmt(val) + '</span>';
}

/* ================================================================== grid */
let GRID = { W: 0, H: 0, nx: 0, ny: 0 };
function computeGrid() {
  const f = $('#field');
  GRID.W = f.clientWidth; GRID.H = f.clientHeight;
  GRID.nx = Math.max(1, Math.floor(GRID.W / S.pitch));
  GRID.ny = Math.max(1, Math.floor(GRID.H / S.pitch));
}
function drawGrid() {
  const svg = $('#gridsvg'), g = GRID;
  svg.setAttribute('width', g.W); svg.setAttribute('height', g.H);
  if (!S.grid) { svg.innerHTML = ''; return; }
  let s = '';

    const heavy = S.fifth && i % 5 === 0;
    s += '<rect x="' + (i * S.pitch) + '" y="0" width="1" height="' + g.H +
      '" fill="var(' + (heavy ? '--zd-grid-5' : '--zd-grid') + ')"/>';

      '" height="1" fill="var(' + (heavy ? '--zd-grid-5' : '--zd-grid') + ')"/>';

/* ================================================================= apron
 * Eastings on the top edge, northings on the left, the tick channel on the
 * right, and four heavy ticks that track the focused sheet. The ticks are
 * the glance signal: they jump in peripheral vision when focus changes, so
 * the cue does not require reading the sheet you are not looking at. */
function drawApron() {
  const g = GRID, ap = 24 * S.ui, neat = 6 * S.ui;
  const ox = ap + neat;                    /* field origin inside #os        */
  const oy = ap + neat;
  const os = $('#os');
  const W = os.clientWidth, H = os.clientHeight;
  const f = S.focus && S.wins[S.focus] && !S.wins[S.focus].min ? S.wins[S.focus] : null;
  const fr = f ? winRect(f) : null;

  /* --- top: eastings ------------------------------------------------- */
  const top = $('#svg-top');
  top.setAttribute('width', W); top.setAttribute('height', ap);
  let s = '';
  for (let i = 0; i <= g.nx; i++) {
    const x = ox + i * S.pitch;
    if (x > W - ap) break;
    const heavy = i % 5 === 0;
    s += '<rect x="' + x + '" y="' + (ap - (heavy ? 7 : 3)) + '" width="1" height="' +
      (heavy ? 7 : 3) + '" fill="var(--zd-' + (heavy ? 'ink-3' : 'grid') + ')"/>';
    if (heavy && i > 0) {
      const e = eastOf(i * S.pitch);
      const blockEdge = (e % BLOCK) === 0;
      s += '<text x="' + (x + 3) + '" y="' + (ap - 10) + '" font-family="ui-monospace, ' +
        "'DejaVu Sans Mono', monospace" + '" font-size="' + (10 * S.ui) + '" ' +
        'fill="var(--zd-ink-' + (blockEdge ? '2' : '3') + ')"' +
        (blockEdge ? ' font-weight="700"' : '') + '>' +

    }
  }

  /* THE MARGIN ECHO. four heavy ticks track the focused sheet's four edges,
     the way a drafting machine's coordinate readout does. this is the glance
     signal: the ticks jump in peripheral vision when focus changes, so the
     cue never requires reading the sheet you are not looking at. they are

     the printed numbers rather than hiding behind them. */

        "'DejaVu Sans Mono', monospace" + '" font-size="' + (10 * S.ui) + '" ' +
        'fill="var(--zd-ink-' + (blockEdge ? '2' : '3') + ')"' +
        (blockEdge ? ' font-weight="700"' : '') + '>' +
        (blockEdge ? LET[Math.floor(n / BLOCK) % LET.length]

  leftF.innerHTML = (S.ticks && fr) ? [fr.y, fr.y + fr.h].map(py =>
    '<rect x="0" y="' + (neat + py - 3) + '" width="' + ap + '" height="6" ' +
    'fill="var(--zd-ink)"/>').join('') : '';

      'fill="var(--zd-' + (heavy ? 'ink-3' : 'grid') + ')"/>';

  if (S.ticks && fr) {

      '" fill="var(--zd-ink-3)"/>';
  }

  $('#sheetseries').textContent = 'series ZL-1  ·  1:1  ·  ' + g.nx + ' x ' + g.ny +
    ' cells  ·  ' + UNITS_PER_CELL + ' u';
  $('#sheetclock').textContent = (f ? APP[f.id].name.toUpperCase() + '  ' + f.ref + '  ·  ' : '') +
    'ws ' + pad2(S.ws) + '  ·  load ' + S.load.toFixed(2) + '  ·  ' + hhmmss(S.clock);

/* ========================================================== window mgmt */
let ZTOP = 10;
/* A sheet remembers the MODULE it was authored at, not the pixel size it
   happened to get. Re-deriving the cell box from that spec on every layout is
   what keeps a sheet filling its share of the field when the pitch, the ui
   scale, the key height or the window changes; storing pixels instead is the
   reflow bug PLATE shipped with. */
function specToCells(w) {
  const g = GRID, p = w.spec;
  w.cw = clamp(Math.round(p[2] / 12 * g.nx), 4, g.nx);
  w.ch = clamp(Math.round(p[3] / 8 * g.ny), 3, g.ny);
  w.cx = clamp(Math.round(p[0] / 12 * g.nx), 0, Math.max(0, g.nx - w.cw));
  w.cy = clamp(Math.round(p[1] / 8 * g.ny), 0, Math.max(0, g.ny - w.ch));
  /* a sheet authored flush to an edge stays flush to that edge */
  if (p[0] + p[2] >= 12) w.cx = g.nx - w.cw;
  if (p[1] + p[3] >= 8) w.cy = g.ny - w.ch;
}
function winRect(w) {
  if (w.free) return { x: w.px, y: w.py, w: w.pw, h: w.ph };
  return { x: w.cx * S.pitch, y: w.cy * S.pitch, w: w.cw * S.pitch, h: w.ch * S.pitch };
}
function openWin(id, place, ws) {
  const a = APP[id];

  if (S.wins[id]) { S.wins[id].min = false; focusWin(id); return; }
  const p = place || a.p;
  const g = GRID;
  const w = {
    id: id, ws: ws || S.ws, min: false, max: false, free: false, moved: false,
    spec: [p[0], p[1], p[2], p[3]], prev: null, z: ++ZTOP,
    cx: clamp(Math.round(p[0] / 12 * g.nx), 0, g.nx - 4),
    cy: clamp(Math.round(p[1] / 8 * g.ny), 0, g.ny - 3),
    cw: clamp(Math.round(p[2] / 12 * g.nx), 4, g.nx),
    ch: clamp(Math.round(p[3] / 8 * g.ny), 3, g.ny),
    px: 0, py: 0, pw: 0, ph: 0, ref: '------'
  };
  if (w.cx + w.cw > g.nx) w.cx = Math.max(0, g.nx - w.cw);
  if (w.cy + w.ch > g.ny) w.cy = Math.max(0, g.ny - w.ch);

function closeWin(id) {

    const rest = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = rest.length ? rest[0].id : null;

}

}

    const rest = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = rest.length ? rest[0].id : null;
  }

function layout() {
  computeGrid();
  drawGrid();
  Object.values(S.wins).forEach(w => {
    const e = $('.win[data-id="' + w.id + '"]');
    if (!e) return;
    const vis = w.ws === S.ws && !w.min;
    e.classList.toggle('hidden', !vis);
    if (!w.free && !w.max && !w.moved) specToCells(w);
    if (!w.free) {
      w.cw = clamp(w.cw, 4, GRID.nx); w.ch = clamp(w.ch, 3, GRID.ny);
      w.cx = clamp(w.cx, 0, Math.max(0, GRID.nx - w.cw));
      w.cy = clamp(w.cy, 0, Math.max(0, GRID.ny - w.ch));
    }
    const rr = winRect(w);
    /* A sheet sitting on the last ruled line runs out to the neatline: the
       field is not always an exact whole number of cells, and a 19 px strip of
       bare grid inside the neatline is a defect, not a margin.
       The far edge is held by CSS (right:0 / bottom:0), not by a pixel width
       JS measured. That matters: the measurement and the paint do not always
       happen at the same viewport, and a JS pixel height freezes whatever the
       field was when layout last ran. Position is JS, extent is CSS. */
    const fillX = !w.free && w.cx + w.cw >= GRID.nx;
    const fillY = !w.free && w.cy + w.ch >= GRID.ny;
    if (fillX) rr.w = GRID.W - rr.x;
    if (fillY) rr.h = GRID.H - rr.y;
    e.style.left = rr.x + 'px'; e.style.top = rr.y + 'px';
    if (fillX) { e.style.right = '0px'; e.style.width = 'auto'; }
    else { e.style.right = 'auto'; e.style.width = rr.w + 'px'; }
    if (fillY) { e.style.bottom = '0px'; e.style.height = 'auto'; }
    else { e.style.bottom = 'auto'; e.style.height = rr.h + 'px'; }
    e.style.zIndex = String(w.z);
    /* the grid reference is taken at the SOUTH WEST corner, which is where a
       map reference is always taken. two letters, four digits, six cells. */
    w.ref = refOf(rr.x, rr.y + rr.h, GRID.ny * S.pitch);
    $('.ref', e).textContent = w.ref;
    e.classList.toggle('foc', w.id === S.focus);
  });
  drawApron();
  renderKey();
}

/* ================================================================= tick */
function walk(v, lo, hi, amp) { return clamp(v + (Math.random() - 0.5) * amp, lo, hi); }
function tick() {
  S.t += 1; S.clock += 1;
  S.cpu = S.cpu.map(v => Math.round(walk(v, 2, 99, 22)));
  S.memPct = Math.round(walk(S.memPct, 40, 92, 3));
  S.load = Math.round(walk(S.load, 0.05, 3.2, 0.22) * 100) / 100;
  S.rx = Math.round(walk(S.rx, 0, 420, 90) * 10) / 10;
  S.tx = Math.round(walk(S.tx, 0, 180, 30) * 10) / 10;
  S.hist.cpu.push(Math.round(S.cpu.reduce((a, b) => a + b, 0) / 4)); S.hist.cpu.shift();
  S.hist.net.push(Math.min(88, Math.round(S.rx / 4.6))); S.hist.net.shift();
  ['mon', 'net', 'clock', 'proc'].forEach(id => { if (S.wins[id] && !S.wins[id].min) redraw(id); });
  /* belt and braces for the case where neither resize nor ResizeObserver has
     fired: if the field has changed size under us, re-rule the sheet. */
  const f = $('#field');
  if (f.clientWidth !== GRID.W || f.clientHeight !== GRID.H) { relayout(); return; }
  drawApron();
  if ($('#lock').classList.contains('on')) renderLock();
}

/* ============================================================== events  */
document.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (!t.closest('.menu')) hideMenus();

  if ($('#lock').classList.contains('on')) {
    if (t.closest('#lock')) { setScene('desktop'); toast('session', 'unlocked, sheets restored'); }
    return;
  }
  if ($('#palette').classList.contains('on')) {
    const pr = t.closest('.prow');
    if (pr && pr.getAttribute('data-pi') !== null) { S.psel = Number(pr.getAttribute('data-pi')); runPalette(); return; }
    if (!t.closest('.sheet')) showPalette(false);
    return;
  }
  if (overviewOn()) {
    const pick = t.closest('[data-ovpick]');
    if (pick) {
      S.ws = Number(pick.getAttribute('data-ovws'));
      showOverview(false);
      focusWin(pick.getAttribute('data-ovpick'));
      return;
    }
    const fld = t.closest('.ovfield');
    if (fld) { S.ws = Number(fld.getAttribute('data-ovws')); showOverview(false); layout(); return; }
    if (!t.closest('.ovhead')) showOverview(false);
    return;
  }

  /* the key IS the launcher */
  const kr = t.closest('[data-keyapp]');
  if (kr) {
    const id = kr.getAttribute('data-keyapp');
    const w = S.wins[id];
    if (!w) openWin(id);
    else if (w.min || w.ws !== S.ws) { w.ws = S.ws; w.min = false; focusWin(id); }
    else if (S.focus === id) minWin(id);
    else focusWin(id);
    return;
  }
  if (t.closest('[data-keytog]')) { setKeyFull(!S.keyFull); return; }
  const nq = t.closest('[data-nq]');
  if (nq) {
    S.ws = Number(nq.getAttribute('data-nq'));
    const top = Object.values(S.wins).filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
    S.focus = top.length ? top[0].id : null;
    layout();
    toast('workspace', 'quadrant ' + pad2(S.ws) + ', ' + top.length + ' sheets placed');
    return;
  }

  const win = t.closest('.win');
  if (win) {
    const id = win.getAttribute('data-id');
    const actEl = t.closest('[data-act]');
    const act = actEl ? actEl.getAttribute('data-act') : null;
    if (act === 'close') { closeWin(id); return; }
    if (act === 'min') { minWin(id); return; }
    if (act === 'max') { maxWin(id); return; }
    if (act === 'winmenu') {
      focusWin(id);
      const r = win.getBoundingClientRect(), os = $('#os').getBoundingClientRect();
      showMenu($('#winmenu'), r.left - os.left, r.top - os.top + 28, [
        ['raise to front', 'click'],
        ['minimise', 'ctrl m'],
        [S.wins[id].max ? 'restore' : 'fill the sheet', 'ctrl f'],
        [S.wins[id].free ? 'return to the grid' : 'take off the grid', 'ctrl d'],
        ['send to ws ' + pad2(S.ws === 1 ? 2 : 1), 'shift ' + (S.ws === 1 ? '2' : '1')],
        ['read grid reference', 'ref'],
        ['close sheet', 'ctrl w']
      ], APP[id].name + '  ' + S.wins[id].ref);
      $('#winmenu')._win = id;
      return;
    }
    if (S.focus !== id) focusWin(id);
    handleWinAction(id, t);
    const hdr = t.closest('.hdr');
    if (hdr && !t.closest('.ctls') && !t.closest('.ico')) startDrag(ev, id, win);
    return;
  }
});
