<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STOCK / zlOS living prototype</title>
<style>
/* ======================================================================
   STOCK - design.h
   ----------------------------------------------------------------------
   RESOLUTION 2. KEEP THE LADDER, REPLACE THE KNOCKOUT.

   GRAPHITE is the base and the structure. PAPER is the character and the
   detail. The one place they cannot both win is the focused window, and
   this file resolves it in graphite's favour by changing what KIND of
   event a focus signal is.

   THE CONFLICT, restated from the numbers rather than from the prose.
   Graphite's four surface steps are 1.073 / 1.126 / 1.089 / 1.077 : 1.
   Its loudest achromatic element is ZD_LIT on ZD_BASE at 1.993:1. PLATE's
   knockout header computes 11.923:1 on the same ground, and two things
   break, both reproduced live in the settings pane:

     1  THE LIGHT INVERTS SIGN. On a knocked out header ZD_LIT - which IS
        the struck top edge, the light itself - computes 5.982:1 as the
        DARKER term, and ZD_CUT computes 15.879:1. The raised edge reads
        as a groove and the groove becomes the loudest line on screen.
     2  Steps already below perceptual threshold stop being read at all
        beside a full inversion.

   THE RESOLUTION, in one sentence:

     THE KNOCKOUT IS A LUMINANCE EVENT ON A LUMINANCE LADDER.
     THE OVERPRINT IS A CHROMA EVENT ON A LUMINANCE LADDER.

   A knockout moves 75.75 dL* and 0.48 dC* against ZD_BASE. STOCK's ink
   moves 45.20 dL* and 68.77 dC*. The ladder is built entirely in dL*: its
   whole separation budget between ZD_BASE and ZD_LIT is 19.79 dL* and its
   adjacent steps are 2.8 dL*. So the knockout spends its entire signal in
   the one currency the ladder is denominated in, and it spends it over
   12.17 % of the window. The ink spends most of its signal in a currency
   the ladder does not use at all, and it spends it over 1.31 %.

   The ink is therefore ALLOWED TO BE LOUD without being allowed to be a
   surface. That is the whole design:

     STEEL IS THE LIGHT.   It is what the raking source becomes when it is
                           strong enough to name: selection, meter fill,
                           the wash, the caret. Low chroma, C* 28.8. It is
                           a property of the MATERIAL.
     VERMILION IS THE INK. C* 73.2. It is laid ON the material and never
                           becomes it. Focus overprint, register mark,
                           crop marks, one primary action per view, the
                           run mark on the rail. It never carries text; it
                           is a fill or a mark, and text is reversed out
                           of it.

   THE ONE RULE THAT MAKES IT SAFE:
     THE INK MAY COVER SHADOW. THE INK MAY NEVER COVER LIGHT.
   The fore edge bleed is printed over the 1px ZD_CUT groove on the right
   edge. Nothing in this document ever prints over ZD_LIT or ZD_LITSOFT.
   So ZD_LIT on ZD_BASE reads 1.993:1 on every plate, focused or not, and
   the light cannot invert because it is never underneath anything.

   WHAT ELSE CAME ACROSS FROM PAPER, and what each one cost:
     the numbered REGISTER rail   free. text and two digits. rail 144dp.
     LABEL type, tracked          NOT FREE. needs UI_F_TRACK on the flag
                                  word of fb_text_role, and measure and
                                  draw must share the helper. There is a
                                  switch for it in settings and the whole
                                  page reflows without it.
     the ruled module grid        re-drawn as a SCORED EMBOSS, 1px ZD_CUT
                                  over 1px ZD_BASE, 1.183:1 and 1.126:1 on
                                  the field. A printed rule would have been
                                  a value event on the ground; a score is
                                  the light finding an edge that is already
                                  there. No new token.
     hard rules                   imported as INTERNAL structure only. The
                                  plate silhouette stays soft: radius 10.
                                  PLATE's 2px ink frame does not come.
     the printer's slug           24dp of the foot, sharing the band with
                                  the memory ruler.
     Datum's instrumentation      free rider, taken whole: per window us,
                                  the raster strip re-clocked to composite,
                                  the memory map ruler.
     motion CUT on focus          taken from PLATE outright. The ink lands
                                  at 0 ms. Graphite put the focus change on
                                  SETTLE 240, so its weakest signal was
                                  also its slowest. A press is instant.

   DARK IS PRIMARY AND IT IS :root. The light ladder is DERIVED and lives
   in :root[data-theme="light"] with identical token names. A token that
   exists in one mode only is a defect; the settings pane checks for it at
   run time and there are none.
   ====================================================================== */

:root {
  /* ----------------------------------------------- surfaces, graphite
     TAKEN FROM THE GRAPHITE BLEND UNCHANGED, to the byte. That is the
     point of resolution 2: the ladder is not up for negotiation, so it
     is not edited. Six rungs inside 17 L* points, every adjacent step
     below perceptual threshold. */
  --zd-cut:        #19120E;
  --zd-well:       #231C18;
  --zd-void:       #29221E;
  --zd-base:       #322B27;
  --zd-raise:      #38312D;
  --zd-float:      #3D3632;
  --zd-litsoft:    #4A433F;
  --zd-lit:        #5F5854;

  /* ZD_EDGE_OVER. Graphite's one invented token, kept and kept for the
     same reason: on a dark ground the largest ratio ANY darker colour can
     reach against ZD_BASE is 1.510:1, and that is pure black. The
     downward direction is arithmetically shut, so the occluding edge is
     the LIGHT. 3.674:1 on BASE, 3.136:1 on FLOAT, 4.136:1 on VOID. */
  --zd-edge-over:  #8A8279;

  /* ZD_WASH. RENAMED FROM GRAPHITE'S ZD_FOCUS_WASH, and the rename is the
     change. In graphite the wash appeared only on the focused plate. Here
     it is on EVERY plate, always: it is the raking light entering a title
     band, and the light does not know which window you are looking at.
     1.400:1 on ZD_BASE, above every surface step and below the struck
     edge. Because it no longer moves on focus, the focus signal is now
     100 % ink and 0 % ladder. */
  --zd-wash:       #404348;

  /* --------------------------------------------------------------- ink
     ZD_INK. THE ONE SATURATED COLOUR IN THE SYSTEM. C* 73.24 in CIE LCh,
     against a loudest surface chroma of C* 4.47. It is an OVERPRINT: it
     is laid on the material and never becomes the material.
       4.899:1 on BASE   5.514:1 on VOID   4.175:1 on FLOAT
       3.500:1 on WASH   5.916:1 on WELL   6.524:1 on CUT
     Every surface clears 3:1, so the rule needs no per case table.
     It never carries text IN THE INTERFACE. Text is REVERSED OUT of it
     at 6.49:1. The one exception is the ladder readout in #settings,
     where a row names the ink and quotes its own number; that type is
     ink coloured on purpose and clears 4.5:1 on every surface it uses. */
  --zd-ink:        #FF6A45;
  --zd-ink-br:     #FF9B80;

  /* ZD_STEEL. THE LIGHT, NOT A BRAND COLOUR. C* 28.8, hue 260. Kept from
     graphite unchanged, and its job is narrowed: it is now only ever the
     material catching light. Selection, meter fill, sparkline, caret,
     workspace on state. It is never a mark and never a focus signal. */
  --zd-steel:      #7FB2E0;
  --zd-steel-br:   #A9CFF2;

  /* --------------------------------------------------------------- ink */
  --zd-text-0:     #F2EDE4;
  --zd-text-1:     #DAD3C7;
  --zd-text-2:     #BDB5A7;
  --zd-text-3:     #AAA194;
  --zd-text-inert: #6A635A;

  /* ZD_REVERSE. Text knocked out of a filled mark, ink or steel alike.
     6.49:1 on ZD_INK, 8.24:1 on ZD_STEEL. One token, two fills. */
  --zd-reverse:    #181310;

  --zd-ok:         #7FBF63;
  --zd-warn:       #E3A63F;
  --zd-bad:        #E8664B;
  --zd-bad-ink:    #E58972;

  /* ------------------------------------------------------------ metrics
     Spacing is on 4 / 8 / 12 / 16 / 24 without exception. Two other
     axes are separate and are named rather than smuggled in: RULE WEIGHT
     takes 1px or 2px only, because a rule is not a gap, it is the thing
     between two gaps; and ZD_HAIR below is row rhythm rather than
     spacing. That distinction is PLATE's, and it is why PLATE can have a
     2px rule on a 4dp scale. */
  --ui: 1;
  /* 144dp = 6 x 24. Graphite's register rail was 132dp untracked. Tracking
     LABEL type costs 12dp of rail width and it is paid here rather than
     hidden, because a clipped label is a functional bug and not a
     blemish - uikit.c documents that measure and draw must share the
     helper or exactly that happens. */
  --zd-rail-w:   calc(144px * var(--ui));
  --zd-strip-h:  calc(24px  * var(--ui));
  --zd-slug-h:   calc(24px  * var(--ui));
  --zd-ruler-h:  calc(24px  * var(--ui));
  --zd-title-h:  calc(28px  * var(--ui));
  --zd-band-h:   calc(20px  * var(--ui));
  --zd-pad:      calc(12px  * var(--ui));
  --zd-gap:      calc(8px   * var(--ui));
  /* THE ONE SUB SCALE VALUE, and it is named so that it is countable.
     ZD_HAIR is not spacing, it is RHYTHM: the vertical padding inside a
     data row, the inset of a switch knob. A 15 px line in an 11 px face
     wants 2 px above and below it and 4 px is a different table. Rule
     weight is the same kind of exception and takes 1 px or 2 px only.
     Everything that is actually SPACING - the distance between two
     objects - is on 4 / 8 / 12 / 16 / 24 with no exceptions. */
  --zd-hair:     calc(2px   * var(--ui));

  /* THE BLEED. The fore edge stain that is the focus signal. A live
     setting; 4dp is the shipped value. */
  --zd-bleed:    calc(4px * var(--ui));
  --zd-track:    0.09em;

  /* RADIUS: graphite's, unmodified. Radius encodes how much the object
     can move and nesting halves it. Free under fb_rrect. */
  --zd-r-bolt:   0px;
  --zd-r-plate:  calc(10px * var(--ui));
  --zd-r-inset:  calc(5px  * var(--ui));
  --zd-r-chip:   calc(3px  * var(--ui));

  /* TYPE: three sizes, because fb.c bakes three atlases and there is no
     runtime rasteriser. SM 11 / MD 13 / LG 21. Zero upscaling. */
  --fs-sm:  calc(11px * var(--ui));
  --fs-md:  calc(13px * var(--ui));
  --fs-lg:  calc(21px * var(--ui));
  --lh-sm:  calc(15px * var(--ui));
  --lh-md:  calc(18px * var(--ui));
  --lh-lg:  calc(24px * var(--ui));

  /* MOTION. Graphite's three durations for travel, PLATE's CUT for the
     press. ZD_MS_PRESS is 0 and is not a typo. */
  --ms-press:  0ms;
  --ms-rise:   90ms;
  --ms-travel: 160ms;
  --ms-settle: 240ms;
  --ease: cubic-bezier(0.200, 0.850, 0.300, 1.000);

  --sans: ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif;
  --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
}

/* ======================================================================
   design.h - THE DERIVED LADDER, work light.

   DERIVED, NOT INVERTED, AND DERIVED IN THE LADDER'S OWN CURRENCY.
   graphite is denominated entirely in dL*: BASE to its load bearing edge
   ZD_LIT is 19.79 dL* and one adjacent step is 2.78 dL*. So the paper
   ladder is built by MIRRORING THOSE OFFSETS, not by picking pleasant
   near whites:

     ZD_LIT is the ceiling. #FFFFFC, L* 99.93, and there is nothing above
     it. Fixing the ceiling fixes the plate: ZD_BASE is placed exactly
     19.79 dL* below it, at L* 80.07, and every other surface is placed at
     graphite's own offset from there. That is why the plate is card stock
     and not printer paper - a white plate has no headroom, and a ladder
     with no headroom is not the same ladder.

   THIS WAS THE FIRST VERSION'S ONE REAL DEFECT. It anchored ZD_BASE at
   L* 91.43, which left the struck edge 8.50 dL* of room instead of 19.79.
   Measured consequences, all three now gone:

     LIT on BASE       1.241:1  ->  1.696:1   the struck edge exists again
     CUT on BASE       1.831:1  ->  1.326:1   the score is subliminal again
     ZD_INK on ZD_CUT  3.167:1  ->  3.708:1   the tightest number in the
                                              file, and it was the fore
                                              edge bleed's own ground

   Every text and state token is now placed by its graphite CONTRAST, not
   by eye: text 0/1/2/3 land on 11.92 / 9.38 / 6.79 / 5.45 against
   graphite's 11.92 / 9.35 / 6.84 / 5.45, and no token is defined in one
   mode only.

   ZD_INK IS THE ONLY TOKEN WHOSE ROLE DOES NOT CHANGE BETWEEN THE TWO
   LADDERS, and that is the strongest evidence that the resolution is
   real. Every surface token swaps which direction it points, because a
   surface is defined by the light. The ink is not defined by the light -
   it is a pigment lying on top - so it is dark on paper and light on
   graphite for exactly the same reason a printer's ink is.
   Re picked, not lightened: #FF6A45 falls to 1.75:1 on paper and would be
   unreadable. #9C1400 is the same hue family, LCh h 41.8 against 41.7,
   and computes 4.918:1 on ZD_BASE against graphite's 4.899:1.

   WHAT THE LIGHT LADDER STILL LOSES, said plainly and not hidden:
     - the top 2.1 dL* of the struck edge. Parity in dL* is exact, parity
       in RATIO is not: the same 19.79 dL* buys 1.696:1 on paper against
       1.993:1 on graphite, because contrast ratio is not linear in L*.
       The struck edge is a real cue again; it is not quite as loud.
     - the wash inverts which way it helps. On graphite the title band is
       lighter than the plate and text contrast FALLS into it, 4.89:1 for
       ZD_TEXT_2. On paper the band is also lighter and text contrast
       RISES into it, 8.98:1. Same light, same direction, opposite effect
       on the type, and nothing can be done about that.
     - the state colours cost chroma. Holding graphite's ratios exactly
       would put ZD_OK and ZD_WARN both near L* 26, where a 7 px dot is
       just a dark dot. They are placed at 5.12:1 and 4.76:1 instead, hue
       separated, which is above the 4.50 floor and below graphite's 6.31.
   ====================================================================== */
:root[data-theme="light"] {
  --zd-cut:        #B4AC9C;   /* L* 70.60   1.326:1 under BASE */
  --zd-well:       #BAB2A4;   /* L* 72.87   1.237:1 */
  --zd-void:       #C1BAAE;   /* L* 75.77   1.134:1 */
  --zd-base:       #CCC6BB;   /* L* 80.07   the plate            */
  --zd-raise:      #D3CEC4;   /* L* 82.90   1.084:1 over BASE    */
  --zd-float:      #D9D4CC;   /* L* 85.10   1.152:1 */
  --zd-litsoft:    #E7E5DF;   /* L* 90.94   1.348:1  grazed left */
  --zd-lit:        #FFFFFC;   /* L* 99.93   1.696:1  struck top  */
  --zd-edge-over:  #675F54;   /* L* 40.75   3.700:1  the occluder, darker */
  --zd-wash:       #DAE5E6;   /* L* 90.16   1.321:1 */

  --zd-ink:        #9C1400;   /* 4.918:1 on BASE, 3.708:1 on CUT, h 41.8 */
  --zd-ink-br:     #731300;   /* 6.785:1, the ink dragged */

  --zd-steel:      #004368;   /* 6.173:1, the light */
  --zd-steel-br:   #002D47;   /* 8.431:1 */

  --zd-text-0:     #0B0502;   /* 11.924:1 */
  --zd-text-1:     #26211D;   /*  9.382:1 */
  --zd-text-2:     #3F3830;   /*  6.794:1 */
  --zd-text-3:     #494239;   /*  5.827:1 on BASE, and 4.709:1 on ZD_WELL, which
                                  is where the instrument bar puts it. Graphite's
                                  5.452 would have read 4.41 there - the paper
                                  ladder's steps are not the same size in RATIO
                                  even when they are the same size in dL*, so the
                                  label tier is set by its WORST real ground. */
  --zd-text-inert: #867F74;   /*  2.332:1, structure, never running text */

  --zd-reverse:    #F8F5EF;   /* 7.678:1 on ink, 9.636:1 on steel */

  /* the three that CARRY TEXT are set by ZD_WELL, not by ZD_BASE, because
     a sunken field is where a state word actually appears - the lock's
     passphrase row put ZD_OK on ZD_WELL at 4.13:1 and nothing else caught
     it. ZD_BAD is a FILL and is held at graphite's 4.23:1. */
  --zd-ok:         #00511D;   /* 5.633:1 on BASE, 4.553:1 on WELL */
  --zd-warn:       #6E3600;   /* 5.643:1 on BASE, 4.561:1 on WELL */
  --zd-bad:        #A02E2B;   /* 4.233:1, a fill */
  --zd-bad-ink:    #90001D;   /* 5.610:1 on BASE, 4.534:1 on WELL */
}

/* ============================================================ reset == */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--zd-void); color: var(--zd-text-1);
  font-family: var(--sans); font-size: var(--fs-md); line-height: var(--lh-md);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--zd-steel); color: var(--zd-reverse); }

/* ============================================================= type ==
   Three sizes and no fourth. LABEL is the imported piece: uppercase,
   tracked, small, and it does STRUCTURAL work rather than decorative -
   every band, every column head and every key in a key/value pair is a
   LABEL, and nothing else in the document is uppercase. */
.t-sm  { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.t-md  { font-size: var(--fs-md); line-height: var(--lh-md); }
.t-lg  { font-size: var(--fs-lg); line-height: var(--lh-lg); font-variant-numeric: tabular-nums; }
.t-lab { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
         letter-spacing: var(--zd-track); color: var(--zd-text-3); white-space: nowrap; }
body.notrack .t-lab { letter-spacing: 0; }
/* mono is one size forever. Every figure the machine measured is set in
   it; everything a person wrote is proportional. Datum's face law, cheap
   half only, and it needs no atlas the build does not already bake. */
.t-num { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
         font-variant-numeric: tabular-nums; }
.ink0 { color: var(--zd-text-0); } .ink1 { color: var(--zd-text-1); }
.ink2 { color: var(--zd-text-2); } .ink3 { color: var(--zd-text-3); }
.inert { color: var(--zd-text-inert); }
.steel { color: var(--zd-steel); } .steelbr { color: var(--zd-steel-br); }
.verm  { color: var(--zd-ink); }
.k-ok { color: var(--zd-ok); } .k-warn { color: var(--zd-warn); } .k-bad { color: var(--zd-bad-ink); }
.bold { font-weight: 700; }
.spread { margin-left: auto; }

/* ==================================================== the strip bar ==
   NOT PART OF THE DESIGN. This is the prototype's own navigation and it
   is the only element on the page that is allowed to look like a web
   page. It is excluded from every measurement below. */
#strip {
  position: fixed; left: 0; right: 0; top: 0; height: calc(30px * var(--ui));
  background: var(--zd-well); color: var(--zd-text-2); z-index: 400;
  display: flex; align-items: center; gap:calc(16px * var(--ui));
  padding:0 calc(12px * var(--ui)); font-size: var(--fs-sm);
  border-bottom: 1px solid var(--zd-edge-over);
}
#strip .nm { color: var(--zd-text-1); font-weight: 700; text-transform: uppercase;
             letter-spacing: var(--zd-track); }
#strip .pitch { color: var(--zd-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#strip .links { display: flex; gap:calc(8px * var(--ui)); margin-left: auto; }
#strip .links a { color: var(--zd-text-2); text-decoration: none; }
#strip .links a.on { color: var(--zd-ink-br); }
#strip .links a:hover { color: var(--zd-text-0); }
#strip .thm { display: flex; gap:var(--zd-hair); align-items: center; }
#strip .tk { padding:var(--zd-hair) calc(8px * var(--ui)); cursor: pointer;
             border-radius: var(--zd-r-chip); color: var(--zd-text-2); }
#strip .tk.on { background: var(--zd-ink); color: var(--zd-reverse); }
#strip .hint { color: var(--zd-text-2); }

/* =============================================================== os == */
#os { position: fixed; left: 0; right: 0; top: calc(30px * var(--ui)); bottom: 0;
      display: flex; overflow: hidden; background: var(--zd-void); }

/* ============================================================= rail ==
   PLATE's numbered register on graphite's single rail. No bar, no dock,
   no taskbar: the register IS the launcher, the running list and the
   keymap, one list, reachable as Alt+NN. It touches no surface value, no
   radius and no boundary token, which is why it lifts off a light printed
   direction onto a dark machined one intact.

   ZD_R_BOLT, because the rail meets three screen edges and a radius
   against a screen edge is a lie about a shape that cannot be seen. */
#rail {
  width: var(--zd-rail-w); flex: 0 0 var(--zd-rail-w); background: var(--zd-raise);
  display: flex; flex-direction: column; position: relative; z-index: 60;
  border-right: 1px solid var(--zd-lit);
}
#rail .ident { padding:calc(12px * var(--ui)) var(--zd-pad) calc(8px * var(--ui)); }
#rail .ident .w { font-size: var(--fs-lg); line-height: var(--lh-lg); color: var(--zd-text-0); font-weight: 700; }
/* the internal hard rule, scored rather than printed: 1px cut over 1px
   grazed. Two fb_fill_px calls, no new token, and it obeys the light. */
.score { height: 2px; flex: 0 0 2px;
         background: linear-gradient(to bottom, var(--zd-cut) 0 1px, var(--zd-litsoft) 1px 2px); }
#rail .score { margin:calc(4px * var(--ui)) var(--zd-pad); }
#rail .sect { padding:calc(8px * var(--ui)) var(--zd-pad) calc(4px * var(--ui)); display: block; }
#reg { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
.slot { display: flex; align-items: center; gap:calc(8px * var(--ui));
        height: calc(26px * var(--ui)); padding: 0 0 0 var(--zd-pad); cursor: pointer;
        position: relative; color: var(--zd-text-3); }
/* ZD_TEXT_INERT IS 2.35:1 AND IT IS NOT A TEXT COLOUR. It is hairlines,
   grips, the sparkline baseline and disabled menu items. Four call sites
   were using it for RUNNING TEXT - the rail register numerals, the
   unfocused title's numeral, the editor gutter and the measured legend -
   and they audited at 1.93:1 to 2.64:1 against a 4.50 floor. They are on
   ZD_TEXT_3 and ZD_TEXT_2 now. The recessive/running/active hierarchy is
   unchanged, it is just 5.45 / 6.84 / 11.92 instead of 2.35 / 6.84 / 11.92. */
.slot .n { font-family: var(--mono); font-size: var(--fs-sm); font-variant-numeric: tabular-nums;
           color: var(--zd-text-3); }
.slot .nm { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: var(--zd-track);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.notrack .slot .nm { letter-spacing: 0; }
.slot:hover { background: var(--zd-float); }
.slot.run .n  { color: var(--zd-text-2); }
.slot.run .nm { color: var(--zd-text-1); }
.slot.act .n  { color: var(--zd-text-0); }
.slot.act .nm { color: var(--zd-text-0); font-weight: 700; }
/* THE RUN MARK. A running app gets a 2dp achromatic tick on the rail's
   inner edge. The app owning the FOCUSED window gets the full slot height
   at ZD_BLEED wide in ZD_INK - the same ink, the same width and the same
   edge as the window's own fore edge bleed, so the rail and the plate are
   plainly the same mark seen twice. */
.slot .tick { position: absolute; right: 0; width: calc(2px * var(--ui));
              height: calc(14px * var(--ui)); background: var(--zd-text-2);
              top: 50%; transform: translateY(-50%);
              transition: height var(--ms-press), width var(--ms-press), background var(--ms-press); }
.slot.act .tick { height: 100%; width: var(--zd-bleed); background: var(--zd-ink); }
#rail .wsrow { display: flex; gap:calc(4px * var(--ui)); padding:var(--zd-hair) var(--zd-pad); }
.wsb { flex: 1; height: calc(22px * var(--ui)); background: var(--zd-base);
       border: 1px solid var(--zd-cut); border-top-color: var(--zd-lit);
       border-radius: var(--zd-r-inset); display: flex; align-items: center;
       justify-content: center; cursor: pointer; }
.wsb.on { background: var(--zd-steel); border-color: var(--zd-steel); }
.wsb.on .t-num { color: var(--zd-reverse); }
#rail .stat { padding:calc(4px * var(--ui)) var(--zd-pad); }
.strow { display: flex; align-items: center; gap:calc(8px * var(--ui)); height: calc(20px * var(--ui)); }
.strow svg { flex: 0 0 auto; }
.strow .w { margin-left: auto; font-family: var(--mono); font-size: var(--fs-sm); }
#rail .clock { padding:calc(8px * var(--ui)) var(--zd-pad) calc(12px * var(--ui)); }
#rail .clock .hm { font-size: var(--fs-lg); line-height: var(--lh-lg); color: var(--zd-text-0);
                   font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============================================================ field == */
#fieldwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

/* THE RASTER STRIP - Datum's, with its clock re-derived. It advances one
   column PER COMPOSITE, never per vblank. On an idle machine it is still,
   and a still strip is information: it says nothing damaged. Datum's own
   version costs 215,993 composite wakeups an hour at rest, which is the
   exact standing tax Datum deleted ZD_MS_PULSE to avoid. */
#raster { height: var(--zd-strip-h); flex: 0 0 var(--zd-strip-h); background: var(--zd-well);
          display: flex; align-items: stretch; position: relative; overflow: hidden;
          border-bottom: 2px solid var(--zd-cut); }
#raster .lbl { position: absolute; left: calc(8px * var(--ui)); top: 50%;
               transform: translateY(-50%); z-index: 2; pointer-events: none; }
#raster .rd { position: absolute; right: calc(8px * var(--ui)); top: 50%;
              transform: translateY(-50%); z-index: 2; pointer-events: none;
              display: flex; gap:calc(12px * var(--ui)); align-items: baseline; }
#rcanvas { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }

#field { flex: 1; position: relative; overflow: hidden; background: var(--zd-void); }
/* THE WALLPAPER IS ONE CALL. fb_glow(-w/8, -h/6, w*11/8, h*11/8, LITSOFT,
   26, 0, 100): a single raking light entering from off screen upper left
   and falling to ZD_VOID at the lower right. Nine layers become one and
   the light is the identity rather than a texture. */
#field::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 130% at -8% -12%,
              color-mix(in srgb, var(--zd-litsoft) 62%, transparent) 0%,
              color-mix(in srgb, var(--zd-litsoft) 22%, transparent) 34%,
              transparent 72%); }
#gridsvg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; }
#legend { position: absolute; left: calc(24px * var(--ui)); bottom: calc(4px * var(--ui));
          z-index: 1; pointer-events: none; }
#wins { position: absolute; inset: 0; z-index: 2; }

/* ============================================================= foot ==
   PLATE's printer's slug and Datum's memory map ruler share one band.
   That is the whole saving: two instrumentation positions from two
   directions, 48dp of permanent chrome between them instead of 66dp,
   because both are mono text about the machine and neither needs a
   surface of its own. */
#foot { flex: 0 0 auto; background: var(--zd-raise); border-top: 1px solid var(--zd-lit); }
#slug { height: var(--zd-slug-h); display: flex; align-items: center;
        gap:calc(12px * var(--ui)); padding: 0 var(--zd-pad); overflow: hidden; }
#slug .line { color: var(--zd-text-3); white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; font-family: var(--mono); font-size: var(--fs-sm); }
#slug .mark { margin-left: auto; flex: 0 0 auto; display: flex; cursor: pointer;
              align-items: center; gap:calc(8px * var(--ui)); }
#ruler { height: var(--zd-ruler-h); display: flex; align-items: center;
         gap:calc(12px * var(--ui)); padding: 0 var(--zd-pad); }
#rulerbar { flex: 1; height: calc(10px * var(--ui)); display: flex; background: var(--zd-well);
            border-radius: var(--zd-r-chip); overflow: hidden; border: 1px solid var(--zd-cut); }
#rulerbar span { display: block; height: 100%; }

/* =========================================================== window ==
   THE SEAT RECIPE, from graphite, unmodified and load bearing:
     1  fb_rrect(x, y, w, h, r, ring)                   the groove ring
     2  fb_rrect(x+1, y+1, w-2, h-2, r-1, surface)      the object
     3  fb_fill_px(x+r, y, w-2r, 1, ZD_LIT)             the struck top
     4  fb_fill_px(x, y+r, 1, h-2r, ZD_LITSOFT)         the grazed left
   Bottom and right stay ZD_CUT. ring is ZD_EDGE_OVER when this plate lies
   over another plate and ZD_CUT otherwise: the border you can see is
   drawn by the occluder, never by the occluded.

   NOTHING IN THE FOCUS PATH TOUCHES ANY OF THOSE FOUR CALLS. That is the
   entire content of resolution 2. */
.win {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  background: var(--zd-base); border-radius: var(--zd-r-plate);
  border: 1px solid var(--zd-cut);
  transition: border-color var(--ms-rise) var(--ease);
}
.win::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; z-index: 5;
  box-shadow: inset 0 1px 0 0 var(--zd-lit), inset 1px 0 0 0 var(--zd-litsoft); }
.win.over { border-color: var(--zd-edge-over); }
.win.mini { display: none; }
.win.max { border-radius: var(--zd-r-bolt); }
/* NO DROP SHADOW ANYWHERE, INCLUDING ON DRAG. Graphite states that a dark
   ground costs the drag lift outright - Folio's one shadow buys 18.9 dL*
   of recession on paper and 8.7 dL* on dark stock - and then draws one
   anyway on .win.drag, on menus and on toasts. This file does not. A
   dragged plate is over every other plate by definition, so the occlusion
   rule already draws all four of its edges, and the ink goes to its bright
   twin. The cue is free and it is achromatic plus chromatic, not a veil. */
.win.drag { border-color: var(--zd-edge-over); }
.win.drag .bleed { background: var(--zd-ink-br); }

/* THE FORE EDGE BLEED. The focus signal, and the whole of it.
   A ZD_BLEED wide stain of ZD_INK running the full height of the plate
   between the corner arcs, on the RIGHT edge - the fore edge, the shadow
   side, the side that carries ZD_CUT at 1.332:1 and is the weakest
   boundary graphite owns. Printed OVER that groove.

   Why the right edge and not the left: the left edge carries ZD_LITSOFT,
   the grazed run, and the top carries ZD_LIT, the struck run. THE INK MAY
   COVER SHADOW AND MAY NEVER COVER LIGHT. Put the bleed on the left and
   the focused plate loses its grazed run; put it on the right and it
   covers a groove, which is a shadow, and a shadow with ink on it is
   still not a raised edge pretending to be a groove. Nothing inverts.

   It arrives at ZD_MS_PRESS 0. A press is instantaneous. */
.bleed { position: absolute; right: 0; top: var(--zd-r-plate); bottom: var(--zd-r-plate);
         width: var(--zd-bleed); background: transparent; z-index: 6; pointer-events: none;
         transition: background var(--ms-press); }
.win.focus .bleed { background: var(--zd-ink); }
body.nobleed .bleed { display: none; }

.tbar { height: var(--zd-title-h); flex: 0 0 var(--zd-title-h); display: flex;
        align-items: center; gap:calc(8px * var(--ui));
        padding:0 calc(8px * var(--ui)) 0 var(--zd-pad);
        cursor: default; position: relative; user-select: none; }
/* THE WASH, on every plate and not only the focused one. A horizontal
   ramp from ZD_WASH at the plate's lit corner to nothing at the right
   edge: the raking light entering the window. 1.400:1 on ZD_BASE, above
   every surface step and below the struck edge, so it reads as a step
   without outranking the light. It is not a knockout and must never
   become one. */
.tbar::before { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, var(--zd-wash) 0%,
              color-mix(in srgb, var(--zd-wash) 45%, transparent) 38%, transparent 78%); }
body.nowash .tbar::before { display: none; }
/* THE STRUCK RULE. The header's foot, 2px, and it never changes height.
   At rest it is a SCORE: 1px ZD_CUT over 1px ZD_LITSOFT, the same two
   tokens the seat recipe uses. Focused, ZD_INK is printed over both of
   them. The rule does not appear or disappear; it gets overprinted. */
.tbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  z-index: 2; pointer-events: none;
  background: linear-gradient(to bottom, var(--zd-cut) 0 1px, var(--zd-litsoft) 1px 2px);
  transition: background var(--ms-press); }
.win.focus .tbar::after { background: var(--zd-ink); }
.tbar > * { position: relative; z-index: 3; }
.tbar .reg { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-2); }
.win.focus .tbar .reg { color: var(--zd-text-0); }
.tbar .ttl { font-size: var(--fs-sm); font-weight: 700; text-transform: uppercase;
             letter-spacing: var(--zd-track); color: var(--zd-text-2);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.notrack .tbar .ttl { letter-spacing: 0; }
.win.focus .tbar .ttl { color: var(--zd-text-0); }
.tbar .sub { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-3);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* THE REGISTER MARK. A crosshair in a ring, 1px, 12dp, ZD_INK. PLATE's
   register mark is one of the four jobs its one structural ink is allowed
   to do, and it is the only one of the four that is a GRAPHIC rather than
   a fill. It sits at the head's fore end, on the same edge the bleed runs
   down, and it appears only when the plate is focused. 41 px. */
.tbar .rmark { flex: 0 0 auto; opacity: 0; transition: opacity var(--ms-press); }
.win.focus .tbar .rmark { opacity: 1; }
.tbar .ctl { display: flex; gap:calc(4px * var(--ui)); margin-left: auto; }
.cbtn { width: calc(20px * var(--ui)); height: calc(20px * var(--ui)); display: flex;
        align-items: center; justify-content: center; cursor: pointer;
        border-radius: var(--zd-r-chip); color: var(--zd-text-3); }
.cbtn:hover { background: var(--zd-raise); color: var(--zd-text-0); }
.cbtn.x:hover { background: var(--zd-ink); color: var(--zd-reverse); }
.cbtn:active { background: var(--zd-cut); }

/* THE KNOCKOUT, kept in the file as a switch and never as a default.
   Turning it on in settings does exactly what PLATE does: the header band
   goes to ZD_TEXT_0 and the title is knocked out of it in ZD_BASE. The
   settings pane then reads the four numbers off the running document. */
body.knock .win.focus .tbar { background: var(--zd-text-0); }
body.knock .win.focus .tbar::before { display: none; }
body.knock .win.focus .tbar::after { background: var(--zd-text-0); }
body.knock .win.focus .tbar .ttl { color: var(--zd-base); }
body.knock .win.focus .tbar .reg { color: var(--zd-well); }
body.knock .win.focus .tbar .sub { color: var(--zd-well); }
body.knock .win.focus .tbar .cbtn { color: var(--zd-well); }
body.knock .win.focus .bleed { background: transparent; }
body.knock .win.focus .tbar .rmark { opacity: 0; }

.wbody { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding:calc(8px * var(--ui)) var(--zd-pad) calc(8px * var(--ui));
         gap:calc(8px * var(--ui)); overflow: hidden; }
/* THE STATUS BAND, and Datum's per window app_us in it. Free rider: mono
   ink in a band every direction already draws. It costs exactly one real
   thing and it is not visual - wm.c measures app_us in AGGREGATE only, so
   per window attribution is new work. The stated fallback is the window's
   repaint_pixels in the same slot, same face, no layout change, and the
   settings pane switches between them so the fallback is something you
   can look at rather than a sentence. */
.sband { height: var(--zd-band-h); flex: 0 0 var(--zd-band-h);
         display: flex; align-items: center; gap:calc(12px * var(--ui));
         border-top: 1px solid var(--zd-cut); padding-top:var(--zd-hair); }
body.nous .sband .us { display: none; }
.grip { position: absolute; right: calc(2px * var(--ui)); bottom: calc(2px * var(--ui));
        width: calc(14px * var(--ui)); height: calc(14px * var(--ui)); cursor: nwse-resize; z-index: 7; }

/* ======================================================= primitives == */
.hr   { height: 1px; background: var(--zd-cut); flex: 0 0 1px; }
.row  { display: flex; align-items: center; gap:calc(8px * var(--ui)); }
.stack{ display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
/* SUNKEN: the seat recipe with the sign flipped. */
.well { background: var(--zd-well); border-radius: var(--zd-r-inset);
        box-shadow: inset 0 1px 0 0 var(--zd-cut), inset 1px 0 0 0 var(--zd-cut),
                    inset 0 -1px 0 0 var(--zd-litsoft); padding:calc(8px * var(--ui)) calc(8px * var(--ui)); }
/* RAISED, one nesting level in. */
.card { background: var(--zd-raise); border-radius: var(--zd-r-inset);
        border: 1px solid var(--zd-cut);
        box-shadow: inset 0 1px 0 0 var(--zd-lit), inset 1px 0 0 0 var(--zd-litsoft);
        padding:calc(8px * var(--ui)) calc(8px * var(--ui)); overflow: hidden; }
.btn { display: inline-flex; align-items: center; gap:calc(8px * var(--ui));
       height: calc(22px * var(--ui)); padding:0 calc(12px * var(--ui));
       background: var(--zd-raise); border: 1px solid var(--zd-cut);
       box-shadow: inset 0 1px 0 0 var(--zd-lit); border-radius: var(--zd-r-inset);
       cursor: pointer; color: var(--zd-text-2); white-space: nowrap; }
.btn:hover { color: var(--zd-text-0); border-color: var(--zd-edge-over); }
.btn:active { background: var(--zd-well); box-shadow: inset 0 1px 0 0 var(--zd-cut); }
/* THE ONE PRIMARY ACTION PER VIEW is an ink fill with the label reversed
   out of it at 6.49:1. PLATE's second accent job, kept whole. The ink
   never carries text; the text is a hole in the ink. */
.btn.prim { background: var(--zd-ink); border-color: var(--zd-ink); color: var(--zd-reverse);
            box-shadow: none; }
.btn.prim .t-lab { color: var(--zd-reverse); }
.btn.prim:hover { background: var(--zd-ink-br); border-color: var(--zd-ink-br); }
/* AND IT IS THE FOCUSED PLATE'S INK, NOT THE APP'S. Measured on the first
   render of #desktop: the UNFOCUSED terminal carried 2,055 ink px in its
   REBUILD button while the focused plate carried 3,848 in its own bounds.
   A caption in #overview says "the focused one carries the ink, the rest
   carry only the light" and that was simply false. An unfocused plate's
   primary action falls back to the ordinary raised recipe - it keeps its
   position and its label and loses only the pigment, because a primary
   action on a plate that does not have the keyboard is not primary yet. */
.win:not(.focus) .btn.prim,  .thumb:not(.on) .btn.prim,
.win:not(.focus) .btn.prim:hover { background: var(--zd-raise); border: 1px solid var(--zd-cut);
            box-shadow: inset 0 1px 0 0 var(--zd-lit); color: var(--zd-text-2); }
.win:not(.focus) .btn.prim .t-lab,
.thumb:not(.on) .btn.prim .t-lab { color: var(--zd-text-2); }
/* #overview clones a plate's body into a thumbnail, so the clone is no
   longer inside a .win and the rule above missed it. The overview's own
   caption reads "the focused one carries the ink, the rest carry only
   the light" and two of five cards were printing a vermilion button
   directly underneath it. */
/* TABLE-LAYOUT: FIXED, AND IT IS NOT A STYLE CHOICE. Under auto layout a
   percentage width on a th is a HINT: a nowrap cell whose min-content is
   wider wins, the table grows past 100 %, and .scroll's overflow-x:hidden
   silently slices the last column off. Measured on #desktop before the
   fix: 03 MONITOR's three tables overflowed their panes by 9 / 24 / 56
   px, and the 56 was the PER PLATE table, whose sliced column is INK -
   the one column this whole direction is about.
   It is also the honest primitive. fb.c has no auto table layout and
   never will; a framebuffer table renderer is handed column widths and
   ellipsises what does not fit, which is exactly what this now does. */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
/* CELL GUTTER 5 dp, DOWN FROM 8. Under fixed layout the gutter is real
   estate the data does not get: 03 MONITOR at 5 modules gives each of its
   tables 275 px and its four tables need 289 / 294 / 284 / 313 px of
   content. Six px per column of gutter was the difference between a
   readout and an ellipsis, and a dense machine table at 11 px does not
   need an 16 px trench between columns. */
th { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
     letter-spacing: var(--zd-track); color: var(--zd-text-3); font-weight: 400; text-align: left;
     padding:var(--zd-hair) calc(5px * var(--ui)); border-bottom: 1px solid var(--zd-cut);
     position: sticky; top: 0; background: var(--zd-base); }
body.notrack th { letter-spacing: 0; }
td { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
     color: var(--zd-text-2); padding:var(--zd-hair) calc(5px * var(--ui));
     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.r, th.r { text-align: right; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--zd-raise); color: var(--zd-text-1); }
/* SELECTION IS THE LIGHT, not the ink. A selected row is a surface with
   the light full on it; a focused window is a surface with ink on it.
   Two channels, two meanings, and they never collide. */
tr.sel td { background: var(--zd-steel); color: var(--zd-reverse); }
tr.sel td span { color: var(--zd-reverse) !important; }
.kv { display: flex; align-items: baseline; gap:calc(8px * var(--ui));
      min-height: calc(19px * var(--ui)); }
.kv .k { font-size: var(--fs-sm); line-height: var(--lh-sm); text-transform: uppercase;
         letter-spacing: var(--zd-track); color: var(--zd-text-3);
         width: calc(140px * var(--ui)); flex: 0 0 auto;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.notrack .kv .k { letter-spacing: 0; }
.kv .v { flex: 1; min-width: 0; font-family: var(--mono); font-size: var(--fs-sm);
         color: var(--zd-text-0); }
.meter { display: flex; align-items: center; gap:calc(8px * var(--ui)); height: calc(20px * var(--ui)); }
.meter .lb { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: var(--zd-track);
             color: var(--zd-text-3); width: calc(80px * var(--ui)); flex: 0 0 auto; }
body.notrack .meter .lb { letter-spacing: 0; }
.mtrack { flex: 1; height: calc(8px * var(--ui)); background: var(--zd-well); border-radius: 999px;
          box-shadow: inset 0 1px 0 0 var(--zd-cut); overflow: hidden; }
.mfill { height: 100%; background: var(--zd-steel); border-radius: 999px;
         transition: width var(--ms-settle) var(--ease); }
.mfill.warn { background: var(--zd-warn); } .mfill.bad { background: var(--zd-bad); }
.meter .vv { font-family: var(--mono); font-size: var(--fs-sm); color: var(--zd-text-0);
             width: calc(52px * var(--ui)); text-align: right; flex: 0 0 auto; }
.dot { width: calc(7px * var(--ui)); height: calc(7px * var(--ui)); border-radius: 999px;
       flex: 0 0 auto; }
/* THE STATE WORD BESIDE THE STATE COLOUR. Four characters of text next to
   the dot, in every one of the four parents. It is why the colour axis
   can be settled last without breaking anything upstream, and it is why
   ZD_INK can be the only saturated colour without state losing anything. */
.sw { display: inline-flex; align-items: center; gap:calc(4px * var(--ui)); }
.pre { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
       white-space: pre; color: var(--zd-text-2); }
.gut { font-family: var(--mono); font-size: var(--fs-sm); line-height: var(--lh-sm);
       color: var(--zd-text-3); text-align: right; padding-right:calc(8px * var(--ui));
       border-right: 1px solid var(--zd-cut); flex: 0 0 auto; }
.caret { display: inline-block; width: calc(7px * var(--ui)); height: calc(13px * var(--ui));
         background: var(--zd-steel); vertical-align: text-bottom; }
body.blink .caret { animation: bl 1s steps(1) infinite; }
@keyframes bl { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
.spark { display: block; max-width: 100%; }

/* ========================================================= overview == */
#overview { position: absolute; inset: 0; z-index: 200; display: none;
            background: var(--zd-cut); }
#overview.on { display: flex; flex-direction: column; }
#overview .ohead { display: flex; align-items: center; gap:calc(12px * var(--ui));
                   padding:var(--zd-pad) calc(16px * var(--ui)); }
#overview .ogrid { flex: 1; position: relative; margin:0 calc(16px * var(--ui)) calc(16px * var(--ui)); }
.thumb { position: absolute; background: var(--zd-base); border-radius: var(--zd-r-inset);
         border: 1px solid var(--zd-edge-over); overflow: hidden; cursor: pointer;
         box-shadow: inset 0 1px 0 0 var(--zd-lit); }
.thumb .tb { position: absolute; right: 0; top: 0; bottom: 0; width: var(--zd-bleed);
             background: transparent; z-index: 3; }
.thumb.on .tb { background: var(--zd-ink); }
.thumb .th { height: calc(20px * var(--ui)); display: flex; align-items: center;
             gap:calc(8px * var(--ui)); padding:0 calc(8px * var(--ui));
             border-bottom: 1px solid var(--zd-cut); }
.thumb.on .th { border-bottom-color: var(--zd-ink); }
.thumb .tc { position: absolute; inset: calc(20px * var(--ui)) 0 0 0; overflow: hidden;
             transform-origin: 0 0; pointer-events: none; }

/* ========================================================== palette == */
#palette { position: absolute; inset: 0; z-index: 260; display: none; }
#palette.on { display: block; }
#palette .scrim { position: absolute; inset: 0;
                  background: color-mix(in srgb, var(--zd-cut) 88%, transparent); }
#palette .sheet { position: absolute; left: 50%; top: calc(56px * var(--ui));
                  transform: translateX(-50%); width: calc(568px * var(--ui));
                  background: var(--zd-float); border-radius: var(--zd-r-plate);
                  border: 1px solid var(--zd-edge-over); overflow: hidden;
                  box-shadow: inset 0 1px 0 0 var(--zd-lit), inset 1px 0 0 0 var(--zd-litsoft); }
#palette .sheet .bleed { background: var(--zd-ink); }
#palette .ph { display: flex; align-items: center; gap:calc(12px * var(--ui));
               padding:calc(12px * var(--ui)) var(--zd-pad) calc(8px * var(--ui)); }
#palette .pin { display: flex; align-items: center; gap:calc(8px * var(--ui));
                margin:0 var(--zd-pad) calc(8px * var(--ui)); background: var(--zd-well);
                border-radius: var(--zd-r-inset); padding:calc(4px * var(--ui)) calc(8px * var(--ui));
                box-shadow: inset 0 1px 0 0 var(--zd-cut), inset 1px 0 0 0 var(--zd-cut); }
#presults { max-height: calc(288px * var(--ui)); overflow-y: auto; }
.prow { display: flex; align-items: center; gap:calc(12px * var(--ui));
        padding:calc(4px * var(--ui)) var(--zd-pad); cursor: pointer; }
.prow:hover { background: var(--zd-raise); }
.prow.on { background: var(--zd-steel); }
.prow.on * { color: var(--zd-reverse) !important; }
#palette .pf { display: flex; gap:calc(12px * var(--ui)); align-items: center;
               padding:calc(8px * var(--ui)) var(--zd-pad); border-top: 1px solid var(--zd-cut); }

/* ============================================================= lock == */
#lock { position: fixed; inset: 0; z-index: 320; display: none; background: var(--zd-cut); }
#lock.on { display: flex; align-items: center; justify-content: center; }
#lock::before { content: ''; position: absolute; inset: 0;
  background: radial-gradient(110% 120% at -6% -10%,

#locksvg { position: absolute; left: 0; top: 0; pointer-events: none; }
#lock .sheet { position: relative; width: calc(640px * var(--ui)); background: var(--zd-base);

               overflow: hidden;
               box-shadow: inset 0 1px 0 0 var(--zd-lit), inset 1px 0 0 0 var(--zd-litsoft); }

   The prose in its band says so, and this is what makes that true. */

#lock .sheet .tbar::after { background: var(--zd-ink); }

#lock .sheet .tbar .ttl { color: var(--zd-text-0); }
#lock .sheet .tbar .reg { color: var(--zd-text-0); }

.sband > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============================================================= menu == */
.menu { position: absolute; z-index: 300; display: none; min-width: calc(216px * var(--ui));
        background: var(--zd-float); border-radius: var(--zd-r-plate);
        border: 1px solid var(--zd-edge-over); padding:calc(4px * var(--ui)) 0;
        overflow: hidden;
        box-shadow: inset 0 1px 0 0 var(--zd-lit), inset 1px 0 0 0 var(--zd-litsoft); }

.menu .bleed { background: var(--zd-ink); top: 0; bottom: 0; }

      padding:calc(4px * var(--ui)) var(--zd-pad); cursor: pointer; color: var(--zd-text-1); }
.mi:hover { background: var(--zd-steel); color: var(--zd-reverse); }
.mi:hover .t-num, .mi:hover .t-lab { color: var(--zd-reverse); }
.mi.dis { color: var(--zd-text-inert); cursor: default; }
.mi.dis:hover { background: transparent; color: var(--zd-text-inert); }

#toasts { position: absolute; right: calc(16px * var(--ui)); bottom: calc(16px * var(--ui));

         padding:calc(8px * var(--ui)) var(--zd-pad); position: relative; overflow: hidden;

@keyframes rise { from { opacity: 0; transform: translateY(calc(4px * var(--ui))); } }
/* THE TOAST DOES NOT GET A FORE EDGE BLEED, AND IT USED TO.
   The bleed means one thing: this plate has the keyboard. The palette
   sheet and the menus keep it because they genuinely take focus while
   they are up. A toast never can - it is machine output, it cannot be
   typed into, and it dies on a timer. Printing the focus mark on it put
   a second 4 dp vermilion run on #desktop, six inches from the real one,
   saying the same thing about an object that could not be true of. That
   is the ink spent on decoration, and the ink is the only signal this
   direction has.

   struck top and grazed left inset, which is the occlusion rule saying
   "this lies over everything", which is the whole of what a toast is. */
.toast .bleed { display: none; }
body.nomo * { transition: none !important; animation: none !important; }

<script>
'use strict';
/* ======================================================================
 * STOCK - a living prototype of the zlOS desktop.
 *
 *   ground      graphite, warm, dark native, L* 18.15. Unedited.
 *   ladder      graphite's, unedited: 1.073 / 1.126 / 1.089 / 1.077 : 1
 *   depth       graphite's 1px struck edge and cut groove, three ranks
 *   boundary    ZD_EDGE_OVER, drawn by the occluder, never the occluded
 *   focus       NEW. A VERMILION OVERPRINT. Fore edge bleed, struck rule,
 *               register mark. 1.31 % of a plate in ink, 2.00 % total.
 *               Nothing in the ladder moves. Arrives at 0 ms.
 *   rail        PLATE's numbered register, 144dp, tracked LABEL type
 *   desk        PLATE's module grid, re-drawn as a scored emboss
 *   arrange     free floating, but every plate is anchored to a module
 *               index rather than to a pixel, so the whole desk reflows
 *   foot        PLATE's printer slug sharing a band with Datum's ruler
 *   instrument  Datum's, with the raster strip re-clocked to composite

const $  = (s, r) => (r || document).querySelector(s);

 * system window comes out of these functions at run time, against the
 * tokens as the browser resolved them, so a token edit moves the number
 * and a wrong claim cannot survive a reload.
 */
function tokHex(n) {
  let v = cs.getPropertyValue(n).trim();
  for (let i = 0; i < 4 && /^var\(/.test(v); i++)
    v = cs.getPropertyValue(v.slice(4, -1).trim()).trim();

}

  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}

  const x = relY(tokHex(a)), y = relY(tokHex(b));
  return ((Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05));

function r3(a, b) { return ratio(a, b).toFixed(3); }
/* CIE Lab and LCh. The CHROMA column is what makes this direction's
 * argument checkable rather than rhetorical: the ladder is denominated
 * entirely in dL*, so an event that spends its budget in dC* is spending
 * a currency the ladder does not use. */
function labOf(h) {
  const c = rgb(h).map(lin);
  const X = 0.4124564 * c[0] + 0.3575761 * c[1] + 0.1804375 * c[2];
  const Y = 0.2126729 * c[0] + 0.7151522 * c[1] + 0.0721750 * c[2];
  const Z = 0.0193339 * c[0] + 0.1191920 * c[1] + 0.9503041 * c[2];
  const f = t => t > 216 / 24389 ? Math.pow(t, 1 / 3) : (24389 / 27 * t + 16) / 116;
  const fx = f(X / 0.95047), fy = f(Y / 1.0), fz = f(Z / 1.08883);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];

function lstar(n) { return labOf(tokHex(n))[0].toFixed(2); }
function lnum(n)  { return labOf(tokHex(n))[0]; }
function chroma(n) { const L = labOf(tokHex(n)); return Math.sqrt(L[1] * L[1] + L[2] * L[2]); }
function cstar(n) { return chroma(n).toFixed(2); }
function hueOf(n) { const L = labOf(tokHex(n)); return ((Math.atan2(L[2], L[1]) * 180 / Math.PI) + 360) % 360; }
/* The ceiling on a DARKER boundary: the ratio pure black would reach
 * against this surface. On graphite it is the number that shuts the
 * downward direction. Computed, never quoted. */
function darkCeil(n) { return ((relY(tokHex(n)) + 0.05) / 0.05).toFixed(3); }
function liteCeil(n) { return (1.05 / (relY(tokHex(n)) + 0.05)).toFixed(3); }
function isLighter(a, b) { return relY(tokHex(a)) > relY(tokHex(b)); }

}
function TR(cells, attr) {
  return '<tr ' + (attr || '') + '>' + cells.map(c => {
    if (typeof c === 'object') return '<td class="' + (c.c || '') + '">' + c.t + '</td>';
    return '<td>' + esc(c) + '</td>';
  }).join('') + '</tr>';
}
function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function meter(lb, val, unit, kind) {
  return '<div class="meter"><span class="lb">' + lb + '</span><div class="mtrack">' +
    '<div class="mfill ' + (kind || '') + '" style="width:' + Math.max(0, Math.min(100, val)) + '%"></div>' +
    '</div><span class="vv">' + val.toFixed(1) + unit + '</span></div>';
}
function sw(w) {
  const m = { OK: 'ok', PASS: 'ok', UP: 'ok', RUN: 'ok', LISTEN: 'ok', ESTABLISHED: 'ok',
              WARN: 'warn', BOUND: 'warn', DRIFT: 'warn', RO: 'warn',
              FAIL: 'bad', DOWN: 'bad', Z: 'bad' };
  const k = m[w] || 'ok';
  const c = k === 'ok' ? 'var(--zd-ok)' : k === 'warn' ? 'var(--zd-warn)' : 'var(--zd-bad)';
  const ink = k === 'ok' ? 'k-ok' : k === 'warn' ? 'k-warn' : 'k-bad';
  return '<span class="sw"><span class="dot" style="background:' + c + '"></span>' +
    '<span class="t-num ' + ink + '">' + w + '</span></span>';
}
function spark(series, w, h, max, col) {
  const n = series.length, sw2 = w / n;
  let d = '';
  series.forEach((v, i) => {
    const bh = Math.max(1, Math.round((v / max) * (h - 1)));
    d += '<rect x="' + (i * sw2).toFixed(2) + '" y="' + (h - bh) + '" width="' +
      Math.max(1, sw2 - 0.6).toFixed(2) + '" height="' + bh + '" fill="' + col + '"/>';
  });
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" ' +
    'style="width:100%;height:' + h + 'px" shape-rendering="crispEdges" aria-hidden="true">' + d + '</svg>';
}
function usBand(id) {
  const w = S.wins[id]; if (!w) return '';
  const mode = S.cfg.us;
  if (mode === 'off') return '';
  const val = mode === 'measured'
    ? '<span class="t-num ink0">' + w.us + ' us</span>'
    : '<span class="t-num ink0">' + grp(w.px) + ' px</span>';
  return '<span class="us row" style="gap:calc(8px * var(--ui))">' +
    '<span class="t-lab">' + (mode === 'measured' ? 'app us' : 'repaint px') + '</span>' + val + '</span>';
}
function band(id, left) {
  return '<div class="sband"><span class="t-lab">' + APP[id].n + '</span>' +
    '<span class="t-num ink3">' + left + '</span>' + usBand(id) +
    '<span class="spread t-num ink3">ws ' + (S.wins[id] ? ('0' + S.wins[id].ws) : '01') + '</span></div>';
}
function head(lab, val, tail) {
  return '<div class="row" style="height:calc(22px * var(--ui))"><span class="t-lab">' + lab + '</span>' +
    '<span class="t-num ink1">' + val + '</span>' + (tail || '') + '</div>';
}

/* ========================================================= settings ===
 * Every control below changes something you can look at. Three of them
 * are the argument rather than a preference:
 *   THE KNOCKOUT   turns PLATE's focus signal on over graphite's ladder,
 *                  so the sign inversion is a thing you see rather than a
 *                  paragraph you read.
 *   LABEL TRACKING turns off the one import that costs a new primitive.
 *   OCCLUSION EDGE turns graphite's invented token off so the 1.332:1
 *                  failure it replaces is visible rather than described.
 */
function tog(label, key, note) {
  const on = S.cfg[key] === true;
  return '<div class="row" style="height:calc(26px * var(--ui));cursor:pointer" data-act="tog" data-arg="' + key + '">' +
    '<span class="btn" style="width:calc(38px * var(--ui));padding:0;justify-content:' +
    (on ? 'flex-end' : 'flex-start') + ';border-radius:999px;' +
    (on ? 'background:var(--zd-steel);border-color:var(--zd-steel)' : '') + '">' +
    '<span style="width:calc(16px * var(--ui));height:calc(16px * var(--ui));border-radius:999px;' +
    'background:var(--zd-' + (on ? 'reverse' : 'text-3') + ');margin:0 var(--zd-hair)"></span></span>' +
    '<span class="t-md ink1">' + label + '</span>' +
    '<span class="spread t-num ink3">' + note + '</span></div>';
}
function seg(label, key, opts) {
  return '<div class="row" style="height:calc(26px * var(--ui))">' +
    '<span class="t-md ink1" style="width:calc(154px * var(--ui))">' + label + '</span>' +
    '<span class="row" style="gap:calc(4px * var(--ui))">' + opts.map(o =>
      '<span class="btn' + (S.cfg[key] === o ? ' prim' : '') + '" data-act="seg" data-arg="' + key + ':' + o + '">' +
      '<span class="t-num">' + o + '</span></span>').join('') + '</span></div>';

function slider(label, key, lo, hi, unit) {
  const pct = ((S.cfg[key] - lo) / (hi - lo)) * 100;
  return '<div class="row" style="height:calc(26px * var(--ui))">' +
    '<span class="t-md ink1" style="width:calc(154px * var(--ui))">' + label + '</span>' +
    '<div class="mtrack" style="height:calc(10px * var(--ui));cursor:pointer" data-slider="' + key +
    '" data-lo="' + lo + '" data-hi="' + hi + '">' +
    '<div class="mfill" style="width:' + pct + '%"></div></div>' +
    '<span class="t-num ink0" style="width:calc(64px * var(--ui));text-align:right">' +
    S.cfg[key] + unit + '</span></div>';
}

/* THE FOCUS ACCOUNTING, computed on the canonical plate deciding.md used
 * for PLATE and for Raking, so the three numbers are actually comparable
 * rather than three numbers about three different windows. */
function focusPx() {
  const W = CANON.w, H = CANON.h, r = CANON.r, T = CANON.t, B = S.cfg.bleed;
  const bleed = B * (H - 2 * r);
  const rule  = 2 * (W - 2 - B);
  const mark  = RMARK_PX;
  const regNo = 2 * 8 * 16;          /* two mono cells, counted at full cell area */
  const title = 9 * 8 * 16;          /* nine proportional cells, upper bound */
  const ink   = bleed + rule + mark;
  const wash  = (W - 2) * (T - 1) - B * (T - 1);
  return { W: W, H: H, T: T, B: B, area: W * H,
           bleed: bleed, rule: rule, mark: mark, regNo: regNo, title: title,
           ink: ink, text: regNo + title, total: ink + regNo + title, wash: wash,
           knock28: W * T, knock56: W * 56 };
}
function pc(n, area) { return (100 * n / area).toFixed(3) + ' %'; }

             w: g.xs[w.mc[2]] - g.xs[w.mc[0]] - 2,
             h: g.ys[w.mc[3]] - g.ys[w.mc[1]] - 2 };
  }
  return { x: w.x, y: w.y, w: w.w, h: w.h };
}

/* ====================================================== window mgmt ===
 * wm.c is mechanically unchanged from graphite: floating, draggable,
 * resizable, z ordered, per window surface cache. Two rules are added and
 * both are risks the parents named and did not fix.
 *   1  THE RAIL MUST NEVER BE COVERED. wm.c has no reserved strut api, so
 *      wm_open and drag clamp to the field. With no top bar and no dock
 *      the rail is the only route to every system function.
 *   2  OVERLAP IS COMPUTED, because the occluder draws the border.
 */
function openWin(id, mrect, ws) {
  const a = APP[id];
  if (S.wins[id]) { focusWin(id); return; }
  const m = mrect || a.m;
  const g = gridGeom();
  S.wins[id] = { id: id, mc: [m[0], m[1], m[2], m[3]],
                 x: g.xs[m[0]], y: g.ys[m[1]],
                 w: g.xs[m[2]] - g.xs[m[0]] - 2, h: g.ys[m[3]] - g.ys[m[1]] - 2,
                 ws: ws || S.ws,
                 min: false, max: false, z: ++ZT,
                 us: 340 + ((id.charCodeAt(0) * 37) % 900),
                 px: 40000 + ((id.charCodeAt(0) * 5417) % 260000) };
  buildWin(id); focusWin(id); layout();
}
function closeWin(id) {
  const e = $('.win[data-id="' + id + '"]'); if (e) e.remove();
  delete S.wins[id];
  if (S.focus === id) {
    const rest = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min);
    S.focus = rest.length ? rest.sort((a, b) => S.wins[b].z - S.wins[a].z)[0] : null;
  }
  renderRail(); layout(); damage();
}
function focusWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].z = ++ZT; S.wins[id].min = false; S.focus = id;
  layout(); renderRail(); renderSlug(); damage();
}
function minWin(id) {
  if (!S.wins[id]) return;
  S.wins[id].min = true;
  if (S.focus === id) S.focus = null;
  layout(); renderRail(); damage();
  toast('minimised', APP[id].n + ' ' + APP[id].name + ' travels to its register slot in ' +
    'TRAVEL 160 ms. the ink leaves at PRESS 0, because it is not travelling, it is lifting');
}
function maxWin(id) {
  const w = S.wins[id]; if (!w) return;
  if (w.max) { w.max = false; }
  else { w.pre = [w.x, w.y, w.w, w.h]; w.max = true; }
  focusWin(id);
}
function buildWin(id) {
  const a = APP[id];
  const e = document.createElement('div');
  e.className = 'win'; e.setAttribute('data-id', id);
  e.innerHTML =
    '<div class="tbar" data-drag="1">' +
    '<span class="reg">' + a.n + '</span>' +
    '<span class="ttl">' + a.name + '</span>' +
    '<span class="sub">' + a.sub + '</span>' +
    regmark(12) +
    '<span class="ctl">' +
    '<span class="cbtn" data-wa="min" title="minimise"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9 H10"/></svg></span>' +
    '<span class="cbtn" data-wa="max" title="maximise"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="8" height="8"/></svg></span>' +
    '<span class="cbtn x" data-wa="close" title="close"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5"/></svg></span>' +
    '</span></div><div class="wbody"></div>' +
    '<span class="bleed"></span>' +
    '<svg class="grip" viewBox="0 0 14 14" fill="none" stroke="var(--zd-text-inert)" stroke-width="1.2">' +
    '<path d="M13 5 L5 13 M13 9 L9 13 M13 1 L1 13"/></svg>';
  $('#wins').appendChild(e);
  redraw(id);
}
function redraw(id) {
  const e = $('.win[data-id="' + id + '"]'); if (!e) return;
  const f = R[id] || (() => '<div class="well"><span class="pre ink2">no renderer</span></div>');
  $('.wbody', e).innerHTML = f();
}
function redrawAll() { Object.keys(S.wins).forEach(redraw); }
function overlaps(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
}
function layout() {
  const field = $('#field'), fw = field.clientWidth, fh = field.clientHeight;
  const list = Object.keys(S.wins).map(k => S.wins[k])
    .filter(w => w.ws === S.ws).sort((a, b) => a.z - b.z);
  Object.keys(S.wins).forEach(id => {
    const w = S.wins[id], e = $('.win[data-id="' + id + '"]');
    if (!e) return;
    if (w.ws !== S.ws || w.min) { e.style.display = 'none'; return; }
    e.style.display = '';
    const rc = rectOf(w);
    if (!w.max) { w.x = rc.x; w.y = rc.y; w.w = rc.w; w.h = rc.h; }
    let x = rc.x, y = rc.y, ww = rc.w, hh = rc.h;
    if (w.max) { x = 0; y = 0; ww = fw; hh = fh; }
    x = Math.max(0, Math.min(x, Math.max(0, fw - 120)));
    y = Math.max(0, Math.min(y, Math.max(0, fh - 60)));
    ww = Math.min(ww, fw); hh = Math.min(hh, fh);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.width = ww + 'px'; e.style.height = hh + 'px';
    e.style.zIndex = w.z;
    e.classList.toggle('focus', S.focus === id);
    e.classList.toggle('max', !!w.max);
    const me = { x: x, y: y, w: ww, h: hh };
    let over = false;
    if (S.cfg.over) {
      for (let i = 0; i < list.length; i++) {
        const o = list[i]; if (o.id === id || o.z >= w.z) continue;
        const oe = $('.win[data-id="' + o.id + '"]'); if (!oe || oe.style.display === 'none') continue;
        if (overlaps(me, { x: oe.offsetLeft, y: oe.offsetTop, w: oe.offsetWidth, h: oe.offsetHeight })) { over = true; break; }
      }
    }
    e.classList.toggle('over', over);
  });
}

/* ====================================================== raster strip ==
 * Datum's, re-clocked. One column per composite, never per vblank.
 */
function damage(n) {
  const k = n || 1;
  for (let i = 0; i < k; i++) {
    S.composites++;
    S.raster.push({ us: 5200 + Math.round(Math.random() * 7000) });
  }
  if (S.raster.length > 900) S.raster.splice(0, S.raster.length - 900);
  drawRaster();
}
function drawRaster() {
  const c = $('#rcanvas'), p = c.parentElement;
  const w = p.clientWidth, h = p.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const budget = 16667;
  const steel = tokHex('--zd-steel'), warn = tokHex('--zd-warn'), inert = tokHex('--zd-text-inert');
  const x0 = 82, x1 = w - 460, span = Math.max(10, x1 - x0);
  const n = Math.min(S.raster.length, Math.floor(span / 3));
  const start = S.raster.length - n;
  for (let i = 0; i < n; i++) {
    const s = S.raster[start + i];
    const bh = Math.max(1, Math.round((s.us / budget) * (h - 6)));
    g.fillStyle = s.us > budget * 0.85 ? warn : steel;
    g.fillRect(x0 + i * 3, h - 3 - bh, 1, bh);
  }
  g.fillStyle = inert;
  g.fillRect(x0, h - 3, span, 1);
  const rd = $('#rasterrd');
  const idleH = S.cfg.rasterClock === 'frame' ? '215,993' : '0';
  rd.innerHTML = '<span class="t-lab">advance</span>' +
    '<span class="t-num ink0">' + S.cfg.rasterClock + '</span>' +
    '<span class="t-lab">idle wakeups/h</span>' +
    '<span class="t-num ' + (S.cfg.rasterClock === 'frame' ? 'k-warn' : 'ink0') + '">' + idleH + '</span>' +
    '<span class="t-lab">budget</span><span class="t-num ink3">16 667 us</span>';
}

/* ========================================================= overview == */
function ovOn() { return $('#overview').classList.contains('on'); }
function showOverview(on) {
  $('#overview').classList.toggle('on', on);
  if (!on) return;
  const g = $('#ogrid'), gw = g.clientWidth || 1200, gh = g.clientHeight || 600;
  const list = Object.keys(S.wins).map(k => S.wins[k])
    .filter(w => w.ws === S.ws && !w.min).sort((a, b) => b.z - a.z);
  const cols = Math.min(3, Math.max(1, list.length));
  const rows = Math.ceil(list.length / cols) || 1;
  const cw = (gw - (cols - 1) * 16) / cols, ch = (gh - (rows - 1) * 16) / rows;
  g.innerHTML = list.map((w, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    return '<div class="thumb' + (S.focus === w.id ? ' on' : '') + '" data-act="ovpick" data-arg="' + w.id +
      '" style="left:' + (c * (cw + 16)) + 'px;top:' + (r * (ch + 16)) + 'px;width:' + cw + 'px;height:' + ch + 'px">' +
      '<div class="th"><span class="t-num ink3">' + APP[w.id].n + '</span>' +
      '<span class="t-lab" style="color:var(--zd-' + (S.focus === w.id ? 'text-0' : 'text-2') + ')">' +
      APP[w.id].name + '</span>' +
      '<span class="spread t-num ink3">' + w.w + ' x ' + w.h + '</span></div>' +
      '<span class="tb"></span>' +
      '<div class="tc" data-src="' + w.id + '"></div></div>';
  }).join('');
  list.forEach(w => {
    const holder = $('.tc[data-src="' + w.id + '"]', g);
    const src = $('.win[data-id="' + w.id + '"] .wbody');
    if (!holder || !src) return;
    /* THE THUMBNAIL WAS CLIPPED BEFORE IT WAS SCALED, WHICH IS BACKWARDS.
       .tc is positioned to the tile's own width and carries overflow
       hidden. The clone was set to the WINDOW's width and dropped inside
       it, so the browser cropped it to the tile first and the transform
       then shrank the crop: measured, 03 MONITOR lost 125 px off its
       right edge, 13 REGISTERS and 05 KERNEL LOG lost 239 and 238, and
       every tile drew a cropped picture two thirds the width of the card
       it sat in, with dead plate beside it.
       The holder now takes the CLONE's size, so the scale is what clips,
       and it fits both axes so the whole plate is in the card. .thumb's
       own overflow:hidden still contains any rounding overshoot. */
    const box = holder.parentElement;
    const th = 20 * (parseFloat(cs.getPropertyValue('--ui')) || 1);
    const cw2 = w.w, ch2 = w.h - 28;
    const sc = Math.min(box.clientWidth / cw2, Math.max(0, box.clientHeight - th) / ch2);
    const clone = src.cloneNode(true);
    clone.style.width = cw2 + 'px'; clone.style.height = ch2 + 'px';
    holder.style.width = cw2 + 'px'; holder.style.height = ch2 + 'px';
    /* fitting both axes leaves slack on one of them, because a card is not
       the plate's aspect. The slack goes below and to both sides, never
       above: the picture butts up under the card's own head the way a
       plate's body butts up under its title band, so the thumbnail reads
       as a small window rather than as a window floating in a frame.
       Centred vertically it looked like the body had come loose. */
    holder.style.left = (Math.max(0, (box.clientWidth - cw2 * sc) / 2)).toFixed(1) + 'px';
    holder.style.transform = 'scale(' + sc.toFixed(3) + ')';
    holder.appendChild(clone);
  });
}

/* ============================================================= tick == */
function walk(v, lo, hi, amp) {
  v += (Math.random() - 0.5) * amp;
  return Math.max(lo, Math.min(hi, v));
}
function clockStr() {
  const d = new Date(2026, 7, 26, 14, 32, 7 + S.t);
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function tick() {
  S.t++;
  S.cpu = S.cpu.map(v => walk(v, 2, 96, 14));
  S.mem = walk(S.mem, 30, 72, 3);

function setWs(n) {
  S.ws = n;
  const cur = Object.keys(S.wins).filter(k => S.wins[k].ws === n && !S.wins[k].min);
  S.focus = cur.length ? cur.sort((a, b) => S.wins[b].z - S.wins[a].z)[0] : null;
  layout(); renderRail(); renderSlug(); damage();

function tileAll() {
  const list = Object.keys(S.wins).filter(k => S.wins[k].ws === S.ws && !S.wins[k].min);
  const g = gridGeom();
  const cols = Math.ceil(Math.sqrt(list.length)) || 1;
  const rows = Math.ceil(list.length / cols) || 1;
  const cspan = Math.max(1, Math.floor(g.cols / cols)), rspan = Math.max(1, Math.floor(g.rows / rows));
  list.forEach((id, i) => {
    const w = S.wins[id];
    const c = (i % cols) * cspan, r = Math.floor(i / cols) * rspan;
    w.max = false;
    w.mc = [c, r, Math.min(g.cols, c + cspan), Math.min(g.rows, r + rspan)];
  });
  layout(); damage();
  toast('tiled onto the module grid', list.length + ' plates on whole modules, no overlap. every ' +
    'occlusion edge falls back to ZD_CUT because nothing is over anything, which is exactly when ' +
    'the rule is inert - and the ink is still on exactly one of them');
}
function calcKey(k) {
  if (S.calcVal === undefined) S.calcVal = 241690;
  if (k === '=') return;
  if ('0123456789'.indexOf(k) >= 0) { S.calcVal = (S.calcVal * 10 + parseInt(k, 10)) % 1000000000; return; }
  if (k === '+') S.calcVal += 1000;
  else if (k === '-') S.calcVal = Math.max(0, S.calcVal - 1000);
  else if (k === '*') S.calcVal = Math.min(999999999, S.calcVal * 2);
  else if (k === '/') S.calcVal = Math.floor(S.calcVal / 2);
}

function startDrag(ev, id) {
  const w = S.wins[id]; if (!w || w.max) return;
  const e = $('.win[data-id="' + id + '"]');
  const ox = ev.clientX - e.offsetLeft, oy = ev.clientY - e.offsetTop;
  e.classList.add('drag');
  const spanC = w.mc ? w.mc[2] - w.mc[0] : 0, spanR = w.mc ? w.mc[3] - w.mc[1] : 0;
  function mv(m) { w.mc = null; w.x = m.clientX - ox; w.y = m.clientY - oy; layout(); }
  function up() {
    e.classList.remove('drag');
    /* land on a module, keeping the span, so the plate rejoins the reflow.
       with snap off it stays where it was dropped and is pixel anchored
       from then on - which is PLATE's DETACHED state, arrived at by doing
       rather than by a menu item. */
    if (S.cfg.snap && spanC > 0) {
      const g = gridGeom();
      let c = Math.max(0, Math.min(g.cols - spanC, snapCol(w.x)));
      let r = Math.max(0, Math.min(g.rows - spanR, snapRow(w.y)));
      w.mc = [c, r, c + spanC, r + spanR];
    }
    layout();
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(4);
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startResize(ev, id) {
  const w = S.wins[id]; if (!w) return;
  w.max = false;
  const sx = ev.clientX, sy = ev.clientY, sw2 = w.w, sh = w.h;
  const c0 = w.mc ? w.mc[0] : 0, r0 = w.mc ? w.mc[1] : 0, was = !!w.mc;
  function mv(m) {
    w.mc = null;
    w.w = Math.max(280, sw2 + m.clientX - sx);
    w.h = Math.max(160, sh + m.clientY - sy);
    layout();
  }
  function up() {
    if (S.cfg.snap && was) {
      const g = gridGeom();
      const c1 = Math.max(c0 + 1, Math.min(g.cols, snapCol(w.x + w.w)));
      const r1 = Math.max(r0 + 1, Math.min(g.rows, snapRow(w.y + w.h)));
      w.mc = [c0, r0, c1, r1];
    }
    layout();
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
    damage(2);
  }
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
  ev.preventDefault();
}
function startSlider(ev, el) {
  const key = el.getAttribute('data-slider');
  const lo = +el.getAttribute('data-lo'), hi = +el.getAttribute('data-hi');
  function set(e) {
    const r = el.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));

  }

  function up() { document.removeEventListener('mousemove', set); document.removeEventListener('mouseup', up); damage(); }

}

  if ($('#palette').classList.contains('on')) {
    if (k === 'Escape') { showPalette(false); return; }

    if (k === 'ArrowUp') { S.psel = Math.max(0, S.psel - 1); renderPalette(); ev.preventDefault(); return; }
